name: Refresh feed

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch
        run: python scripts/fetch.py

      - name: Dedupe
        run: python scripts/dedupe.py

      - name: Panelize
        run: python scripts/panelize.py

      - name: Render
        run: python scripts/render.py

      - name: Commit and push updated feed
        run: |
          git config user.name "signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/index.html data/seen.json
          git diff --cached --quiet || git commit -m "Refresh feed"
          git push
