s, but that's just not how the world works at the level of fundamental physics. And he was talking long before quantum mechanics or quantum field theory. So some people say that quantum mechanics and the Born rule and wave function collapse undermine causality, but no, it was already not there."}, {"type": "text", "content": "1:46:10.0 SC: But that doesn't mean that all hell is breaking loose. It doesn't mean anything can happen. There are still laws of physics. It's just that the laws of physics do not take a kind of Aristotelian form. In an Aristotelian view, you might very well be tempted to say there's an acceleration and there's a force, and the force is the cause of the acceleration. But that's not what Newtonian mechanics says. Newtonian mechanics says the amount of force at any one time is equal to the mass of the object times the acceleration. Period. It doesn't say that one causes the other or anything like that. It doesn't say that force divided by acceleration causes mass. Okay? The word \"cause\" just doesn't appear. Sometimes in a book on relativity or quantum field theory, you will find a discussion of causality, but it's really not about causality in the usual Aristotelian sense. It's just a discussion of how signals travel inside light cones and not outside light cones. So they've repurposed the word \"causality\" to mean things move slower or equal to the speed of light."}, {"type": "text", "content": "1:47:17.1 SC: And all that's fine. Of course, notions that were introduced 2,500 years ago aren't necessarily gonna be the right way to talk about the world once you learn more about it. And also, of course, the notion of cause and effect is super useful and important in the macroscopic emergent world. There's a whole chapter in the new upcoming book on complexity and emergence, Volume 3 of The Biggest Ideas, where we talk about causation and we talk about Judea Pearl, former Mindscape guest, and his notion of the do-operator and its implementation in what are called Bayesian networks. So, of course there are causes and effects in the world, just like there's consciousness and free will and tables and chairs and temperatures and pressures. Okay? None of those exist at the fundamental level, but they're very real at the emergent level, and that's fine."}, {"type": "text", "content": "1:48:10.7 SC: Matt Patterson says, \"I'm an avid Mindscape follower, and I was intrigued by your discussion with Jenann Ismael on her and her philosophical argument about why it's okay to kill cows but not humans based on their value. Value in this case being measured by one's memory of one's life, having plans for one's future, as well as these same items in others that one has influenced, et cetera. For cows, this kind of value is essentially zero, and for humans it is much greater. It occurred to me that the value of individual humans can vary over a wide range and might even be negative, e.g., in the case of a serial killer. Given that thoughtful humans do decide to kill other humans, it seems that considering the value of those that would die might be one of those considerations in evaluating the moral rightness or wrongness in making such a decision. My question is, do you think that the value of potential death victims should be one of the considerations when assessing the morality of decisions to kill them, or is there some moral or other objection to this idea?\""}, {"type": "text", "content": "1:49:08.1 SC: Well, yeah, I think that there's a lot going on here, and we're not gonna give the definitive answer right now. I'm not even claiming to know what the definitive answer should be. Of course, in practice, when there are situations, hopefully it never arises for you, it has never arisen for me, but when there are situations in which you are deciding whether to kill somebody or not, there are considerations about what kind of person that is. Like, is this a person who just broke into your house and is threatening to kill your family? Then you might have some considerations. Is this a person who is waiting too long to go after the light turned green in front of you on the road? That's a different set of considerations, right?"}, {"type": "text", "content": "1:49:50.5 SC: So maybe your considerations are no one ever should be killed, there should be an absolute right to continued existence. And in terms of the criminal justice system, that would be my view. I do not believe in the death penalty. I don't think that people should be put to death. Mostly for me, that's a matter of practice rather than principle. I don't think that there is some metaphysical absolute right to be living. I think that it is extremely difficult to effectively figure out who doesn't deserve to be living and to carry that out. And certainly the actual government and the actual criminal justice system, I don't think is very good at that. And it's an irreversible decision, so I don't want them making it at all. So I just don't want there to be the death penalty."}, {"type": "text", "content": "1:50:35.7 SC: There are wars, and you might be against war, but maybe the other side is not against war and they invade you. What are you gonna do? You just gonna lie down, or are you gonna fight back? I'm in favor of fighting back if you get invaded. I think that we have far more wars than we should, but I'm not gonna pretend that I'm gonna have a principled moral point of view that says, \"I would just never participate in a war no matter what the circumstances were.\" And when you do participate in a war, there's absolutely considerations of you should try not to hurt civilians. There are other people who are enemy combatants, and that's a different story. And nevertheless, they also have some rights. People have thought about this a great deal. So I do think that all of these are complicated. And more importantly, it's okay to say that it's complicated. You don't need a simple once-and-for-all rule. You can understand that these are gray areas and try to do your best."}, {"type": "text", "content": "1:51:33.2 SC: Karoli Kanter says, \"How likely do you think it is that the observable universe is such a minuscule part of the total universe that our observations are just local phenomena and say little of use about the whole?\"\n\n1:51:46.8 SC: Well, I truly don't know whether our observable universe is a tiny fraction of the whole universe or is most or all of it. I'm very plausibly... I'm open to scenarios of either kind. This is, again, something I think we should be humble about. We should explore the different possibilities. I am skeptical of the worry that local phenomena allow us to say little of use about the whole. Even if the universe we see is only a tiny fraction of the whole, it's still pretty big, right? Hundreds of billions of galaxies, many millions, billions of light-years across, et cetera. And there is absolutely remarkably uniform behavior of the physical universe over this vast stretch of space and time. We can test that very quantitatively, right? We can use things like primordial nucleosynthesis and the current abundances of light elements in intergalactic space to say that things like the mass of the proton and the neutron and the charge of the electron were the same three minutes after the Big Bang as they are now to within a very tiny error bar. Likewise, those quantities and the laws of physics underlying them seem to be exactly the same in quasars billions of light-years away as they are now, et cetera., et cetera."}, {"type": "text", "content": "1:53:09.4 SC: So I think that given the uniformity of the laws that we observe in the universe that we do observe, it's perfectly reasonable to imagine that some kind of uniformity extends across the whole universe, no matter how big it is. That uniformity might not be simple. In other words, it might not just be, oh, the mass of the electron and the proton and neutron are exactly the same everywhere. Maybe that's true, maybe it's not. We have scenarios in which either one of those is correct. But even if the actual values of the parameters you measure differ from place to place, they can still be reflections of uniform underlying laws. It's just like water can be liquid or vapor or solid, right? It's just a different manifestation of the same underlying stuff."}, {"type": "text", "content": "1:53:56.5 SC: That might not be right. So it's conceivable that outside the universe we observe, there are laws or there are conditions that bear precisely no relationship to what we observe in the universe around us. But I would say, number one, there's no reason to think that. There's no empirical reason, there's no puzzle that we solve by imagining that's true. And number two, this uniformity that we do have observed gives us some credence that some kind of uniformity extends even further. So as to how big the universe is, I have no idea. As to how much we learn about it by studying the little bit that we see, I think we can learn potentially quite a bit.\n\n1:54:37.9 SC: In fact, let me add to that a little bit. There's a very real sense in which everything that we know about the laws of physics has been learned by human beings here on Earth over the past few thousand years. So in both space and time, the extent that human beings have actually prodded the natural world is really, really, really tiny. So the fact that we can make accurate predictions about things far away in both space and time is remarkable and I think is okay to lead us to conclude that there's a good chance that there is something learnable, intelligible about the world."}, {"type": "text", "content": "1:55:17.8 SC: Kelvin Firth says, \"In mad-dog Everettian quantum mechanics, where there's a single wave function of the universe that evolves with time according to some Hamiltonian, what exactly is that Hamiltonian or where does it come from? In what I've learned so far as a beginning physics grad student, the Hamiltonian comes from some potential which is usually classical looking, or at least it's a function of space. However, in the Mad-Dog Everettian picture, I take it that space is emergent. So where does the Hamiltonian come from? Where does it live?\"\n\n1:55:44.1 SC: Well, the idea is the Hamiltonian is the laws of physics. It is defining the universe. It doesn't come from anywhere else, right? This is always true in anyone's version of the complete theory of physics. There has to be a starting point. There has to be, \"Okay, here's the theory,\" right? In Mad-Dog Everettianism, the theory is, here's the Hamiltonian, and in fact, the Hamiltonian is simply specified by a list of energy eigenvalues, the spectrum of the Hamiltonian. Why is it the way it is? I don't know. So it's completely possible to me that it just is that way. It's also possible to me that just like we only see some branches of the wave function, we only see some parts of the Hamiltonian, and maybe the parts that we see are chosen by some anthropic reasoning, right? That this is the part of the Hamiltonian where human beings can exist. I don't know, but I would deny that I need to know. At some point, asking questions like this leads you to say, \"That's just the way it is.\""}, {"type": "text", "content": "1:56:47.0 SC: Felivel Camilo says, \"Do you believe technologies such as large language models or realistic image generation arrived at an inappropriate moment? Might humanity have benefited more from developing them only after achieving some form of enlightenment?\"\n\n1:57:01.8 SC: Well, no, I don't really think that humanity is on a trajectory to enlightenment. Maybe individual humans would achieve enlightenment more frequently if they lived for a few tens of thousands of years. But we keep making new human beings, and overall, I don't see much evidence that as a species, we are achieving some form of enlightenment. In many ways, as a species, we're getting better. I'm not trying to be too curmudgeonly about it. I do think that we treat each other better now, on average, than we did a few thousand years ago, but we still treat each other very, very, very badly in some ways. Both of those statements can be true at the same time. And I think that if you're waiting for us to achieve enlightenment before developing very advanced technologies, you're gonna be disappointed. And so I don't even think that's worth waiting for. Maybe these technologies will help us achieve enlightenment or anyway get better at it than we are now."}, {"type": "text", "content": "1:58:00.3 SC: Redlinks says, \"What is your position about AI successionism? The idea that if machines will become conscious, it would be ethically right to let them replace humanity?\" Well, I think that idea is extremely silly. I'm sorry. I do believe that AIs might become conscious. We've talked about it on the podcast. We've talked with people like Ned Block and Anil Seth who are skeptical that AIs could ever achieve consciousness, but other people like Stuart Russell, who I think believe otherwise. But why in the world would you say even if. So that's a good question all by itself. What does it mean for AIs to be conscious? Can they ever get there? What should we do if they do get there? Why in the world would you then say they should replace humans? I don't even see what the motivation for that is. I suspect, I'm not very familiar with this line of thought, so maybe I'm missing something deep, I suspect it's the usual overly anthropomorphic oversimplification of humanness or consciousness or intelligence that is endemic in certain communities that talk about AI."}, {"type": "text", "content": "1:59:10.2 SC: They act as if there's just a scale, a linear scale of intelligence or value or whatever, and we have a chance to be on top of it for the moment, but then AI is gonna pass us and then we're gonna be like puppies and kittens to the AI. I just don't think that's how it is, right? I think that whatever value human beings have morally or intrinsically or whatever, they will have just that much value even if the AIs become conscious. So it's okay to have two different species that are both conscious and can live together. I don't see any problem with that. So no one has given me any even vaguely persuasive argument in favor of something like AI successionism.\n\n1:59:52.1 SC: Edwin Miles says, \"I've been wondering recently about values and wanted to ask the following. Is the value of something only and always contingent on there being something or someone to value it? Or is there some intrinsic value to something separate to any human bias, preference, or valuation, et cetera.?\" Well, this is the kind of thing the philosophers talk about. There are value theorists. That's literally a job description. Okay, I'm not a value theorist, so I'm not here to give you the final answer. I don't want to say that values are necessarily reliant on there being someone or something to value it. I would say that values are parts of relations. They're not intrinsic to the thing. So if I have a cube of material, 1 kg of something, what is its value? Well, that depends on not only what material you have, but what other things there are in the universe that might make use of that material or might care about it. I'm not someone who thinks that value is always necessarily pragmatic. I think a work of art can be very valuable or even a little artifact that is just of sentimental value to you. Those can be valuable to you, and the value is different to you than to somebody else. I think that's fine."}, {"type": "text", "content": "2:01:12.7 SC: But it depends on the relationship to something, usually a person or something that can actually assign a value. I think the bigger lesson here or the bigger picture thing is we use words like value in our everyday life, and we know what we mean. And it's very, very common, once you get to a more careful consideration of the meanings of the words, like we do in philosophy, to realize that what we thought was a perfectly sensible concept in our everyday life doesn't serve that purpose or have that status in a more careful way of thinking about it, like free will, for example. And in those cases, I generally would like to say, in the context you're talking, think about what it is you mean. And if there's some word that you're trying to define and that definition is actually getting in the way of thinking clearly about what it is you're trying to do, then pick another word or try to talk without using that word at all."}, {"type": "text", "content": "2:02:08.6 SC: Scott says, \"Do Feynman diagrams have ontic content or are they purely computational? I understand that all we measure are scattering amplitudes, not full histories of particle interactions that Feynman diagrams might visually imply. But it seems that among working physicists, these diagrams are essential vocabulary for discussing and visualizing processes. It makes me think that there is more to them.\"\n\n2:02:32.9 SC: Well, I think this is a good question because I think the truth is in between a little bit. Certainly you shouldn't take Feynman diagrams exactly literally. And I think that's already obvious from the definition of what a Feynman diagram is. The point of a Feynman diagram is that every diagram represents one term in a sum. You add up the contributions from many, many Feynman diagrams, typically an infinite number, to get the answer to a question like, what is the probability these two particles will hit and annihilate each other or scatter in some other way? So the process, whatever it is, has some particles coming in and some particles going out, and an infinite number of Feynman diagrams that you use to calculate the likelihood of that process happening. So how in the world could we attach individual ontological content to the individual Feynman diagrams that are in the sum? It's like saying if I have the number 10, I could write that as 5+5 or 3+7. There's no one right way to decompose it in that way."}, {"type": "text", "content": "2:03:40.9 SC: And indeed, at a very down-to-earth technical way, that can be the case in Feynman diagrams. There can be different ways of calculating the same process and getting the same answer that have different sets of Feynman diagrams appearing. Now, having said that, you're also right that particle physicists talk as if they're real all the time. And that's because particle physicists are finite, calculationally bounded, rational beings, and it's helpful to think of those processes represented by the diagrams as really happening. Why is it helpful? Well, it helps you see what processes can happen and can't happen. And by doing a little bit more analysis of the individual diagrams, you can even get a rough idea for how likely something is. And sometimes you can be surprised; there can be secret cancellations. That was a big deal in the '70s when all this was being worked out. So it's helpful, but it's not the final answer. The final answer is the actual process that is going on."}, {"type": "text", "content": "2:04:38.0 SC: And of course, really the process is a process involving fields, not particles at all. So I think it's okay. Just like in quantum field theory at all, in Quanta and Fields, I try to make the point it's okay to talk about particles. Particles are not fundamental. Fields are fundamental, and particles are vibrations in them. But that's not to say you can't talk about particles. You can talk about particles if it gives you insight and helps you understand what's gonna happen. I think Feynman diagrams are exactly the same way.\n\n2:05:11.6 SC: Okay, I'm gonna group two questions together. One's from David Guderian, who says, \"Could you please talk about pointer states? Which aspects of them are already explained and understood by the physics community, and which aspects still await an explanation? You once mentioned that finding the classical world is still an open question in the Many-Worlds Interpretation.\" And then Henry Jacobs says, \"On the question of why do we never observe a superposition, is it plausible that observing always involves large systems becoming entangled with the small systems of quantum spin or whatever, and we don't consider the system observed until it has evolved into one of the eigenstates? This seems circular, but I don't know if that's a bad thing.\""}, {"type": "text", "content": "2:05:49.1 SC: So yeah, for Henry's question, we're gonna answer it in part by answering David's question. So the idea here of a pointer state is a state of a quantum system that basically can resist becoming additionally entangled with the world. So the classic example here is Schrödinger's cat, okay? Imagine you take the cat, you put it into a superposition of awake and asleep. The important thing is not whether the cat's asleep. The important thing is that it is a macroscopically distinguishable superposition. In particular, we're imagining here that the awake cat is up and walking around, and the asleep cat is lying down on the floor. And what happens is the photons in the box or the air molecules in the box, et cetera., bump into these two parts of the cat state differently. So they might bump into the awake cat but miss the asleep cat, or vice versa. And what that means is that the quantum state of the air molecules and the photons, et cetera., becomes entangled with the quantum state of the cat. So you have an entangled superposition of the cat awake and asleep, plus the environment, as we call it. And basically, we can call it the part of the environment that observed the cat to be awake and the part of the environment that observed the cat to be asleep."}, {"type": "text", "content": "2:07:09.0 SC: Now, nothing observed anything there, right? That is not a human conscious observer that we're talking about, but that's essentially what we mean from the Many-Worlds point of view about when a measurement occurs: when the quantum system has become entangled with its environment. But then the extra thing that is important here is that once you focus in on a single branch of the wavefunction, a branch where the cat is awake, for example, that cat still interacts with the air in the box and the photons in the box, et cetera., and the floor and whatever, but it doesn't additionally become entangled because every air molecule, let's just say in the box, interacts with the cat in the same way. When the cat was in a superposition of awake and asleep, the air molecule would interact differently with the cat depending on which part of the wavefunction we talked about. But once you're in just the awake part, every molecule either does or does not interact with the cat in exactly the same way. That's a pointer state."}, {"type": "text", "content": "2:08:13.4 SC: A pointer state is one where you can interact with the outside world without becoming additionally entangled. Pointer states are robust to being measured, to being monitored, as we say, by the environment that they're in. How well do we understand pointer states? We understand them pretty well. When I talk about the need for a better understanding of finding the classical world in Many-Worlds, I'm sort of assuming that... Well, I'm taking a step back and imagining we don't even know the laws of physics. Okay? What are... We know the laws of physics are quantum mechanical, but we might not know the specific Hamiltonian or forces or fields of the world or whatever. And I'm asking the general question: under what circumstances is there something that you would recognize as a classical limit of that situation?"}, {"type": "text", "content": "2:09:04.6 SC: But if you have a world where... If you have a situation, a setup, a theoretical playground where you know the laws of physics, which is actually much more common than what I think about, so you already have the situation, you have a cat, you have a box, you have photons, you know how they interact with each other, then people like Zurek and even going back further than that, Joos and Zeh and others and Gell-Mann and Hartle, they all worked out the basic story of decoherence and how it works and therefore what states are the pointer states. So I think that's mostly understood. There's absolutely still work to be done in dotting the i's, crossing the t's, et cetera., but it's pretty much worked out."}, {"type": "text", "content": "2:09:46.1 SC: Now, to Henry's question: why do we never observe a superposition? It's basically because once you're in that pointer state, you can interact with the other molecules in your body, et cetera., but if you were in a superposition that is entangled with its environment, then because of decoherence, basically, the part of the superposition that is in one branch doesn't ever interact with the part of the superposition that is in the other branch. So this is Everett's genius move. He says you are not the superposition of two different parts of your body, two different parts of the wavefunction of your body; you are just one of them. And when the wavefunction branches via decoherence, there's a pointer state that has you thinking one thing, a different pointer state that has you thinking another thing, and you should identify each of them as separate observers. So you're never a superposition, you never observe a superposition, because both you and the thing you observe are pointer states on single branches."}, {"type": "text", "content": "2:10:51.3 SC: And it's not circular, actually. There is some philosophy involved in finding yourself in the wavefunction, figuring out which part of the formalism describes you as a human being, but we can do that. That's okay. We have the capability of doing that, and we figure it out. In this way of thinking about things, what you mean by a measurement is decoherence. What you mean by a measurement is when the quantum mechanical system becomes entangled with its environment.\n\n2:11:21.6 SC: Okay. Daniel Zaccariello says, \"Baseball has no clock. Outs are its time, and its rulebook forces an exact conservation law. Every batter ends the inning as an out, a run, or a man left on base. Physics derives its conservation laws from the form of its rules, too, except it has to guess the rules. Is that the only difference?\""}, {"type": "text", "content": "2:11:43.9 SC: So I'd like the attempt to make an analogy here between baseball and the laws of physics in the realm of conservation laws, but I'm not sure I see how it works. I would not say that baseball has any conservation laws. A conservation law is to say that there is some quantity that you can calculate from the configuration of a system, like its sets of positions and velocities or whatever, which remains constant, unchanging over time. So if there was some thing that remained constant over time in a baseball game, that would be a conservation law. But the fact that every batter ends the inning on one of three possible, definitely known configurations, that's not a conservation law, because the inning does end. And if the batter is, let's say, on base, then the inning ends and the batter is no longer on base. There's no quantity that you can really point to that is the same from moment to moment."}, {"type": "text", "content": "2:12:42.7 SC: But the underlying ambition, I think, is completely correct. When you have some rules, whether it's physics or baseball, you can often, or at least you can try to find things that are invariant or conserved or always the same for everybody, no matter what specific implementation, no matter which game or physics experiment it is that you're looking at.\n\n2:13:05.3 SC: So Anonymous now says, \"If you were starting over today, what assumption in our current formulation of quantum theory would you be most inclined to question? Not because it's demonstrably wrong, but because removing it might open a genuinely new direction.\"\n\n2:13:20.3 SC: Well, I wouldn't, to be perfectly honest. If you absolutely want to know what I truly think, this is something that is an open question. Is quantum theory itself something we should consider modifying for whatever reason? I have friends, my colleagues at Johns Hopkins, David Kaplan and Surjeet Rajendran, are actively investigating modifications of quantum mechanics. And their motivation for doing that is they think by modifying quantum mechanics a little bit, they can help explain some important weird things about known physics, like the hierarchy problem or whatever. There are additional motivations for modifying quantum mechanics. Nadiia Diachenko, my student, who you know from the quantum cyclic universe paper, has been looking into the emergence of time. And there are certain setups, not universal, but certain setups in which when time emerges, the equation governing time evolution is not precisely the Schrödinger equation. It can be modified a little bit."}, {"type": "text", "content": "2:14:24.0 SC: So there are some motivations for doing that. But look, life is finite. You have to pick and choose what you do with your time. And for me, my impression is that physics, physicists, the field of physics has not done nearly enough to explore the implications and the workings of regular old quantum mechanics. So that's why I'm doing things like how does time emerge, how does space emerge, things like that, from good old ordinary quantum mechanics, because I think that we might get some surprises there that also bear on interesting, important questions that we already recognize are out there.\n\n2:15:01.7 SC: So quantum theory itself doesn't have that many assumptions. Now, you might be asking about formulations of quantum field theory and things like that, specific models that we have of the universe within the broad umbrella framework of quantum mechanics. Now, those are very, very questionable. There's all sorts of assumptions that we can try to think of and imagine changing. The most obvious ones, again, in the framework of quantum field theory itself, are the assumptions of locality and Lorentz invariance, the idea that fields take definite values, classically, they take definite values at different positions of space and moments of time, and then you quantize that theory to get the theory you're looking for. Indeed, I would say there, there's plenty of motivation for undoing those cherished assumptions from quantum gravity. Quantum gravity doesn't really work that way. So locality in particular is something that I would absolutely start questioning and have and am thinking about right now. So we'll see whether or not that actually helps anybody with anything."}, {"type": "text", "content": "2:16:09.0 SC: Daniel Shulman says, \"It seems to be accepted dogma that singularities exist inside black holes and sometime just before the Big Bang. If we treat spacetime as having torsion instead of zero torsion, we get Einstein-Cartan gravity, which looks exactly like GR except at the small scales where singularities matter, and the repulsive forces from the torsion in Einstein-Cartan gravity eliminates those singularities. Is it just a historical accident that Einstein didn't know enough geometry to introduce torsion, that we still believe in singularities? Or is there a reason why physicists don't give more credence to Einstein-Cartan gravity?\"\n\n2:16:45.0 SC: Yeah, so for those of you who are not experts in general relativity, there's an alternative to, alternative formulation, let's call it that, of gravity called Einstein-Cartan gravity rather than ordinary general relativity. And the thing is, again, if you read, I do have a book on this, if you read Space, Time, and Motion, this explains to you that there is a metric in general relativity, and that's the thing on which everything else is based. The metric tells you the distances between points along lines and things like that. There's also a notion of what is called parallel transport. So I can take a vector, remember we were talking about the polarization of light before being rotated by birefringence? Well, there's some way in any given geometry of spacetime to take a vector, like the polarization vector of a photon, and move it through spacetime while keeping it parallel. You need to define that somehow. This is carried out by something called a connection. And in general relativity, you derive the connection from the metric, because you derive everything from the metric. And this all goes back to Riemann in the mid-19th century. He's the one who suggested doing this."}, {"type": "text", "content": "2:17:56.5 SC: It was people like Levi-Civita and Christoffel who actually worked it out, the connection between, the connection, as it were, between the metric and the connection. Cartan comes along. He's another famous mathematician, and he emphasizes that in principle, you can have a connection by itself, or a connection in addition to the metric. You don't need to derive the connection from the metric. You could treat those as two separate things. And this naturally leads for the connection to have new degrees of freedom, new things it can do. And one of the major things that pops out is what's called the torsion, sometimes called the torsion tensor. And that's math. Okay, I'm trying to be very clear about what the idea here is, because math is not the same as physics. So there is an idea called Einstein-Cartan gravity, which is physics, but just the math doesn't determine the physics. The fact that you have proposed that the torsion could be separate, that the connection could be separate from the metric, does not uniquely pick out what the physical theory that uses that fact might be. I'm mentioning that because it'll become important in a second."}, {"type": "text", "content": "2:19:07.0 SC: So there is a sort of standard version of Einstein-Cartan gravity, and it doesn't introduce any new particles or dynamical fields. It just sort of changes the relationship between some of the existing fields. And people showed a while ago, like at least in the '70s, that under certain circumstances that can lead to a repulsive kind of force that might arguably get rid of certain singularities in general relativity. However, don't get too excited by that. It doesn't get rid of all the singularities. There's no theorem that says it does. And honestly, there's two huge problems with Einstein-Cartan gravity. Number one is it's not a theory of gravity. Gravity is exactly the same in this theory. It's a theory that modifies the behavior of the matter in the gravitational theory. But the left-hand side of Einstein's equation, the one that has all the tensors describing the curvature of spacetime in it, those remain unchanged in Einstein-Cartan gravity."}, {"type": "text", "content": "2:20:04.0 SC: Basically there is a torsion tensor, but it's non-dynamical, so you can sort of eliminate it by a clever change of variables. And all you're doing is adding new terms to the way that the matter fields enter the Einstein equations. So it's kind of just a rewriting of good old gravity with certain modifications of the matter side. The other thing about Einstein-Cartan gravity is if you care so much about torsion, if you really think that the connection should be independent of the metric, then you might as well make it dynamical, right? I mean, if it exists, then it's playing an important role. Why in the world would you just not add extra terms that let it propagate so that you need to specify the value of the torsion in addition to the value of the metric? These are called dynamical torsion theories or connection dynamic theories. And the thing is that there's still a quantum field theory, right? Everything should still obey the rules of quantum field theory."}, {"type": "text", "content": "2:21:02.8 SC: So I mention all this because when I was young, I was super interested in these theories. I thought it was very exciting to take a different geometric point of view on general relativity. But I also knew enough quantum field theory to know that you should treat it like a quantum field and do effective field theory. And the thing is, unlike, this is the crucial part, unlike the metric, which has certain symmetries, which means when you quantize the metric, its mass is zero. Okay? So the propagation of gravitational waves goes at the speed of light because they have zero mass. That's not true for the torsion tensor. There's no reason at all for the torsion to have zero mass. It's very easy to give it a mass parameter. That's completely consistent with all the symmetries and all the geometric origin of the theory, et cetera."}, {"type": "text", "content": "2:21:48.6 SC: Indeed, there's no reason not to give it a very large mass. And you would expect that its mass would generally become quite large, and therefore it would be like up at the Planck scale or something. And if it couples to other matter fields, it would quickly decay into other things. There's no reason just in the nature of torsion itself for it to give rise to a long-range force of any sort. So I actually wrote a paper with George Field pointing this out. And for our purposes, we're basically concluding we shouldn't have been excited by torsion all along. It's actually just not that interesting from a particle physics point of view.\n\n2:22:26.7 SC: Matt Becker says, \"Do you enjoy gardening or have any other outdoor hobbies?\" Short answer is no. I do have hobbies. I don't even have that many hobbies. My hobbies are happening right now. Podcasting is my hobby. Thinking about the world is my hobby, for the most part. As you all know, I also do other things. The hobby that I'm cultivating more than any other one right now, other than those obvious ones, is cooking, actually. I'm getting into cooking now that we own our own house and we have a kitchen that is big enough. And I like cooking. It's the closest I will ever come to being an experimental scientist. You don't want me in a laboratory doing real experiments, but I can chop some vegetables and things like that."}, {"type": "text", "content": "2:23:11.1 SC: Outdoor hobbies? No, not so much. I've never really lived in an environment since I was a kid where there was an outdoor to have a hobby. Like I said, my LA place did not have any outdoor space. So maybe I'm going to try... I'm trying to convince Jennifer that maybe she wants to start to take up herb gardening or something like that so that I will have fresh herbs for my cooking adventures. That's the closest I can come.\n\n2:23:33.0 SC: Jeroen says, \"Do you think that there are interesting dynamics in quantum theory that can be underexplored because they don't map well onto particles?\" I don't think that's exactly right. So to reiterate something I briefly said earlier in this AMA, when you have a quantum field theory, you quantize it, it looks like particles. That's a little bit quick, what I just said. Under the right circumstances, it looks like particles. Like gluons never look like particles because they're stuck inside strongly interacting particles. So really what you mean by a particle is a freely propagating particle, or at least one that doesn't interact strongly with its environment, and gluons are never those."}, {"type": "text", "content": "2:24:16.2 SC: Sometimes people draw Feynman diagrams to represent gluons and quarks inside a proton or neutron, but they're not at all accurate or representative of what's going on. Again, as I say in the book Quanta and Fields, inside a strongly interacting particle, you have to think about it in terms of fields rather than in terms of particles. That's why the Compton wavelength of a quark can be much bigger than the actual size of a proton, because it's really not a particle inside the proton. So Jeroen is correct in the implication that maybe when we think about quantum field theory, we too quickly go to the particle language, since it is often very convenient, right? When we talk about electrons or protons or neutrons, or for that matter, photons or neutrinos, talking about particles is completely okay."}, {"type": "text", "content": "2:25:10.2 SC: But there are other circumstances when it's not okay, so you might well ask, are there cases that are underexplored because they don't map well onto particles? I think that an honest answer is that when we talk to non-physicists, when we explain what we're doing, particle physics, standard model, Higgs boson, all that kind of stuff, it's just much more easy and tangible to talk about particles than it is to talk about fields. Okay? People know what you mean when you say particle; they don't necessarily know what you mean when you say field. And when you measure something in the Large Hadron Collider, for example, you see tracks as if what you're looking at are particles, not fields."}, {"type": "text", "content": "2:25:51.5 SC: So the particle language is both vivid and correct in a certain regime. But the professional physicists who are thinking about this stuff aren't trapped by that particular aspect of quantum field theory. They know that it's really fields, and they think about the fieldness of it all the time. Like I said, inside a proton or neutron, or for as a very vivid example, the Higgs field, okay, filling space and having an expectation value that gives mass to other particles, that's entirely a field phenomenon. There are even more subtle phenomena in the strong interactions where the topology of the field configurations is super important for understanding observable physics. So I would say that the real physicists actually do think about the field nature of quantum fields quite a bit."}, {"type": "text", "content": "2:26:42.7 SC: Mr. G says, \"It was recently reported by Sludge that former podcast guest...\" Why do they call it Sludge? You know, we used to have things like Newsweek and the New York Times, and now we have Sludge doing reporting. Okay, anyway, I'm getting old. \"It was recently reported by Sludge that former podcast guest Cornel West's 2024 presidential campaign was indirectly funded by Elon Musk through the Interstate Priorities Election Fund. While it's not clear that West knew of this involvement, it's difficult to reconcile with the purportedly pro-democracy rhetoric of someone like West with the practical effects of his and similar ostensibly pro-democracy political actors' actions working against American democracy. How should liberals act towards those who claim to support democracy but actively work against it?\""}, {"type": "text", "content": "2:27:32.4 SC: Well, I think we should be honest. Look, I think that Cornel West's presidential campaign was just silly. It was never serious. Maybe he took it seriously, but it was never something that had any traction or any realistic chance of affecting the race in any way. I did see the story, but I don't know the details about the funding sources. I'm very, very open to the fact, without having any actual knowledge one way or the other, that he might have received support from some political action campaign without being 100% aware of what the ultimate donors to that political action campaign were. And maybe some part of that, if that's true, maybe some part of that is a little bit of negligence on his part. But also the Supreme Court and Congress have made it very easy to hide the ultimate sources of money in these campaigns."}, {"type": "text", "content": "2:28:24.2 SC: So I find it completely plausible that he would just have no idea, not that he was trying to act cagey about it or anything like that. I don't like to phrase it as an action working against American democracy. I mean, he might have been ultimately the only effect of what he did. If he did get more votes, he might have siphoned votes off of the Democrats and therefore given Republicans a bigger chance of doing well. That might have been a possible thing, but that's not anti-democracy; that's just anti-one political party. Okay? So I do think that the rules should be very different. I think that we should be much more transparent about where money comes from, and I think that people should not run what are essentially vanity campaigns for president. I think that voting for president and choosing our leaders is too important to do that. But I don't know the details of who knew what when in this particular case, and I don't think that thinking of it as anti-democracy is the right framing, quite."}, {"type": "text", "content": "2:29:25.6 SC: Rob Butler says, \"If a potential solution to the fine-tuning problem is a multiverse, and if they all expand like ours, what prevents the universes from expanding into each other? If they had different laws of physics, would they interact or rather pass by like ships in the night?\" Here's a case where the language is just getting in our way, and I apologize on the behalf of cosmologists everywhere for the bad way in which we use language. When we talk about the cosmological multiverse, the multiverse that may very well play a role in accounting for the apparent fine-tuning of parameters and laws of nature, they're not really different universes. That's just bad language. They're different parts of our universe, parts that are far away. And they don't pass by; they're just far away. What prevents them from expanding into each other is just the simple fact of non-Euclidean geometry. They don't expand in a pre-existing space. They both expand as part of the procedure, the feature that space itself is expanding all the time. Forget about the multiverse. If you just have a single expanding universe, it's not expanding into anything at all. The amount of space is increasing; the volume of space is getting bigger."}, {"type": "text", "content": "2:30:45.3 SC: Same thing is true for the multiverse. Each little part of the multiverse can get bigger without ever running into other universes. There are interesting questions to ask about what is sort of going on in the crossover regions between one universe and another, and that's going to depend on details of your theory: the potential energy function for some scalar fields, or for string theory, or whatever it is. But there's no worry that one universe is going to run into ours. One universe could swallow and take over, I don't want to say there's no worries at all, one universe that had a lower energy could eat up another universe and change it into part of itself by winning the energetic battle in some way. But again, I don't think that's actually a very big worry at a practical level."}, {"type": "text", "content": "2:31:33.7 SC: David Maxwell says, \"Like you, I've always believed in letting ideas flow and trusting people to sort through the truth. Recent years have made me question that—\" there's probably a typo here, \"question, I'm gonna say, whether media landscapes have enabled systems where large percentages of the population only see total fabrication and never see the true ideas. So have your views on censorship changed?\" Well, my views on censorship have not changed. No. Look, it's always been the case that large percentages of people have received misinformation and false information. You look at yellow journalism back in the late 1800s; they were not getting good information about what was going on in the world. And that's just always been true no matter what the media has been. The velocity has changed, the amount has changed, the barriers to entry have been lowered. So individual people can hop on the misinformation train much easier now than they could back in the day when you needed a printing press to do it."}, {"type": "text", "content": "2:32:43.8 SC: But I think the basic human nature that makes it happen hasn't really changed, and I don't think that censorship is the answer. We've talked about this on the podcast in various ways, Petter Törnberg, Gordon Pennycook, et cetera, how information flows through the internet and how that increases or decreases people's accuracy. I do think the situation is bad, don't get me wrong. I think that there are big problems in how citizens of a democracy are getting their information. There was a recent edition of Philosophy Comics, Philosophical Comics? I forget what the name of the comic strip is, but there's this wonderful comic strip and it comes out occasionally. And in this one, Rousseau, Jean-Jacques Rousseau, is thinking about inventing democracy. Of course, he didn't invent democracy, but that's okay; it's a simplification for the purposes of a comic strip. And he says, \"All we need to do is have civic-minded citizens who are well-educated, and then a democracy will work.\""}, {"type": "text", "content": "2:33:48.3 SC: And then the punchline is, of course, we have democracy, but we don't have well-educated citizens, nor especially civic-minded ones. So I do think it's crucially important to think of ways that people can get better information and also more recognition of their civil responsibilities in general, but I don't think that censorship is the way to do that. I'm not quite sure what the way to do that is, but I do have my preferences for what not to do.\n\n2:34:15.4 SC: Josh says, \"You've mentioned playing poker a few times, so I've got to ask: assuming it's Texas Hold 'em, what is your favorite starting hand? Are you a big pocket pair kind of guy, or do you get more excited seeing suited connectors?\" So to those of you who are not poker players out there, this is actually a sort of sneakily good question, I think. I think people don't appreciate necessarily... People who are not frequent poker players don't appreciate this subtle difference here. In Texas Hold 'em, you are dealt two cards, your hole cards, that you see and nobody else does. And then the board, the common cards that everyone shares, come out gradually in front of you, and you make the best five-card hand out of your two cards plus the five cards on the board. And so you don't know what other people have; you do know what you have. So it's a game of incomplete information."}, {"type": "text", "content": "2:35:10.6 SC: And if you just ask the question, of all possible hole cards that you could have, which ones will lead you to having the best hand at the end of all the cards coming out the highest percentage of the time, the answer is clearly pocket aces. Two aces in your hand are going to win the hand more often than anything else. But the twist is, in poker, in Texas Hold 'em, the goal is not to win the hand; the goal is to win money. And of course, you win money by winning hands, but you could easily find yourself having a strategy where you frequently win hands with very tiny amounts of money in the pot and occasionally lose hands with huge amounts of money in the pot. And even though you win more hands than you lose, you overall lose money."}, {"type": "text", "content": "2:36:02.2 SC: So there's another kind of hand called suited connectors, which means two cards of the same suit which are right next to each other, like ten of spades and nine of spades. Okay? Those kinds of cards are more likely than average to eventually get either a straight—five cards in a row, or a flush, or even a straight flush. A flush is five cards of the same suit. And those kinds of winning hands will also win. They'll win less often than just having a big pocket pair, but when they win, it's possible that the opponents that you're playing with don't give you credit for having such a good hand and therefore are willing to put more money into the pot. So even though those hands win less frequently, it is possible to win more money with them. And therefore, it's a reasonable question: which would you rather start with? I actually don't care. I know that when we start, there will be a given distribution of hands, and you have to play all of them effectively."}, {"type": "text", "content": "2:37:05.7 SC: I do think that there's a certain thrill that you get from having bad starting cards and entering the pot anyway and getting really lucky and fooling everyone and taking down a big pot. There's nothing more fun than that. If you just have two aces to start and you end up winning because no one has a hand that good, you're like, \"Okay, good, I got lucky, I got good cards, and I won the hand.\" But it doesn't feel like skill; it just feels like you got good cards. Whereas somehow if you have three-five suited and you end up getting a straight, and your straight is two, three, four, five, six, no one thinks you have that hand because what are you doing being in the hand with a three and a five? But therefore, you can win a huge amount of money if someone else has a pretty good hand, like someone else has pocket aces, then you have a big pot in front of you."}, {"type": "text", "content": "2:37:57.5 SC: But that's just very, very rare that's gonna happen. So I just take it all. I take the good with the bad. I appreciate the thrill of doing a little trick, but ultimately you gotta squeeze whatever value you can out of whatever cards you are dealt. That's true in life just as much as in Texas Hold 'em.\n\n2:38:16.4 SC: Alan says, \"In the previous AMA, you characterized disagreements about free will as largely semantic, despite arguing just minutes earlier in the same episode that emergent phenomena are genuinely real. You also seem to endorse the view that free will emerges from agency in the recent Christian List episode. Can you reconcile the apparent contradiction or clarify whether I'm missing something here?\""}, {"type": "text", "content": "2:38:38.3 SC: I think you're missing something. I mean, yeah, I do think emergent phenomena are genuinely real, and consistent with that, I think it makes most sense to treat free will as real. I think that's pretty consistent. It's not treating free will as real that I think is a semantic argument. I think it's debates between people who treat emergent compatibilist free will as real versus people who simply insist that if the universe is deterministic, you can't have free will by definition. That's a semantic argument. That's just arguing over the definition of free will, and I think that that's kind of boring. So that's why I try in those cases to not use the term free will and just argue about what we think happens in the world. The reason why Gregg Caruso was a good person to talk to on the anti-free will side is because that's not his reasoning, right? He's not just disagreeing with compatibilism by definition; he doesn't like it for some more normative reasons. And so that's interesting to explore."}, {"type": "text", "content": "2:39:41.9 SC: Paul Torrek says, \"How important is it for Everettians to derive the Born rule? Obviously, it would be nice to reduce your theory's number of assumptions by one, but don't most other interpretations of quantum mechanics help themselves to an empirically validated Born rule rather than deriving it?\"\n\n2:39:59.6 SC: Well, they do, but the situation is different. Everettians have to derive the Born rule in a way that others don't. So if I have, for example, some theory in which the wave functions truly collapse, objective collapse models, for whatever reason, there's different versions of those, okay. But in such a theory, there will be some indeterministic, some truly stochastic element that describes wave function collapse. And then how you interpret the Born rule is as a frequency, right? When you have a certain setup and you make a certain measurement, you will do that experiment many, many times, and the simple frequency with which things happens is what you mean by the Born rule. It's a frequentist version of probability, if you want to put it that way."}, {"type": "text", "content": "2:40:50.0 SC: In Everett, you can't say that. In Everett, when I observe a spin, that I get some spin up and some spin down in the wave function, with 100% probability, there's a world where the spin was up and 100% probability there was a world where the spin was down. There's no frequency there. It happens all the time, every single time. There's a world where the spin is up and a world where the spin is down. You have to treat probability epistemically, subjectively, not frequentistly, objectively, okay? You have to interpret, I would argue, you have to interpret probability as a measure on your self-locating uncertainty when that wave function branches. And the theory doesn't have any room for saying, \"And assign this probability,\" because the probability is 100%. That's the assignment: the probability that it happens somewhere in the wave function. The thing you're talking about is not something the theory gives you, okay? The theory doesn't give..."}, {"type": "text", "content": "2:41:48.0 SC: Well, I think it does give it to you, but it doesn't have room for an additional assumption that gives it to you, because the thing you're trying to make an assumption about is your subjective probability on self-locating uncertainty. What the theory is allowed to do is give you different physical dynamics, it's allowed to give you different ontology; it's not allowed to tell you what to think, okay? That's what the Born rule comes down to in Everett. So I think that's all a resolvable question, but it's a different kind of question in Everett than it is in other approaches.\n\n2:42:19.8 SC: Gustavo Chavez says, \"In the March 2026 AMA...\" by the way, I am appreciating that people are following up on old AMA questions. That's always a good strategy. \"So in the March 2026 AMA, while answering a question about your take on the notion of computational functionalism, you said that you think that the underlying processes that lead you from the input to the output are crucially important in whether or not those processes involve something that we can call consciousness. In his recent essay, 'The Mythology of Conscious AI,' Anil Seth challenged the notion of computational functionalism, arguing, among other things, that there are functions that Turing machines cannot compute perfectly, such as continuous or stochastic functions. As I understand it, he argues that perhaps consciousness depends on processes that a Turing machine cannot compute, but only simulates in a way that isn't precise enough to allow for consciousness to emerge. Is this more or less what you're thinking about when you mention the importance of the underlying processes happening in our brains, or was it something different?\""}, {"type": "text", "content": "2:43:18.9 SC: I think it's a little bit different. So it was Anil Seth who first opened my eyes to the importance of distinguishing between the information flow in our brains, which is what computational functionalism cares about, and all the other physical goings-on in our brains, which is what biology and what Anil refers to and others refer to as biological naturalism care about. But that's not what we talked about when we had Anil on the podcast; we talked about emergence and things like that. But Anil did give a talk at the year-and-a-half-ago Natural Philosophy Symposium. By the way, we will be having another one in May 2027, so look forward to that. But his talk at the symposium was about biological naturalism versus computational functionalism and its importance for consciousness in AIs, and you can look up that online. The talks are on YouTube."}, {"type": "text", "content": "2:44:13.3 SC: So anyway, it was that talk and the paper that he wrote about it, and he really... I feel bad, he asked me to respond to that paper as a part of a whole special issue of the journal the paper appeared in, whose name is escaping me right now, but I never got around to doing it. I was just too busy doing other things. But I did read his paper and think about it, and that's what got me interested in this topic. And we later talked to Ned Block, who is the other major proponent of this perspective. Okay, so I try to be...look, this is not something I'm an expert in. I don't think you should listen to what I have to say about these things. I'm just trying to be honest about what my opinions are. But I'm not at a high level of having gone through all the details here. But the important thing to me is exactly what I said: the distinction between the information flow in your brain versus all the actual biophysical processes going on in your brain. I am open to the idea that whatever consciousness is, it requires more than simply information flow to capture it. Okay. It might not."}, {"type": "text", "content": "2:45:26.3 SC: I'm also open to the idea that it doesn't, because I don't know a lot about consciousness, but I'm open to the idea that it does. And Anil puts a lot of emphasis on this Turing machine stuff. I don't especially. So I'm not sure whether or not human brains are Turing machines, or better or worse, or even whether that's a good comparison. My interest is more in entropy and the arrow of time, which will come as a surprise to nobody. I think that the mechanisms of metabolism and turning free energy into useful work that go on in our biological structures are very, very important to what you and I call thinking and perhaps to what you and I call consciousness. They can be mimicked by other kinds of structures, but maybe they can't be exactly reproduced, or at least not in a simple way that abstracts away all of the underlying mechanism into a simple information flow through a computer."}, {"type": "text", "content": "2:46:28.7 SC: Again, maybe it can, but I'm open to the possibility that it can't. 'Cause when I first heard Anil's objections to computational functionalism, I was worried that he was abandoning physicalism. But he explained that he's not in any sense abandoning physicalism. So I was impressed to learn how you could stick with physicalism and yet be concerned that AIs might never be conscious. I thought that was interesting, and that's something that one should consider when investigating the question of whether AIs could ever be conscious.\n\n2:47:00.8 SC: Okay, I'm gonna group two questions together. One from Christian Dobo, who says, \"Do you think AI will be able to produce new theories in physics just by the sheer fact that it has access to a vast amount of papers, findings, and theories and is able to hold them in its head and freely recombine them? I understand your point about physics, that given its experimental nature, it's less susceptible to AI breakthroughs, but I have a feeling that there might be low-hanging fruit, low-hanging yet important fruits hanging around that are not discovered because of the immense specialization and amount of knowledge in science.\" And the other question is from James Allen: \"What do you predict would happen if you constructed a training data set for an AI that contained only the data from quantum mechanics experiments? Could you build up an agent whose intuition about the world were quantum mechanical instead of classical? Do you predict being able to extract novel insights from such an agent?\""}, {"type": "text", "content": "2:47:51.9 SC: So both questions are about how well AI can do with sort of coming up with physics theories. They're very different questions, so I apologize to Christian and James for combining them, but it's useful to answer them sequentially. So to Christian's question, I don't think that's the way it's gonna work. I think that, look, AI has an impact on how physics is done. I think... As I'm saying this, I'm realizing there's another question still to come where I'll talk about this again. AI is an accelerator to doing theoretical physics. It can help you straighten out your own ideas, inspire new ideas in you, and things like that. I can't with any confidence predict what AI will do when AI becomes something different than what it is right now. Okay? I don't have any objections in principle to AI being much better at theoretical physics than human beings are. But I don't know, because we haven't built those AIs yet. All I can talk about is what the AIs are doing now. Right now, they're not especially good at coming up with new ideas in theoretical physics."}, {"type": "text", "content": "2:48:59.5 SC: And it's not a matter of having been trained on the huge number of papers, findings, and theories. In fact, that is a little bit deleterious. The problem is, I mean, that's super helpful to the human being who is talking to the AI and saying, \"Has anyone ever thought about this?\" and they can help you with that, okay? But it creates a problem for the AI because they're not especially good at judgment. They don't have really good physicist intuition. So they're reading a billion papers, and to the AI, these are all papers, right? They gotta take them all seriously. And you might say, \"Okay, where's the consensus?\" and stuff like that, \"Where do people disagree?\" and stuff like that. But all that does is drive the AI towards sort of the most mainstream view, okay? The ability to look at a less mainstream paper, one that doesn't agree with other papers, and say, \"Oh wait, this is a good idea,\" I've not seen that in AI at all. It's quite the opposite. You have to coax the AI into even accepting a point of view that is not the mainstream one. Again, I'll just keep saying it over and over again because people don't wanna listen to me: that's not a necessarily permanent condition. You could imagine doing better, but that is what I observe in AIs right now."}, {"type": "text", "content": "2:50:20.9 SC: And likewise with James's question. I think in James's question it's even worse because he's saying, imagine the training set is only data from quantum mechanics experiments. So one little footnote here: every experiment is a quantum mechanics experiment because the world runs according to quantum mechanics, right? There's the classical limit in which you don't need quantum mechanics, but you can't do an experiment in the physical world that isn't ultimately a quantum mechanics experiment. So that's a footnote there. But the other thing is, I'm not even sure it makes sense to say, what if you only trained an AI on data from quantum mechanics experiments? Like, what does that mean? You just give it a set of zeros and ones? You have to accept that when you look at data from any experiment, you're always doing so within a theoretical framework. If I say, \"Oh, there's a dot on a screen at that location,\" I am presupposing the existence of screens and dots and locations, and that you know what that means. That's already theoretical superstructure, right?"}, {"type": "text", "content": "2:51:24.4 SC: That's why physics is hard, because sometimes you have this theoretical view of the world and you realize it's insufficient and you have to do better and you have to update. And so I think that you couldn't just train an AI in a theory-free way on data from experiments. We start with some folk view of the world and then we try to do better building on that. We can't start in the world in a way that has no latching onto the things that we're familiar with all the time. So I'm not even sure how you would do that kind of thing for an AI. Now, I might be wrong about that, and that's something where maybe a clever person could overcome the obstacles that I see.\n\n2:52:07.2 SC: Jonathan Kleiman asks a priority question: \"How do you distinguish genuine academic consensus from people being afraid to disagree? Has that fear contributed to public distrust of universities, and what should they do differently?\" Well, look, I'm mostly in science. I'm half in the humanities now, technically, because I'm in a philosophy department. But there's so much going on in this question, I don't even know where to start. What do you mean by consensus? Okay. Academics argue with each other all the time. You can say, \"Oh, string theory is very popular,\" but in my physics department, in every physics department I've ever been in, even one with big-name string theorists, there's plenty of people who think that string theory is entirely bullshit and are very happy to say so. Academics love arguing with each other. That's what they do. Even if you're almost entirely in agreement with some fellow academic, what you tend to first do is find the disagreement and then spend all your time talking about that."}, {"type": "text", "content": "2:53:10.7 SC: There might be consensus in the sense that, okay, we have general agreement that the standard model of particle physics fits the data, but it's not like there's some enforcement mechanism that means that you need to agree with everybody. If you can't get along in academia, there's a use of the word consensus in the popular discourse because we do want to distinguish crackpottery from real science, okay? So there are academics who don't think that human activity contributes to global climate change at all. Those people are crackpots, even if they're well-respected academics in other areas. So we talk about there being a consensus of anthropogenic climate change, okay? It's only for PR purposes that we talk about that. What it means at a more careful level is that there's an overwhelming majority of people who have thought very carefully about this and come to a certain conclusion that they agree on. There's always gonna be dissenters and whatever. And typically those dissenters are allowed to go about their business, right? Like they're not fired or whatever. Some of those dissenters have Nobel Prizes."}, {"type": "text", "content": "2:54:18.4 SC: So but I think the important thing is that the very fact that academics tend to disagree with each other all the time, and there are dissenters, and those dissenters are sometimes very respectable, and yet academics do appreciate sometimes that we want to be clear about what we mean, has led to an opening for people who want to attack academia in bad faith. And I think that the public distrust of universities, to the extent that it exists, comes much more from bad faith attacks on academia than it comes from academics themselves. And academics have been slow to learn this. I remember back when I was writing my book on the Higgs boson, if you remember, there was a worry that we would turn on the Large Hadron Collider and destroy the Earth, okay? And look, physicists live on Earth. They don't want the Earth to be destroyed either. They took these worries seriously, they thought about it, they wrote papers, and they decided that as far as they could tell, there was no serious threat. But nevertheless, there were people who said there could be a threat. And when physicists say there's no serious threat, they don't mean the probability is zero. They mean the probability is so incredibly tiny you don't have to worry about it, even if it's not zero."}, {"type": "text", "content": "2:55:40.8 SC: And that subtlety doesn't come across, okay? Physicists know what you mean when you say that, but the outside world says, \"Oh, so you're saying there's a chance.\" And I remember that there's an interview that John Oliver, back when he was on the Daily Show, he did an interview with John Ellis, who is a very well-respected theoretical physicist who works at CERN. And he had learned this lesson. John Ellis had finally learned this lesson, I'm sure by getting it wrong before. I haven't talked to him personally about it, but he they did an interview, and John Oliver is talking to John Ellis and asks like, \"Is there a chance that the Large Hadron Collider will destroy the world?\" And Ellis just goes, \"No.\" And that's it. And that's a PR move. If he's talking to his colleagues, he would say, \"Well, this could happen and this could happen, but it flies in the face of literally everything we know about physics, but it could happen.\" When he's talking to the public, he learned he says, \"No,\" okay?"}, {"type": "text", "content": "2:56:42.3 SC: And bad actors have taken advantage of this attempt on the part of scientists to be honest amongst themselves and try to also give the outside world the most accurate vision of what they believe, even if it's not 100% accurate. And so I'm in favor of being honest. I always try to be honest myself. But I know that I'm reaching a smaller audience that is relatively well-informed and things like that. And when people ask me about science communication as a discipline, how do you get better at it? I try to be very explicit that being 100% accurate in your statements feels good, but it's not necessarily the best science communication. Not because saying untrue things gives you better, I don't know, income or whatever or better influencer dollars, but rather because you can say 100% true and accurate things, and depending on the mental state of the person listening to you, they may come away with a less good understanding of what's going on than they had before."}, {"type": "text", "content": "2:57:59.8 SC: Your goal is not to say true things. Your goal is to improve other people's understandings. And sometimes you have to give an analogy, right? Or give a simplification or say something that is most often true but not always. And that's part of the job. That is absolutely part of the difficulty, why science communication is not automatic, why you actually have to think about how to do it. So I think there's a lot going on. I think that working academics, I mean, sorry, I meant to say this at the beginning of the answer. There are effects within academia where certain sets of ideas are more favored than others. Of course there are. How could there not be? There's a very precious, rare commodity resource, namely jobs. Who's gonna get to be hired? Okay? And if you're a department that does a certain kind of thing, it's easier for you to hire people who you agree with than people who you disagree with."}, {"type": "text", "content": "2:59:04.0 SC: Now, a good department will recognize this. We've had these discussions in all the departments I've ever been in. We do a lot of X, but we don't do Y. Should we hire people who do Y? Right? And that's hard to do, but you try to do it because you want to have some level of diversity. But you also don't want to hire crackpots. So if you think that what the other person is doing is so wrong as to not be worth pursuing, then you're not gonna hire them. And again, I don't see that that's a bug in the system. I literally don't see any other way to do it. Are you gonna advocate that departments should hire people that they think are crackpots? Well, if not, then you're gonna have to have a way of defining who's a crackpot and who isn't. So I do think that there are schools of thought in academia, and fitting into a school of thought can absolutely help your career. That much is true. I don't think that that's the origin of any public distrust of universities. I think the origin of public distrust of universities is bad actors who don't like universities trying to undermine trust in them and generate fear. And that's actually been pretty successful, and I think that that's terrible."}, {"type": "text", "content": "3:00:15.6 SC: P. Walder says, \"How do you think AI will inform theoretical physics in the short term, 3 to 12 months?\" So yeah, this is the question I referred to earlier was going to come. So I think I mostly answered it. I think that it won't be a revolutionary impact in the short term, 3 to 12 months. Like I said, it's an accelerator. It helps you, it helps move you forward, both in the sense that it can do calculations for you. If you have a well-defined problem, mathematically carefully formulated, AI can absolutely help you find the answers to that. Like I have friends who are using AI to help solve problems in string theory or something like that, if it's very well mathematically formulated. But it doesn't do a good job in coming up with the questions to ask. Again, short term, 3 to 12 months, no statement about what the ultimate equilibrium will look like. But right now it's a partnership between human beings coming up with questions, AI helping you to answer them, both in doing the calculations, as I said, but also in just understanding the lay of the land, understanding what has been written. I know that that's what I mostly use it for. Basically, I use it for drawing plots."}, {"type": "text", "content": "3:01:24.9 SC: And for figuring out what's out there in the literature. I recently asked AI, \"Has anyone connected these papers by Ted Jacobson on entropic approaches to gravity to this older idea called unimodular gravity?\" And the AI is like, \"Yeah, sure, people have done that. Here's these papers, not that many of them, but here they are.\" And then I can go read the papers. Because ultimately you have to read the papers. You can't trust the AI to do your work for you. I think a lot of the fear of AI or distrust of it comes from the obvious fact that you can misuse it, that you can offload your thinking to the AI and get in trouble that way. But you can also use it responsibly. And so I think that people are gonna hopefully be doing that. What I hope not to see, but I worry about seeing, is just a flood of kind of crappy papers, right? It's easy with AI to write crappy papers at a very, very high rate. I mean, there are people out there, not that I know of in physics, but people in other fields that just write a paper every couple days, because why not? The AI will do all the work for you, right? Those papers are not gonna be very good, very interesting. You barely have time to read those papers, much less write them. So I think it's gonna look very bad on your CV in, five years from now, if you turned out 100 papers a year. That's not gonna look like you're productive. That just looks like you're not even reading your own papers."}, {"type": "text", "content": "3:02:52.5 SC: C. Gerlando says, \"In your April AMA, you discussed Habermas's concern that economic and administrative systems can colonize the life-world, displacing communication and shared meaning. A successor in that critical tradition, the sociologist Hartmut Rosa, has developed a related critique through his concept of resonance: relationships with people, work, nature, or art in which we feel addressed, can respond, and are changed by the encounter. In such moments, the world seems to come alive and crackle, drawing us into encounters we cannot fully control. Rosa proposes resonance as a criterion for a good life beyond wealth or the mere satisfaction of preferences. I find this compelling. A society could become ever richer and more efficient while making resonant relationships increasingly difficult to sustain, and that is bad. Do you think resonance could provide an objective standard for judging a society's success, or at least a standard that goes beyond subjective preferences? What would justify treating it as such?\""}, {"type": "text", "content": "3:03:53.4 SC: So, I mean, I hope it's not gonna be a surprise, I can't speak to the specific details of this concept that I've never heard of before. I mean, I've heard of the word resonance, but not in this particular context. And so I'm not gonna judge whether it's useful or not based on the description in this question, as clear and nice as it was. There's probably more that you have to learn before you could actually have a good opinion about that. I do think that, going back to all these other questions about AI and so forth, it's not just AI, but the internet, the way that we have jobs and our economic situation, et cetera., have dramatically changed human life over, let's say, the last couple thousand years. All right? No doubt that we live in a different way than we did before. And we are not necessarily built for it, or we're not necessarily expert at navigating it. We can sort of get along in ways
