 expert witness in a lawsuit against Magic Mountain. “I think one is already way too much.”\n\nCalOSHA and Magic Mountain instead frequently blamed riders for their injuries and in more than 35 cases alleged that people had somehow ridden the attraction incorrectly by failing to hold their heads in the right position. In one case, when a 14-year-old was hospitalized last year after losing consciousness on the ride, officials attributed it to the teenager’s menstrual cycle.\n\nSix Flags and CalOSHA did not respond to detailed questions from ProPublica and L.A. Material. However, Denisse Gómez, a spokesperson for the state department that oversees CalOSHA, said in a statement that when theme park injuries are reported, regulators evaluate whether the ride was operating correctly and according to state safety rules. The agency is “committed to public safety,” she said, adding that “because that investigation is ongoing, we are not commenting on matters involving X2 at this time.”"}, {"type": "text", "content": "Six Flags provided a statement that noted that the X2 had consistently passed safety tests, and its parks undergo preventative maintenance and a comprehensive, third-party inspection program. They also said their investigation of the ride remains ongoing, and that they are fully cooperating with CalOSHA. “Safety is our ethos and is at the heart of everything we do,” a spokesperson said.\n\nWhen Six Flags has been sued for wrongful death or injuries related to the X2, it has maintained that injuries are rare and the ride is highly regulated by CalOSHA. In a recently settled lawsuit related to 22-year-old Christopher Hawley, who died after riding the X2 in 2022, Magic Mountain’s director of public safety said in a declaration that the state has never notified the park of any “patron safety-related concerns related to the acceleration forces on the X2.”"}, {"type": "text", "content": "Christopher Gibson was an autistic but healthy teen when he and his mother, Leanndra Fascaldo, drove from their Colorado home to California to celebrate his high school graduation at Magic Mountain.\n\nThe pair rode roller coasters for several days starting on May 31, including the X2 and the Viper, which Christopher called a “neck breaker,” according to a sheriff’s report. On their fourth day at the theme park, the teen once again rode the X2 and then the Great American Revolution before complaining of a headache. By early afternoon, they returned to the hotel.\n\nThat night, the pain grew worse. His mother gave him Advil. Eventually, he moved to the hotel room’s closet, where it was darker, and went back to sleep. His mother assumed he was just exhausted, but around 2 p.m. the next day she noticed that he had stopped snoring. She looked into the closet and saw that his lips were blue and his face was covered with “white and pink foam.” She called 911. Paramedics pronounced him dead at 3:16 p.m. on June 4."}, {"type": "text", "content": "Within a month, a sheriff’s homicide detective reached out to the California state office that regulates roller coasters, writing that “it is possible that he suffered an injury during his visits to the theme park.” The detective did not receive a reply until she contacted the office again two months later.\n\nIt’s been a deadly year for Six Flags. In addition to the California incident, an Atlanta school worker died in October after riding one of the theme park’s “hypercoasters” at Six Flags Over Georgia, prompting the company to temporarily close nine attractions at six theme parks across North America.\n\nTheme park rides are regulated by states, not the federal government. In 2000, the legislature gave CalOSHA, the agency responsible for worker safety in California, oversight of roller coasters. Millions of people flock to the state’s theme parks each year, and the move came after a series of high-profile accidents in the 1990s. Under the law, state officials were given new power to conduct annual inspections , and theme parks must report accidents that result in serious injury to the agency."}, {"type": "text", "content": "But ProPublica and L.A. Material found that officials in CalOSHA’s Amusement Ride and Tramway Unit have frequently determined that investigations are unnecessary when accidents happen on the X2."}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/Pages-from-Katerelos_compendium_UNREDACTED_first_aid-1_b.jpg", "alt": "Highlighted text (with names redacted) from an official report states that a patron was sent to the hospital by EMTs after complaining of head pain following a ride on the X2 roller coaster. A box is checked at the bottom of the document stating that an investigation will not be made into the incident."}, {"type": "text", "content": "In 16 instances involving people who wound up in the hospital after riding the X2 between 2009 and 2022, CalOSHA invoked identical or similar language after checking a box on accident reports that said state action was not called for. “At this time, this accident does not warrant an investigation,” said one typical form. “The condition which developed while the patron was riding does not appear to be related to the maintenance or operation of the ride.” The report was filed in response to a woman who was hospitalized in 2016 with a head injury after riding the X2.\n\nThis also held true in cases where people lost their lives. When Hilda Farias suffered a massive brain hemorrhage after riding the X2 in October 2010, CalOSHA officials adopted similar language and conducted no inspection. The state regulator’s report did not even note that the 28-year-old mother of a 5-year-old had died, according to records obtained by ProPublica and L.A. Material. Farias’ family sued the theme park, and the case settled in 2015."}, {"type": "text", "content": "When Hawley died in June 2022 after riding the X2, Magic Mountain initially told CalOSHA that the cause appeared to be heatstroke, according to a state report. The coroner later determined that Hawley, like Farias, had died of a massive brain hemorrhage. On that occasion, CalOSHA shut the ride down briefly while Six Flags conducted tests to measure the impact of g-forces on the rider and examined maintenance records. It ultimately determined that the ride was operating normally, according to a CalOSHA inspection obtained by ProPublica and L.A. Material."}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/Christopher-Hawley-Photo-Courtesy-Hawley-Family.jpg", "alt": "An older man and his two sons are seen in a selfie while sitting in the stands at a baseball game."}, {"type": "text", "content": "Christopher Gibson wore a Batman hoodie to school almost every day.\n\nDiagnosed with autism when he was 5 or 6, Christopher was “high-functioning and verbal,” his mother told a sheriff’s detective. He had recently graduated high school and was headed to Colorado Mesa University to study theater.\n\nAs part of a family tradition, the teen’s mother let each of her five children pick the location of a celebratory senior trip. Chistopher wanted to ride roller coasters, and mother and son discussed a trip to Disneyland or Disney World. After some online research, Christopher chose Six Flags Magic Mountain, known for its thrill rides and DC Comics characters.\n\n“He wanted to see Six Flags,” said Chadwick McGrady, an attorney representing the family in Christopher’s death. “The marketing worked.”"}, {"type": "text", "content": "Magic Mountain sits about 35 miles north of downtown Los Angeles, in Valencia, the last notable stop before Interstate 5 climbs a steep stretch known as the Grapevine and drops down into the San Joaquin Valley. The park is aptly named: Roller coasters built into the mountainous terrain hurtle riders down hillsides and through trees, with disorienting turns taken at high velocity.\n\nChristopher rode the X2 on June 2 and again on the morning of June 3. Soon after, reeling from a headache, he texted his mother from a park restroom: “I don’t think I can do any more today. My head is hurting me.”\n\nThey went back to the hotel. He had two days to recover before one of the big draws of the trip: DC Heroes and Villains Fest. Christopher “was a huge fan of DC Comics and was looking forward to meeting Batman on Friday, when DC Comics characters would be at the park,” sheriff’s detective Yoon Nam would later write in her report. Friday, June 5, was its opening day, and Christopher was determined not to miss it."}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/Dinner-Show-Excalibur-Photos-2.jpg?w=2560", "alt": "A young smiling man wearing glasses holds his mother in a photo made while they were enjoying an Excalibur performance."}, {"type": "text", "content": "But on the morning of June 4, his head was still hurting him. He had taken refuge in the hotel room’s closet. His mother wasn’t unduly alarmed, because Christopher often retreated to dark spaces at home, a longstanding self-soothing ritual. She listened to the sound of his snoring — until at some point in the afternoon, the sound stopped.\n\nIn a statement released through her lawyer, Fascaldo said that her son “had so many dreams, and had his whole life ahead of him.”\n\nAfter an autopsy, the County of Los Angeles Medical Examiner found a large subdural hemorrhage. The cause of death: “blunt force head trauma.” The reason for the injuries was noted as a “history of theme park rides.”\n\nNam and the medical examiner spoke by phone with Fascaldo, Christopher’s mother, on June 6."}, {"type": "text", "content": "According to a source familiar with the investigation, Fascaldo was composed, recounting a precise chronology of the rides Christopher had ridden. Among them were Full Throttle and the Viper, and, at least twice, the X2.\n\nNam contacted CalOSHA. She knew that it was responsible for regulating the state’s roller coasters and wanted to make sure the agency was aware that the Magic Mountain rides could have contributed to Christopher’s death.\n\n“I cannot attribute his death to his roller coaster ride experiences with 100% certainty,” Nam wrote in a July 2 email to Bobby Park, who runs the CalOSHA unit regulating roller coasters. “However, at this time, it is possible that he suffered an injury during his visits to the theme park.”"}, {"type": "text", "content": "The detective offered to help. “Please let me know if this case warrants additional follow-up by your office,” she wrote. “Feel free to call, text, or email with any questions or concerns.”\n\nIn the days after that unanswered email, more parkgoers suffered injuries after riding the X2.\n\nOn the evening of July 5, three days after the homicide detective sent her email, Pamela Guillen, 39, rode the coaster with her daughter.\n\nWhen the car she was riding in trundled back into the station, Guillen’s daughter saw that her mother was “sitting with a vacant stare and her mouth open,” according to a lawsuit the family recently filed. Six Flags has not yet filed a response.\n\nGuillen, who was visiting from Hawaii, managed to stumble off the ride, but a few minutes later park EMTs found her lying unconscious at the exit ramp. Two hours later, Gary Newman, the park’s vice president of maintenance, phoned CalOSHA to report the accident, relaying that a relative had said: “My cousin seemed out of it when she got off the ride so we took her to a bench and she went unconscious.”"}, {"type": "text", "content": "The next morning, Scott Prather, a senior safety engineer with CalOSHA’s theme park unit, emailed his boss. According to a state official who has viewed the email, Guillen had been diagnosed with a brain bleed and was going into surgery. The email also said that the ride had been closed for inspection and g-force testing to ensure it was operating as intended."}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/Pages-from-Guillen-Conformed-Complaint.jpg", "alt": "Highlighted text on a court document excerpt states that Pamela Guillen suffered a catastrophic brain injury on the X2 roller coaster at Six Flags Magic Mountain in California."}, {"type": "text", "content": "Six Flags hired a firm that specialized in amusement park rides to conduct the test, according to a CalOSHA source familiar with the investigation.\n\nState officials reviewed the results and authorized Magic Mountain to reopen the ride, the source said.\n\nThen, on July 9, there was another incident, according to CalOSHA records reviewed by ProPublica and L.A. Material. A woman from Nevada was visiting Magic Mountain with her family and others. They were roller coaster enthusiasts and had saved the X2 for their last ride of the day.\n\nAs soon as the ride started, the woman sensed something was wrong, according to an email she later sent to CalOSHA’s general inbox.\n\n“The back of my head was repeatedly and forcefully slammed against the back of the seat,” she wrote in the email, which was reviewed by ProPublica and L.A. Material. “I tried holding my head forward and tried pushing it back against the seat to stop the banging, neither worked.”"}, {"type": "text", "content": "When the ride stopped, she wasn’t sure whether she could stand. She couldn’t turn her head from side to side. She had nausea, sensitivity to light and a headache that reached “approximately 9 out of 10.”\n\nShe wasn’t the only one. “Three of the eight people riding together experienced similar difficulty with their heads repeatedly striking the backs of their seats,” she wrote in August."}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/c31e3718f309db1167d7bd367b58c536.jpg?w=752", "alt": "A young person with long blond hair, heavy black mascara and a septum piercing looks directly into the camera."}, {"type": "text", "content": "She also filed a formal complaint with Six Flags in July but has not received a response, she told ProPublica and L.A. Material.\n\nTwo days after the Nevada woman rode the X2, there was another, more serious injury.\n\nNaomi Greer-Wilkinson, a healthy 25-year-old from Los Angeles, rode the X2 on the night of July 11.\n\nAccording to a lawsuit her family filed in September against the park, Greer-Wilkinson came off the ride “confused and having difficulty walking.” She stumbled off and then lost consciousness. She has since had multiple emergency brain surgeries. The lawsuit says she “remains bedridden, ventilator dependent, unable to speak.” Six Flags has not responded to the lawsuit.\n\nOn July 12, the X2 was temporarily shut down. It has not reopened."}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/Pages-from-Greer-Conformed-Complaint_edit.jpg", "alt": "Highlighted text on a court document excerpt states that Naomi Greer-Wilkinson suffered a catastrophic brain injury on the X2 roller coaster at Six Flags Magic Mountain in California, only six days after a similar incident occurred with another rider."}, {"type": "text", "content": "In the wake of the ride’s closure, many amusement park patrons are asking how regulators could have missed so many signs of danger.\n\nCalifornia law requires CalOSHA to audit records related to every permanent ride each year, including reports of accidents. When amusement park patrons are seriously injured on rides, the theme park must notify regulators immediately .\n\nAnd yet, again and again, records show, regulators accepted Six Flags’ assertions that the injuries people suffered were not the fault of the X2. ProPublica and L.A. Material reviewed the state’s reports on X2 riders who were taken to the hospital from 2009 to 2022. In more than two-thirds of the cases, or 17 out 23, CalOSHA checked “no” on the form that would determine whether an investigation was warranted."}, {"type": "text", "content": "In September 2022, less than three months after Hawley died, a 28-year-old woman passed out as she exited the ride and hit her head, according to Magic Mountain’s account of the accident in a report filed with the state Paramedics took her to Henry Mayo Newhall Hospital.\n\nTwo days after the woman’s injury, Park determined no investigation was necessary. Park wrote: “Patron has pre-existing TBI [traumatic brain injury], diabetes, and has not eaten or consumed anything throughout the day.”\n\nThe woman, who survived the incident, sued Six Flags, which denied fault. The case settled in 2025.\n\nThe pattern of regulators citing preexisting conditions or rider behavior went back years. In 2011, the state noted that a 21-year-old woman had “a history of panic attacks,” so no investigation of the ride was necessary after she complained of a head injury."}, {"type": "text", "content": "In 2016, a 49-year-old woman hit her head against the headrest and asked for an ambulance. CalOSHA noted that her condition “does not appear to be related to the maintenance or operation of the ride,” adding that she “did not keep her head back” as riders are instructed.\n\nPark declined to comment.\n\nSome of the failures appear related to staffing shortages at CalOSHA. According to a 2025 staffing study by a Sacramento consulting firm commissioned by the state, audits of amusement park rides can be brief. The annual audit for a ride in X2’s class — a review meant to cover accident reports, training and maintenance reports and inspections — lasted an average of 3.7 hours.\n\nThe study also found that CalOSHA’s ride unit had been short-staffed for at least three years, with vacancies for its top job and two of four supervisor posts. There were “insufficient” supervisors for “thorough field supervision” and “inspection report review,” the report found."}, {"type": "text", "content": "Documents obtained by ProPublica and L.A. Material show Park had voiced frustration about staffing for his division since at least 2019. In an email he sent last week to his supervisor and the state department that oversees CalOSHA, Park wrote: “We have done workload studies, classification studies, begged, pleaded, and warned of the impending doom, and we are still no further along than we were 11 years ago.”\n\nHe continued: “We have failed. I have tried to do this, but I cannot continue as the dwindling supply of tools has run out.”\n\nPark had been the CalOSHA official who received the news of Christopher Gibson’s death from Nam, the homicide detective, in early July.\n\nIn late August, after the X2 had been closed for more than a month, the detective sent a follow-up email to Park about the teen’s death."}, {"type": "text", "content": "“I never heard back from you regarding my previous email,” Nam wrote. “I saw news about multiple injuries involving the X2 ride at the Six Flags. Is there anything else I need to do?”\n\nPark finally wrote back: “Apologies, I thought we responded.”\n\nPark told the detective that since Christopher had died in a hotel room, there was no way to confirm which roller coasters the teen had ridden and “it would be difficult to determine which ride to assign this to or if it even is associated with a ride.”"}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/AP26266797246775.jpg?w=2560", "alt": "A large roller coaster track is seen against a blue sky while cars drive by on a street in the foreground."}, {"type": "text", "content": "Still, a few weeks later, state officials ordered a more sophisticated g-force test of the ride, citing a series of injuries and a death over the summer. CalOSHA said in a statement that there are limits to commonly used ride testing. The standard test focuses on the torso and does not “necessarily establish the full range of movement or physical impacts experienced by an individual rider, including the potential effects on the head and neck,” the agency said. The order for new g-force testing didn’t mention anyone by name, but it did refer to an incident on June 3, the day Christopher left the park with a headache and eventually retreated to his hotel room’s closet, where he died.\n\nThe test results are pending."}, {"type": "text", "content": "Later in September, Six Flags announced the ride’s permanent shuttering without acknowledging the injuries or deaths connected with the roller coaster. “While X2 consistently passed a multitude of safety tests, we have decided to close the ride because we believe it’s the right thing to do,” Magic Mountain president Brian Oerding said in a statement . “Ride safety is a cornerstone of our business, and when we see guest confidence affected, we take it seriously.”\n\nThe post They Suffered Brain Injuries After Riding a Six Flags Roller Coaster. Regulators Pinned the Blame on Them. appeared first on ProPublica ."}], "text_post": false}, {"id": "16076ca2290ff6ad", "title": "Feedback-Linearised Trajectory Tracking via Model-Informed Robust Geometric DDPC", "url": "https://arxiv.org/abs/2611.23215v1", "source": "arXiv", "tag": "engineering", "published_at": "2026-11-17T18:56:09+00:00", "panels": [{"type": "snippet", "content": "Data-driven predictive control (DDPC) predicts system responses from recorded trajectories, but nonlinear dynamics can limit the accuracy of fixed linear predictors. This paper studies geometric robust DDPC for trajectory tracking of a fully actuated manipulator using model-based feedback linearisation. A mechanical model maps virtual acceleration commands into joint torques, while recorded data capture residual dynamics arising from imperfect model parameters. The controller minimises worst-case prediction error over an open Grassmannian ball centred at the fitted trajectory subspace. Simulat", "read_more_url": "https://arxiv.org/abs/2611.23215v1", "read_more_source": "arXiv"}], "text_post": false}, {"id": "4583d7c7c1c11e80", "title": "Multimodal Masked Diffusion Autoencoder for Modeling Impaired Driving", "url": "https://arxiv.org/abs/2611.23211v1", "source": "arXiv", "tag": "engineering", "published_at": "2026-11-17T18:50:22+00:00", "panels": [{"type": "snippet", "content": "Human cognitive state (e.g., distraction, stress), gaze, and behavior interact with the driving environment in subtle ways that AI could use to assist drivers, but ground-truth labels for human cognitive state levels are costly to obtain at scale. We propose a multimodal masked-diffusion autoencoder, ID-MAE, that adds a self-supervised objective to impairment prediction: alongside predicting the impairment label as a masked token, it reconstructs masked gaze and trajectory. To probe the effects of different modalities and types of impairments on model inference, we introduce DIVERT, a driving-", "read_more_url": "https://arxiv.org/abs/2611.23211v1", "read_more_source": "arXiv"}], "text_post": false}, {"id": "25e33490525d07b8", "title": "Learned versus Kinematic Trajectory Prediction under Reduced Observation Frequency", "url": "https://arxiv.org/abs/2611.23198v1", "source": "arXiv", "tag": "engineering", "published_at": "2026-11-17T18:38:28+00:00", "panels": [{"type": "snippet", "content": "Trajectory prediction models for automated driving are usually trained on data with a fixed sampling frequency, while positions received via vehicle-to-everything (V2X) communication arrive at 1-10 Hz. We study whether a learned predictor that uses only the observation history keeps its advantage over constant velocity (CV) and constant acceleration (CA) models when the history frequency drops. On the Argoverse 2 motion forecasting dataset, the 5 s history of the focal agent was downsampled from 10 Hz to 5, 2, and 1 Hz, and the 6 s future was predicted without maps or neighboring agents. An LS", "read_more_url": "https://arxiv.org/abs/2611.23198v1", "read_more_source": "arXiv"}], "text_post": false}, {"id": "167948bd429076bf", "title": "The Four Categories of Whitehead's Reality | Andrew M. Davis", "url": "https://www.youtube.com/watch?v=iHklT-M6HZE", "source": "Closer to Truth", "tag": "philosophy", "published_at": "2026-11-17T17:30:18+00:00", "panels": [{"type": "snippet", "content": "*What are the minimum ingredients reality needs in order to exist?*\n\nAndrew Davis explains why Whitehead's process philosophy requires creativity, actual events, possibilities, and God as interconnected categories. Davis argues that God can be understood as an intentional participant in the universe's unfolding, while acknowledging the difficulty of defining divine personhood within this framework.\n\n0:00 The Four Categories of Whitehead's Reality\n1:31 Actual Occasions and Eternal Objects\n2:58 God's Primordial and Consequent Natures\n4:03 Creativity and Actuality as Becoming\n6:36 God's Personhoo", "read_more_url": "https://www.youtube.com/watch?v=iHklT-M6HZE", "read_more_source": "Closer to Truth"}], "text_post": false}, {"id": "aea13c005f812e6a", "title": "Theological compatibilism and causal finitism", "url": "https://alexanderpruss.blogspot.com/2026/11/theological-compatibilism-and-causal.html", "source": "Alexander Pruss's Blog", "tag": "philosophy", "published_at": "2026-11-17T16:54:11+00:00", "panels": [{"type": "snippet", "content": "Aquinas thinks that it is possible for God to create a backwards\ninfinite sequence of fathers and sons. Suppose that each time a son is\nborn, the father freely decides on the son’s name. But there is a\nstrange law of nature. There is an insignificant gene that is always\npassed from father to son. The gene comes in two variants, α and β , which are expressed the same way,\nso none of the people know anything about the difference. But whenever\nthe father chooses a name with an even number of letters, by a\nmysterious law of nature (is there any other kind?) that none of the\npeople know about, the ", "read_more_url": "https://alexanderpruss.blogspot.com/2026/11/theological-compatibilism-and-causal.html", "read_more_source": "Alexander Pruss's Blog"}], "text_post": false}, {"id": "cc5169d6a52339aa", "title": "Jensen Huang’s resignation and Nvidia’s future.", "url": "https://www.readtangle.com/nvidia-ceo-jensen-huang-resigns-affair-alleged-spy/", "source": "Tangle", "tag": "news", "published_at": "2026-11-17T16:52:26+00:00", "panels": [{"type": "image", "src": "https://storage.ghost.io/c/4a/93/4a939b47-6a19-4b38-a13c-89d5a0f0d6dd/content/images/2026/11/Huang2.png", "alt": "Jensen Huang’s resignation and Nvidia’s future."}, {"type": "text", "content": "Hello and welcome to Tangle. I’m Editor-at-Large Kmele Foster — happy National Take A Hike Day. Yes, that’s a real thing, and I hope to trek a few miles this afternoon. Considering all the time we’ve devoted to routers, switches, and cutting-edge chipsets to prepare for this tech-focused dispatch on Nvidia and Jensen Huang , it’ll be nice to get outdoors for a spell.\n\nAfter today’s main topic, an enlightening look back at this day in history in 1558, when Elizabeth I acceded to the throne .\n\nIt’s a 13-minute read ."}, {"type": "image", "src": "https://storage.ghost.io/c/4a/93/4a939b47-6a19-4b38-a13c-89d5a0f0d6dd/content/images/2026/07/podcast@2x.png", "alt": "Jensen Huang’s resignation and Nvidia’s future."}, {"type": "text", "content": "Isaac Saul, Will Kaback, Audrey Moorehead, Carina Pacheco, Russell Nystrom, Isaac Wood, and Bailey Saul edited or contributed to today’s newsletter."}, {"type": "image", "src": "https://storage.ghost.io/c/4a/93/4a939b47-6a19-4b38-a13c-89d5a0f0d6dd/content/images/2026/11/4.png", "alt": "Jensen Huang’s resignation and Nvidia’s future."}, {"type": "text", "content": "You know that feeling when your phone hits 2% battery and you’re nowhere near an outlet? It’s one of those little modern-day headaches we could definitely do without.\n\nOur Tangle team recently put the AquaVault Wireless Magnetic ChargeCard to the test during a trip to NYC, and it’s easy to see why this little gadget is worth keeping close. It’s an ultra-thin magnetic charger that fits right in your wallet , so you can carry backup power everywhere without lugging around a bulky charger or tangled cords. At just 0.3 inches thin, it’s incredibly convenient.\n\nWhen you need a charge, just pull it out, snap it onto your phone, and you’re good to go. Think of it as a little safety net for your phone. It’s made by a Shark Tank company and has been featured in Forbes, Fox, and more."}, {"type": "text", "content": "It’s also the kind of stocking stuffer you might end up keeping for yourself. Give the gift of never seeing 2% again!\n\nTangle readers get 40% off with code TANGLE40, so you can gift one to everyone on your list, including yourself.\n\nJensen Huang and Nvidia. On Thursday, technology company Nvidia announced CEO Jensen Huang’s resignation following reports that he had multiple extramarital relationships, including with a woman suspected of being a Chinese spy. Nvidia has hired an outside firm to investigate the claims and has faced increasing scrutiny from public officials over its business practices. Separately, on Monday, the Justice Department and Commerce Department announced that investigations into the company associated with the alleged spy have been underway since 2024."}, {"type": "text", "content": "Back up: Huang co-founded Nvidia in 1993 and grew the company into a leading developer of computer chips used for gaming, data science, high-performance computing, artificial intelligence (AI), and more. It is one of the largest companies in the world by market capitalization, with Huang serving as a widely recognized voice on AI development.\n\nHuang is alleged to have had an affair with Alice Huang (no relation), a Chinese national and business executive who joined the Singaporean cloud computing company Megaspeed in 2023. The company then purchased billions of dollars of Nvidia chips and came under suspicion of illegally diverting those chips to China in violation of U.S. export controls. In February, Singapore barred Alice Huang from entering the country for allegedly misrepresenting her role with Megaspeed, but the country did not prosecute her for any crime or investigate her for espionage. Megaspeed has denied breaking any laws and said that Huang left the company in 2025."}, {"type": "text", "content": "Alice Huang and Jensen Huang were first photographed together in December 2023 and have been seen together in public several times since. This spring, Secretary of State Marco Rubio reportedly oversaw the drafting of a memo to top Trump administration officials informing them that U.S. officials knew of a close relationship between the two, and that they believed Alice Huang had been recruited as a spy. President Donald Trump was also reportedly briefed on the intelligence findings in October 2025 but did not take action at the time.\n\nIn a November 8 email to Nvidia employees, Huang acknowledged having an affair and apologized to his family and colleagues, though he did not address his relationship with Alice Huang specifically. Three days later, The New York Times reported that Jensen Huang also had an extramarital affair with the company’s vice president of health care; the next day, Reuters reported that he had an intimate relationship with a different employee. Neither Nvidia nor Huang has commented on these additional allegations."}, {"type": "text", "content": "President Trump and some tech leaders have expressed support for Huang in the wake of his resignation. On Monday, Trump said he “would not mind” if Huang were reinstated as CEO and rejected the suggestion that the relationship with Alice Huang risked U.S. national security. Separately, Treasury Secretary Scott Bessent has repeatedly criticized Nvidia, questioning the company’s culture and saying it requires a “dramatic shakeup” after Huang’s resignation. Bessent and Commerce Secretary Howard Lutnick, whose department is responsible for enforcing restrictions on certain AI chip exports to China, are traveling with President Trump to China this week for the Asia-Pacific Economic Cooperation Leaders’ Meeting. Ahead of that trip, the administration issued an interim final rule closing a loophole that had allowed China to access advanced compute power by renting it from data centers outside the country."}, {"type": "text", "content": "Today, we’ll have views from the left and right on the fallout from Huang’s resignation, followed by Editor-at-Large Kmele Foster’s take.\n\nIn The American Prospect, Ryan Cooper argued “this is the problem with oligarchy.”\n\n“Huang is out because, remarkably enough, Nvidia is one of the better-governed tech companies,” Cooper wrote. “That said, Huang had still made himself the center of the business in many ways. He was a quintessential Silicon Valley hero-founder, always wearing his signature leather jacket, and treated like a celebrity around the world. He reportedly had 60 people reporting directly to him, as compared to the traditional five to seven for a CEO.”\n\n“This mess leaves multiple large question marks hanging over global society… In addition to general chaos and market panic unleashed by this scandal, it may cause a sharp decline in Nvidia’s sales, if not huge legal sanctions for violating American law,” Cooper said. “What knock-on effects might that have on the financial companies that lent the money? That’s how a financial crisis gets rolling… Hyper-concentration of markets means that one man’s sexual indiscretions can become an entire planet’s economic problem.”"}, {"type": "text", "content": "In Bloomberg, Jonathan Levin suggested “questions around [Lutnick]… keep growing.”\n\n“[Howard Lutnick] has oversight of US export control programs and has to ensure that certain goods don’t fall into the hands of bad actors or anyone posing a threat to US national security. Yet, that’s exactly what Lutnick may have allowed to happen. And Congress now rightly wants answers,” Levin wrote. “The whole situation raises many troubling questions, starting with why Lutnick didn’t crack down on Nvidia chip exports to certain countries including Singapore.”\n\n“He’s also failed to insulate himself from financial conflicts of interest. Cantor Fitzgerald, which is now run by Lutnick’s sons, has drawn attention for multiple conflicts given the firm’s intersection with the commerce secretary’s own wallet,” Levin said. “Lutnick is going to have to account for all of this, in what promises to be closely watched congressional hearings that will explore possible betrayals of national security in the interest of self-aggrandizement.”"}, {"type": "text", "content": "In Semafor, Reed Albergotti said “Nvidia’s next CEO will have to keep an entire industry alive.”\n\n“Nvidia got caught without a succession plan for CEO Jensen Huang, but it wasn’t for lack of trying, according to people briefed on the effort to hire a replacement,” Albergotti wrote. “Before the 63-year-old founder was ousted, the company did try to hire an external number two, according to a person familiar with the search. It was difficult to find candidates, though, because none wanted to work in Huang’s shadow.\n\n“The Huang hangover might still be a problem even after he’s gone. There’s a Slack group at the company, for instance, titled ‘Stand with Jensen,’ and people familiar with the search process estimate there are fewer than 10 people in the world truly capable of running the company,” Albergotti said. “The next Nvidia CEO doesn’t just have to keep its own products shipping on time. The person who takes the top job also has to keep the entire industry alive. There’s really no replacing him.”"}, {"type": "text", "content": "In The Spectator, Matthew Lynn suggested “China is the real loser from the Jensen Huang affair.”\n\n“In the short term people may be impressed by the reach of [China’s] intelligence operations. It is no minor achievement to plant any agent right at the heart of one of the world’s most important companies. And yet, once all the headlines have blown over, it will have three longer-term consequences,” Lynn wrote. “Its spying operations have been sensationally exposed… China has been rumbled, and it will be trusted far less after this episode.”\n\n“Next, it will be very hard to honeytrap any more CEOs… Finally, Nvidia will have to be a lot more careful from now on. Deals that might have been possible if the honeytrap operation had never happened will now be completely impossible,” Lynn said. “The mission has rebounded on its own authors. There is still a bitter contest between China and the United States to control the technology… China has just made it a lot harder for itself.”"}, {"type": "text", "content": "In The Wall Street Journal, Peggy Noonan argued “Huang is a White House scandal.”\n\n“It is important it not be misunderstood as a merely personal story, a private matter,” Noonan wrote. “It is a story about our national security, and it carries implications in all aspects of U.S. defense and cybersecurity. It is a story about an administration’s failure to take responsibility and stop harm, for reasons that are mysterious. And of course it is about a successful top-level espionage operation carried out against America by its foremost world challenger, China.”\n\n“Mr. Trump was saying we have to beat China while his top AI adviser appears to have been helping China win the future,” Noonan said. “If the president knew about Mr. Huang’s situation and did nothing, that is a scandal. If U.S. intelligence figures alerted the Commerce Department there was a problem with a Chinese spy and cutout companies, and Commerce did nothing, that is a scandal… There should be public hearings and investigations to drill down to the bottom of this story and get to the truth.”"}, {"type": "text", "content": "In the Daily Signal, Randy Forbes said the scandal proves “why we need American tech companies.”\n\n“[Huang’s resignation is] the latest reminder of Beijing’s determination to get its hands on American technology,” Forbes wrote. “Much has been made about the artificial intelligence race between the U.S. and China, but less is said about the semiconductor components that go into AI. It’s estimated that 65% of China’s AI capacity will come from U.S. semiconductors by the end of next year. This is how significant the American advantage is.”\n\n“In spite of endless Chinese IP theft and state subsidies, the U.S. remains ahead in both AI models and AI computing components. Why? In 2025, the United States had 1,953 newly funded AI companies compared with just 161 in China. This was driven by $286 billion in private AI investment, compared with a mere $12.4 billion in China,” Forbes said. “If we want to truly beat China on chips, AI, and other tech, then we know the way forward. The U.S. should make it even easier for new entrants into the tech sector.”"}, {"type": "image", "src": "https://storage.ghost.io/c/4a/93/4a939b47-6a19-4b38-a13c-89d5a0f0d6dd/content/images/2025/05/Kmele.jpg", "alt": "Jensen Huang’s resignation and Nvidia’s future."}, {"type": "text", "content": "I was singing bedtime songs with my kids last night when I realized I’d need to rework the take you’re reading now.\n\nI’ve spent the past several days poring over scores of media reports and commentary about Jensen Huang’s resignation. The controversy surrounding his departure from one of the world’s most valuable companies is startling, all too familiar, and, at the same time, surprisingly unresolved. Originally, I wanted to write a biting rebuke of Jensen and his decision making. But as I sat with my kids last night, I felt a pang of sympathy for him. His children are grown — in fact, they work for the company he co-founded — but I imagined them together at bedtime years ago. And I imagined the shame I’d feel if my own children, at any age, were reading disreputable revelations about me in the press."}, {"type": "text", "content": "Like all of us, I’ve said and done things that hurt the people I care about. I’ve disappointed those closest to me. And for a period, during a particularly dark stretch, those weren’t isolated lapses. I’m grateful to have had the chance to make amends and grow from those experiences. And I’m especially grateful never to have made the sort of relationship-altering choices Jensen has now admitted to.\n\nBut Jensen isn’t an ordinary civilian enduring some private embarrassment. He had been Nvidia’s chief executive since co-founding the company more than thirty years ago, and his foresight helped position the company to achieve unparalleled technological and commercial heights. In October, the company’s market valuation approached $6 trillion, nearly a trillion dollars more than Apple. But by the beginning of this month, The New York Times was publishing deeply reported pieces on Jensen’s affair with an alleged spy. Jensen’s resignation followed soon after, indirectly acknowledging his marital infidelity but saying nothing specific about which of his extramarital relationships he was apologizing for."}, {"type": "text", "content": "Ultimately, Jensen is responsible for his misconduct. His actions merit serious sanction for failing in his obligations to shareholders, breaching the board’s trust, and misleading the colleagues to whom he initially denied reports of his affairs. And he’s responsible for any securities violations those failures might have caused.\n\nStill, as I mentioned earlier, our understanding of this story is still evolving. Initial reporting presented Alice Huang as a Chinese Communist Party operative and Jensen as the target of a clandestine honeypot operation, though subsequent reporting on the intelligence community’s assessments has complicated that picture. If those allegations prove true, though, this is a major scandal with major national security implications, and reports that President Trump was briefed on the matter but failed to take serious action would describe a staggering dereliction of duty. If they don’t, the injustice of Alice Huang being framed as a foreign operative deserves acknowledgment, too."}, {"type": "text", "content": "In the meantime, tech executives, investors, and one president of the United States have publicly lobbied Nvidia’s board to reinstate Jensen as CEO, citing his unique abilities as a business leader, his singular importance to the development of artificial intelligence, and the imperative to maintain American dominance in the industry. An open letter signed by Nvidia employees and shareholders stresses the importance of due diligence when adjudicating allegations of corporate misconduct, warns against a rush to judgment, and notes the uncertainty surrounding some of the allegations about Alice Huang.\n\nThey’re right that much remains uncertain. But what’s clear to me is that Jensen has forfeited two of his most valuable assets: trust and credibility."}, {"type": "text", "content": "Calls for due diligence are reasonable, but they aren’t an argument against accountability. A board’s first obligation is to the shareholders it serves, and a company’s culture is essential to keeping that relationship stable. Jensen misled the board that would be rehiring him, along with the colleagues and reporters who asked him directly about his actions. Returning him to the job without severe sanctions would tell every employee at Nvidia, and every executive watching from elsewhere, that candor with your board is optional if you’re valuable enough.\n\nI’m also less convinced than his staunchest defenders that Jensen is indispensable. He’s an exceptional executive, and few people in American business have built more consequential products. But companies of Nvidia’s scale aren’t the work of one man, however gifted, and the engineers, researchers, and managers who built its products are still there. Apple survived the loss of Steve Jobs; Nvidia can survive the loss of Jensen Huang. Insisting otherwise badly underrates everyone else who made the company what it is (and will continue to be)."}, {"type": "text", "content": "For my part, I suspect the most substantial loss here has a less direct relationship with Nvidia’s share price. Jensen is among the most persuasive public advocates for the idea that technological progress is worth wanting, not merely as a weapon in some contest with China, but as an engine of human flourishing. His pitch wasn’t always mine, but few people made the optimistic case with more authority. But that authority depends on credibility, and credibility is exactly what he’s exhausted. Whatever the board decides, Jensen can’t recover the thing that made him most valuable to determined techno-optimists like me. And his exit comes just as the doomers, cynics, and skeptics are ascendant and as a newly elected Congress decides what to do about AI and data centers. The case for progress still deserves to be made. I’m just less sure, this morning, who will make it."}, {"type": "image", "src": "https://storage.ghost.io/c/4a/93/4a939b47-6a19-4b38-a13c-89d5a0f0d6dd/content/images/2025/05/Will-Square.jpg", "alt": "Jensen Huang’s resignation and Nvidia’s future."}, {"type": "text", "content": "Take the survey: How do you think Jensen Huang’s resignation will affect U.S. AI development? Let us know .\n\nDisagree? That ’ s okay. Our opinion is just one of many. Write in and let us know why, and we ’ ll consider publishing your feedback."}, {"type": "image", "src": "https://storage.ghost.io/c/4a/93/4a939b47-6a19-4b38-a13c-89d5a0f0d6dd/content/images/2026/11/data-src-image-298965ad-ea5c-46d4-9052-55320331d92b.png", "alt": "Jensen Huang’s resignation and Nvidia’s future."}, {"type": "text", "content": "On November 17, 1558, Queen Mary I of England died childless; thus, her younger sister Elizabeth Tudor acceded to the throne. Elizabeth’s rule would usher in an age of political, commercial, and cultural power for her country.\n\nIn the mid-1500s, the English monarchy faced a succession crisis: King Henry VIII had only one legitimate son, the frail young Edward, and two daughters, Mary and Elizabeth. As a child, Elizabeth’s position was tenuous: Henry declared her illegitimate after he had her mother, Anne Boleyn, beheaded for adultery and treason. Nevertheless, Elizabeth received a high-quality education, steeped in Renaissance and Reformation values, and her tutors remarked on her intelligence and acumen."}, {"type": "text", "content": "When her father died in 1547 and her nine-year-old brother acceded to the throne, Elizabeth was alleged to be part of Thomas Seymour’s plots to overthrow his brother, who was serving as the King’s regent. After her brother’s death and the nine-day reign of Lady Jane Grey, Elizabeth’s older sister, the devoutly Catholic Mary, assumed the throne of England. Elizabeth was suspected of participation in Protestant plots to overthrow Mary and was imprisoned in the Tower of London for a time. However, Elizabeth maintained her innocence on all accusations, and she was never found guilty.\n\nUpon accession, Elizabeth restored England’s participation in the Protestant Reformation and worked hard to affirm her right to rule as a woman, without submission to male authority, and famously never married. Instead, she appeared to use the advances of her many suitors to manipulate members of her court. Under her rule, playwrights Christopher Marlowe and William Shakespeare rose to fame; England repelled and defeated the Spanish Armada; and the country temporarily cleared its national debts."}, {"type": "text", "content": "Nobody wants to see 2% battery when they’re nowhere near an outlet.\n\nThe AquaVault Wireless Magnetic ChargeCard fits right in your wallet, giving you backup power without the bulky charger.\n\nIt’s a stocking stuffer worth keeping for yourself, too! Get 40% off with code TANGLE40 .\n\nOn November 11, the SS United States was sunk via controlled flooding in the Gulf of Mexico, sending the legendary vessel underwater to begin its new life as a man-made reef. The United States holds the record for the fastest transatlantic crossing by a passenger liner, a feat she achieved in 1952, and embodied luxury ocean travel for much of the mid-20th century. However, after it was withdrawn from service in 1969, it spent its days gradually deteriorating at various dockside locations. A last-minute push by preservationists saved the ship from being destroyed, and it will now become the world’s biggest artificial reef, serving as both a marine habitat and a diving attraction. The Guardian has the story ."}], "text_post": false}, {"id": "e6fa8745836a30fe", "title": "Nagel Wins Berggruen Prize", "url": "https://dailynous.com/2026/11/17/nagel-wins-berggruen-prize/", "source": "Daily Nous", "tag": "philosophy", "published_at": "2026-11-17T16:28:16+00:00", "panels": [{"type": "text", "content": "Thomas Nagel is the 2026 winner of the $1 million Berggruen Prize for Philosophy & Culture."}, {"type": "image", "src": "https://dailynous.com/wp-content/uploads/2014/09/nagel.jpg", "alt": ""}, {"type": "text", "content": "The Berggruen Institute called Nagel, professor emeritus of philosophy and law at New York University, “one of the most significant philosophers of our time,” and praising his “long-lasting contributions through his scholarly work and commentary in the public sphere,” referencing his work in moral philosophy, legal and political theory, metaphysics, and philosophy of mind, and his contributions to our understanding of consciousness, existence, altruism, equality, justice, and free will.\n\nIn a press release , Nicolas Berggruen, the chairman and founder of the Berggruen Institute, says, “The Institute is pleased to recognize Thomas Nagel for his interrogation of the human experience and for expanding consciousness and our capacity to understand ourselves.”"}, {"type": "text", "content": "The Berggruen Prize, according to the Institute, “seeks to place philosophical thought of the highest caliber on center stage of the public discourse and to amplify its significance to society.” It was created in 2016 and is awarded annually.\n\n( Previous posts about the Berggruen Prize. )\n\nThe post Nagel Wins Berggruen Prize appeared first on Daily Nous ."}], "text_post": false}, {"id": "29fc043733436228", "title": "A Federal Women’s Prison Became a “Rape Club.” After Officials Shut It Down, Rampant Abuse Continued Elsewhere.", "url": "https://www.propublica.org/article/federal-womens-prison-sexual-abuse-reform-dublin-bop", "source": "ProPublica", "tag": "news", "published_at": "2026-11-17T11:00:00+00:00", "panels": [{"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/09/MRSH-03-feature-v6-copy.png?w=1149", "alt": "Illustration showing the profile and back of a woman's head layered with a smaller full body figure in prison uniform standing before a correctional facility yard. To the right, a uniformed correctional officer is depicted alongside a handcuffed woman being restrained, while floating items including an open lipstick tube, cigarettes and an overturned nail polish bottle appear to the left."}, {"type": "text", "content": "Officer Felix Wilder sauntered around the women’s prison like he owned the place.\n\nProne to showing up to work in gold chains and stylish jeans instead of his concrete gray government uniform, the slender 35-year-old moved, one woman said, “like he had just gotten off of a horse from a long ride.” He spoke slowly and eyed the prisoners as they walked through the drab buildings and shadeless yards of the secluded federal lockup in Aliceville, Alabama.\n\nBy the fall of 2024, some of the women there had begun to notice him hovering over a soft-spoken immigrant from Mexico who’d been in prison for only a few years. Ela, as she asked to be called, had dark hair, dark eyes and children to get home to back in Utah. Wilder was just a little too close, a little too familiar."}, {"type": "text", "content": "Ela’s cellmate, who asked to be identified as Ana, watched it all with unease. At 40, she knew exactly what that kind of attention from an officer could mean in a women’s prison.\n\nFor 15 years, Ana had served her time at Federal Correctional Institution Dublin, a low-security prison in California, where officers had preyed on the women in their care. Sexual misconduct became so rampant that staff and prisoners alike called it a “rape club.” Eventually, the FBI intervened, and prosecutors charged the warden, the chaplain and nine other officers with sexually abusing female prisoners. Hundreds of women — including Ana — came forward to tell what happened to them, not just to investigators, but also to outside lawyers who sued the system to demand change at the Bay Area prison."}, {"type": "text", "content": "Ana had hoped to leave that all behind when she was transferred out of Dublin. But tucked between the pine trees and low-slung churches of rural Alabama, the Aliceville prison had its own brand of menace. The facility had newer buildings but fewer freedoms. The roofs leaked, and sometimes the air smelled faintly of mold. The shorthanded staff often locked the women in their cells for days at a time.\n\nAnd then there were officers like Wilder, who seemed to be choosing their targets.\n\nThousands of miles from families they couldn’t call during yet another lockdown, Ana and Ela became allies. They paced. They picked at the lukewarm meals delivered on Styrofoam trays. They stared out the narrow slit of a window."}, {"type": "text", "content": "And then Ela broke down, sobbing as her words tumbled out into the stale prison air.\n\nTwo years earlier, an officer had pulled her into a closet and raped her, she told Ana, her voice quavering. Now, she said, it was happening all over again — but this time it was the stylish officer in jeans: Felix Wilder.\n\nEla said she’d reported the first assault and nothing happened. Now, she didn’t know what to do. If the prison didn’t care about one rape, why would it care about two?\n\nAs she listened, Ana felt a dull rage churning in her stomach. She thought of all the things she’d seen and survived at Dublin: the rapes, the harassment, the uncertainty of a life subject to the whims of lascivious men with badges. As she tried to comfort her sobbing cellmate, she wondered whether Aliceville was any better. Maybe, she thought, no place was."}, {"type": "text", "content": "Sitting on her metal bunk, she opened the little address book she’d bought from the prison commissary and flipped to the phone numbers for the lead attorneys in the class action lawsuit against Dublin. “Here,” she told Ela, “you can talk to them.”\n\nThe arrests and subsequent convictions of Dublin staff — 10 in all — marked the largest sex abuse scandal in the Federal Bureau of Prisons’ history and a rare moment of accountability in a troubled system where many women had learned to stop expecting it. Suddenly, every branch of government stepped in. A federal judge appointed an outside monitor. A slew of agencies issued reports, and the Justice Department dispatched attorneys to visit and evaluate women’s facilities. Congress passed a law to create a new, independent office to oversee the prison system."}, {"type": "text", "content": "But after the judge made that unprecedented move to appoint outside oversight, in early 2024 the bureau abruptly announced it would shut down Dublin and transfer its more than 600 women — including Ana — to lockups across the country."}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/10/20260910-Gordon-Prison-Abuse-268.jpg?w=752", "alt": "A brightly backlit portrait where an intense flare of white light and colorful lens reflections obscure a woman’s face, highlighting only the subtle rim of her profile and collarbone in a light-colored top."}, {"type": "text", "content": "Then, quietly, the window of accountability shut. Little appeared to have come of the promised reforms, the site visits and the reports, and Congress never appropriated funding for the new oversight office. More than a dozen current and former federal prison employees told ProPublica and The Marshall Project they’d seen few or no meaningful improvements. One Justice Department official said the only obvious sign of progress was new sexual assault prevention posters.\n\n“Nothing has really changed,” said Alix McLearen, a top Bureau of Prisons official who retired in 2024 after serving as the agency’s first administrator overseeing the women and special populations branch. “We had a horrible crisis, and crisis leads to opportunity, and this is an opportunity that has been completely squandered.”"}, {"type": "text", "content": "An official with the federal prison workers union who — like nearly every current employee interviewed for this story — asked not to be named for fear of retaliation, put it even more bluntly: “Nothing has been done to effectively change sexual abuse of inmates within the BOP. Not on a large scale or small scale.”\n\nFor the last five years, the culture that spawned a rape club at Dublin has persisted across the system. Reporters at ProPublica and The Marshall Project set out to determine how pervasive the problem of staff sexual abuse inside federal women’s prisons is — and what, if anything, officials have done to solve it. What we found was sexual assault, misconduct or harassment at most of the 27 facilities that currently hold women. We identified more than 185 cases in which prison employees have been accused of sexually abusing people in women’s prisons since 2021, the year the Dublin scandal broke. The cases implicate more than 96 officers at 16 prisons. Of those, just 19 officers have been arrested or convicted. In some cases, officers withheld food or medical care, or threatened to put women in solitary confinement if they refused to comply with sexual demands, court records allege. In others, officers locked them in windowless closets or bathrooms, choked them, or forced them to use sex toys or have sex with each other. In more than a dozen instances, the assaults were so brutal that the women were left bruised and bleeding."}, {"type": "text", "content": "Though some abusers have been prosecuted or removed, insiders say the culture of impunity that allows officers to prey on women remains. Officials have repeatedly refused to acknowledge or failed to act on signs of sexual abuse, we found. More than 25 women said that they were abused by officers who had been reported or investigated before, according to lawsuits we reviewed. In some cases, officers have covered for their abusive colleagues, court records allege. Other times, staff say that they, like the prisoners, have hesitated to report misconduct for fear of retaliation.\n\nAt a prison camp in West Virginia, an officer who’d been investigated repeatedly for suspected abuse — but allowed to remain on the job — raped a woman so forcefully that he tore her vaginal lining, according to a lawsuit she filed last year. The officer has been charged with sexually assaulting her and two other women at the camp and has pleaded not guilty. His case is set for trial early next year."}, {"type": "text", "content": "At Federal Medical Center Carswell, a facility in North Texas, an officer allegedly forced two women to have a threesome with him in his office, where he’d rigged up a doorbell to alert him if anyone came by, court filings show. A civil lawsuit has been stayed pending a criminal investigation.\n\n“We had a horrible crisis, and crisis leads to opportunity, and this is an opportunity that has been completely squandered.”\n\nAnd at Aliceville, Wilder, the officer who allegedly assaulted Ela, also abused at least 17 other women, many of whom were facing deportation after they finished serving their sentences, according to court records and interviews. He allegedly didn’t stop until the FBI showed up at the facility in the fall of 2024, and federal prosecutors eventually charged him with sexually abusing seven women . He has pleaded not guilty and is awaiting trial."}, {"type": "text", "content": "“I’m pretty sure everybody knew what was going on and they just didn’t care,” one of the women told ProPublica and The Marshall Project in a phone interview from the federal prison in Fort Worth, Texas.\n\nWe found that abuse continued even as the facilities kept passing federally mandated sexual assault prevention audits. The Texas medical facility had a flawless audit the same year the FBI arrived to investigate a paramedic whom at least 18 women have accused of sexual assault, records show. Likewise, Aliceville got perfect marks during the same time period that Wilder was allegedly preying on Ela and other women.\n\nThe officers union called sexual abuse “completely unacceptable” and blamed persistent staffing shortages for helping to create an environment that allows it to go undetected. “If we are serious about protecting inmates and maintaining safe, secure federal prisons, we have to address the staffing crisis head-on,” the union said in a statement, noting that more watchful eyes would mean “fewer opportunities for inappropriate conduct to occur behind closed doors.”"}, {"type": "text", "content": "Bureau of Prisons spokesperson Randilee Giamusso said the federal prison system has “zero tolerance” for sexual abuse and harassment. “We take all allegations of sexual abuse seriously,” she said.\n\nGiamusso highlighted the bureau’s recently revamped policy on sexually abusive behavior, which is intended to ensure that allegations are more thoroughly investigated. It also eliminates any mention of transgender or intersex people, whom federal law identifies as particularly vulnerable to sexual abuse in prison. She did not provide further details or address any specific cases, saying the bureau does not comment on pending litigation. Officers mentioned in this story, as well as representatives for the prisons, either did not respond or declined to comment on specific allegations."}, {"type": "text", "content": "As Ana and the other Dublin women, now scattered to other facilities, realized that no one was going to stop the abuse, they began to take matters into their own hands. Across the country, they encouraged other women to speak out about what had happened to them — and told them what they could do about it.\n\nThe volume of abuse allegations ballooned so rapidly that the legal team handling the Dublin case had to refer scores of potential clients to other lawyers, some of whom have taken on so many federal prison sex abuse cases that it’s become the primary focus of their law practice. We continued receiving new lawsuits, tort claims and allegations of abuse up until publication of this story.\n\n“There has been so much reporting on Dublin as an aberration,” said Susan Beaty, one of the lawyers spearheading the class action suit. “But I think it’s actually incredibly representative. I think it’s happening at basically every BOP women’s prison.”"}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/MRSH-03-inline-closet-v2-copy.png?w=752", "alt": ""}, {"type": "text", "content": "As she comforted her cellmate at Aliceville, Ana thought back to her first months at Dublin — before she’d learned how to recognize abuse in prison and before she’d seen just how much of it there was.\n\nBack then, around 2010, it seemed that almost every day she saw a handful of women eating Mexican takeout for lunch — hot meals too mouth-watering to have come from the spartan prison kitchen.\n\nAt the time, Ana was just 25 and at the beginning of a lengthy sentence stemming from her involvement in her husband’s drug-trafficking operation. So while she suspected the smuggled-in meals were the sign of some nefarious quid pro quo arrangement with the officers, she didn’t ask questions, partly because she was afraid and partly because the women shared their coveted contraband meals. “So I would just eat it and shut up,” she said."}, {"type": "text", "content": "Under federal law, all sexual contact between prison staff and people in custody is a felony — and for good reason. Prisoners cannot meaningfully give consent when they’re propositioned by people who control every aspect of their lives, from when they get fed to whether they face disciplinary sanctions that could land them in solitary confinement. So although prison sex abuse sometimes involves violent rape, it often relies on subtle coercion and grooming.\n\nPoor conditions and scarcity behind bars turn basic necessities into valuable commodities that officers can leverage to create the illusion of a “relationship” — one built on exchanging sexual favors for extra privileges and little gifts, like contraband makeup, extra tampons or a few more minutes at visitation."}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/10/20260910-Gordon-Prison-Abuse-444.jpg?w=752", "alt": "A clear plastic zippered pouch labeled “FCI DUBLIN” sits against a black background under direct spotlighting, containing a crumpled yellow mesh bag."}, {"type": "text", "content": "As one high-ranking prison official explained: “The women are getting small trinkets. It’s not big things that we can trace. He’s bringing in a hamburger, a Subway sandwich. It’s heartbreaking to look at the value of the things that are being passed.”\n\nMany times, those seeming relationships turn volatile — and violent. In Ana’s case, it began when one Dublin officer started being unusually nice to her, according to her lawsuit. He’d rush across the unit to unlock doors for her or call her into his office to talk alone. Ana thought they’d developed a rapport. But over time, he groomed her with personal questions and meager privileges. Once, he told her he’d had a sexual dream about her. Then, according to her lawsuit, he kissed her and eventually raped her."}, {"type": "text", "content": "Telling prison investigators didn’t seem like an option; Ana had already learned the hard way about the risks of reporting errant staff. A few years earlier, she had helped another prisoner file a complaint about staff misconduct. Afterward, she said, both women were sent to solitary confinement. For two weeks, Ana spent 23 hours a day locked in a cell barely bigger than an elevator. She got cold food, had no access to the phone and was barred from seeing visitors.\n\nPrison officials often isolate those who report abuse, ostensibly for their own protection , even though the Justice Department has found this practice has a “ chilling effect ” that discourages people from reporting abuse. A federal prison spokesperson said the agency’s policy does not require that people who report abuse be put in solitary — but that sometimes it is the only adequate option."}, {"type": "text", "content": "It’s not just prisoners who are afraid to report wrongdoing. Although staff are required to report misconduct under bureau policy , in lawsuits and interviews, officers say they, too, worry about retaliation.\n\n“You see all the sexual abuse, how they treat inmates. If you bring that to their attention, it’s like you’re doing the wrong thing,” said a former correctional officer at the prison camp for women in Bryan, Texas. In 2024, she reported several co-workers for having sexual contact with incarcerated women. She resigned last year after the warden moved to fire her for unprofessional conduct, documents show.\n\nEven when witnesses or victims do report abuse, investigators rarely conclude that it occurred. As of 2022, less than 10% of allegations against Bureau of Prisons employees were substantiated, meaning investigators found it more likely than not that the abuse happened in those cases. In some instances, investigators decided there was evidence the abuse didn’t occur. But more than 75% of the time, they said there wasn’t enough evidence to make a determination either way."}, {"type": "text", "content": "Officers accused of abuse face an internal disciplinary process that can take years . In many cases, they can simply retire or resign, knowing that the agency will no longer have jurisdiction to punish them once they leave. They could still face criminal charges — but bureau insiders say that many cases don’t reach that point because investigators abandon the criminal probes when an officer resigns. “Staff would know that if they were having sex with inmates, the worst that would happen is that you would have to find a new job,” one former prison official said.\n\nThe landmark law intended to combat sex abuse, the 2003 Prison Rape Elimination Act — widely known as PREA — mandates employee training and regular audits but lacks a serious enforcement mechanism. Auditors are primarily looking for policy compliance, not signs of abuse . “A facility may have widespread sexual abuse, but they’re still meeting compliance on the things they’re required to do,” said Kendra Prisk, a PREA auditor who has evaluated several federal prisons, including Aliceville."}, {"type": "text", "content": "Beth Schwartzapfel and I are continuing to report on this issue and want to hear from any prisoners or prison staff who have been sexually harassed or abused in the Federal Bureau of Prisons.\n\nKeri Blakinger\n\nI welcome any tips leading to tough accountability stories about the legal system. Right now, I’m particularly interested in hearing from federal prison employees and federal prisoners with information about untold and revelatory stories.\n\nAt Dublin, Ana said she watched the officer who’d been bringing in burritos get walked off the job by investigators. He was, according to an Associated Press investigation and several agency sources, one of about a dozen Dublin workers in the early 2010s who were quietly removed from their posts — but not prosecuted — over sex abuse allegations."}, {"type": "text", "content": "In September 2021, a new round of problems at Dublin burst into public view when the FBI arrested the facility’s warden, Ray Garcia. He was eventually charged with sexually abusing multiple women all over the compound — then lying to cover it up. In one instance, prosecutors say he abused a woman while PREA auditors were visiting. Though Garcia was later convicted and sentenced to nearly six years in prison, his attorney, Kevin Little, told ProPublica and The Marshall Project that Garcia maintained that he is not guilty.\n\nThe arrest of such a high-ranking official sent shockwaves through the system. Members of Congress began asking questions. The head of the agency, Michael Carvajal, announced that he would step down , a move he said in a recent interview was driven by concerns that Congress would not support the bureau until he left. Ultimately, 10 Dublin officers pleaded guilty or were convicted at trial, and one walked free after two hung juries."}, {"type": "text", "content": "While several of the Dublin officers could not be reached or did not respond to requests for comment, one did. John Bellhouse, who was a safety supervisor, emailed ProPublica and The Marshall Project from a federal prison in Louisiana, where he is serving a 63-month sentence after he was convicted of sexually abusing two women. Bellhouse insisted he is innocent and said the problem at Dublin was that the lower-ranking staff were “too comfortable” at the facility and too familiar with the prisoners. “It was very junior high school,” he wrote.\n\nTo Ana and the other women at Dublin, the rash of charges had made it seem for a moment like there might be change. But it soon became clear the problems were far more entrenched."}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/MRSH-03-inline-shower-v3-alt.png?w=752", "alt": ""}, {"type": "text", "content": "In the wake of the indictments at Dublin, prison officials were dispatched across the country beginning in 2022 to inspect other women’s prisons and generate internal reports.\n\nThat spring, at the low-security prison in Tallahassee, Florida, most of the women surveyed for the “Women’s Institution Cultural Assessment” said they were afraid of reprisals if they spoke freely, according to a copy reviewed by ProPublica and The Marshall Project. The last time officials visited, they said, officers had punished the women with “shakedowns” — in which officers ransack cells and destroy belongings — and told them it was in retaliation for talking to the visitors. Despite noting this and “several concerning observations,” the bureau found that sexual safety was “not determined to be a problem” at the facility."}, {"type": "text", "content": "Since then, at least 10 prisoners have filed legal claims saying they were abused by Tallahassee officers in the same year as the assessment. Six said they were sexually assaulted by a single officer, Lenton Hatten , who had previously been reprimanded by prison officials at another facility for putting money in women’s commissary accounts, “which was a warning sign of inappropriate relations,” according to multiple lawsuits. He was ultimately sentenced to three months in prison for repeatedly abusing one woman after DNA tied him to the crime. In legal filings, attorneys for the prison system admitted that Hatten sexually abused that woman but denied that he assaulted any of the others. They also denied that officials had failed to train or supervise Hatten properly. Neither Hatten nor his attorney responded to requests for comment."}, {"type": "text", "content": "At Carswell, in the summer of 2022, multiple prisoners told officials that prison staff had held town hall meetings before the site visit, threatening repercussions if anyone reported their concerns, the assessment found. Nonetheless, the team concluded that women at Carswell overwhelmingly felt it was a “physically and sexually safe environment.”\n\nBut that year, at least seven women were sexually abused by four different Carswell employees, according to allegations in civil lawsuits they’ve since filed. In one case, a woman who was partially paralyzed and required a wheelchair said she was violently sodomized in the shower by an officer who attended her Bible study group. When he heard people coming, she said he dropped her on the floor, leaving her alone to crawl back to her wheelchair, crying and bloodied. Months later, when she finally reported the assault, the nurse on duty told her she’d reported that same officer for sexually harassing other prisoners and nothing had been done about it, according to her lawsuit."}, {"type": "text", "content": "All the suits are still pending. Among the staffers named in them, only Hatten has been prosecuted. In many cases, it’s not clear whether any of the employees were disciplined by the Bureau of Prisons. The prisons agency would not answer questions about the assessments’ findings, though a spokesperson said it has continued to visit prisons and conduct assessments, which it does not release to the public.\n\nLater in 2022, a highly publicized Senate subcommittee investigation found the problem of prison sexual assault was more widespread than previously understood and, around the same time, the Justice Department’s inspector general issued a report criticizing the bureau’s handling of staff misconduct investigations."}, {"type": "text", "content": "Meanwhile, the Bureau of Prisons’ parent agency, the Justice Department, put together a working group that recommended prison officials “enhance prevention of sexual misconduct” by promoting “stronger leadership” at women’s facilities, improving staff training and installing more cameras.\n\nIn mid-2023, the department began dispatching its own teams to survey women’s prisons and make sure they were carrying out the working group’s recommendations. Nikhil Ramnaney, a former Justice Department attorney who participated in a visit to the SeaTac lockup in Washington state that summer, said the department notified prison officials in advance, giving them time to prepare. “BOP was putting on a show,” he said. And when Ramnaney and the other visitors interviewed women, the facility’s top officials stood nearby. When asked if they felt safe reporting abuse, the women offered “positive and lukewarm answers,” Ramnaney said. “In hindsight, what else were they going to say?”"}, {"type": "text", "content": "Another Department of Justice attorney who visited Carswell offered a similar assessment, and both said the department never released findings from those site visits. Neither could identify any meaningful changes the agency made.\n\nSince then, officials from the Bureau of Prisons and the Justice Department have repeatedly said the agency is working to implement the working group’s recommendations. But when asked a series of detailed questions about the status of specific recommendations, the Justice Department deferred to the prison agency. Giamusso, the prisons spokesperson, said in an email that information was “not readily available.” She added, “We have more work to do, and we are committed to doing that work.”"}, {"type": "text", "content": "By the end of 2023, there were growing signs that women were being abused at other facilities. At the camp in Bryan, Texas, it was an open secret that officers were groping women and pressuring them into unwanted sex acts, according to women and staff previously interviewed by The Marshall Project and NBC News. At the federal jail in Chicago, an officer groped and sexually assaulted at least four women in December alone, according to an indictment. That officer pleaded not guilty, and the case is ongoing.\n\nAnd perhaps most disturbingly, the abuse continued at Dublin, even while the prison was under the scrutiny of the courts and Congress in the wake of Warden Garcia’s arrest. In addition to the hundreds who said they were abused before 2021, at least 47 prisoners alleged abuse by staffers after that. Many of those allegations have not been previously reported, and many of the alleged abusers have not been prosecuted."}, {"type": "text", "content": "The abuse continued even after the agency replaced Garcia. And it continued after a sprawling legal team — including attorneys from the advocacy organization Rights Behind Bars, the law firm Rosen Bien Galvan & Grunfeld and the nonprofit legal group California Collaborative for Immigrant Justice — filed the class action lawsuit against the bureau in the summer of 2023 on behalf of Ana and hundreds of other Dublin women. They alleged the Bureau of Prisons’ systems for preventing and responding to sexual abuse were so inadequate that everyone at Dublin was at risk. The following year, the government claimed in court filings that sexual abuse was by then “virtually non-existent” at Dublin and that the facility was “not currently a sexualized environment.”"}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/10/20260910-Gordon-Prison-Abuse-186.jpg?w=752", "alt": "An anonymous portrait where a narrow vertical beam of light illuminates only a woman's right eye, forehead and cheek against a pitch-black background."}, {"type": "text", "content": "A few weeks before that claim, a Dublin officer had allegedly slammed Antonina Troyer against the wall of her cell and raped her, according to a lawsuit she filed later, which has since been stayed. Troyer said three years after she reported him, she received a letter stating that her allegation was not sustained but offering no further information. The officer, who did not respond to requests for comment, was not prosecuted and still worked for the agency as of November.\n\n“You have a huge system that just steamrolls everybody, and you’re already considered to be not trustworthy,” Troyer said in an interview. “Our word means practically nothing.”\n\nBy March 2024, the federal judge overseeing the Dublin lawsuit had grown noticeably frustrated with what she called the prison agency’s sluggish response. Judge Yvonne Gonzalez Rogers iss
