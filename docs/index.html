ared was an improved understanding of what the theory was really about. So things like that happen all the time in science, not to mention in philosophy. And so that's an example where it's not just me changing my mind, it's the community as a whole."}, {"type": "text", "content": "0:28:01.9 SC: Rue Phillips says, \"I love the recent episode with Greg Caruso. I know you're not a fan of free will discussions, but keep them coming. I'm curious how you would compare and contrast your compatibilist views with Greg's free will skeptic views, specifically on what changes to the US legal system should theoretically be pursued. I'm having a hard time understanding the differences between compatibilists and skeptics like Greg, and I'm hoping that when I should...\" Sorry, I read that without the correct pausing. \"I'm having a hard time understanding the differences between compatibilists and skeptics like Greg. And I'm hoping that when applied to a specific case, like how we might modify the justice system, might make it a little more clear.\""}, {"type": "text", "content": "0:28:39.6 SC: Yeah, unfortunately, or for the question, but not unfortunately for the world, I don't think there is much of a difference. I think what came out in that discussion, and by the way, no free will discussions coming up anytime soon. I did Christian List and that was enough for a year, but he was on one side and I thought it was fair to have someone from the other side. And Greg is a very well-spoken and well-known articulator of the other view. So we did both of those. That's enough for a while. We can cleanse our palates now and not have more free will discussions. But I think that what came out from talking to Greg was his motivation for declining the offer to use free will vocabulary to discuss human beings making choices, which he admits human beings make choices even though they're completely physical creatures. He just doesn't want to call it free will. Why not? Well, because to him, calling it free will implies this kind of moral desert. It implies a kind of way of thinking about human beings where if you make the wrong choices, you are bad and you deserve to be punished."}, {"type": "text", "content": "0:29:51.8 SC: To me, that just doesn't follow at all. That's a separate thing. Okay. I can absolutely imagine applying the vocabulary of human beings thinking things through and making choices, making the wrong choices, or bad or evil choices, whatever you want to call them, and dealing with them in ways that do not simply involve punishing them because they're bad. That just is a non sequitur. They're separate questions. One is the question of how we analyze and talk about human behavior. The other is how we organize the justice system and our ideas of what people deserve and things like that. So I don't see any real difference. As a compatibilist, I'm completely happy with a point of view that says we should try to, number one, rehabilitate people who have behaved badly. Number two, deter them from doing further bad things. And those should be the central focuses of the justice system, not punishing people because they are bad."}, {"type": "text", "content": "0:30:56.0 SC: Jeffrey Siegel says, \"I was wondering whether you think it is just as well that there does not seem to be the possibility of faster-than-light travel or communication. As I think von Neumann pointed out, since our species has evolved rather late in the development of the universe, if faster-than-light travel were possible, it's likely that a species that developed earlier might have already spread through the galaxy, including Earth, and blocked the evolution of humans. Similarly, with faster-than-light communication, a more advanced civilization might be able to hack our technology and doom humanity. Given those possible dangers, do you nevertheless hope that faster-than-light travel or communication may be possible, or do you breathe a sigh of relief that it is not?\""}, {"type": "text", "content": "0:31:35.4 SC: So I think I wouldn't exactly characterize von Neumann's point in quite that way. It is true that we have a speed of light barrier on both travel and communication, but it is not true that this is getting in the way of colonizing the galaxy or spreading throughout the galaxy. The galaxy is big, but it's not nearly as big in light-years as the age of the universe in years. In fact, the size of the galaxy, it depends on... The galaxy doesn't have a sharp edge, so you can debate how big the galaxy is, but the typical scale is tens of thousands of light-years in linear size. So the universe is billions of years old. And you can say, well, it's hard to travel near the speed of light, but maybe that would be hard even if the speed of light were not a speed limit. It's still hard to build giant rocket engines or whatever it is."}, {"type": "text", "content": "0:32:34.5 SC: So to make it easier for you or more acceptable, maybe you say, okay, well, people in advanced civilizations can build rocket ships that can go 1% the speed of light. And if you have a 10,000 light-year sized galaxy and you go 1% the speed of light, okay, it takes you 10 million years to get across the galaxy. And even if you say it takes time for civilizations to evolve and whatever, 10 million years is nothing. It's just nothing compared to the age of stars and solar systems and things like that. Even life on Earth started 4 billion years ago, right? So it's not really a barrier. Like that's... I think, that was Fermi's point. I don't know whether von Neumann said it or not. But even moving at a relatively slow pace, even if you stop... It's more likely, rather than saying that you move at 1% the speed of light, it's more likely that you move at almost the speed of light in a realistic rocket ship, but then you stop and build some settlement on a planet or whatever and then you move on. Still, it wouldn't take billions and billions of years to fill the galaxy if that was what was going on."}, {"type": "text", "content": "0:33:44.9 SC: But okay, putting that aside to Jeffrey's question, I'm not sure that it makes a big difference that there's a speed of light barrier. We're not building spaceships that go anywhere close to the speed of light, right? So it's a little bit science-fictiony to think that, oh, that's what's holding me back. Like if it weren't for special relativity, I'd be flying across the galaxy by now, right? I mean, there's other barriers out there. I think it's fine. It doesn't really... My personal preferences are not relevant to there being an ability to go faster than light or not. I think that the more you dig into how physics works, the existence of some kind of speed limit does play a role, whether it's the speed of light or not. But the fact that if I poke the universe right here, the influence of that poke does not spread throughout all of spacetime instantly is important to how things work."}, {"type": "text", "content": "0:34:41.0 SC: I'm not worried about people hacking our technology. I think that that's a little bit harder than people make it out to be. And who knows? By the time we human beings do have the ability to travel to distant stars within our galaxy, maybe we'll just be a different kind of species than we are now, whether biologically or even just morally, right? Maybe we won't want to live on other planets that might someday develop life. Maybe we'll just build habitats out in interstellar space or interplanetary space around some star, using materials from planets that have no chance ever of developing life. I don't know. And I don't know whether the other species would feel similarly to that or not. So I don't think that anyone ever will design faster-than-light travel, and it doesn't really either bother me nor give me a sense of relief one way or the other."}, {"type": "text", "content": "0:35:38.0 SC: Halfacrackpot says, \"My question for you is as an author. Let's say, hypothetically speaking, mind you, that I own copies of a few of your books. I get to see them sitting on my shelf in all their glory every time I walk into my home office. Then one day I happen to find PDFs of those same books that fell off the back of a truck. I tried my best to chase them down to return them, but alas, I didn't even manage to get their plate. Would you be personally offended or feel wronged if I used those digital copies that were not paid for?\"\n\n0:36:06.1 SC: Well, look, I don't think that the point is whether I would be personally offended or not. I am all in favor, for example, of people reading books in libraries, even though authors don't get as much money if their books are read from libraries rather than purchased at a bookstore. But I think there's an economy. This is a collective action problem, right? One person getting a book or an album or whatever, or a movie, and not paying for it is no big deal. That's not the moral problem. The problem is if you like things, if you like things that other people create and take time to do that, whether it's, again, books or music or whatever, then you want to incentivize those people to do it. Once those people are multimillionaires, the incentive might be a little bit less, but still, the basic idea is that you want to pay people for the services that they provide you, if only not for moral reasons, but because that keeps them providing those services."}, {"type": "text", "content": "0:37:08.4 SC: There's also moral reasons. I mean, I think that there is some legitimacy to saying that it makes sense morally for there to be an exchange of goods and services, et cetera. We live in this weird world where a lot of stuff is available for free, some stuff isn't. There's this whole model of advertising, right? Most, the vast majority of people who listen to this podcast do so for free, but they have to listen to ads to do it. And they will nevertheless complain about the ads, even though they're listening to a free product, and even though they also have the option of just paying for the product by going to Patreon and then not getting the ads. They will still complain about the ads. I think that people just should generally have a feeling that you pay for things that you get, and that's not bad. And of course, different people are in different circumstances. Some people can't afford to pay or whatever. The world is complicated, but I don't think that there's any moral rectitude in taking stuff for free that you should be paying for. Of course, that's not to say that various corporations or whatever don't try to bleed you dry, and that's bad, and you can talk about that. But the general idea of an economy of goods and services where people pay for what they get, I think is perfectly good."}, {"type": "text", "content": "0:38:26.6 SC: Perry Huan says, \"I'm having trouble thinking through the differences between an infinite universe that may or may not be repeating and a continuous universe that just bubbles off from itself. Is there an intuitive way to think about these distinctions?\" Well, I'm not sure what you mean by a continuous universe that just bubbles off from itself. There are models, including the one that I explored with Jennifer Chen, of a universe that does have what we call baby universes, child universes, that bubble off from the original ones. But the baby universes are not exact copies of the original universe. They sort of go their own way. So I think that there's a big difference between a repeating universe and a sort of ever-growing universe. Those are two different things. There's different ways to be infinite, basically. You can be infinite by simply repeating yourself over and over again. You can be infinite by constantly changing. I think that in the case of the universe or cosmology, both of those possibilities are 100% on the table."}, {"type": "text", "content": "0:39:29.8 SC: I propose theories. I have papers where I write and I sketch out some cosmological model. And sometimes people who are not scientists, professional physicists or whatever, seem to think that because I'm investigating a model, I must be advocating that it's true. I mean, it does have a certain sensibility, right? Like, why would you suggest this model if you didn't think it was true? Why would you suggest a false model? The point is that it's not true or false. We don't know. We're exploring the space of possibilities, right? So to know that something is a viable possibility is important, useful information. In the case of the most recent paper I wrote with Saakshi Dulani and Nadiia Diachenko, we have a cyclic universe that we claim does not have the Boltzmann brain problem, unlike other cyclic universes do. And we made the point that we're pointing out a loophole, that if you'd asked me before, I would have said that this kind of cyclic universe is not viable, because of the Boltzmann brain problem, we realized that under certain circumstances, it can be. That doesn't mean I think the universe goes that way. It means I think the universe might go that way."}, {"type": "text", "content": "0:40:41.3 SC: And sorry for Perry, I'm going away from the original question, but it inspired me to mention this idea that this is what we do as theoretical physicists. We propose scenarios. Like Stephen Weinberg in 1967 didn't actually think, because he proposed the electroweak theory, that it was correct necessarily. He thought it was a chance of it being correct. It turned out to be correct and one of the most important contributions in the history of theoretical physics. But you don't know, and that's okay. So likewise for the universe being infinite it might be infinite, and it might be infinite in a way that is never repeating, or it might be infinite in a way that is repeating, or it might not be infinite at all. All of those are very viable. We should be very humble when it comes to thinking about the very, very large-scale structure of the cosmos."}, {"type": "text", "content": "0:41:27.6 SC: Kevin's Disobedience says, \"You don't strike me as someone who is inspired by any one particular philosopher. But if you were going to teach a course on one person's philosophy, who would it be?\" That's a good question. You're right that I'm not inspired by any one particular philosopher. I'm not... In the sense that I'm not a follower of any one particular philosopher, I borrow ideas from whoever I think has good ideas. And also, the other thing to keep in mind is that if you teach a course on somebody, that doesn't mean that you're a follower of them, right? Doesn't even mean you're temporarily a follower of them. Maybe you just think it's interesting to talk about what they're saying. So honestly, there's no philosopher right now who I think I could do a good job starting tomorrow teaching a course about. Like I said, I pick and choose from what different philosophers have to say."}, {"type": "text", "content": "0:42:20.3 SC: I mean, unless it was a very modern contemporary philosopher of physics, right? I could teach a course on David Albert or David Wallace or Tim Maudlin or whatever, but that would be weird. Those people are still alive. They should teach their own courses. So probably I would go the other way around. Just for my own interest, I would teach a course on Plato or Aristotle or a group of old philosophers, the Atomists or the Sophists or whatever, because I think that'd be fascinating and useful. I would love to teach a course in ancient Chinese philosophy, but I'm incredibly woefully underqualified to do that, so I wouldn't dare. I know just enough about Plato and Aristotle that I could learn enough to teach a course. And someone like Plato is very, very entertaining in the writing. He had some crazy ideas. Aristotle's ideas were largely, I think, closer to reality than Plato's, but he's not nearly as engaging a writer. So it goes back and forth."}, {"type": "text", "content": "0:43:19.7 SC: And of course, then it also depends. Do you count Isaac Newton as a philosopher? Was Galileo a philosopher? Teaching a course on Galileo, I think, would be amazingly fun. Newton would be much harder because the Principia is really hard to read. Newton was not a good writer in any sense, not a good explainer of what he was talking about. So Newtonianism is very interesting, but I don't think I could teach a course on Isaac Newton. I could teach a course on classical mechanics in a modern formulation of it, but not the original stuff. No, that's hard to figure out what's going on there.\n\n0:43:55.2 SC: Alright, I'm gonna group together three questions. Alex West says, \"There seems to be a split opinion on OpenAI withholding their Yang-Mills existence proof from public view. Thoughts?\" Alexander Knuckle says, \"I would love to hear your opinion about the latest Yang-Mills claims by OpenAI. I'm personally very unhappy how the results are communicated, but of course I'm very interested in learning more about rigorous definitions of Yang-Mills and the standard model. PS: How do you view the significance of the actual result, irrespective of how it was communicated?\" And finally, Tyler Whitmer says, \"I have a sort of meta question about the Yang-Mills OpenAI announcement. I was struck by the different ways the various constituencies engaged by OpenAI in the math and physics worlds asked for the discoveries to be handled by OpenAI. Do you have any thoughts on how you'd prefer these things to be dealt with in the future, especially if they are directly affecting an area where you're a published expert?\""}, {"type": "text", "content": "0:44:49.1 SC: So for those of you who don't know, there is a famous math/physics problem, one of the Millennium Problems, about the rigorous existence of quantum Yang-Mills theory. So Yang-Mills theory is just a generalization of electromagnetism. These are what we talk about when we talk about gauge theories. If you've read Quanta and Fields, my second volume in the Biggest Ideas in the Universe series, you know what we're talking about when we're talking about Yang-Mills theories. QCD, the theory of quantum chromodynamics, is the paradigmatic example of a Yang-Mills theory. In some sense, good old electromagnetism is a Yang-Mills theory, but it's too simple, so we don't really think about that too much."}, {"type": "text", "content": "0:45:35.3 SC: In another sense, the electroweak theory we were just talking about, where you have the Higgs boson and spontaneous symmetry breaking, is also a Yang-Mills theory, but it's a more complicated kind of Yang-Mills theory, precisely because of that symmetry breaking from the Higgs boson. So that's why QCD, the strong interactions with gluons and quarks, is the paradigmatic version. It's complicated enough to be interesting, not extra complicated by symmetry breaking, et cetera. And what you find, well, there's also different versions. You can think about what Yang-Mills theory, what QCD would be like if there were no quarks, right? If there were only gluons. You still get an interesting theory because gluons interact with each other. Photons, at the simplest level, at the first approximation, photons don't interact with each other. In the real world, photons interact with each other a little tiny bit, simply because photons interact with charged particles and charged particles interact with photons back, and therefore you get virtual quantum-induced indirect interactions between photons and other photons."}, {"type": "text", "content": "0:46:42.8 SC: But putting that aside, the gluons just interact with each other directly. So there's a whole bunch of questions you can ask in this world of rigorously defining quantum field theories. And I'm not in this world, really, because this is a heavily mathematical world, and it's one where there's a bunch of results that are sort of a little mysterious. There are theorems in what is called axiomatic quantum field theory where you can prove things that are a little bit surprising, things that don't seem to line up with our informal, less rigorous understanding of quantum field theory, and therefore there are debates back and forth about whether axiomatic quantum field theory is missing something important, whether we should just forget about being rigorous and use effective field theories and stuff like this. Anyway, that's just a little bit of the background."}, {"type": "text", "content": "0:47:33.5 SC: The other point is that if you choose your parameters and your fields correctly, then we know that a theory like QCD has this property called asymptotic freedom. Asymptotic freedom means as you look at the interaction between particles, in this case gluons, as a function of energy, the idea of renormalization and the renormalization group tells you that the strength of the interaction depends on the energy of the particles when they're interacting. And asymptotic freedom means the more energetic they are when they're interacting, the less of an interaction there is. So asymptotic means higher and higher energies, freedom means less and less interaction. So there is a couple of informal, and that's very important, informal implications of the idea of asymptotic freedom. The flip side of asymptotic freedom is infrared slavery. So as you get to lower and lower energies, the particles interact more and more, so much so that they become confined. So the fact that you never see a gluon or a quark all by itself out there in the wild is supposed to be related to this fact that the interactions become stronger when the fields or the particles become further apart from each other."}, {"type": "text", "content": "0:48:53.9 SC: In quantum field theory, large distances means low energies. So when we talk about low energies, the interactions become strong. The interactions become strong when the two particles, two quarks or two gluons, get pulled apart from each other. So the energies become so large that it's easier to make another quark-antiquark or gluon-antigluon pair, and therefore you can never just take apart a single particle from a strongly interacting collection of particles, and that's confinement. Along with confinement, there is a related feature that there is what is called a mass gap. So if you have a single photon, a single photon has zero mass and therefore it has whatever energy you like. Its energy depends on its wavelength: longer the wavelength, lower the energy. And you can imagine, at least as a thought experiment, arbitrarily long wavelengths and therefore arbitrarily low energies. And in principle, you could go all the way to zero. You can't quite reach zero because otherwise that photon wouldn't exist if it had exactly zero energy, but you can get as close as you want."}, {"type": "text", "content": "0:50:01.6 SC: So if you think about the set of possible energies that a single photon can have, they go from just above zero to whatever you want. With gluons, it's not like that. So you ask yourself, in the theory of gluons, what is the lowest mass that a particle can have? And you might have been told that the mass of the gluon is zero, but there are no gluons all by themselves. Okay. So what we're asking is, what is the lowest mass particle that actually exists all by itself? And in QCD, well, you would have to define, do you mean QCD with quarks or without quarks? With quarks, we know there are things like protons and neutrons. There's also mesons like pions and kaons and so forth. The mesons for these purposes actually don't count because they're not stable. They're not really particles that can exist arbitrarily long all by themselves."}, {"type": "text", "content": "0:50:59.1 SC: But a proton is stable in just QCD. In the electroweak theory, it becomes more complicated, okay, but otherwise, for a very good approximation, protons are pretty darn stable. And they don't have zero mass; they have a non-zero mass. And even if you didn't have quarks, you could imagine making something like a glueball, which is a collection of gluons made up into a single particle that could exist by itself. And the idea is that its mass would not be zero. Okay. In the real world, we think that if you can make glueballs, they would also be unstable, but if you didn't have any quarks, there would probably be stable glueballs lying around.\n\n0:51:35.2 SC: Okay, so all of that is to say, in Yang-Mills theory, there's something called a mass gap because there is a smallest possible mass; it is not zero. So the photons, electromagnetism, have no mass gap. You can get as low energy as you want. In QCD, you think that there is a mass gap. So there's confinement and a mass gap. These are the characteristics that you think are important for your quantum versions of Yang-Mills theory. But we haven't been able to show any of these things in terms of rigorous proofs. We haven't even been able to show that Yang-Mills theory exists in the sense of what particle physicists mean by that. It exists in the sense that you can write down the basic principles of the theory, but you haven't proven that it exists in the sense that those basic principles add up to a well-defined, 100% rigorously defined theory. Turns out that because quantum field theory is hard and there's infinities everywhere, there's an infinite number of degrees of freedom, proving rigorous statements is just super duper hard. So one of these big open math problems is prove rigorously that there is a quantum Yang-Mills theory that exists, and if it's true, prove that there's a mass gap, prove there's confinement, things like that."}, {"type": "text", "content": "0:52:51.5 SC: So again, I don't do that kind of thing. It's a very, very niche, specialized topic, actually, because most physicists just assume that it works and get on with their lives. It seems to work, right? There are protons all around us. We can make predictions, calculations using QCD for things that happen at the Large Hadron Collider or wherever; they come out matching the observations. So this sort of mathematically rigorous level proving that the theory works is of less immediate relevance to the working physicist than to mathematicians. Still interesting and important, don't get me wrong. I'm just explaining that even though I think about theoretical physics, I don't spend a lot of time thinking about the existence or rigorous proofs involving Yang-Mills theory."}, {"type": "text", "content": "0:53:38.6 SC: So as with many interesting math problems recently, in the past couple weeks and months, there have been AI-assisted proofs. OpenAI in particular, as a company, has devoted some millions of dollars to throwing CPU cycles at proving mathematical questions one way or the other. And one of these, apparently, is the existence of Yang-Mills theory, a big, very, very important problem for mathematical physics. Okay, so that's the background. The extra bit of background is, as I understand, 'cause I've not followed it super duper closely, so anyone can correct me if I've gotten it a little bit wrong here. But the basic idea is OpenAI says they've proven it, and they say there is a verification of the proof. And what that means is you can write down the proof step by step and have it checked by a computer so you don't think you've made any mistakes. That's what people mean when they say they have a Lean verification. That doesn't mean they have a skinny verification; it means that there's a program called Lean that can check the logical consistency of your mathematical proofs. And so they say they've not only proven it, but that it's been checked by Lean, which means it's correct."}, {"type": "text", "content": "0:54:52.6 SC: Okay, but there's one thing to say that, there's one thing even for it to be true, there's yet another thing to understand what is going on. And that both means understanding as human beings what were the important missing steps that this computer used that the human beings who've been trying to prove this didn't do. What are the important conceptual moves that were necessary to getting this result? But also, are we sure that the result is correct even if it's been checked by the computer? All the computer can check is that the conclusions follow from the assumptions. Are you sure that the assumptions you put in are the ones that we care about and the ones that we would consider to be the right ones? And so what OpenAI did is rather than just releasing the proof to the world on some webpage or whatever, they assembled a small group of very, very high-level smart physicists led by David Gross, my former boss, Nobel Prize winner at KITP in Santa Barbara. And he had another bunch of people who were working with them, and they were given the proof. And as I understand it, they're gonna go through it, try to understand it, and then try to explain it to the rest of the world. And meanwhile, the rest of the world doesn't get to look at it."}, {"type": "text", "content": "0:56:10.1 SC: So if that is correct, if my understanding that far is correct, I see no problem whatsoever with this. In fact, I think it's kind of absurd to think that there's any problem with this. Look, if I do get a result as a theoretical physicist and it's in a file that I've typed up on my computer, I'm under no obligation to immediately release it to the world. In fact, I don't immediately release it to the world. I write a paper about it, I think about it, I decide what the implications are, what the best way to present it, and make figures and cite people and stuff like that. And that's what these human beings are doing. That seems 100% valid and, in fact, 100% morally right to me, as far as I can tell. I might be missing something; I might not know about some sketchiness going on there in the background. But to me, the idea that human beings are given access to the proof, they're now collaborators on the project, and they are trying to make sense of it and will explain it to everybody, that's just how science works. That's a completely everyday, conventional way of doing things."}, {"type": "text", "content": "0:57:18.5 SC: Now, we'll see how this plays out, and we'll see how it plays out in the future, et cetera. But I think that we're still not in any equilibrium phase in terms of how we balance what the AIs are able to do and what human scientists and mathematicians care about. That's something that's still very much in flux. This is an experiment in trying to figure out how to do that correctly. And look, I'm not a fan of OpenAI. I think I can criticize what they do for a lot of different things. This does not seem to be one of those times that I see anything going wrong.\n\n0:57:53.8 SC: Caleb Urian or Yaryon says, \"My son is a junior in high school and has expressed interest in pursuing a career in physics. I have an engineering background and have practical advice for him if he wanted to pursue engineering, but I'm curious what advice you have for a high school student that is considering physics.\""}, {"type": "text", "content": "0:58:10.3 SC: Yeah, so I'm asked questions like this all the time. I think I'm just gonna... I'm probably repeating myself. I don't remember what I said and what I don't. The simplest thing to say is it's very hard to give advice because everyone's situation is different. What is your son good at? What does he care about? What does he want to be? What kind of physics might he want to do? I do think that I feel comfortable saying that pursuing physics is generally good if you're interested in it. It may or may not lead to a career doing physics, but knowing physics and studying it and sort of tackling all the abstract difficulties of it is a worthwhile pursuit. So there's no reason to say, \"Oh, no, don't do that. You're wasting your time.\" Even if you end up doing something else, the training is extremely valuable."}, {"type": "text", "content": "0:58:59.1 SC: In terms of him getting ahead, there are debates about whether you should sort of study things by yourself before you get to them in your regular educational curriculum. I'm a big fan of doing that. By all means, study things by yourself, especially nowadays when there's so many resources online. There's online courses and lecture notes and whatever. I don't see any reason to wait. When I was taking calculus in high school, our calculus teacher said, \"Don't study anything that I haven't taught you because you'll learn it wrongly.\" I think that was just terrible advice. I think exactly the opposite of that.\n\n0:59:35.3 SC: In terms of preparation, learn about math, learn about physics. It's hard when you're in high school to learn sort of interesting physics, right? You don't have the mathematical tools to learn the kind of physics that physicists do at a research level on an everyday basis. You're stuck doing like inclined planes and classical mechanics and things like that. That's fine. There's a certain amount of patience that is absolutely useful and necessary here. A lot of people get tripped up because they want to skip right to the most interesting stuff, and you gotta put in your hours, right? You have to learn the basics, the background before you can get there."}, {"type": "text", "content": "1:00:15.1 SC: So learning math, learning calculus and geometry, these days learning something about computers. How the computers are going to be useful is different from month to month, so I have difficulty giving you advice about that. Don't let the computers do the work for you. Use the computers to teach yourself by all means, but make sure the ideas get into your head and make sure you're able to use those ideas. I know that the computers can solve an equation for you, but you need to understand, you being your son, need to understand what it means to solve an equation and how you would do it.\n\n1:00:51.3 SC: Because one plausible future of the relationship between humans and computers in physics is that humans are mostly interested in deciding what are the interesting problems and what are the directions in which you should look for a solution, and then they team up with the computers to turn those vague ideas about directions to look for a solution into a rigorous solution or to a careful solution. So working with the computers, both AI and not AI, but just computers very generally, is absolutely part of the skill set."}, {"type": "text", "content": "1:01:24.6 SC: Otherwise, you gotta go to college, so apply to college. I'm a pretty big believer that you can do well as a physics student as an undergraduate at most colleges. I think that people worry too much about getting to the absolute best places as an undergraduate. As a graduate student, the total number of people is much smaller. Who you're working with as your advisor is much more important. And choosing which graduate school to go to is crucially important and changes your life. When you're an undergraduate, as long as you're at a place that is big enough that they have enough resources, you cannot possibly take advantage of all the resources as a student there for four years studying as an undergraduate. So it's much more in your hands as the student than it depends on where you go to school."}, {"type": "text", "content": "1:02:12.0 SC: You can absolutely get a world-class physics education going to a big university, state school, right? Penn State or the University of Texas or whatever. You need to do it. It's really in your hands. If you go to a small liberal arts school, that can be a wonderfully useful and impactful experience in terms of becoming a good human being. It's not as good, I just have to be super honest here, even though it breaks my heart, it's not as good for being a great physicist. Because the definition of a small liberal arts school is that there's no graduate school there. So you can get a very good undergraduate education, but you can't dip into more advanced topics. You can't talk to grad students and postdocs, you can't see the professors doing research with grad students and postdocs, et cetera. There's a whole part of the experience that you just can't get."}, {"type": "text", "content": "1:03:07.7 SC: And as I say that, I say that as someone who was in that position. We didn't have any grad students, graduate programs in physics or astronomy or math when I was an undergraduate at Villanova. So I think that was a problem for me. I didn't get to take any advanced classes that I might have been able to take if there were graduate classes around. So that's the only thing that I would, if you want to be a research-level physicist, I would point to as something to really care about in your choice of universities. You can always overcome it. There's no yes or nos here. There's things that nudge you in one direction or another, and you have to decide how the nudges sum up for your personal situation."}, {"type": "text", "content": "1:03:48.7 SC: Philip Abard says, \"Do you think there may be something in Nietzsche's idea of eternal recurrence if the block universe is to be taken literally? After all, if the entire history of the universe is out there, there should be nothing to stop you experiencing your life anew after you die.\" I probably should have grouped this one with the previous question because I don't think that the two things follow from each other. Philip's asking an interesting question, but the block universe is just a way of saying, as far as existence is concerned, all moments of time participate in existence equally: past, present, and future. There's nothing special about the present time other than the version of you that is in this time is calling that now. That's the only thing special about it."}, {"type": "text", "content": "1:04:31.8 SC: But there's nothing in that block universe perspective or eternalism that necessarily implies any opinion about eternal or finite. You can have a block universe that goes forever. You can have a block universe that is finite. You can have a block universe that goes in cycles. You can have a block universe that goes without cycles. All of those are possible. So I don't think there's any necessary connection there.\n\n1:04:54.4 SC: The other thing I just want to warn, and I've warned many, many times, you shouldn't say things like \"nothing to stop you experiencing your life anew after you die.\" You are a collection of particles in this particular region of spacetime, okay? That's who you are. If there happens to be at some future or some faraway, distant part of the multiverse, or distantly in the past, another collection of particles that is very, very similar to the you that is listening to this podcast right now, that's great, but it's not you. Because you're here, okay? That is another person who just happens to share a lot of characteristics with you, but it's not you experiencing your life again in any sense whatsoever."}, {"type": "text", "content": "1:05:46.4 SC: Joshua Hillerup says, \"Would anthropic reasoning mean we should favor, with Fermi paradox explanations, ones that maximize the number of intelligent species out there who are capable of wondering about the Fermi paradox?\"\n\n1:05:59.2 SC: Well, people argue about the anthropic principle, so I'm not gonna say what the consensus is because I don't know what it is. My own view of the anthropic principle is that what it can do is to say that given who you are, okay, given what you know about your location in the universe and what you see around you and how you reconstruct your environment, all that stuff, it's fair to ask, given different cosmological models that you're trying to say, what should my credences be in these different versions of a theory of the universe? You should update them as a good Bayesian by the likelihood that at least one version of you with your knowledge and your environment and all that stuff would exist in this universe. If there are a million versions exactly the same or indistinguishable from each other, you don't get any benefit for that. You don't know which one of those you are. You can go on to ask what are the probabilities that I'm different versions of these people who are indistinguishable from me, so I don't think you get like a million times more probability just because there's a million more observers. I do think that you get extra probability or extra credence depending on the probability that at least one version of you exists."}, {"type": "text", "content": "1:07:16.4 SC: Now, the easiest and cheapest way for there to be a probability of there being at least one person like you is for there to be many, many, many people or many, many close calls in the universe. So I do think it's absolutely legit to have some boost to bigger universes, larger cosmologies over smaller ones, but not an absolute boost to an infinite number of observers over a finite number of ones. And having said all of that, I can easily imagine scenarios where in, let's say, the observable universe around us now, which has a few hundred billion galaxies, it's completely possible that we are the only intelligent species. And yet the number of regions like ours, observable universes the size of ours, is 10 to the 10 to the 10 to the 10, in which case there'd be lots of people like you, but only one in each person's observable universe. So I'm not quite sure that it necessarily has any connection to the Fermi paradox, although there's sort of an indirect connection you could think about."}, {"type": "text", "content": "1:08:23.5 SC: Callesin the First says, \"If big wormholes à la Star Trek were real, what would be the safest way to enter them? In media, wormholes act like objects on a 2D plane and spacetime bends inward perpendicular to that plane. The spaceship then enters from a direction, sorry, perpendicular to the plane, right in the middle of the curvature. But in real life, they would be spherical and spaceships could not enter at an angle perpendicular to the plane. So could one enter from any direction? It's science fiction, so maybe anything goes.\"\n\n1:08:57.9 SC: No, I think you're basically on the right track. A wormhole would be like a spherical region of space that had the property that when you look into it, you're seeing another spherical region of space on the other side, okay? So you're seeing a 360-degree view of a different part of the universe from the 360 degrees around the sphere you're looking at. And the sphere is not like a hard surface that you bump into; it's a tunnel, okay? So you literally just see the stars that would be on the other side of the sphere or whatever. So it's easy to imagine that a wormhole could be out there and be almost invisible, right? If the other end of the wormhole were in a region of spacetime that didn't have a lot of stars around it, it would just look black. You wouldn't even see anything. It would not be like the glowy thing. This, by the way, was one point of contention when they were making the movie Interstellar. Kip Thorne, who played a big role in the movie, tried to make them understand that wormholes would look a certain way."}, {"type": "text", "content": "1:10:03.3 SC: And the movie makers said, \"Look, I know, but people have heard of wormholes before. They have a certain set of expectations, and if we completely violate those expectations, they're not gonna be happy.\" So there was some compromise on trying to make the wormhole look wormhole-like and yet be physically realistic. But basically, it's a sphere, and you can enter the spherical region in any direction you want. If you enter it glancingly, then you come out the other side glancingly. That's all that really happens.\n\n1:10:34.9 SC: Tom B. Knight asks a priority question. I forget if I've already said this, but priority questions, you get a priority question once per your lifetime as a Patreon supporter, and I'll do my best to answer it because usually we get too many questions for me to answer all of them. So Tom's question is, \"Apologies in advance because I know you don't like questions about free will. It seems that many people in this debate, for example, your recent guest Greg Caruso, try to eat their cake and have it too. They acknowledge someone's lack of free will when they make a bad decision, like committing a crime, then assume others have free will when deciding how to feel or respond. It seems the practical, logically consistent position is to treat everyone as if they have something resembling libertarian free will. What do you think?\""}, {"type": "text", "content": "1:11:18.7 SC: Well, I think a couple of things. Greg Caruso, I shouldn't speak for him. I know people want me to explain the arguments put forward by my podcast guests, but I do that very reluctantly because hopefully their arguments are non-trivial and I shouldn't be the person repeating them. But I think Greg would say he doesn't believe in free will for anyone, making good decisions or bad decisions. A lot of his motivation for not believing in free will is that when people make bad decisions, he doesn't want them to be thought of as morally lesser, and therefore deserving of punishment or something like that. So I think that he's logically consistent. I think that he treats everyone the same; he just doesn't believe in free will."}, {"type": "text", "content": "1:12:02.5 SC: There's another logically consistent position, which is treating everyone as they have free will. Now, you say \"something resembling libertarian free will.\" That makes me a little nervous. I'm not quite sure what that means. What does it mean to resemble libertarian free will? Libertarian free will, remember, is precisely when you think that your actions are not only incompletely specified and unpredictable at some higher emergent macroscopic level, but truly independent of even the microscopic laws of physics. A libertarian about free will believes that even Laplace's demon couldn't predict what you were going to do next, or even probabilistically given quantum mechanics or anything like that. So I'm not sure what use or what role the word \"libertarian\" is playing in your sentence. I do think that it's consistent and logical to treat everyone as if they have something resembling free will. And honestly, like I said, I don't care if people don't want to use that terminology, as long as they treat people as rational decision-making agents, that's fine with me. I certainly would not say that they resemble having libertarian free will."}, {"type": "text", "content": "1:13:11.5 SC: David Commander says, \"How does a Boltzmann brain continue to survive? And if it can't, why isn't ongoing experiences in the moments of now insufficient to prove I am not one? In other words, if I can have false past memories, can I also have false ongoing experiences or the illusion thereof?\"\n\n1:13:28.5 SC: So I will say what I always say when it comes to Boltzmann brains: brains are not the issue. The idea of the Boltzmann fluctuation is that you tell me what it is you want to wait for to exist in the universe. Maybe it's a brain. Maybe it's a person who lives a hundred years. Maybe it's a whole solar system that lasts 4 billion years. I don't care. Whatever it is, in a randomly fluctuating universe, that thing will most often arise as a random fluctuation, not as a sensibly thermodynamic, rigorous evolution from an initially low-entropy state like we think actually happened in our actual universe. So everything is possible. Everything that is allowed by the laws of physics can randomly, in this scenario, can randomly appear. And yeah, it could... You could have false ongoing experiences. You could also have true ongoing experiences. You could fluctuate into something that was much lower entropy than the surrounding chaos and long enough for you to live for whatever time you want and have real experiences, and they'd be perfectly valid."}, {"type": "text", "content": "1:14:44.0 SC: But in addition to that, your extrapolation before the moment that you randomly fluctuated into existence would be wrong in principle. Now, there'd be plenty of fluctuations into things that were sort of kind of brain-like, or kind of observer-like, or kind of whatever, where they didn't think that they had wrong impressions of the world. That in fact is much more likely to not be blessed with these false memories. But that's not the point. The point is that given that we're asking about people who have certain memories, the chances are overwhelmingly large that those memories randomly fluctuated into existence. So don't get hung up on the brains. When it comes to the Boltzmann brain problem, the real problem is for whatever observers you care about, they're most likely to have randomly fluctuated into existence."}, {"type": "text", "content": "1:15:36.4 SC: Chris Kaltwasser says, \"I have an unpopular theory, and that is that the three-point shot should be removed from the NBA. It rewards a less exciting game. Who cares how good somebody is at shooting a long shot? I would rather see some cool plays that involve strategy, great passing, getting inside, that kind of thing. I have yet to do the research, but I don't think the three-point shot actually pays off as often as people think. I feel like players miss them more often than they make them, giving up possession without making a shot that might have taken more strategy but had better odds. What are your thoughts on this topic?\"\n\n1:16:09.8 SC: Well, I think so there's two different issues going here. I mean, you've definitely asked two different questions, but that's okay, we'll allow it this one time. One is what makes for the more exciting game, having a three-point shot or not. And the other is given that there is a three-point shot, what makes for the better strategy, using it or not. As far as the strategy is concerned, I think it is pretty clearly demonstrated that given the rules of the National Basketball Association as they are currently construed, shooting three-point shots is very good, is absolutely a good strategy. I mean, this was Daryl Morey, former Mindscape guest and former president of basketball operations at the Philadelphia 76ers, pioneered this approach very explicitly. Other people have sort of done versions of it, but he really made it very clear: the two best shots you can take are either a shot right next to the rim, a layup or a dunk, or a three-point shot. As you go further away from the rim, but not all the way to the three-point line, your probability of hitting the shot continuously goes down. And then what happens at the three-point line is that even though the probability of hitting the shot keeps going down, suddenly the number of points you get goes up discontinuously. So you get an extra bonus there."}, {"type": "text", "content": "1:17:25.0 SC: And Chris, I think that your intuition was absolutely shared by a large number of people in the NBA, both sort of at the level of coaching and playing in, let's say, the 1980s and '90s. They just didn't shoot a lot of three-pointers because they thought, well, number one, usually you miss. Number two, there's long rebounds and you don't get the rebound and it's just a less effective shot. But since then, people have run the numbers and that's just not true. The benefit you get from hitting the shots, for one thing, we have better shooters now, right? A good three-point shooter will be hovering around 40% of the shots going in, which is lower than the 50% for a good two-point shooter. But guess what? 0.5 times 2 is less than 0.4 times 3. So you get less points per shot for a mediocre two-point shot than for a good three-point shot. So I think that... Of course there's a lot of extra details there. Do you in fact have a lower percentage of offensive rebounds with a three-point shot than a two-point shot? And I think people have worked that out, but I don't know it myself."}, {"type": "text", "content": "1:18:34.4 SC: As far as the interestingness of the game is concerned, I do think, and in fact Daryl Morey has said, that there are too many three-point shots. I mean, he's interested in winning basketball games, so he encourages his players to shoot them, but he would prefer if the rules were changed so that the three-pointer was less dominant than it is now. I can see the arguments for that. I haven't really thought it through myself. It's completely misleading, I think, to people who are not basketball fans to suggest that there's no strategy involved in shooting three-pointers. Everyone knows, both on the offensive side and the defensive side of the ball, that a good open three-point shot is very valuable, and therefore the defense doesn't give that up to you. They will go to great lengths strategically to prevent people from getting uncontested three-pointers."}, {"type": "text", "content": "1:19:27.5 SC: And these days, the level of detail in tracking what happens on the court and converting it into data is very, very high. So we know what percentage of three-point shots are contested or uncontested or open or not open, high-percentage shots, whatever. It's a little bit more likely to hit the shot if you're in the corner of the court rather than at the near mid-court or whatever. They know all of those things. So there's a huge amount of effort that goes into scheming so that your good three-point shooter is left alone, able to shoot without a hand in their face. And you may or may not enjoy that aspect of the strategizing, but it's definitely there.\n\n1:20:07.8 SC: Nikola Ivanov says, \"If cosmic birefringence is conclusively detected, how could we distinguish observationally between a fundamental violation of Lorentz invariance, as explored in your early work, and birefringence caused by an evolving field in a Lorentz-invariant universe?\" So for those of you who have not been following along, cosmic birefringence is this phenomenon you can get whereby a photon traveling through space, photons have polarizations, right? Like if you have polarized sunglasses, it will let in photons that are vibrating up and down, but not right and left. And with birefringence, that direction of polarization rotates as the photon travels through space. Ordinarily, you don't expect that to happen, but various exotic physics effects can cause birefringence in the universe. One of the first was discussed in a paper that I wrote, my first ever published physics paper, with Roman Jackiw and George Field, where we were looking at a theory that violated Lorentz invariance. There was a preferred direction to the universe against which the photons interacted."}, {"type": "text", "content": "1:21:12.6 SC: Now, consistent with what I just said a little while ago, none of us thought that theory was true. In fact, we were kind of horrified by our own theory. We were not saying you should take this seriously as something that's out there. What we're saying is we have this principle called Lorentz invariance: the universe doesn't care how fast you're moving or what direction you're pointing in. But how do you know that physics actually obeys that rule? Well, you know by considering theories that are not Lorentz-invariant and then testing them experimentally. So we put forward a well-defined theory that was not Lorentz-invariant, and we showed how to test it experimentally. But it was just sort of a toy model. And indeed, it became quite a little industry for people to come up with other ways to write down theories that were not Lorentz-invariant and then test them experimentally. So it was a useful paper for that purpose."}, {"type": "text", "content": "1:22:06.7 SC: Now, later I realized that dark energy, there could be, plausibly, a rolling scalar field that fills the universe and makes it accelerate, could also lead to this kind of birefringence effect. And the same experimental results and tests that we talked about would be useful here. And in fact, the spirit of the experimental tests we suggested, but it was Marc Kamionkowski, former Mindscape guest, and his collaborators, who noticed that the cosmic microwave background would be an even better way to test it. So that credit goes to them for that. Now, so this is different, because now you have an independent motivation for caring about this new physics idea. The original idea that we suggested was really just because it was there and you can test it. Now you're explaining something different and predicting on the side as a spinoff that you get this birefringence effect. So I think it's overwhelmingly more likely that if you actually see it, it's caused by an evolving field rather than a Lorentz-violating vector field."}, {"type": "text", "content": "1:23:14.4 SC: But in fact, those two things aren't that different. You have a field that is changing with time, you take its gradient, that is to say the direction and magnitude with which it's varying, and that defines a vector. That's basically exactly the same as the theory that we looked at. It's just that the underlying dynamics are a little bit different. And neither one of those is the only way to explain cosmic birefringence. It could be birefringence that is intrinsic to the early universe, not the late universe. There's lots of different possibilities out there. So it'll be a theoretical and observational playground if any of this turns out to be verified by further observations.\n\n1:23:53.8 SC: Rich Hogg says, \"As one with a strong naturalistic bent, I would tend to think that someone else's supernatural experience was a hallucination or other misfiring of his brain. But I want to keep an open mind while not forgetting that it could happen to me. If I see a ghost tonight, how do I, as a maybe crazy Bayesian, decide whether I should update my priors or make an appointment with a neurologist?\" Well, you're clearly allowed to do both. Look, you should always update your priors. Any data that you get should constantly be causing you to sort of gradually nudge around all of your priors in many cases, but you have to... Sorry, let's back up a little bit. What are we talking about here? A good Bayesian says the probability of a theory being true given some data is proportional to two things. Number one, the prior probability that you thought that theory might have been true. And then number two, the likelihood that you would get that data if that theory were true."}, {"type": "text", "content": "1:24:53.6 SC: And so the prior probability is there, the likelihood function is also there. And so if you see a ghost, the probability of you seeing a ghost is higher on a theory where ghosts really exist than on a theory where ghosts don't exist. So you should increase your credences that ghosts exist, decrease your credence that they don't. But if your priors are so far apart already, if your prior that ghosts don't exist is 0.999999 and prior that ghosts do exist is 0.000001, that update is not going to make much difference. Okay, so don't only think about the likelihood updating, think about the actual value of the priors also. And if it happens again, then you can start updating again, and eventually, this is what a good Bayesian would do, eventually, if you get so much data that is only explained by the supernatural explanation and not by the natural one, then your credences in that explanation should become appreciable one way or another."}, {"type": "text", "content": "1:25:56.6 SC: Michael Bright says, \"Since learning even just a little bit about Einstein's explanation of gravity, I've always been bothered by the cartoon image of a ball on a trampoline. It makes it look like space has a down. If you agree with my frustration, is there a more preferable cartoonish image or set of images in your mind to visualize what spacetime curvature actually is?\" You know, I don't mind the usual cannonball or bowling ball on a trampoline or a rubber sheet or whatever. It's not supposed to be super-duper accurate. All that that is supposed to convey to you is the idea that space can be curved.\n\n1:26:30.1 SC: So there are many ways in which that particular metaphor or analogy are not accurate. Like you say, the most obvious one is there's an up and a down. There's gravity pulling on the bowling ball to stretch the rubber sheet, and that doesn't happen in the real world. So can you do better? You can try. You can try visualizing lines in three dimensions, three-dimensional space, that are distorted or curved by the presence of a massive object. But that's not very accurate either. If you think about... Once you understand the equations, you realize that we say words like spacetime is a unification of space and time, and it's really spacetime that is curved. In fact, the reason why the Earth goes around the sun has a lot more to do with the curvature of time than the curvature of space. Curvature of time is actually not a sensible concept, but the way in which the time coordinate changes from close to the sun or some other gravitating body to far away has more to do with the path that the Earth travels on."}, {"type": "text", "content": "1:27:42.6 SC: So no visualization of the curvature of space all by itself is going to be able to do the job. That's okay. Very often I get asked the more general question, like how do you visualize this or that particular difficult concept? And different people have different visual things in their head. They have lines or curves or shapes or whatever. They have three-dimensional vector spaces, and those stand in for 10 to the 10 to the 10-dimensional vector spaces. But ultimately, the visualizations are not the point. Understanding the concepts and the equations behind them is the point. That's why I wrote Space, Time, and Motion, so that if you care about understanding the equations, you can get those. Sadly, the world is more rich and large and multifaceted than our visualization capacities are really up to."}, {"type": "text", "content": "1:28:35.1 SC: Zach McKinney says, \"The prevailing cultural narrative around AI is one of inevitability and runaway proliferation. However, this chain of reasoning never seems to reckon with the planetary boundaries of finite material resources and energy. On what timescale, if any, do you foresee the proliferation and diffusion of AI to become constrained by such limits?\" Well, look, I'm not sure that is the prevailing cultural narrative. I think that there may not be a prevailing cultural narrative. Different little subcultures have their own narratives, and it depends on which one you're embedded in. But also, again, I'm not sure I mind this runaway proliferation kind of talk as a possible future. I'm not saying that I think it's the likely future, but that talk has to be understood in a certain way. When people talk about exponential growth of anything, they're never being perfectly accurate. Unless you're literally talking about the universe itself, nothing grows exponentially with an unbounded time horizon because there are bounds, there are finite numbers of resources."}, {"type": "text", "content": "1:29:37.5 SC: So if you have the famous S-shaped curve, the sigmoid curve, that is flat and then it starts going up and then it turns over and it's flat again. So that's an approach from one kind of steady-state equilibrium phase to a different steady-state equilibrium phase. In the beginning, at the very start of that transition from the first state to the curve, it looks exponential, right? Every exponential in physical reality is probably going to really be some kind of sigmoid curve or something even more complicated than that. It's just a statement about the initial steps. So extrapolating these ideas to the wild future is not an accurate thing to do, and everyone should know that. Now, having said that, what are the limits? What are the boundaries? What are the limits that we have on resources and energy? That's hard to say. We can always just do some back-of-the-envelope calculation of how much energy we have on Earth, but maybe you're not on Earth. Maybe you're collecting energy elsewhere. So I think that there are factors and considerations that will change the future of AI before, long before we start worrying about the total amount of energy we have available here on Earth."}, {"type": "text", "content": "1:30:53.8 SC: Michael Aster says, \"Since you've talked about how you like the game, how would you feel if Kingdom Rush reached out for a sponsorship on the podcast?\" I'd be thrilled if they did that. I would love it. It's always better. I don't ever advertise things that I think are bad, but often I'm advertising things that I haven't previously experienced and I have to sort of do homework on them. So whenever I get the chance to advertise something that I'm super familiar with and love, then I'm always happy to do that. So yeah, if Kingdom Rush wants me to advertise things, if any watch companies want me to advertise things, if the Philadelphia 76ers want me to advertise season ticket plans, I am more than happy to do that."}, {"type": "text", "content": "1:31:36.5 SC: David Sotalongo says, \"In the April 2023 AMA, you said, 'I think we need to build a lot more housing. I think it is very, very obvious that's the best way to make housing more affordable, to build more of it.' I agree, and I'm curious how you think we should go about building more housing. Should the government step in to build and maybe manage such housing? And what, if anything, would you do about existing homeowners who oppose new housing because it would decrease the value of their property?\"\n\n1:32:01.0 SC: Well, so number one, I have no informed opinion about this. Whatever I say in the next few minutes, don't put a lot of credence on them. I'm not an expert on housing policy, okay? That's not just one of the things that I know a lot about. I do have experience with the kind of limitations, the constraints that are put on homeowners to do different things. When I lived in LA, which we did for a long time, we lived in a townhouse. So it was a group of six homes, and we were in this unusual situation for Los Angeles where we really had almost no outdoor space, right? No yard or even tiny porch or anything like that. And so obviously that was a thing that would have been nice to have. And we had the idea, well, maybe we could save up and put a deck on the roof, a roof deck for the townhouse. Because a flat roof, again LA, you just have a flat roof. You don't need to let the snow fall off your gabled roofs or anything like that."}, {"type": "text", "content": "1:32:59.0 SC: So we looked into it and it was just, we put money into not getting permits, but figuring out how we would be able to get the permits to do this. And eventually we gave up before we even got the permits because it was just clearly going to be too much work. So one thing we can do, that's not even building a house, that's just putting a roof deck on the house that you own. One thing we can do is just go through and make it easier to build housing responsibly. I don't mean remove all regulations and let people build housing that is dangerous or not up to code or whatever. Just grease the wheels, make it easier to do good things for society. And I think that having more housing is a good thing. Make it easier to take existing housing and renovate it and sell it. Just make it easier, because that's not obvious. That's not something that we put a lot of effort into, taking existing sets of regulations and making them just as effective but easier to navigate, right? We're not very good at that as a society or a government."}, {"type": "text", "content": "1:34:01.3 SC: Governments building housing, that's fine. I don't think it's ever the real solution to anything. I think that we want the housing market to be thriving in terms of both people building houses and people buying houses and people selling houses. A house is very often the most expensive transaction that a person ever gets involved with. Of course, many people just rent or whatever, but if you buy a house, that's a huge amount of money. And I don't think it should be that much of a huge amount of money. I think they should be less expensive. Now, like you say, there's a constituency that's against that because they don't want their current home value to go down. So number one, I don't think it's gonna go down that much no matter what we do. Number two, too bad for them. But number three, and most importantly, it's a house. It's not an investment, right? I mean, it's an investment in some technical sense, but the reason why you have it is not primarily to be an investment, it's primarily to live in it."}, {"type": "text", "content": "1:35:06.0 SC: And what happens is if you have a house and its value goes down because the entire housing market is going down, then guess what? If you sell it to buy a new house, that new house's value has also gone down. So I just don't think it's that big of a problem. I mean, unless you're someone who owns multiple houses because you're trying to get investment income from it or something like that, and then, sorry, investments are tricky and unpredictable and that's life. We have to learn how to deal with it.\n\n1:35:38.6 SC: Alan Lubell says, \"Your intelligence and generosity of spirit has really made an impact on me. I'm asking if you feel you received these qualities from your parents or any other influences when growing up, and if you could give a couple of examples.\" That's very sweet. Thank you, Alan. I appreciate the compliments. I usually don't try to read out compliments here. Sometimes they precede a question, but this one was kind of relevant to the question. And I'm not even gonna give a very good answer to the question because on the one hand, yes, I absolutely was influenced by my parents, mostly my mom. My parents got divorced very early, so it was my mom who raised my brother and me. But also other people: friends, teachers, other relatives, other grown-ups who I got to know, and also books that I read and things like that. So I kind of suspect, maybe this is not true for other people, I don't know, but for me, if I tried to associate some quality I have now with the example or influence of some particular person in the past, I probably wouldn't be doing a very accurate job."}, {"type": "text", "content": "1:36:40.9 SC: Like you could imagine that you'd put your finger on it, but I tend to think that, in fact, people are just sort of gradually influenced by many, many, many, many, many things over the years, and it's very hard to pinpoint when there was some crucial influence that made a difference. I don't think it's a matter of one person telling you one little bit of wisdom that changes your life. I think it's a matter of being in the presence of people who live well and try to be good people and implicitly picking up from the atmosphere around you that that's a good way to be. So I still try to learn from the people around me. I try to hang out with people who I admire. There's some point in your life in which you realize, no, it's actually not worth hanging out with these people who are talented or useful in one way but really bad human beings. I would rather hang out with people who are good human beings and maybe that will rub off on me."}, {"type": "text", "content": "1:37:35.0 SC: Miron Mizrahi says, \"In the last AMA, when you discussed neutrino oscillations, you said something that sounded a lot like the uncertainty principle. There is no state when the neutrino has both a definitive mass and definitive flavor. I get how this can work for a single particle or field, but how does it work for three? Or is there one field for all neutrinos and the mass-flavor combinations are just different values of the field?\"\n\n1:37:58.7 SC: Yeah, this is a good question. It's a little bit subtle. I'm not sure whether the answer I give is going to be clarifying or not, but I can try. If you just had a single particle, then you wouldn't have uncertainty about mass and flavor. There's only one flavor and only one mass, right? So it's not a mixture. I think the way I think about it, I'll be honest, I haven't really thought about it in terms of an uncertainty principle, and therefore I think it's not the uncertainty principle. I think there's a different thing going on because I think it would be true even classically is the point. The uncertainty principle is truly a quantum mechanical statement. It's a relationship between observables, like let's say position and momentum, and quantum states. In particular, the usual, the standard, famous, celebrated uncertainty principle is in any quantum state of a single particle, you cannot be highly localized both in position and momentum at the same time."}, {"type": "text", "content": "1:39:03.4 SC: If you define the standard deviation or the variance as delta X and delta p, then delta X times delta p has to be at least h-bar over 2. Okay. So that's a completely quantum mechanical statement. There's no classical analog to that. In the classical particle, I can and often imagine doing, telling you both the position and the momentum precisely. But for quantum mechanics, the notions of position and momentum aren't precisely defined things. They're observables that have different probability distributions of getting different answers. That's not really what's going on with the neutrinos. With the neutrinos, what matters is that they are fields, okay? That they're fundamentally neutrino fields. And even before you quantize them, you can talk about the classical fields. And fields are things that have different values in different points in space."}, {"type": "text", "content": "1:39:53.5 SC: And there are, roughly speaking, three neutrino fields, okay? I say roughly speaking because you can get into, well, do antineutrinos count differently and do different spins count differently? Forget about all that, okay? There's, for our purposes today, three different neutrino fields. And you can rotate them, so these three different neutrino fields form a vector space, which is very similar to quantum mechanics in some ways, but that's just because vector spaces are everywhere. It's not because there's any true intrinsic deep relationship there. So you can think of electron neutrino, muon neutrino, and tau neutrino as basically three axes in the three-dimensional space of the neutrino field. And any one neutrino is a vector, is represented by a vector in that three-dimensional vector space. So that means it has a component that is the electron neutrino component, a muon neutrino component, and a tau neutrino component."}, {"type": "text", "content": "1:40:50.1 SC: And then separately, there's a different set of axes, a different set of basis vectors for the three mass states of the neutrino, which are cleverly named m1, m2, and m3, okay? And the point is that the mass axes are not exactly aligned with the flavor axes. So if you are a state of definite mass, then you're not gonna be a state of definite flavor for exactly the same reasons as if I take a two-dimensional vector space with x and y coordinates and I rotate those coordinates to x-prime and y-prime, a value that is a certain value of x-prime and then zero for y-prime is gonna be a combination of the original x and the original y. So it's really just rotating vectors in field space, nothing intrinsically to do with quantum mechanics or the uncertainty principle."}, {"type": "text", "content": "1:41:45.7 SC: Dylan Samuel says, \"I'm a teaching assistant for a mechanical engineering class, and I'm pretty sure that a very large percentage of the class is using AI to do their homework, as their test scores tend to be vastly worse than their homework scores. Recently, a UC Berkeley professor made news saying they no longer see the point in grading their students' homework. Apologies if you've answered something similar before, but what are your thoughts on this? And generally, how are you adapting to teach with students knowing they'll likely use AI? It seems counterproductive to pay for college and then not learn anything.\"\n\n1:42:15.9 SC: Yeah, this is something where professors are talking about this a lot right now. It's a sea change in how things get done. There were always ways to cheat on homework sets, right? You could work together in ways that the professor told you not to. You could search the internet for maybe this problem had been done before and answered. Now it's just much easier with AI to find the solutions. And so the way that I think about it is, for professors, it was always the case that their goal was to make the students learn things. And for the students, some of them had the goal of learning things, but we gotta be honest, some of them just had the goal of getting good grades because they wanted to get a job or into grad school or medical school or whatever."}, {"type": "text", "content": "1:43:05.0 SC: And the fortunate thing for the professors was that the goal of teaching them things and the goal of them getting good grades happened to line up. The best way for the students to get good grades was to learn things and therefore do well on the homeworks and the tests. So that system was sort of sensible. Nowadays we've broken that connection. If all you do is give out homeworks or take-home exams, which, by the way, before I got to Johns Hopkins, I'd never given an in-class exam before in my life. And it's not Johns Hopkins' fault, it's just I got here around the time that ChatGPT arrived. So I would give out take-home exams, and of course the students could in principle these days do those by using AI. And so you could in principle get very good grades on all those exams without actually learning anything. So therefore you have to change the way that you test people. I still give out problem sets, but the problem sets aren't worth that much of your grade. They're basically very explicitly given out in order for you to practice so that when you take the test, which is in-class, you are prepared for that. And obviously no computers in class or anything like that for the exams."}, {"type": "text", "content": "1:44:23.0 SC: And if the students... I tell the students, look, if you want to use AI to, or for that matter, if you want to collaborate and have friends help you on the problem sets, go ahead. It's your choice, because it's only 20% of your total grade. 80% of the grade is how you do on the exams. And if you're depriving yourself of the practice that you get by actually doing the problem sets yourself, then you're gonna do worse on the exams and you're not gonna get a good grade. So I'm not sure if that's feasible for everybody, depending on the class, depending on what you're doing, but it's the world. You certainly cannot rely on the fact that just because a student is in college, they're gonna do the best thing possible to try to learn things. There are reasons to go to college other than learning things. For many of us, learning things was the point, not for everybody. And you have to accept that and adapt accordingly."}, {"type": "text", "content": "1:45:16.7 SC: Tucker Hyatt says, \"Am I mistaken to interpret Newton's second law to include the notion that forces cause accelerations, and to want something similarly causal in a quantum field theory worldview? Please don't make me give up on causality.\" So you should give up on causality, Tucker. Sorry about that. At the level of fundamental physics, causality is not there. In fact, this was the subject of a famous article and quote by Bertrand Russell, of all people, over 100 years ago. He was pointing out that causality used to be something that philosophers hung on to with great fondnes
