 much of it is price inflation and reexport trends rather than direct growth in economic output."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!ne3I!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F502e83c7-2322-4e31-9c1a-337b9a274591_2886x1843.png", "alt": ""}, {"type": "text", "content": "Stepping back, that surge in gold exports has allowed the UK to leapfrog over China and the EU to become Canada’s new 2nd-largest export destination. Yet even excluding the rapid increase in British trade, Canada’s non-US exports are still at a record high. Exports to China are up 52%, exports to the EU are up 42%, and exports to other countries are up 18%."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!n_vr!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4fe5974e-e371-4cab-9d03-85708224c29f_2886x1843.png", "alt": ""}, {"type": "text", "content": "With regard to China, Canadian exports of energy, raw ores, and minerals have more than offset a decline in agricultural exports. Rising energy prices amidst the American war with Iran have forced China to seek out other fossil-fuel providers, and ravenous global demand for industrial inputs has helped redirect Canadian metal production away from the US. Canadian agricultural exports have not recovered from the Chinese counter-tariffs placed when Canada taxed Chinese EVs during the Biden administration , yet an agreement signed earlier this year has already undone some of the export losses. Overall, Canada’s export diversification has not been wholly reliant on one product or one partner."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!0Zda!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F434da574-9afd-44e8-a002-8b8978753b04_2886x1843.png", "alt": ""}, {"type": "text", "content": "On the import front, the changes have been less dramatic—Canada was already less reliant on America as an import source than as an export destination, and so the trade war has only driven gradual broad-based increases in Canadian purchases of non-American goods. Even Canada’s much-publicized decision to suspend its 100% tariff on Chinese EVs and instead implement a 49k-vehicle quota has been less impactful than expected, with fewer than 16k slots used so far . The trend is still clear, though, as Canada’s import reliance on the US continues declining to new lows."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!YG_e!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0985e951-5139-4d05-9e41-45a018393f35_2886x1843.png", "alt": ""}, {"type": "text", "content": "Shifting further away from the United States will require a long-term reorienting of Canadian infrastructure—hence the opening of the Major Projects Office to fast-track the pipelines, ports, and power lines needed to get Canadian goods to overseas markets. Designating the Pacific Link pipeline, which will connect more Albertan oil to Canada’s west coast ports, as the office’s first national interest project was an obvious signal that the government is serious about prioritizing export diversification. Real Canadian investment in this kind of transportation and utility infrastructure is now continually hitting new record highs, already up 42% from this time in 2024.\n\nBut so far the Major Projects Office has been fighting a losing battle against the overall downturn in the business environment—Canadian investment in factories, mines, and plants has declined significantly across Carney’s tenure, counteracting the rise in infrastructure construction and leaving overall industrial investment flat. To succeed in the difficult economic work of decoupling, Canada will have to reinvigorate its manufacturing sector in addition to renewing its infrastructure."}, {"type": "text", "content": "Subscribe now\n\nWhen Trump first began his trade war against Canada and Mexico, I wrote that the two countries could “outlast him politically even if they cannot economically” as tariffs would likely cost Trump support while causing voters to rally around Carney & Sheinbaum. That’s certainly been borne out, as Trump has been forced to ease Canada tariffs several times for political reasons, most recently exempting several agricultural supplies in a last-ditch bid to save the Senate campaign of Maine’s Susan Collins . Meanwhile, Mark Carney is more popular than ever.\n\nThis should not be surprising, as the majority of the economic costs of tariffs are paid by the country imposing them. American tariffs on Canada were particularly counterproductive because so many Canadian goods are intermediate inputs for American factories, and Canada is one of the few countries where the US actually ran a surplus in manufactured goods. The damage on the American side of the border has been larger, even if Canada’s situation is more existential because its economy is proportionally smaller."}, {"type": "text", "content": "If Democrats do take control of the House and Senate in the midterm elections next week, Trump will likely refocus on trade wars and foreign policy given his reduced power over domestic affairs. The administration has constantly talked about “renegotiation” of the USMCA trade agreement signed in Trump’s first term but has repeatedly put it off; they will certainly have to address it during their last two years in power. When they do, Canadians will be thankful they aren’t quite as dependent on America as they used to be.\n\nThanks for reading! To receive more new posts on economic data analysis, consider subscribing!"}], "text_post": false}, {"id": "5aa675242051ef18", "title": "An Argument for Vastly Many Observers Smaller than a Proton", "url": "http://schwitzsplinters.blogspot.com/2026/10/an-argument-for-vastly-many-observers.html", "source": "The Splintered Mind", "tag": "philosophy", "published_at": "2026-10-25T17:29:45+00:00", "panels": [{"type": "snippet", "content": "Here's an argument that I'm sure will give my philosopher of physics collaborator Jacob Barandes the fits.  The conclusion will be that there are vastly many complex structures smaller than a proton, right here in our region of spacetime, populated by vastly many scientific and philosophical observers.  Look at that drop of water running from the faucet to the drain.  Within it are many tiny people, living many tiny lives. [ Cancer can go hang. I'll keeping fly my weird philosophical speculations on this blog as long as I can.  Naturally, I'm hoping to land in the long statistical tail, so tha", "read_more_url": "http://schwitzsplinters.blogspot.com/2026/10/an-argument-for-vastly-many-observers.html", "read_more_source": "The Splintered Mind"}], "text_post": false}, {"id": "9cb4f49a0583535d", "title": "It took me seven months to get my baby an Australian passport", "url": "https://caseyhandmer.wordpress.com/2026/10/23/it-took-me-seven-months-to-get-my-baby-an-australian-passport/", "source": "Casey Handmer's Blog", "tag": "engineering", "published_at": "2026-10-23T23:22:21+00:00", "panels": [{"type": "text", "content": "I’m an Australian father of four, living in the US. Something of a corner case. Nevertheless, getting my kids Australian citizenship by descent, and then Australian passports so we can fly home legally, has kicked off a carnival of errors with a very dark side.\n\nAustralia is generally thought of as a developed western liberal country with relatively high state capacity. And I have generally found that at least state government services, now administered through centralized offices, have become more efficient over time.\n\nPassport applications for children living overseas, however, remain a time machine with a difficult security overhang.\n\nAustralian citizens can’t get Australian visas, so in practice an Australian has to enter Australia on an Australian passport. Okay, fair enough. So how does one get a passport for a foreign-born Australian citizen in this year of our lord 2026?"}, {"type": "text", "content": "This seems like quite a process!\n\nWhy?\n\nBabies are relatively fungible, in that they can’t talk and are easily transported. Millions of people would like to move to Australia, and for most of them there is essentially no legal way to do this. So Australia, being a relatively small yet well-developed country with its own spin on sovereign functions, is under unusually high pressure by sophisticated fraudulent and/or criminal actors attempting to obtain Australian travel credentials illicitly. Trafficking is also a thing. I don’t really want to elaborate on this, but as a parent I am prepared to spend unreasonable resources to protect children – but I don’t believe the current process actually does this."}, {"type": "text", "content": "So I can understand why Home Affairs and DFAT would develop a laborious, high friction process that is intended to make it difficult to defraud the commonwealth and harm children.\n\nThe purpose of this post is to make explicit that what passed for a state-of-the-art identity verification process in ~1980 no longer passes muster and that new technology and standards provide simultaneously a far lower cost (encouraging lawful compliance) and far higher reliability (quelling unlawful activity) method for establishing who can travel to Australia and under what conditions.\n\nAlthough I successfully navigated this process earlier this year for my newborn, I decided to raise concerns with the Department of Home Affairs, which owns Form 1195. What follows is my correspondence on this matter with the relevant authority in Australia, following Patrick McKenzie’s (patio11) standards of professional communication."}, {"type": "text", "content": "Casey Handmer\n\n<redacted>, United States of America\n\n15 May 2026\n\nMr Damien Kilner\n\nFirst Assistant Secretary\n\nCitizenship, Humanitarian, Family Visa Programs & Support\n\nDepartment of Home Affairs\n\nPO Box 25\n\nBelconnen ACT 2616\n\nAustralia\n\nRe: Form 1195 (Identity Declaration) — proposed modernisation, with cost-benefit analysis\n\nDear Mr Kilner,\n\nI am writing this in the hope it reaches someone who has been waiting for an outside party to give them air cover to ship the obvious change. I have just completed Form 1195 for the fourth time, on this occasion for an infant, and the experience prompted the observations below. They are offered constructively. The Department employs thoughtful professionals; the form does not reflect their best work, and I suspect most of them know this."}, {"type": "text", "content": "What the form actually does, mechanically.\n\nForm 1195 requires an applicant to (1) complete a PDF, (2) print it, (3) obtain a passport-sized chemical photograph adhering to a very particular set of requirements, (4) physically deliver both to a member of a prescribed occupation list, (5) have that person glue the photo to page 4 and sign across its front, (6) sign page 3 themselves, (7) scan the assembled document, and (8) upload the scan plus a separate digital copy of the same photograph through ImmiAccount. The instructions on pages 1–2 still describe a paperclip-and-sign-the-back workflow superseded by the current glue-and-sign-the-front workflow on pages 3–4. The form is, internally, two forms — one from before approximately 2022, one from after — laminated together. An applicant must read both and reconcile them at runtime."}, {"type": "text", "content": "What the form is supposed to do.\n\nBind an applicant’s identity to a photograph via attestation by a trustworthy third party who can be independently verified.\n\nWhat the form actually achieves toward that goal.\n\nApproximately nothing, in the current workflow. The signature-across-photo ritual is a 1970s tamper-evidence control designed for a document that would be physically inspected. Once scanned, the property it provides — that the photo cannot be substituted without destroying the signature — vanishes. Any reasonably motivated bad actor can composite a signature across an arbitrary photograph in any image editor in under two minutes. The Department receives a PDF; it has no way to distinguish a PDF assembled from a legitimately-signed physical artefact from one assembled digitally from any photograph the applicant chose."}, {"type": "text", "content": "The “qualified occupation” list (39 professions, ranging from pharmacists to veterinary surgeons to permanent Australian Postal Corporation employees with five years of service) provides somewhat more value, but only if downstream verification occurs. To the best of my knowledge, the Department does not call nominated declarants to verify the declaration in any but a vanishing fraction of cases. The signal is therefore the signatory’s name and license number, neither of which is cryptographically bound to anything.\n\nEstimated cost of the status quo.\n\nAustralia processes on the order of 70,000 citizenship-by-descent and evidence-of-citizenship applications per year. Each requires Form 1195. Conservatively:"}, {"type": "text", "content": "Total deadweight cost to Australian society of running Form 1195 in its current form: conservatively A$15–25M per year .\n\nEstimated fraud prevented.\n\nDifficult to know precisely; the Department has the data, I do not. But two indicators are telling. First, Section 50 prosecutions for false statements on citizenship applications run at a handful per year nationally, against a base rate that is almost certainly orders of magnitude higher. Second, the controls are, as described above, cryptographically meaningless in the digital workflow. The reasonable prior is that Form 1195 in its current form prevents low-effort fraud (a teenager attempting to forge a citizenship claim with no resources) and prevents essentially no professionalised fraud (the actor category one actually cares about). The friction is therefore distributionally regressive: borne entirely by legitimate applicants, evaded trivially by sophisticated bad actors."}, {"type": "text", "content": "The obvious replacement.\n\nAustralia operates myID (formerly myGovID), an LOA3 identity-proofed credential issued by the ATO and accepted across Commonwealth services. The Department of Home Affairs is in the process of integrating with the broader Digital ID ecosystem under the Digital ID Act 2024. The infrastructure to do this correctly exists . It is being used for other things. It is not being used for Form 1195.\n\nA modernised flow:\n\nNo glue. No printing. No scanning. No 39-occupation list, because the constraint that the attestor be identity-proofed is now enforced by the credential rather than by self-declaration. No reconciliation of contradictory instructions across pages. No declarant date-ordering ambiguity. No photograph compliance rejections, because compliance is checked at capture."}, {"type": "text", "content": "Estimated cost to build.\n\nMost components exist. The ImmiAccount platform exists, myID exists, in-app photo capture with liveness exists in the Passport Office’s tech stack, verifiable credentials infrastructure is being built out under the Digital ID Act. The work is integration, not invention. A realistic estimate: 6–12 months of engineering work at perhaps A$3–5M all-in, including the policy work to authorise digital attestation under the Australian Citizenship Act 2007. This process also exists as a commercial product provided by O(100) internet identity services, whose typical customer set includes banks verifying KYC/AML as part of their sign up flow, who face a similar depredatory attempted fraud pattern, high consequences of failure, and a customer base sensitive to unnecessary friction."}, {"type": "text", "content": "Payback period: under six months on deadweight loss alone. Fraud reduction is upside.\n\nAnticipated objections.\n\n“The Act requires a physical signature.” It does not. Section 50 prescribes consequences for false statements; it does not prescribe the medium. Numerous Commonwealth instruments accept digital signatures under the Electronic Transactions Act 1999. The constraint is administrative practice, not statute.\n\n“Some applicants don’t have myID.” True today; the proportion is falling, and the modernised flow can preserve the legacy 1195 as a fallback for the narrow set of cases (typically: applicants outside Australia in jurisdictions where myID enrolment is impractical). The mistake is making the 99% case bear the cost of the 1% case."}, {"type": "text", "content": "“Cryptographic attestation will not feel like real verification to case officers.” This is the most honest objection. The answer is that the current feeling of verification is illusory; what looks like a signed photograph is a JPEG that was once signed and is now indistinguishable from a JPEG that was not. The modernised flow trades the feeling of verification for the fact of it.\n\n“This is not on the work program.” Most of the value the Department could create in the next twelve months is not on the work program. Putting it there is the request.\n\nClosing.\n\nThe Department’s citizenship-by-descent pathway is, mechanically, an important part of how Australia maintains its diaspora ties. It runs on a form that nobody who looks at it carefully can defend on its merits. The infrastructure to replace it exists. The legal authority to replace it exists. The professionals to design the replacement are already on staff. What is missing is institutional will to deprecate."}, {"type": "text", "content": "I would be glad to make myself available — at no cost, and not in any commercial capacity — to assist in any way that would be useful to officers undertaking this work. This includes technical review of design proposals, user-testing the replacement flow, or simply lending an outside voice to internal advocates.\n\nYours sincerely,\n\nCasey Handmer\n\nPersonal details redacted\n\ncc:\n\nMs Stephanie Foster PSM, Secretary, Department of Home Affairs, PO Box 25, Belconnen ACT 2616\n\nMs Clare Sharp PSM, Head of Immigration, Department of Home Affairs, PO Box 25, Belconnen ACT 2616\n\nMr Michael Peterer, A/g Assistant Secretary, Citizenship & Humanitarian Policy, Department of Home Affairs, PO Box 25, Belconnen ACT 2616\n\nMs Jennifer Thwaites, A/g Assistant Secretary, Visa, Citizenship & Digital Systems, Department of Home Affairs, PO Box 25, Belconnen ACT 2616"}, {"type": "text", "content": "The Hon Julian Hill MP, Assistant Minister for Citizenship, Customs and Multicultural Affairs, PO Box 6022, House of Representatives, Parliament House, Canberra ACT 2600\n\nFour and a half months later, the Department replied. In short: thanks, noted, there is no funding available to change the form, and it may come up in a future review."}, {"type": "image", "src": "https://caseyhandmer.wordpress.com/wp-content/uploads/2026/10/image-cfe577a7.png?w=729", "alt": ""}, {"type": "text", "content": "I obviously cannot comment on the internal costs of running Australia’s online and physical document handling system, but it’s evidently not nothing. Equally evidently, it has remained untouched by the same process improvement effort that has effectively reformed, for example, licensing for drivers at the state level. The result is a system that bleeds cash, bleeds good will, actively deters legitimate diaspora from retaining ties with the old country while doing nothing to stop anyone sophisticated enough to ask an AI to edit a JPEG. The status quo cannot persist indefinitely. It is a foregone conclusion that Home Affairs will have to update its processes sooner rather than later. Their answer: no funding. By my estimate the fix costs A$3–5M, once, and saves Australians A$6–30M every year, depending on volume. Payback inside a year. Stop complaining about budgeting and find the money!"}, {"type": "text", "content": "Unbelievably, I’m now going through this entire process all over again as my six year old, born during COVID, was granted Australian citizenship by descent and an Australian passport (on the strength of the letter informing us of a positive determination on citizenship, with a temporary document number), but her certificate of citizenship was never issued (due to COVID WFH stuff, I think), making it impossible to renew her passport. There is, of course, a bureaucratic procedure to issue the certificate, which is even more clunky, onerous, and ultimately ineffective than just applying for a new passport, rather than renewing. For example, the letter I received at my address informing me that my child had been issued citizenship and I could request a certificate was not sufficient evidence of my home address, which was required in order to request the certificate. The online application flow to receive the certificate had more requirements than the citizenship application or the passport application."}, {"type": "text", "content": "Even with this certificate in hand, I have to once again go through the Form 1195 charade, hassle our pediatrician, drive across the city to lodge documents, to renew a passport. She’s a dual citizen, but her US passport is no use here: Australia won’t issue a visa to an Australian citizen, so the only lawful way for her to enter Australia is on an Australian passport. Which, by golly, they make insanely hard to get!\n\nI might add here that none of the airlines that operate on the LA-Sydney route (Delta, United, Qantas…) are set up to handle children with dual citizenships so literally every time we travel to Australia we get to sit in a line for hours with desperate children while some haggard customer support representative attempts to run the SOP on this evidently vanishingly rare corner case, which involves updating a database that links the two passports together. Given that I’m about to renew the six year old’s Australian passport, I will shortly get to do this for the sixth or seventh time."}, {"type": "text", "content": "What I’m trying to say is this. It’s 2026. We have reusable rockets, flying cars, and machine superintelligence. It should not be this hard for an Australian citizen to take a commercial flight to Australia.\n\nTo end this post on a happy note (after all, children are great!) let us speculate about what a radically excellent product would look like in this space.\n\nThe Australian government already keeps various lists of the diaspora. There are tens of thousands of Australians in the Bay Area alone. Not all of them work for Anthropic, though you could be forgiven for thinking so. For example, I get helpful letters from various Australian government agencies about driver’s licenses, elections, student loans, etc. By all means, allow Australians overseas to opt out, but it’s a two line cron job to discover if your foreign Australian has had a baby/future potential taxpayer."}, {"type": "text", "content": "Maybe I’ll go on breeding for long enough that when my Nth baby arrives, I get a card in the mail from Home Affairs saying “Congratulations on your new baby! When you have a moment, scan this QR code to upload the birth certificate and send us a photo. Since you’ve been in our database since birth, we know who you are and the baby’s passport plus a stuffed koala is on the way. Enjoy this special time!”"}], "text_post": false}, {"id": "ed86863585d63dc9", "title": "U.S. Inflation Not Getting (Much) Worse, or Better, but Consumers are Fine", "url": "https://theovershoot.co/p/us-inflation-not-getting-much-worse", "source": "The Overshoot", "tag": "financial", "published_at": "2026-10-22T21:08:06+00:00", "panels": [{"type": "text", "content": "The Consumer Price Index (CPI) rose by 0.65% between August and September on a seasonally-adjusted basis, or 8.1% annualized. Consumer spending at retailers, bars, and restaurants jumped by 0.77% , or 9.7% annualized, in September, after rising 1.29% (16.6% annualized) in August. Even more striking, the prices of finished goods and services sold by U.S. businesses (PPI final demand) rose by 1.34% month-on-month , or 17.4% annualized, which was the fastest pace since March 2022. Those hoping for a benign series of inflation prints have been disappointed.\n\nMuch of this month’s pop was attributable to energy goods and associated items. Exclude energy, and CPI inflation came in around 4% annualized, just as in August. (And unlike in August, no one can blame the prices of wireless plans , which fell.) Exclude other categories that tend to be volatile, idiosyncratic, or have known measurement issues, and annualized CPI inflation was around 3-3.5% in September. The PPI for final demand for consumer goods and services excluding food, energy, and “distributive services” such as trucking and flights rose at a yearly rate of 4.5% in September. These rates of inflation are all far slower than the dire headline numbers, but they are also notably faster than what prevailed immediately before the pandemic. Moreover, these rates of inflation have been remarkably consistent over the past several years."}, {"type": "text", "content": "So while there was little new information, every additional set of prints like this continue to corroborate the thesis I have been pushing for several years: the pandemic and associated policy responses reset underlying inflation to be modestly faster than it was before, which means that there will be no “immaculate” disinflation from here back to the Federal Reserve’s alleged 2% yearly goal. According to the CME, the market-implied probability that the Fed will raise its short-term interest rate target by 0.5 percentage points from where it is now by the end of this year jumped from 13.3% on October 7 to 18.7% on October 13 to 28.5% as of the end of October 14, when the CPI numbers were published. (This probability has since dropped to just 5.6% in the face of concerns about the credit demands of some data center operators .)"}, {"type": "text", "content": "Intriguingly, the relatively stable (or mildly accelerating) underlying trend of inflation has coincided with a recent modest slowdown in the typical worker’s wage growth. The big question going forward is whether that slowdown will continue—and eventually flow through to consumer spending and prices—or whether it will reverse given the recent re-acceleration in the job market. Another question worth pondering: given what we now know about how retailers managed their inventories over the past few years, are prices more or less sensitive to renewed supply disruptions?\n\nIt is understandable why some want to blame the current administration for the failure of U.S. inflation to return to the Fed’s 2% yearly goal. For one thing, it seems only fair: the 2024 election was won in part because of misplaced anger about inflation , and because enough voters believed ludicrous claims that a new set of people in charge would cause prices to fall. For another, it is obvious that some of this administration’s signature policies—most notably the tariffs and the war with Iran—have made prices higher than they likely otherwise would have been. 1"}, {"type": "text", "content": "But it is nevertheless misleading to claim, as some have, that U.S. inflation would have painlessly decelerated back to 2% on its own in the absence of policy disruptions from the executive branch.\n\nThe simple boring fact is that the underlying inflationary trend has been remarkably stable over the past few years. As I have been pointing out for some time, confirmed by the latest data, underlying services prices have been running persistently faster than in the pre-pandemic years, while goods prices were never falling fast enough to offset that even before the tariffs, the data center boom, and the war with Iran.\n\nOn the bright side, the data so far do not suggest that these underlying trends have been getting much worse, while some of the most acute price spikes—particularly “components for manufacturing” and “supplies to manufacturing industries”—may have peaked."}, {"type": "text", "content": "Read more"}], "text_post": false}, {"id": "d7f70195db35d79f", "title": "AI and Consciousness: A Skeptical Overview Available Free Until Oct 19", "url": "http://schwitzsplinters.blogspot.com/2026/10/ai-and-consciousness-skeptical-overview.html", "source": "The Splintered Mind", "tag": "philosophy", "published_at": "2026-10-18T17:54:10+00:00", "panels": [{"type": "snippet", "content": "My recent book AI and Consciousness: A Skeptical Overview is free online today and tomorrow (through Oct 19, presumably UK time). I don't think the hard copy is available yet. Get it while it's free!\n\nHere: https://www.cambridge.org/core/elements/ai-and-consciousness/E77C92088DA3C9F89E7FE7C75CBB1896", "read_more_url": "http://schwitzsplinters.blogspot.com/2026/10/ai-and-consciousness-skeptical-overview.html", "read_more_source": "The Splintered Mind"}], "text_post": false}, {"id": "8f5707e9a13cb370", "title": "AI and the Fall? of the Creative Class", "url": "https://www.apricitas.io/p/ai-and-the-fall-of-the-creative-class", "source": "Apricitas Economics", "tag": "financial", "published_at": "2026-09-27T14:01:59+00:00", "panels": [{"type": "text", "content": "Thanks for reading! If you haven’t subscribed, please click the button below:\n\nSubscribe now\n\nBy subscribing, you’ll join over 80,000 people who read Apricitas!"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!oz9x!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F999e3450-1df3-457d-8715-5e2e46d5121c_2886x1843.png", "alt": ""}, {"type": "text", "content": "America has lost more than 200k jobs in “creative” industries over the last four years, with roughly 50k lost within the last year alone. That makes for one of the worst stretches for media employment in modern US history, with similar job loss intensity and duration occurring only during the major economic recessions of 2001 and 2008. Yet there’s no generalized recession today—instead, this period of job loss coincides with the rise of AI systems that can compose wholesale novels, photorealistic images, soundalike music, and practically every other form of digital art, en masse and at extremely low costs. Is this the fall of the Creative Class?"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!4jWS!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F21e0c6b5-22e0-4e51-97b0-68bb9abe225a_2886x1843.png", "alt": ""}, {"type": "text", "content": "Proving the exact amount of AI-driven job loss in the arts is extremely difficult. Media firms are decidedly coy about their AI use, both to protect against public backlash and, more financially important, to preserve the legal basis for their copyrights. The effects of AI are also hard to disentangle from other factors currently affecting arts businesses, like consolidation in Hollywood, offshoring of content production, or the continued displacement of traditional media providers in favor of social media creators. Yet perhaps the clearest evidence of AI’s influence is just that all subsectors of the digital arts industry are losing jobs, while in-person entertainment is still growing at a healthy pace."}, {"type": "text", "content": "Some of those digital job losses are just a continuation of prior trends, like in the publishing industry where technological change has been continually grinding away newspaper and magazine jobs for decades. Yet for sectors like live broadcasting, streaming, or graphic design, recent experience is an unusual downturn compared to the tranquility of years prior. Then there’s the worst-hit sector, movie & sound recording, which has been bleeding jobs at a nearly unprecedented pace over the last three years."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!Exun!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fdecb86b5-a38f-46ea-bce2-c6d5d1a405d5_2886x1843.png", "alt": ""}, {"type": "text", "content": "Hollywood has never seen a stretch as bad as the last four years, with the movie & TV industry losing more than 100k jobs, nearly one-third of the sector’s total. At the depths touched this summer, total employment was lower than at any point since the 2008 recession and approaching the lowest point in 30 years. The streaming era has proven an extremely difficult transition, with traditional films and TV shows losing watch time to user-generated and increasingly AI-assisted or AI-generated content flows."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!zm0D!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F80d207ac-eea2-417b-a381-f956e19ede9d_2886x1843.png", "alt": ""}, {"type": "text", "content": "Overall, nearly half the media job losses of the last four years have been concentrated in the movie & sound recording sector that includes Hollywood. Written publishing has been the next-largest source of job loss, with employment down by more than 70k over the same time frame. Yet the job losses have by no means been contained to any particular part of media; instead they’ve hit nearly every subsector at some point. Nor do they show any sign of abating, with losses consistently hovering at around 50k per year and even accelerating in recent months. Will further AI development continue displacing workers in creative industries?\n\nSubscribe now\n\nTo understand what could happen to the business of art amidst the rise of AI, it’s important to understand what did happen to it during the first digital transition, the rise of the internet."}, {"type": "text", "content": "It was the turn of the millennium, and Metallica had a problem. Demos of their upcoming, unreleased tracks were bouncing around radio and the internet, originally leaked onto a new internet file-sharing website called Napster. There they found thousands of files shared amongst hundreds of thousands of users, many of which were direct rips of albums that sold for $15 being offered for free. The most anticipated albums were often leaked online even before they were on store shelves. Metallica sued Napster for copyright infringement, and they were soon joined by separate suits from other prominent artists and eventually the Recording Industry Association of America (RIAA).\n\nMuch of the general public was understandably unsympathetic to Metallica , perceived as a bunch of already-successful millionaires trying to bilk even more money from listeners, and were even less sympathetic towards the RIAA, perceived as scurrilous middlemen who take from artists and fans alike. But the two of them easily won their lawsuit, forcing Napster into bankruptcy. Yet Metallica may have been right on the law but were on the wrong side of technology; the RIAA had won the battle but was losing the war."}, {"type": "text", "content": "The modern internet made file-sharing extremely easy, and no matter how much whac-a-mole companies played, they could not possibly catch every illegal upload. The perennial threat of piracy undermined their copyright and limited their ability to charge for music. Eventually, the value of individual songs fell to the point that companies like Spotify and Apple Music could swoop in to acquire massive catalogues, consolidate them, and charge a comparatively trivial fee for access. For what a single Metallica album would have cost in 2000, you can now get a month’s worth of unlimited access to nearly all human-made music."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!ItXZ!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa9937364-33e6-4ce6-a504-e91f8a02c625_2886x1843.png", "alt": ""}, {"type": "text", "content": "The music industry has never returned to the heyday paydays of the peak CD era—even without adjusting for inflation, streaming revenue pales in comparison to ‘90s physical media sales. This was a massive boon to consumers, but it was also a squeeze on musicians that forced them to fundamentally change their business model over time. Instead of just selling records to earn money directly, music itself increasingly became a loss-leading advertisement for the live concerts (and merch) that provided a growing share of artists’ income. Tours got longer, venues got bigger, ticket prices skyrocketed, and musicians frequently took on roles closer to public influencers than isolated artistes. Were it not for rising concert sales, the business model of music would have completely collapsed, and the income going to musicians would have cratered."}, {"type": "text", "content": "Of course, there were still significant downsides to the transition into the streaming era. Bands (especially smaller ones) complain about the unending pressure to always be on tour. Musicians whose content was suited to home listening lost out to those more suited to giant festivals. Even accounting for concert revenues, musicians made less money than before. Yet musicians fared better than many areas of entertainment subsectors because there was a live component to fall back on—for many media industries, the digital era left no such comfort."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!iTEJ!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F11cbc8aa-b1c1-44c0-80b1-6ef5c763924d_2886x1843.png", "alt": ""}, {"type": "text", "content": "Over time, the business of video has moved in the opposite direction of music—out of the theatre and into the home. Hollywood formerly made most of its money enticing customers to visit sold-out movie theatres, but these were gradually supplanted by broadcast TV, cable, and physical media. Yet because each successful technological leap increased total video watch time, the industry was still able to thrive amidst technological upheaval. That is, until the modern streaming era.\n\nToday, the plethora of video options and the rise of social media have sent video producers into a vicious competition for limited attention. Even before adjusting for inflation, movie ticket sales ended last year down 25% from their 2019 peak, cable revenue is down 18% from its peak, and streaming revenue has not been able to compensate for the drop. The mountain of free user-generated content on YouTube, Twitch, TikTok, or social media was already presenting harsh competition for traditional video companies in the years before ChatGPT’s launch, and now streaming services are also competing with a flood of AI-generated content. The business model of video media is fundamentally getting squeezed, and unlike in the music industry, there’s basically no equivalent to live concerts that Hollywood can be used to ease the pain."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!dUVd!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6c82b577-3785-46e8-935e-246f08d65784_2886x1843.png", "alt": ""}, {"type": "text", "content": "The actual worst-case scenario for creative workers amidst the AI revolution is something similar to what happened to the publishing industry after the advent of the internet—that is, near-total collapse of their fundamental business model. Newspapers used to employ roughly half a million people in the US, more than the entire oil industry, and now their payrolls are down nearly 85% and still dropping. Magazine publishers likewise have let 66% of their staff go since the 90s, while book publishers have lost 40%.\n\nThe routine informational updates that previously formed newspapers’ bread-and-butter were all de-bundled—box scores moved to sports websites, stock movements went to financial websites, forecasts went to weather websites—each loss compounding on itself to undermine consumers’ need to buy the paper. Search engines became the first place people looked to for information, and newspapers’ advertising revenue rapidly started flowing to companies like Google instead. The collective of social media users became faster at breaking any news story than a daily paper could ever hope to be. When papers eventually did start aggressively paywalling content, the internet made it trivially easy for people to just copy the articles’ content and share it beyond the paywall. The entire business model had collapsed, to the point that now only a select few major newspapers can even survive."}, {"type": "text", "content": "That scale of copyright dilution and forced unbundling is the worst-case scenario for media businesses in the age of AI. It’s possible arts jobs could survive via consumers’ deep-seated aversion to explicitly AI-generated content, but AI is increasingly being used throughout media in ways invisible to the average end consumer. Roughly 32% of workers in the overall arts, entertainment, and recreation sector use Generative AI to some extent , which is less than the 62% average across all industries , but still enough that virtually every major media project could have some AI within its workflow.\n\nIndeed, AI is likely seeping into media production processes in ways large companies themselves would struggle to prevent even when they desire to—how can a TV studio be sure nobody in their writers’ room is consulting ChatGPT for jokes or any storyboard artist is generating concept art? And even if professional TV and movie studios do effectively hold out against temptation and prevent internal AI use, how long can they compete with the large mass of wannabe independent creators with much fewer scruples? Plenty of media businesses tried to hold out against the algorithmic content waves of the 2010s and were buried as a result."}, {"type": "text", "content": "Subscribe now"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!Hsfq!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9f5df059-4f98-46d1-8a74-e7f94c0aa52e_2886x1843.png", "alt": ""}, {"type": "text", "content": "Yet fundamentally, it’s difficult to meaningfully predict how new technologies will interact with existing arts businesses. Take the unexpected resurgence in book sales over the last four years. The novel as a commercial art form had been struggling for decades, with fewer books sold in 2019 than at the beginning of the millennium, but the last six years have seen an unprecedented 70% surge in sales. The unlikely savior of the printed word came from perhaps its polar opposite—TikTok.\n\nOf course, fewer people read now than ever before—for the general public, short-form video apps have accelerated the displacement of reading, just as TV, video games, or social media before them. Yet for a dwindling number of dedicated repeat readers, “BookTok” became a new way to source reviews, analysis, discourse, and community in a way that boosted the reading experience and absolutely turbocharged book sales. It’s possible that AI tools could have those same totally unpredictable spillovers for other museums, concerts, or other forms of art in ways that are unpredictable today, in much the same way short-form video saved books in ways that could never have been anticipated beforehand."}, {"type": "text", "content": "At the end of the day, the arts are only a small sector of the overall macroeconomy. Media made up a small share of the labor market even at its peak, and it has always been difficult to get hired in creative industries to the point that making fun of art students’ job prospects became an easy punchline. The movie industry has an income profile closer to eggs or bicycles than something major like healthcare or finance. Were the goal to create art for art’s sake, for the intangible and nonmonetizable cultural benefits, it would be relatively easy to counterbalance any economic impacts of AI on artists just by reversing recent cuts to the National Endowments for the Arts & Humanities.\n\nIt’s telling that Anthropic, the most prominent AI lab, has basically never bothered with image, video, or music generation, because the prospective economic benefits are marginal when compared to using AI to tackle math or scientific problems. OpenAI learned this lesson the hard way when it was forced to abandon its video generation platform Sora, deciding it had better use for its limited compute than making synthetic TikToks. Nowadays, the art generation is done primarily by secondary players running smaller models, though even these are large enough to threaten significant disruption to legacy media businesses."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!96J2!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6fa718d1-e7f0-422f-9a09-4606948e1ed4_2886x1843.png", "alt": ""}, {"type": "text", "content": "In other words, the primary impacts of AI art will be on culture and society rather than the macroeconomy. Yet arts jobs might be a microcosm for other “creative-adjacent” work that occupies a much larger share of economic activity. Take the tech sector itself, which is the clearest place where AI-driven job loss has shown up outside the media business, as powerful coding agents replace human programmers. Annual tech job gains stood at nearly 300k in 2022, but the sector has been bleeding jobs every year since then in what is now its longest labor market downturn.\n\nRight now, AI-driven job displacement has been relatively minor outside of these few narrow sectors. Unemployment is higher than it was four years ago but still below even the 2010s average , and overall job turnover rates remain extremely low . Some white-collar sectors that looked prime for AI automation have even been on a hiring spree over the last few years, including legal and engineering firms. Yet if the economic impact of AI ends up being anywhere near large enough to validate the trillions of dollars investors are currently betting on it , these economic disruptions will only spread from here."}, {"type": "text", "content": "Thanks for reading! To receive more new posts on economic data analysis, consider subscribing!."}], "text_post": false}, {"id": "434bf47b7365f054", "title": "How deep is Tulainyo Lake?", "url": "https://caseyhandmer.wordpress.com/2026/09/20/how-deep-is-tulainyo-lake/", "source": "Casey Handmer's Blog", "tag": "engineering", "published_at": "2026-09-20T06:28:35+00:00", "panels": [{"type": "text", "content": "Regular readers may recall that I put a visit to Tulainyo Lake on my bucket list a few years ago. Last week I did it.\n\nImpossibly remote, otherworldly beauty, and an enduring mystery. Just how deep was this lake? Wikipedia claims not to know. Measuring it is non-trivial. A worthy challenge."}, {"type": "image", "src": "https://caseyhandmer.wordpress.com/wp-content/uploads/2026/09/image.png?w=1024", "alt": ""}, {"type": "text", "content": "The skinny: This relatively small alpine lake is about 117 m deep! That makes it the 25th deepest natural lake in North America, and by far the deepest lake on Earth for its size.\n\nEnjoy our interactive report here ."}], "text_post": false}, {"id": "fa1f20fa6cb2779c", "title": "America's Electricity Gap", "url": "https://www.apricitas.io/p/americas-electricity-gap", "source": "Apricitas Economics", "tag": "financial", "published_at": "2026-05-03T13:31:02+00:00", "panels": [{"type": "text", "content": "Thanks for reading! If you haven’t subscribed, please click the button below:\n\nSubscribe now\n\nBy subscribing, you’ll join over 80,000 people who read Apricitas!"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!kNMO!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff71eaab6-c674-40e1-aa65-e3cdab08881e_2886x1843.png", "alt": ""}, {"type": "text", "content": "America has entered another era of electrification—US power consumption has risen more in the last two years than over the previous 15 combined. Yet this hasn’t been nearly enough to meet demand, with electricity prices also rising more over the last 4 years than the prior 14. Demand from AI, heavy industry, heating, and transport is driving load growth but also outstripping growth in power infrastructure—leaving America with an increasingly large electricity gap that’s driving up prices. Projections from the US Energy Information Administration (EIA) expect generation to accelerate slightly over the next two years, growing another 4.6% in total, but that’s still not quick enough to close the gap or prevent further price appreciation."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!Qf-j!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8e46b9ca-15fd-4240-b289-33ab42c66d27_2886x1843.png", "alt": ""}, {"type": "text", "content": "The return of sustained load growth after more than a decade and a half of stagnation represents a fundamental change in America’s energy markets, with the source of rising demand shifting alongside its scale. Indeed, the EIA expects more upcoming load growth to come from commercial entities—a category that includes data centers—than from industrial and residential uses combined. If those projections hold true, commercial power consumption will have grown more in the 4 years since ChatGPT’s launch than in the two decades prior."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!-4yf!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc4875d0f-57ff-4c2a-933c-5ead62265087_2886x1843.png", "alt": ""}, {"type": "text", "content": "The second fundamental change in electricity markets is how the US is meeting the new rise in power demand—by deploying record amounts of renewable energy, primarily solar and batteries. 2025 saw the largest year-on-year increase in US solar generation on record, with total solar power rising 28% to 389TWh. That’s despite the Trump administration cutting subsidies to wind and solar production, cancelling permitting approvals for major projects, and imposing tariffs on many of the sector’s key inputs. Solar power growth is projected to slow slightly this year, though remaining near its 2024 pace, before breaking the growth record again in 2027."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!w0kV!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff6fbe999-d32b-450a-a6f9-31d5e8ee5c22_2886x1843.png", "alt": ""}, {"type": "text", "content": "In other words, solar power will be meeting the majority of US load growth for the first time in history. Yet America has fallen significantly behind both China and the European Union in terms of solar energy deployment , even on a per-capita basis . Legacy US coal plants, which have been closing for decades as they’ve been outcompeted by natural gas and solar, are now being retired at the slowest pace since 2010 as grids are forced to keep them online to meet growing demand. America was one of only a few major countries that increased coal power production in 2025, a year when even coal powerhouses China and India reduced their use."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!dlAl!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F536b27e5-06ed-4431-a692-5f7581fcccbd_2886x1843.png", "alt": ""}, {"type": "text", "content": "Meanwhile, US residential electricity prices are up more than 40% since 2020 and continue rising. Given the rise in energy demand over the last year and the fossil-fuel price shock caused by the US attack on Iran, prices are likely to increase even further in the near future. That also means the Trump administration’s decision to block major solar , wind , and battery projects now has much higher economic costs. Their decision to exempt computers and other data center inputs from tariffs while hitting key electrical infrastructure like wires, transformers, and batteries further exacerbates the energy crunch.\n\nYet the fact that renewable energy is still growing rapidly, even in such an unfavorable policy environment, speaks to the scale of the technological acceleration currently underway. Solar and batteries are growing at a record pace throughout nearly the entire globe, increasingly winning on cost and accessibility in the US and in places as politically and economically disparate as Pakistan or Germany . Deploying them faster will be key to closing America’s electricity gap."}, {"type": "text", "content": "Subscribe now"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!_e6H!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F30dc4f76-761c-4c4a-bac4-81e5329c414f_2886x1843.png", "alt": ""}, {"type": "text", "content": "The US is currently investing record amounts into power generation, driven entirely by the rapid growth in “alternative” energy sources like wind and solar. In real terms, the scale of that investment has more than doubled since 2020 and is up more than 10x since 2010. Likewise, investment in electrical transmission and distribution equipment also hit a record high at the start of this year, though it has since fallen back to 2023 levels. Meanwhile, investment in “traditional” electricity generators like natural gas, coal, and nuclear has been essentially flat over the last four years and remains well below its record highs."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!wKeX!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F24460723-f3fa-4915-8779-d839ac399b73_2886x1843.png", "alt": ""}, {"type": "text", "content": "Total US renewable capacity additions took a major hit at the start of 2025 when the Trump administration first returned to office, but rebounded to new record highs in the second half of last year. The EIA projects the US will break that record again over the next two years, primarily thanks to growth in utility-scale solar deployments. Battery additions will also hit record highs to supplement those new solar panels, while wind power additions will rise slightly this year before sinking near post-COVID lows next year."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!gCOF!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F64a50aed-cb60-4242-a604-816bc3806b13_2886x1843.png", "alt": ""}, {"type": "text", "content": "Of course, power capacity is not power generation, and renewable power sources have lower capacity factors than their fossil-fuel counterparts because they generate less electricity at night, during cloudy days, or when the wind is weak. Yet renewable generation is also at record highs and expected to rise further, due almost entirely to solar. US solar output rose 28% in 2025 and is projected to rise another 16% this year and 20% in 2027. By then, it’ll make up 11.3% of total electricity.\n\nThe greatest problem with solar is its temporal inconsistency, with the sun’s output varying by the hour, day, and month. This problem becomes even more acute when solar makes up a larger share of the grid, as electricity becomes overabundant during the daytime and summer but remains scarce at night or during winter. This variability makes short and long-duration batteries an obvious and necessary complement to solar panels."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!PduY!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd0983fa5-a57b-4d12-a325-f85e2f02a905_2886x1843.png", "alt": ""}, {"type": "text", "content": "That’s why the US is also building record amounts of utility-scale battery storage, with the pace of additions hitting an all-time high in late 2025 and expected to grow further over the next two years. Total US battery power capacity, which measures the peak amount of electricity deployable at a given moment, is projected to double over the next two years to almost 90GW. Official data don’t provide timely measures of energy capacity (the total amount batteries could supply to the grid through a full discharge), but industry sources also show it rising even faster than power capacity, up more than 55% in 2025."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!EkJ3!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc5ae0133-21fc-4f6f-b1a7-79cd89515d65_2886x1843.png", "alt": ""}, {"type": "text", "content": "In 2019, there was virtually no utility-scale battery capacity in the United States, and solar only made up about 2.5% of American electricity. Now solar not only provides vastly more electricity during the peak daytime hours but also charges batteries, which then provide additional power near dawn and dusk. Averaging hourly power generation across the entire year, batteries now provide roughly 26.7 GWh throughout the day, with 6.3 GWh delivered in the peak hour alone."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!Zghs!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F125d001c-0a27-42fa-bd66-06eed53d2518_2886x1843.png", "alt": ""}, {"type": "text", "content": "At the scale of the entire country, this is still only a tiny portion of overall electricity, with gross discharges equaling about 0.2% of total electricity consumption. Yet during bright summer days in California, Texas, and some other parts of the US, solar already frequently generates more power than needed to meet all grid demand during midday, charging batteries that meet a significant portion of demand after sunset. That generation pattern will only become more common as solar and batteries both become more widespread throughout the United States in the near future."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!-uYt!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0c3888ca-6dbb-4852-b601-48344f5e2377_2886x1843.png", "alt": ""}, {"type": "text", "content": "Even more solar and batteries will be built throughout the United States in the near future, with over 40GW of solar and 22GW of battery capacity slated to come online in the next year. Those solar and battery plants are especially concentrated in the sunbelt—with Texas (16GW of solar, 12GW of batteries), California (2.7 GW of solar, 3.2GW of batteries), and Arizona (2.6GW of solar and 3GW of batteries) leading the pack. Texas alone is set to make up 55% of new US battery capacity and 41% of new solar capacity over the next year."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!BDUN!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F38d46fcc-1597-4e08-bc0d-edb931adfa25_2886x1843.png", "alt": ""}, {"type": "text", "content": "Indeed, Texas is seeing by far the fastest electricity growth of any region in the United States—total power generation in ERCOT, the state’s main utility interconnection, has already risen nearly 30% above pre-COVID levels and is projected to reach 57% above those levels by 2027. The PJM interconnection, which covers mid-Atlantic states from New Jersey to Virginia and is a major data center construction hub, is at a distant second place with less than 15% total growth from 2019 to 2027.\n\nNatural gas will still meet the majority of Texas’ load growth over the next two years, but solar alone will cover 40% of new demand while wind will cover another 9%. That means solar will rise to 18% of the state's power by 2027, up from 12% last year and rapidly approaching wind’s 21%."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!Z3dW!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F673dba36-4566-40bd-9c00-414abe0483a2_2886x1843.png", "alt": ""}, {"type": "text", "content": "The rise in US solar and battery deployment has also had important effects beyond the direct investment in generation and transmission infrastructure—with major spillovers to the entire electrical supply chain and labor market. Most prominently, the US is in the midst of a massive increase in domestic battery production, with output rising 37% over the last year and tripling since late 2019 . Many of those battery factories have been redirected from EV production, where adoption has slowed as federal incentives are cut, to utility-scale production . Overall, domestic output now meets the highest share of US demand in years, although the US is far from self-sufficient and net battery imports still totaled $19.6B in 2025."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!_Ttt!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F48bb661e-4793-4d3c-984e-c98991d6ef41_2886x1843.png", "alt": ""}, {"type": "text", "content": "On the labor market front, while utilities have cut roughly 6k jobs at fossil-fuel generating plants since the end of 2019, they have added roughly 24k jobs at low-carbon non-fossil-fuel plants over the same time frame. Add in gains from the transmission, control, and distribution, and electric power utilities have added a total of 48k jobs. Power and communication line builders and electrical equipment manufacturers have also added 35k and 49k jobs, respectively, breaking out of an extended period of stagnation. Yet the largest growth has been among electricians and electrical contractors , where employment has risen nearly 150k to a new record high.\n\nSubscribe now\n\nThe rapid rise in AI-related data center power demand and its subsequent backlash have understandably dominated much of the recent public discourse around electricity investment. The fact that most major tech companies are now deciding to fund their own grid capacity proves just how important power access is to their gamble on AI development and how increasingly politicized energy consumption has become. Yet while AI development is a prime driver of current grid expansion, America was always going to need more power investment to meet this phase of economic growth and was already struggling to meet rising electricity demand well before the AI boom."}, {"type": "text", "content": "American manufacturing’s power consumption is poised to increase as factories built during the 2022-2023 construction surge come online. US EV adoption, while extremely slow compared to peer countries , has increased power demand and is still projected to rise significantly in the near future. Residential demand is gradually increasing as heating, cooking, and other appliances are slowly replaced with electric versions. Prices surged through 2021 and 2022 as those demand impulses hit a more supply-constrained environment. In other words, the costs of America’s electricity gap have only been mounting as power becomes more important to the national economy.\n\nWhile the US still needs plenty of fossil fuels to keep the power grid running, the long-run growth trajectory increasingly lies in other power sources. Growth in domestic EV, battery, and solar production is high by historical standards, but it is still low compared to many of America’s peer countries, and the US is no longer a manufacturing leader in any of those industries. Having already fallen behind on production, the US risks multiplying the pain if it also falls seriously behind on deployment."}, {"type": "text", "content": "It is not a coincidence that some of America’s fastest-growing state economies , like Texas, are also among the fastest deployers of solar and batteries. They aren’t doing it primarily for climate or ideological reasons, but because it’s the easiest way to close their electricity gap and power economic growth. More of America will have to permit that kind of rapid energy buildout if they hope to meet their own increasing electricity needs.\n\nThanks for reading! To receive more new posts on economic data analysis, consider subscribing!"}], "text_post": false}, {"id": "011de4d663e0319e", "title": "Coming soon", "url": "https://orbitalindexextendedmission.substack.com/p/coming-soon", "source": "The Orbital Index", "tag": "engineering", "published_at": "2025-12-27T17:27:05+00:00", "panels": [{"type": "text", "content": "This is The Orbital Index: Extended Mission.\n\nSubscribe now"}], "text_post": false}]}</script>
<script>

const FEED_ITEMS = JSON.parse(document.getElementById('feed-data').textContent);
const SAVE_KEY = 'signal-saved';
let activeTab = 'live';
const tabScrollPositions = { live: 0, weekly: 0 };

function getSaved() {
  try {
    return JSON.parse(localStorage.getItem(SAVE_KEY)) || [];
  } catch (e) {
    return [];
  }
}
function setSaved(list) {
  localStorage.setItem(SAVE_KEY, JSON.stringify(list));
}
function isSaved(id) {
  return getSaved().some(p => p.id === id);
}
function toggleSave(item) {
  const saved = getSaved();
  const idx = saved.findIndex(p => p.id === item.id);
  if (idx >= 0) {
    saved.splice(idx, 1);
  } else {
    saved.unshift(item);
  }
  setSaved(saved);
}

function relativeTime(iso) {
  const then = new Date(iso).getTime();
  const now = Date.now();
  const diffSec = Math.max(0, Math.floor((now - then) / 1000));
  if (diffSec < 60) return 'now';
  const diffMin = Math.floor(diffSec / 60);
  if (diffMin < 60) return diffMin + 'm';
  const diffHr = Math.floor(diffMin / 60);
  if (diffHr < 24) return diffHr + 'h';
  const diffDay = Math.floor(diffHr / 24);
  if (diffDay < 7) return diffDay + 'd';
  const diffWeek = Math.floor(diffDay / 7);
  if (diffWeek < 5) return diffWeek + 'w';
  const diffMonth = Math.floor(diffDay / 30);
  return diffMonth + 'mo';
}

function initials(name) {
  const clean = name.replace(/^r\//, '');
  return clean.slice(0, 1).toUpperCase();
}

function renderPanel(panel) {
  if (panel.type === 'image') {
    const img = document.createElement('img');
    img.src = panel.src;
    img.alt = panel.alt || '';
    img.loading = 'lazy';
    return img;
  }
  if (panel.type === 'snippet') {
    const wrap = document.createElement('div');
    wrap.className = 'panel-snippet';
    const p = document.createElement('p');
    p.textContent = panel.content;
    wrap.appendChild(p);
    const a = document.createElement('a');
    a.className = 'read-more';
    a.href = panel.read_more_url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = 'Read the rest at ' + panel.read_more_source + ' →';
    wrap.appendChild(a);
    return wrap;
  }
  const div = document.createElement('div');
  div.className = 'panel-text';
  div.textContent = panel.content;
  return div;
}

function buildCard(item) {
  const post = document.createElement('article');
  post.className = 'post';

  const header = document.createElement('div');
  header.className = 'post-header';

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = initials(item.source);
  header.appendChild(avatar);

  const headerText = document.createElement('div');
  headerText.className = 'header-text';
  const sourceName = document.createElement('div');
  sourceName.className = 'source-name';
  sourceName.textContent = item.source;
  headerText.appendChild(sourceName);
  header.appendChild(headerText);

  const meta = document.createElement('div');
  meta.className = 'header-meta';
  const tagPill = document.createElement('span');
  tagPill.className = 'tag-pill';
  tagPill.textContent = item.tag;
  meta.appendChild(tagPill);
  const ts = document.createElement('span');
  ts.className = 'timestamp';
  ts.textContent = relativeTime(item.published_at);
  meta.appendChild(ts);
  header.appendChild(meta);

  post.appendChild(header);

  // A text_post item (Reddit/HN) with no image is just its snippet text,
  // shown compactly with no media box - same as before. But Reddit's RSS
  // does embed a real preview image for image-post subreddits, which
  // panelize.py surfaces as a leading image panel ahead of the text_post
  // panel; those need the media/carousel box like any other post.
  const hasCarousel = item.panels.length > 1 || item.panels[0].type !== 'text_post';

  if (hasCarousel) {
    const media = document.createElement('div');
    media.className = 'media';
    const track = document.createElement('div');
    track.className = 'carousel-track';
    item.panels.forEach(panel => {
      const panelEl = document.createElement('div');
      panelEl.className = 'panel';
      panelEl.appendChild(renderPanel(panel));
      track.appendChild(panelEl);
    });
    media.appendChild(track);

    if (item.panels.length > 1) {
      const dots = document.createElement('div');
      dots.className = 'dots';
      item.panels.forEach((_, i) => {
        const dot = document.createElement('span');
        dot.className = 'dot' + (i === 0 ? ' active' : '');
        dots.appendChild(dot);
      });
      media.appendChild(dots);

      track.addEventListener('scroll', () => {
        const idx = Math.round(track.scrollLeft / track.clientWidth);
        [...dots.children].forEach((d, i) => d.classList.toggle('active', i === idx));
      }, { passive: true });
    }

    post.appendChild(media);
  }

  const footer = document.createElement('div');
  footer.className = 'post-footer';
  const saveBtn = document.createElement('button');
  saveBtn.className = 'save-btn';
  saveBtn.setAttribute('aria-label', 'Save post');
  const outlineIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 3c-1.1 0-2 .9-2 2v16l8-5.333L20 21V5c0-1.1-.9-2-2-2H6z"/></svg>';
  const filledIcon = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3c-1.1 0-2 .9-2 2v16l8-5.333L20 21V5c0-1.1-.9-2-2-2H6z"/></svg>';
  const setSaveIcon = () => { saveBtn.innerHTML = isSaved(item.id) ? filledIcon : outlineIcon; };
  setSaveIcon();
  saveBtn.addEventListener('click', () => {
    toggleSave({
      id: item.id,
      title: item.title,
      url: item.url,
      source: item.source,
      tag: item.tag,
      published_at: item.published_at,
      panels: item.panels,
      text_post: item.text_post,
      saved_at: new Date().toISOString(),
    });
    setSaveIcon();
    if (document.getElementById('saved-view').classList.contains('active')) {
      renderSavedView();
    }
  });
  footer.appendChild(saveBtn);
  post.appendChild(footer);

  const caption = document.createElement('div');
  caption.className = 'caption';
  const sourceSpan = document.createElement('span');
  sourceSpan.className = 'caption-source';
  sourceSpan.textContent = item.source;
  caption.appendChild(sourceSpan);
  const link = document.createElement('a');
  link.href = item.url;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  link.textContent = item.title;
  caption.appendChild(link);
  if (item.text_post) {
    // Reddit/HN items carry their body (self-text, or "submitted by
    // /u/x [link] [comments]") in the text_post panel, which is always last.
    const body = document.createElement('div');
    body.className = 'caption-body';
    body.textContent = item.panels[item.panels.length - 1].content;
    caption.appendChild(body);
  }
  post.appendChild(caption);

  return post;
}

function renderFeedTab(tab) {
  const container = document.getElementById('feed-' + tab);
  container.innerHTML = '';
  const items = FEED_ITEMS[tab] || [];
  if (items.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'Nothing new since the last refresh.';
    container.appendChild(empty);
    return;
  }
  items.forEach(item => container.appendChild(buildCard(item)));
}

function renderFeed() {
  renderFeedTab('live');
  renderFeedTab('weekly');
}

function switchTab(tab) {
  if (tab === activeTab) return;
  tabScrollPositions[activeTab] = window.scrollY;
  activeTab = tab;
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tab));
  document.getElementById('feed-live').classList.toggle('active', tab === 'live');
  document.getElementById('feed-weekly').classList.toggle('active', tab === 'weekly');
  window.scrollTo(0, tabScrollPositions[tab] || 0);
}

function renderSavedView() {
  const list = document.getElementById('saved-list');
  list.innerHTML = '';
  const saved = getSaved();
  if (saved.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'Nothing saved yet.';
    list.appendChild(empty);
    return;
  }
  saved.forEach(item => {
    const card = buildCard(item);
    const saveBtn = card.querySelector('.save-btn');
    saveBtn.addEventListener('click', () => renderSavedView());
    list.appendChild(card);
  });
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTab(btn.dataset.tab));
});

document.getElementById('saved-toggle-btn').addEventListener('click', () => {
  document.getElementById('feed-view').classList.add('hidden');
  document.getElementById('tabs-row').classList.add('hidden');
  document.getElementById('saved-view').classList.add('active');
  renderSavedView();
});
document.getElementById('back-btn').addEventListener('click', () => {
  document.getElementById('saved-view').classList.remove('active');
  document.getElementById('feed-view').classList.remove('hidden');
  document.getElementById('tabs-row').classList.remove('hidden');
});
document.getElementById('wordmark-btn').addEventListener('click', () => {
  document.getElementById('saved-view').classList.remove('active');
  document.getElementById('feed-view').classList.remove('hidden');
  document.getElementById('tabs-row').classList.remove('hidden');
});

renderFeed();

</script>
</body>
</html>
