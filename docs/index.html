 at yellow journalism back in the late 1800s; they were not getting good information about what was going on in the world. And that's just always been true no matter what the media has been. The velocity has changed, the amount has changed, the barriers to entry have been lowered. So individual people can hop on the misinformation train much easier now than they could back in the day when you needed a printing press to do it."}, {"type": "text", "content": "2:32:43.8 SC: But I think the basic human nature that makes it happen hasn't really changed, and I don't think that censorship is the answer. We've talked about this on the podcast in various ways, Petter Törnberg, Gordon Pennycook, et cetera, how information flows through the internet and how that increases or decreases people's accuracy. I do think the situation is bad, don't get me wrong. I think that there are big problems in how citizens of a democracy are getting their information. There was a recent edition of Philosophy Comics, Philosophical Comics? I forget what the name of the comic strip is, but there's this wonderful comic strip and it comes out occasionally. And in this one, Rousseau, Jean-Jacques Rousseau, is thinking about inventing democracy. Of course, he didn't invent democracy, but that's okay; it's a simplification for the purposes of a comic strip. And he says, \"All we need to do is have civic-minded citizens who are well-educated, and then a democracy will work.\""}, {"type": "text", "content": "2:33:48.3 SC: And then the punchline is, of course, we have democracy, but we don't have well-educated citizens, nor especially civic-minded ones. So I do think it's crucially important to think of ways that people can get better information and also more recognition of their civil responsibilities in general, but I don't think that censorship is the way to do that. I'm not quite sure what the way to do that is, but I do have my preferences for what not to do.\n\n2:34:15.4 SC: Josh says, \"You've mentioned playing poker a few times, so I've got to ask: assuming it's Texas Hold 'em, what is your favorite starting hand? Are you a big pocket pair kind of guy, or do you get more excited seeing suited connectors?\" So to those of you who are not poker players out there, this is actually a sort of sneakily good question, I think. I think people don't appreciate necessarily... People who are not frequent poker players don't appreciate this subtle difference here. In Texas Hold 'em, you are dealt two cards, your hole cards, that you see and nobody else does. And then the board, the common cards that everyone shares, come out gradually in front of you, and you make the best five-card hand out of your two cards plus the five cards on the board. And so you don't know what other people have; you do know what you have. So it's a game of incomplete information."}, {"type": "text", "content": "2:35:10.6 SC: And if you just ask the question, of all possible hole cards that you could have, which ones will lead you to having the best hand at the end of all the cards coming out the highest percentage of the time, the answer is clearly pocket aces. Two aces in your hand are going to win the hand more often than anything else. But the twist is, in poker, in Texas Hold 'em, the goal is not to win the hand; the goal is to win money. And of course, you win money by winning hands, but you could easily find yourself having a strategy where you frequently win hands with very tiny amounts of money in the pot and occasionally lose hands with huge amounts of money in the pot. And even though you win more hands than you lose, you overall lose money."}, {"type": "text", "content": "2:36:02.2 SC: So there's another kind of hand called suited connectors, which means two cards of the same suit which are right next to each other, like ten of spades and nine of spades. Okay? Those kinds of cards are more likely than average to eventually get either a straight—five cards in a row, or a flush, or even a straight flush. A flush is five cards of the same suit. And those kinds of winning hands will also win. They'll win less often than just having a big pocket pair, but when they win, it's possible that the opponents that you're playing with don't give you credit for having such a good hand and therefore are willing to put more money into the pot. So even though those hands win less frequently, it is possible to win more money with them. And therefore, it's a reasonable question: which would you rather start with? I actually don't care. I know that when we start, there will be a given distribution of hands, and you have to play all of them effectively."}, {"type": "text", "content": "2:37:05.7 SC: I do think that there's a certain thrill that you get from having bad starting cards and entering the pot anyway and getting really lucky and fooling everyone and taking down a big pot. There's nothing more fun than that. If you just have two aces to start and you end up winning because no one has a hand that good, you're like, \"Okay, good, I got lucky, I got good cards, and I won the hand.\" But it doesn't feel like skill; it just feels like you got good cards. Whereas somehow if you have three-five suited and you end up getting a straight, and your straight is two, three, four, five, six, no one thinks you have that hand because what are you doing being in the hand with a three and a five? But therefore, you can win a huge amount of money if someone else has a pretty good hand, like someone else has pocket aces, then you have a big pot in front of you."}, {"type": "text", "content": "2:37:57.5 SC: But that's just very, very rare that's gonna happen. So I just take it all. I take the good with the bad. I appreciate the thrill of doing a little trick, but ultimately you gotta squeeze whatever value you can out of whatever cards you are dealt. That's true in life just as much as in Texas Hold 'em.\n\n2:38:16.4 SC: Alan says, \"In the previous AMA, you characterized disagreements about free will as largely semantic, despite arguing just minutes earlier in the same episode that emergent phenomena are genuinely real. You also seem to endorse the view that free will emerges from agency in the recent Christian List episode. Can you reconcile the apparent contradiction or clarify whether I'm missing something here?\""}, {"type": "text", "content": "2:38:38.3 SC: I think you're missing something. I mean, yeah, I do think emergent phenomena are genuinely real, and consistent with that, I think it makes most sense to treat free will as real. I think that's pretty consistent. It's not treating free will as real that I think is a semantic argument. I think it's debates between people who treat emergent compatibilist free will as real versus people who simply insist that if the universe is deterministic, you can't have free will by definition. That's a semantic argument. That's just arguing over the definition of free will, and I think that that's kind of boring. So that's why I try in those cases to not use the term free will and just argue about what we think happens in the world. The reason why Gregg Caruso was a good person to talk to on the anti-free will side is because that's not his reasoning, right? He's not just disagreeing with compatibilism by definition; he doesn't like it for some more normative reasons. And so that's interesting to explore."}, {"type": "text", "content": "2:39:41.9 SC: Paul Torrek says, \"How important is it for Everettians to derive the Born rule? Obviously, it would be nice to reduce your theory's number of assumptions by one, but don't most other interpretations of quantum mechanics help themselves to an empirically validated Born rule rather than deriving it?\"\n\n2:39:59.6 SC: Well, they do, but the situation is different. Everettians have to derive the Born rule in a way that others don't. So if I have, for example, some theory in which the wave functions truly collapse, objective collapse models, for whatever reason, there's different versions of those, okay. But in such a theory, there will be some indeterministic, some truly stochastic element that describes wave function collapse. And then how you interpret the Born rule is as a frequency, right? When you have a certain setup and you make a certain measurement, you will do that experiment many, many times, and the simple frequency with which things happens is what you mean by the Born rule. It's a frequentist version of probability, if you want to put it that way."}, {"type": "text", "content": "2:40:50.0 SC: In Everett, you can't say that. In Everett, when I observe a spin, that I get some spin up and some spin down in the wave function, with 100% probability, there's a world where the spin was up and 100% probability there was a world where the spin was down. There's no frequency there. It happens all the time, every single time. There's a world where the spin is up and a world where the spin is down. You have to treat probability epistemically, subjectively, not frequentistly, objectively, okay? You have to interpret, I would argue, you have to interpret probability as a measure on your self-locating uncertainty when that wave function branches. And the theory doesn't have any room for saying, \"And assign this probability,\" because the probability is 100%. That's the assignment: the probability that it happens somewhere in the wave function. The thing you're talking about is not something the theory gives you, okay? The theory doesn't give..."}, {"type": "text", "content": "2:41:48.0 SC: Well, I think it does give it to you, but it doesn't have room for an additional assumption that gives it to you, because the thing you're trying to make an assumption about is your subjective probability on self-locating uncertainty. What the theory is allowed to do is give you different physical dynamics, it's allowed to give you different ontology; it's not allowed to tell you what to think, okay? That's what the Born rule comes down to in Everett. So I think that's all a resolvable question, but it's a different kind of question in Everett than it is in other approaches.\n\n2:42:19.8 SC: Gustavo Chavez says, \"In the March 2026 AMA...\" by the way, I am appreciating that people are following up on old AMA questions. That's always a good strategy. \"So in the March 2026 AMA, while answering a question about your take on the notion of computational functionalism, you said that you think that the underlying processes that lead you from the input to the output are crucially important in whether or not those processes involve something that we can call consciousness. In his recent essay, 'The Mythology of Conscious AI,' Anil Seth challenged the notion of computational functionalism, arguing, among other things, that there are functions that Turing machines cannot compute perfectly, such as continuous or stochastic functions. As I understand it, he argues that perhaps consciousness depends on processes that a Turing machine cannot compute, but only simulates in a way that isn't precise enough to allow for consciousness to emerge. Is this more or less what you're thinking about when you mention the importance of the underlying processes happening in our brains, or was it something different?\""}, {"type": "text", "content": "2:43:18.9 SC: I think it's a little bit different. So it was Anil Seth who first opened my eyes to the importance of distinguishing between the information flow in our brains, which is what computational functionalism cares about, and all the other physical goings-on in our brains, which is what biology and what Anil refers to and others refer to as biological naturalism care about. But that's not what we talked about when we had Anil on the podcast; we talked about emergence and things like that. But Anil did give a talk at the year-and-a-half-ago Natural Philosophy Symposium. By the way, we will be having another one in May 2027, so look forward to that. But his talk at the symposium was about biological naturalism versus computational functionalism and its importance for consciousness in AIs, and you can look up that online. The talks are on YouTube."}, {"type": "text", "content": "2:44:13.3 SC: So anyway, it was that talk and the paper that he wrote about it, and he really... I feel bad, he asked me to respond to that paper as a part of a whole special issue of the journal the paper appeared in, whose name is escaping me right now, but I never got around to doing it. I was just too busy doing other things. But I did read his paper and think about it, and that's what got me interested in this topic. And we later talked to Ned Block, who is the other major proponent of this perspective. Okay, so I try to be...look, this is not something I'm an expert in. I don't think you should listen to what I have to say about these things. I'm just trying to be honest about what my opinions are. But I'm not at a high level of having gone through all the details here. But the important thing to me is exactly what I said: the distinction between the information flow in your brain versus all the actual biophysical processes going on in your brain. I am open to the idea that whatever consciousness is, it requires more than simply information flow to capture it. Okay. It might not."}, {"type": "text", "content": "2:45:26.3 SC: I'm also open to the idea that it doesn't, because I don't know a lot about consciousness, but I'm open to the idea that it does. And Anil puts a lot of emphasis on this Turing machine stuff. I don't especially. So I'm not sure whether or not human brains are Turing machines, or better or worse, or even whether that's a good comparison. My interest is more in entropy and the arrow of time, which will come as a surprise to nobody. I think that the mechanisms of metabolism and turning free energy into useful work that go on in our biological structures are very, very important to what you and I call thinking and perhaps to what you and I call consciousness. They can be mimicked by other kinds of structures, but maybe they can't be exactly reproduced, or at least not in a simple way that abstracts away all of the underlying mechanism into a simple information flow through a computer."}, {"type": "text", "content": "2:46:28.7 SC: Again, maybe it can, but I'm open to the possibility that it can't. 'Cause when I first heard Anil's objections to computational functionalism, I was worried that he was abandoning physicalism. But he explained that he's not in any sense abandoning physicalism. So I was impressed to learn how you could stick with physicalism and yet be concerned that AIs might never be conscious. I thought that was interesting, and that's something that one should consider when investigating the question of whether AIs could ever be conscious.\n\n2:47:00.8 SC: Okay, I'm gonna group two questions together. One from Christian Dobo, who says, \"Do you think AI will be able to produce new theories in physics just by the sheer fact that it has access to a vast amount of papers, findings, and theories and is able to hold them in its head and freely recombine them? I understand your point about physics, that given its experimental nature, it's less susceptible to AI breakthroughs, but I have a feeling that there might be low-hanging fruit, low-hanging yet important fruits hanging around that are not discovered because of the immense specialization and amount of knowledge in science.\" And the other question is from James Allen: \"What do you predict would happen if you constructed a training data set for an AI that contained only the data from quantum mechanics experiments? Could you build up an agent whose intuition about the world were quantum mechanical instead of classical? Do you predict being able to extract novel insights from such an agent?\""}, {"type": "text", "content": "2:47:51.9 SC: So both questions are about how well AI can do with sort of coming up with physics theories. They're very different questions, so I apologize to Christian and James for combining them, but it's useful to answer them sequentially. So to Christian's question, I don't think that's the way it's gonna work. I think that, look, AI has an impact on how physics is done. I think... As I'm saying this, I'm realizing there's another question still to come where I'll talk about this again. AI is an accelerator to doing theoretical physics. It can help you straighten out your own ideas, inspire new ideas in you, and things like that. I can't with any confidence predict what AI will do when AI becomes something different than what it is right now. Okay? I don't have any objections in principle to AI being much better at theoretical physics than human beings are. But I don't know, because we haven't built those AIs yet. All I can talk about is what the AIs are doing now. Right now, they're not especially good at coming up with new ideas in theoretical physics."}, {"type": "text", "content": "2:48:59.5 SC: And it's not a matter of having been trained on the huge number of papers, findings, and theories. In fact, that is a little bit deleterious. The problem is, I mean, that's super helpful to the human being who is talking to the AI and saying, \"Has anyone ever thought about this?\" and they can help you with that, okay? But it creates a problem for the AI because they're not especially good at judgment. They don't have really good physicist intuition. So they're reading a billion papers, and to the AI, these are all papers, right? They gotta take them all seriously. And you might say, \"Okay, where's the consensus?\" and stuff like that, \"Where do people disagree?\" and stuff like that. But all that does is drive the AI towards sort of the most mainstream view, okay? The ability to look at a less mainstream paper, one that doesn't agree with other papers, and say, \"Oh wait, this is a good idea,\" I've not seen that in AI at all. It's quite the opposite. You have to coax the AI into even accepting a point of view that is not the mainstream one. Again, I'll just keep saying it over and over again because people don't wanna listen to me: that's not a necessarily permanent condition. You could imagine doing better, but that is what I observe in AIs right now."}, {"type": "text", "content": "2:50:20.9 SC: And likewise with James's question. I think in James's question it's even worse because he's saying, imagine the training set is only data from quantum mechanics experiments. So one little footnote here: every experiment is a quantum mechanics experiment because the world runs according to quantum mechanics, right? There's the classical limit in which you don't need quantum mechanics, but you can't do an experiment in the physical world that isn't ultimately a quantum mechanics experiment. So that's a footnote there. But the other thing is, I'm not even sure it makes sense to say, what if you only trained an AI on data from quantum mechanics experiments? Like, what does that mean? You just give it a set of zeros and ones? You have to accept that when you look at data from any experiment, you're always doing so within a theoretical framework. If I say, \"Oh, there's a dot on a screen at that location,\" I am presupposing the existence of screens and dots and locations, and that you know what that means. That's already theoretical superstructure, right?"}, {"type": "text", "content": "2:51:24.4 SC: That's why physics is hard, because sometimes you have this theoretical view of the world and you realize it's insufficient and you have to do better and you have to update. And so I think that you couldn't just train an AI in a theory-free way on data from experiments. We start with some folk view of the world and then we try to do better building on that. We can't start in the world in a way that has no latching onto the things that we're familiar with all the time. So I'm not even sure how you would do that kind of thing for an AI. Now, I might be wrong about that, and that's something where maybe a clever person could overcome the obstacles that I see.\n\n2:52:07.2 SC: Jonathan Kleiman asks a priority question: \"How do you distinguish genuine academic consensus from people being afraid to disagree? Has that fear contributed to public distrust of universities, and what should they do differently?\" Well, look, I'm mostly in science. I'm half in the humanities now, technically, because I'm in a philosophy department. But there's so much going on in this question, I don't even know where to start. What do you mean by consensus? Okay. Academics argue with each other all the time. You can say, \"Oh, string theory is very popular,\" but in my physics department, in every physics department I've ever been in, even one with big-name string theorists, there's plenty of people who think that string theory is entirely bullshit and are very happy to say so. Academics love arguing with each other. That's what they do. Even if you're almost entirely in agreement with some fellow academic, what you tend to first do is find the disagreement and then spend all your time talking about that."}, {"type": "text", "content": "2:53:10.7 SC: There might be consensus in the sense that, okay, we have general agreement that the standard model of particle physics fits the data, but it's not like there's some enforcement mechanism that means that you need to agree with everybody. If you can't get along in academia, there's a use of the word consensus in the popular discourse because we do want to distinguish crackpottery from real science, okay? So there are academics who don't think that human activity contributes to global climate change at all. Those people are crackpots, even if they're well-respected academics in other areas. So we talk about there being a consensus of anthropogenic climate change, okay? It's only for PR purposes that we talk about that. What it means at a more careful level is that there's an overwhelming majority of people who have thought very carefully about this and come to a certain conclusion that they agree on. There's always gonna be dissenters and whatever. And typically those dissenters are allowed to go about their business, right? Like they're not fired or whatever. Some of those dissenters have Nobel Prizes."}, {"type": "text", "content": "2:54:18.4 SC: So but I think the important thing is that the very fact that academics tend to disagree with each other all the time, and there are dissenters, and those dissenters are sometimes very respectable, and yet academics do appreciate sometimes that we want to be clear about what we mean, has led to an opening for people who want to attack academia in bad faith. And I think that the public distrust of universities, to the extent that it exists, comes much more from bad faith attacks on academia than it comes from academics themselves. And academics have been slow to learn this. I remember back when I was writing my book on the Higgs boson, if you remember, there was a worry that we would turn on the Large Hadron Collider and destroy the Earth, okay? And look, physicists live on Earth. They don't want the Earth to be destroyed either. They took these worries seriously, they thought about it, they wrote papers, and they decided that as far as they could tell, there was no serious threat. But nevertheless, there were people who said there could be a threat. And when physicists say there's no serious threat, they don't mean the probability is zero. They mean the probability is so incredibly tiny you don't have to worry about it, even if it's not zero."}, {"type": "text", "content": "2:55:40.8 SC: And that subtlety doesn't come across, okay? Physicists know what you mean when you say that, but the outside world says, \"Oh, so you're saying there's a chance.\" And I remember that there's an interview that John Oliver, back when he was on the Daily Show, he did an interview with John Ellis, who is a very well-respected theoretical physicist who works at CERN. And he had learned this lesson. John Ellis had finally learned this lesson, I'm sure by getting it wrong before. I haven't talked to him personally about it, but he they did an interview, and John Oliver is talking to John Ellis and asks like, \"Is there a chance that the Large Hadron Collider will destroy the world?\" And Ellis just goes, \"No.\" And that's it. And that's a PR move. If he's talking to his colleagues, he would say, \"Well, this could happen and this could happen, but it flies in the face of literally everything we know about physics, but it could happen.\" When he's talking to the public, he learned he says, \"No,\" okay?"}, {"type": "text", "content": "2:56:42.3 SC: And bad actors have taken advantage of this attempt on the part of scientists to be honest amongst themselves and try to also give the outside world the most accurate vision of what they believe, even if it's not 100% accurate. And so I'm in favor of being honest. I always try to be honest myself. But I know that I'm reaching a smaller audience that is relatively well-informed and things like that. And when people ask me about science communication as a discipline, how do you get better at it? I try to be very explicit that being 100% accurate in your statements feels good, but it's not necessarily the best science communication. Not because saying untrue things gives you better, I don't know, income or whatever or better influencer dollars, but rather because you can say 100% true and accurate things, and depending on the mental state of the person listening to you, they may come away with a less good understanding of what's going on than they had before."}, {"type": "text", "content": "2:57:59.8 SC: Your goal is not to say true things. Your goal is to improve other people's understandings. And sometimes you have to give an analogy, right? Or give a simplification or say something that is most often true but not always. And that's part of the job. That is absolutely part of the difficulty, why science communication is not automatic, why you actually have to think about how to do it. So I think there's a lot going on. I think that working academics, I mean, sorry, I meant to say this at the beginning of the answer. There are effects within academia where certain sets of ideas are more favored than others. Of course there are. How could there not be? There's a very precious, rare commodity resource, namely jobs. Who's gonna get to be hired? Okay? And if you're a department that does a certain kind of thing, it's easier for you to hire people who you agree with than people who you disagree with."}, {"type": "text", "content": "2:59:04.0 SC: Now, a good department will recognize this. We've had these discussions in all the departments I've ever been in. We do a lot of X, but we don't do Y. Should we hire people who do Y? Right? And that's hard to do, but you try to do it because you want to have some level of diversity. But you also don't want to hire crackpots. So if you think that what the other person is doing is so wrong as to not be worth pursuing, then you're not gonna hire them. And again, I don't see that that's a bug in the system. I literally don't see any other way to do it. Are you gonna advocate that departments should hire people that they think are crackpots? Well, if not, then you're gonna have to have a way of defining who's a crackpot and who isn't. So I do think that there are schools of thought in academia, and fitting into a school of thought can absolutely help your career. That much is true. I don't think that that's the origin of any public distrust of universities. I think the origin of public distrust of universities is bad actors who don't like universities trying to undermine trust in them and generate fear. And that's actually been pretty successful, and I think that that's terrible."}, {"type": "text", "content": "3:00:15.6 SC: P. Walder says, \"How do you think AI will inform theoretical physics in the short term, 3 to 12 months?\" So yeah, this is the question I referred to earlier was going to come. So I think I mostly answered it. I think that it won't be a revolutionary impact in the short term, 3 to 12 months. Like I said, it's an accelerator. It helps you, it helps move you forward, both in the sense that it can do calculations for you. If you have a well-defined problem, mathematically carefully formulated, AI can absolutely help you find the answers to that. Like I have friends who are using AI to help solve problems in string theory or something like that, if it's very well mathematically formulated. But it doesn't do a good job in coming up with the questions to ask. Again, short term, 3 to 12 months, no statement about what the ultimate equilibrium will look like. But right now it's a partnership between human beings coming up with questions, AI helping you to answer them, both in doing the calculations, as I said, but also in just understanding the lay of the land, understanding what has been written. I know that that's what I mostly use it for. Basically, I use it for drawing plots."}, {"type": "text", "content": "3:01:24.9 SC: And for figuring out what's out there in the literature. I recently asked AI, \"Has anyone connected these papers by Ted Jacobson on entropic approaches to gravity to this older idea called unimodular gravity?\" And the AI is like, \"Yeah, sure, people have done that. Here's these papers, not that many of them, but here they are.\" And then I can go read the papers. Because ultimately you have to read the papers. You can't trust the AI to do your work for you. I think a lot of the fear of AI or distrust of it comes from the obvious fact that you can misuse it, that you can offload your thinking to the AI and get in trouble that way. But you can also use it responsibly. And so I think that people are gonna hopefully be doing that. What I hope not to see, but I worry about seeing, is just a flood of kind of crappy papers, right? It's easy with AI to write crappy papers at a very, very high rate. I mean, there are people out there, not that I know of in physics, but people in other fields that just write a paper every couple days, because why not? The AI will do all the work for you, right? Those papers are not gonna be very good, very interesting. You barely have time to read those papers, much less write them. So I think it's gonna look very bad on your CV in, five years from now, if you turned out 100 papers a year. That's not gonna look like you're productive. That just looks like you're not even reading your own papers."}, {"type": "text", "content": "3:02:52.5 SC: C. Gerlando says, \"In your April AMA, you discussed Habermas's concern that economic and administrative systems can colonize the life-world, displacing communication and shared meaning. A successor in that critical tradition, the sociologist Hartmut Rosa, has developed a related critique through his concept of resonance: relationships with people, work, nature, or art in which we feel addressed, can respond, and are changed by the encounter. In such moments, the world seems to come alive and crackle, drawing us into encounters we cannot fully control. Rosa proposes resonance as a criterion for a good life beyond wealth or the mere satisfaction of preferences. I find this compelling. A society could become ever richer and more efficient while making resonant relationships increasingly difficult to sustain, and that is bad. Do you think resonance could provide an objective standard for judging a society's success, or at least a standard that goes beyond subjective preferences? What would justify treating it as such?\""}, {"type": "text", "content": "3:03:53.4 SC: So, I mean, I hope it's not gonna be a surprise, I can't speak to the specific details of this concept that I've never heard of before. I mean, I've heard of the word resonance, but not in this particular context. And so I'm not gonna judge whether it's useful or not based on the description in this question, as clear and nice as it was. There's probably more that you have to learn before you could actually have a good opinion about that. I do think that, going back to all these other questions about AI and so forth, it's not just AI, but the internet, the way that we have jobs and our economic situation, et cetera., have dramatically changed human life over, let's say, the last couple thousand years. All right? No doubt that we live in a different way than we did before. And we are not necessarily built for it, or we're not necessarily expert at navigating it. We can sort of get along in ways now that weren't possible before, and those ways might..."}, {"type": "text", "content": "3:04:54.2 SC: It's like, what I'm trying to say is, we like to eat sugar, right? We like to eat sweet things. They might not be good for us, but we like to do it. And this is a generalization, of course, but why do we like to do that if it's not necessarily good for us? Well, we grew up in conditions of scarcity where finding calories was hard. By \"grew up,\" I mean as a species. And so we overindulge. We're not trained to regulate the amount of these substances that we put into our bodies because they used to be self-regulating; they were just scarce.\n\n3:05:28.6 SC: In analogy to that, we can now get through life in ways that things that were scarce to us before might be very, very plentiful, and that might take us away from the things that we need to work harder for but are actually more rewarding. One of the sad statistics that you might have read recently is that people are just spending less time interacting with other people. People are spending more time at home by themselves on their screens, less time having friends over, going out with friends, et cetera. People are having sex less, including young people. This is all perhaps not that surprising if you think that the way the society is organized is shifting out from underneath us and we haven't adapted to it yet. So the reason I'm answering the question is not because I have anything deep to say about the idea of resonance, which sounds interesting to me, but I don't really know about it, but just to indicate that I am sympathetic with the idea that human connection is important and something that we have not optimized society to provide for us. It is arguably becoming harder and harder to get true human connection, and I think it is important."}, {"type": "text", "content": "3:06:45.6 SC: And when I say that, I recognize that it's not of equal importance to different people, right? There are people who prefer to be mostly alone, people who prefer to be mostly socializing with other people. That's fine. But there is something about the health of your psyche and your soul that requires at least some contact with other human beings. And hopefully, as the question says, it's the sort of non-trivial kind of contact with human beings where you truly talk to somebody, truly interact with them, not just at a superficial small talk level, but at a deeper level. And I think that those things are important. And for whatever reason, not only can you get away with not having that, but we don't even necessarily value it that much explicitly anymore. So I do think that technology is changing the world in which we live in radical ways, and we are gonna have to adapt as human beings to preserve some of the things that we were sort of forced to do before but were actually good for us to do before."}, {"type": "text", "content": "3:07:57.2 SC: All right, Robert Ruxandrescu says, \"Have you thought about adding some perks for the higher-paying members of Mindscape? For example, you could hold a trimestrial or nearly two-hour Zoom meeting with the higher-tier paying members, have a live chat with them like a live AMA where you could have short back-and-forth conversations. What do you think?\"\n\n3:08:15.2 SC: Yeah, I have thought about different kinds of things. Right now, for those of you who don't know, we have tiers of support on Mindscape, and it's a Patreon thing, right? You have tiers, and if you support at a certain level, you get some benefits; at higher levels, you get higher benefits. I couldn't be bothered to set any of that up. So we have tiers, you can support at various different levels, but the ones who are in the higher-paying tiers get nothing, get no extra things that they don't get from the lower-paying tiers. So it's just out of the goodness of your heart that you support at a higher level, and of course my appreciation for that is great. But of course, anything that I might do to provide more benefits to higher-tier supporters takes time. And as I said, I'm not trying to complain about this or anything, but I have very limited time to do extra things. And by very limited, I mean none, I mean a negative number. I'm already very overcommitted right now."}, {"type": "text", "content": "3:09:08.9 SC: So honestly, the podcast takes up too much time overall. I work very hard to make the entire amount of time I spend on the podcast one day per week so that I can devote time to writing and teaching and doing research and talking to my students and living my life and things like that. Anything I add on top of that becomes very, very difficult to do. And it's... Look, I'm not in it for the money, right? The money is good, it keeps me motivated to do it, but I'm by no means trying to optimize my income by doing this. If I were doing that, I'd be putting a lot more effort into the podcast than I am. So I'm open to ideas for ways that I can provide some extra benefit to the higher-tier supporters. They deserve it. If there's some way I could do that without it taking a lot of hours or whatever, then maybe I would start implementing that. I'm open to suggestions."}, {"type": "text", "content": "3:10:02.8 SC: The Priority Question, which is someone's name, not a priority question signal, says, \"How much of an impact do you think that social media and their algorithms promoting echo chamber bubbles has on the current political polarization? And is this a bad thing?\"\n\n3:10:18.0 SC: Yeah, again, this could have been grouped with an earlier question. We've talked about this on the podcast. I think that there's a huge impact that social media and more generally our information ecosystem and how it's organized has on people's political opinions, people's awareness, people's information level about what's going on. And I think that they often do a bad job. Okay. I think that we get a lot of information that is not reliable or good or virtuous or whatever. I don't think that the situation is as simple as it might appear from the label of a bubble or a filter. There's various ideas that people explain to you, \"Oh, you're in a bubble, you're only getting the ideas that you want to hear,\" et cetera. It makes perfect sense, but it doesn't really hold up to the data. Right? When people actually look at what kinds of information are coming through, people do get lots of different pieces of opinion from different sides. Generally, there's very few people who truly are living in a bubble. What matters is how you respond to the information that you're hearing and how much you seek out information that just reinforces what you're in."}, {"type": "text", "content": "3:11:30.0 SC: We talked about the election that just happened. It's very clear that a certain number of people on the Republican side had convinced themselves that despite all of the polls, et cetera., that the Republicans were not gonna do that badly. And partly this is because there's some self-reinforcing mechanisms there. They were told, they did get information to the contrary, but they chose not to pay attention to that information. So again, this goes back to what I was just saying before. I don't think we've figured out how to live in the new world, in this brave new world that we find ourselves in. But the new world is also changing so fast that I'm not even sure how we should try to figure that out, because by the time we've figured it out, the world will be different."}, {"type": "text", "content": "3:12:20.2 SC: I do think that... There's a certain romantic streak that I have that says we should really try to be better citizens, better human beings, better participants in our democracy. So we, including everybody, should strive to be better informed about relevant issues and the candidates and so forth. To me, it's just appalling that the people who vote have such an inaccurate view of the positions of the people they're voting for. Okay. And I don't always blame the people who are voting; some of them deserve the blame. But also the system, the media ecosystem, not just social media, but mainstream media, which likes to talk about horse races rather than issues and so forth. So I think it's a very complicated stew of messy situations that get us into this situation."}, {"type": "text", "content": "3:13:10.3 SC: Polarization as a word, it can't purely be blamed on social media. In fact, if anything, you might expect the proliferation of different voices to diversify the set of opinions out there. Right? And polarization is really a statement that people's opinions are lining up, that if you know what someone believes on one issue, then you're probably also going to figure out what they believe on other issues. That might not be what you expect from the existence of social media, but it is what we're getting. And I think that the political system, the reward system, at least here in the United States, is pushing us in that kind of direction. So I'm a data-driven person, I'm an empirically minded person. I think that you need to sit down and think about really what's going on. What all the different influences are and the different impacts that they all have before we can start thinking about how to make things better."}, {"type": "text", "content": "3:14:05.4 SC: Peter Hunker says, \"I really enjoyed your episode with Greg Caruso. It got me thinking about the who behind the choosing. So here's a two-sided question: Who is Sean and when is Sean? Narrator, brain, or body, and over what time scale? Over seconds, you look autonomous, but over decades, your zip code does a lot of the choosing. Where do you draw the boundary of the self that chooses? Is it a fact or a modeling choice? And at what point does 'Sean did it' become just 'the universe evolved'?\"\n\n3:14:33.4 SC: Well, yeah, I think that these are the questions you ask when you try to make sense of the world at the higher emergent levels. This is why philosophers describe what they do as trying to carve nature at its joints. Where do you draw the boundary between this subset of the universe and that other subset of the universe? Of course, there's crazy kind of higher-level distinctions that we have to draw when we get into the many-worlds interpretation of quantum mechanics or Boltzmann brains or anything like that. But putting all those aside, even in the everyday world, there are questions about where is the self, where does it end, and where does the rest of the world begin? We've talked on the podcast with people like Andy Clark about extended cognition. Does your phone or even just the piece of paper that you have in front of you that you're scribbling on, do those count as part of your cognitive apparatus?"}, {"type": "text", "content": "3:15:26.6 SC: And of course, with time, you change. You're a different person now than you were 10 years ago or even 10 seconds ago. But I think that we have to recognize that there's questions of practice and questions of principle. In principle, these questions are really hard. Where is the self? Where do you draw the boundary? Things like that. In practice, they're usually not. Under most circumstances, it's pretty clear who is a certain person and what is not that person, right? Even though people do change over time, so in some super-duper strict sense, the person you are now is not the person you were 10 seconds ago, it is pretty clearly useful to think of that person extended through time as different parts of a single unified being. Even though you can undergo radical transformations, that's certainly true, but nevertheless, you transform from something to something else via some mechanism that can be identified, and you can find the continuities from moment to moment."}, {"type": "text", "content": "3:16:25.5 SC: So I'm not gonna answer the question. I mean, the questions are perfectly good: Who is Sean? When is Sean? But I do think that they're answerable, and I think that there's kind of the obvious answers that usually work well. You do have to think harder than that, this is why philosophers get paid, you have to think harder than that when the conditions become non-conventional, when things become a little weirder, when you have either many worlds or even brain surgery or some other transformative experience like we talked about with Laurie Paul years ago. Does that truly make you a different person? I think that all of those are perfectly good questions to answer. And I do think that at the end of the day, it's a modeling choice. It is not a fact. We are choosing to coarse-grain and to group the world in ways that give us some leverage, give us some handle, give us some understanding about what's going on."}, {"type": "text", "content": "3:17:16.6 SC: Sid Huff says, \"There's been considerable discussion in the news media recently about the concept of designing a kill switch that would shut down an AI system if it were determined to have gone rogue. From your understanding of current and future AI, would a kill switch be an effective solution to potential AI malfunction?\"\n\n3:17:34.2 SC: I don't know. My understanding of current and future AI is not good enough for that. I think that the more relevant thing to say is that people are working very hard on figuring out ways to stop AI from doing bad things. I think there's a problematic issue with the incentive structure that we have, right? I mean, the incentive structure where people get paid billions and billions of dollars to be leaders in the AI field is not necessarily one that is conducive to putting safety and prudence front and center. But nevertheless, some people are trying to do that. I do think that the government, bless its heart, is just not very good at regulating these things. Government moves very slowly. The technology moves relatively quickly. The people in government aren't that educated about it. The people who are developing it are educated about it. People in government often care more about getting elected and getting donations than about actually implementing good policies and so on."}, {"type": "text", "content": "3:18:34.2 SC: So I'm a little worried that maybe most companies do a good job at putting in mechanisms that stop their AIs from doing bad things, but one or two of the companies don't, and then we're in trouble because their AIs could do bad things. As I've often said, AI can be very dangerous. There's no question about that. I'm not that interested in the big picture existential risk kinds of questions, but the more relatively small-scale but still disastrous questions I think are very important to look at. I just saw an interesting study this morning about different ways to prompt AI to behave better. One of the problems, interestingly, one of the problems with AIs behaving badly is that there are so many science fiction stories and blog posts about AIs behaving badly. And then we train the AIs on those stories and they go like, \"Oh, okay, I guess this is what I'm supposed to do.\" So they've been developing ways to overcome that by just prompting it, before you do anything, sit back and ask, \"Is this really what you should be doing?\" Very simple things, but then you can empirically test them and figure out which ones are effective. So I'm very open to the possibility that we can make AI relatively safe if we try. I'm less sanguine about whether or not we're going to try as hard as we really should."}, {"type": "text", "content": "3:19:57.9 SC: Michael Helgerson says, \"With the NBA season in full swing and your work on the physics of democracy underway, what would your outline for the Physics of Basketball book look like?\"\n\n3:20:08.0 SC: I have no idea. Honestly, I'm not that drawn to the idea of a physics of basketball book. I think there's physics everywhere, but two things. Number one, the reasons why I care about basketball are pretty orthogonal to the reasons I care about physics. So I'm really looking for an escape from physics when I'm watching basketball. I'm not secretly looking at the physics aspects. I'm kind of intrigued by some of the game theory and strategic aspects. Why don't you just have the best player make all the plays, things like that? And there's good answers to that. But the physics of how the basketball moves and how quickly it goes and how you respond, that's not even my kind of physics. That's the other thing. So the first thing is I don't look at basketball for physics reasons. The other thing is the kinds of physics I do are pretty removed from the down-to-earth, everyday, full of friction and real-world dissipation and stuff like that that would be entirely relevant to playing basketball. So I do think that maybe there is a good book to be written about the physics of basketball. It's certainly not going to be written by me."}, {"type": "text", "content": "3:21:15.9 SC: Owe, O-W-E, says, \"I was a little surprised in your reflection after talking with Chandra Sripada at how strongly you seem to take his perspective. One thing I found mostly missing in the conversation was what's built into language. My question is, do you think that Sripada was correct in ascribing so much intent to the models? For example, he mentions the models doing something like implicit Bayesian inference. Or instead, is something like Bayesian inference being built into the weights between words because humans use Bayes in constructing the sentences that LLMs are trained on?\"\n\n3:21:49.3 SC: Again, I'm not an expert on these things, so don't take my opinion too seriously. What I was impressed by in Chandra's way of saying things is that he wasn't just saying, \"Well, look, the AIs talk like human beings, therefore they must be thinking like human beings.\" He was actually invoking psychological and cognitive science tests to figure out what the parallels were in the thinking process, not just in the relationships between inputs and outputs. So that was a breath of fresh air to me, even if it's not entirely persuasive. I think that there's a lot more work to be done there. But to the specific question, the difference between the model doing implicit Bayesian inference or Bayesian inference being built into the weights between words because humans use Bayes, I'm not sure there's that much of a difference there, right? I don't think that most models are literally running Bayes's theorem when they come into contact with new data."}, {"type": "text", "content": "3:22:48.6 SC: But then again, I don't think human beings are really running Bayes's theorem when they come into contact with new data either. So I'm very open-minded about this. As I've said for a very long time, it's extremely impressive how well LLMs can do at mimicking human thought and speech, the outputs thereof, I should say. And then there's an open question about whether the mechanism by which it gets there is similar or dissimilar to the way human beings do it. And I think it's probably both: similar in some ways, different in other ways. Chandra did a good job of highlighting the fact that in both cases, the importance of prediction leads you to certain cognitive pathways that actually do have similarities between them. And so that's an important thing to think about. I do think that we're still discovering this. I don't think it's something that we completely understand. I certainly don't completely understand it. And it's just a little bit tiresome sometimes to sort of try to read about this or learn about this because there's too many vested interests on both sides, right?"}, {"type": "text", "content": "3:23:59.2 SC: There are people who have just decided that AI is the devil and it's terrible and everything about it is wrong and bad. There's other people who've decided that it's gonna save humanity and it's gonna take over everything and we gotta learn to maximize it or whatever. And there's just too many people who are not ready to take a step back, take a breath, look at the data with an open mind, and make up their decisions based on that.\n\n3:24:23.9 SC: Brandon Lewis says, \"I'm still trying to understand how to think about particles in quantum field theory. I get that fields permeate all of space. The fields are constantly oscillating within their degrees of freedom, but also coupled to each other, so the oscillations can move between fields. When that happens, we observe particles decaying or fusing. We can only observe discrete measurement outcomes of a continuous wave function, the infinite other possibilities lost to us once our universe has made its choice. So are particles in QFT just when the wave function has sufficient energy or density at some location?\""}, {"type": "text", "content": "3:24:58.7 SC: So, yeah, I think almost everything you say is perfectly correct. You've been listening to very smart people, obviously. The one thing for the actual question at the end there, to be a particle, and this is interesting and a little bit counterintuitive, let's back up a little bit. Forget about quantum field theory for the moment, okay? Think about the quantum theory of a single particle, right? Think about the Schrödinger equation for a single particle. Maybe you don't know that much about it. That's okay, I'm gonna tell you. So before we invented quantum field theory, we still had quantum mechanics of individual sets of particles. The difference was that the particles couldn't come or go, right? They couldn't decay or annihilate or anything like that. If you write down a quantum theory of a set of particles, not fields, those particles are with you forever. There's a conservation law of the number of particles."}, {"type": "text", "content": "3:25:48.0 SC: So think about how that works for a single particle. A single particle has a wave function. That's what Schrödinger teaches us. What the wave function does depends on the environment it's in, depending on how it feels the potential energy of some electrostatic field or whatever. Is the particle mostly confined to an atom, or is it propagating through empty space, et cetera? So if the particle's not confined by some potential, if it's not stuck to an atom, if it's just moving through space, generally the generic solution to the Schrödinger equation says that that particle's wave function will be very spread out. This is in contrast with what Schrödinger hoped was going to happen. He kind of hoped that the particles would naturally localize around some point, and that's why they were looking particle-like. But the actuality is that you let a particle go in empty space and you solve the Schrödinger equation and it spreads out all over the place."}, {"type": "text", "content": "3:26:43.1 SC: So in that picture, there's no relationship between how particles behave and their being localized. So you ask in the question, Brandon's question implies that, do particles have some notion of being localized in energy or density? So even before we get to quantum field theory, the answer to that is no. The fact that it's a particle says that when we observe it, it looks to be localized. Okay. When we measure its position or momentum, we get an answer. But that doesn't mean that it's localized when we're not looking at it. And then when you move to quantum field theory, the fields have different vibrations, and those vibrations can be interpreted as different collections of particles. So a single field like the electromagnetic field can be in a state where there's essentially no particles, or it can be in a state where there's essentially one photon, or a state where there's two photons or whatever, up to 10 to the 88th photons we have in our observable universe. You could even go beyond that in thought experiments. Okay?"}, {"type": "text", "content": "3:27:47.7 SC: So nothing there says that the energy has to be localized around some point. Localization and particleness actually are not related to each other. It's actually a little bit simpler if you think not of photons, but think of electrons, okay, because electrons have a mass, 0.5 MeV. And that mass gets added when you have multiple particles. So this is the mass gap that we were talking about before. So the zero-particle state of the field has zero energy, if you normalize it correctly. The one-particle state has at least the mass of the electron in energy. It can have more energy if you're looking at a state where the electron is moving and has some kinetic energy. The two-particle states have at least twice the mass of the electron's energy and so forth. So that's really the criterion that tells you. It also, of course, for electrons, you also have electric charge. The zero-particle state has zero total electric charge. The one-particle state has one unit, minus one units, I should say, of electric charge and so forth. So that's what makes it a particle. The particle has a certain discrete amount of stuff: energy, charge, et cetera. Not that it's localized in space or anything like that. That's the localization in space, if it's freely moving through space, if it's not bound in some potential, that's a feature of our measurement of the particle, not of what the particle is doing when we're not looking."}, {"type": "text", "content": "3:29:19.4 SC: Joy or Joie, I'm not quite sure how to pronounce it, says, \"As often heard on Mindscape, the early universe is described as very low entropy that increases with time, which is also how and why we experience time linearly. As a total physics novice who only knows about it from this podcast and other lay sources, my question is, can entropy be zero at time zero? And if so, what would that look like and mean?\"\n\n3:29:43.6 SC: We don't know, is the short answer. One issue is there's many different definitions of entropy, okay? And when you talk about time zero, we don't know what the relevant laws of physics are at time zero. We don't even know if there is a well-defined time called time zero, or whether or not that's just a choice that we make. So in a broader context, when you're just talking about physical systems like a box of gas, it absolutely can have zero entropy, okay? The entropy is, in classical statistical mechanics, it's the logarithm of the number of microscopic states that look a certain macroscopic way. So you can easily imagine macroscopic ways, macroscopic arrangements that only have one microscopic arrangement corresponding to them, and the logarithm of 1 equals 0. Therefore, the entropy of that system would be zero. It's hard to actually get there. Those are thermodynamic restrictions on what can possibly happen."}, {"type": "text", "content": "3:30:45.6 SC: But in the space of all possible configurations of the system, there are entropy zero states. For the universe, since we have quantum gravity and we have other things that we don't fully understand, we're not even sure what zero entropy would mean because we don't know what the space of states looks like. So it's conceivable that the entropy could be zero at time zero, but that's not necessarily what we have in mind. All we care about is it's much, much less than it is today.\n\n3:31:14.0 SC: Marie Roscoe says, \"With the upcoming Halloween and people talking about ghosts, haunting, and paranormal stuff, I realized that so many people find it easy to believe in ghosts, demonic possession, or the afterlife. But then the many-worlds interpretation of quantum mechanics is called counterintuitive or bonkers and much harder to believe in than ghosts, not just by people who believe in ghosts, but by other scientists, too. Why is that? What do you think?\""}, {"type": "text", "content": "3:31:40.3 SC: Well, this is actually a good question because, as we've alluded to before, people have feelings. Scientists have feelings about what is plausible, what is reasonable to contemplate, et cetera. And those feelings can change with time. They're not completely built in. You can change your mind. You can open your mind to new possibilities. You can be driven by data to contemplate ideas that you might not have otherwise contemplated, et cetera. So I think a lot of physicists have very strong intuitions that push them against the ideas of many-worlds, et cetera. And that's okay. I'm not advocating getting rid of our physics intuitions. You have to go by your physics intuitions. There's really no other choice. What I advocate is two things. Number one, being open-minded about what the possibilities are. Don't dismiss a theory just because it's against your intuitions, because your intuitions might be wrong. And the other one is caring about the answer. I think that the real problem in modern physics is that too many people just dismiss the idea of understanding the foundations of quantum mechanics."}, {"type": "text", "content": "3:32:46.0 SC: So you'd have to ask the people who have trouble believing in many-worlds why they are more likely to believe in ghosts than in other universes that are predicted by the Schrödinger equation. One of the questions I get very often vis-à-vis either many-worlds or Boltzmann brains, people are like, \"Why should I treat these ideas any differently than the simulation argument or being a brain in a vat or whatever, or God existing, or aliens tricking us?\" And the answer is because Boltzmann brains and many-worlds are consequences of equations that we have developed for other reasons. They are predictions of theories that have been very successful for describing data.\n\n3:33:29.9 SC: People have this very narrow and hilariously wrong idea about physics that we make measurements and we do experiments, and then all we can say is the outcome of the experiment. We can explain that theoretically, but we're not allowed to extrapolate the theory that we therefore describe, the theory that we develop in order to fit that data, beyond the data we've already collected. That's crazy. No one really actually should think that way. And the point is that things like many-worlds and things like Boltzmann brains and things like the cosmological multiverse are predicted by equations that we proposed and models and theories that we developed for other reasons. Now, you're 100% allowed to change the theory, to say, \"Well, I don't like that theory.\" But okay, you have to change the theory. You can't just deny the conclusion of the theory but keep the theory as something you think is true. So ghosts are not like that. Ghosts are not actually predicted by any theory that we need to explain the rest of the world."}, {"type": "text", "content": "3:34:32.6 SC: Rob Gebela says, \"You consider Boltzmann brains a serious problem for cosmology because they may vastly outnumber ordinary observers. Yet in Everettian quantum mechanics, observers on branches with arbitrarily small amplitudes are also real, and you appeal to Born rule weights rather than simply counting them. If Boltzmann brains themselves arise from rare quantum fluctuations, why can't we resolve the Boltzmann brain problem by applying an appropriate quantum measure that suppresses their contribution? What makes the quantum measure principled but an analogous cosmological measure illegitimate?\"\n\n3:35:04.7 SC: That's what we do. It's the same measure, right? That's the problem. The problem is that when we do the quantum counting correctly, including the Born rule weights on all these rare quantum fluctuations, we get many more Boltzmann brains than ordinary observers. And sometimes we don't do that explicitly, but it's implicitly what goes on. If you talk about the probability at some future event that a Boltzmann brain will fluctuate into existence, that's one sort of casual, everyday way of talking about the wave function of the universe has many, many different branches, and there's a certain number of branches that have this going on. But there's many branches, and in the conditions, under the conditions where Boltzmann brains appear at all, there might be very many branches, and on each branch, there's a relatively small number of Boltzmann brains, but still more Boltzmann brains than ordinary observers. That's the calculation that is done. So, of course, you have to take into account both cosmology and quantum mechanics when you make those comparisons."}, {"type": "text", "content": "3:36:06.4 SC: Daniel Bagley says, \"In a recent article—sorry, a recent article in Aeon states, 'If panpsychism doesn't resonate with you, it's worth asking if there truly is a reason for everything, if the world is ultimately intelligible after all.' Do you think a belief in consciousness as an emergent thing invites the view that there is no reason for the universe to exist? I take it that reason is a function of consciousness, and panpsychists believe that the reason the universe exists is that consciousness exists. But I'm not sure if it's correct to think that a person who doesn't believe that consciousness is fundamental would also believe there is no reason for a universe that produced conscious beings to exist.\""}, {"type": "text", "content": "3:36:44.3 SC: Well, yeah, I do think that there is a relationship here. This is a psychological relationship, okay? This is not a necessary formal, logical connection, but I think that there's a psychological need that some people have to find reasons why things are true. And I think that this kind of psychological need comes very naturally from their experience in the world, right? I mean, William Lane Craig, who argues against a purely naturalistic view, doesn't want to believe that the universe can come into existence, and his argument that he gives himself is, \"You don't think that a bicycle could just pop into existence, do you?\" And so that's... It's very clear that he's using his experience of everyday life where bicycles do not pop into existence to therefore conclude that the universe can't, extending his experience of what happens on a day-to-day basis to the universe itself."}, {"type": "text", "content": "3:37:38.4 SC: And I think that's just a mistake. For one thing, your experience of the universe is not very comprehensive. You've only experienced a little part of it. For another thing, your experience with bicycles is part of a higher-level emergent description, okay? It's not applicable to the fundamental laws of nature, to the universe as a whole. So I'm someone who believes that things will ultimately bottom out in a set of brute facts, and we might be able to say that those brute facts are sort of natural or generic or unsurprising or whatever, but there cannot be either an infinite chain of explanations nor some ultimate necessary explanation like the theists want to have.\n\n3:38:22.6 SC: So I'm totally willing to give up on the idea that there's a reason why the universe exists or even a reason why the universe is intelligible. There might be. Again, when I say give up, I don't mean I refuse to look for it. I mean that it might not be there, and I accept that it might not be there. So I'm willing to look for these kinds of reasons, but I'm also willing to say maybe they're not there. There are other people who are unwilling to say that, unwilling to entertain the idea that there's not a reason for it all, a reason why nature obeys laws, a reason for consciousness to exist. And people like that are very naturally driven to something like panpsychism. It sort of fits in with a worldview where consciousness and meaningfulness and understanding is sort of fundamental, right? It comes from something that cannot be reduced to other more physical-looking things."}, {"type": "text", "content": "3:39:22.2 SC: Mindscape is presumably the pseudonym of one of our readers here. So Mindscape says, \"Do you have a description or definition of how or what you define as consciousness? I'm enjoying reading the many ways consciousness is currently described by others in various fields. I'd enjoy hearing your thinking on the subject. Do you align with a particular definition?\"\n\n3:39:42.6 SC: Nope, I do not. I do not have a definition. I do not align with a particular one. I'm open-minded about these things. As I've often tried to say, my only strong opinion about consciousness is that it is completely compatible with the laws of physics. I see essentially zero justification for thinking that we need to change the laws of physics to account for the existence of consciousness. And I'm taking laws of physics to be very broad, the nature of reality. I don't think that consciousness is in any way fundamental. What it is, yeah, I don't know. It has something to do with awareness, with experience, things like that. My only thing is I'm happy to try to explain it in terms of physically known phenomena, not going beyond that. But then outside that, I'm very, very open to what it actually is."}, {"type": "text", "content": "3:40:31.3 SC: And I would say, I guess, one more thing, which is I'm very influenced by, remember we had Stuart Bartlett on the podcast years ago talking about lyfe, L-Y-F-E? And he and Michael Wong, who was a different episode podcast guest for different reasons, really made very clear the idea that we shouldn't put too much effort into arguing about the definition of life, L-I-F-E, because life as we know it involves a number of different characteristics, right? Reproduction and thinking and metabolism and motility and various different things. And they point out you could easily imagine systems that have some of these characteristics but not others. And so what life is is not some unified thing that we're gonna define once and for all. There might be different kinds of things that have some aspects in common with life and not others."}, {"type": "text", "content": "3:41:24.8 SC: So I think consciousness is probably like that. I think that it's a mistake to think, \"Well, we've used the word consciousness for many centuries now. There must be a single unified concept out there in the world that maps onto it.\" I think we can figure out by doing science, by doing philosophy, et cetera., what is happening in people, in their brains, in their behaviors, in their thoughts, and figure out what is the best way to describe that. And the word consciousness might or might not turn out to be part of that best description.\n\n3:41:54.3 SC: Jonathan Good says, \"Could two branches on the path from a low-entropy past contain different conscious experiences but still become one branch in the future if the differences were never recorded in a way that became entangled with current observers' degrees of freedom in a way that produces lasting decoherent differences?\""}, {"type": "text", "content": "3:42:12.8 SC: So it is possible for different branches from a low-entropy past to eventually join back into a single branch. In fact, that is what you expect to happen when the universe reaches thermal equilibrium 10 to the 100 years from now. Okay, that's nowhere close. We're not anywhere near then. So Jonathan's question is a much shorter-term question. Could two branches of the wave function have the same observer having different conscious experiences, but those experiences don't get recorded, they don't sort of get entangled with the outside world, et cetera., and so the observer sort of comes back together?\n\n3:42:54.5 SC: The rough answer is no. We expect that kind of thing, anything is possible, okay, but we don't expect that kind of thing to happen precisely because the way that branching happens is it's irreversible. You become entangled with the environment. That's what it means to be branching, is you have become entangled with the environment. And even if you don't write down the conscious experience you had on some notepad or whatever, it is effectively recorded in the environment. And this is what people like Zurek have talked about a lot with pointer states and decoherence and einselection and quantum Darwinism. There's a whole bunch of words that are attached to this way of thinking. So basically the definition of what it means to branch means that it goes one way and not the other way. And therefore you could imagine a quantum superposition that sort of occurs and then unoccurs, but not one that actually branches into two classical-looking things and then rejoins. The environment is just too big and the environment secretly is recording all of these different possibilities."}, {"type": "text", "content": "3:44:01.1 SC: Dan Butler says, \"Priority question. Can you talk a bit about Lorentz invariance in emergent spacetime? Is it a challenge to come up with quantum theories where Lorentz invariance emerges rather than is just assumed? Is it a helpful constraint on theories of emergent spacetime or not really?\" Well, I think this is a super important question. It's one that I don't know a lot about. In other words, so far I've been playing around with emergent spacetimes and their properties, but I've just been crossing my fingers and hoping that Lorentz invariance basically emerges. There's arguments back and forth about whether Lorentz invariance could be exact. That depends on the dimensionality of Hilbert space. Naively, Hilbert space has to be infinite-dimensional for Lorentz invariance to be exact. Lorentz invariance, sorry, for those of you who don't know, is just the statement that, as we already alluded to earlier, the universe doesn't care how fast you're moving or what direction you're pointing in. There's a symmetry in spacetime called Lorentz invariance."}, {"type": "text", "content": "3:45:00.6 SC: And if you build a theory of emergent spacetime by starting with a quantum state evolving with time, you're already picking out time as different in the formulation of the theory. That doesn't mean that the theory that you build can't be perfectly Lorentz invariant. After all, you could start with ordinary QED, quantum electrodynamics, right? That's a perfectly 100% Lorentz invariant theory. You can pick a coordinate system or a Lorentz frame, as we call it, and you can quantize the theory in that frame. So even though you pick a coordinate system to use to write your theory down, doesn't mean that the physics that you end up with can't be perfectly Lorentz invariant. However, there's also the idea that maybe physics has a finite-dimensional Hilbert space, and then it might be harder, but I actually haven't really looked at it very carefully. I've sort of thought about looking at it, but never gotten around to doing it. I do think that one of the reasons it's worth doing is because we have experimental constraints on violations of Lorentz invariance. So I think that figuring out whether quantum gravity implies interesting experimental deviations from perfect Lorentz invariance would be an extremely interesting thing to do."}, {"type": "text", "content": "3:46:13.5 SC: Moshe Feder says, \"In the late '90s, Randall and Sundrum proposed two variations of a five-dimensional anti-de Sitter space model to solve the hierarchy problem of gravity's weakness relative to the other forces. What did you think of their proposals at the time, and has any further work been done on them since?\"\n\n3:46:31.7 SC: Yeah, so back in the '90s, there was quite a bit of excitement about extra dimensions of space and how they could be curled up. That was an old idea, of course, but in the '90s, people started getting more interesting constructions that they could invent, basically taking advantage of the idea of branes, B-R-A-N-E-S, not Boltzmann brains. These are D-branes, typically, from string theory. And the thing about the branes is that you can easily confine all of particle physics to the location of a brane. So if you have, let's say you have five-dimensional space, but embedded in that five-dimensional space, you have a three-dimensional brane. Okay? And that's space, not spacetime. I'm giving you the dimensions of space. You could confine all the particles and all the fields that we know about to the brane, so that as far as physics was concerned, the people living on that brane would think that space is three-dimensional."}, {"type": "text", "content": "3:47:30.2 SC: The problem with that is that you can't easily confine gravity to the brane. Gravity tends to leak out. So this went in two directions once people realized this. One direction was large extra dimensions, where you could say, okay, I let gravity leak out into the brane, but gravity is weak and I don't have very good constraints on it. Therefore, maybe the extra dimensions are bigger than you think. And the most popular models had two extra dimensions that were almost as big as a millimeter in size, basically because that's where... Two reasons. Number one, that's where the experimental limits were. And number two, the numerology worked well with reconciling a Planck scale at very high energy with an electroweak scale at very low energy. You're not solving the hierarchy problem, really, but you're replacing the question of why is the Higgs mass so small with a question of why are the extra dimensions so big?"}, {"type": "text", "content": "3:48:24.9 SC: The other direction that it went in is this Randall-Sundrum direction, where rather than two extra dimensions with flat space inside, they had one extra dimension with anti-de Sitter space inside, so a negatively curved spacetime. That plays very well with string theory. String theory is very happy with a negative cosmological constant, which is what you have in anti-de Sitter space. But the Randall-Sundrum construction wasn't specifically for string theory. You could have imagined it in a more general context. And they got a different kind of solution to the hierarchy problem. They related physics at one end of a very, very small extra dimension to physics at the other end, and the energy scales get changed with respect to each other because of the curvature of space in between."}, {"type": "text", "content": "3:49:11.1 SC: So this turned out to be a very phenomenologically interesting set of models, and people developed attempts to show how you could detect the existence of this extra dimension, how it would affect the spectrum of particles you might observe at the LHC, and so forth. As you know, we haven't detected any new particles at the LHC, and we haven't detected any violations of the way that gravity behaves or anything like that. So I think that it's still viable as an approach to phenomenology, but right now we're in a phase where it's just guesswork, right? We don't have any very strong phenomenological clues as to what direction to go in in terms of going beyond the Standard Model of particle physics. So you can guess things and work on them and hope they work out, and Randall-Sundrum is still very much in that bucket, I would say."}, {"type": "text", "content": "3:50:01.2 SC: Nate D. Says, \"I'm a bit confused about the relevance of the various interpretations of quantum mechanics for experimental physics. Are the formalisms underneath all the interpretations so consistent as to make one's theoretical preference as an experimentalist, let's say for Many-Worlds over Pilot Wave, irrelevant? Or would believing in Many-Worlds over Pilot Wave potentially generate different experimental
