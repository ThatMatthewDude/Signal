cast we've ever produced, as well as access to our comments section and members-only exclusives."}, {"type": "text", "content": "A “software Beirut”? Apps and emails and agencies going down? Advisories to stockpile supplies? On this week’s Suspension of the Rules , Isaac, Kmele, and guest host Audrey Moorehead break down AI-related fears and how they’re thinking about the past week’s news. You can watch here:\n\nThe latest episode\n\nHey guys, Isaac here —\n\nYou know I love good food, and I’m always up for cooking a great meal. But let’s be honest: Between work, family, and everything else life throws at you, sometimes just figuring out what’s for dinner feels like a chore.\n\nThat’s why I love ButcherBox . It’s built for real life: high-quality meat delivered right to your door, ready whenever you need it . No last-minute grocery runs or sacrificing quality on busy nights."}, {"type": "text", "content": "I was using ButcherBox before they became a Tangle partner, and it’s become a staple in my kitchen. Having quality meat stocked in the freezer makes getting a great meal on the table that much easier.\n\nRight now, new members get FREE steak and bacon for life + $20 off with code TANGLE .\n\nThe technology outages. Over the past week, a slew of outages across industries, service providers, and government agencies have heightened concerns about vulnerabilities in U.S. technology systems and the threat of artificial intelligence-driven cyberattacks. The notable examples include:\n\nAside from the attempts to hack the 178 websites, affected companies and the federal government have maintained that the issues were not cyberattacks or connected to one another. However, some experts have said to expect more outages in the near future as companies seek to patch vulnerabilities in their technology in response to AI-related threats. On Monday, the Google Threat Intelligence Group released a statement saying “the era of autonomous attacks has arrived,” adding, “Bad actors are now using autonomous LLM frameworks to continuously scan software updates, figure out what flaw was patched, and build an attack for it — all without human involvement.”"}, {"type": "text", "content": "The Trump administration says the outages are not linked. “We have no indication that these incidents are related, that they’re coordinated,” Director of National Intelligence Jay Clayton said . “We also have no indication that they’re [the] result of a state-sponsored malign actor.” Furthermore, during a House Homeland Security Committee hearing on Wednesday, Homeland Security Secretary Markwayne Mullin said , “I’m 98% confident that this has nothing to do with our adversaries hacking or going after our systems.”\n\nBelow are views from the left and right on the outages, followed by Executive Editor Isaac Saul’s take.\n\nIn The Atlantic, Ian Bogost suggested the “incidents could be related — unless they are not.”"}, {"type": "text", "content": "“The proximity of these events makes them feel related. And maybe they are, in a way,” Bogost wrote. “Computer systems of all kinds have always gone down briefly. It happens every day. Why, suddenly, are people pretending that they expect every one of these machines to always work properly? Seeking, finding, decoding, and interpreting information that would answer these questions proves difficult.”\n\n“The ignorance I am earnestly expressing about the nature of these events might later be proved foolhardy if a more widespread underlying circumstance reveals itself to be responsible, or even contributory,” Bogost said. “It would be both irresponsible to claim that I hold greater knowledge than the none that I actually possess, and embarrassing, besides, to be proved wrong. And so the door to a Widespread Problem must remain open to the unknowable future.”"}, {"type": "text", "content": "In The Nation, Elie Mystal said “make America function again!”\n\n“The United States is not failed , but it’s far from functional ,” Mystal wrote. “Republicans run for office on the claim that government cannot work, and then spend their time in power destroying government just to prove that they were right. Neoliberals help Republicans by ceding critical government functions to the private sector, which in turn ignores the public good in an all-consuming chase for greater margins and profits.”\n\n“The problem is not that we’re reliant on technology; humans have always relied on technology… The problem is that the tech is no longer made to be reliable. The tech is made to make money,” Mystal said. “[AI] is a technology that few people understand, and worse, the ones who do understand it are warning us that they can’t control it. We’re also using the AI to replace human workers, so when the AI breaks, our only choice is to ask the AI how to fix it.”"}, {"type": "text", "content": "In CNN, Stephen Collinson wrote about “what should really scare Americans.”\n\n“There’s no public evidence that any of the recent incidents were due to cyberattacks by a hostile power or criminal organization,” Collinson said. “Fears over whether this string of meltdowns might be the work of some unknown adversary, while understandable, may be a distraction from more material questions. The past five days have raised vulnerabilities that speak to a disorienting moment in a transition to a volatile and potentially dangerous new technological era.”\n\n“Explaining how he’d fix the air traffic control network on Monday, Trump delivered a metaphor for a political method specifically designed to create instability rather than calm. [Trump said,] ‘We essentially want to blow it up,’” Collinson wrote. “If that’s his plan, the transition to the world of AI… will be rocky. This is a moment when anxious citizens need transparency, honesty and consistency from their government. So far that’s lacking, which is another kind of system failure.”"}, {"type": "text", "content": "On his Substack, Erick-Woods Erickson said “I’d sleep better if it were the hackers.”\n\n“If you know anything about the FAA, you should never presume hacking. Always presume incompetence and old equipment. This is an agency that still runs on floppy disks,” Erickson wrote. “The rest of it, I am convinced, is connected. Over the past couple of weeks, [several companies] announced they would be rolling out updates to keep AI agents from working inside their systems on behalf of consumers.”\n\n“AI is finding holes in their systems faster than anyone expected, and they know that if their AI can find those holes, someone else’s AI can find them too,” Erickson said. “A cyberattack would at least mean someone, somewhere, was competent. What we actually have is critical infrastructure held together by old code and people scrambling to patch it before the real attacks come, and making a mess of it in the process. That is much harder to sleep through.”"}, {"type": "text", "content": "In The American Spectator, Itxu Díaz argued “we need to know more.”\n\n“One thing is becoming clear: we have entered an era of great uncertainty,” Díaz wrote. “I don’t believe, despite everything I’ve read on social media, that an out-of-control AI is causing all the world’s ills… I do believe AI is opening unexpected doors for the most dangerous hackers, who are not the ‘lone wolves’ but those working within the intelligence services of the world’s most dangerous nations, or those lurking in the back rooms of the most bloodthirsty terrorist groups.”\n\n“We need answers, both from the major corporations affected and from governments. It is obvious that something has gone wrong in recent days, but it is not enough for the authorities simply to say that this is not a terrorist attack,” Díaz said. “I refuse to believe that no one is responsible for this string of disasters. It is one thing to reject conspiracy theories, but quite another to force us all to embrace Goofy-style thinking.”"}, {"type": "text", "content": "In RedState, Ward Clark wrote about technology’s “fraying spots.”\n\n“Our modern, high-tech society is utterly dependent, now, on a vast, interconnected, technical system, run by software, increasingly managed by artificial intelligence (AI) and dependent on our vast and aging power grid and telecommunications network,” Clark said. “It’s inevitable that we will see glitches in the system from time to time, and some of those, as Secretary Rubio assures us, are not the work of malign actors or hackers.\n\n“Small disruptions can have large impact. The FAA’s technical problems caused a ground stop that had air travel around the nation tangled up for days. Outages at Apple and Microsoft could have easily caused big problems for business and personal accounts alike,” Clark wrote. “Related or not, what these incidents have revealed is that a small stone tossed into our collective online pool can cast some really outsized ripples. That’s something that’s worth bending a few brain cells to, and to prepare for.”"}, {"type": "image", "src": "https://storage.ghost.io/c/4a/93/4a939b47-6a19-4b38-a13c-89d5a0f0d6dd/content/images/2025/05/Isaac.jpg", "alt": "The tech outages."}, {"type": "text", "content": "Back in April, Anthropic announced a new AI model called “Mythos” and said it was too dangerous to be released to the public.\n\nThe company’s general message was: We built a product that’s so good at finding security vulnerabilities that we can’t release it publicly right now. Instead, we’ll launch a project (named Glasswing) to give American businesses a head start to shore up their security vulnerabilities before the public gets access to these tools. Anthropic said it expected other models to catch up in the coming months, at which point we’d see a slew of new tech vulnerabilities and cyber intrusions pop up across the world.\n\nI saw this story through a simple lens : Anthropic was like a company selling a security system while telling you it had just identified all these fresh ways a burglar could break into your home. It was fear-mongering. Before, I’d been skeptical of these companies’ claims about their products; now, I was outright scornful. It felt like a marketing ploy from a bunch of people who were getting very good at talking about how powerful and advanced their product was."}, {"type": "text", "content": "I also wrote this:\n\nWell, it’s now been a few months. I pride myself on being an open-minded person willing to admit when I’m wrong and change my mind when presented with new evidence. Today, I have to admit: The threat is beginning to look very, very real. So it’s time for me to eat some crow and update my assessment.\n\nBased on our knowledge right now, the wave of outages, tech issues, and general all-encompassing tech fragility across various sectors is not the result of rogue AI bots. It isn’t cybercriminals, and it’s not Iran or China, either. It appears to be exactly what Anthropic said would happen. A bunch of large corporations, institutions, and tech companies are using rapidly developing AI tools to identify their own security issues. Then they are trying to update, patch, and fix those issues. And in many cases, they are breaking things along the way."}, {"type": "text", "content": "That’s really it. That’s the story: AI-assisted corporations and institutions are in a race against AI-assisted threats, and everyone is moving so fast that our already fragile systems are beginning to crack.\n\nIt isn’t your imagination that this is happening more frequently, either. Yes, part of it is that we are just noticing these failures — and this tech fragility — more. But we are also actually experiencing a higher frequency of outages. Rohit Krishnan, a Wharton fellow and author of Building God: Demystifying AI for Decision Makers , put together a helpful chart mapping rates of tech outages from the last 10 years. It shows we are not at all-time highs, but we are in a period of much higher system failures than normal. According to Krishnan, we haven’t seen this volume of disruptions across sectors since 2013 ."}, {"type": "text", "content": "All of this has me seriously reconsidering my rather blasé attitude about the rapid development of AI. Among other things, in recent writings, I’ve said that on a scale of 1 to 10, with 1 being the very early stages of AI capabilities and 10 being AI as a fully realized technology, I think we are closer to a 7 than a 3. In other words, these models weren’t going to get much better than they are now.\n\nThat thesis is looking less likely every day. The models and products are continuing to improve rapidly, and we are not getting many signals that they are slowing down. Mythos was just one marker on the highway, but Anthropic's warnings about what models like it would do appear to be accurate.\n\nI’ve also been skeptical about how dangerous it would be to allow these products to hit the open market. But a collection of events has changed my opinion there, too: I’ve had several conversations with friends, readers, and experts in the space who convinced me I should be more worried than I am. I listened to Bill Gates’s recent interview with Ezra Klein, which genuinely scared me, not least because Gates himself seemed so thoroughly afraid. The Google Threat Intelligence Group then warned this week that the “era of autonomous attacks has arrived,” and we are now up against a “hacker that doesn’t eat, sleep, or get tired, and never stops searching for a way in.” And through all of this, I’ve been watching news story after news story about all the ways major industries seem unprepared for this moment."}, {"type": "text", "content": "Think about it this way: The FAA called a national ground stop, the NSA had an internal communication system crash, and online banking service issues popped up all in just the last week. Each was (purportedly) caused by attempts to update or patch vulnerable systems. Which has me thinking: If the people trying to be helpful can so easily break the things they are working to improve, what does that say about the odds that actual AI-assisted cyber criminals (or, God forbid, rogue AI agents) will have much trouble bringing all these institutions to their knees?\n\nGiven all this, I feel much less confident about our potential to prevent a banking collapse, rogue AI from escaping containment, or government systems from being compromised. All of a sudden, a multi-week grid collapse or the potential for the U.S. military to be kneecapped in a “cyber incident” doesn’t seem so far-fetched. It’s honestly starting to feel a little Pollyannaish to think it won’t happen."}, {"type": "text", "content": "There’s no “but” here. I’m frustrated and a little uneasy to say that I don’t have an optimistic landing. I take solace in people like John Hultquist, the chief analyst at Google Threat Intelligence Group, who said this week, “Things are going to go offline periodically as the world manages a generation of tech debt. It will be a nuisance, but it will be okay.” I hope it’s as simple as that, but I can’t say I share his optimism anymore.\n\nThe people leading the AI revolution seem hellbent on pushing forward no matter the cost, despite their constant warnings that they might wipe out all of humanity. The government leaders responsible for regulating away the dangers of these kinds of technologies are busy obsessing over what we call them, or are totally in cahoots with the AI leaders themselves, or are so technically illiterate that any attempt to be helpful is nearly useless. And the rest of us common folk are just along for the ride."}, {"type": "text", "content": "So here’s to hoping the techies, nerds, and their billionaire bosses know what they’re doing. Because it’s starting to feel like the game is afoot. And I can’t say I’m keen to find out who wins."}, {"type": "image", "src": "https://storage.ghost.io/c/4a/93/4a939b47-6a19-4b38-a13c-89d5a0f0d6dd/content/images/2025/05/Will-Square.jpg", "alt": "The tech outages."}, {"type": "text", "content": "Take the survey: Do you think outages will grow more disruptive to daily life? Let us know .\n\nDisagree? That ’ s okay. Our opinion is just one of many. Write in and let us know why, and we ’ ll consider publishing your feedback.\n\nDemocrats’ votes for House and Senate leadership, President Trump’s trip to Asia, the U.S. losing its measles elimination status, and a report that Iran is developing plans to target Trump administration officials in Washington, D.C. all merit the full “Tangle treatment.” But our editorial team agreed that each of those stories would benefit from more time to digest (similar to our decision to wait on covering Jensen Huang and Nvidia until this week). The contest between Sens. Chuck Schumer (D-NY) and Chris Van Hollen (D-MD) to be the next Senate majority leader is still playing out, Trump’s trip abroad is still underway, reactions to the measles news are still developing, and details on the Iranian plot are still speculative. We’re keeping tabs on all four stories for next week."}, {"type": "text", "content": "Life gets busy, but eating well doesn’t have to be complicated.\n\nButcherBox makes it easy to keep high-quality meat stocked in your freezer, so a great meal is always within reach.\n\nGet FREE steak and bacon for life + $20 off your first order with code TANGLE .\n\nThe Red Rising series is a hit with millions of readers worldwide — including some football players on the Cleveland Browns. The books have taken the team’s locker room by storm, with linebacker Carson Schwesinger and safety Ronnie Hickman serving as their biggest cheerleaders. The team invited the author, the aptly named Pierce Brown, to attend last Sunday’s game, and he met with Schwesinger, Hickman, and other fans of the series on the team. The next day, they hosted a Q&A and book signing for 200 fans in the Cleveland area. “What I found is how surprised I was that the bonds of common family that are emphasized in the series are represented by this organization,” Brown said. News 5 Cleveland has the story ."}], "text_post": false}, {"id": "742214e3e57a4a2e", "title": "The Problem With the “Everything Is Breaking” Theory", "url": "https://www.readtangle.com/the-problem-with-the-everything-is-breaking-theory/", "source": "Tangle", "tag": "news", "published_at": "2026-11-19T16:41:24+00:00", "panels": [{"type": "image", "src": "https://i.ytimg.com/vi/WE5W7gWozQs/hqdefault.jpg", "alt": "The Problem With the “Everything Is Breaking” Theory"}, {"type": "text", "content": "Our biggest sale of the year is here. Save 40% on a Tangle membership this Black Friday: https://www.readtangle.com/black-friday-2026-40-off?utm_campaign=black_fri_26&utm_source=youtube&utm_medium=youtube&utm_content=40%25%20discount&utm_id=blackfri26"}], "text_post": false}, {"id": "82dccdff1c4b48dc", "title": "Pete Warden on local AI, open models, voice interfaces, the future of hardware", "url": "https://thedataexchange.media/pete-warden-moonshine/", "source": "Hacker News", "tag": "engineering", "published_at": "2026-11-19T15:38:12+00:00", "panels": [{"type": "text_post", "content": "264 points, 235 comments"}], "text_post": true}, {"id": "c5a788d7efb7df80", "title": "Show HN: Watch weight-space programming in action with WebGPU", "url": "https://tabbyml.github.io/weight-space-playground/", "source": "Hacker News", "tag": "engineering", "published_at": "2026-11-19T15:32:47+00:00", "panels": [{"type": "text_post", "content": "I wanted to build a full weight-space programming loop entirely in the browser with WebGPU: let an LLM inspect Qwen3.5-0.8B, edit its weights, evaluate, and repeat.<p>the full loop needed too much VRAM. so I turned it into an interactive walkthrough of a concrete example: editing 0.016% of a model&#x27;s weights to reduce reasoning loops, no gradient descent.<p>Based on exp8 of “Sparks of Weight-Space Programming.”: <a href=\"https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50341174\">https:&#x2F;&#x2F;news.ycombinator.com&#x2F;item?id=50341174</a>"}], "text_post": true}, {"id": "f815695fb56495de", "title": "What Question Have You Been Working On Lately?", "url": "https://dailynous.com/2026/11/19/what-question-have-you-been-working-on-lately/", "source": "Daily Nous", "tag": "philosophy", "published_at": "2026-11-19T12:17:50+00:00", "panels": [{"type": "text", "content": "People say that philosophers have been working on the same questions for thousands of years. True, we are persistent—thanks for noticing! But it’s also the case that philosophers are often working on new questions, ones that did not exist thousands or hundreds of years ago, or even decades ago. We’re inventive, too!\n\nToday is World Philosophy Day . To mark the occasion, I thought it would be a good idea to let people know what philosophers are asking about today .\n\nFor that, I’ll need your help.\n\nPhilosophers, please take a moment to write down, in a comment on this post, one question you are currently working on. (Yes, just one . )"}, {"type": "image", "src": "https://dailynous.com/wp-content/uploads/2026/11/exclamation-to-question-2-1024x589.png", "alt": ""}, {"type": "text", "content": "It would also help if you shared the post and encouraged other philosophers to comment with a question they’re working on. The result could be a picture of what philosophers are thinking about today, parts of which perhaps catch the attention of people who otherwise might have not realized they are interested in what philosophers are up to.\n\nThank you!\n\n(Some readers may recall that I’ve posted this query several years ago. Unfortunately, the previous comments appear to have been lost, either in the recent hack or the resultant upgrade. I only recently noticed this, and am looking into whether they’re recoverable.)\n\nRelated: The Intellectual Achievement of Creating Questions\n\nThe post What Question Have You Been Working On Lately? appeared first on Daily Nous ."}], "text_post": false}, {"id": "6ac1cf5207144ace", "title": "Wunderkammer", "url": "https://aeon.co/videos/how-curiosity-cabinets-paved-the-way-for-modern-museums", "source": "Aeon", "tag": "philosophy", "published_at": "2026-11-19T11:01:00+00:00", "panels": [{"type": "snippet", "content": "Nautilus shells, automata and unicorn horns – the eclectic collections that embodied early modern Europe’s expanding world - by Aeon Video Watch on Aeon", "read_more_url": "https://aeon.co/videos/how-curiosity-cabinets-paved-the-way-for-modern-museums", "read_more_source": "Aeon"}], "text_post": false}, {"id": "ddf591d7912f7840", "title": "At least it remembers", "url": "https://aeon.co/essays/what-would-parenting-by-ai-look-like", "source": "Aeon", "tag": "philosophy", "published_at": "2026-11-19T11:00:00+00:00", "panels": [{"type": "snippet", "content": "Parents fear what AI will do to children. But for some, it’s the only steady presence they have – and that’s the real worry - by Tom Wooldridge Read on Aeon", "read_more_url": "https://aeon.co/essays/what-would-parenting-by-ai-look-like", "read_more_source": "Aeon"}], "text_post": false}, {"id": "dc323673081e5e46", "title": "Reverse constituent ontology", "url": "https://alexanderpruss.blogspot.com/2026/11/reverse-constituent-ontology.html", "source": "Alexander Pruss's Blog", "tag": "philosophy", "published_at": "2026-11-18T21:16:23+00:00", "panels": [{"type": "snippet", "content": "On constituent ontologies, properties are parts of the objects that\nhave them. It’s occurred to me that it’s worth exploring—surely someone has done\nthis—reverse constituent ontologies on which objects are parts of the\nproperties that they have. Because formally the two are very similar, many problems for one\ntheory are problems for the other. But there are a few advantages of\nreverse constituent ontologies. For instance, take the problem of properties of parts: on constituent\nontology, that my eye is blue, so blueness is a part of my eye, and my\neye is a part of me, so by transitivity bluenes", "read_more_url": "https://alexanderpruss.blogspot.com/2026/11/reverse-constituent-ontology.html", "read_more_source": "Alexander Pruss's Blog"}], "text_post": false}, {"id": "447847bca62b87d5", "title": "The Case Against Three Arguments for God's Existence | Michael Tooley", "url": "https://www.youtube.com/watch?v=6ESLxlsk9qE", "source": "Closer to Truth", "tag": "philosophy", "published_at": "2026-11-18T19:30:19+00:00", "panels": [{"type": "snippet", "content": "*Does the universe need a first cause, or could causes extend backward forever?*\n\nMichael Tooley challenges several traditional arguments for God's existence, questioning whether an infinite regress is logically impossible and whether biological complexity requires a designer. He also examines a limitation he sees in fine-tuning arguments: changing one physical constant at a time may yield different conclusions from varying many constants together.\n\n0:00 Three Problems with Cosmological Arguments\n1:04 The Possibility of Infinite Causal Regress\n2:26 First Causes and Necessary Existence\n4:20 Evo", "read_more_url": "https://www.youtube.com/watch?v=6ESLxlsk9qE", "read_more_source": "Closer to Truth"}], "text_post": false}, {"id": "a7a6ceb18f13f998", "title": "A Lot of People Want Anthropic Stock", "url": "https://www.bloomberg.com/opinion/newsletters/2026-11-18/a-lot-of-people-want-anthropic-stock", "source": "Money Stuff", "tag": "financial", "published_at": "2026-11-18T19:05:41+00:00", "panels": [{"type": "snippet", "content": "Also nickname mention markets, fake takeovers and an SEC Nvidia investigation.", "read_more_url": "https://www.bloomberg.com/opinion/newsletters/2026-11-18/a-lot-of-people-want-anthropic-stock", "read_more_source": "Money Stuff"}], "text_post": false}, {"id": "95b921bdf72eb9fd", "title": "How Much AI-Generated Text Is In Today’s Philosophy Journals? (guest post)", "url": "https://dailynous.com/2026/11/18/how-much-ai-generated-text-is-in-todays-philosophy-journals/", "source": "Daily Nous", "tag": "philosophy", "published_at": "2026-11-18T19:02:08+00:00", "panels": [{"type": "text", "content": "“It seems that philosophers have started to make substantial use of AI in their papers, and it’s not uncommon for AI-generated text to make it into philosophy published in decent journals.”\n\nNot uncommon. How much are we talking here?\n\nThat’s the question Maximillian Noichl (Utrecht) recently took up.\n\nHis answer? An estimated “12% of published philosophy in 2026 [involves] some AI assistance,” though he notes that the figure will vary depending on the AI detection software used and how the false-positive threshold is set.\n\nSo AI writing in philosophy articles is not yet normal. But, he notes, it is increasing.\n\nIn the following guest post, Noichl explains how he investigated the issue.\n\n(A version of this post first appeared at Noichl’s site .)"}, {"type": "image", "src": "https://dailynous.com/wp-content/uploads/2026/11/circuit-shirt-black-white-gold-1024x651.jpg", "alt": ""}, {"type": "text", "content": "When reading philosophy in the last few months, I’ve often had the nagging feeling that what I’m reading had a distinct AI smell. I thus wanted to investigate the prevalence of AI usage in philosophy in a data-driven way. This post outlines the results of that investigation. Long story short, it seems that philosophers have started to make substantial use of AI in their papers, and it’s not uncommon for AI-generated text to make it into philosophy published in decent journals. It also appears that preprint servers in philosophy are increasingly clogged up by AI-generated content.\n\nHere’s what the results look like, at a glance:"}, {"type": "image", "src": "https://dailynous.com/wp-content/uploads/2026/11/noichl-1-ai_share_published_philosophy-scaled.png", "alt": ""}, {"type": "text", "content": "AI detection is funny in that, around three years ago, it was extremely bad and unreliable. Many people thought it might even be impossible to detect AI-generated content at all. This changed sometime over the last year, as more reliable AI detectors like Pangram ( Emi & Spero, 2024 ) came on the market. Now the best AI detection systems appear to be pretty reliable ( Jabarian & Imas, 2025 ) at least under decent conditions (enough text, English language, etc.). This means that for some time now, many people have been heavily underestimating how detectable AI writing is in practice. This doesn’t mean that it’s a fully solved problem. For one, it remains tricky to distinguish between AI-based editing, translation, and full generation, especially for very short texts, and there is the danger that new large language models might, at least temporarily, get ahead of the detectors. But right now AI detection with reasonable confidence is possible."}, {"type": "text", "content": "For this project, I will be using an open-source AI detector called MELD, published by Li et al. (2026) . MELD is based on a transformer model, Ettin-1B, from the ModernBERT family.\n\nTransformer models (very) roughly work such that text is split into small subword units called tokens. These tokens get individual numerical representations called embeddings, and as text is pushed through the model, in a process called attention , the embeddings of individual tokens change based on the tokens around them, encoding contextual semantics, grammar and so on. In LLMs these embeddings are usually randomly initialized at the beginning of the training process and then iteratively updated, so that the embeddings that drop out at the end of the model become more useful for specific tasks, for example, predicting the next token for text generation in GPTs or predicting a token from its surroundings (in BERT-style models). For an interactive walkthrough of these steps, I like to recommend the Transformer Explainer ."}, {"type": "text", "content": "In the case of MELD, a model pre-trained on general text tasks is trained further. To make it work for the task of AI detection, a small additional neural network, which projects the large token embeddings coming out of it to a much lower, 48-dimensional space, is added on top of it, as well as two small sets of anchor vectors, one which contains vectors meant for different AI-model families and one for humans. The model is then trained further, now on a mixture of texts for which we know whether they are AI-generated or human. As the model is trained, each token in each incoming text is compared to all anchors, and its similarity to the most AI and the most human-like prototype is scored. These scores are used for a general prediction on the text, and depending on how it gets its predictions right, the prototypes used in each training step, as well as the whole network leading up to them, get updated ( Li et al., 2026 ). MELD can, in principle, try to distinguish between different types of AI usage (raw generation, polishing, etc.), but for our current investigation we are looking for any content that appears to have come out of, or gone through, an AI model in any form ."}, {"type": "text", "content": "In my experience so far, MELD performs pretty well. I suspect it is not quite as good as Pangram, especially with regard to the most recent state-of-the-art models. It has the big advantage, though, that it is open source, so we can check how it works under the hood, what it was and wasn’t trained on, and how it performs on our specific datasets. It also means that we can run it ourselves if we acquire a strong enough GPU, which costs a little bit of money, but is far less expensive than running a large number of philosophy papers through Pangram, which would charge around 5 dollars per paper. This also means that potentially copyrighted material can stay on machines that we control. I couldn’t get access to the canonical weights of MELD, so I have been using this mirror ."}, {"type": "text", "content": "MELD uses a threshold approach. When using the frozen weights after training is done, each token gets its own AI score, and we can decide ourselves at what threshold we want to assume that the text is actually AI-generated. The MELD authors recommend setting the threshold on material that we know is not AI-generated, which we do for each individual dataset in this project based on the papers from 2021 and 2022, as ChatGPT in its earliest version was introduced in November 2022. For the presented results, we set the threshold so that we accept a 1% false positive rate in those pre-AI years, which is the more strict of the thresholds suggested by the authors of MELD for the results reported in their paper. On their own evaluation dataset, at a 1% false positive rate, they detect 99.7% of AI texts successfully."}, {"type": "text", "content": "I should note that this is significantly less strict than Pangram’s reported overall false positive rate of one in 10,000 ( Emi, 2025 ). As I am not trying to judge individual authors’ work for potentially life-changing decisions, but to get a general sense of how things are going in philosophy, I am just as worried about the model missing more subtle cues of AI writing (false negatives), as I am about false positive judgements.\n\nFor the data, we are considering four publicly available sources of philosophical articles, namely the journals Philosophers’ Imprint and Ergo , which are, to my mind, well-respected venues that have the big advantage of being fully and freely available on the internet. I have gently scraped these two publications, as well as all the preprints on the PhilSci-Archive . I also downloaded all preprints available from PhilPapers’ PhilArchive via the CORE collection . After restricting to papers from 2021 onwards with at least 1,500 words of text (and, for PhilPapers, to English-language articles of at most 30,000 words), this leaves full texts of 197 papers from Philosophers’ Imprint , 374 from Ergo , 4723 from the PhilSci-Archive and 29954 from PhilPapers. For the final year 2026, CORE had about a third of the records available, compared to around 78% available for the earlier years, so we have a still somewhat incomplete dataset to work with right now. I noticed that many preprints were backdated (posted in 2025/26 but claimed to be from 21/22) and therefore could not reliably be considered AI free. I thus removed them from the dataset, and used only articles actually uploaded in those early years for calibration of the threshold."}, {"type": "text", "content": "For the PhilSci-Archive and PhilArchive, I linked the records to OpenAlex, which allows us to check the publication status of each paper. For this, I consider all papers that appear in a journal with an ISSN listed on the PhilPapers journal list as published in philosophy. While these papers ended up being published in some form, we should keep in mind that their deposited version is not always fully identical to the final published one. Because different genre compositions and text sources will be treated differently by MELD, I calculated separate thresholds for (1) the two open access journals, (2,3) published and only preprinted works in the PhilSci-Archive, and (4,5) published and preprinted work from PhilPapers."}, {"type": "text", "content": "All of these papers were converted from their various HTML/PDF formats into a uniform text format using BeautifulSoup (for the journals’ HTML pages) and PyMuPDF (for the PhilSci-Archive PDFs). For PhilPapers, I use the text that CORE had already extracted. The papers were then parsed with MELD using GPUs rented on Google Colab. MELD read the texts in windows of 2,046 tokens (around 1,500 words) at a time and scored every token; these token scores were then summarised in passages of 256 tokens (around 190 words). Following the procedure in the MELD paper, the MELD scores were then calculated by taking the similarity to the human prototypes as opposed to the AI prototypes, and by taking the average of the top 25% of token scores as the AI score for the whole passage."}, {"type": "text", "content": "I usually post all code and data for the analyses I do, and I believe it’s crucially important to do so for published work. In this case, however, I will not be sharing the data and code (not even privately), at least in the immediate future. AI use is a highly sensitive topic, and accusing authors of it could have implications for their careers. The idea of doing so wrongly is mortifying to me, and I don’t trust the current workflow enough to be sure that this would not happen.\n\nI’m further not convinced that all the AI usage I find with this method is equally problematic. I think there is, for example, a big difference between AI use for translation as opposed to spamming journals with one-shot prompted slop. For these reasons, I will only be reporting aggregate values in this post and won’t be quoting from any of the AI-generated texts. I know that this is somewhat unsatisfying and makes the whole project less convincing, but for now, it seems to me to be the most responsible way of going about this."}, {"type": "text", "content": "So, what do we find? First, we can look at the AI use detected in the two specific journals we have gathered: Philosophers’ Imprint and Ergo . In the graphic below, each paper’s passages are stacked from bottom to top, from the lowest detected AI use (very unlikely to be AI-generated, shown in gray) to the highest detected AI use (very likely to be AI-generated, shown in red). Each narrow column therefore represents the distribution within one paper. This shows how prevalent AI use is overall, as well as its distribution in the papers in which it occurs. Within each year, columns are arranged by the amount of AI use above the threshold, which we set based on the years 2021 and 2022."}, {"type": "image", "src": "https://dailynous.com/wp-content/uploads/2026/11/ai_share_by_paper_part1-scaled.png", "alt": ""}, {"type": "text", "content": "[ Note: An earlier version of this post stated that 10.6 percent of material in Philosophers’ Imprint in 2026 was flagged as AI by MELD. Apparently, this result was partly driven by the unhappy inclusion of a correction notice that was marked as an article in the metadata and flagged as AI. The actual number is 2.7 percentage points lower, and the figure has been updated. ]\n\nAs we can see, the values before 2023 are around 1%, which corresponds to the expected false positive rate we set. After 2023, we see a slow increase in AI use in Ergo , which continues into 2026: some passages get flagged, but there are few papers with marked AI use. In Philosophers’ Imprint , usage stays low until 2025 and then seems to rise considerably in 2026. In both journals, we now see papers that contain at least sizable chunks of material that likely passed through a large language model in some way. I haven’t been able to find an AI policy for Philosophers’ Imprint , but Ergo considers AI-generated content to be usually inappropriate, and in any case, such use has to be disclosed ( Ergo , 2026 )."}, {"type": "text", "content": "At this point, I feel like I should reiterate that I included these two journals because they are fully open access. They are the only way I could study the full run of individual philosophy journals without worrying about the issues around bulk-downloading licensed material. There is no indication that these journals are particularly full of AI material: To the contrary, as we will see, they appear to be around, or even below average.\n\nTurning to the PhilSci-Archive, which in the study period yielded 4723 papers in total, I’ve split these into papers that have been published in philosophy journals, according to the PhilPapers journal list and OpenAlex, and papers that have remained preprints or were published in other venues that are either not considered philosophy by PhilPapers or are book reviews, contributions to collected volumes, and so on. Here we seem to find much higher shares of AI content in 2026, with 18% of material published in philosophy journals showing evidence of AI generation and a number of the papers scoring uniformly quite high. An even higher share, 27% of the textual material uploaded to the PhilSci-Archive as preprints, is considered as AI-generated by MELD. It also appears that most papers that make use of AI are by no means fully AI-generated, but have more or less extended passages in them that get flagged. But there are a few largely AI-generated papers that appear to have made it into publication."}, {"type": "image", "src": "https://dailynous.com/wp-content/uploads/2026/11/Noichl-3-ai_share_by_paper_part2-scaled.png", "alt": ""}, {"type": "text", "content": "We find a somewhat similar preprint/published split for papers that have come online via PhilPapers’ PhilArchive. Around 11% of published material seemed to be AI-generated in 2026, and a stunning 62% of the material that was uploaded to PhilPapers in 2026 and has not yet gone on to be published in philosophy journals appears to be AI-generated. Manually checking these results, it appears that much of this material is actually barely related to philosophy. This is in contrast to the PhilSci-Archive, which doesn’t have a pronounced rise from 2025 to 2026. One explanation may be that the new moderation policies the PhilSci-Archive put into place in June 2026 are working."}, {"type": "image", "src": "https://dailynous.com/wp-content/uploads/2026/11/Noichl-4-ai_share_by_paper_part3-scaled.png", "alt": ""}, {"type": "text", "content": "If we combine (and deduplicate) all samples that got published in philosophy journals from PhilPapers, the PhilSci-Archive, Ergo and Philosophers’ Imprint , and score them according to their own thresholds, we arrive at the figure at the top of this post , an estimate of 12% of published philosophy in 2026 involving some AI assistance.\n\nI have checked a few dozen of the highest-scoring passages from all of these datasets, both manually and using Pangram. Many of them do hold up, and I will say that I have been surprised, and a little shocked, to find extended passages of writing in decent journals, where my intuitive reading, the MELD scoring, and the Pangram spot checks have all agreed on AI use. So one conclusion of this project is that AI use in philosophy is here . I think it is prevalent, even in well-respected journals."}, {"type": "text", "content": "I should also note that, as should be expected from their different accepted false-positive rates, MELD seems to be much more aggressive than Pangram in flagging text as AI. What I’ve often seen during manual checking is that MELD flags long stretches as AI-involved writing, whereas Pangram flags only smaller chunks within those texts. But, when something does get flagged highly by MELD, Pangram usually is also at least suspicious, giving non-zero AI-use scores or indications of AI-assistance.\n\nIf we want to be more careful in our estimates (which might also mean letting a big chunk of AI content slide), we can make our threshold more severe. Lowering the accepted false positive rate in 2021/2022, e.g. to one in a thousand, we would get 6% of material flagged in papers published in journals in 2026, and 37% in preprints. The plot below shows how results change with the threshold. That being said, I lean towards accepting that MELD is currently giving less reliable, and likely higher, estimates than Pangram would. A more thorough study than this one might very well be worth the effort, and show a different picture."}, {"type": "image", "src": "https://dailynous.com/wp-content/uploads/2026/11/Noichl-5-sensitivity_to_false_positive_rate.png", "alt": ""}, {"type": "text", "content": "I have also seen a number of clear failure modes of this approach. The first is that some papers fully marked as AI-generated are, after reading into them, likely to be papers where people used AI translation. These papers have a distinct “AI smell” in their phrasing but seem well thought out and were published by people that I assume might not be native speakers of English. While I personally would caution against doing this as an author, I don’t think this is a particularly problematic use of AI (especially in view of recent work on linguistic inequality in philosophy, see Marsili & Rehren (2026) , Peters et al. (2025) ), even if I would prefer to see that disclosed.\n\nAnother failure mode I have observed is when authors are writing about AI and put long, correctly marked quotations from ChatGPT or Claude into their papers. It’s nice to see that MELD catches these instances, but of course these results should be considered spurious as well."}, {"type": "text", "content": "Finally, I have observed a small number of cases where material on Asian philosophy that made use of many Chinese characters in the text was flagged as AI-generated. One notable case of this was flagged only by MELD and not by Pangram, which makes me think this might be a problem area where MELD may need some additional improvement.\n\nSo, to summarize our findings: Most philosophy published in 2026 probably was not generated with AI. But AI-generated material appears to be increasingly prevalent in philosophical writing. Most papers that get flagged for AI usage seem to take the form of localized editing, where people intersperse AI-generated or AI-assisted passages with their own writing. Fully AI-generated, “slop” papers, do occur but are still relatively rare, although they drive a lot of the total AI volume. And finally, it appears that the preprint archives in philosophy, which I think are very good for the discipline, have an increasingly big AI problem, as they are getting swamped with large numbers of likely AI-generated papers. Some forms of automated AI checking might become necessary here in the near future."}, {"type": "text", "content": "It seems that AI-assisted writing has fully arrived in philosophy and is unlikely to go away any time soon. I think it is important that we have an honest and open discussion about the ways in which it is, and is not, acceptable.\n\nI’m grateful to Hein Duijf, Dominik Klein and Erik Stei for discussing these results with me.\n\nAI usage statement: This blog post was largely dictated via MacWhisper. The dictation was cleaned up using Fable 5.1, and edited by me. Fable 5.2 assisted me in editing the citations, fact-checking, setting up an automated process to put in the numbers, as well as layout and typo checking. I have applied MELD to the text of the post itself, and it hasn’t flagged anything, at any of the thresholds used. The code for the underlying analysis was generated using Fable 5.2, under my close supervision."}, {"type": "text", "content": "Readers may be interested in previous posts featuring Max Noichl’s philosophy-related data analysis and visualizations .\n\nThe post How Much AI-Generated Text Is In Today’s Philosophy Journals? (guest post) appeared first on Daily Nous ."}], "text_post": false}, {"id": "f7a6bc6fbc7098c4", "title": "Roundup #91: Rocketing into the technofuture", "url": "https://www.noahpinion.blog/p/roundup-91-rocketing-into-the-technofuture", "source": "Noahpinion", "tag": "financial", "published_at": "2026-11-18T09:50:29+00:00", "panels": [{"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!gLlb!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ffc7da4d0-68da-4941-b8e2-2ac79e09ddf6_1171x659.jpeg", "alt": ""}, {"type": "text", "content": "Howdy, folks! Welcome to the future where science fiction becomes reality every day. Where AI-powered cyberattacks paralyze air travel one day and banks the next. Where shadowy billionaires make fortunes illicitly selling America’s enemies the technology to create artificial gods, while you slave away for $150 a day hoping to get half a day off. Where it seems like a new rare disease is cured every week , even as measles returns to America thanks to an anti-science cult that somehow made it to the highest rungs of power. Where self-driving cars whizz past people hunched over dying of fentanyl in the street. I mean, look at this:\n\nOr this:\n\nOr this!\n\nIn such confusing times, it’s all your friendly neighborhood economics blogger can do to keep up with it all. But I’m trying my best, so that I can help you understand these crazy times just a little bit better."}, {"type": "text", "content": "First, podcasts. Here’s the latest episode of Hexapodia, in which Brad DeLong and I discuss morality and technology with Ryan Avent:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!PgPl!,w_56,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ffde2453e-9c18-4560-82ca-8b77ae62ef5b_1280x1280.png", "alt": ""}, {"type": "text", "content": "And here’s a conversation between me and the streamer Destiny, in which we talk about how liberalism can resist rightism and leftism at the same time:\n\nAnyway, on to this week’s roundup.\n\nFor years, we watched America’s young people — and young people throughout the world — become less and less happy. They told surveys they were unhappy. They attempted (and committed) suicide more. They were more socially isolated. They formed relationships less.\n\nThe most plausible candidate for a cause for all of this was smartphone-enabled social media , which replaced in-person small-group interaction with impersonal arm’s-length interactions with huge numbers of potentially hostile strangers — something the human animal never evolved for."}, {"type": "text", "content": "But human beings are resilient and adaptable, and I always expected young people to find new ways to be happy in a hyper-connected world. Now, there are some signs that things are starting to turn around:\n\nA word of caution: This is just one data source, the Youth Behavioral Risk Survey. Other sources, like the CDC, continue to show high teen suicide rates . It’s far too early to conclude that general teen happiness is on the upswing. But the YBRS data is a very positive sign.\n\nIf the trend is indeed turning around, what’s the cause? One possibility is that even as the online world became more all-consuming and alienating, the offline world was becoming kinder and gentler. Here’s Rothwell again :"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!zcgg!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F02ac5169-4c4a-4ce5-a4e8-d51369b5acee_742x490.jpeg", "alt": ""}, {"type": "text", "content": "Another possibility is that teens are moving away from the toxic public platforms — X and Facebook — and moving toward either private discussions or passive video apps like TikTok:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!JHjs!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa2227c3f-b626-44ab-bf37-ed83b36a5608_840x890.jpeg", "alt": ""}, {"type": "text", "content": "Other surveys show that teens are trying to cut back on social media use in general, realizing that it’s bad for them.\n\nThis is why I’m a long-term techno-optimist. The downsides of technology can sometimes dominate in the short run, but eventually people figure out how to handle it and turn tech to their advantage.\n\nAs the Anthropic IPO approaches, various analysts are trying to figure out if the incredible rate of AI progress is going to slow down, speed up, or continue at a steady rate. A number of data sources show that progress has sped up recently, around either late last year or early this year:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!EB91!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fdf9ea1a9-df87-454c-a520-b7062f77cc4d_1164x624.jpeg", "alt": ""}, {"type": "text", "content": "One popular theory is that the speedup was due to the advent of AI coding tools. But economists Luis Garicano and Alex Imas argue that what actually accelerated was spending on AI research. They show data showing a smooth deceleration in the amount of AI capability that each dollar of research spending buys:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!9RJk!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fda62a233-8d7f-4b20-ba40-0b0e97ac7098_1155x662.jpeg", "alt": ""}, {"type": "text", "content": "On the other hand, should we really think of a linear increase in the ECI as a linear increase in capability? Some people argue that each point of increase in the ECI multiplies AI capabilities by a constant factor — like points on the Richter Scale.\n\nWhether that’s true in any meaningful sense is hard to assess. But at the end of the day, what really matters is AI’s ability to generate economic returns. And some people argue that it’s here that we see the true acceleration, as AI hits critical thresholds for economic usefulness:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!OYKY!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fdc5684bc-0d6c-4bdb-8a6a-a612cc7f8c08_728x513.jpeg", "alt": ""}, {"type": "text", "content": "But it’s also possible that this increase in usefulness doesn’t cleanly map to increases in raw capabilities, and that human beings are simply finding new uses for AI capabilities that already exist.\n\nSo the jury is still out on whether AI progress is slowing down.\n\nOne of the great accomplishments of economic policy in the last few decades was the conquest of the post-pandemic inflation . The Fed raised rates, and the economy didn’t tank, and inflation went down anyway. But that victory might prove ephemeral; inflation is creeping back up. Though there’s some volatility, most recent months have come in at around 5%:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!vlM_!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F45c866a3-0141-4f77-86c5-9899bee38f57_864x864.png", "alt": ""}, {"type": "text", "content": "The rise in oil prices due to the Iran War is an obvious contributor, but in fact the new inflation is remarkably broad-based:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!YU8y!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F20cab4b8-6ccd-4403-8df6-8b21daa5c88c_960x720.jpeg", "alt": ""}, {"type": "text", "content": "It’s just not possible to play the old game of “Well, inflation is just X and Y and Z, so it’s not really a problem.” There are various possible causes of this broad-based price acceleration — budget deficits, Trump pressuring the Fed to be dovish, cost pressures from the data center buildout, and so on. Teasing these out deserves a longer post.\n\nAnd just as basic economics would expect, a burst of unexpected inflation is causing real wages to go down:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!kj68!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F2119c691-2287-49bc-8fcc-e50a987bf00e_1152x648.png", "alt": ""}, {"type": "text", "content": "In other words, Americans are getting poorer this year, because the cost of living is going up and their paychecks aren’t keeping up. It’s not as bad as it was in 2021, but it’s going to be enough to make a lot of Americans very angry at the people in power.\n\nA lot of people mentally divide housing into two types: “luxury” or “market-rate” housing, and “affordable” housing — as if the price of a house or an apartment is built into its walls and floors. The assumption is that if developers aren’t forced to build “affordable” housing, normal people won’t be able to afford housing.\n\nThat assumption is totally wrong — building market-rate housing drives rents down and makes housing more affordable. But because lots of people believe in the “luxury”/“affordable” distinction, they embrace policies that try to force developers to offer some units at below-market rates. These policies are called inclusionary zoning . Basically, inclusionary zoning says that some percent of the apartments in a new building have to be rented out for very cheap. The policy is attractive because it doesn’t have any direct fiscal costs — the cost of subsidizing cheap apartments comes out of the pocket of a corporation, rather than the taxpayer."}, {"type": "text", "content": "But this kind of policy ends up backfiring. Forcing developers to take a loss on some of their housing units simply makes it less financially possible to build new housing. And when they do build new housing, they end up raising rents for all the non-“affordable” units in order to try to recoup some of their losses. Here’s what Kouchekinia (2026) finds:\n\nIn California, more than a third of localities have adopted [inclusionary zoning ordinances]. Mandatory inclusionary zoning acts as a tax on construction and, all else equal, reduces the overall supply of housing. This potentially reduces affordability in the aggregate…I find the typical inclusionary zoning ordinance reduces annual new residential construction by nearly a third (31.8%) . Additionally, I find the policies relocate multi-family developments within jurisdictions to lower rent areas, where the policy is effectively less severe…I estimate the cost of generating an affordable unit with inclusionary zoning to be approximately $800,000 in “excess rents” paid by market rate renters as a result of the policy’s constraint on supply."}, {"type": "text", "content": "As Kouchekinia points out, making housing more scarce acts as a shadow tax on everyone in the area. Inclusionary zoning looks costless, but it’s actually extremely costly.\n\nCalifornia cities and other places that use inclusionary zoning are starting to realize that the policy doesn’t do what it’s supposed to do. Some have actually started cutting inclusionary zoning mandates:\n\nMatt Yglesias also has a good recent post about inclusionary zoning in D.C., and why the District should scrap it.\n\nBasically, it’s time for this policy to go. There’s really no salvaging it, it’s making our cities worse for no good reason, and we need to stop viewing it as just another inevitable cost of doing business.\n\nFor years, I’ve been arguing that AI is going to cause a scientific revolution. My hypothesis is that there are a bunch of “laws of nature” — i.e., exploitable stable causal relationships — that are too complex and diffuse for the human mind to comprehend, but which AI can learn and exploit on our behalf. I call these “cloud laws”, because I envision them as diffuse clouds of weak but densely interrelated causal effects — the kind of thing that human minds will never be able to either grasp in their entirety or bite off into little separable chunks."}, {"type": "text", "content": "Well, here’s a little bit of evidence that cloud laws exist…in the clouds. Yohan Iddawela writes about Google DeepMind’s new weather forecasting AI model:\n\nA single GPU can now calculate hundreds of global weather scenarios in under 60 seconds. The exact same task requires a supercomputer and hours of brute-force physics. Google DeepMind recently released WeatherNext 2. The model beats the previous state-of-the-art system on 99.9% of weather variables across a 15-day forecast window. It achieves this massive jump in accuracy using a new modelling approach called a Functional Generative Network. Meteorologists categorise weather data into two buckets: 1. Marginals are isolated data points, like the precise temperature at a specific location or the wind speed at a certain altitude. 2. Joints are the massive, interconnected systems that form when all those individual elements interact. The researchers hid the joint systems from the model during training. They only taught it the isolated marginals. When they turned it on, the model skillfully predicted the massive, complex systems anyway…The model gives forecasters a full 24-hour advantage in tropical cyclone tracking compared to the previous leading system. It maps extreme wind speeds and heatwaves with unprecedented precision. We’re watching a pretty big shift in predictive capabilities. The machine is deducing the structural reality of planetary weather from isolated fragments of data."}, {"type": "text", "content": "Normal weather forecasting is reductionist. We take the basic physical laws of motion, model the atmosphere as a bunch of little chunks of air that sort of behave like independent units, and apply the laws of motion to those units. What Google is doing is something else; it’s letting an AI model look at a bunch of weather data and then predict how the whole system is going to behave.\n\nThe AI approach ends up working better than the typical reductionist brute-force approach. Why? My guess is that weather has cloud laws — principles that no human could ever intuit from staring at masses of weather data, and which could never be explained in any graduate textbook, but which AI can just grasp holistically. 1"}, {"type": "text", "content": "What other phenomena might we be able to predict and control with AI this way? Patrick Collison has a fun list:\n\nWe know these effects have some sort of regular causes, but reductionist science has so far been unable to characterize any of them very effectively. But perhaps AI will, because they might be governed by cloud laws.\n\nIf so, we’re in for the most rapid and dramatic scientific revolution in our entire history.\n\nPlummeting fertility is a problem, and nobody knows how to fix it . There are a few people who deny this obvious and disheartening truth. One of those is Lyman Stone, whose own research has cast doubt on the efficacy of paying people to have kids, but who stubbornly insists that such pronatal policies can act as a “crowbar” with which to pry open the door of child-rearing."}, {"type": "text", "content": "Well, they probably can’t do that. Here are Hartley and Jaros, evaluating a Michigan “baby bonus” program that paid people to have kids:\n\nThis paper studies the fertility effects of the Rx Kids program, the first baby bonus introduced in the United States. Beginning in 2024, the program was launched in Flint, Michigan and subsequently expanded to additional municipalities across Michigan, creating staggered variation in treatment timing across places….[W]e estimate the effect of Rx Kids on birth outcomes. We find that live birth growth rates increase in treated municipalities…We find that Flint’s $7,500 baby bonus generates a small but statistically significant fertility response: actual 2024 births exceeded a three-year pre-treatment baseline by roughly 7.5%, implying $107,000 in program spending per induced birth. These results provide the first U.S. evidence that direct cash transfers tied to childbirth can measurably affect fertility behavior."}, {"type": "text", "content": "The issue isn’t that these programs don’t work. They do. The problem is that their effects aren’t very large . The United States’ current total fertility rate (TFR) is about 1.6 children per woman; replacement level is between 2.0 and 2.1. That would require at least a 25% increase in fertility rates. The program Hartman and Jaros study resulted in only a 7.5% increase, and was forced to spend $107,000 per child on that paltry increase. That’s not nearly enough, but you can bet that if it were scaled up to the national level, you’d hear a lot of anger directed at the “welfare queens” who benefited from the policy.\n\nAnd if it’s not nearly enough for the U.S., it’s utterly, laughably inadequate for a country like South Korea, which has a TFR of 0.8. To increase that to replacement level would require a 150% increase — 20 times the size of the increase generated by Michigan’s extremely generous program."}, {"type": "text", "content": "In other words, we’re not going to buy our way out of the baby bust by paying people to have kids. I still think paying people to have kids is a good idea, but the main thrust of effective pronatal policy will have to be something else.\n\nWhen I was a kid, everyone knew that Democrats were the party that wanted to raise your taxes to spend more on the poor, while Republicans wanted to cut your taxes and spend less. Those days are long gone. America now has two parties who are both dedicated to cutting taxes on the vast majority of Americans — including most wealthy and high-earning Americans — and raising spending at the same time.\n\nThis is a big problem for the country, because there will be no getting out of our debt problem until this political equilibrium changes. When I was a kid in 1992, all the presidential candidates were stumbling over themselves to tell America how they were going to fix the deficit, so I know a different equilibrium is possible. We just have to figure out how to get there."}, {"type": "text", "content": "But Democrats’ fiscal profligacy is also a political problem for them. Higher deficits and debt contribute to faster inflation; we’ve already had both Biden and Trump be punished for failing to tame inflation, and Democrats are deluding themselves if they think it can’t happen to them again.\n\nEric Levitz writes about how the incoming Democrats’ economic policy program is incoherent:\n\nTo seize this historic opening, Democrats will need to formulate a platform that effectively advances their core goals. Unfortunately, this will be harder than it sounds — because the party’s current economic priorities appear incompatible with each other…During the midterm campaign, Democrats promised to:\n\nBring down inflation and interest rates ."}, {"type": "text", "content": "Dramatically expand the welfare state .\n\nRaise taxes on the very wealthy — but no one else — while cutting taxes for millions of Americans…\n\nDemocrats’ goals…aren’t necessarily coherent.[I]t probably won’t be possible to create large new social programs, avoid tax hikes on anyone but the rich, and drive down inflation and interest rates…\n\nThe party’s congressional leaders have signaled support for a social welfare agenda at least as ambitious as President Joe Biden’s unpassed Build Back Better Act, which contained $4.73 trillion of new spending …Add up the estimated fiscal costs of all these programs and the bill comes out to nearly $5 trillion…Critically, America is already on track to run an average annual deficit of $2.4 trillion over the coming decade…[A] greater than $2 trillion deficit will put upward pressure on interest rates and prices."}, {"type": "text", "content": "Democrats do want to raise some taxes, but only on the ultra-mega-super-duper-giga-rich. I’ve written that this approach of “just tax the billionaires” is insufficient to fund all the other economic policies that Democrats want. Levitz concurs.\n\nIn time, fear of the deficit will grow to a level that enables the kind of fiscal hawk equilibrium that obtained in 1992. Until then, Democrats need a more modest economic agenda. The American people can be satisfied with an anti-corruption drive, tariff repeal, and policies to spread the wealth generated by AI. They don’t need infinite government largesse in order to be satisfied. Democrats need to stop chasing the Bernie Sanders dream, at least for a while."}, {"type": "text", "content": "Subscribe now\n\nShare\n\nAlso note that the model Google used here wasn’t an LLM. This suggests that AI is more general than the specific techniques the frontier labs are currently focusing on."}], "text_post": false}, {"id": "fc51aefa54b405bf", "title": "The Agents Will Trade the Bonds", "url": "https://www.bloomberg.com/opinion/newsletters/2026-11-17/the-agents-will-trade-the-bonds", "source": "Money Stuff", "tag": "financial", "published_at": "2026-11-17T19:29:49+00:00", "panels": [{"type": "snippet", "content": "Also sandwich spoofers, SBF and Anthropic, Martha Stewart and Pokemon trading.", "read_more_url": "https://www.bloomberg.com/opinion/newsletters/2026-11-17/the-agents-will-trade-the-bonds", "read_more_source": "Money Stuff"}], "text_post": false}, {"id": "ff35ffb912afc122", "title": "Bumbition", "url": "https://www.noahpinion.blog/p/bumbition", "source": "Noahpinion", "tag": "financial", "published_at": "2026-11-16T09:52:30+00:00", "panels": [{"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!J4NB!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F2a9253da-dc61-4fdc-bbf0-ac94bce4a414_1050x700.jpeg", "alt": ""}, {"type": "text", "content": "“Hey, I’ll get a job…when I hear the true call.” — Slacker (1990)\n\nAbout 10 years ago, I met a woman who worked as a mid-level software engineer at Facebook. She didn’t work on machine learning, but just for fun, she read a bunch of papers and got into the subject as a hobby. Later, in the pandemic, she quit her boring corporate job and spent a few years unemployed, contemplating the meaning of life. She made her own clothes, learned ballet, made cute Instagram videos, dyed her hair, and went to a bunch of hackathons (almost all of which she won).\n\nAlso in the late 2010s, I knew a man who had been a promising software engineer and data scientist, and before that a top performer on the International Math Olympiad. But when I met him, he was spending a few years unemployed — crashing at his girlfriend’s place, playing Hearthstone (and becoming one of the top-ranked players in the world), learning to skateboard, going on hippie retreats, and contemplating the meaning of life."}, {"type": "text", "content": "Both of those people are billionaires now. They are Sasha Sheng and Diogo Almeida, two of the three founders of TypeSafe AI , a startup that was recently valued at $7.5 billion (and in which I invested a small amount of money). TypeSafe invented Jev, an all-new kind of AI model that bypasses human language, and so is able to make decisions much faster and more cheaply than Claude or GPT. It was an incredibly creative idea — one that the big labs are racing to copy — and it took an incredible amount of hard work to realize. 1\n\nSasha’s and Diogo’s roundabout, seemingly improbable route to stunning success is actually more common in the tech world than you might think. Steve Jobs is  the most famous example — he famously dropped out of college, not to start Apple, but to do psychedelic drugs, crash on friends’ floors, immerse himself in hippie spirituality, live on a commune, and travel around India looking for enlightenment before eventually inventing the personal computer and becoming the most beloved tech icon in American history. Jack Dorsey, Larry Ellison, and Mitch Kapor all had their own periods of aimlessness."}, {"type": "text", "content": "Nor is this sort of life path confined to the tech world. History is full of examples of people who looked lackadaisical until they suddenly rose to greatness:\n\nUlysses S. Grant drank copiously, worked as a clerk in a leather store, engaged in various failed business ventures and was said to lack ambition — until one day he rejoined the military and became the most successful and important military commander in the entire Civil War, as well as President of the United States.\n\nCharles Darwin neglected his medical studies and turned in a mediocre performance on his exams at Cambridge, routinely going hunting and riding instead of studying, before becoming a naturalist, signing up for an ocean voyage, and inventing the theory of evolution."}, {"type": "text", "content": "James Cameron was a college dropout and a truck driver, before seeing Star Wars prompted him to quit his job and teach himself how to make movies, ultimately becoming one of the most commercially successful movie directors of all time. ( Kevin Smith had a similar path to success, except his inspiration was the movie Slacker .)\n\nHaruki Murakami ran a jazz bar and had little ambition, before suddenly deciding to become a novelist, and eventually becoming one of the most celebrated writers in the world.\n\nI like to tell these stories because they demonstrate an approach to success in life that I believe is overlooked and deserves more recognition. I call it “bumbition”.\n\n“Bumbition” is an obvious portmanteau of “bum” and “ambition”. In general, we think of ambitious people and slackers as polar opposites — ambitious people work hard, set goals for themselves, and are constantly motivated, while slackers drift aimlessly, laze around, or fail to apply their talents. A lot of our culture is oriented around pushing young people to be ambitious instead of turning into bums."}, {"type": "text", "content": "Bumbition, however, defies placement on the ambitious/bum spectrum. It exhibits elements of both. For a significant portion of their life, a bumbitious person doesn’t strive hard, or apply themselves to definite goals…until a clear and compelling opportunity presents itself. When that opportunity to do something really interesting or impactful does come up, the bumbitious person is quick to recognize it, and works very hard to exploit it.\n\nThe key here is that bumbition is not simply intermittent ambition . It’s a fundamentally different approach to life — it has different goals and motivations, and when it succeeds, it succeeds for different reasons.\n\nAn ambitious person is always working toward a set of goals — either those they define for themselves, or those defined by the people around them. Those goals could include:"}, {"type": "text", "content": "“Make partner by age 30”\n\n“Start a unicorn startup”\n\n“Get a tenured job at a top 10 research university”\n\n“Make a hundred million dollars”\n\n“Conquer Central Asia”\n\n…And so on. The purpose of achieving those goals — the motivation that drives ambitious people — is to feel a sense of personal success.\n\nA bumbitious person does not automatically have a goal at all times, 2 because they tend to be motivated less by the need to feel successful than by the desire to do something intrinsically interesting or worthwhile . Such projects are inherently in short supply, in part because what constitutes an inherently “interesting” or “worthwhile” project is highly subjective. An ambitious person can always identify some brass ring that would make them feel like a success; a bumbitious person will often wait years or even decades before finding that one magical opportunity or life calling."}, {"type": "text", "content": "In fact, this is bumbition’s inherent limitation. Sitting around waiting for the right opportunity to present itself is a highly uncertain, risky endeavor. There’s always the possibility that it won’t come until you’re old, or that it’ll come but you’ll fail to see it in time.\n\nThe other problem with bumbition is that waiting around for the right opportunity comes with a bunch of costs and risks. Your technical skills and work ethic can decay over time. You can get caught up in life’s various stumbling blocks — bad relationships, drug addictions, depression, etc.\n\nBut bumbition also has some big advantages over the ambitious life. One is that ambition can keep people overly busy . If you’re the kind of person that always has to be working toward a goal, and you can’t find a truly great project to work on, you’ll end up working on a modest or mediocre one. If Steve Jobs had become distracted by getting a perfect GPA at Reed College, he might never have had time to start Apple. If Ulysses S. Grant had focused on owning his own leather goods store, he might not have leapt at the chance to join the U.S. Army. If Sasha Sheng had focused on climbing the corporate ladder at Meta, she wouldn’t have founded TypeSafe."}, {"type": "text", "content": "Paul Graham talks about this in his essay “ How to Do Great Work ”:\n\nAmbition comes in two forms, one that precedes interest in the subject and one that grows out of it. Most people who do great work have a mix, and the more you have of the former, the harder it will be to decide what to do…The trouble with planning is that it only works for achievements you can describe in advance. You can win a gold medal or get rich by deciding to as a child and then tenaciously pursuing that goal, but you can't discover natural selection that way.\n\nIn his book Zero to One , Peter Thiel — who I’d classify as an ambitious rather than a bumbitious person — recounts a vivid example of how his ambition almost prevented him from becoming a tech titan:"}, {"type": "text", "content": "[A]fter a conventionally successful undergraduate career, I enrolled at Stanford Law School, where I competed even harder for the standard badges of success. The highest prize in a law student’s world is…a Supreme Court clerkship…I was invited to interview for clerkships with Justices Kennedy and Scalia. My meetings with the Justices went well. I was so close to winning this last competition. If only I got the clerkship, I thought, I would be set for life. But I didn’t.\n\nAt the time, I was devastated…With the benefit of hindsight…winning that ultimate competition would have changed my life for the worse…Had I actually clerked on the Supreme Court, I probably would have spent my entire career taking depositions or drafting other people’s business deals instead of creating anything new."}, {"type": "text", "content": "Nor is this bumbition’s only advantage. The “bum” phase — the time spent traveling in India, or working at a convenience store, or playing Hearthstone on a couch — isn’t just a holding pattern. The seeming aimlessness of this period of life can serve several important functions that facilitate rapid success once a good opportunity gets spotted.\n\nFirst, and most importantly, time away from the grind of constant striving allows people to broaden their perspective . A lot of unique and original ideas come from recombinant innovation — from combining insights and perspectives from vastly different fields. 3 Even something as simple as changing the context of your surroundings can improve creativity . For an intelligent person with a restless mind, the “bum” phase of life leads to a lot of play and exploration that can end up sparking novel ideas. Here’s a fun example from Richard Feynman:"}, {"type": "text", "content": "I used to enjoy doing physics. Why did I enjoy it? I used to play with it. I used to do whatever I felt like doing - it didn't have to do with whether it was important for the development of nuclear physics, but whether it was interesting and amusing for me to play with…Now that I am burned out…I'm going to play with physics, whenever I want to…\n\nWithin a week I was in the cafeteria and some guy, fooling around, throws a plate in the air. As the plate went up in the air I saw it wobble…I had nothing to do, so I start to figure out the motion of the rotating plate…I went on to work out equations of wobbles. Then I thought about how electron orbits start to move in relativity. Then there's the Dirac Equation in electrodynamics. And then quantum electrodynamics."}, {"type": "text", "content": "Steve Jobs’ study of calligraphy, during his hippie period, famously helped him to think about what would make the letters on a personal computer look beautiful to the eye.\n\nA related advantage is that the “bum” phase also allows people to develop their interests . Paul Graham talks about how “excited curiosity” will often lead people to their most important life’s work. Bumbitious people aren’t just waiting
