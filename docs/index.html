eir contribution? What makes the quantum measure principled but an analogous cosmological measure illegitimate?"}, {"type": "text", "content": "Daniel Bagley A recent article in Aeon states, “If panpsychism doesn’t resonate with you, it’s worth asking if there truly is a reason for everything – if the world is ultimately intelligible after all.” Do you think a belief in consciousness as an emergent thing invites the view that there is no reason for the universe to exist? I take it that “reason” is a function of consciousness, and panpsychists believe that the reason the universe exists is that consciousness exists, but I’m not sure if it’s correct to think that a person who doesn’t believe consciousness is fundamental would also believe there is no reason for a universe that produced conscious beings to exist.\n\nMindscape Do you have a description or definition of how or what you define as consciousness? I'm enjoying reading the many ways consciousness is currently described by others in various fields. I'd enjoy hearing your thinking on the subject. Do you align with a particular definition?"}, {"type": "text", "content": "Jonathan Good Could 2 branches on the path from a low-entropy past contain different conscious experiences but still become 1 branch in the future if the differences were never recorded in a way that became entangled with current observers' degrees of freedom in a way that produces lasting decoherent differences?\n\nDan Butler PRIORITY QUESTION: Can you talk a bit about Lorenz invariance in emergent spacetime? Is it a challenge to come up with quantum theories where Lorenz invariance emerges rather than is just assumed? Is it a helpful constraint on theories of emergent spacetime, or not really?\n\nMoshe Feder In the late 90s, Randall and Sundrum proposed two variations of a five-dimensional anti-de Sitter space model to solve the hierarchy problem of gravity’s weakness relative to the other forces. What did you think of their proposals at the time and has any further work been done on them since?"}, {"type": "text", "content": "Nate D I’m a bit confused about the relevance of the various “interpretations” of quantum mechanics for experimental physics. Are the formalisms underneath all of the interpretations so consistent as to make one’s theoretical preference as an experimentalist—let’s say, for Many Worlds over Pilot Wave—irrelevant? Or would “believing” in Many Worlds over Pilot Wave potentially generate different experimental arrangements? Basically, this is just a question about the relationship between theory and practice in contemporary quantum mechanics.\n\nSonja What are your thoughts on the recent elections in Serbia and the key role played by university students and members of the academic community?\n\nBenjamin Zand In general relativity spacetime has a definite curvature at every point, described by the Riemann tensor. If we measured a traveler’s speed relative to this curved geometry, with each point having its own curvature, wouldn’t that give us an absolute standard of motion? Or do the components of the curvature tensor change with the observer’s velocity in a way that keeps the principle of relativity intact? If the latter, where/how does observers velocity enter into the equations?"}, {"type": "text", "content": "Jake PRIORITY QUESTION: In a previous AMA, you argued that the morality of painlessly killing hypothetical kittens depends on the reason, and that killing them purely for enjoyment would be morally wrong. Would you also consider it morally wrong to kill an animal for a tastier meal when a nutritionally equivalent plant-based alternative is available, since in both cases the reason for killing is enjoyment? I understand why taking pleasure in killing might be morally objectionable, but does the seemingly innocent pleasure of eating justify the killing itself?\n\n- People at AI labs appear to be freaking out that AI research looks like Go or theorem proving. AIs suck at most things, but in the narrow domains where AIs can get fast and objectively true signal on their performance (they won/lost the Go game, their hacking exploit worked/failed, their LEAN proof was valid/invalid), AIs can run an ungodly number of trials and teach themselves to outclass humans through brute force. The bottlenecks of AI research seem to have fast and objectively true signal (“prediction loss went up/down”), and the labs are now spending billions per quarter trying to train AIs to do AI research. Should we be freaked out?"}, {"type": "text", "content": "Dennis Briggs I tell my students the linear systems don’t know when enough is enough. Is Many Worlds the ultimate example of that aphorism, or am I missing something?\n\nGeorge Hampton Given the state of our democracy, I've been thinking about Gödel's Loophole and am wondering if this is the 'inner inconsistency' he was thinking about. Do you have any thoughts on this?\n\n0:00:00.3 Sean Carroll: Hello everyone, and welcome to the November 2026 Ask Me Anything edition of the Mindscape Podcast. I'm your host, Sean Carroll. As you're listening to this, we have had an election in the United States, November 2026, a midterm election. The questions in this month's AMA don't involve that election, mostly because they came in before the election happened, but I'm recording it after the election happened. For those of you 500 years from now who don't know what we're talking about, the Democratic Party, which was not in power, gained a huge amount of power. In particular, they won majorities in both the Senate and the House of Representatives in Congress. Still don't have the presidency, of course; there was not a presidential election. Still don't have the Supreme Court. Supreme Court is supposed to be completely apolitical, but that is hilariously untrue. The Supreme Court is very political and very much on the conservative side these days. But they did, the Democrats, gain both houses of Congress."}, {"type": "text", "content": "0:00:57.0 SC: We're not gonna go into details about the election results, except to mention a structural feature that is kind of amusing. This election had a couple of very explicit examples of what is known as a dummymander. Again, for those of you who aren't following US politics or don't know how things work, there's this idea called a gerrymander, which is when you have certain conditions in place, namely number one, you have winner-take-all voting system. First-past-the-post, it's sometimes called. So in any one geographic district, or any one district in general, whoever just gets the most votes wins. Secondly, you have geographic districts, so you have boundaries drawn in literal two-dimensional maps that determine what district is being represented by somebody. And then third, you have the ability to draw these maps put in the hands of perhaps partisan governments. So if you're already in the majority, if you're in control of some state, you can under certain circumstances draw the maps however you want to decide what counts as a certain congressional district."}, {"type": "text", "content": "0:02:10.3 SC: All of these features, majority vote, geographic districts, putting the drawing of the districts in the hands of a perhaps partisan majority, are bad. They're not good features of a working government, but some of these things get in there, and once they're in there, they're very hard to get rid of. So we have all these in many places in the United States, and that opens the door to what is called gerrymandering. We actually talked about gerrymandering here on the podcast from a mathematical point of view with Jordan Ellenberg quite a while ago. How well can you do it? How can you avoid doing it? How can you look at a map and know whether or not it's been gerrymandered or not?\n\n0:02:48.0 SC: So the idea of gerrymandering is the following. Imagine you have some number of districts, 10 districts in a state, and imagine that 50% of the voters typically are one party and 50% are the other. You'd expect that on average, of those 10 districts, five of them would end up being represented by one party and the other five by the other party. But what you can do is you can use the kind of detailed demographic information that people now have to carefully draw the districts so that the party that is not in power gets put in a small number of districts where almost all their voters are. So you could have, you know, two districts with a huge number of Party A, and then eight districts with a small majority for Party B. So that even though in population terms it's 50-50 Party A, Party B, in majority in the district terms, Party B is now way ahead. Okay, that's a gerrymander, because these districts that end up doing that end up looking very complicated. And Elbridge Gerry was the politician who became notable for doing it, and one of the districts that he drew, or I forget whether he was the one who drew them or was voted into it, but it sort of looked like a salamander in the eyes of a political cartoonist."}, {"type": "text", "content": "0:04:07.3 SC: Anyway, the dummymander is people aren't actually stuck forever voting for one party or the other. They can change their minds. And in a midterm election, which is very often pushing against the party in power, people just don't like the party in power. That's a very standard feature of democracies. So it can be the case that even though overall, usually on average it's 50-50, maybe in this election, there's a strong majority of people voting for Party A over Party B. And what you've done is arrange it so that your party has a majority usually in most districts, but that majority is small. So if there's sort of a wave election that pushes many people to the other party, suddenly you can actually have fewer seats than you think you deserved, because in the districts that you tried to make 60-40, they're actually majority the other way. This is called the dummymander."}, {"type": "text", "content": "0:05:14.2 SC: And there's evidence that precisely this happened in various cases in this year's election, which, of course, is bringing some guilty pleasure to the party that benefits from this, some sadness to the party that loses. But it's certainly an advertisement for trying to do better when organizing your political system so that things like this should just never happen in the first place. And that's where I come out here.\n\n0:05:39.8 SC: Anyway, we're not talking about that during the AMA, but I thought it was something to bring up because we're still very much in the period of time where we're dealing with the implications of these new election results, pro and con, people reacting in different ways. It's kind of amusing from a spectator's point of view. Thanks as always to the folks who support these Ask Me Anything episodes. Those are the folks who pledge on Patreon. That could be you. You could go to patreon.com/seanmcarroll. And these days we've switched over Patreon's way of paying things, so you pay by the month, not by the episode, but it's essentially the same thing. And if you think you get a dollar or two of pleasure or reward from a typical Mindscape episode, we would love it if you pledged that much support. And as a benefit, you get ad-free versions of the podcast. Unless you like the ads—you're still allowed to listen to the ads, I suppose. And you also get the right to ask these Ask Me Anything questions."}, {"type": "text", "content": "0:06:43.7 SC: So all the questions you're about to hear come from Patreon supporters who we greatly appreciate for their support. And with that, let's go. Peter says, \"If you could have a superpower, what would it be? Flight, super strength, super speed, teleportation, telekinesis, et cetera.\" Classic question. Mostly a classic question when you're 15 years old. But that's okay. We all have the inner 15-year-old who really cares about these things. My standard answer would be teleportation. Teleportation. But this is an old person's answer. Okay? It's just a pain to have to travel in these awkward ways. Just last week, as I'm recording this, I zipped down very quickly to Santa Fe to visit the Santa Fe Institute, where we were having a small workshop on timelessness. At SFI, I have been serving on a small committee that's been organizing a series of events about time and the arrow of time and things like that. And this was sort of the last event in that series that's been going on for years."}, {"type": "text", "content": "0:07:52.1 SC: And so I felt I had to go. I had an obligation to go. Of course, it's fun to go. I don't really have time to go, but it was on timelessness, which is a certain delicious irony. So I went. And the point of it is, I was trying very hard to get there in a hurry to sort of miss the fewest classes that I'm supposed to be teaching while also making it for as much of the meeting as I could. And I came very, very close to missing a connection while I was flying out there. In fact, I came very close to missing connections both ways, flying out there and flying back, because I was flying directly to Santa Fe. Sorry, the word directly is wrong there. I was flying to Santa Fe rather than to Albuquerque, which is where I usually go. Usually you go to Albuquerque, rent a car, drive an hour to Santa Fe. That's perfectly convenient. And there's a lot more flights to Albuquerque than there are to the tiny little Santa Fe airport. But I wanted to get there in a hurry, so I flew to Santa Fe, which means there's no direct flights from Baltimore. And what that meant was that I was sitting in O'Hare working on my talk, as one does, and they switched the gate on me. And I never noticed until very late."}, {"type": "text", "content": "0:09:04.1 SC: Anyway, I did notice in time. So I got to the correct gate, which is in a completely different, not terminal, but region of the terminal. And so that was a close call. And again, irony, because I was going to a workshop on timelessness and the existence of time was very important. And then likewise, when I came back, there was rain or snow or something. It couldn't have been snow. It must have been rain and fog in Denver, which delayed my flight into Denver, but not my flight out. So once again, I came very close to missing that. So anyway, the point is, with teleportation, presumably, I'd be able to avoid all that, right? I could just walk out the door and be in Santa Fe instantly later. Now, there's practicalities. If I was the only person in the world who could do teleportation, then are you sure when you teleport somewhere that you know exactly where you're teleporting to and that there's not a person standing there and you land inside their body and explode or something like that? I think you'd have to work out a lot of the practicalities there. So maybe teleportation is less good than it seems. But if everyone could teleport, I mean, the world would be a very bad, messy place, I think. That would be good in some ways, but bad in other ways. So maybe I should grow out of my thought that having teleportation ability would be the best."}, {"type": "text", "content": "0:10:24.3 SC: Again, since I'm an old person now, I don't know if it's a superpower, but health would be a wonderful... My health is fine right now, but it doesn't last forever. And if you had these healing factors like Wolverine has, and you could just get better... I don't know, does that work for a stomach flu and things like that? I don't know. It works when you're stabbed, but I don't know what the general theory of the healing factor would be. But to bounce back from small indignities in your body would be very, very useful right now. I think, honestly, thinking about telepathy and things like that, seeing into other people's minds, I don't want anyone to see into my mind and I don't want to see into anyone else's. I think that talking is a perfectly good way of doing things. Flying was... Maybe flying is the compromise. If you could fly very quickly, I think once again, there's practicalities. It gets cold up there and there's a lot of drones flying around in the atmosphere these days. So if you had flying without the ability to heal, you might bump into a drone and hurt yourself very badly. So this superpower thing, it's less good than the comic books make it out to be. There's all sorts of things, higher order questions you need to take into account."}, {"type": "text", "content": "0:11:41.6 SC: James McBeath said, \"In the September 2026 AMA, you said the eternal Schwarzschild solution...\" That's the solution to Einstein's equations in general relativity for a spherically symmetric empty space distribution. \"Anyway, the eternal Schwarzschild solution has all sorts of weird properties. It has not only a black hole, but has a white hole in the past out of which things can come but nothing can go in. But the Einstein-Rosen bridge and the white hole are not really thought to exist in the world. But we study them because there's a simple mathematical setup to look at first.\"\n\n0:12:12.8 SC: And then James continues, \"In other podcasts, you said that scientists should have the courage to accept what the math is telling them. How do you decide when to accept the math and when to assume the predictions don't really exist?\" It's an excellent question and it points to a little bit of sloppiness on my part in saying things like you should accept the math. The important thing is you should accept the math... You should never accept the math in the sense that you just believe it no matter what. What I think is that you should take seriously what the math about your theory is trying to tell you to the extent that you think your theory is right and you've set up the mathematical formulation of the problem correctly. So in the case of the eternal Schwarzschild black hole, the math isn't telling you that the eternal Schwarzschild black hole exists. The eternal Schwarzschild black hole is a mathematical solution to Einstein's equation in an otherwise entirely empty universe. But we don't live in an otherwise entirely empty universe."}, {"type": "text", "content": "0:13:18.2 SC: The black holes that we care about in our universe are created from stars, right? Stars collapsing or other things that are analogous to stars. So the point is that there are absolutely black hole solutions that are relevant in the real world, but they're solutions that don't start with a white hole. They start with a star or some collection of matter and then the black hole develops over time. So the eternal Schwarzschild black hole is a mathematical solution, but not one of any physical relevance. And it's not a matter of not having the courage to accept it. It's just not an expression of the physical situation we care about. That's in contrast to the very existence of black holes, which was kind of implicit in Schwarzschild's original solution in 1917. And no one believed it. No one really paid attention. No one even figured out what it was trying to say until the 1950s and people like David Finkelstein."}, {"type": "text", "content": "0:14:15.1 SC: And also things like the Big Bang. Oh, there's a singularity at the beginning of the universe. Things like the multiverse, if you believe in Many-Worlds interpretation of quantum mechanics. Now, all of these are cases where physically realistic initial setups imply that the equations are telling you something dramatic. So there you either need to have the courage to accept what the math is telling you or you change the math. You change the theory, you believe in a different kind of theory, and that's also fine. I'm not against changing the theory if the theory doesn't seem to be leading you where you want it to. What I'm against is having a theory that you accept, having a well-formulated idea of what initial conditions are and what solutions should be relevant, and then just not choosing... Choosing not to quite accept the implications of your theory given those conditions. That's not what's going on with the eternal Schwarzschild black hole and its wormhole."}, {"type": "text", "content": "0:15:13.8 SC: Friedrich says, \"As a European, I regularly have to watch with horror how the American election system creates really poor outcomes for everyone involved. But from a physics of democracy perspective, aren't you stuck somehow? The politicians who would change anything are the ones who are heavily dependent on its existence. And psychologically, most voters can probably not fathom any alternative without having lived abroad for some time. Do you see a path that would work to move to enable better outcomes without destabilizing society on a catastrophic level?\" I think this is a super good question. I think it's more just a democracy question and an institutional structure question than a physics of democracy question, but still an excellent question. If I can just rephrase it in much more general terms, we had a period here in the United States 250 years ago where we were thinking about how to structure the government. This is something actually in the book, The Physics of Democracy, that I'm supposed to be working on. I mention this as a contrast."}, {"type": "text", "content": "0:16:14.4 SC: Between physics notions of emergence and coarse graining versus political notions of emergence and coarse graining. So part of the book is saying that certain analogies or metaphors are useful. They shed light, they illuminate on what's going on in political situations. But also I try to say, okay, the following things don't work. I have a little screed in there why quantum mechanics is really not relevant to political or social situations at all. And the story of emergence and taking individuals in a large number and having them collectively work to get some goal or something like that is very similar in politics and physics. But there are important differences. And the most important difference is in physics, the correct way to coarse grain, that is to say, the particular ways in which you throw out some microscopic information to keep certain macroscopic variables, is fixed by the physical situation. It's fixed by the demand that you get a predictive theory that uses only the macroscopic variables that you've coarse grained away from the microscopic variables."}, {"type": "text", "content": "0:17:31.2 SC: In politics, you're not interested in a predictive theory. I mean, maybe you want a predictive theory of politics, that's fine. But when you're inventing a voting or representation system, the goal, the standard of success, is correctly representing the will of the people, whatever that means. And you have to decide what mechanism it is to do that. And the ability to predict the future is just not a standard for that, for the success of representing what the people want. So 250 years ago, people were debating this, and it was an interesting kind of discussion because democracy theory was still relatively primitive and young compared to where it is now. The United States in its current system of government is actually old compared to many other current systems of governments in other countries. And so they made some choices, and some choices they made were good. And some choices they made were bad."}, {"type": "text", "content": "0:18:29.4 SC: Overall, the people, though, were a fairly impressive group of people. And they were fairly thoughtful. And of course they disagreed with each other about important things, but they were trying their best to do a good job, I think. And now, as Friedrich points out, there are problems. So one issue is just this issue of winner-take-all, majority rule, right? It's a little bit different. So there's sort of two things. One is your voting system, which is to say, how do you pick the representative? But then there's also your representation system, which is what is the set of representatives that you're picking? I think to Americans, the idea that you have a geographically chosen district, like you draw a line on a map and inside is your district and outside is everything else, and one person represents that district, that's almost baked in. They don't even imagine there could be a difference from that system to something else."}, {"type": "text", "content": "0:19:32.0 SC: So they will examine ways of choosing those representatives with different voting systems. It doesn't need to be plurality votes or majority votes. It could be ranked choice voting or approval voting or there's other systems that are interesting there, but the idea that there should be a representative for a district is kind of seen as self-evident to a lot of Americans. It's not self-evident. You can do other things. You can do systems of proportional representation. If you have 60% of the people in one district members of one political party and 40% members of another one, you could have 10 representatives for that area. Maybe the area is 10 times as big as a typical US district. But okay, we can debate that. But you could have 10 people represent, and then you could have situations where rather than voting for individuals, the voters vote for a party. And if the party gets 60% of the votes in a 10-representative district, they get to pick six representatives, and the 40% party gets to pick four."}, {"type": "text", "content": "0:20:36.9 SC: Now, Americans don't like that. You tell them that, you even suggest it, and they kind of recoil, in part because they don't like political parties. And that's in part because political parties are kind of decorative in some sense in the United States. I mean, we have political parties, we split up into them, but the party apparatuses typically don't have the level of power and decision-making that they do in parliamentary systems.\n\n0:21:00.1 SC: So anyway, this is all to say there are alternative systems, like Friedrich mentions. Many European countries use various kinds of alternative systems. These alternative systems, by the way, have their own issues. Because when you have a system, for example, like proportional representation, then, okay, what if you don't have two parties? What if you have more than two parties? It's still very possible for people to be not represented effectively, and there's different sorts of dynamics going on that get in the way. But I think... Sorry, I'm just sort of talking around the problem. The actual question Friedrich is asking is effectively, could it get changed? Could you imagine, I don't know whether for some questions you'd have to amend the Constitution to the US, for other questions you could do it just through the ordinary legislative process, but could you implement a better system?"}, {"type": "text", "content": "0:21:56.3 SC: And actually, I kind of very much feel the worry that Friedrich is implying here, that I kind of don't want to upset the applecart too much because I don't have trust that the people who would do the redesign would be as smart and as civically minded as the people who did the designing 250 years ago. I do think there's no question in my mind that there are absolutely better systems than the United States has. And I don't know what the perfect system is, but in many ways, the one that we have here is obviously bad and could be improved. Do I have the faith or trust that the people in power now would effectively improve it? No, I do not. Do I have the trust that there is any mechanism that could choose people to be put in charge and, let's say, have a new Constitutional Convention that would completely from scratch rewrite the Constitution of the United States? Oh my God, no. That's a very, very frightening prospect to me. I just don't think that the people who would be chosen for that would be good people."}, {"type": "text", "content": "0:23:03.6 SC: It could be. It's possible to imagine good people really, really improving the governmental system of the United States. And by good, I don't mean on my side of the political divides. I just mean smart people who know about politics and who are motivated by what's best for the country, not what's best for their particular partisan side. I'm just not sure how we would ever make that happen. So I think that the fact that the United States Constitution allows for itself to be amended, but that amending it is difficult, I think that was a smart move on the part of the authors of the Constitution. You should be able to fix it, but it should be hard to fix it because it's too easy to break it. And even though it's clear that it could be improved, not changing it is better than making it dramatically, dramatically worse. So maybe I'm being too pessimistic there. I don't know what the real political scientists would think of that. I would love it if we had a slightly more sensible political system."}, {"type": "text", "content": "0:24:01.2 SC: Lucas Pollard says, \"Have you ever significantly changed your mind about a scientific or philosophical question without encountering new evidence, simply because you came to understand the existing arguments differently?\" Sure, yeah, all the time. I mean, I'm not even quite sure how to come up with an example for that, but I mean, I think it's absolutely true that as one thinks about things, one can change one's mind. In fact, I do think I'm not gonna be very good at giving you examples just because there are too many. I mean, maybe moral objectivity is an example for me. Like, I used to think years ago that you could be scientific about morality and derive principles of morality roughly based on the idea that we had evolved through natural selection to survive, and the things that would make us survive and flourish can be mapped onto moral principles."}, {"type": "text", "content": "0:24:55.0 SC: Now, just by thinking about it, and more data came in, but just by thinking about it, reading and listening to other people, I understand that that was wishful thinking. That, of course, we do evolve through natural selection, and from that we get preferences and intuitions and inclinations, but those are not morally objective facts, suppose I should say objective moral facts. They are the instincts that we get from natural selection. Those are different than what our moral principles should be. So now I'm not a moral realist anymore. But I think that more generally, there's an interesting question here about what it means to be a good Bayesian. We often mention being a good Bayesian here on Mindscape, and we cast it in terms of: you have credences over a set of propositions, and new information comes in, new data, and you update your credences based on the likelihood of getting that data."}, {"type": "text", "content": "0:25:51.4 SC: Of course, new ideas or new thoughts should count as new data. But do they count as new, how do we count them as new data? This is an excellent question that I don't know the answer to. I almost said the answer is not known, but probably someone knows the answer, or at least people have very well-thought-out opinions about these things. I am not up on the best writings or thinkings about these exact issues. In fact, now that I'm thinking about it, I have a better example. A classic example is, believe it or not, the electroweak theory. Steven Weinberg, in, I don't know, 1967, I think it was, wrote his famous paper, \"A Theory of Leptons,\" where he showed how you could unify electromagnetism and the weak nuclear force. And no one paid any attention. It was a very short paper, appeared in Physical Review Letters. Weinberg himself didn't pay... He never sort of cited his own paper in the papers that he wrote in the years after that. And we know why. Well, we know part of the reason why."}, {"type": "text", "content": "0:26:55.5 SC: One reason why is just it was a speculative idea. But another reason why is there was a theoretical argument that said it can't work, namely that the theory seemed to be non-renormalizable, which is another way of saying that if you did calculations, you would get infinities that you can't get rid of. So it didn't seem to be physically plausible or physically promising. And then it was approximately 1972 that Gerard 't Hooft, and in part in collaboration with Tini Veltman, showed that theories of that form, with a Higgs mechanism and spontaneous symmetry breaking and things like that, are renormalizable after all. And then suddenly it became hugely popular. So five years later, it went from no one paying attention to hugely popular. No new data had appeared. All that had appeared was an improved understanding of what the theory was really about. So things like that happen all the time in science, not to mention in philosophy. And so that's an example where it's not just me changing my mind, it's the community as a whole."}, {"type": "text", "content": "0:28:01.9 SC: Rue Phillips says, \"I love the recent episode with Greg Caruso. I know you're not a fan of free will discussions, but keep them coming. I'm curious how you would compare and contrast your compatibilist views with Greg's free will skeptic views, specifically on what changes to the US legal system should theoretically be pursued. I'm having a hard time understanding the differences between compatibilists and skeptics like Greg, and I'm hoping that when I should...\" Sorry, I read that without the correct pausing. \"I'm having a hard time understanding the differences between compatibilists and skeptics like Greg. And I'm hoping that when applied to a specific case, like how we might modify the justice system, might make it a little more clear.\""}, {"type": "text", "content": "0:28:39.6 SC: Yeah, unfortunately, or for the question, but not unfortunately for the world, I don't think there is much of a difference. I think what came out in that discussion, and by the way, no free will discussions coming up anytime soon. I did Christian List and that was enough for a year, but he was on one side and I thought it was fair to have someone from the other side. And Greg is a very well-spoken and well-known articulator of the other view. So we did both of those. That's enough for a while. We can cleanse our palates now and not have more free will discussions. But I think that what came out from talking to Greg was his motivation for declining the offer to use free will vocabulary to discuss human beings making choices, which he admits human beings make choices even though they're completely physical creatures. He just doesn't want to call it free will. Why not? Well, because to him, calling it free will implies this kind of moral desert. It implies a kind of way of thinking about human beings where if you make the wrong choices, you are bad and you deserve to be punished."}, {"type": "text", "content": "0:29:51.8 SC: To me, that just doesn't follow at all. That's a separate thing. Okay. I can absolutely imagine applying the vocabulary of human beings thinking things through and making choices, making the wrong choices, or bad or evil choices, whatever you want to call them, and dealing with them in ways that do not simply involve punishing them because they're bad. That just is a non sequitur. They're separate questions. One is the question of how we analyze and talk about human behavior. The other is how we organize the justice system and our ideas of what people deserve and things like that. So I don't see any real difference. As a compatibilist, I'm completely happy with a point of view that says we should try to, number one, rehabilitate people who have behaved badly. Number two, deter them from doing further bad things. And those should be the central focuses of the justice system, not punishing people because they are bad."}, {"type": "text", "content": "0:30:56.0 SC: Jeffrey Siegel says, \"I was wondering whether you think it is just as well that there does not seem to be the possibility of faster-than-light travel or communication. As I think von Neumann pointed out, since our species has evolved rather late in the development of the universe, if faster-than-light travel were possible, it's likely that a species that developed earlier might have already spread through the galaxy, including Earth, and blocked the evolution of humans. Similarly, with faster-than-light communication, a more advanced civilization might be able to hack our technology and doom humanity. Given those possible dangers, do you nevertheless hope that faster-than-light travel or communication may be possible, or do you breathe a sigh of relief that it is not?\""}, {"type": "text", "content": "0:31:35.4 SC: So I think I wouldn't exactly characterize von Neumann's point in quite that way. It is true that we have a speed of light barrier on both travel and communication, but it is not true that this is getting in the way of colonizing the galaxy or spreading throughout the galaxy. The galaxy is big, but it's not nearly as big in light-years as the age of the universe in years. In fact, the size of the galaxy, it depends on... The galaxy doesn't have a sharp edge, so you can debate how big the galaxy is, but the typical scale is tens of thousands of light-years in linear size. So the universe is billions of years old. And you can say, well, it's hard to travel near the speed of light, but maybe that would be hard even if the speed of light were not a speed limit. It's still hard to build giant rocket engines or whatever it is."}, {"type": "text", "content": "0:32:34.5 SC: So to make it easier for you or more acceptable, maybe you say, okay, well, people in advanced civilizations can build rocket ships that can go 1% the speed of light. And if you have a 10,000 light-year sized galaxy and you go 1% the speed of light, okay, it takes you 10 million years to get across the galaxy. And even if you say it takes time for civilizations to evolve and whatever, 10 million years is nothing. It's just nothing compared to the age of stars and solar systems and things like that. Even life on Earth started 4 billion years ago, right? So it's not really a barrier. Like that's... I think, that was Fermi's point. I don't know whether von Neumann said it or not. But even moving at a relatively slow pace, even if you stop... It's more likely, rather than saying that you move at 1% the speed of light, it's more likely that you move at almost the speed of light in a realistic rocket ship, but then you stop and build some settlement on a planet or whatever and then you move on. Still, it wouldn't take billions and billions of years to fill the galaxy if that was what was going on."}, {"type": "text", "content": "0:33:44.9 SC: But okay, putting that aside to Jeffrey's question, I'm not sure that it makes a big difference that there's a speed of light barrier. We're not building spaceships that go anywhere close to the speed of light, right? So it's a little bit science-fictiony to think that, oh, that's what's holding me back. Like if it weren't for special relativity, I'd be flying across the galaxy by now, right? I mean, there's other barriers out there. I think it's fine. It doesn't really... My personal preferences are not relevant to there being an ability to go faster than light or not. I think that the more you dig into how physics works, the existence of some kind of speed limit does play a role, whether it's the speed of light or not. But the fact that if I poke the universe right here, the influence of that poke does not spread throughout all of spacetime instantly is important to how things work."}, {"type": "text", "content": "0:34:41.0 SC: I'm not worried about people hacking our technology. I think that that's a little bit harder than people make it out to be. And who knows? By the time we human beings do have the ability to travel to distant stars within our galaxy, maybe we'll just be a different kind of species than we are now, whether biologically or even just morally, right? Maybe we won't want to live on other planets that might someday develop life. Maybe we'll just build habitats out in interstellar space or interplanetary space around some star, using materials from planets that have no chance ever of developing life. I don't know. And I don't know whether the other species would feel similarly to that or not. So I don't think that anyone ever will design faster-than-light travel, and it doesn't really either bother me nor give me a sense of relief one way or the other."}, {"type": "text", "content": "0:35:38.0 SC: Halfacrackpot says, \"My question for you is as an author. Let's say, hypothetically speaking, mind you, that I own copies of a few of your books. I get to see them sitting on my shelf in all their glory every time I walk into my home office. Then one day I happen to find PDFs of those same books that fell off the back of a truck. I tried my best to chase them down to return them, but alas, I didn't even manage to get their plate. Would you be personally offended or feel wronged if I used those digital copies that were not paid for?\"\n\n0:36:06.1 SC: Well, look, I don't think that the point is whether I would be personally offended or not. I am all in favor, for example, of people reading books in libraries, even though authors don't get as much money if their books are read from libraries rather than purchased at a bookstore. But I think there's an economy. This is a collective action problem, right? One person getting a book or an album or whatever, or a movie, and not paying for it is no big deal. That's not the moral problem. The problem is if you like things, if you like things that other people create and take time to do that, whether it's, again, books or music or whatever, then you want to incentivize those people to do it. Once those people are multimillionaires, the incentive might be a little bit less, but still, the basic idea is that you want to pay people for the services that they provide you, if only not for moral reasons, but because that keeps them providing those services."}, {"type": "text", "content": "0:37:08.4 SC: There's also moral reasons. I mean, I think that there is some legitimacy to saying that it makes sense morally for there to be an exchange of goods and services, et cetera. We live in this weird world where a lot of stuff is available for free, some stuff isn't. There's this whole model of advertising, right? Most, the vast majority of people who listen to this podcast do so for free, but they have to listen to ads to do it. And they will nevertheless complain about the ads, even though they're listening to a free product, and even though they also have the option of just paying for the product by going to Patreon and then not getting the ads. They will still complain about the ads. I think that people just should generally have a feeling that you pay for things that you get, and that's not bad. And of course, different people are in different circumstances. Some people can't afford to pay or whatever. The world is complicated, but I don't think that there's any moral rectitude in taking stuff for free that you should be paying for. Of course, that's not to say that various corporations or whatever don't try to bleed you dry, and that's bad, and you can talk about that. But the general idea of an economy of goods and services where people pay for what they get, I think is perfectly good."}, {"type": "text", "content": "0:38:26.6 SC: Perry Huan says, \"I'm having trouble thinking through the differences between an infinite universe that may or may not be repeating and a continuous universe that just bubbles off from itself. Is there an intuitive way to think about these distinctions?\" Well, I'm not sure what you mean by a continuous universe that just bubbles off from itself. There are models, including the one that I explored with Jennifer Chen, of a universe that does have what we call baby universes, child universes, that bubble off from the original ones. But the baby universes are not exact copies of the original universe. They sort of go their own way. So I think that there's a big difference between a repeating universe and a sort of ever-growing universe. Those are two different things. There's different ways to be infinite, basically. You can be infinite by simply repeating yourself over and over again. You can be infinite by constantly changing. I think that in the case of the universe or cosmology, both of those possibilities are 100% on the table."}, {"type": "text", "content": "0:39:29.8 SC: I propose theories. I have papers where I write and I sketch out some cosmological model. And sometimes people who are not scientists, professional physicists or whatever, seem to think that because I'm investigating a model, I must be advocating that it's true. I mean, it does have a certain sensibility, right? Like, why would you suggest this model if you didn't think it was true? Why would you suggest a false model? The point is that it's not true or false. We don't know. We're exploring the space of possibilities, right? So to know that something is a viable possibility is important, useful information. In the case of the most recent paper I wrote with Saakshi Dulani and Nadiia Diachenko, we have a cyclic universe that we claim does not have the Boltzmann brain problem, unlike other cyclic universes do. And we made the point that we're pointing out a loophole, that if you'd asked me before, I would have said that this kind of cyclic universe is not viable, because of the Boltzmann brain problem, we realized that under certain circumstances, it can be. That doesn't mean I think the universe goes that way. It means I think the universe might go that way."}, {"type": "text", "content": "0:40:41.3 SC: And sorry for Perry, I'm going away from the original question, but it inspired me to mention this idea that this is what we do as theoretical physicists. We propose scenarios. Like Stephen Weinberg in 1967 didn't actually think, because he proposed the electroweak theory, that it was correct necessarily. He thought it was a chance of it being correct. It turned out to be correct and one of the most important contributions in the history of theoretical physics. But you don't know, and that's okay. So likewise for the universe being infinite it might be infinite, and it might be infinite in a way that is never repeating, or it might be infinite in a way that is repeating, or it might not be infinite at all. All of those are very viable. We should be very humble when it comes to thinking about the very, very large-scale structure of the cosmos."}, {"type": "text", "content": "0:41:27.6 SC: Kevin's Disobedience says, \"You don't strike me as someone who is inspired by any one particular philosopher. But if you were going to teach a course on one person's philosophy, who would it be?\" That's a good question. You're right that I'm not inspired by any one particular philosopher. I'm not... In the sense that I'm not a follower of any one particular philosopher, I borrow ideas from whoever I think has good ideas. And also, the other thing to keep in mind is that if you teach a course on somebody, that doesn't mean that you're a follower of them, right? Doesn't even mean you're temporarily a follower of them. Maybe you just think it's interesting to talk about what they're saying. So honestly, there's no philosopher right now who I think I could do a good job starting tomorrow teaching a course about. Like I said, I pick and choose from what different philosophers have to say."}, {"type": "text", "content": "0:42:20.3 SC: I mean, unless it was a very modern contemporary philosopher of physics, right? I could teach a course on David Albert or David Wallace or Tim Maudlin or whatever, but that would be weird. Those people are still alive. They should teach their own courses. So probably I would go the other way around. Just for my own interest, I would teach a course on Plato or Aristotle or a group of old philosophers, the Atomists or the Sophists or whatever, because I think that'd be fascinating and useful. I would love to teach a course in ancient Chinese philosophy, but I'm incredibly woefully underqualified to do that, so I wouldn't dare. I know just enough about Plato and Aristotle that I could learn enough to teach a course. And someone like Plato is very, very entertaining in the writing. He had some crazy ideas. Aristotle's ideas were largely, I think, closer to reality than Plato's, but he's not nearly as engaging a writer. So it goes back and forth."}, {"type": "text", "content": "0:43:19.7 SC: And of course, then it also depends. Do you count Isaac Newton as a philosopher? Was Galileo a philosopher? Teaching a course on Galileo, I think, would be amazingly fun. Newton would be much harder because the Principia is really hard to read. Newton was not a good writer in any sense, not a good explainer of what he was talking about. So Newtonianism is very interesting, but I don't think I could teach a course on Isaac Newton. I could teach a course on classical mechanics in a modern formulation of it, but not the original stuff. No, that's hard to figure out what's going on there.\n\n0:43:55.2 SC: Alright, I'm gonna group together three questions. Alex West says, \"There seems to be a split opinion on OpenAI withholding their Yang-Mills existence proof from public view. Thoughts?\" Alexander Knuckle says, \"I would love to hear your opinion about the latest Yang-Mills claims by OpenAI. I'm personally very unhappy how the results are communicated, but of course I'm very interested in learning more about rigorous definitions of Yang-Mills and the standard model. PS: How do you view the significance of the actual result, irrespective of how it was communicated?\" And finally, Tyler Whitmer says, \"I have a sort of meta question about the Yang-Mills OpenAI announcement. I was struck by the different ways the various constituencies engaged by OpenAI in the math and physics worlds asked for the discoveries to be handled by OpenAI. Do you have any thoughts on how you'd prefer these things to be dealt with in the future, especially if they are directly affecting an area where you're a published expert?\""}, {"type": "text", "content": "0:44:49.1 SC: So for those of you who don't know, there is a famous math/physics problem, one of the Millennium Problems, about the rigorous existence of quantum Yang-Mills theory. So Yang-Mills theory is just a generalization of electromagnetism. These are what we talk about when we talk about gauge theories. If you've read Quanta and Fields, my second volume in the Biggest Ideas in the Universe series, you know what we're talking about when we're talking about Yang-Mills theories. QCD, the theory of quantum chromodynamics, is the paradigmatic example of a Yang-Mills theory. In some sense, good old electromagnetism is a Yang-Mills theory, but it's too simple, so we don't really think about that too much."}, {"type": "text", "content": "0:45:35.3 SC: In another sense, the electroweak theory we were just talking about, where you have the Higgs boson and spontaneous symmetry breaking, is also a Yang-Mills theory, but it's a more complicated kind of Yang-Mills theory, precisely because of that symmetry breaking from the Higgs boson. So that's why QCD, the strong interactions with gluons and quarks, is the paradigmatic version. It's complicated enough to be interesting, not extra complicated by symmetry breaking, et cetera. And what you find, well, there's also different versions. You can think about what Yang-Mills theory, what QCD would be like if there were no quarks, right? If there were only gluons. You still get an interesting theory because gluons interact with each other. Photons, at the simplest level, at the first approximation, photons don't interact with each other. In the real world, photons interact with each other a little tiny bit, simply because photons interact with charged particles and charged particles interact with photons back, and therefore you get virtual quantum-induced indirect interactions between photons and other photons."}, {"type": "text", "content": "0:46:42.8 SC: But putting that aside, the gluons just interact with each other directly. So there's a whole bunch of questions you can ask in this world of rigorously defining quantum field theories. And I'm not in this world, really, because this is a heavily mathematical world, and it's one where there's a bunch of results that are sort of a little mysterious. There are theorems in what is called axiomatic quantum field theory where you can prove things that are a little bit surprising, things that don't seem to line up with our informal, less rigorous understanding of quantum field theory, and therefore there are debates back and forth about whether axiomatic quantum field theory is missing something important, whether we should just forget about being rigorous and use effective field theories and stuff like this. Anyway, that's just a little bit of the background."}, {"type": "text", "content": "0:47:33.5 SC: The other point is that if you choose your parameters and your fields correctly, then we know that a theory like QCD has this property called asymptotic freedom. Asymptotic freedom means as you look at the interaction between particles, in this case gluons, as a function of energy, the idea of renormalization and the renormalization group tells you that the strength of the interaction depends on the energy of the particles when they're interacting. And asymptotic freedom means the more energetic they are when they're interacting, the less of an interaction there is. So asymptotic means higher and higher energies, freedom means less and less interaction. So there is a couple of informal, and that's very important, informal implications of the idea of asymptotic freedom. The flip side of asymptotic freedom is infrared slavery. So as you get to lower and lower energies, the particles interact more and more, so much so that they become confined. So the fact that you never see a gluon or a quark all by itself out there in the wild is supposed to be related to this fact that the interactions become stronger when the fields or the particles become further apart from each other."}, {"type": "text", "content": "0:48:53.9 SC: In quantum field theory, large distances means low energies. So when we talk about low energies, the interactions become strong. The interactions become strong when the two particles, two quarks or two gluons, get pulled apart from each other. So the energies become so large that it's easier to make another quark-antiquark or gluon-antigluon pair, and therefore you can never just take apart a single particle from a strongly interacting collection of particles, and that's confinement. Along with confinement, there is a related feature that there is what is called a mass gap. So if you have a single photon, a single photon has zero mass and therefore it has whatever energy you like. Its energy depends on its wavelength: longer the wavelength, lower the energy. And you can imagine, at least as a thought experiment, arbitrarily long wavelengths and therefore arbitrarily low energies. And in principle, you could go all the way to zero. You can't quite reach zero because otherwise that photon wouldn't exist if it had exactly zero energy, but you can get as close as you want."}, {"type": "text", "content": "0:50:01.6 SC: So if you think about the set of possible energies that a single photon can have, they go from just above zero to whatever you want. With gluons, it's not like that. So you ask yourself, in the theory of gluons, what is the lowest mass that a particle can have? And you might have been told that the mass of the gluon is zero, but there are no gluons all by themselves. Okay. So what we're asking is, what is the lowest mass particle that actually exists all by itself? And in QCD, well, you would have to define, do you mean QCD with quarks or without quarks? With quarks, we know there are things like protons and neutrons. There's also mesons like pions and kaons and so forth. The mesons for these purposes actually don't count because they're not stable. They're not really particles that can exist arbitrarily long all by themselves."}, {"type": "text", "content": "0:50:59.1 SC: But a proton is stable in just QCD. In the electroweak theory, it becomes more complicated, okay, but otherwise, for a very good approximation, protons are pretty darn stable. And they don't have zero mass; they have a non-zero mass. And even if you didn't have quarks, you could imagine making something like a glueball, which is a collection of gluons made up into a single particle that could exist by itself. And the idea is that its mass would not be zero. Okay. In the real world, we think that if you can make glueballs, they would also be unstable, but if you didn't have any quarks, there would probably be stable glueballs lying around.\n\n0:51:35.2 SC: Okay, so all of that is to say, in Yang-Mills theory, there's something called a mass gap because there is a smallest possible mass; it is not zero. So the photons, electromagnetism, have no mass gap. You can get as low energy as you want. In QCD, you think that there is a mass gap. So there's confinement and a mass gap. These are the characteristics that you think are important for your quantum versions of Yang-Mills theory. But we haven't been able to show any of these things in terms of rigorous proofs. We haven't even been able to show that Yang-Mills theory exists in the sense of what particle physicists mean by that. It exists in the sense that you can write down the basic principles of the theory, but you haven't proven that it exists in the sense that those basic principles add up to a well-defined, 100% rigorously defined theory. Turns out that because quantum field theory is hard and there's infinities everywhere, there's an infinite number of degrees of freedom, proving rigorous statements is just super duper hard. So one of these big open math problems is prove rigorously that there is a quantum Yang-Mills theory that exists, and if it's true, prove that there's a mass gap, prove there's confinement, things like that."}, {"type": "text", "content": "0:52:51.5 SC: So again, I don't do that kind of thing. It's a very, very niche, specialized topic, actually, because most physicists just assume that it works and get on with their lives. It seems to work, right? There are protons all around us. We can make predictions, calculations using QCD for things that happen at the Large Hadron Collider or wherever; they come out matching the observations. So this sort of mathematically rigorous level proving that the theory works is of less immediate relevance to the working physicist than to mathematicians. Still interesting and important, don't get me wrong. I'm just explaining that even though I think about theoretical physics, I don't spend a lot of time thinking about the existence or rigorous proofs involving Yang-Mills theory."}, {"type": "text", "content": "0:53:38.6 SC: So as with many interesting math problems recently, in the past couple weeks and months, there have been AI-assisted proofs. OpenAI in particular, as a company, has devoted some millions of dollars to throwing CPU cycles at proving mathematical questions one way or the other. And one of these, apparently, is the existence of Yang-Mills theory, a big, very, very important problem for mathematical physics. Okay, so that's the background. The extra bit of background is, as I understand, 'cause I've not followed it super duper closely, so anyone can correct me if I've gotten it a little bit wrong here. But the basic idea is OpenAI says they've proven it, and they say there is a verification of the proof. And what that means is you can write down the proof step by step and have it checked by a computer so you don't think you've made any mistakes. That's what people mean when they say they have a Lean verification. That doesn't mean they have a skinny verification; it means that there's a program called Lean that can check the logical consistency of your mathematical proofs. And so they say they've not only proven it, but that it's been checked by Lean, which means it's correct."}, {"type": "text", "content": "0:54:52.6 SC: Okay, but there's one thing to say that, there's one thing even for it to be true, there's yet another thing to understand what is going on. And that both means understanding as human beings what were the important missing steps that this computer used that the human beings who've been trying to prove this didn't do. What are the important conceptual moves that were necessary to getting this result? But also, are we sure that the result is correct even if it's been checked by the computer? All the computer can check is that the conclusions follow from the assumptions. Are you sure that the assumptions you put in are the ones that we care about and the ones that we would consider to be the right ones? And so what OpenAI did is rather than just releasing the proof to the world on some webpage or whatever, they assembled a small group of very, very high-level smart physicists led by David Gross, my former boss, Nobel Prize winner at KITP in Santa Barbara. And he had another bunch of people who were working with them, and they were given the proof. And as I understand it, they're gonna go through it, try to understand it, and then try to explain it to the rest of the world. And meanwhile, the rest of the world doesn't get to look at it."}, {"type": "text", "content": "0:56:10.1 SC: So if that is correct, if my understanding that far is correct, I see no problem whatsoever with this. In fact, I think it's kind of absurd to think that there's any problem with this. Look, if I do get a result as a theoretical physicist and it's in a file that I've typed up on my computer, I'm under no obligation to immediately release it to the world. In fact, I don't immediately release it to the world. I write a paper about it, I think about it, I decide what the implications are, what the best way to present it, and make figures and cite people and stuff like that. And that's what these human beings are doing. That seems 100% valid and, in fact, 100% morally right to me, as far as I can tell. I might be missing something; I might not know about some sketchiness going on there in the background. But to me, the idea that human beings are given access to the proof, they're now collaborators on the project, and they are trying to make sense of it and will explain it to everybody, that's just how science works. That's a completely everyday, conventional way of doing things."}, {"type": "text", "content": "0:57:18.5 SC: Now, we'll see how this plays out, and we'll see how it plays out in the future, et cetera. But I think that we're still not in any equilibrium phase in terms of how we balance what the AIs are able to do and what human scientists and mathematicians care about. That's something that's still very much in flux. This is an experiment in trying to figure out how to do that correctly. And look, I'm not a fan of OpenAI. I think I can criticize what they do for a lot of different things. This does not seem to be one of those times that I see anything going wrong.\n\n0:57:53.8 SC: Caleb Urian or Yaryon says, \"My son is a junior in high school and has expressed interest in pursuing a career in physics. I have an engineering background and have practical advice for him if he wanted to pursue engineering, but I'm curious what advice you have for a high school student that is considering physics.\""}, {"type": "text", "content": "0:58:10.3 SC: Yeah, so I'm asked questions like this all the time. I think I'm just gonna... I'm probably repeating myself. I don't remember what I said and what I don't. The simplest thing to say is it's very hard to give advice because everyone's situation is different. What is your son good at? What does he care about? What does he want to be? What kind of physics might he want to do? I do think that I feel comfortable saying that pursuing physics is generally good if you're interested in it. It may or may not lead to a career doing physics, but knowing physics and studying it and sort of tackling all the abstract difficulties of it is a worthwhile pursuit. So there's no reason to say, \"Oh, no, don't do that. You're wasting your time.\" Even if you end up doing something else, the training is extremely valuable."}, {"type": "text", "content": "0:58:59.1 SC: In terms of him getting ahead, there are debates about whether you should sort of study things by yourself before you get to them in your regular educational curriculum. I'm a big fan of doing that. By all means, study things by yourself, especially nowadays when there's so many resources online. There's online courses and lecture notes and whatever. I don't see any reason to wait. When I was taking calculus in high school, our calculus teacher said, \"Don't study anything that I haven't taught you because you'll learn it wrongly.\" I think that was just terrible advice. I think exactly the opposite of that.\n\n0:59:35.3 SC: In terms of preparation, learn about math, learn about physics. It's hard when you're in high school to learn sort of interesting physics, right? You don't have the mathematical tools to learn the kind of physics that physicists do at a research level on an everyday basis. You're stuck doing like inclined planes and classical mechanics and things like that. That's fine. There's a certain amount of patience that is absolutely useful and necessary here. A lot of people get tripped up because they want to skip right to the most interesting stuff, and you gotta put in your hours, right? You have to learn the basics, the background before you can get there."}, {"type": "text", "content": "1:00:15.1 SC: So learning math, learning calculus and geometry, these days learning something about computers. How the computers are going to be useful is different from month to month, so I have difficulty giving you advice about that. Don't let the computers do the work for you. Use the computers to teach yourself by all means, but make sure the ideas get into your head and make sure you're able to use those ideas. I know that the computers can solve an equation for you, but you need to understand, you being your son, need to understand what it means to solve an equation and how you would do it.\n\n1:00:51.3 SC: Because one plausible future of the relationship between humans and computers in physics is that humans are mostly interested in deciding what are the interesting problems and what are the directions in which you should look for a solution, and then they team up with the computers to turn those vague ideas about directions to look for a solution into a rigorous solution or to a careful solution. So working with the computers, both AI and not AI, but just computers very generally, is absolutely part of the skill set."}, {"type": "text", "content": "1:01:24.6 SC: Otherwise, you gotta go to college, so apply to college. I'm a pretty big believer that you can do well as a physics student as an undergraduate at most colleges. I think that people worry too much about getting to the absolute best places as an undergraduate. As a graduate student, the total number of people is much smaller. Who you're working with as your advisor is much more important. And choosing which graduate school to go to is crucially important and changes your life. When you're an undergraduate, as long as you're at a place that is big enough that they have enough resources, you cannot possibly take advantage of all the resources as a student there for four years studying as an undergraduate. So it's much more in your hands as the student than it depends on where you go to school."}, {"type": "text", "content": "1:02:12.0 SC: You can absolutely get a world-class physics education going to a big university, state school, right? Penn State or the University of Texas or whatever. You need to do it. It's really in your hands. If you go to a small liberal arts school, that can be a wonderfully useful and impactful experience in terms of becoming a good human being. It's not as good, I just have to be super honest here, even though it breaks my heart, it's not as good for being a great physicist. Because the definition of a small liberal arts school is that there's no graduate school there. So you can get a very good undergraduate education, but you can't dip into more advanced topics. You can't talk to grad students and postdocs, you can't see the professors doing research with grad students and postdocs, et cetera. There's a whole part of the experience that you just can't get."}, {"type": "text", "content": "1:03:07.7 SC: And as I say that, I say that as someone who was in that position. We didn't have any grad students, graduate programs in physics or astronomy or math when I was an undergraduate at Villanova. So I think that was a problem for me. I didn't get to take any advanced classes that I might have been able to take if there were graduate classes around. So that's the only thing that I would, if you want to be a research-level physicist, I would point to as something to really care about in your choice of universities. You can always overcome it. There's no yes or nos here. There's things that nudge you in one direction or another, and you have to decide how the nudges sum up for your personal situation."}, {"type": "text", "content": "1:03:48.7 SC: Philip Abard says, \"Do you think there may be something in Nietzsche's idea of eternal recurrence if the block universe is to be taken literally? After all, if the entire history of the universe is out there, there should be nothing to stop you experiencing your life anew after you die.\" I probably should have grouped this one with the previous question because I don't think that the two things follow from each other. Philip's asking an interesting question, but the block universe is just a way of saying, as far as existence is concerned, all moments of time participate in existence equally: past, present, and future. There's nothing special about the present time other than the version of you that is in this time is calling that now. That's the only thing special about it."}, {"type": "text", "content": "1:04:31.8 SC: But there's nothing in that block universe perspective or eternalism that necessarily implies any opinion about eternal or finite. You can have a block universe that goes forever. You can have a block universe that is finite. You can have a block universe that goes in cycles. You can have a block universe that goes without cycles. All of those are possible. So I don't think there's any necessary connection there.\n\n1:04:54.4 SC: The other thing I just want to warn, and I've warned many, many times, you shouldn't say things like \"nothing to stop you experiencing your life anew after you die.\" You are a collection of particles in this particular region of spacetime, okay? That's who you are. If there happens to be at some future or some faraway, distant part of the multiverse, or distantly in the past, another collection of particles that is very, very similar to the you that is listening to this podcast right now, that's great, but it's not you. Because you're here, okay? That is another person who just happens to share a lot of characteristics with you, but it's not you experiencing your life again in any sense whatsoever."}, {"type": "text", "content": "1:05:46.4 SC: Joshua Hillerup says, \"Would anthropic reasoning mean we should favor, with Fermi paradox explanations, ones that maximize the number of intelligent species out there who are capable of wondering about the Fermi paradox?\"\n\n1:05:59.2 SC: Well, people argue about the anthropic principle, so I'm not gonna say what the consensus is because I don't know what it is. My own view of the anthropic principle is that what it can do is to say that given who you are, okay, given what you know about your location in the universe and what you see around you and how you reconstruct your environment, all that stuff, it's fair to ask, given different cosmological models that you're trying to say, what should my credences be in these different versions of a theory of the universe? You should update them as a good Bayesian by the likelihood that at least one version of you with your knowledge and your environment and all that stuff would exist in this universe. If there are a million versions exactly the same or indistinguishable from each other, you don't get any benefit for that. You don't know which one of those you are. You can go on to ask what are the probabilities that I'm different versions of these people who are indistinguishable from me, so I don't think you get like a million times more probability just because there's a million more observers. I do think that you get extra probability or extra credence depending on the probability that at least one version of you exists."}, {"type": "text", "content": "1:07:16.4 SC: Now, the easiest and cheapest way for there to be a probability of there being at least one person like you is for there to be many, many, many people or many, many close calls in the universe. So I do think it's absolutely legit to have some boost to bigger universes, larger cosmologies over smaller ones, but not an absolute boost to an infinite number of observers over a finite number of ones. And having said all of that, I can easily imagine scenarios where in, let's say, the observable universe around us now, which has a few hundred billion galaxies, it's completely possible that we are the only intelligent species. And yet the number of regions like ours, observable universes the size of ours, is 10 to the 10 to the 10 to the 10, in which case there'd be lots of people like you, but only one in each person's observable universe. So I'm not quite sure that it necessarily has any connection to the Fermi paradox, although there's sort of an indirect connection you could think about."}, {"type": "text", "content": "1:08:23.5 SC: Callesin the First says, \"If big wormholes à la Star Trek were real, what would be the safest way to enter them? In media, wormholes act like objects on a 2D plane and spacetime bends inward perpendicular to that plane. The spaceship then enters from a direction, sorry, perpendicular to the plane, right in the middle of the curvature. But in real life, they would be spherical and spaceships could not enter at an angle perpendicular to the plane. So could one enter from any direction? It's science fiction, so maybe anything goes.\"\n\n1:08:57.9 SC: No, I think you're basically on the right track. A wormhole would be like a spherical region of space that had the property that when you look into it, you're seeing another spherical region of space on the other side, okay? So you're seeing a 360-degree view of a different part of the universe from the 360 degrees around the sphere you're looking at. And the sphere is not like a hard surface that you bump into; it's a tunnel, okay? So you literally just see the stars that would be on the other side of the sphere or whatever. So it's easy to imagine that a wormhole could be out there and be almost invisible, right? If the other end of the wormhole were in a region of spacetime that didn't have a lot of stars around it, it would just look black. You wouldn't even see anything. It would not be like the glowy thing. This, by the way, was one point of contention when they were making the movie Interstellar. Kip Thorne, who played a big role in the movie, tried to make them understand that wormholes would look a certain way."}, {"type": "text", "content": "1:10:03.3 SC: And the movie makers said, \"Look, I know, but people have heard of wormholes before. They have a certain set of expectations, and if we completely violate those expectations, they're not gonna be happy.\" So there was some compromise on trying to make the wormhole look wormhole-like and yet be physically realistic. But basically, it's a sphere, and you can enter the spherical region in any direction you want. If you enter it glancingly, then you come out the other side glancingly. That's all that really happens.\n\n1:10:34.9 SC: Tom B. Knight asks a priority question. I forget if I've already said this, but priority questions, you get a priority question once per your lifetime as a Patreon supporter, and I'll do my best to answer it because usually we get too many questions for me to answer all of them. So Tom's question is, \"Apologies in advance because I know you don't like questions about free will. It seems that many people in this debate, for example, your recent guest Greg Caruso, try to eat their cake and have it too. They acknowledge someone's lack of free will when they make a bad decision, like committing a crime, then assume others have free will when deciding how to feel or respond. It seems the practical, logically consistent position is to treat everyone as if they have something resembling libertarian free will. What do you think?\""}, {"type": "text", "content": "1:11:18.7 SC: Well, I think a couple of things. Greg Caruso, I shouldn't speak for him. I know people want me to explain the arguments put forward by my podcast guests, but I do that very reluctantly because hopefully their arguments are non-trivial and I shouldn't be the person repeating them. But I think Greg would say he doesn't believe in free will for anyone, making good decisions or bad decisions. A lot of his motivation for not believing in free will is that when people make bad decisions, he doesn't want them to be thought of as morally lesser, and therefore deserving of punishment or something like that. So I think that he's logically consistent. I think that he treats everyone the same; he just doesn't believe in free will."}, {"type": "text", "content": "1:12:02.5 SC: There's another logically consistent position, which is treating everyone as they have free will. Now, you say \"something resembling libertarian free will.\" That makes me a little nervous. I'm not quite sure what that means. What does it mean to resemble libertarian free will? Libertarian free will, remember, is precisely when you think that your actions are not only incompletely specified and unpredictable at some higher emergent macroscopic level, but truly independent of even the microscopic laws of physics. A libertarian about free will believes that even Laplace's demon couldn't predict what you were going to do next, or even probabilistically given quantum mechanics or anything like that. So I'm not sure what use or what role the word \"libertarian\" is playing in your sentence. I do think that it's consistent and logical to treat everyone as if they have something resembling free will. And honestly, like I said, I don't care if people don't want to use that terminology, as long as they treat people as rational decision-making agents, that's fine with me. I certainly would not say that they resemble having libertarian free will."}, {"type": "text", "content": "1:13:11.5 SC: David Commander says, \"How does a Boltzmann brain continue to survive? And if it can't, why isn't ongoing experiences in the moments of now insufficient to prove I am not one? In other words, if I can have false past memories, can I also have false ongoing experiences or the illusion thereof?\"\n\n1:13:28.5 SC: So I will say what I always say when it comes to Boltzmann brains: brains are not the issue. The idea of the Boltzmann fluctuation is that you tell me what it is you want to wait for to exist in the universe. Maybe it's a brain. Maybe it's a person who lives a hundred years. Maybe it's a whole solar system that lasts 4 billion
