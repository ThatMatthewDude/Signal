<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<style>
:root {
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: #000;
  color: #f5f5f5;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
a { color: inherit; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  background: rgba(0,0,0,0.92);
  border-bottom: 1px solid #262626;
  backdrop-filter: blur(6px);
}
.wordmark {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.icon-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: #f5f5f5;
  padding: 6px;
  display: flex;
  align-items: center;
}
.icon-btn svg { width: 24px; height: 24px; }

.tabs {
  display: flex;
  gap: 6px;
  padding: 10px 14px;
  border-bottom: 1px solid #1c1c1c;
}
.tab-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: #888;
  font-size: 13.5px;
  font-weight: 600;
  padding: 7px 16px;
  border-radius: 999px;
}
.tab-btn.active {
  color: #fff;
  background: #1e1e1e;
}

main {
  max-width: 470px;
  margin: 0 auto;
  padding-bottom: 60px;
}

.post {
  border-bottom: 1px solid #1c1c1c;
  padding: 14px 0 22px;
  margin-bottom: 8px;
}
.post-header {
  display: flex;
  align-items: center;
  padding: 0 14px 10px;
  gap: 10px;
}
.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #333;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  color: #ccc;
  flex-shrink: 0;
}
.header-text {
  display: flex;
  flex-direction: column;
  line-height: 1.25;
  min-width: 0;
}
.source-name {
  font-weight: 600;
  font-size: 13.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.header-meta {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.tag-pill {
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 999px;
  background: #1e1e1e;
  color: #aaa;
  border: 1px solid #2c2c2c;
  white-space: nowrap;
}
.timestamp {
  font-size: 12px;
  color: #8a8a8a;
  white-space: nowrap;
}

.media {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  background: #0c0c0c;
  overflow: hidden;
}
.carousel-track {
  display: flex;
  height: 100%;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.carousel-track::-webkit-scrollbar { display: none; }
.panel {
  min-width: 100%;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
  overflow-y: auto;
}
.panel img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.panel-text {
  font-size: 15px;
  line-height: 1.6;
  white-space: pre-wrap;
  color: #eee;
  align-self: flex-start;
  margin: auto 0;
}
.panel-snippet {
  display: flex;
  flex-direction: column;
  gap: 14px;
  align-self: center;
}
.panel-snippet p {
  font-size: 15px;
  line-height: 1.6;
  color: #eee;
  margin: 0;
}
.read-more {
  font-size: 13.5px;
  font-weight: 600;
  color: #4ea1ff;
  text-decoration: none;
}

.dots {
  position: absolute;
  bottom: 10px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 5px;
}
.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,0.35);
}
.dot.active { background: #fff; }

.post-footer {
  display: flex;
  align-items: center;
  padding: 10px 14px 0;
  gap: 12px;
}
.save-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: #f5f5f5;
  padding: 4px;
  margin-left: auto;
}
.save-btn svg { width: 22px; height: 22px; }
.caption {
  padding: 8px 14px 0;
  font-size: 13.5px;
  color: #ccc;
  line-height: 1.5;
}
.caption .caption-source {
  font-weight: 600;
  color: #f5f5f5;
  margin-right: 6px;
}
.caption a {
  color: #4ea1ff;
  text-decoration: none;
}
.caption-body {
  margin-top: 6px;
}

.hidden { display: none; }
#saved-view {
  display: none;
}
#saved-view.active { display: block; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.empty-state {
  text-align: center;
  color: #777;
  padding: 60px 20px;
  font-size: 14px;
}
.saved-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 4px 14px 14px;
}
.saved-header h2 {
  font-size: 16px;
  margin: 0;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="wordmark" id="wordmark-btn">Atlas</div>
  <button class="icon-btn" id="saved-toggle-btn" aria-label="Saved posts">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3c-1.1 0-2 .9-2 2v16l8-5.333L20 21V5c0-1.1-.9-2-2-2H6z"/></svg>
  </button>
</div>
<div class="tabs" id="tabs-row">
  <button class="tab-btn active" data-tab="live">Live</button>
  <button class="tab-btn" data-tab="weekly">Weekly</button>
</div>

<main>
  <div id="feed-view">
    <div id="feed-live" class="tab-panel active"></div>
    <div id="feed-weekly" class="tab-panel"></div>
  </div>
  <div id="saved-view">
    <div class="saved-header">
      <button class="icon-btn" id="back-btn" aria-label="Back to feed">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h2>Saved</h2>
    </div>
    <div id="saved-list"></div>
  </div>
</main>

//www.bbc.co.uk/news/articles/cwg7l5ve251ko?at_medium=RSS&at_campaign=rss", "source": "BBC News", "tag": "news", "published_at": "2026-11-26T00:23:05+00:00", "panels": [{"type": "snippet", "content": "Despite widespread concern from residents ahead of the blast, officials say that lead readings in the area so far have been promising.", "read_more_url": "https://www.bbc.co.uk/news/articles/cwg7l5ve251ko?at_medium=RSS&at_campaign=rss", "read_more_source": "BBC News"}], "text_post": false}, {"id": "62bb4bc58887fde3", "title": "Can America’s government afford “affordability”?", "url": "https://www.economist.com/finance-and-economics/2026/11/25/can-americas-government-afford-affordability", "source": "The Economist", "tag": "news", "published_at": "2026-11-25T22:33:27+00:00", "panels": [{"type": "snippet", "content": "Making things cheap is expensive", "read_more_url": "https://www.economist.com/finance-and-economics/2026/11/25/can-americas-government-afford-affordability", "read_more_source": "The Economist"}], "text_post": false}, {"id": "e971b2e6b8375b85", "title": "First publicly-documented wartime interception of a jet-powered drone by laser", "url": "https://twitter.com/bayraktar_1love/status/2125619358453911742", "source": "Hacker News", "tag": "engineering", "published_at": "2026-11-25T21:45:33+00:00", "panels": [{"type": "text_post", "content": "7 points, 1 comments"}], "text_post": true}, {"id": "03e5cf663c351b2d", "title": "Jensen Huang’s bail-out will not be the AI boom’s last", "url": "https://www.economist.com/business/2026/11/25/jensen-huangs-bail-out-will-not-be-the-ai-booms-last", "source": "The Economist", "tag": "news", "published_at": "2026-11-25T21:09:28+00:00", "panels": [{"type": "snippet", "content": "His return has done little to quell Wall Street’s terror", "read_more_url": "https://www.economist.com/business/2026/11/25/jensen-huangs-bail-out-will-not-be-the-ai-booms-last", "read_more_source": "The Economist"}], "text_post": false}, {"id": "0e45142ed133be39", "title": "Tourists are starting to return to Syria", "url": "https://www.economist.com/middle-east-and-africa/2026/11/25/tourists-are-starting-to-return-to-syria", "source": "The Economist", "tag": "news", "published_at": "2026-11-25T20:44:46+00:00", "panels": [{"type": "snippet", "content": "The government risks putting them off", "read_more_url": "https://www.economist.com/middle-east-and-africa/2026/11/25/tourists-are-starting-to-return-to-syria", "read_more_source": "The Economist"}], "text_post": false}, {"id": "a0a28e2a695aced4", "title": "Does God Explain Design or Create a Bigger Mystery? | Bede Rundle", "url": "https://www.youtube.com/watch?v=6PVYR3RSbH4", "source": "Closer to Truth", "tag": "philosophy", "published_at": "2026-11-25T19:30:32+00:00", "panels": [{"type": "snippet", "content": "*Does explaining the complexity of life through a divine designer actually explain anything?*\n\nPhilosopher Bede Rundle revisits David Hume's challenge to the argument from design: introducing God may add an even more puzzling entity to the explanation. He contrasts this with Darwinian evolution and questions whether describing God as infinitely simple makes the divine hypothesis more intelligible.\n\n0:00 Why the Design Argument Seems Persuasive\n1:40 Hume's Objection to a Divine Designer\n2:58 Evolution as an Alternative Explanation\n3:55 The Limits of Evolutionary Explanation\n4:53 Why Divine Simp", "read_more_url": "https://www.youtube.com/watch?v=6PVYR3RSbH4", "read_more_source": "Closer to Truth"}], "text_post": false}, {"id": "0f5631116687db52", "title": "FDA to Expand Prescription Drug Testing After ProPublica Revealed Safety Concerns", "url": "https://www.propublica.org/article/fda-prescription-generic-medication-testing", "source": "ProPublica", "tag": "news", "published_at": "2026-11-25T19:30:00+00:00", "panels": [{"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/20261125-Thilesen-FDA-Testing_DSC5742.jpg?w=1149", "alt": "A low-angle photograph shows a laboratory technician in a white lab coat and blue nitrile gloves inspecting a multivessel dissolution testing apparatus filled with clear liquid."}, {"type": "text", "content": "The Food and Drug Administration will test more prescription drugs for impurities and other dangerous quality lapses under an expanded program described by safety experts as a critical step to better protecting America’s drug supply.\n\nAbout 90% of prescriptions in the United States are for generic drugs, many manufactured thousands of miles away in countries that include India and China. Until now, the FDA has only periodically tested a sampling of those drugs to see if they were safe or worked as effectively as the brand-name medications they are meant to replicate."}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2025/12/20251217-rxinspector-3x2-1.jpg?w=459&h=306&crop=1", "alt": ""}, {"type": "text", "content": "Last week, the FDA announced it will test more often and identify poorly performing drugs for further study.\n\nThe agency said it will buy the medications from retail pharmacies and wholesale distributors, but it did not say how many drugs it plans to test or how frequently. A spokesperson did not answer questions about how the FDA would select drugs for testing or how it would hold manufacturers accountable for inferior products, beyond posting the results on its website. Still, drug-safety experts said the expansion helps address long-standing concerns that some suppliers sacrifice quality to keep costs low — and that the FDA has for years looked the other way.\n\n“All drugs, regardless of where they are manufactured, must meet the same FDA standards for safety, effectiveness and quality,” the FDA spokesperson told ProPublica."}, {"type": "text", "content": "A ProPublica investigation last year found the agency routinely relied on the drug companies themselves to do their own testing even as doctors, researchers and the Department of Defense warned that essential medications were contaminated or ineffective. On its website, the FDA said it has relied on a “more targeted, risk-based” approach to testing since 2018, choosing samples of drugs that have safety, effectiveness or quality concerns. The agency publicly reports the results on its website and notes that a majority of the tested drugs meet its standards.\n\nProPublica, however, found the agency for years failed to regularly test both the generics that have worried outside experts and drugs coming from factories that amassed so many serious quality and safety violations they were ultimately banned from the U.S. market. ProPublica later used FDA data to create Rx Inspector , a first-of-its-kind tool that allows consumers and doctors to look up the inspection records of the factories where more than 40,000 generic drugs are made."}, {"type": "text", "content": "Researchers have repeatedly urged the FDA to test more often. In fiscal year 2025, the FDA reported testing 46 different drugs, and for 29 of those drugs, the agency only tested one manufacturer . All but one passed every test.\n\nThe FDA’s new testing regime is “a huge validation of the research that we’ve been doing raising concerns about the quality of generic drugs,” Dr. Kevin Schulman, a professor of medicine and health policy at Stanford University, said of the FDA’s new testing program. “This is a great effort on their part.”\n\nIn February, senators also introduced a bill targeting transparency in the drug supply chain process, in part because of similar public concerns.\n\nIn response to questions about how it would decide which drugs to sample and how results would drive future enforcement, the FDA spokesperson said the initiative will “help the FDA identify potential drug quality issues faster and will provide more information the agency can use to decide if further action is needed.”"}, {"type": "text", "content": "Experts say they ultimately hope the FDA’s program will work alongside independent testers to shift the generic drug market to be competitive on quality rather than price. While the agency can focus on weeding out the worst actors, independent labs can test manufacturers against one another to find the most effective products, said retired Col. Vic Suarez, a former medical supply-chain commander. A similar system is already used at the Department of Defense.\n\n“It’s an important thing because they will probably catch extreme violators of regulatory standards, so that’s a good thing,” Suarez said. “But you also need to have a complementary system where you’re actually raising the bar.”\n\nProPublica previously engaged an independent lab, Valisure, to test several generic versions of three of the most prescribed drugs in the United States and in two cases identified irregularities that experts said could compromise their effectiveness."}, {"type": "text", "content": "“I think, high level, the idea that we should be doing more testing is fantastic,” said David Light, the co-founder of Valisure. “I think there’s so much growing energy behind that.”\n\nThe post FDA to Expand Prescription Drug Testing After ProPublica Revealed Safety Concerns appeared first on ProPublica ."}], "text_post": false}, {"id": "1c6eb8df23efe6a8", "title": "How to make Thanksgiving even better", "url": "https://www.noahpinion.blog/p/how-to-make-thanksgiving-even-better", "source": "Noahpinion", "tag": "financial", "published_at": "2026-11-25T19:23:28+00:00", "panels": [{"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!vmmn!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F14f3ac74-09da-47fe-96aa-506ded1ce24e_1053x702.jpeg", "alt": ""}, {"type": "text", "content": "Just to be clear, I like Thanksgiving. In fact, I like holidays in general. My favorites are Christmas and New Year’s, but I also love the 4th of July, Valentine’s Day, and Halloween. I like Labor Day and Memorial Day, despite the fact that most people don’t seem to get off work these days. I enjoy Mother’s Day and Father’s Day, even though my parents are no longer with us. St. Patrick’s Day and Cinco de Mayo are fun, even though I don’t drink much alcohol. Passover and Purim are underrated Jewish religious holidays, and Hanukkah is an excellent alternative Christmas. I’m sure Diwali will be a party once Hindu culture becomes more common in America. Juneteenth was a Texas holiday long before it became a national one. Columbus Day is fun mainly for seeing people get mad online. Presidents’ Day is…a day, I guess."}, {"type": "text", "content": "But OK, Thanksgiving. It has lots to recommend it. For one thing, everyone gets off work, which is not true for any other holiday except Christmas. It’s a great opportunity for most people to see their families. And since it’s on a Thursday, almost everyone gets at least four or five consecutive days off in a row (European friends, I assure you that this is a big deal in America). I also like pie, 1 and Thanksgiving is a prime time for pie. Also, Thanksgiving is conveniently situated midway between Halloween and Christmas, making the last two months of the year feel like one big rolling holiday season.\n\nFor many years, though, I’ve felt like Thanksgiving could stand to have a major upgrade in our culture. Despite its advantages, the holiday as it stands has several big weaknesses."}, {"type": "text", "content": "First of all, it involves a lot of frantic rushing around. You fly or drive out to see your family on Wednesday, you eat a big dinner, you hang out for one or two more days, and then you fly right back for three more weeks of work before Christmas, with barely any time to relax. The air congestion is horrendous, and the roads aren’t much better. Contrast this with Christmas/New Year’s, which for many people is a week or more of vacation.\n\nUnfortunately, I don’t think the timing of Thanksgiving is fixable. American culture being what it is, a second country-wide “vacation week” would be a big ask. And if we do get a second vacation week, it should really be in the spring, to balance out the relative lack of national holidays in that season."}, {"type": "text", "content": "Thanksgiving’s second big weakness — that not everyone has a family they can visit — has already been fixed, with the advent of Friendsgivings. This has also turned Thanksgiving into a much-needed “dinner-party holiday”. Americans already have lots of holidays where they go out and party and drink alcohol (or your equally attractive non-alcoholic beverage of choice). It’s nice to have one cozy, low-key holiday where you invite all your friends over, show off your cooking skills, and chill on the couch. Friendsgivings also spread out the Thanksgiving holiday season beyond simply the 5-day weekend.\n\nBut there are still some ways that I feel Thanksgiving could be significantly improved.\n\nOne is that other than the dinner, Thanksgiving is kind of thin on associated traditions. Halloween has costumes and spooky house decorations. Christmas has gift-giving and cheerful house decorations. The 4th of July and New Years have fireworks. Valentine’s Day has gift-giving. Thanksgiving just has…dinner. There’s nothing wrong with dinner, but I feel like we can do more."}, {"type": "text", "content": "One idea is to add a tradition of gift-giving . We have holidays where you give presents to your family and friends (Christmas/Hanukkah, birthdays), and a holiday where you give presents to your lover (Valentine’s). But what about a holiday when you give out little minor gifts to your acquaintances and associates — your coworkers, neighbors, and so on? Ideally, these would be little individually wrapped snacks or other food items, like the omiyage boxes in Japan:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!N2NL!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F202b3352-1e9b-445d-aea2-77146a4752ba_961x639.jpeg", "alt": ""}, {"type": "text", "content": "In fact, I borrowed this whole idea from Japan. While Valentine’s Day is a purely romantic holiday in America, in Japan people bring chocolates for coworkers and friends — and there’s another holiday on March 14th called White Day when people do the same. 2\n\nA tradition of broad-based giving of minor gifts on Thanksgiving would fit with the general theme of “giving thanks”, since it’s basically a way to give thanks for all of your social ties. And it would be a way to celebrate our broad social networks, which are both more economically and more psychologically important than we tend to appreciate. It would also lead to a burst of society-wide creativity, as stores competed to create ever-more-creative gift boxes."}, {"type": "text", "content": "A second new Thanksgiving tradition could be house decorations . Yes, it would be a pain in the butt to decorate your house for Halloween, Christmas, AND Thanksgiving, three months in a row. But there are some ambitious home-decorators out there. And there are probably lots of people who would like to do house decorations, but who don’t want to do the spooky Halloween theme, and for whom Christmas is too religious. Thanksgiving decorations could be a way to accommodate that group, and raise the percentage of homes in any given neighborhood that have decorations at the end of the year.\n\nWhat would Thanksgiving decorations be? Fall colors and pumpkins and such are obvious, but I think we need something more. One idea is to do creative illumination, like the “illumination” you see in Japan around the wintertime."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!u9Ex!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F30e27284-6fce-4df5-8272-1c9bfe163219_936x624.jpeg", "alt": ""}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!1uXG!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F3da2904b-2513-4176-a605-3ee81ccc0aa6_960x640.jpeg", "alt": ""}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!2K2X!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc0176e95-1748-4293-b28f-618eaac8d83c_960x720.jpeg", "alt": ""}, {"type": "text", "content": "These are public displays, obviously, but Americans have always done this kind of thing with their individual houses. Thanksgiving could be an opportunity for people to show off their creative lighting skills, without being bound to the themes of Halloween and Christmas. Also, you could leave Thanksgiving lights up until after New Year’s, making them longer-lasting than either Halloween or Christmas lights.\n\nSo there are two ideas — both vaguely Japan-inspired — for adding new traditions to Thanksgiving. But what about the big existing tradition?\n\nLet’s talk about Thanksgiving dinner. Lots of people love turkey and stuffing and cranberries and the rest of the traditional Thanksgiving foods, but to me they feel a little dated. I’m sure they constituted an absolute feast back in the late 1800s, but today they feel a little like those polygonal graphics from 1990s video games — “good for the time”."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!HNfh!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc0ef5b42-410f-4cd7-ac1b-f3f4c3282577_985x687.jpeg", "alt": ""}, {"type": "text", "content": "There’s nothing wrong with roast turkey, but it can be a little dry and gamey, even if you baste it correctly. Cranberries are not necessarily the yummiest fruit out there. Stuffing is fine, I like bread, but it takes a skilled chef to make it taste like more than just “bread”. It’s not that Thanksgiving dinner is bad; it’s that I feel like for the most important “dinner” holiday of the year, we should have a dinner that stands out a little more in the modern age of globalized ingredient supply chains.\n\nNow before you get mad at me, I know that lots of people love the traditional Thanksgiving meal, and I am absolutely not suggesting that anyone be pressured to change it if they don’t want to. Instead, I think our country should come up with variants on the traditional meal — specifically, ethnic variants, mixing in elements from various countries’ cuisines."}, {"type": "text", "content": "In fact, this is already starting to happen. Gochujang cranberry sauce is starting to become a thing. So are some other international ingredients :\n\nFrom gochujang Brussels sprouts to harissa honey-glazed carrots , food trend experts and chefs are expecting your traditional Thanksgiving meal to be spicier…With younger generations hosting Friendsgiving…people aren’t necessarily giving up traditional dishes, but they’re changing them. People are starting to mix recipes and add flavors like gochujang, chili crisp, miso and harissa into Thanksgiving must-haves like turkey and green bean casserole…\n\nDifferent cultures are adding to the changes in these dishes, according to Rowena Scherer, a chef, author of the cookbook \"A Taste of The World: Celebrating Global Flavors\" (The Collective Book Studio, 2024) and founder and CEO of global cooking-kit brand eat2explore . You might see gochujang, chili crisp, miso and harissa show up in glazes, butters and dressings, while dumplings, empanadas and spring rolls might be part of an appetizer…"}, {"type": "text", "content": "\"The turkey isn't going anywhere, but it's getting a makeover with a spice rub, a citrus-chili marinade or a chimichurri on the side. The pumpkin pie stays, maybe next to a tres leches or a mochi dessert,\" said Scherer.\n\nHere’s a tweet I recently saw that made me actually crave a Thanksgiving dinner for the first time in many years:\n\nPartly, this just mirrors the worldwide trend in restaurant food that you see with New American bistros and creative izakayas in Japan — as supply chains have globalized and international ingredients have become cheap and accessible, people are experimenting with novel combinations.\n\nBut for Thanksgiving specifically, I think there’s something more here. Thanksgiving is a purely American holiday (though Canada has its own version). What does it celebrate? It’s more than just a harvest festival. It’s traditionally a time of giving thanks, but as a nation, what are we giving thanks for?"}, {"type": "text", "content": "The answer is that we’re giving thanks for being in America . The typical Thanksgiving story is about the founding of the Plymouth colony in Massachusetts, often involving cooperation with local Native American tribes. The Plymouth settlers were not technically immigrants — there was no official jurisdiction that invited them in — but the idea of newcomers from distant lands being welcomed to American shores by the existing inhabitants is clearly a tale about immigration .\n\nImmigration is central to America’s story of who we are as a nation. An overwhelming majority of Americans — including 77% of Republicans — agree that the U.S. is a “nation of immigrants”. In a 2024 poll , immigration came in third in a list of things Americans want to commemorate with new monuments, right after patriotism and community service."}, {"type": "text", "content": "Commemorating the fact that we’re all here, sharing this nation and this land, seems like the perfect purpose for this quintessentially American national holiday. And as such, why should we not create variants of the traditional Thanksgiving dinner that reflect both native North American ingredients and others brought from around the world?\n\nLet’s have Mexican Thanksgiving dinner, Korean Thanksgiving dinner, Indian Thanksgiving dinner. Let’s have celebrity chefs vie to create the most iconic versions of these variants. Let’s have mixed Thanksgiving dinners made from foods from all of these places — just as our culture is a mixed one, made up of ingredients from all over the world. The purpose isn’t just to spice up the traditional turkey-and-stuffing meal, but to remind us that Thanksgiving is a holiday with a higher meaning than simply an opportunity to get together and eat."}, {"type": "text", "content": "This idea is about more than just adding traditions to Thanksgiving; it’s about giving America a second major holiday in which we celebrate our nation itself. On the Fourth of July, we celebrate the institutional founding of the United States, and hopefully the principles of that founding as well. But I think we need a holiday where we celebrate the people that make up our country. We are a composite people, gathered from all corners of the Earth, and we should have a day where we come together and give thanks that somehow, we all landed here together in this great cooperative enterprise. 3\n\nBut in any case, whether you like this idea or not, and however you happen to celebrate Thanksgiving, I hope you have a great one. I’m thankful for all of you, my excellent readers, and I’m looking forward to the next year of blogging for you. Happy holidays!"}, {"type": "text", "content": "Subscribe now\n\nShare\n\nExcept for pecan pie, for some reason. And lemon meringue pie and cherry pie.\n\nTraditionally, women bring chocolates for coworkers on Valentine’s, and men bring marshmallows, white chocolate, or flowers on White Day. In recent years, though, both holidays feature more general snack-giving by both genders, to a broader range of recipients.\n\nObviously, there will be some people who oppose that expansion of Thanksgiving’s meaning, for political reasons. Rightists will object strongly to the notion that America is a nation of immigrants, preferring their (deeply unpopular) view that the nation is based on European DNA alone. Leftists will object strongly to the notion that the nation should be celebrated at all, as they view America’s very existence as rooted in genocide and imperialism. As usual, I urge everyone to ignore the views of both rightists and leftists."}], "text_post": false}, {"id": "bbbcdcbb9f1e3857", "title": "Why Becoming Comes Before Time | Andrew M. Davis", "url": "https://www.youtube.com/watch?v=LrK3v0rQDXo", "source": "Closer to Truth", "tag": "philosophy", "published_at": "2026-11-25T17:30:02+00:00", "panels": [{"type": "snippet", "content": "*What if time does not exist before events, but emerges because events happen?*\n\nAndrew M. Davis explains Alfred North Whitehead's view that becoming is more fundamental than measurable time. In this process-based account of reality, the past is settled, the future remains genuinely open, and temporal order emerges through the relationships among events.\n\n0:00 Why Becoming Is More Fundamental Than Time\n2:48 Time as an Outgrowth of Becoming\n4:28 Einstein, Spacetime, and the Interaction of Events\n6:21 Experience as Exemplification, Not Exception\n\n*Andrew M. Davis* is a philosopher, theologian, a", "read_more_url": "https://www.youtube.com/watch?v=LrK3v0rQDXo", "read_more_source": "Closer to Truth"}], "text_post": false}, {"id": "84260ab465fa1f01", "title": "Nvidia release new graphics card driver, hopefully finally fixing that SSD-hammering unnecessary write bug the previous hotfix couldn't seem to sort", "url": "https://www.rockpapershotgun.com/nvidia-release-new-graphics-card-driver-hopefully-finally-fixing-that-ssd-hammering-unnecessary-write-bug-the-previous-hotfix-couldnt-seem-to-sort", "source": "Rock Paper Shotgun", "tag": "fun", "published_at": "2026-11-25T17:24:30+00:00", "panels": [{"type": "snippet", "content": "Nvidia may have finally released a proper cure for their last graphics driver, 621.24, reportedly writing unneccesarily vast amounts of data to some users' SSDs. A hotfix late last week seemed to have made things better, but not fixed everything. Here's hoping driver 621.40 has managed to totally rectify things. Read more", "read_more_url": "https://www.rockpapershotgun.com/nvidia-release-new-graphics-card-driver-hopefully-finally-fixing-that-ssd-hammering-unnecessary-write-bug-the-previous-hotfix-couldnt-seem-to-sort", "read_more_source": "Rock Paper Shotgun"}], "text_post": false}, {"id": "2409284f03994136", "title": "US authorizes SpaceX to deploy 1M satellites for data centers in space", "url": "https://www.reuters.com/business/media-telecom/us-authorizes-spacex-deploy-1-million-satellites-data-centers-space-2026-11-25/", "source": "Hacker News", "tag": "engineering", "published_at": "2026-11-25T17:22:07+00:00", "panels": [{"type": "text_post", "content": "39 points, 25 comments"}], "text_post": true}, {"id": "64536c93463ad6be", "title": "Company of Heroes 3: Operation Torch review - moments of barely held-together chaos squandered by mechanical scripting", "url": "https://www.rockpapershotgun.com/company-of-heroes-3-operation-torch-review", "source": "Rock Paper Shotgun", "tag": "fun", "published_at": "2026-11-25T17:00:50+00:00", "panels": [{"type": "snippet", "content": "After waiting three years for Relic to expand Company of Heroes 3 's singleplayer, watching DLC after DLC focused on expanding the roster of units available in multiplayer matches, Operation Torch looks like a welcome addition. It's a new 15-mission campaign set in North Africa. following two US officers as they try to break the German Afrika Korps' hold on the region. Having played through the whole thing, I really want to say it's been worth the wait. Unfortunately, it's not so straightforward as that. Read more", "read_more_url": "https://www.rockpapershotgun.com/company-of-heroes-3-operation-torch-review", "read_more_source": "Rock Paper Shotgun"}], "text_post": false}, {"id": "77ef030b78411edc", "title": "Yes, I’m a proud prepper.", "url": "https://www.readtangle.com/yes-im-a-proud-prepper/", "source": "Tangle", "tag": "news", "published_at": "2026-11-25T16:53:00+00:00", "panels": [{"type": "image", "src": "https://storage.ghost.io/c/4a/93/4a939b47-6a19-4b38-a13c-89d5a0f0d6dd/content/images/2026/11/Website-image.png", "alt": "Yes, I’m a proud prepper."}, {"type": "text", "content": "I’m Isaac Saul and this is my semi-regular newsletter, A Grain of Saul , where I write about the political and cultural issues we don’t get to in the Tangle newsletter. Heads up: We’re off until Monday for Thanksgiving. Enjoy your holiday!\n\nMy wife and I were on a date last week when she asked me, in a serious tone, “Are you really worried about all this stuff or is it just a bit?”\n\nShe was referring to my recent coming-out as a proud prepper. My answer to her was honest: I’m having a little bit of fun, but I do genuinely want to be prepared for a worst-case scenario.\n\nFor the last several years, I’ve been “prepping.” I’ve stockpiled supplies that you’d need in the event of a calamitous societal breakdown, joined a few forums for preppers, and read books about how to survive in various apocalyptic scenarios. I’ve done all this out of a mix of morbid curiosity and genuine worry."}, {"type": "text", "content": "For instance, I learned that one of the first things you should do in a major emergency is fill up a bathtub full of water to add to your water supply. I thought that was an interesting and clever tip. It was fun to learn. It made me curious for more. But also: I felt better knowing it, because I figured if anything really did happen, it’s the kind of thing I’d actually remember to do. So it quelled some of my worry.\n\nMy friends and family have teased me about these preparations for as long as I’ve been talking about them openly, usually with a condescending tone. “What are you preparing for? The zombie apocalypse?”\n\nI get it. It’s easy to make fun of people who prep, as if we’re all tinfoil hat-wearing, bunker-building lunatics who need therapy more than we need 30-day food provisions. But the truth is, plenty of realistic emergency scenarios are worth considering. Just look at the last few weeks of news . I don’t expect I could survive a nuclear holocaust, but I do think I will be better prepared than 99% of my neighbors for all manner of potential threats. Here are a few I’m genuinely worried about in New Jersey:"}, {"type": "text", "content": "All of these, of course, are interconnected: A massive solar storm the likes of which we’ve never experienced could cause a regional or national grid collapse, which could then cause an economic collapse. Whether these events are brought on by artificial intelligence, foreign adversaries, or acts of God matters less to me than the reality that they are possible.\n\nMy prepper video.\n\nNow, do I think that any single one of these events is particularly likely, or likely to be disruptive enough to daily life that I’d need provisions? No, not really. Do I think that, collectively, there’s something like a 1-in-1,000 chance of something really bad happening in my lifetime? Yes, actually. Do I think it’s worth a little bit of work to prepare to protect myself and my family from a 1-in-1,000 chance of a calamitous, life-altering event?"}, {"type": "text", "content": "I do.\n\nFor some comparative risk assessment, think about it this way: The National Safety Council estimates you have about a 1-in-101 chance of dying in a car accident in your lifetime. That’s a terrifyingly high number — by far the riskiest behavior most Americans regularly participate in — and it’s why a lot of people wear seatbelts and don’t like being in a car with reckless drivers. Your odds of dying from sunstroke at some point in your life are about 1 in 3,740. So you stay hydrated and wear sunscreen when exerting yourself in the heat. Tens of millions of people participate in recreational boating each year, yet only about 600 deaths are attributed annually to boating. And only 75% of those deaths are drownings. Still, I usually wear a life jacket when I’m on a boat, and I definitely make sure my son does."}, {"type": "text", "content": "So: Even if one of the above apocalyptic scenarios has a 1-in-1,000 chance of coming to fruition, I actually think it’s a totally reasonable risk assessment to spend a little bit of time and money to be ready for it.\n\nWhat does “ready” actually entail? I thought you’d never ask. Let me give you a quick prepper crash course and share a bit about what I’ve done.\n\nLet's start with what your tier 1, 2, and 3 priorities should be in an emergency situation. We'll start with tier 1:"}], "text_post": false}, {"id": "4b23c8779327dad2", "title": "Paradox grand strategy Afterworld has a wasteland band mechanic that sounds worryingly like a continent-sized game of The Sims", "url": "https://www.rockpapershotgun.com/paradox-grand-strategy-afterworld-has-a-wasteland-band-mechanic-that-sounds-worryingly-like-a-continent-sized-game-of-the-sims", "source": "Rock Paper Shotgun", "tag": "fun", "published_at": "2026-11-25T16:42:00+00:00", "panels": [{"type": "snippet", "content": "Much like a huge dust cloud gradually resolving into an army of skull-painted bikers, Paradox's post-apocalyptic grand strategy game Afterworld continues to take shape in the course of developer blog posts. The latest Parablog digs into what I think is one of the game's most interesting aspects – you don't control one single unified civ. Instead, you amass a motley tribe by befriending, conquering, or otherwise assimilating a range of individual wasteland bands. Read more", "read_more_url": "https://www.rockpapershotgun.com/paradox-grand-strategy-afterworld-has-a-wasteland-band-mechanic-that-sounds-worryingly-like-a-continent-sized-game-of-the-sims", "read_more_source": "Rock Paper Shotgun"}], "text_post": false}, {"id": "ee39e7619418e42f", "title": "Is Jensen Huang Too Big to Fire?", "url": "https://www.readtangle.com/is-jensen-huang-too-big-to-fire/", "source": "Tangle", "tag": "news", "published_at": "2026-11-25T15:51:47+00:00", "panels": [{"type": "image", "src": "https://i.ytimg.com/vi/ACyKNh-K8Uo/hqdefault.jpg", "alt": "Is Jensen Huang Too Big to Fire?"}, {"type": "text", "content": "Are Nvidia and his new-old CEO too big to fail?"}], "text_post": false}, {"id": "1ba6bcbad02a8ee3", "title": "Democrats Vow to Shield Smithsonian From Any Trump Overhaul", "url": "https://www.propublica.org/article/smithsonian-white-house-plans-pingree", "source": "ProPublica", "tag": "news", "published_at": "2026-11-25T15:00:00+00:00", "panels": [{"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/Subway-Reaction_maxHeight_3000_maxWidth_3000.jpg?w=1149", "alt": "A collage of photos of a subway commuter’s paper notes and open laptop with a document titled “Smithsonian Institution Renewal Plan,” and the exterior of the Smithsonian National Museum of American History."}, {"type": "text", "content": "A top congressional Democrat announced she will investigate the Trump White House’s potential overhaul of the leadership and curatorial decisions at the Smithsonian Institution, the independent agency that oversees 21 national museums.\n\nIn a letter sent on Tuesday to the Smithsonian’s Board of Regents, Rep. Chellie Pingree, D-Maine, cited ProPublica’s recent story on the draft plans by a White House staffer targeting one of the Smithsonian’s most prominent museums, calling the reporting “extremely concerning.”"}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/CLEAN_Smithsonian-subway_maxHeight_3000_maxWidth_3000-1.jpg?w=459&h=306&crop=1", "alt": ""}, {"type": "text", "content": "Pingree, who is slated to lead the subcommittee that controls the Smithsonian’s funding in the next Congress, said the plans revealed in the ProPublica story align with the administration’s broader efforts to interfere with the Smithsonian, which receives federal funding but is governed by a 17-person Board of Regents whose members include the chief justice of the United States, members of Congress, the vice president and private citizens.\n\nIn an interview with ProPublica, Pingree said that she intended her letter to put the Smithsonian governing board on notice that the incoming Democratic majority in Congress is monitoring the institution to make sure the board upholds its responsibility to keep the agency independent from political pressure."}, {"type": "text", "content": "“No White House employee riding on the Metro gets to design a plan for what future exhibits look like or gets to veto staffers or exhibits at the Smithsonian,” Pingree said. “That’s not how it works.”\n\nPingree told ProPublica that she plans to use her powers as chair in the next Congress to aggressively look into what she called the Trump administration’s meddling with the Smithsonian and to expose those efforts to the broader American public.\n\n“We fully intend to dig deeper than has been done in the past,” she said.\n\nPingree’s letter comes in response to ProPublica reporting on a 25-item list of possible changes that, taken together, would amount to an unprecedented attempt by the White House to control the content and personnel of the Smithsonian’s National Museum of American History, which attracts nearly 2 million people a year."}, {"type": "text", "content": "Those reforms include firing many of the museum’s top officials; rolling out a new permanent exhibit called “The Riches of Our Western Civilization Inheritance”; introducing new K-12 learning materials such as a “Founders-focused curriculum titled something like Architects of Liberty: The Heroic Journey of America’s Founders OR Profiles in Liberty: Washington and America’s Heroic Men of Courage”; and unveiling a new “Colossus Statue” of George Washington for the museum’s entrance.\n\nThe draft plans were visible on the laptop and in handwritten notes of a White House staffer who was riding a D.C.-area Metro train in late October. A nearby commuter took pictures of the materials and sent them to ProPublica reporters, who in turn verified the information. It’s unclear what kind of reception the plans have received inside the Trump White House. The staffer and White House did not respond to requests for comment for the story."}, {"type": "text", "content": "Also on Tuesday, Lonnie Bunch, the Smithsonian Institution’s outgoing leader, responded to ProPublica’s reporting in a message sent to employees. “The intended use of this list is unclear,” Bunch wrote in his letter . “What remains clear is that the Smithsonian is an independent institution with the responsibility and privilege to present accurate information to millions of visitors through our scholarship and educational programs.”\n\nPingree was not the only member of Congress who responded to ProPublica’s reporting with a pledge to defend the Smithsonian’s independence.\n\nSen. Alex Padilla, D-Calif., said on social media that if he becomes chair of the Senate Rules Committee — which has jurisdiction over the Smithsonian — in the next Congress, “we will protect it from Trump’s interference and overreach.”"}, {"type": "text", "content": "“The Smithsonian is NOT a federal agency, it is an independent, nonpartisan organization overseen by Congress – not the White House,” Padilla wrote .\n\nIncoming Congressman Fred Wellman, a Democrat elected this month to represent the suburbs of St. Louis, responded even more forcefully to ProPublica’s reporting on social media.\n\n“Over my dead body,” he wrote .\n\nThe post Democrats Vow to Shield Smithsonian From Any Trump Overhaul appeared first on ProPublica ."}], "text_post": false}, {"id": "104b5f9658be3ff9", "title": "Mini-Heap", "url": "https://dailynous.com/2026/11/25/mini-heap-740/", "source": "Daily Nous", "tag": "philosophy", "published_at": "2026-11-25T13:35:14+00:00", "panels": [{"type": "text", "content": "The latest links. . ."}, {"type": "image", "src": "https://dailynous.com/wp-content/uploads/2022/01/miniheap-7-darkmode-compatible-1024x622.png", "alt": ""}, {"type": "text", "content": "Mini-Heap posts usually appear when several new items accumulate in the Heap of Links , a collection of items from around the web that may be of interest to philosophers. The Heap of Links consists partly of suggestions from readers; if you find something online that you think would be of interest to the philosophical community, please send it in for consideration for the Heap. Thank you. Previous edition .\n\nThe post Mini-Heap appeared first on Daily Nous ."}], "text_post": false}, {"id": "0d990107490e56b9", "title": "The passing", "url": "https://aeon.co/videos/a-veterinarian-helps-cindy-say-goodbye-to-fiona-her-17-year-old-dog", "source": "Aeon", "tag": "philosophy", "published_at": "2026-11-25T11:01:00+00:00", "panels": [{"type": "snippet", "content": "With compassion and care, a veterinarian helps Cindy say a tender final goodbye to her beloved elderly dog, Fiona - by Aeon Video Watch on Aeon", "read_more_url": "https://aeon.co/videos/a-veterinarian-helps-cindy-say-goodbye-to-fiona-her-17-year-old-dog", "read_more_source": "Aeon"}], "text_post": false}, {"id": "f99c52c33fdf4511", "title": "Oregon Housing Leader Met With Officials Who Are Seeking Money for a Project Her Husband’s Employer Is Developing", "url": "https://www.propublica.org/article/oregon-housing-council-andrea-bell-joshua-crites", "source": "ProPublica", "tag": "news", "published_at": "2026-11-25T11:00:00+00:00", "panels": [{"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/updated-final-michelle-urra_maxHeight_3000_maxWidth_3000.jpg?w=1149", "alt": "An illustration shows the silhouettes of a woman speaking at a lectern near a ribbon and housing development, and a man looking at a clipboard while standing next to shovels and construction machinery. In the background are trees and mountains."}, {"type": "text", "content": "When Oregon’s Housing Stability Council met by Zoom in early October, the state’s top housing official told the oversight board that she wanted to address a story ProPublica published that morning .\n\nThe story revealed that the official, Andrea Bell, hadn’t clearly disclosed her husband’s work for a small consulting firm that helps housing authorities develop apartments, sometimes with money from Bell’s agency. Nor had she notified Gov. Tina Kotek about it, something Oregon law requires of a governor’s appointee when an actual or potential conflict arises.\n\nCouncil members, who award hundreds of millions of dollars in housing subsidies, affirmed their support for Bell, who told them she wanted to be clear: “None of the projects that are coming from the council impact my household income.”"}, {"type": "text", "content": "Newly obtained records, however, show a clear financial connection between the council’s decisions and her husband’s employer. The records also show that Bell was personally involved in meetings and internal discussions about state funding of a large apartment project, Aloha 209th, which her husband’s employer is helping to develop.\n\nBackers of the Aloha 209th project in Portland’s suburbs are seeking $17.5 million from the housing council, which receives funding recommendations from Bell’s agency.\n\nJH Brawner, the consulting firm that employs Bell’s husband, Joshua Crites, will earn a $2 million fee from the housing authority in Washington County if the transaction closes. If not, JH Brawner gets nothing."}, {"type": "text", "content": "A separate project outside Portland, the Park Place apartments in Clackamas County, already received money through Oregon’s housing agency. Five months after Oregon awarded $36 million to the project in May 2025, Clackamas County’s housing authority paid JH Brawner a $2.4 million consulting fee, the new records show.\n\nLike the Washington County contract, the one with Clackamas County says that if funding fell through for any reason and the project didn’t move forward, “no fee shall be due” to the firm.\n\nJH Brawner said Crites, the firm’s director of strategic initiatives, has not worked on the Aloha 209th project but was one of five staffers assigned to Park Place. JH Brawner pays employees, including Crites, a fixed salary that is not tied to any project closing, according to managing director Zak de Gorgue."}, {"type": "text", "content": "Bell, executive director of Oregon Housing and Community Services, said in a statement that she is “committed to transparency, accountability, and compliance with state law.”\n\n“At no point in my tenure as executive director have I used my position to influence or benefit myself or anyone related to me,” she said. “To be clear, I made no efforts to influence funding, and the Aloha 209 project has not received funding from OHCS and remains on the waitlist.”\n\nBell’s public agency sits in the middle of the state’s effort to combat a homelessness problem that is among the nation’s worst. Kotek, the governor, has made building more housing a pillar of her time in office. Oregon Housing and Community Services has distributed billions of state and federal dollars to subsidize the construction of apartments intended to have affordable rents."}, {"type": "text", "content": "Norman Williams, a law professor at Willamette University College of Law who teaches about government ethics, said Bell should have reported to the governor that she had a possible conflict and stayed out of any discussions about the projects her husband’s employer helped develop.\n\n“It may all be an innocent mistake on her part,” Williams said, “but she knows who her husband is working for and she doesn’t report that. It makes it look like she’s trying to conceal this.”\n\nDe Gorgue said in a statement that the Aloha 209th project is still in development and the company had “no knowledge of Andrea Bell taking any action to move the project forward, nor has JH Brawner & Company engaged in any advocacy to secure funding approval” from Bell’s agency. Funding applications were submitted by the local housing authorities, not by JH Brawner."}, {"type": "text", "content": "“We have no indication, nor any reason to believe, that any project on which we have consulted has been the beneficiary of inappropriate influence,” de Gorgue said.\n\nSeparately, he said Clackamas and Washington counties chose JH Brawner as a consultant years before the company hired Crites in 2023.\n\nCrites did not respond to an emailed request for comment.\n\nAfter ProPublica asked Bell about her husband’s employment in September, she amended three years of ethics disclosure forms, explicitly naming JH Brawner as his employer. (The one time her state filings alluded to Crites’ job before that was in 2025, with a misspelling: “Spouse serves in an advisory role for a developmen.” It showed only the company’s street address, misspelled, and not its name.)"}, {"type": "text", "content": "Bell also asked the Oregon Government Ethics Commission for a formal opinion about her potential conflict at the direction of Kotek’s staff. That evaluation was paused after the commission opened a preliminary review in response to a citizen complaint about her lack of disclosure. The preliminary review is ongoing.\n\nProPublica obtained the new details about Bell’s involvement through county contracts and emails to and from Bell, which were released under Oregon’s public records law. Bell’s agency initially said the emails would cost $612.50 to produce but eventually provided them for free. Washington County charged $364.25 for contracts, invoices and other documents.\n\nThough backers say the Aloha 209th housing development is ready to be built, it’s on a waitlist to receive money from the state. Its turn is not likely to come until at least late 2028. By then, local officials worry that the delay will jeopardize its other funding sources and the project may need an even larger subsidy."}, {"type": "text", "content": "ProPublica previously reported that Molly Rogers, head of the county housing agency seeking money for Aloha 209th, spoke publicly about contacting Bell and said the state agency director was receptive to talking further.\n\nThe new records contain Bell’s recollections of the phone conversation she had with Rogers. The same morning the two spoke, in June, Bell told another department official by email that Aloha 209th had “a unique dimension of urgency and angst” because it was one of the last projects funded by a 2018 voter-approved housing bond administered by the Portland area’s Metro regional government.\n\nNatasha Detweiler-Daby, who leads the state housing agency’s affordable rental housing division, responded to Bell that it could be “responsive and logical” to have lawmakers “add nuance” next year by dedicating some portion of funding for housing authority projects on Oregon’s waitlist. Detweiler-Daby did not respond to an email from ProPublica seeking comment."}, {"type": "text", "content": "Behind the Aloha 209th discussion was the way that Oregon awards its housing subsidies. Since 2024, Oregon has given the money on a first-come, first-served basis. When funding runs out, Bell’s agency places applications on a waitlist in the order received.\n\nBell spoke with Washington County officials about Aloha 209th during a 45-minute Zoom meeting in August, records show. Internal notes summarizing the conversation say that the county would send an updated report to the state agency to “inform movement of 209.” The summary said the groups involved would have a follow-up conversation about the project.\n\nBell went on to discuss the project with regional government officials in early September. About two weeks before the meeting, she emailed her deputy with two possible ways to get the project funded: a legislative “carve-out” or Metro consolidating its subsidies so it could fully pay for the project. “I want to do everything we can to help the metro projects be successful and the resources, like ours, are nearly depleted,” Bell wrote. She acknowledged that Metro might not find the solution appealing."}, {"type": "text", "content": "Bell told ProPublica that she met with Metro and Washington County at the other agencies’ request. She said her agency “does not have and is not pursuing a ‘legislative carve out’ for any project.”\n\n“My approach is to listen to partners’ concerns and explain our funding process,” she said in an email. “I have no role in deciding whether projects should receive funding as part of this process, and I do not advocate for individual projects. Characterizing these routine discussions and legitimate concerns as something improper fundamentally misrepresents their purpose and context.”\n\nA spokesperson for Washington County’s housing authority told ProPublica that Bell did not make any commitment to alter the prioritization of Aloha 209th. Another Washington County spokesperson said the August meeting with Bell was mainly focused on the housing authority’s desire for “clearer criteria” for how projects on the state’s waitlist get funded."}, {"type": "text", "content": "A Metro spokesperson said the regional agency requested the September meeting with a goal “for the two agencies to strengthen our working relationship and coordination.”\n\n“Metro does not, and did not, advocate for any specific project,” the spokesperson said. “We clearly indicated this at the meeting and in writing ahead of the meeting.” The agency has advocated for a group of remaining projects, including Aloha 209th, to get money so Metro can fulfill commitments made as part of its affordable housing bond, the spokesperson said.\n\nOregon’s Government Ethics Commission has until early December to complete its preliminary review of the complaint over Bell’s financial disclosure, which will help the agency decide whether to open a full investigation."}, {"type": "text", "content": "Bell said she will “continue to remain responsive to the Ethics Commission” as it completes its examination.\n\nKotek’s office, provided with a list of ProPublica’s latest findings, said in a statement that the governor “holds all agency leadership to consistent and high ethical standards” and that her office “is closely following” the ethics panel’s review.\n\nThe post Oregon Housing Leader Met With Officials Who Are Seeking Money for a Project Her Husband’s Employer Is Developing appeared first on ProPublica ."}], "text_post": false}, {"id": "e4828c4fc4693b35", "title": "Alone-together in Karachi", "url": "https://psyche.co/turning-points/the-streets-of-karachi-scared-me-less-than-home-did", "source": "Psyche", "tag": "philosophy", "published_at": "2026-11-25T11:00:00+00:00", "panels": [{"type": "snippet", "content": "Here, women pass from father to husband, like property. My friend and I rented our own apartment instead - by Sadia Khatri Read on Psyche", "read_more_url": "https://psyche.co/turning-points/the-streets-of-karachi-scared-me-less-than-home-did", "read_more_source": "Psyche"}], "text_post": false}, {"id": "8f37f63031ab4adc", "title": "Show HN: Cerulion – Harness for Robotics, Gemini 3.8 Flash Matches GPT-6 Astra", "url": "https://github.com/cerulion-inc/cerulion#harness-results", "source": "Hacker News", "tag": "engineering", "published_at": "2026-11-24T21:33:44+00:00", "panels": [{"type": "text_post", "content": "Hey HN! I&#x27;m Lakshay, and at Cerulion we cooked up a harness for physical AI. Built on top of our deterministic runtime, we now have MCP tools that let any LLM see and move a robot. It closes the loop with measurements so a model doesn&#x27;t try to guess its way through the task, and imbues common sense and robotics best practices into the workflow.<p>We ran the numbers on LIBERO-PRO and quite frankly are a bit shocked. Gemini 3.8 Flash with Cerulion solved 73 of 100 LIBERO-PRO tasks. GPT-6 Astra on a bare 3-tool baseline (arXiv:2610.30051) solved 71, at about 12x the cost and 3x the wall"}], "text_post": true}, {"id": "e75d0db0f21e2af4", "title": "Consciousness Is a Process, Not a Thing | Iain McGilchrist", "url": "https://www.youtube.com/watch?v=T4h0ImgDczo", "source": "Closer to Truth", "tag": "philosophy", "published_at": "2026-11-24T19:30:31+00:00", "panels": [{"type": "snippet", "content": "*What if consciousness is not something the brain produces, but something fundamental to reality itself?*\n\nNeuroscientist Iain McGilchrist describes consciousness as an evolving encounter rather than an isolated substance. He argues that science can investigate its relationship to brain activity but cannot reveal its intrinsic nature, because consciousness is already the foundation of scientific inquiry.\n\n0:00 Consciousness as a Process and Encounter\n1:18 Why Science Cannot Reveal Consciousness Itself\n2:57 Consciousness as the Ground of an Evolving Cosmos\n\n*Iain McGilchrist* is a psychiatrist,", "read_more_url": "https://www.youtube.com/watch?v=T4h0ImgDczo", "read_more_source": "Closer to Truth"}], "text_post": false}, {"id": "f4cb7f20cb100fee", "title": "Anthropic Drops", "url": "https://www.bloomberg.com/opinion/newsletters/2026-11-24/anthropic-drops", "source": "Money Stuff", "tag": "financial", "published_at": "2026-11-24T19:17:25+00:00", "panels": [{"type": "snippet", "content": "Also the SpaceX/Tesla exchange ratio, stablecoin freezing, Nvidia’s fresh new outsider CEO and space data centers.", "read_more_url": "https://www.bloomberg.com/opinion/newsletters/2026-11-24/anthropic-drops", "read_more_source": "Money Stuff"}], "text_post": false}, {"id": "985442c3544925bb", "title": "OmniAct: One Policy, One Million Embodiments", "url": "https://arxiv.org/abs/2611.33158v1", "source": "arXiv", "tag": "engineering", "published_at": "2026-11-24T18:59:58+00:00", "panels": [{"type": "snippet", "content": "A single policy that controls diverse robots must not only transfer task knowledge across embodiments, but also adapt its behavior to each robot's capabilities. Existing approaches facilitate transfer through shared action representations, but these representations do not necessarily capture how differences in robot morphology should shape manipulation strategies. We introduce OmniAct, a cross-embodiment manipulation policy that conditions directly on each robot's kinematics in a specific scene to produce embodiment-specific behavior. This kinematic graph represents the robot's joint positions", "read_more_url": "https://arxiv.org/abs/2611.33158v1", "read_more_source": "arXiv"}], "text_post": false}, {"id": "1fb7d3f7ca7b3f6b", "title": "PyRUA-Dex: Learning Programmatic Policies for Dexterous Bimanual Manipulation with Coding Agents", "url": "https://arxiv.org/abs/2611.33144v1", "source": "arXiv", "tag": "engineering", "published_at": "2026-11-24T18:56:44+00:00", "panels": [{"type": "snippet", "content": "Learning for dexterous manipulation is limited by the scarcity of high-quality demonstrations: retargeting from human video is imprecise, teleoperation gives no force feedback to the operator, and exoskeleton-based collection is hard to scale up. We present PyRUA-Dex, a framework that enables coding agents to develop dexterous manipulation through programmatic policy, without the need of demonstrations. The programmatic policy is developed in two stages: during exploration, multiple agents explore in parallel for task skills and ways to compose them, and a distilling agent condenses the succes", "read_more_url": "https://arxiv.org/abs/2611.33144v1", "read_more_source": "arXiv"}], "text_post": false}, {"id": "fe44bbec6da8fd4f", "title": "ROAM-Bench: Evaluating Embodied Active Spatial Intelligence through Evidence Verification", "url": "https://arxiv.org/abs/2611.33143v1", "source": "arXiv", "tag": "engineering", "published_at": "2026-11-24T18:56:22+00:00", "panels": [{"type": "snippet", "content": "Embodied spatial intelligence requires agents to gather information through exploration and interaction, then use it to reason and act. Existing benchmarks insufficiently distinguish correct outcomes from completion of these task requirements. We introduce ROAM-Bench to evaluate these abilities under robot motion and collision constraints. Independent checks use simulation state and episode records to assess outcomes and task requirements, with stronger checks of geometry, coverage, or placement. It comprises 250 manually validated tasks across 11 types in five groups and 27 indoor environment", "read_more_url": "https://arxiv.org/abs/2611.33143v1", "read_more_source": "arXiv"}], "text_post": false}, {"id": "ffc2594aa772e2d5", "title": "A Game for Teaching Ancient Philosophy", "url": "https://dailynous.com/2026/11/24/a-game-for-teaching-ancient-philosophy/", "source": "Daily Nous", "tag": "philosophy", "published_at": "2026-11-24T17:23:59+00:00", "panels": [{"type": "text", "content": "Javier Hidalgo , a philosopher at the University of Richmond, has developed a classroom simulation game to teach about different ancient philosophies called “Ancient Philosophy as a Way of Life.”"}, {"type": "image", "src": "https://dailynous.com/wp-content/uploads/2026/11/ancient-philosophy-game-1024x706.png", "alt": ""}, {"type": "text", "content": "Generously, Professor Hidalgo has created a website to share the game with anyone who may wish to try it out in their own courses.\n\nHe writes:\n\nAncient Philosophy as a Way of Life is a free classroom role-playing game that introduces students to Hellenistic philosophy, plus a bit of Buddhist philosophy.\n\nThe game is set around 150 BCE at the court of Menander, a king who ruled a Hellenistic kingdom that included part of the Indian subcontinent. Four delegations of philosophers (Stoics, Epicureans, Buddhists, and Skeptics) arrive at court, each claiming to offer the best way of life. Some students play the philosophers, while others play members of the court, each of whom faces a personal dilemma and must decide which philosophical school to join. The philosophers present their views, lead the court through a brief philosophical exercise, and offer advice on the court members’ dilemmas. At the end, the court members announce their allegiances and the king awards royal patronage."}, {"type": "text", "content": "There is no predetermined winner: when I ran the game in two sections of my ethics course, different philosophical factions won. Students engaged in sustained debate about the merits of the different schools and also seemed to have fun with the game.\n\nThe game takes two class sessions, one for preparation and one for play, although a third session might be useful for larger or more talkative classes. It works for classes of 7 to 30 students and assumes no background in philosophy. The goal of the game is for students to encounter these philosophies as live options rather than merely as historical doctrines. Students have to understand a view well enough to defend it against objections, apply it to concrete problems, and experiment with its practices."}, {"type": "text", "content": "The game is inspired by Reacting to the Past games (which I love!) but is shorter than a standard Reacting game and is designed to emphasize philosophical debate in particular. The website has everything an instructor needs to run the game: a student gamebook, an instructor’s manual, faction handouts, role sheets, dilemma cards, and ballots. All materials are free to download.\n\nCheck it out. Professor Hidalgo adds, “The game is still in development and I would welcome feedback from anyone who tries it.”\n\nThe post A Game for Teaching Ancient Philosophy appeared first on Daily Nous ."}], "text_post": false}, {"id": "f5d6a2c358537d8b", "title": "Jensen Huang returns to Nvidia.", "url": "https://www.readtangle.com/jensen-huang-returns-to-nvidia/", "source": "Tangle", "tag": "news", "published_at": "2026-11-24T16:50:57+00:00", "panels": [{"type": "image", "src": "https://storage.ghost.io/c/4a/93/4a939b47-6a19-4b38-a13c-89d5a0f0d6dd/content/images/2026/11/HuangTrump.png", "alt": "Jensen Huang returns to Nvidia."}, {"type": "text", "content": "Hello, and welcome to Tangle. I’m Senior Editor Will Kaback . I was midway through editing yesterday’s edition on the measles outbreaks when my computer began to light up with notifications. First it was texts, the little red unread-message bubble jumping from 1 to 5 to 10 to 100 within minutes. Then, it was Tangle’s Slack. “WTF,” read one message. “STOP,” read another. Then, it was my Twitter feed, a rapidly refreshing repository of shocked reactions.\n\nJensen Huang was back.\n\nToday, we tackle the Nvidia CEO’s return , President Trump’s role in the reinstatement, and what it all means for our country and society.\n\nAfterward, exclusive results from a post-midterm poll conducted on behalf of Tangle (and with direct input from the Tangle community). We’ll close with a feel-good food story to send us into Thanksgiving break."}, {"type": "text", "content": "It’s a 13-minute read .\n\nIsaac Saul, Audrey Moorehead, Carina Pacheco, Russell Nystrom, Isaac Wood, and Bailey Saul edited or contributed to today’s newsletter."}, {"type": "image", "src": "https://storage.ghost.io/c/4a/93/4a939b47-6a19-4b38-a13c-89d5a0f0d6dd/content/images/2026/11/Megaphone--2-.png", "alt": "Jensen Huang returns to Nvidia."}, {"type": "image", "src": "https://storage.ghost.io/c/4a/93/4a939b47-6a19-4b38-a13c-89d5a0f0d6dd/content/images/2026/11/Holiday-Image-1.png", "alt": "Jensen Huang returns to Nvidia."}, {"type": "text", "content": "The stocking stuffer they’ll actually use! 🎁\n\nEver hit 1% on your phone because you left that bulky, brick-sized charger at home? We’ve all felt that panic. Once your phone dies, there goes your Uber, your GPS, your camera, and that important call.\n\nSo we thought, what good is a charger if you leave it at home? Which is why we developed the Ultra-thin Wireless ChargeCard . At just 0.3 inches thick, it fits in the bill compartment of many wallets. When your battery runs low, just attach it to your phone. No cables needed.\n\nIt works with iPhone 12–18 and Android phones that support wireless charging. Its 5,000 mAh battery delivers up to a full 100% charge.\n\nHow often do you find a gift this useful for everyone?"}, {"type": "text", "content": "Tangle readers get 40% off with code TANGLE40 .\n\nShop AquaVault and give the gift of staying charged!\n\nJensen Huang’s reinstatement. On Monday, Nvidia announced that it had reinstated Jensen Huang as president and CEO, effective immediately. The company’s board of directors said it had voted unanimously to bring Huang back following a series of meetings over the weekend. The board also said it had received input from “senior levels of the U.S. government,” and President Donald Trump told CNBC that he had spoken directly to the board ahead of its decision.\n\nBack up: Huang resigned in mid-November amid reports that he had multiple extramarital relationships, including with Alice Huang (no relation), a former executive of the Singaporean cloud computing company Megaspeed suspected of ties to the Chinese government. Megaspeed has been under investigation since 2024 for potential violations of U.S. export controls on semiconductor chip sales, and on Monday, the Trump administration added Megaspeed to its trade blacklist."}, {"type": "text", "content": "Senior figures in the Trump administration — including the president — expressed support for Huang and suggested he could return to Nvidia; on Monday, Trump told CNBC he “convinced them” to change course. The board’s statement on the decision said it had been assured that reinstating Huang would not pose a national security risk.\n\nFollowing the announcement, Nvidia’s stock rose 31%, recovering most of a decline that began after Huang’s confirmation of the extramarital affair on November 8. President Trump praised the decision on Truth Social, writing , “The Country needs Jensen’s leadership at NVIDIA in order to ensure the Success and Prosperity of not only the Company, but the American Economy.”"}, {"type": "text", "content": "Republican and Democratic lawmakers alike questioned the board’s decision and expressed concerns about the Trump administration’s involvement, with some suggesting that Congress would investigate the matter further. Sen. Rick Scott (R-FL) said , “This looks terrible on its face, and it drives home the need for Congress to be informed on the full impact of Jensen Huang’s actions on our national security and economy.” Sen. Ruben Gallego (D-AZ) wrote , “We need to investigate what stock positions took place before the announcement. This White House is the most corrupt in history.”\n\nBelow, you’ll hear views from the left and the right on Huang’s reinstatement. Then, Senior Editor Will Kaback gives his take."}, {"type": "text", "content": "In Bloomberg, Beth Kowitt argued “the Nvidia board just confirmed its own irrelevance.”\n\n“Bringing back Huang is a short-term fix that only calcifies the kinds of long-term problems the board has shown it doesn’t have the will or the competence to handle. And the flip-flopping only further undermines its own power and relevance. The most pressing problem is how the company plans to explain to employees why the rules apply to everyone but the CEO,” Kowitt wrote. “The board’s big solution now is starting a search for a chief compliance officer.\n\n“Somehow I highly doubt adding this new position is what finally reins in Huang. The board also said that its investigation into the foreign intelligence effort targeting Huang will be completed. I can only see that ending one way now, and that’s quietly clearing Huang; the board can hardly afford to oust him again,” Kowitt said. “None of this leads me to believe the board has shown it can temper Huang the second time around.”"}, {"type": "text", "content": "In The New York Times, Michelle Goldberg wrote about “billionaire impunity.”\n\n“We don’t yet know the impact of Jensen Huang’s Chinese entanglement on American national security, but he may have caused lasting damage. His removal from Nvidia, however, harmed something Donald Trump values even more: the stock market,” Goldberg said. “So Trump, never a fan of rich men facing consequences, launched a rescue mission. According to The Times, he dispatched JD Vance to help broker Huang’s restoration, including by offering Nvidia’s board assurances that Huang doesn’t pose a national security risk.”\n\n“Trump has now yoked the rest of his presidency, as well as Vance’s political future, to Jensen Huang,” Goldberg wrote. “However this scandal develops, Trump has demonstrated that his administration’s culture of impunity, as well as his alliance with tech oligarchs, remains intact despite the repudiation of the midterms.”"}, {"type": "text", "content": "In The Boston Globe, Gary Marcus suggested “the questions are just beginning.”\n\n“The first big question is whether the market gains are sustainable, and where this whole Huang affair… leaves the generative AI boom/bubble,” Marcus said. “Fans of generative AI will point to the fact that Nvidia rose 31% today; cynics might note that the stock is still 32.2% below its peak of $243.37 earlier this year, and even with Huang’s return is overall down 21.8% over the past month. The boom was already starting to cool before Huang’s scandals broke.”\n\n“Let’s be honest: Most stocks in that industry have already taken a giant haircut since the heady days of June,” Marcus wrote. “The Huang that has returned is not the Huang we once knew, and the Nvidia we have now is not the Nvidia we once had. The old Huang was universally treated as a hero, viewed largely without suspicion, and given very little serious media scrutiny; the new Huang is a man who was pushed out for a lack of candor and who is now under a public microscope.”"}, {"type": "text", "content": "The Washington Post editorial board asked “why is Trump picking [Nvidia’s] CEO?”\n\n“President Donald Trump personally pressed Nvidia’s board to bring Huang back, calling into its meeting Sunday night,” the board wrote. “Maybe Nvidia’s board made the right call, but this is not how free markets are supposed to work… A president worried about falling stock prices shouldn’t respond by rearranging the management team of one of America’s most valuable companies.”\n\n“Huang’s extraordinary resurrection will inevitably teach Silicon Valley something about power. The wrong lesson would be that executives need more intertwined relationships with Washington,” the board said. “Healthy capitalism depends on companies succeeding because they satisfy customers and investors, not because their executives curry the president’s favor. Huang might be indispensable, but that’s for Nvidia to decide.”"}, {"type": "text", "content": "In The Wall Street Journal, Vinay Nair suggested “fast-moving companies should lock in guardrails.”\n\n“The board may have been right; no board can wave away a national-security inquiry into its chief executive. But the timeline followed the headlines, not the findings,” Nair wrote. “Boards today are increasingly quick to oust founders when scandals arise, mostly out of self-preservation… In a crisis, a director’s safest move can become whatever decision ends the exposure fastest, not whatever creates the most shareholder value.”\n\n“Nvidia’s next chapter will be shaped by the controls adopted in this crisis. Mr. Huang may not like all the rules he finds as he returns. But he should ask for something in exchange: a durable agreement with the board about the process by which he can be removed,” Nair said. “The lesson of Nvidia’s past two weeks isn’t that founders should be untouchable, or that boards should defer to them indefinitely. It is that a founder who wants the freedom to make handshakes worth billions should also want the protection to keep making them.”"}, {"type": "text", "content": "In Fox News, Rebecca Grant said Huang’s reinstatement “sends China a clear message.”\n\n“Huang’s return is a loud and clear message to China. The fight is on for the U.S. AI tech stack to prevail, not only in quality, but by winning dominant global market share,” Grant wrote. “Huang famously wanted to fight to keep selling mid-level Nvidia chips in China as well as globally. That is why, in part, the Commerce Department’s Bureau of Industry and Security opened up [a] review of export licenses [for Nvidia chips]... That’s over.”\n\n“It’s what comes next that makes Huang’s return important,” Grant said. “Talk to any of the Magnificent 7, and the strategy is basically the same for all the top tech companies. Their global business denies sales to China and generates cash for more investment in the AI ecosystem… Be it chips or data centers or other elements of the tech stack, we can’t just build in America and leave the rest of the globe to China. Huang understands that.”"}, {"type": "image", "src": "https://storage.ghost.io/c/4a/93/4a939b47-6a19-4b38-a13c-89d5a0f0d6dd/content/images/2025/05/Will-Square.jpg", "alt": "Jensen Huang returns to Nvidia."}, {"type": "text", "content": "I say this without judgment: Whether you support or oppose Jensen Huang’s reinstatement is a question of what kind of society you want to live in. That might sound dramatic, but as we stare down a future of AI-driven uncertainty, how we answer that question in moments like this will prove crucial to where we end up.\n\nThe good-faith case for reinstatement is a kind of utilitarian, we-don’t-like-it-but-we-have-to-do-it bargain that asserts Huang’s value to the United States outweighs his very human shortcomings. In this view, stabilizing one of America’s most important companies (and, by proxy, the economy) takes priority. Huang led Nvidia to Olympus-like heights, which confers a demigod-like status. Yes, it’s an ugly and uncomfortable situation, but imagine how much uglier and more uncomfortable it could get if
