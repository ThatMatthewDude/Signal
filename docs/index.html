Nvidia tumbles from the mountain with the U.S. economy strapped to its back."}, {"type": "text", "content": "It’s tempting to fixate on wealthy tech leaders’ gloating in response to yesterday’s news, but remember that for millions of others, Huang’s return comes as an enormous relief. Nvidia stock fell sharply as it became clear Huang would either resign or be forced out, wiping out trillions in its market capitalization. It was a financial shock that threatened to devolve further this week and beyond, and Huang’s return instantly reversed most of the sell-off.\n\nWho am I to say the Nvidia board should have prioritized the moral high ground when so much is at stake for so many people? I don’t own any Nvidia stock and never have, nor do I have any dependents. If Nvidia fell apart and the U.S. entered a recession tomorrow, it’d cause me personal strain, but I wouldn’t have to worry about putting food on the table for my kids or making a mortgage payment or covering healthcare costs for an ailing parent. Those real-world considerations change the calculus. We don’t know that Huang’s permanent departure would have led to disaster, but considering the warning signs across the economy that predated his short-lived resignation, it’s plausible. Bringing him back now mitigates this risk."}, {"type": "text", "content": "That’s one path for society: Do what’s best for the country’s economic (and technological) prospects, and accept that stability and prosperity sometimes require messy decisions and imperfect actors.\n\nThe second path adheres to a variation of Alexis de Tocqueville’s self-interest rightly understood . It does not welcome an economic downturn, but it holds that excusing serious misbehavior for short-term gain will only weaken society in the long run. If reports of Huang’s multiple affairs, including one with a direct report, prove true, he violated the most basic standards of corporate conduct. Worse, his affair with Alice Huang, the former Megaspeed executive reportedly suspected of spying for Beijing, may have created a major national security risk. When asked about that relationship, Jensen Huang reportedly misled Nvidia's general counsel — the same executive who had intervened in a Commerce Department investigation into whether Megaspeed evaded U.S. export controls. That could be a coincidence, but it raises important questions about what Huang may have known or said at the time. Bringing him back in a desperate attempt to right the ship does not calm the tumultuous waters he steered them into."}, {"type": "text", "content": "Worse still is the message sent to the world: Amass enough power and influential allies, and the rules cease applying to you. As Editor-at-Large Kmele Foster wrote last week, “Returning [Huang] to the job without severe sanctions would tell every employee at Nvidia, and every executive watching from elsewhere, that candor with your board is optional if you’re valuable enough.” The effect of this message isn’t as instantaneous as a stock market dip, but it’s far more damaging over time — further erosion of trust in institutions, laws, and norms. Whatever pain Huang’s exile might cause right now, it’s a necessary price to avoid that much darker future.\n\nBoth camps profess their interest in the long-term flourishing of the United States, but believe in very different paths to get there. I personally want to live in the second society, but I don’t judge those who land on the other side. I don’t see a way in which a society that willingly excuses the actions of a man like Jensen Huang, pins its prospects on one man and one company, and fails to consider any alternate course is one that can thrive. Still, I know it is much easier to take a principled stance before it requires any sacrifice."}, {"type": "text", "content": "Nvidia’s decision to bring back Huang makes me even more uncomfortable when I consider the Trump administration’s role.\n\nBy all accounts , President Trump — with the urging of major tech CEOs — campaigned to reinstate Huang. The president said as much in interviews after the announcement while he repeatedly extolled Huang’s singular value to the country. The possibility that Huang’s affair with Alice Huang imperiled U.S. national security doesn’t bother the president. “The United States Government has no reason to believe that Jensen’s return to NVIDIA poses any risk to National Security,” he wrote on Truth Social. In fact, Trump suggested that the reinstatement actually enhanced national security, since Huang might have gone to work for a Chinese company out of spite."}, {"type": "text", "content": "In effect, the president took it upon himself to intervene in a public company’s affairs and override its board’s judgment. His action injects the executive branch into corporate governance in a way I’m not sure we can reverse, particularly as Trump leaves the door open to future interventions. We now have at least one company that the government has unilaterally determined is too important to leave to its board of directors or shareholders; I think the sugar high of this extraordinary move will soon give way to nausea as we grapple with a further redefined relationship between government and industry.\n\nWhile I don’t know whether the Trump administration will face consequences for this decision, the tenor of the response — particularly from the right — is different from past controversies. Some, like The Dispatch’s Nick Catoggio, are confident that this is “the one,” the scandal that takes down the president after so many false starts in years past. Catoggio is a long-time Trump critic, but Charles Gasparino isn’t, and he’s singing a very similar tune. “There are scandals and there are scandals,” he wrote on X . “This [Nvidia] drama is something where the stuff connects. It would be a huge mistake for the GOP to follow Trump down this rabbit hole.”"}, {"type": "text", "content": "Catoggio and Gasparino have good reason to think so. Since Huang’s initial ouster, journalists at The New York Times and Wall Street Journal have uncovered damning details about Nvidia’s suspect business practices and Huang’s personal role in helping China access Nvidia chips’ compute power. I’m confident that more stories like this are coming, and each one will add new layers of scrutiny to everyone involved in bringing back Huang.\n\nAnother sign the ground is shifting beneath our (and Trump’s) feet: Republican lawmakers’ response. Sens. Tom Cotton (AR) , John Curtis (UT) , Rick Scott (FL) , and Kevin Cramer (ND) are just some of the prominent GOP elected officials who have publicly spoken out against the administration’s pressure campaign to reinstate Huang. Democrats just won overwhelming majorities in Congress in a direct rebuke of Trump’s second term, and Republicans are positioning themselves for a post-Trump future. The Nvidia saga may be a breaking point. We’re entering a period unlike any we’ve seen since Trump first won the presidency, and Democrats will use their power to publicly investigate every facet of Nvidia’s business and Trump’s role in reinstating Huang."}, {"type": "text", "content": "Will politically vulnerable Republican lawmakers stand by the president as the vise tightens? Will Scott Bessent ? Will Marco Rubio ?\n\nMore importantly, what should the coming hearings and investigations focus on? Personally, I’m interested in a few key questions. How did the Trump administration so quickly reach its determination that Huang posed no national security risk? What information has the U.S. intelligence community collected on Alice Huang and her ties to the Chinese government? What did Jensen Huang know about illicit sales of Nvidia chips, particularly those facilitated by Megaspeed and Alice Huang? Why did Nvidia’s board reverse its decision so quickly and before a third-party investigation was complete? Did anyone in the Trump administration’s orbit — including the president, his family, and his business partners — stand to benefit from Jensen Huang’s reinstatement? I think answers to these questions are within reach with a Democratic-controlled Congress and an increasingly Trump-wary Republican minority."}, {"type": "text", "content": "For now, we wait. But the coming months will determine the bounds of executive power and, perhaps, the kind of society we want to live in.\n\nTake the survey: What role should a president play in private-sector decision making? Let us know .\n\nDisagree? That ’ s okay. Our opinion is just one of many. Write in and let us know why, and we ’ ll consider publishing your feedback.\n\nThe stocking stuffer they’ll actually use! 🎁\n\nGive everyone on your list a gift they’ll actually use! The AquaVault ChargeCard makes staying charged and connected on the go easier than ever. Small enough to fit in a stocking, practical enough for everyday use.\n\nTangle readers get 40% off with code TANGLE40 .\n\nShop AquaVault and give the gift of staying charged!"}, {"type": "text", "content": "In August’s edition of Press Pass , Isaac shared details about Tangle’s first-ever polling partnership. Since the start of last summer, we’ve worked with More in Common , a non-profit, non-partisan organization, to inform public polling on topics like polarization, partisanship, and societal divides. After publishing the initial results , we put out a call for Tangle readers to submit their own questions and selected several of them for a new round of polling this fall. Today, we’re excited to share the latest survey, which offers insights on the dividing lines in American politics after the midterms.\n\nOne question explores how people view the political priorities of those with different views. The results were striking:"}, {"type": "image", "src": "https://storage.ghost.io/c/4a/93/4a939b47-6a19-4b38-a13c-89d5a0f0d6dd/content/images/2026/11/data-src-image-15efc5fc-010c-48ff-b74d-51aad3b2947e.png", "alt": "Jensen Huang returns to Nvidia."}, {"type": "image", "src": "https://storage.ghost.io/c/4a/93/4a939b47-6a19-4b38-a13c-89d5a0f0d6dd/content/images/2026/11/data-src-image-abfaf9d2-f3aa-4a50-af35-a61bf0b67812.png", "alt": "Jensen Huang returns to Nvidia."}, {"type": "text", "content": "To see the full report, head over to our website .\n\nThen, submit a question for an upcoming poll!\n\nChef Maddy Goldberg started a private dining business in 2021, leaving every Tuesday free. Now, Goldberg cooks lunch for 100 people every Tuesday using whatever donations turn up at Toronto’s Fort York Food Bank. The ingredients are unpredictable, so she improvises; when a recent week offered little beyond onions, carrots, potatoes, eggs and milk, she turned a bag of raw red lentils into falafel-style fritters and served them with toasted pita. “I was struggling a lot when I was working in fine dining, and it stressed me out,” Goldberg said. “I wanted to do something where the goal wasn’t to make money off of it. It was just to feed people.” Good Good Good has the story ."}], "text_post": false}, {"id": "f0d4f35ee64a59ec", "title": "What the End of Anonymous Writing Means for Academia", "url": "https://dailynous.com/2026/11/24/what-the-end-of-anonymous-writing-means-for-academia/", "source": "Daily Nous", "tag": "philosophy", "published_at": "2026-11-24T11:00:00+00:00", "panels": [{"type": "text", "content": "A reader who asked to remain anonymous (seriously) pointed me to an article about the impending end of anonymous writing."}, {"type": "image", "src": "https://dailynous.com/wp-content/uploads/2026/11/wittgenstein-decoded-1024x686.png", "alt": ""}, {"type": "text", "content": "Large language models are getting increasingly good at identifying the authors of human-written text.  In a  preprint, “ Frontier models need only one text to unmask its human or AI author ,” a team of authors claim that:\n\nGiven a single text and a simple zero-shot prompt (no web access, tools, candidate lists, or writing samples), frontier models can answer “who wrote this?” at three increasingly specific levels: (1) whether an AI or human wrote it, (2) if an AI, which lab, and (3) if a human, often exactly who.\n\nThe authors asked LLMs to provide the identity of different kinds of often-anonymous writing, such as peer reviews and internet comments.\n\nTheir findings:\n\nThe best-performing model we test is Claude Fable 5.2, which names the reviewer of 56% of private peer reviews and the username behind 31% of recent Reddit comments."}, {"type": "text", "content": "It appears that your writing is more likely to be outed as yours if some previous writing of yours was in an LLM’s training data, or if you a lot of your writing is available online. And once a model becomes familiar with you, your writing is very likely to be identified as yours:\n\nEven when a text is brand new, a model can identify its writer from what it learned about them elsewhere; i.e., once that knowledge is in the weights, the writer cannot do anything about it. This leaves people with the largest public footprints, such as active social media users or established authors, permanently exposed, since paraphrasing the text does not completely remove the deanonymization risk. Moreover, the set of vulnerable writers expands as models improve… Maintaining anonymity is especially important for peer review. Our private lab review data comes from only six writers, but a study across thousands of private peer reviews is underway."}, {"type": "text", "content": "Having an AI disguise your writing style by paraphrasing your writing does diminish its recognizability somewhat, but not entirely, the researchers report.\n\nOne commenter on the paper, Kelsey Piper, writes , “We’re witnessing a total erosion of the ability to write anonymously online,” though “the process is still incomplete. Not everyone should consider themselves deanonymized yet. But the erosion is happening.”\n\nRegarding peer review, she writes:\n\n[T]he institution of anonymous peer review does not look like it will hold up any longer. The space of possible reviewers for a given academic article review in a particular discipline is pretty small; stylistic tics are sufficient to confidently distinguish between them."}, {"type": "text", "content": "Suppose the LLMs get quite a bit better at identifying the authors of anonymous text. What would that mean for the future of peer review? Well, while some reviewers have regularly opted to forgo anonymity, that is typically a privilege exercised by the relatively senior and secure members of the profession. I wouldn’t expect many more to join their ranks. Nor would I expect academia to be content relying on the forbearance of, say, curious authors or grant judges, to preserve anonymity.\n\nThere are alternatives to peer review . Will the erosion of anonymity push more branches of academia to embrace these alternatives?\n\nOr will it be a reason to use AIs even more in academia, say, as peer reviewers? After all, recently one set of researchers found that :"}, {"type": "text", "content": "AI-generated article reviews are now better, by every measure we could construct, than reviews written by well-compensated human experts and judged to be of unusually high quality by journal editors and authors.\n\nThe study was performed on quantitative social science papers, not philosophy papers, but of course this technology is only a few years old; who knows how it might develop, and how rapidly.\n\nDiscussion welcome.\n\nUPDATE: Shen-yi Liao provided a direct link to the prompt the researchers used . Try it on an unpublished piece of your writing. I gave ChatGPT the prompt and the introductory section of an unpublished talk I wrote a couple of years back and it identified me as the author with .62 confidence. You can read its report here . I fed it a referee report I wrote and it returned my name with .55 confidence."}, {"type": "text", "content": "The post What the End of Anonymous Writing Means for Academia appeared first on Daily Nous ."}], "text_post": false}, {"id": "7afaa8128bf8374e", "title": "Is mental illness universal?", "url": "https://aeon.co/essays/are-mental-illnesses-universal-or-are-they-culturally-specific", "source": "Aeon", "tag": "philosophy", "published_at": "2026-11-24T11:00:00+00:00", "panels": [{"type": "snippet", "content": "Do all cultures experience the same mental disorders? Or are our experiences of mental distress culturally specific? - by Alexander Pereira Read on Aeon", "read_more_url": "https://aeon.co/essays/are-mental-illnesses-universal-or-are-they-culturally-specific", "read_more_source": "Aeon"}], "text_post": false}, {"id": "312f55b632b2ba26", "title": "Feeling at home in a new country makes you a stranger in the old", "url": "https://psyche.co/ideas/feeling-at-home-in-a-new-country-makes-you-a-stranger-in-the-old", "source": "Psyche", "tag": "philosophy", "published_at": "2026-11-24T11:00:00+00:00", "panels": [{"type": "snippet", "content": "A five-month stay in Berlin has become nearly nine years, my sense of self and home changed by a peculiar arithmetic - by Iuri Portalegre Read on Psyche", "read_more_url": "https://psyche.co/ideas/feeling-at-home-in-a-new-country-makes-you-a-stranger-in-the-old", "read_more_source": "Psyche"}], "text_post": false}, {"id": "7af23ede6720657a", "title": "Why the New Right is failing", "url": "https://www.noahpinion.blog/p/why-the-new-right-is-failing", "source": "Noahpinion", "tag": "financial", "published_at": "2026-11-24T06:42:26+00:00", "panels": [{"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!rMPJ!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa4bda677-cd48-49d1-bbbb-edc394fcc30d_961x596.jpeg", "alt": ""}, {"type": "text", "content": "Sometime in the mid-2010s, just as liberalism was getting replaced by “progressivism”, the conservatism that I had grown up with was getting replaced by something we then called the “alt-right”. Whereas the old conservatism was based on Christian faith, libertarian economics, and flag-waving patriotism, the alt-right saw America as a white racial nation-state, rejected the idea of free markets, and was basically irreligious and isolationist.\n\nOver the course of two Trump presidencies and one Biden interregnum, the alt-right matured and grew into what I now call the New Right . In doing so, it basically took over from conservatism as the guiding ideology of the GOP base — though not (yet) of the GOP as a whole. Whereas the alt-right was a naked white-power movement, the New Right sees things in broader “civilizational” terms. It has embraced the idea of Christianity, not as a faith or a lifestyle, but as a tribal affiliation defining ingroup and outgroup. Its foreign policy matured into something concrete — a desire to wield American policy on behalf of “Western Civilization” ."}, {"type": "text", "content": "At the grassroots level, the New Right also added some new components. It merged with the Covid antivax movement to become skeptical of modern medicine, public health, and life science in general. It partially merged with the incel movement , telling young men that their sexual frustration was the fault of progressivism. It veered even more strongly into antisemitism , probably feeling liberated to do so by rising antisemitism on the left in the wake of the Gaza war. And it added a strong component of anti-Indian hatred , seeing Indians as a uniquely vulnerable target among recent immigrant groups.\n\nAnyway, it’s too early to say that this movement has failed . Yes, the Democrats won one midterm election, but Trump is still the President, and he has shown zero inclination to reverse course on any of his most New Right-aligned policies. He has made Stephen Miller, the ultimate anti-immigration crusader, his chief of staff, and posted a picture of himself hugging Vladimir Putin with the caption “My Friend”. Meanwhile, the New Right still has a fairly robust online presence."}, {"type": "text", "content": "But it’s impossible to deny that the winds have shifted. The midterms made it clear that even if the New Right sticks around for the long term, it won’t have a monopoly on power. That will make it essentially impossible for it to follow through on its long-term agenda. Basically, the notion that wokeness and internal disputes would cause the Democrats to permanently collapse as a party has been falsified.\n\nAlready, some prominent figures are backing away from the New Right. Elon Musk, who once stood on a stage and declared himself “Dark MAGA”, now says he’s not even MAGA at all, and is instead a political moderate:\n\nAnd the CEO of Palantir is calling himself a Democrat:\n\nMeanwhile, Bo French, the Texas candidate who lost an election after complaining about Indian fans at a UT football game, has been kicked out of his country club ."}, {"type": "text", "content": "The New Right’s online activists and commentators are in a state of deep despair:\n\nOthers are tweeting ever more histrionic demands for a civil war that absolutely no one seems interested in actually fighting:\n\nWhat enthusiasm still does exist on the New Right tends to be concentrated on the movement’s most extreme fringe, which focuses on getting attention by bashing Trump and MAGA and saying ridiculous, extremist stuff. For example, Politico reports on the “Christ is King” conference, run by a guy named Joel Webbon:\n\n[F]or Webbon, the problem was also that MAGA hadn’t gone far enough. He wanted even harsher deportation policies. He wanted a total repudiation of Israel. He wanted to curtail women’s right to vote, to criminalize abortion and homosexuality, and to expel Jews and non-Christians from public office…The event attracted a notorious set of online agitators, including conspiracist Alex Jones and Nick Fuentes, the 28-year-old white nationalist and antisemite, who made a rare public appearance as a guest speaker…"}, {"type": "text", "content": "There are, in Webbon’s telling, few “guys” capable of leading this faction…He did put forward a few “guys” who might fit the bill, naming electoral losers like [James] Fishback, one of the weekend’s main draws, who recently lost [a gubernatorial primary] to a MAGA-backed candidate by 37 points in Florida…Webbon also went on to name Bo French, the far-right candidate for Texas Railroad Commissioner who ultimately lost by some 670,000 votes to a Democrat after making anti-immigration a centerpiece of his campaign.\n\n(There are also various loonies from overseas .)\n\nThese are all signs of a movement that’s on the way down. It may return someday — communism sort of did, after all — but its hopes of transforming America over the next few decades are fading. It’s not over yet, but it’s looking more and more that way."}, {"type": "text", "content": "A big part of the reason for that failure, of course, is that Americans simply do not buy what the New Right wants to sell them. Regular Americans generally like (legal) immigration , and they don’t see racial and religious heritage as an important determinant of who is a real American. It’s very hard to sell people a product they don’t want.\n\nBut there are also various strategic errors that the New Right made. To be clear, I’m glad these mistakes were made; I have zero desire to see a movement like the New Right hold power in my country. I just think it’s interesting and instructive to think about what the mistakes were.\n\nOne choice that wasn’t a mistake was to hitch the movement to Donald Trump. A lot of people in the New Right are going to blame their failure on Trump’s mistake s — his Iran War, his corruption, and his reluctance to do anything about inflation. But without the assistance from Trump’s personal charisma and idiosyncratic broad appeal, it’s doubtful that the New Right would ever have escaped the basement of the internet in the first place; the Republican establishment would have kept it locked in a box, the way they did with similar insurgencies from Pat Buchanan and the John Birch Society in past eras. Trump was actually the most effective leader the New Right could have chosen."}, {"type": "text", "content": "Instead, the New Right’s weakness mostly sprang from the fact that it was an online movement.\n\nRightists will tell you that American culture has been completely captured by the left. And when you ask how this was accomplished, they’ll tell you about the “long march through the institutions” — a strategy that a German leftist described in the 1960s. Basically, the idea was for leftists to infiltrate universities, the media, the bureaucracy, and every other institution. Rightists believe, rightly or wrongly, that this plan was actually put into effect, and that this explains why university professors, media elites, civil servants, and so on tend to be left-wing today. 1\n\nOne might imagine that the New Right would try to execute a similar long-term strategy to win back the culture. Indeed, right-wing movements have been known to do something like this — the Federalist Society has been able to keep the American judiciary in rough ideological balance."}, {"type": "text", "content": "But the Federalist Society is part of the old conservative movement; the New Right has not shown much interest in executing a long-term strategy of institutional capture. Instead, they put most of their eggs in the basket of the Trump presidency, apparently hoping that either Trump would win the whole culture for them in a few years, or that he’d turn America into some kind of quasi-dictatorship that allowed his successors to continue the project of culture war and race war into the indefinite future. In terms of direct cultural appeal, the New Right mostly limited themselves to shouting online.\n\nThis demonstrates the extreme impatience of the New Right. Part of this is probably just inherent to rightist movements in general — there’s a reason that they’re called “reactionary”. Rightism tends to be strongly motivated by fear — the conceit is usually that if extreme measures are not taken right now, everything good in the world will be destroyed. The belief in imminent destruction doesn’t exactly lend itself to a patient long-term strategy of institutional takeover."}, {"type": "text", "content": "But part of the reason has to be the movement’s online roots. For people whose defining cultural expression consists of memes and Twitter mobs, the strategy of patiently infiltrating PhD programs over the course of 30 years must sound like hell. Virality and online conflict give instant gratification; winning a presidential election is only slightly less instantaneous. Institutional takeover requires a patience that was definitely present in 1985 among sad-sack leftist grad students with nothing to lose, but is in short supply among today’s online politics junkies.\n\nThis is why when Trump fades from the political scene and fails to be replaced by an eternal dynasty of rightist caudillos, the New Right will feel like they have nothing."}, {"type": "text", "content": "Politics is the art of making strategic alliances. The old conservative movement was very effective at this. Uniting the interests of Christian conservatives and libertarians took some doing. And conservatives worked heroically to include Catholics in a movement once dominated only by Protestants, leading to the Reagan Revolution and the exodus of Italian, Polish, and Irish voters from the Democrats to the GOP.\n\nMAGA itself made strategic alliances in its successful 2024 comeback campaign. Co-opting RFK, Jr. — formerly a well-known progressive — into the fold was detrimental to the nation, but was also a stroke of political genius. Trump even allied with Tulsi Gabbard, using their shared fondness for Russia."}, {"type": "text", "content": "Trump’s 2024 campaign also offered the GOP its chance for the biggest ethnic realignment since Reagan. Trump won primarily thanks to the exodus of large numbers of Hispanic and Asian voters from the Dems to the GOP. These voters were frustrated by “woke” progressive attitudes toward race, and swayed by Trump’s promises to tame inflation.\n\nBut no sooner had these nonwhite voters handed Trump the presidency than the New Right started attacking them. From Bo French’s anti-Indian rants to Stephen Miller’s encouragement of racial profiling in ICE raids, rightists in power spit on the very people they needed in order to build long-lasting support. Meanwhile, rightist intellectuals continued to say dismissive and mean things about minority voters:"}, {"type": "text", "content": "This spectacular failure to repeat Reagan’s conversion of “white ethnics” will come back to haunt the right in the future. Already, many Hispanic Trump supporters shifted back to the Dems in the midterms, while others stayed home in disgust.\n\nAs I wrote in a post back in September, this tendency to attack and exclude potential allies will ultimately doom the New Right:\n\nIt’s this pathological inability to understand alliances and coalition-building that will ultimately doom the New Right…[T]his is a movement built to exclude and divide and splinter — both because of the querulous personalities of rightists themselves, and because of the intransigence of a racial ideology that abhors any impurity . If they ever managed to see off the Hispanics and the Asians, the rightists would start in on the Greeks and the Italians, and so on. There’s no victory in sight — only eternal conflict. These are not nation-builders ; they are nation-dismantlers."}, {"type": "text", "content": "Ultimately, I think this tendency probably also flows from the New Right’s online origins. On platforms like Twitter/X, attention is the only currency that matters, and denouncing people gets more attention than patiently building durable alliances.\n\nRight-wing movements have always appealed to men by portraying themselves as more manly than their opponents. Trump and MAGA had many different appeals to masculinity, including winning the favor of “podcast bros” like Joe Rogan who had the ears of many American men. That was smart, and had the potential to be durable.\n\nBut the New Right often appealed to men by promoting “incel” ideas . For those who are unacquainted with incel ideology, the idea is that if women are free to choose their own partners, all the women will go for a few highly desirable men (“chads”), leaving the vast majority of men celibate and frustrated. The New Right married this idea to anti-feminist politics — it promised to reduce women’s status and independence in society, in order to force them to accept lower-status men as partners, thus making the distribution of sex more egalitarian."}, {"type": "text", "content": "The spread of incel ideas among the New Right explains the recent rightist uproar over the part of Grand Theft Auto 6 in which you have to buy flowers for your girlfriend:\n\nThe idea is that in a society free of progressive values, men would never have to woo women by buying them flowers or doing nice things for them; they would just demonstrate their superior status and power as men, and women would offer themselves up. (Apparently these rightists know little or nothing about courtship in the 19th century, or the 1950s, but that’s beside the point.)\n\nThis absurd message had more appeal than you might expect. Sexual frustration is a powerful motivator for many naive young men, and the idea that right-wing politics could lead to more sexual success was a seductive one. The only problem with this is that it wasn’t actually true — or at least, there wasn’t enough truth in the story to actually make a difference to men’s lives. If you couldn’t get a date in 2024, you couldn’t get a date in 2026 either."}, {"type": "text", "content": "I suspect that there is only so long that you can appeal to men by calling them sexless losers. It only takes most of them a short time to wake up and realize that supporting right-wing politicians has no chance of improving their sex lives, now or 20 years from now. By 2026, young men’s flirtation with the political right was ending:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!fScw!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa088552c-496d-4fef-b6fd-38289e9eb92e_498x394.jpeg", "alt": ""}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!WKxB!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F60036e63-a9f1-4e39-af2d-79b295f06d11_506x355.jpeg", "alt": ""}, {"type": "text", "content": "These numbers are partially due to differential turnout; a lot of former Trump supporters simply stayed home in 2026. But withdrawing in disgust is also a way of showing a lack of support. The New Right’s message to young men — crafted for an extremely online audience, in order to get attention in online forums filled with frustrated young rejects — simply didn’t have what it takes to hold the attention or retain the allegiance of America’s young men.\n\nThe online world is an ephemeral place. Attention comes and goes, the news cycle turns over, memes become boring and stale. A social movement that arises from this impermanent space will inevitably have difficulty carrying out any change that requires more than a couple of years. Thus it was with the New Right. I wrote back in 2025 that the Trump movement itself was destined to be ephemeral, because it built no lasting institutions:"}, {"type": "text", "content": "Trump’s movement has been around for a decade now, and in all that time it has built absolutely nothing. There is no Trump Youth League. There are no Trump community centers or neighborhood Trump associations or Trump business clubs. Nor are Trump supporters flocking to traditional religion; Christianity has stopped declining since the pandemic, but both Christian affiliation and church attendance remain well below their levels at the turn of the century. Republicans still have more children than Democrats, but births in red states have fallen too.\n\nIn Trump’s first term, the attempts at organized civic participation on the Right were almost laughably paltry. A few hundred Proud Boys got together and went to brawl with antifa in the streets of Berkeley and Portland. There were a handful of smallish right-wing anti-lockdown protests in 2020. About two thousand people rioted on January 6th — mostly people in their 40s and 50s . And none of these ever crystallized into long-term grassroots organizations of the type that were the norm in the 1950s."}, {"type": "text", "content": "For a very few people, the first Trump term was a live-action role-playing game; for everyone else, it was a YouTube channel.\n\nAnd in Trump’s second term so far? Nothing. Even the rally numbers are way down . National conservatives who might have gone out to meet each other in 2017 are hunkering at home alone in their living rooms, swiping back and forth between X and OnlyFans and DraftKings, pumping their fists in the air as they read about how Elon Musk [is] firing people or Trump is cutting off aid to Ukraine. “You can just do things”, except almost zero of Trump’s supporters are actually doing anything except passively cheering for their notional team…[T]he thumos is all secondhand.\n\nThe MAGA movement, you see, is an internet thing . It’s another vertical online community — a bunch of deracinated, atomized individuals, thinly connected across vast distances by the notional bonds of ideology and identity. There is nothing in it of family, community, or rootedness to a place. It’s a digital consumption good. It’s a subreddit. It is a fandom ."}, {"type": "text", "content": "I don’t think I’d change a word of that.\n\nThe New Right claims to be the champions of Western Civilization, but in fact their movement is a parasite on the actual Western Civilization that birthed them. They are not the kind of people who could ever build Notre Dame; they could only post memes of Notre Dame to win a fleeting argument on the internet.\n\nThe real bones of Western Civilization — the things that have always made it mighty — are its institutions . They are courts, corporations, bureaucracies, markets, churches, universities, charities, armies, and so on. They are fundamentally cooperative, long-lasting, constructive things. They require great cooperation to build, and they work by fostering ongoing, productive cooperation among the people who sustain them."}, {"type": "text", "content": "The New Right are not institution-builders; they are institution-mockers. They are squalling children, cradled in the bosom of Western Civilization, shaking their tiny fists and throwing a tantrum because they were asked to do real work to sustain their priceless inheritance. Throwing a tantrum because someone asked them to court women with flowers. Throwing a tantrum because someone expected them to work alongside industrious Indian engineers. Throwing a tantrum because they didn’t like the color of the faces they saw at a football game they didn’t even attend. Tantrums as a lifestyle, tantrums as a video game, tantrums as the ultimate form of decadent, useless consumption.\n\nNo civilization will ever be built, or rebuilt, by the hands of such men."}, {"type": "text", "content": "But it would be arrogant to believe that the New Right are unique in this regard. The woke movement of the 2010s built more offline institutions than the New Right did, but ultimately proved more interested in dismantling every facet of American culture and society. The leftist movement of the 2020s is barely less online than the New Right, and even more focused on tantrums as the praxis of change.\n\nSocial media has given us the ability to spend our entire lives playing a video game that looks like reality. “Press A to throw tantrum.” Almost everything that looks like a movement these days is simply the spectacle of a large mass of consumers playing these video games and calling it politics. The real, hard, slow work of building institutions is still being done, to some extent, but the people doing it are not the people dunking on you on X, or ranting for attention on TikTok, or filling the ears of D.C. staffers with nonsense and poison."}, {"type": "text", "content": "Subscribe now\n\nShare\n\nThe truth is undoubtedly more complicated. There are plenty of other reasons these institutions tend to lean the left. Education polarization has been happening all across the globe. Universities and the civil service tend to be filled by people who didn’t want to go into the private sector. And so on."}], "text_post": false}, {"id": "5c0100c11dc13f43", "title": "Jensen’s Candor Is Satisfactory Now", "url": "https://www.bloomberg.com/opinion/newsletters/2026-11-23/jensen-s-candor-is-satisfactory-now", "source": "Money Stuff", "tag": "financial", "published_at": "2026-11-23T18:10:32+00:00", "panels": [{"type": "snippet", "content": "Also repossessing chips in space, humiliation and Backward Hat Capital.", "read_more_url": "https://www.bloomberg.com/opinion/newsletters/2026-11-23/jensen-s-candor-is-satisfactory-now", "read_more_source": "Money Stuff"}], "text_post": false}, {"id": "6edeea2b4b92d05b", "title": "The wind and the song: the treachery of AI", "url": "https://aeon.co/videos/what-does-it-mean-when-humans-and-technology-become-indistinguishable", "source": "Aeon", "tag": "philosophy", "published_at": "2026-11-23T11:01:00+00:00", "panels": [{"type": "snippet", "content": "As AI learns to look, talk and think ever more like us, this short film asks how we can stay fully human alongside it - by Aeon Video Watch on Aeon", "read_more_url": "https://aeon.co/videos/what-does-it-mean-when-humans-and-technology-become-indistinguishable", "read_more_source": "Aeon"}], "text_post": false}, {"id": "716e8410796eb3ff", "title": "Learning to leave", "url": "https://psyche.co/turning-points/my-dog-had-separation-anxiety-i-had-ptsd-how-did-we-cope", "source": "Psyche", "tag": "philosophy", "published_at": "2026-11-23T11:00:00+00:00", "panels": [{"type": "snippet", "content": "My dog’s separation anxiety kept me housebound. To help him, I had to face my own fears of leaving - by Tracy Strauss Read on Psyche", "read_more_url": "https://psyche.co/turning-points/my-dog-had-separation-anxiety-i-had-ptsd-how-did-we-cope", "read_more_source": "Psyche"}], "text_post": false}, {"id": "fcdd58de04d485df", "title": "AI people are very, very, very, very rich", "url": "https://www.noahpinion.blog/p/ai-people-are-very-very-very-very", "source": "Noahpinion", "tag": "financial", "published_at": "2026-11-22T06:27:25+00:00", "panels": [{"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!2W5G!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F16b71af9-bdf6-4eb4-bcb2-1bc293ffb154_855x570.jpeg", "alt": ""}, {"type": "text", "content": "As you may have heard, Anthropic had its IPO this past Thursday. At a valuation of $1.5 trillion, it was actually just the second most valuable IPO in history, just behind SpaceX at $1.77 trillion. I bought some shares on the first day at what I thought was a reasonable price, only to see my shares drop the following day as the company’s valuation fell to $1.175 trillion, making it only the 14th most valuable company in the world. Such are the risks of buying individual stocks!\n\nBut that price drop doesn’t change the fact that Anthropic’s IPO was a staggeringly large wealth creation event. Anthropic began hiring lots of employees just a few years ago; now, almost all of those people have either hundreds of millions of dollars, or tens of millions of dollars. Andrew Benson had a good breakdown of exactly who would get what, if the company hit its initial valuation target of $2 trillion:"}, {"type": "text", "content": "Who actually gets rich if Anthropic lists at $2 trillion?… - $199B for the 7 controlling co-founders, about 10% - $28B for Ben Mann, if his stake matches theirs - $100B for the Anthropic Public Benefit Fund, 5% - $331B in employee options and RSUs, about 17% , That pool covers about 5,300 employees, an average of $62M each…\n\n[H]ere is roughly how many people made what at $2T: - $110M to $400M each: ~300 to 500 people hired by 2023 - $200M to $300M each: ~440 to 640 hired in 2024 - $70M to $95M each: ~1,360 hired in 2025 - $10M to $20M each: ~3,000 hired in 2026\n\nSo about 940 people hired by the end of 2024 average nine figures. Everyone hired since averages eight figures.\n\nThe company’s (fully diluted) valuation is now only about 80% of that $2T number, so you have to scale those numbers down a little bit. But it’s still a staggering amount of money for just a few years of work! We’re used to seeing the first few employees at a generational company make hundreds of millions of dollars, but seeing several hundred people make that much is just unprecedented."}, {"type": "text", "content": "Let’s put these numbers in perspective. If Anthropic were worth $2T, it would have more centimillionaires than the entire city of Los Angeles. Even with only 350-400 centimillionaires, that’s about as many as Houston, Dallas, and Austin combined:\n\nBy some reckonings, Anthropic now has between 0.5% and 1.3% of all the centimillionaires in the U.S. Collectively, the company’s founders and employees have as much wealth as the entire bottom third of Americans, combined:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!KrOI!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fc9a79ded-9bfe-4c30-8664-8ec56ff09c14_1040x608.jpeg", "alt": ""}, {"type": "text", "content": "Of course, just looking at these numbers tremendously understates the amount of wealth that has been created in the AI industry over the last couple of years. There’s also OpenAI, which is targeting an IPO valuation of $1.25 trillion. And there are quite a number of AI startups that have gotten very valuable, very quickly. Just a few include Isomorphic Labs at ~$50 billion, Cognition at $48 billion, Prometheus at $41 billion, Safe Superintelligence at $32 billion, VAST Data at $30 billion, Reflection AI at ~$27.5 billion, Cohere at $25.5 billion, ElevenLabs at $22 billion, and so on.\n\nAnd of course, all of this is just today . I wouldn’t have bought Anthropic stock unless I thought the company had a very good chance of becoming much more valuable than it is today. Despite the early price drop, I’m still very bullish. I think AI’s extremely cross-domain capabilities mean that Anthropic has a good shot at being a very large, diversified conglomerate:"}, {"type": "text", "content": "Furthermore, I think the company is amassing a huge pool of top human talent, essentially giving them a hedge against a future in which AI continues to be a complement to top human talent rather than a substitute. Almost every smart person I know here in Silicon Valley either works there or has strongly considered working there. That makes Anthropic resemble Google back in 2004, which became a legendary brain trust. If anyone can figure out a way to make boatloads of money with AI, it’s probably Anthropic. And yes, someone will figure out a way to make boatloads of money with AI. Even if that means the company only becomes as valuable as Google or Microsoft is today , that means I’ll more than double my own investment."}, {"type": "text", "content": "If that happens, all of those wealth numbers from the top of this post will also more than double. And if the U.S. economy grows robustly and AI itself grows rapidly as a percentage of that economy, this could easily turn out to be the greatest wealth creation event in American history, by far — greater than the internet, far greater than crypto, greater even than the railroads.\n\nI can definitely feel this wealth all around me. A lot of the people I went to potlucks with three years ago now have an order of magnitude more money than anyone I ever met before I turned 30. Some of those people are under 30 themselves. A few of them are billionaires. Now, when I go to house parties, they’re often in lavish designer-furnished mansions overlooking spectacular ocean views from high up on San Francisco hilltops."}, {"type": "text", "content": "As a social phenomenon, this is totally unprecedented. Sarah Chieng writes :\n\nYou can build a startup in 9 months, get acquired (but rly acquihired) by OpenAI, Anthropic, or Cognition, and walk away a multi-millionaire…You can join the right company at 22 and become effectively post-economic…And I don't think we've even begun to grapple with the degree to which this is warping an entire generation's relationship with money, ambition, work, and success…When your peers are making generational wealth before 25, what does a normal career even look like anymore[?]\n\nI’m happy for my friends, of course. And I am not personally bothered by seeing displays of great wealth. But I find myself wondering what this is going to do to my society. If the AI class are the only people who get rich going forward, what kind of tensions will that produce among the country’s elites? What would it mean for America if wealth inequality goes up far further even than it already has?"}, {"type": "text", "content": "Read more"}], "text_post": false}, {"id": "14843c85ed57a3e6", "title": "Anthropic Pops", "url": "https://www.bloomberg.com/opinion/newsletters/2026-11-19/anthropic-pops", "source": "Money Stuff", "tag": "financial", "published_at": "2026-11-19T19:09:42+00:00", "panels": [{"type": "snippet", "content": "Also prepaid energy bonds, Ant wealth and Situational Awareness 2.0.", "read_more_url": "https://www.bloomberg.com/opinion/newsletters/2026-11-19/anthropic-pops", "read_more_source": "Money Stuff"}], "text_post": false}], "weekly": [{"id": "c7da183e95a407f4", "title": "Does AI Dream of Electric Sheep?", "url": "http://schwitzsplinters.blogspot.com/2026/11/does-ai-dream-of-electric-sheep.html", "source": "The Splintered Mind", "tag": "philosophy", "published_at": "2026-11-23T20:17:47+00:00", "panels": [{"type": "snippet", "content": "John Sanford, at UCR Magazine, has produced a terrific popular summary of my work on AI consciousness and AI rights -- the best I have read so far.  If you're looking for an approachable synthesis of my main ideas on this topic, this is it. Does AI Dream of Electric Sheep? Philosopher Eric Schwitzgebel can’t say for certain if AI will achieve consciousness, but that uncertainty poses a major ethical dilemma By John Sanford | Photos by Stan Lim The eeriest scenes in the film “Blade Runner,” the sci-fi classic about artificial life gone rogue, involve a test to distinguish humans from nonhumans.", "read_more_url": "http://schwitzsplinters.blogspot.com/2026/11/does-ai-dream-of-electric-sheep.html", "read_more_source": "The Splintered Mind"}], "text_post": false}, {"id": "17e8da52aec30635", "title": "Supply and Demand", "url": "https://www.netinterest.co/p/supply-and-demand", "source": "Net Interest", "tag": "financial", "published_at": "2026-11-23T15:38:25+00:00", "panels": [{"type": "text", "content": "“For fifty years I’ve been doing this. I can’t remember a period where I had less clarity on where we’re going to be in 12 months — Stan Druckenmiller\n\nI spent a few days in Austin last week at the TomorrowX investment conference. Its theme was AI – what else – yet while the mood in the room was upbeat, havoc was playing out in markets. Unmoved by the leather-clad executives strutting the stage, the Nasdaq lost 10% of its value over the week, before Jensen Huang’s return prompted a recovery. 1\n\nCEOs of financial firms reckon that such volatility is to be expected. “Whenever there’s a technology acceleration, people imagine a growth curve,” said David Solomon of Goldman Sachs. “And then as more information comes to fruition, they recalibrate that growth curve. Right now we’re going through a recalibration of that growth curve. But that still doesn’t mean that people have it exactly right.”"}, {"type": "text", "content": "“There’s definitely high bubble alert in the markets,” said Jon Gray of Blackstone. “People are very focused on this and I think skepticism when you have this kind of investment boom and technological transformation is healthy. And you have to concede that there will be misallocations of capital… But I think the negativity has gone too far in aggregate.”\n\nBoth of them point to an upsurge in demand for AI services. Gray revealed that Blackstone portfolio companies are spending 20 times more on models. Others gave similarly bullish updates on AI usage at their organisations. Tony Xu of Doordash said AI spend there went up 20 times this year. Lin Qiao of Fireworks AI, a startup that helps companies run, ensemble and train their own open-weight models, said that enterprise token consumption is up 12 times in six months. Brian Armstrong of Coinbase said that his personal AI spend has gone from about $500 a week to about $5,000 a week. And AlphaSense, a market intelligence platform, disclosed that its annualized token usage hit 75 trillion in October, up 12-fold from a year earlier (ahem, I may be behind some of that)."}, {"type": "text", "content": "The trouble is that amid improved compute efficiency, higher volumes don’t necessarily flow into higher lab revenues. That’s clear from Ramp’s data on AI token spending by businesses that use its spend management software. Token volume is still going up – in the four weeks to November 15, it was 27% higher than in the previous four weeks – but spending rose by only 8%.\n\nAs an early adopter, Doordash is a case in point. “I think we were single digit customer number for OpenAI,” says Xu. Now, though, he concedes that spend has plateaued as frontier models have become more efficient and as Doordash has shifted some of its workload to open-weight models that it fine-tunes itself.\n\nThis all matters because the massive investment in infrastructure underway needs revenues to fund it. Assuming investors demand a 10% return, the industry would need to generate about $3.5 trillion a year of revenue, once the buildout is complete, to justify the nearly $9 trillion being spent on US data centres due to open by 2032. That assumes two-thirds of the money goes on chips with a six-year life, the rest on buildings and power lasting 20 years, and a 50% cash margin. Even if we stretch the useful life of chips out to ten years, revenue of $2.7 trillion would still be required ( paid subscribers can play with these numbers in a spreadsheet here )."}, {"type": "text", "content": "Yet based on their third quarters, Anthropic and OpenAI together only generate around $108 billion of annualized revenue – so we’re a long way short.\n\nNor are users themselves adding to the pie through economic gains of their own. Productivity improvements have been so far elusive. Beyond the tech sector, revenue per worker inside America’s largest public companies remains broadly flat , as do profit margins. “The benefits aren’t observable in our current quarterly earnings,” admitted JPMorgan CFO Jeremy Barnum on his latest earnings call.\n\nBut there are several reasons to heed the buzz on the Austin stage. To find out what they are, and why lenders rather than demand are now setting the pace of the AI buildout, read on."}, {"type": "text", "content": "Read more"}], "text_post": false}, {"id": "9d93df52dd06f9f8", "title": "375 | Karen Lutfey Spencer on Dying and How to Prepare for It", "url": "https://preposterousuniverse.com/podcast/2026/11/23/375-karen-lutfey-spencer-on-dying-and-how-to-prepare-for-it/", "source": "Mindscape", "tag": "philosophy", "published_at": "2026-11-23T12:06:53+00:00", "panels": [{"type": "text", "content": "It is one thing to recognize, in an intellectual and abstract sense, that each of us will one day die. It is another to be practical about it, facing up to the challenges of the end of our lives with open eyes. As emphasized by today's guest Karen Lutfey Spencer in her book Your Good Death , these preparations need to include not only coming to terms with things ourselves, but having clear conversations with people who are close to us.\n\nListen or watch Rolex Planet Visionaries wherever you get your podcasts. #ad\n\nGet 30% off your first year of the Base44 Builder plan at https://Base44.com/mindscape . #ad\n\nPreserve your online privacy at Incogni and get 60% off an annual plan at https://incogni.com/MINDSCAPE . #ad"}, {"type": "text", "content": "Selling a home doesn't have to be hard with Opendoor. Get your free offer at https://opendoor.com/MINDSCAPE #ad\n\nLife is amazing. Remember with Aura Frames. Additional $5 off at https://auraframes.com/pdp/MINDSCAPE #ad\n\nLook your best and support men's health at https://www.amazon.com/b?node=223476965011&ref_=MOV26_pod #ad"}, {"type": "image", "src": "https://preposterousuniverse.com/wp-content/uploads/bb-plugin/cache/e967b0d7-1775-4c88-96b3-7337a15b2c60_3344x3344-3007241181-square.jpg", "alt": "Karen Lutfey Spencer"}, {"type": "text", "content": "Support Mindscape on Patreon .\n\nKaren Lutfey Spencer received a Ph.D. in sociology from Indiana University. She is currently a professor of Health and Behavioral Sciences at University of Colorado Denver. Her research spans a variety of topics concerning medical decision making and health outcomes.\n\n0:00:00.8 Sean Carroll: Hello, everyone. Welcome to the Mindscape podcast. I'm your host, Sean Carroll. You know that here at Mindscape, we're invested in bringing you the latest scientific discoveries. And apparently the new discovery is that someday we are all going to die. [chuckle] It's actually quite an old scientific discovery, we've known this for a long time, and it's not the same day that we're all going to die, different days, slightly unpredictable. But it's part of the fabric of biology and to be a living organism, especially a big multicellular one, that you only last for a finite amount of time. And interestingly, in various nations and societies on Earth, the average lifespan has gone up, but the maximum lifespan hasn't gone up that much. The average lifespan goes up because people are living closer and closer to 120 years or whatever the average maximum lifespan actually works out to be, so it's pretty inevitable. And we've talked before on the podcast with Megan Rosenbloom years ago, early in the podcast, about the fact that we're not very good as a society, as human beings, at facing up to this fact that someday we're all going to die."}, {"type": "text", "content": "0:01:13.6 SC: And I think especially here in the United States, this podcast episode is going to be pretty US-centric because that's just what we know about. People who are from other countries can chip in. But we have this combination of, as individual human beings, we're a little bit reluctant to face up to our inevitable demise sometimes. And talking about it is a bit awkward, especially talking about it with our loved ones and so forth. And then also institutionally, we have hospitals and caregivers and insurance companies, and they're entirely set up to treat you and make you better when you're sick. That's good, right? They should be trying to treat you, but they're really just not, as we'll talk about, set up for helping us face up to what happens when you're not going to be treated anymore, when it's not something that we can fix, when you're facing those last moments. And it would be nice, most people think, when you face close to death, to do it in the most pleasant way you can. Maybe you don't want to do it, but it's gotta happen, so let's make it more or less not terrible, right? Not really off-putting and alienating or whatever. Maybe we can do it at home, surrounded by loved ones or peacefully, comfortably, pain-free, whatever it is."}, {"type": "text", "content": "0:02:35.4 SC: So having these conversations both between ourselves and ourselves, thinking for our individual cases what matters to us as we approach the end of our lives, talking to our family members and our loved ones who might be responsible for making decisions in these moments, and talking to our healthcare providers, talking to our doctors and so forth about what the process is like. We don't do any of these things nearly enough, and it matters. And so we have a situation where a lot of people die in hospitals and it's sort of alienating and medicinal and institutional. It's not really what we want. So today we're talking to Karen Lutfey Spencer, who is a medical sociologist. So sociologist, she studies people, how they interact, how they interact with institutions and things like that. And then medical, so in particular, there's institutions, right? When you have medicine, you have hospitals, like we said, insurance companies, legislation, government intervenes in these situations sometimes."}, {"type": "text", "content": "0:03:42.9 SC: And then over the last few years, she's, like many of us, she's had interactions with people near the end of their lives. Her mother, her mother-in-law, et cetera. She has a new book out called 'Your Good Death: Why End-of-Life Healthcare Is So Difficult and How to Make It Work for You.' She was sort of inspired to shift her research focus within medical sociology to end-of-life care by the fact that she had to deal with people having end-of-life care, and it's just kind of clear how we can improve it a little bit. So the conversation is actually a lot about how you can actually specifically improve your end-of-life situation. That's why the book is called 'Your Good Death.' There's a lot in there about the institutions and hospitals and things like that, but a lot of it is in our individual hands. And one point that she makes is you shouldn't wait until it's almost here. These are things we should consider, take seriously even when we're perfectly young and very, very healthy, right? Because that's when you can think clearly and without being in a rush, et cetera, about what you value, like, what is important to you. If you start losing the capacity to do this or that as you get very, very ill and are approaching death, at what point would you rather stop doing dramatic treatments to try to squeeze out a couple more months of your life? These are difficult things to contemplate, but they're necessary things to contemplate. And the earlier you do it, the better, both in informal conversations with your loved ones and in formal documents that you might want to sign, advanced health directives, things like that. So here we are at Mindscape, doing our part to nudge people toward thinking about these difficult issues. It might be important to you or to someone you love down the road. So let's go."}, {"type": "text", "content": "[music]\n\n0:05:53.6 SC: Karen Lutfey Spencer, welcome to the Mindscape podcast.\n\n0:05:56.4 Karen Lutfey Spencer: Thank you so much for having me.\n\n0:05:58.7 SC: You know, I gotta start... Sometimes I start with this question, but not always, but for something like this, what got you into this area? I mean, you're studying death, you're gonna be around a lot of people dying. It's obviously a necessary part of our existence, but it's not the most looked-for one. So what got you fascinated?\n\n0:06:20.6 KS: So I had already been studying issues in healthcare and problems in healthcare for about 15 years when my mother was diagnosed with a brain tumor. And I found myself thrust into the role of a long-distance caregiver. And through that experience, I started looking around and saying, \"Wait, this is another area of healthcare that has some of these similar issues that I'd studied before.\""}, {"type": "text", "content": "0:06:44.8 SC: And how popular is it to study it as a field? Like, are there a lot of death people out there? Do you have conferences?\n\n[laughter]\n\n0:06:54.2 KS: We do have conferences. So there's a lot of death people around, adjacent to healthcare. And then there's also a lot of people just studying issues in healthcare and bias and medical decision-making more generally. So it's a big field. It's very multidisciplinary.\n\n0:07:12.9 SC: I was just gonna say, it's very multidisciplinary. You come at it from the sociological point of view, which is kind of cool, but I presume that you're talking to a lot of public health people, medical professionals, things like that.\n\n0:07:25.2 KS: There's a lot of that, yes."}, {"type": "text", "content": "0:07:28.2 SC: And do sociologists think that what you're doing is sociology?\n\n0:07:34.5 KS: They definitely do, because sociologists are very interested in looking at how the individual is nested in larger social systems. And so how the very macro meets up with the micro and back and forth. So for sociologists, thinking about how individuals are nested in healthcare is sort of one more case of thinking about how individuals are nested in schools or government or policy.\n\n0:07:58.0 SC: I mean, from the just individual point of view, I mean, let's just face up to it, right? Probably this is gonna be the theme of the podcast is facing up to things. So, death is gonna happen to us all, most of us accept this in the modern world, but we don't really want to think about it. I mean, what is the psychology here before we even get into the sociology?"}, {"type": "text", "content": "0:08:21.9 KS: Well, so as a sociologist, the thing that I am most focused on is how people interact with social systems. And I think there's a lot of ways that our social systems have spillover outside of the walls of healthcare. And so to the extent that our healthcare systems tend to be focused on treatment and less set up to talk about off-ramps from treatment, then I think that kind of compounds what we have going on socially, which is a tendency to not want to talk about these things.\n\n0:08:55.5 SC: I mean, I guess that's my attitude, but it's not a very informed one, so you can help me out with the data here, that we in general, in the United States, maybe the world, maybe you can compare the US to the world, do a bad job of conceptualizing, thinking about, planning for our ultimate deaths."}, {"type": "text", "content": "0:09:16.3 KS: It's a topic that has a lot of depth across cultures, across history. And so one of the reasons I named the book 'Your Good Death' as opposed to A Good Death is that it's not singular and it varies pretty dramatically. But I wrote in the book about history, about how the Greeks and Romans thought about what a good death looked like, and the Native Americans, and sort of all the way up to the modern Institute of Medicine. So there's a lot of variation and it can look differently for individuals.\n\n0:09:47.4 SC: How has it changed? How is it different now than for ancient Rome or for Native Americans?\n\n0:09:53.1 KS: Well, I think one of the main things that's happened is we've medicalized it. And so in those more historical kind of contexts, your community mattered a lot, your ancestry mattered a lot. And so the idea that you are part of a community, you would be accompanied on this transition, all of those things were really part of what we thought about for a good death. But then in the mid-1900s, we have this rise in physicians and hospitals especially, and then we have this huge medicalization of death and dying. So I think on the other end of that, you have the Institute of Medicine talking about what a good death looks like, and it's very much happening in a medical setting."}, {"type": "text", "content": "0:10:35.5 SC: And so do I take from that that what it was like in ancient Rome is more similar to what it was like in pre-Columbian America than either one of them are like it is now?\n\n0:10:49.8 KS: I think that's fair. I don't think those societies were having to answer questions like, \"Do I need an advance directive saying how many days I'm willing to be on life support?\"\n\n0:10:59.6 SC: It's kind of strange to me... This is gonna seem very different, but I was reading the Wikipedia page on the subject of dinner, like the meal that we eat at the end of the day. And of course, it's completely different than it was 150, 200 years ago, just because they didn't have electrical lighting, right? So the big meal of the day was lunch and you had a small meal at dinner time. And I think people have forgotten very quickly, and I suspect the same thing is true with death. It wasn't that long ago before it was medicalized, but we have no sort of social conception of what it was like anymore."}, {"type": "text", "content": "0:11:35.0 KS: Well, I think especially for younger people. So a lot of people I would interview, say they were... So I was maybe in my mid-40s when I started this research, and they would be maybe 10 years older than that, and they would be like, \"When I was a kid, grandma was dying in the back bedroom and mom was taking care of her.\"\n\n0:11:54.2 SC: Yeah.\n\n0:11:54.7 KS: So there was this more multigenerational households and you would see up close what it looked like for someone to be dying. So that was something that you were exposed to and it made it easier to recognize.\n\n0:12:09.2 SC: And now we're all losing that. The younger generation has not seen anyone die in their house.\n\n0:12:15.0 KS: Right. And that's part of medicalization, that it tends to be just taken away and it's supposed to be something that happens elsewhere. And I think that makes it harder to talk about."}, {"type": "text", "content": "0:12:25.9 SC: So what is a typical set of circumstances in the United States, let's start with, for someone who is close to death? Are they in a hospital? Are they in a hospice? Is it at home?\n\n0:12:40.3 KS: So maybe let me share a statistic that motivated this research for me that still really bothers me, which is in public surveys in the United States, when you ask people where they prefer to die, 70% of them will say they prefer home palliation and to die at home. But only about 30% of us actually get that. So to me, that difference between 30 and 70 is a lot of people not getting what they want. And of course, when you're talking about people dying, there's a lot of ways that that is out of anyone's control. It can happen a lot of ways, but I do think some portion of that is because of what's happening in healthcare. And so more people than ever, getting back to your direct question, more people than ever are using hospice, which is great. So something just over half of people in any given year now are dying in hospice. However, our hospice stays are extremely short. So under Medicare, you can have six months of hospice coverage, but the median stay in hospice is like 18 days. And it's been that way for years. That number's not really budging. And about a quarter of people stay in hospice for a week or less. So what that means is people are very close to end of life by the time they get a hospice referral or they make that decision to go. And that is, to my mind and I think a lot of other people's, it's an underutilization of what hospice can bring to the situation."}, {"type": "text", "content": "0:14:11.6 SC: I always like to imagine that there's people worldwide listening, or people who will be listening 500 years from now. So tell us what hospice means. What does that word mean? How is the system used?\n\n0:14:23.2 KS: Yeah. So hospice came to the United States in the '70s, and it comes to us most directly from the UK. And so it's been around long enough that it has a lot of stereotypes and maybe some myths attached to it. But hospice is a type of palliative care. So I think we should talk about hospice and palliative care hand in hand. So, palliative care is a broad umbrella term where hospice is one thing under that umbrella. And palliative care is oriented to comfort care, helping people have quality of life, care that's aligned with what's important to them. And hospice is this one piece under the umbrella that's covered by Medicare. To get your hospice Medicare benefit, you have two physicians who sign off that they would not be surprised if the person died within six months."}, {"type": "text", "content": "0:15:12.6 SC: Okay.\n\n0:15:13.0 KS: And to get that coverage, you have to relinquish any kind of medical care coverage under Medicare that is intended to cure your condition. So this gets called the terrible choice in healthcare circles. And it's framed as this real fork in the road. And so you get a lot of cultural stereotypes around hospice as for quitting. Palliative care is much newer in the US and it's really been established as a subspecialty in the 2000s. And that does not require a certain prognosis or diagnosis or a certain age, it can be used concurrently with curative care. So palliative care is something that I think people don't know nearly as much about, but it's a fantastic bridge from something like hospice to curative care."}, {"type": "text", "content": "0:16:00.4 SC: And is the idea behind hospice... I've actually been there, my mom used to volunteer in one, but it's my job to ask questions as if I know nothing. So is part of the point that it's just a more pleasant environment than to be in a hospital?\n\n0:16:16.2 KS: I think that could be interpreted in several different ways. It kind of depends what's most important to people. So hospice is designed to provide support for people even if they are not in a hospital or not pursuing curative care. And so this might mean that people would rather be home than be in the hospital. They might not want to keep having treatments that have a lot of side effects and are really draining. They would rather spend their time at home. And so hospice is set up to let people do that while also being as safe and comfortable at home as possible."}, {"type": "text", "content": "0:16:54.7 SC: Okay. I guess I'm just thinking of my typical experience in hospitals, where they're optimizing to try to treat you, not to make it a warm, welcoming environment, right? It's all bright colors and no rugs and nothing very welcoming, and maybe the hospice tries to be a little bit more decorative, aesthetically pleasing.\n\n0:17:19.5 KS: Well, and most hospice care happens in people's homes.\n\n0:17:23.8 SC: Okay.\n\n0:17:24.1 KS: So a lot of people think that you have to go somewhere to be in a hospice, but really, hospice most of the time can come to you.\n\n0:17:31.1 SC: I see. So hospice is a stage in the journey. It's not a place that you go.\n\n0:17:38.6 KS: Exactly. Exactly.\n\n0:17:40.0 SC: Okay, very good. And this is already very educational for me. You mentioned this number, 30% of Americans dying at home. On the one hand, yes, that's less than the 70% who want to. On the other hand, I would have guessed it would have been less than that. Is this something people are making more of an effort? And also, a slightly different question, is that 30% including people who just die by accident, as well as people who have sort of entered this hospice or palliative stage?"}, {"type": "text", "content": "0:18:10.6 KS: Well, definitely that's one of the ways that people cannot end up having the end-of-life care they want. If someone just dies suddenly, they have an accident, lots of ways that this can not be something that we have time to see coming. That's definitely an issue. So in that way, I think it's a privilege to be able to stop and think about these situations, because a lot of times people just don't have any choice at all.\n\n0:18:36.9 SC: Yeah. So, I mean, how quantitative can we be about that? I mean, I literally have no idea how many people see it coming in some sense, versus it's a sudden hit of some disease you hadn't anticipated.\n\n0:18:52.7 KS: So we do know that just over half of Americans, of Medicare beneficiaries who die, are using hospice at the time of their death."}, {"type": "text", "content": "0:19:02.7 SC: Okay.\n\n0:19:03.7 KS: So that's a huge increase. That started from nothing in the '70s to just about half of people. So that is tremendous. That's wonderful. I think the issue that's hanging on is the very short stays. And so the implication of that is that if people assume that healthcare is going to tell you what you need to know when you need to know it, they'll say, \"Hey, it's time for you to consider hospice. There's not much more we can do with treatment.\" The assumption, I think, a lot of people have is that that will happen in a way that you can still attend to items on your bucket list, take your grandkids fishing, or whatever it is. And in reality, people are not getting those referrals until they may be so sick that they're not getting out of bed, they're not talking, they're not eating. And I think people aren't really prepared for that. So I think the short stays are a continuing issue."}, {"type": "text", "content": "0:20:02.1 SC: That's an issue, definitely. And also it leads into the other thing I was going to ask about. You said that once you're at that hospice stage, you've sort of agreed there won't be any attempt to do dramatic medical procedures to prevent you from dying, but presumably there are things that the medical staff does to help manage your pain or just provide you with the necessities.\n\n0:20:31.7 KS: Yes, that's what hospice is really good at. So they're helpful for symptom control, so nausea, pain, breathing issues, these are all kind of common buckets of issues people are dealing with. But that fork in the road, I think, postpones conversations about what people's goals of care are, what their priorities are."}, {"type": "text", "content": "0:20:53.7 SC: Well, I guess let's get into that then. What if... It sounds like the scene has been changing on sort of a generational timescale, going from people die at home to people die in hospitals to now more and more people are in hospice. How much ahead of time should we be planning for this kind of thing?\n\n0:21:17.2 KS: I mean, my answer to that is these conversations should be happening today. And part of the reason for that is that this is not just a situation that affects people who are older or have a serious illness already. One in four people in this country is a caregiver. Caregivers are younger than ever, so we have this huge population of youth caregivers. And all of those people are affected very deeply. Their health, their school, their families, all of these things are affected when people are pulled into that caregiving role. So I think it's never too early to have these conversations."}, {"type": "text", "content": "0:21:54.8 SC: One in four people is an amazingly large number. That surprises me, I guess.\n\n0:22:00.8 KS: It disproportionately affects women and people of color. And our health policies are not really set up to cover a lot of these costs. And so putting someone in a nursing home or memory care or any of these facilities is very expensive, easily $20,000 a month, even $10,000 on the low end, right? So these are very large costs. And when families can't support that kind of cost, you get a lot of this unpaid caregiving work happening.\n\n0:22:34.0 SC: Well, it does seem... You're the sociologist here, but it does seem that it's very expensive to get old, right? Like suddenly, you've done your best, you've saved up a lot of money, and at least here in the US, they're very good at extracting that money from you in your last few years."}, {"type": "text", "content": "0:22:49.2 KS: They're extremely good at it. And so this is a case where, with a lot of this, these are system-level problems. And my book is really trying to show individuals what those system-level issues are and maybe giving you tools to help respond to them. But the source of the problem is really at the system.\n\n0:23:07.9 SC: Yeah.\n\n0:23:08.7 KS: And so our caregiving support policies, I think I would advocate, need to be much stronger. We need to be paying people to help cover these gaps that are in our healthcare system.\n\n0:23:22.4 SC: So from what you said already, it sounds like when I say, \"When should you start planning?\" You say today. And I get that. But it sounds like there's different sort of stages of the planning. Like a perfectly healthy 30-something can plan for what? What would you advocate for the 30-something to plan for?"}, {"type": "text", "content": "0:23:43.0 KS: Well, so a 30-something who's healthy today could definitely be thinking about, like, what does quality of life mean to them? And I think that's a great question to ask when you're healthy, because a lot of times when I talk to people about that, they will immediately jump to, \"I would only be willing to be on life support for X number of days.\" When really, I think there's an opportunity to think about it upstream and be like, if you're healthy today, what made your day good? What were the sights, smells, sounds? Was it having coffee at your own kitchen table in your own clothes? Was it having your dog there or your spouse there? What are those things? And I think that's one really simple baby step for thinking about these things. It doesn't have to be starting with signing all your advance directives and creating a trust. But I think thinking about these things, because then if you are in the throes of a serious illness or someone you care about finds themselves in this washing machine of our healthcare system, it helps if you have that touchstone of things that you've already thought about, about what matters to you."}, {"type": "text", "content": "0:24:52.1 SC: No, that's a great suggestion. I'd never quite thought of it that way. Rather than thinking of it in term
