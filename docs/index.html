 years. I don't care. Whatever it is, in a randomly fluctuating universe, that thing will most often arise as a random fluctuation, not as a sensibly thermodynamic, rigorous evolution from an initially low-entropy state like we think actually happened in our actual universe. So everything is possible. Everything that is allowed by the laws of physics can randomly, in this scenario, can randomly appear. And yeah, it could... You could have false ongoing experiences. You could also have true ongoing experiences. You could fluctuate into something that was much lower entropy than the surrounding chaos and long enough for you to live for whatever time you want and have real experiences, and they'd be perfectly valid."}, {"type": "text", "content": "1:14:44.0 SC: But in addition to that, your extrapolation before the moment that you randomly fluctuated into existence would be wrong in principle. Now, there'd be plenty of fluctuations into things that were sort of kind of brain-like, or kind of observer-like, or kind of whatever, where they didn't think that they had wrong impressions of the world. That in fact is much more likely to not be blessed with these false memories. But that's not the point. The point is that given that we're asking about people who have certain memories, the chances are overwhelmingly large that those memories randomly fluctuated into existence. So don't get hung up on the brains. When it comes to the Boltzmann brain problem, the real problem is for whatever observers you care about, they're most likely to have randomly fluctuated into existence."}, {"type": "text", "content": "1:15:36.4 SC: Chris Kaltwasser says, \"I have an unpopular theory, and that is that the three-point shot should be removed from the NBA. It rewards a less exciting game. Who cares how good somebody is at shooting a long shot? I would rather see some cool plays that involve strategy, great passing, getting inside, that kind of thing. I have yet to do the research, but I don't think the three-point shot actually pays off as often as people think. I feel like players miss them more often than they make them, giving up possession without making a shot that might have taken more strategy but had better odds. What are your thoughts on this topic?\"\n\n1:16:09.8 SC: Well, I think so there's two different issues going here. I mean, you've definitely asked two different questions, but that's okay, we'll allow it this one time. One is what makes for the more exciting game, having a three-point shot or not. And the other is given that there is a three-point shot, what makes for the better strategy, using it or not. As far as the strategy is concerned, I think it is pretty clearly demonstrated that given the rules of the National Basketball Association as they are currently construed, shooting three-point shots is very good, is absolutely a good strategy. I mean, this was Daryl Morey, former Mindscape guest and former president of basketball operations at the Philadelphia 76ers, pioneered this approach very explicitly. Other people have sort of done versions of it, but he really made it very clear: the two best shots you can take are either a shot right next to the rim, a layup or a dunk, or a three-point shot. As you go further away from the rim, but not all the way to the three-point line, your probability of hitting the shot continuously goes down. And then what happens at the three-point line is that even though the probability of hitting the shot keeps going down, suddenly the number of points you get goes up discontinuously. So you get an extra bonus there."}, {"type": "text", "content": "1:17:25.0 SC: And Chris, I think that your intuition was absolutely shared by a large number of people in the NBA, both sort of at the level of coaching and playing in, let's say, the 1980s and '90s. They just didn't shoot a lot of three-pointers because they thought, well, number one, usually you miss. Number two, there's long rebounds and you don't get the rebound and it's just a less effective shot. But since then, people have run the numbers and that's just not true. The benefit you get from hitting the shots, for one thing, we have better shooters now, right? A good three-point shooter will be hovering around 40% of the shots going in, which is lower than the 50% for a good two-point shooter. But guess what? 0.5 times 2 is less than 0.4 times 3. So you get less points per shot for a mediocre two-point shot than for a good three-point shot. So I think that... Of course there's a lot of extra details there. Do you in fact have a lower percentage of offensive rebounds with a three-point shot than a two-point shot? And I think people have worked that out, but I don't know it myself."}, {"type": "text", "content": "1:18:34.4 SC: As far as the interestingness of the game is concerned, I do think, and in fact Daryl Morey has said, that there are too many three-point shots. I mean, he's interested in winning basketball games, so he encourages his players to shoot them, but he would prefer if the rules were changed so that the three-pointer was less dominant than it is now. I can see the arguments for that. I haven't really thought it through myself. It's completely misleading, I think, to people who are not basketball fans to suggest that there's no strategy involved in shooting three-pointers. Everyone knows, both on the offensive side and the defensive side of the ball, that a good open three-point shot is very valuable, and therefore the defense doesn't give that up to you. They will go to great lengths strategically to prevent people from getting uncontested three-pointers."}, {"type": "text", "content": "1:19:27.5 SC: And these days, the level of detail in tracking what happens on the court and converting it into data is very, very high. So we know what percentage of three-point shots are contested or uncontested or open or not open, high-percentage shots, whatever. It's a little bit more likely to hit the shot if you're in the corner of the court rather than at the near mid-court or whatever. They know all of those things. So there's a huge amount of effort that goes into scheming so that your good three-point shooter is left alone, able to shoot without a hand in their face. And you may or may not enjoy that aspect of the strategizing, but it's definitely there.\n\n1:20:07.8 SC: Nikola Ivanov says, \"If cosmic birefringence is conclusively detected, how could we distinguish observationally between a fundamental violation of Lorentz invariance, as explored in your early work, and birefringence caused by an evolving field in a Lorentz-invariant universe?\" So for those of you who have not been following along, cosmic birefringence is this phenomenon you can get whereby a photon traveling through space, photons have polarizations, right? Like if you have polarized sunglasses, it will let in photons that are vibrating up and down, but not right and left. And with birefringence, that direction of polarization rotates as the photon travels through space. Ordinarily, you don't expect that to happen, but various exotic physics effects can cause birefringence in the universe. One of the first was discussed in a paper that I wrote, my first ever published physics paper, with Roman Jackiw and George Field, where we were looking at a theory that violated Lorentz invariance. There was a preferred direction to the universe against which the photons interacted."}, {"type": "text", "content": "1:21:12.6 SC: Now, consistent with what I just said a little while ago, none of us thought that theory was true. In fact, we were kind of horrified by our own theory. We were not saying you should take this seriously as something that's out there. What we're saying is we have this principle called Lorentz invariance: the universe doesn't care how fast you're moving or what direction you're pointing in. But how do you know that physics actually obeys that rule? Well, you know by considering theories that are not Lorentz-invariant and then testing them experimentally. So we put forward a well-defined theory that was not Lorentz-invariant, and we showed how to test it experimentally. But it was just sort of a toy model. And indeed, it became quite a little industry for people to come up with other ways to write down theories that were not Lorentz-invariant and then test them experimentally. So it was a useful paper for that purpose."}, {"type": "text", "content": "1:22:06.7 SC: Now, later I realized that dark energy, there could be, plausibly, a rolling scalar field that fills the universe and makes it accelerate, could also lead to this kind of birefringence effect. And the same experimental results and tests that we talked about would be useful here. And in fact, the spirit of the experimental tests we suggested, but it was Marc Kamionkowski, former Mindscape guest, and his collaborators, who noticed that the cosmic microwave background would be an even better way to test it. So that credit goes to them for that. Now, so this is different, because now you have an independent motivation for caring about this new physics idea. The original idea that we suggested was really just because it was there and you can test it. Now you're explaining something different and predicting on the side as a spinoff that you get this birefringence effect. So I think it's overwhelmingly more likely that if you actually see it, it's caused by an evolving field rather than a Lorentz-violating vector field."}, {"type": "text", "content": "1:23:14.4 SC: But in fact, those two things aren't that different. You have a field that is changing with time, you take its gradient, that is to say the direction and magnitude with which it's varying, and that defines a vector. That's basically exactly the same as the theory that we looked at. It's just that the underlying dynamics are a little bit different. And neither one of those is the only way to explain cosmic birefringence. It could be birefringence that is intrinsic to the early universe, not the late universe. There's lots of different possibilities out there. So it'll be a theoretical and observational playground if any of this turns out to be verified by further observations.\n\n1:23:53.8 SC: Rich Hogg says, \"As one with a strong naturalistic bent, I would tend to think that someone else's supernatural experience was a hallucination or other misfiring of his brain. But I want to keep an open mind while not forgetting that it could happen to me. If I see a ghost tonight, how do I, as a maybe crazy Bayesian, decide whether I should update my priors or make an appointment with a neurologist?\" Well, you're clearly allowed to do both. Look, you should always update your priors. Any data that you get should constantly be causing you to sort of gradually nudge around all of your priors in many cases, but you have to... Sorry, let's back up a little bit. What are we talking about here? A good Bayesian says the probability of a theory being true given some data is proportional to two things. Number one, the prior probability that you thought that theory might have been true. And then number two, the likelihood that you would get that data if that theory were true."}, {"type": "text", "content": "1:24:53.6 SC: And so the prior probability is there, the likelihood function is also there. And so if you see a ghost, the probability of you seeing a ghost is higher on a theory where ghosts really exist than on a theory where ghosts don't exist. So you should increase your credences that ghosts exist, decrease your credence that they don't. But if your priors are so far apart already, if your prior that ghosts don't exist is 0.999999 and prior that ghosts do exist is 0.000001, that update is not going to make much difference. Okay, so don't only think about the likelihood updating, think about the actual value of the priors also. And if it happens again, then you can start updating again, and eventually, this is what a good Bayesian would do, eventually, if you get so much data that is only explained by the supernatural explanation and not by the natural one, then your credences in that explanation should become appreciable one way or another."}, {"type": "text", "content": "1:25:56.6 SC: Michael Bright says, \"Since learning even just a little bit about Einstein's explanation of gravity, I've always been bothered by the cartoon image of a ball on a trampoline. It makes it look like space has a down. If you agree with my frustration, is there a more preferable cartoonish image or set of images in your mind to visualize what spacetime curvature actually is?\" You know, I don't mind the usual cannonball or bowling ball on a trampoline or a rubber sheet or whatever. It's not supposed to be super-duper accurate. All that that is supposed to convey to you is the idea that space can be curved.\n\n1:26:30.1 SC: So there are many ways in which that particular metaphor or analogy are not accurate. Like you say, the most obvious one is there's an up and a down. There's gravity pulling on the bowling ball to stretch the rubber sheet, and that doesn't happen in the real world. So can you do better? You can try. You can try visualizing lines in three dimensions, three-dimensional space, that are distorted or curved by the presence of a massive object. But that's not very accurate either. If you think about... Once you understand the equations, you realize that we say words like spacetime is a unification of space and time, and it's really spacetime that is curved. In fact, the reason why the Earth goes around the sun has a lot more to do with the curvature of time than the curvature of space. Curvature of time is actually not a sensible concept, but the way in which the time coordinate changes from close to the sun or some other gravitating body to far away has more to do with the path that the Earth travels on."}, {"type": "text", "content": "1:27:42.6 SC: So no visualization of the curvature of space all by itself is going to be able to do the job. That's okay. Very often I get asked the more general question, like how do you visualize this or that particular difficult concept? And different people have different visual things in their head. They have lines or curves or shapes or whatever. They have three-dimensional vector spaces, and those stand in for 10 to the 10 to the 10-dimensional vector spaces. But ultimately, the visualizations are not the point. Understanding the concepts and the equations behind them is the point. That's why I wrote Space, Time, and Motion, so that if you care about understanding the equations, you can get those. Sadly, the world is more rich and large and multifaceted than our visualization capacities are really up to."}, {"type": "text", "content": "1:28:35.1 SC: Zach McKinney says, \"The prevailing cultural narrative around AI is one of inevitability and runaway proliferation. However, this chain of reasoning never seems to reckon with the planetary boundaries of finite material resources and energy. On what timescale, if any, do you foresee the proliferation and diffusion of AI to become constrained by such limits?\" Well, look, I'm not sure that is the prevailing cultural narrative. I think that there may not be a prevailing cultural narrative. Different little subcultures have their own narratives, and it depends on which one you're embedded in. But also, again, I'm not sure I mind this runaway proliferation kind of talk as a possible future. I'm not saying that I think it's the likely future, but that talk has to be understood in a certain way. When people talk about exponential growth of anything, they're never being perfectly accurate. Unless you're literally talking about the universe itself, nothing grows exponentially with an unbounded time horizon because there are bounds, there are finite numbers of resources."}, {"type": "text", "content": "1:29:37.5 SC: So if you have the famous S-shaped curve, the sigmoid curve, that is flat and then it starts going up and then it turns over and it's flat again. So that's an approach from one kind of steady-state equilibrium phase to a different steady-state equilibrium phase. In the beginning, at the very start of that transition from the first state to the curve, it looks exponential, right? Every exponential in physical reality is probably going to really be some kind of sigmoid curve or something even more complicated than that. It's just a statement about the initial steps. So extrapolating these ideas to the wild future is not an accurate thing to do, and everyone should know that. Now, having said that, what are the limits? What are the boundaries? What are the limits that we have on resources and energy? That's hard to say. We can always just do some back-of-the-envelope calculation of how much energy we have on Earth, but maybe you're not on Earth. Maybe you're collecting energy elsewhere. So I think that there are factors and considerations that will change the future of AI before, long before we start worrying about the total amount of energy we have available here on Earth."}, {"type": "text", "content": "1:30:53.8 SC: Michael Aster says, \"Since you've talked about how you like the game, how would you feel if Kingdom Rush reached out for a sponsorship on the podcast?\" I'd be thrilled if they did that. I would love it. It's always better. I don't ever advertise things that I think are bad, but often I'm advertising things that I haven't previously experienced and I have to sort of do homework on them. So whenever I get the chance to advertise something that I'm super familiar with and love, then I'm always happy to do that. So yeah, if Kingdom Rush wants me to advertise things, if any watch companies want me to advertise things, if the Philadelphia 76ers want me to advertise season ticket plans, I am more than happy to do that."}, {"type": "text", "content": "1:31:36.5 SC: David Sotalongo says, \"In the April 2023 AMA, you said, 'I think we need to build a lot more housing. I think it is very, very obvious that's the best way to make housing more affordable, to build more of it.' I agree, and I'm curious how you think we should go about building more housing. Should the government step in to build and maybe manage such housing? And what, if anything, would you do about existing homeowners who oppose new housing because it would decrease the value of their property?\"\n\n1:32:01.0 SC: Well, so number one, I have no informed opinion about this. Whatever I say in the next few minutes, don't put a lot of credence on them. I'm not an expert on housing policy, okay? That's not just one of the things that I know a lot about. I do have experience with the kind of limitations, the constraints that are put on homeowners to do different things. When I lived in LA, which we did for a long time, we lived in a townhouse. So it was a group of six homes, and we were in this unusual situation for Los Angeles where we really had almost no outdoor space, right? No yard or even tiny porch or anything like that. And so obviously that was a thing that would have been nice to have. And we had the idea, well, maybe we could save up and put a deck on the roof, a roof deck for the townhouse. Because a flat roof, again LA, you just have a flat roof. You don't need to let the snow fall off your gabled roofs or anything like that."}, {"type": "text", "content": "1:32:59.0 SC: So we looked into it and it was just, we put money into not getting permits, but figuring out how we would be able to get the permits to do this. And eventually we gave up before we even got the permits because it was just clearly going to be too much work. So one thing we can do, that's not even building a house, that's just putting a roof deck on the house that you own. One thing we can do is just go through and make it easier to build housing responsibly. I don't mean remove all regulations and let people build housing that is dangerous or not up to code or whatever. Just grease the wheels, make it easier to do good things for society. And I think that having more housing is a good thing. Make it easier to take existing housing and renovate it and sell it. Just make it easier, because that's not obvious. That's not something that we put a lot of effort into, taking existing sets of regulations and making them just as effective but easier to navigate, right? We're not very good at that as a society or a government."}, {"type": "text", "content": "1:34:01.3 SC: Governments building housing, that's fine. I don't think it's ever the real solution to anything. I think that we want the housing market to be thriving in terms of both people building houses and people buying houses and people selling houses. A house is very often the most expensive transaction that a person ever gets involved with. Of course, many people just rent or whatever, but if you buy a house, that's a huge amount of money. And I don't think it should be that much of a huge amount of money. I think they should be less expensive. Now, like you say, there's a constituency that's against that because they don't want their current home value to go down. So number one, I don't think it's gonna go down that much no matter what we do. Number two, too bad for them. But number three, and most importantly, it's a house. It's not an investment, right? I mean, it's an investment in some technical sense, but the reason why you have it is not primarily to be an investment, it's primarily to live in it."}, {"type": "text", "content": "1:35:06.0 SC: And what happens is if you have a house and its value goes down because the entire housing market is going down, then guess what? If you sell it to buy a new house, that new house's value has also gone down. So I just don't think it's that big of a problem. I mean, unless you're someone who owns multiple houses because you're trying to get investment income from it or something like that, and then, sorry, investments are tricky and unpredictable and that's life. We have to learn how to deal with it.\n\n1:35:38.6 SC: Alan Lubell says, \"Your intelligence and generosity of spirit has really made an impact on me. I'm asking if you feel you received these qualities from your parents or any other influences when growing up, and if you could give a couple of examples.\" That's very sweet. Thank you, Alan. I appreciate the compliments. I usually don't try to read out compliments here. Sometimes they precede a question, but this one was kind of relevant to the question. And I'm not even gonna give a very good answer to the question because on the one hand, yes, I absolutely was influenced by my parents, mostly my mom. My parents got divorced very early, so it was my mom who raised my brother and me. But also other people: friends, teachers, other relatives, other grown-ups who I got to know, and also books that I read and things like that. So I kind of suspect, maybe this is not true for other people, I don't know, but for me, if I tried to associate some quality I have now with the example or influence of some particular person in the past, I probably wouldn't be doing a very accurate job."}, {"type": "text", "content": "1:36:40.9 SC: Like you could imagine that you'd put your finger on it, but I tend to think that, in fact, people are just sort of gradually influenced by many, many, many, many, many things over the years, and it's very hard to pinpoint when there was some crucial influence that made a difference. I don't think it's a matter of one person telling you one little bit of wisdom that changes your life. I think it's a matter of being in the presence of people who live well and try to be good people and implicitly picking up from the atmosphere around you that that's a good way to be. So I still try to learn from the people around me. I try to hang out with people who I admire. There's some point in your life in which you realize, no, it's actually not worth hanging out with these people who are talented or useful in one way but really bad human beings. I would rather hang out with people who are good human beings and maybe that will rub off on me."}, {"type": "text", "content": "1:37:35.0 SC: Miron Mizrahi says, \"In the last AMA, when you discussed neutrino oscillations, you said something that sounded a lot like the uncertainty principle. There is no state when the neutrino has both a definitive mass and definitive flavor. I get how this can work for a single particle or field, but how does it work for three? Or is there one field for all neutrinos and the mass-flavor combinations are just different values of the field?\"\n\n1:37:58.7 SC: Yeah, this is a good question. It's a little bit subtle. I'm not sure whether the answer I give is going to be clarifying or not, but I can try. If you just had a single particle, then you wouldn't have uncertainty about mass and flavor. There's only one flavor and only one mass, right? So it's not a mixture. I think the way I think about it, I'll be honest, I haven't really thought about it in terms of an uncertainty principle, and therefore I think it's not the uncertainty principle. I think there's a different thing going on because I think it would be true even classically is the point. The uncertainty principle is truly a quantum mechanical statement. It's a relationship between observables, like let's say position and momentum, and quantum states. In particular, the usual, the standard, famous, celebrated uncertainty principle is in any quantum state of a single particle, you cannot be highly localized both in position and momentum at the same time."}, {"type": "text", "content": "1:39:03.4 SC: If you define the standard deviation or the variance as delta X and delta p, then delta X times delta p has to be at least h-bar over 2. Okay. So that's a completely quantum mechanical statement. There's no classical analog to that. In the classical particle, I can and often imagine doing, telling you both the position and the momentum precisely. But for quantum mechanics, the notions of position and momentum aren't precisely defined things. They're observables that have different probability distributions of getting different answers. That's not really what's going on with the neutrinos. With the neutrinos, what matters is that they are fields, okay? That they're fundamentally neutrino fields. And even before you quantize them, you can talk about the classical fields. And fields are things that have different values in different points in space."}, {"type": "text", "content": "1:39:53.5 SC: And there are, roughly speaking, three neutrino fields, okay? I say roughly speaking because you can get into, well, do antineutrinos count differently and do different spins count differently? Forget about all that, okay? There's, for our purposes today, three different neutrino fields. And you can rotate them, so these three different neutrino fields form a vector space, which is very similar to quantum mechanics in some ways, but that's just because vector spaces are everywhere. It's not because there's any true intrinsic deep relationship there. So you can think of electron neutrino, muon neutrino, and tau neutrino as basically three axes in the three-dimensional space of the neutrino field. And any one neutrino is a vector, is represented by a vector in that three-dimensional vector space. So that means it has a component that is the electron neutrino component, a muon neutrino component, and a tau neutrino component."}, {"type": "text", "content": "1:40:50.1 SC: And then separately, there's a different set of axes, a different set of basis vectors for the three mass states of the neutrino, which are cleverly named m1, m2, and m3, okay? And the point is that the mass axes are not exactly aligned with the flavor axes. So if you are a state of definite mass, then you're not gonna be a state of definite flavor for exactly the same reasons as if I take a two-dimensional vector space with x and y coordinates and I rotate those coordinates to x-prime and y-prime, a value that is a certain value of x-prime and then zero for y-prime is gonna be a combination of the original x and the original y. So it's really just rotating vectors in field space, nothing intrinsically to do with quantum mechanics or the uncertainty principle."}, {"type": "text", "content": "1:41:45.7 SC: Dylan Samuel says, \"I'm a teaching assistant for a mechanical engineering class, and I'm pretty sure that a very large percentage of the class is using AI to do their homework, as their test scores tend to be vastly worse than their homework scores. Recently, a UC Berkeley professor made news saying they no longer see the point in grading their students' homework. Apologies if you've answered something similar before, but what are your thoughts on this? And generally, how are you adapting to teach with students knowing they'll likely use AI? It seems counterproductive to pay for college and then not learn anything.\"\n\n1:42:15.9 SC: Yeah, this is something where professors are talking about this a lot right now. It's a sea change in how things get done. There were always ways to cheat on homework sets, right? You could work together in ways that the professor told you not to. You could search the internet for maybe this problem had been done before and answered. Now it's just much easier with AI to find the solutions. And so the way that I think about it is, for professors, it was always the case that their goal was to make the students learn things. And for the students, some of them had the goal of learning things, but we gotta be honest, some of them just had the goal of getting good grades because they wanted to get a job or into grad school or medical school or whatever."}, {"type": "text", "content": "1:43:05.0 SC: And the fortunate thing for the professors was that the goal of teaching them things and the goal of them getting good grades happened to line up. The best way for the students to get good grades was to learn things and therefore do well on the homeworks and the tests. So that system was sort of sensible. Nowadays we've broken that connection. If all you do is give out homeworks or take-home exams, which, by the way, before I got to Johns Hopkins, I'd never given an in-class exam before in my life. And it's not Johns Hopkins' fault, it's just I got here around the time that ChatGPT arrived. So I would give out take-home exams, and of course the students could in principle these days do those by using AI. And so you could in principle get very good grades on all those exams without actually learning anything. So therefore you have to change the way that you test people. I still give out problem sets, but the problem sets aren't worth that much of your grade. They're basically very explicitly given out in order for you to practice so that when you take the test, which is in-class, you are prepared for that. And obviously no computers in class or anything like that for the exams."}, {"type": "text", "content": "1:44:23.0 SC: And if the students... I tell the students, look, if you want to use AI to, or for that matter, if you want to collaborate and have friends help you on the problem sets, go ahead. It's your choice, because it's only 20% of your total grade. 80% of the grade is how you do on the exams. And if you're depriving yourself of the practice that you get by actually doing the problem sets yourself, then you're gonna do worse on the exams and you're not gonna get a good grade. So I'm not sure if that's feasible for everybody, depending on the class, depending on what you're doing, but it's the world. You certainly cannot rely on the fact that just because a student is in college, they're gonna do the best thing possible to try to learn things. There are reasons to go to college other than learning things. For many of us, learning things was the point, not for everybody. And you have to accept that and adapt accordingly."}, {"type": "text", "content": "1:45:16.7 SC: Tucker Hyatt says, \"Am I mistaken to interpret Newton's second law to include the notion that forces cause accelerations, and to want something similarly causal in a quantum field theory worldview? Please don't make me give up on causality.\" So you should give up on causality, Tucker. Sorry about that. At the level of fundamental physics, causality is not there. In fact, this was the subject of a famous article and quote by Bertrand Russell, of all people, over 100 years ago. He was pointing out that causality used to be something that philosophers hung on to with great fondness, but that's just not how the world works at the level of fundamental physics. And he was talking long before quantum mechanics or quantum field theory. So some people say that quantum mechanics and the Born rule and wave function collapse undermine causality, but no, it was already not there."}, {"type": "text", "content": "1:46:10.0 SC: But that doesn't mean that all hell is breaking loose. It doesn't mean anything can happen. There are still laws of physics. It's just that the laws of physics do not take a kind of Aristotelian form. In an Aristotelian view, you might very well be tempted to say there's an acceleration and there's a force, and the force is the cause of the acceleration. But that's not what Newtonian mechanics says. Newtonian mechanics says the amount of force at any one time is equal to the mass of the object times the acceleration. Period. It doesn't say that one causes the other or anything like that. It doesn't say that force divided by acceleration causes mass. Okay? The word \"cause\" just doesn't appear. Sometimes in a book on relativity or quantum field theory, you will find a discussion of causality, but it's really not about causality in the usual Aristotelian sense. It's just a discussion of how signals travel inside light cones and not outside light cones. So they've repurposed the word \"causality\" to mean things move slower or equal to the speed of light."}, {"type": "text", "content": "1:47:17.1 SC: And all that's fine. Of course, notions that were introduced 2,500 years ago aren't necessarily gonna be the right way to talk about the world once you learn more about it. And also, of course, the notion of cause and effect is super useful and important in the macroscopic emergent world. There's a whole chapter in the new upcoming book on complexity and emergence, Volume 3 of The Biggest Ideas, where we talk about causation and we talk about Judea Pearl, former Mindscape guest, and his notion of the do-operator and its implementation in what are called Bayesian networks. So, of course there are causes and effects in the world, just like there's consciousness and free will and tables and chairs and temperatures and pressures. Okay? None of those exist at the fundamental level, but they're very real at the emergent level, and that's fine."}, {"type": "text", "content": "1:48:10.7 SC: Matt Patterson says, \"I'm an avid Mindscape follower, and I was intrigued by your discussion with Jenann Ismael on her and her philosophical argument about why it's okay to kill cows but not humans based on their value. Value in this case being measured by one's memory of one's life, having plans for one's future, as well as these same items in others that one has influenced, et cetera. For cows, this kind of value is essentially zero, and for humans it is much greater. It occurred to me that the value of individual humans can vary over a wide range and might even be negative, e.g., in the case of a serial killer. Given that thoughtful humans do decide to kill other humans, it seems that considering the value of those that would die might be one of those considerations in evaluating the moral rightness or wrongness in making such a decision. My question is, do you think that the value of potential death victims should be one of the considerations when assessing the morality of decisions to kill them, or is there some moral or other objection to this idea?\""}, {"type": "text", "content": "1:49:08.1 SC: Well, yeah, I think that there's a lot going on here, and we're not gonna give the definitive answer right now. I'm not even claiming to know what the definitive answer should be. Of course, in practice, when there are situations, hopefully it never arises for you, it has never arisen for me, but when there are situations in which you are deciding whether to kill somebody or not, there are considerations about what kind of person that is. Like, is this a person who just broke into your house and is threatening to kill your family? Then you might have some considerations. Is this a person who is waiting too long to go after the light turned green in front of you on the road? That's a different set of considerations, right?"}, {"type": "text", "content": "1:49:50.5 SC: So maybe your considerations are no one ever should be killed, there should be an absolute right to continued existence. And in terms of the criminal justice system, that would be my view. I do not believe in the death penalty. I don't think that people should be put to death. Mostly for me, that's a matter of practice rather than principle. I don't think that there is some metaphysical absolute right to be living. I think that it is extremely difficult to effectively figure out who doesn't deserve to be living and to carry that out. And certainly the actual government and the actual criminal justice system, I don't think is very good at that. And it's an irreversible decision, so I don't want them making it at all. So I just don't want there to be the death penalty."}, {"type": "text", "content": "1:50:35.7 SC: There are wars, and you might be against war, but maybe the other side is not against war and they invade you. What are you gonna do? You just gonna lie down, or are you gonna fight back? I'm in favor of fighting back if you get invaded. I think that we have far more wars than we should, but I'm not gonna pretend that I'm gonna have a principled moral point of view that says, \"I would just never participate in a war no matter what the circumstances were.\" And when you do participate in a war, there's absolutely considerations of you should try not to hurt civilians. There are other people who are enemy combatants, and that's a different story. And nevertheless, they also have some rights. People have thought about this a great deal. So I do think that all of these are complicated. And more importantly, it's okay to say that it's complicated. You don't need a simple once-and-for-all rule. You can understand that these are gray areas and try to do your best."}, {"type": "text", "content": "1:51:33.2 SC: Karoli Kanter says, \"How likely do you think it is that the observable universe is such a minuscule part of the total universe that our observations are just local phenomena and say little of use about the whole?\"\n\n1:51:46.8 SC: Well, I truly don't know whether our observable universe is a tiny fraction of the whole universe or is most or all of it. I'm very plausibly... I'm open to scenarios of either kind. This is, again, something I think we should be humble about. We should explore the different possibilities. I am skeptical of the worry that local phenomena allow us to say little of use about the whole. Even if the universe we see is only a tiny fraction of the whole, it's still pretty big, right? Hundreds of billions of galaxies, many millions, billions of light-years across, et cetera. And there is absolutely remarkably uniform behavior of the physical universe over this vast stretch of space and time. We can test that very quantitatively, right? We can use things like primordial nucleosynthesis and the current abundances of light elements in intergalactic space to say that things like the mass of the proton and the neutron and the charge of the electron were the same three minutes after the Big Bang as they are now to within a very tiny error bar. Likewise, those quantities and the laws of physics underlying them seem to be exactly the same in quasars billions of light-years away as they are now, et cetera., et cetera."}, {"type": "text", "content": "1:53:09.4 SC: So I think that given the uniformity of the laws that we observe in the universe that we do observe, it's perfectly reasonable to imagine that some kind of uniformity extends across the whole universe, no matter how big it is. That uniformity might not be simple. In other words, it might not just be, oh, the mass of the electron and the proton and neutron are exactly the same everywhere. Maybe that's true, maybe it's not. We have scenarios in which either one of those is correct. But even if the actual values of the parameters you measure differ from place to place, they can still be reflections of uniform underlying laws. It's just like water can be liquid or vapor or solid, right? It's just a different manifestation of the same underlying stuff."}, {"type": "text", "content": "1:53:56.5 SC: That might not be right. So it's conceivable that outside the universe we observe, there are laws or there are conditions that bear precisely no relationship to what we observe in the universe around us. But I would say, number one, there's no reason to think that. There's no empirical reason, there's no puzzle that we solve by imagining that's true. And number two, this uniformity that we do have observed gives us some credence that some kind of uniformity extends even further. So as to how big the universe is, I have no idea. As to how much we learn about it by studying the little bit that we see, I think we can learn potentially quite a bit.\n\n1:54:37.9 SC: In fact, let me add to that a little bit. There's a very real sense in which everything that we know about the laws of physics has been learned by human beings here on Earth over the past few thousand years. So in both space and time, the extent that human beings have actually prodded the natural world is really, really, really tiny. So the fact that we can make accurate predictions about things far away in both space and time is remarkable and I think is okay to lead us to conclude that there's a good chance that there is something learnable, intelligible about the world."}, {"type": "text", "content": "1:55:17.8 SC: Kelvin Firth says, \"In mad-dog Everettian quantum mechanics, where there's a single wave function of the universe that evolves with time according to some Hamiltonian, what exactly is that Hamiltonian or where does it come from? In what I've learned so far as a beginning physics grad student, the Hamiltonian comes from some potential which is usually classical looking, or at least it's a function of space. However, in the Mad-Dog Everettian picture, I take it that space is emergent. So where does the Hamiltonian come from? Where does it live?\"\n\n1:55:44.1 SC: Well, the idea is the Hamiltonian is the laws of physics. It is defining the universe. It doesn't come from anywhere else, right? This is always true in anyone's version of the complete theory of physics. There has to be a starting point. There has to be, \"Okay, here's the theory,\" right? In Mad-Dog Everettianism, the theory is, here's the Hamiltonian, and in fact, the Hamiltonian is simply specified by a list of energy eigenvalues, the spectrum of the Hamiltonian. Why is it the way it is? I don't know. So it's completely possible to me that it just is that way. It's also possible to me that just like we only see some branches of the wave function, we only see some parts of the Hamiltonian, and maybe the parts that we see are chosen by some anthropic reasoning, right? That this is the part of the Hamiltonian where human beings can exist. I don't know, but I would deny that I need to know. At some point, asking questions like this leads you to say, \"That's just the way it is.\""}, {"type": "text", "content": "1:56:47.0 SC: Felivel Camilo says, \"Do you believe technologies such as large language models or realistic image generation arrived at an inappropriate moment? Might humanity have benefited more from developing them only after achieving some form of enlightenment?\"\n\n1:57:01.8 SC: Well, no, I don't really think that humanity is on a trajectory to enlightenment. Maybe individual humans would achieve enlightenment more frequently if they lived for a few tens of thousands of years. But we keep making new human beings, and overall, I don't see much evidence that as a species, we are achieving some form of enlightenment. In many ways, as a species, we're getting better. I'm not trying to be too curmudgeonly about it. I do think that we treat each other better now, on average, than we did a few thousand years ago, but we still treat each other very, very, very badly in some ways. Both of those statements can be true at the same time. And I think that if you're waiting for us to achieve enlightenment before developing very advanced technologies, you're gonna be disappointed. And so I don't even think that's worth waiting for. Maybe these technologies will help us achieve enlightenment or anyway get better at it than we are now."}, {"type": "text", "content": "1:58:00.3 SC: Redlinks says, \"What is your position about AI successionism? The idea that if machines will become conscious, it would be ethically right to let them replace humanity?\" Well, I think that idea is extremely silly. I'm sorry. I do believe that AIs might become conscious. We've talked about it on the podcast. We've talked with people like Ned Block and Anil Seth who are skeptical that AIs could ever achieve consciousness, but other people like Stuart Russell, who I think believe otherwise. But why in the world would you say even if. So that's a good question all by itself. What does it mean for AIs to be conscious? Can they ever get there? What should we do if they do get there? Why in the world would you then say they should replace humans? I don't even see what the motivation for that is. I suspect, I'm not very familiar with this line of thought, so maybe I'm missing something deep, I suspect it's the usual overly anthropomorphic oversimplification of humanness or consciousness or intelligence that is endemic in certain communities that talk about AI."}, {"type": "text", "content": "1:59:10.2 SC: They act as if there's just a scale, a linear scale of intelligence or value or whatever, and we have a chance to be on top of it for the moment, but then AI is gonna pass us and then we're gonna be like puppies and kittens to the AI. I just don't think that's how it is, right? I think that whatever value human beings have morally or intrinsically or whatever, they will have just that much value even if the AIs become conscious. So it's okay to have two different species that are both conscious and can live together. I don't see any problem with that. So no one has given me any even vaguely persuasive argument in favor of something like AI successionism.\n\n1:59:52.1 SC: Edwin Miles says, \"I've been wondering recently about values and wanted to ask the following. Is the value of something only and always contingent on there being something or someone to value it? Or is there some intrinsic value to something separate to any human bias, preference, or valuation, et cetera.?\" Well, this is the kind of thing the philosophers talk about. There are value theorists. That's literally a job description. Okay, I'm not a value theorist, so I'm not here to give you the final answer. I don't want to say that values are necessarily reliant on there being someone or something to value it. I would say that values are parts of relations. They're not intrinsic to the thing. So if I have a cube of material, 1 kg of something, what is its value? Well, that depends on not only what material you have, but what other things there are in the universe that might make use of that material or might care about it. I'm not someone who thinks that value is always necessarily pragmatic. I think a work of art can be very valuable or even a little artifact that is just of sentimental value to you. Those can be valuable to you, and the value is different to you than to somebody else. I think that's fine."}, {"type": "text", "content": "2:01:12.7 SC: But it depends on the relationship to something, usually a person or something that can actually assign a value. I think the bigger lesson here or the bigger picture thing is we use words like value in our everyday life, and we know what we mean. And it's very, very common, once you get to a more careful consideration of the meanings of the words, like we do in philosophy, to realize that what we thought was a perfectly sensible concept in our everyday life doesn't serve that purpose or have that status in a more careful way of thinking about it, like free will, for example. And in those cases, I generally would like to say, in the context you're talking, think about what it is you mean. And if there's some word that you're trying to define and that definition is actually getting in the way of thinking clearly about what it is you're trying to do, then pick another word or try to talk without using that word at all."}, {"type": "text", "content": "2:02:08.6 SC: Scott says, \"Do Feynman diagrams have ontic content or are they purely computational? I understand that all we measure are scattering amplitudes, not full histories of particle interactions that Feynman diagrams might visually imply. But it seems that among working physicists, these diagrams are essential vocabulary for discussing and visualizing processes. It makes me think that there is more to them.\"\n\n2:02:32.9 SC: Well, I think this is a good question because I think the truth is in between a little bit. Certainly you shouldn't take Feynman diagrams exactly literally. And I think that's already obvious from the definition of what a Feynman diagram is. The point of a Feynman diagram is that every diagram represents one term in a sum. You add up the contributions from many, many Feynman diagrams, typically an infinite number, to get the answer to a question like, what is the probability these two particles will hit and annihilate each other or scatter in some other way? So the process, whatever it is, has some particles coming in and some particles going out, and an infinite number of Feynman diagrams that you use to calculate the likelihood of that process happening. So how in the world could we attach individual ontological content to the individual Feynman diagrams that are in the sum? It's like saying if I have the number 10, I could write that as 5+5 or 3+7. There's no one right way to decompose it in that way."}, {"type": "text", "content": "2:03:40.9 SC: And indeed, at a very down-to-earth technical way, that can be the case in Feynman diagrams. There can be different ways of calculating the same process and getting the same answer that have different sets of Feynman diagrams appearing. Now, having said that, you're also right that particle physicists talk as if they're real all the time. And that's because particle physicists are finite, calculationally bounded, rational beings, and it's helpful to think of those processes represented by the diagrams as really happening. Why is it helpful? Well, it helps you see what processes can happen and can't happen. And by doing a little bit more analysis of the individual diagrams, you can even get a rough idea for how likely something is. And sometimes you can be surprised; there can be secret cancellations. That was a big deal in the '70s when all this was being worked out. So it's helpful, but it's not the final answer. The final answer is the actual process that is going on."}, {"type": "text", "content": "2:04:38.0 SC: And of course, really the process is a process involving fields, not particles at all. So I think it's okay. Just like in quantum field theory at all, in Quanta and Fields, I try to make the point it's okay to talk about particles. Particles are not fundamental. Fields are fundamental, and particles are vibrations in them. But that's not to say you can't talk about particles. You can talk about particles if it gives you insight and helps you understand what's gonna happen. I think Feynman diagrams are exactly the same way.\n\n2:05:11.6 SC: Okay, I'm gonna group two questions together. One's from David Guderian, who says, \"Could you please talk about pointer states? Which aspects of them are already explained and understood by the physics community, and which aspects still await an explanation? You once mentioned that finding the classical world is still an open question in the Many-Worlds Interpretation.\" And then Henry Jacobs says, \"On the question of why do we never observe a superposition, is it plausible that observing always involves large systems becoming entangled with the small systems of quantum spin or whatever, and we don't consider the system observed until it has evolved into one of the eigenstates? This seems circular, but I don't know if that's a bad thing.\""}, {"type": "text", "content": "2:05:49.1 SC: So yeah, for Henry's question, we're gonna answer it in part by answering David's question. So the idea here of a pointer state is a state of a quantum system that basically can resist becoming additionally entangled with the world. So the classic example here is Schrödinger's cat, okay? Imagine you take the cat, you put it into a superposition of awake and asleep. The important thing is not whether the cat's asleep. The important thing is that it is a macroscopically distinguishable superposition. In particular, we're imagining here that the awake cat is up and walking around, and the asleep cat is lying down on the floor. And what happens is the photons in the box or the air molecules in the box, et cetera., bump into these two parts of the cat state differently. So they might bump into the awake cat but miss the asleep cat, or vice versa. And what that means is that the quantum state of the air molecules and the photons, et cetera., becomes entangled with the quantum state of the cat. So you have an entangled superposition of the cat awake and asleep, plus the environment, as we call it. And basically, we can call it the part of the environment that observed the cat to be awake and the part of the environment that observed the cat to be asleep."}, {"type": "text", "content": "2:07:09.0 SC: Now, nothing observed anything there, right? That is not a human conscious observer that we're talking about, but that's essentially what we mean from the Many-Worlds point of view about when a measurement occurs: when the quantum system has become entangled with its environment. But then the extra thing that is important here is that once you focus in on a single branch of the wavefunction, a branch where the cat is awake, for example, that cat still interacts with the air in the box and the photons in the box, et cetera., and the floor and whatever, but it doesn't additionally become entangled because every air molecule, let's just say in the box, interacts with the cat in the same way. When the cat was in a superposition of awake and asleep, the air molecule would interact differently with the cat depending on which part of the wavefunction we talked about. But once you're in just the awake part, every molecule either does or does not interact with the cat in exactly the same way. That's a pointer state."}, {"type": "text", "content": "2:08:13.4 SC: A pointer state is one where you can interact with the outside world without becoming additionally entangled. Pointer states are robust to being measured, to being monitored, as we say, by the environment that they're in. How well do we understand pointer states? We understand them pretty well. When I talk about the need for a better understanding of finding the classical world in Many-Worlds, I'm sort of assuming that... Well, I'm taking a step back and imagining we don't even know the laws of physics. Okay? What are... We know the laws of physics are quantum mechanical, but we might not know the specific Hamiltonian or forces or fields of the world or whatever. And I'm asking the general question: under what circumstances is there something that you would recognize as a classical limit of that situation?"}, {"type": "text", "content": "2:09:04.6 SC: But if you have a world where... If you have a situation, a setup, a theoretical playground where you know the laws of physics, which is actually much more common than what I think about, so you already have the situation, you have a cat, you have a box, you have photons, you know how they interact with each other, then people like Zurek and even going back further than that, Joos and Zeh and others and Gell-Mann and Hartle, they all worked out the basic story of decoherence and how it works and therefore what states are the pointer states. So I think that's mostly understood. There's absolutely still work to be done in dotting the i's, crossing the t's, et cetera., but it's pretty much worked out."}, {"type": "text", "content": "2:09:46.1 SC: Now, to Henry's question: why do we never observe a superposition? It's basically because once you're in that pointer state, you can interact with the other molecules in your body, et cetera., but if you were in a superposition that is entangled with its environment, then because of decoherence, basically, the part of the superposition that is in one branch doesn't ever interact with the part of the superposition that is in the other branch. So this is Everett's genius move. He says you are not the superposition of two different parts of your body, two different parts of the wavefunction of your body; you are just one of them. And when the wavefunction branches via decoherence, there's a pointer state that has you thinking one thing, a different pointer state that has you thinking another thing, and you should identify each of them as separate observers. So you're never a superposition, you never observe a superposition, because both you and the thing you observe are pointer states on single branches."}, {"type": "text", "content": "2:10:51.3 SC: And it's not circular, actually. There is some philosophy involved in finding yourself in the wavefunction, figuring out which part of the formalism describes you as a human being, but we can do that. That's okay. We have the capability of doing that, and we figure it out. In this way of thinking about things, what you mean by a measurement is decoherence. What you mean by a measurement is when the quantum mechanical system becomes entangled with its environment.\n\n2:11:21.6 SC: Okay. Daniel Zaccariello says, \"Baseball has no clock. Outs are its time, and its rulebook forces an exact conservation law. Every batter ends the inning as an out, a run, or a man left on base. Physics derives its conservation laws from the form of its rules, too, except it has to guess the rules. Is that the only difference?\""}, {"type": "text", "content": "2:11:43.9 SC: So I'd like the attempt to make an analogy here between baseball and the laws of physics in the realm of conservation laws, but I'm not sure I see how it works. I would not say that baseball has any conservation laws. A conservation law is to say that there is some quantity that you can calculate from the configuration of a system, like its sets of positions and velocities or whatever, which remains constant, unchanging over time. So if there was some thing that remained constant over time in a baseball game, that would be a conservation law. But the fact that every batter ends the inning on one of three possible, definitely known configurations, that's not a conservation law, because the inning does end. And if the batter is, let's say, on base, then the inning ends and the batter is no longer on base. There's no quantity that you can really point to that is the same from moment to moment."}, {"type": "text", "content": "2:12:42.7 SC: But the underlying ambition, I think, is completely correct. When you have some rules, whether it's physics or baseball, you can often, or at least you can try to find things that are invariant or conserved or always the same for everybody, no matter what specific implementation, no matter which game or physics experiment it is that you're looking at.\n\n2:13:05.3 SC: So Anonymous now says, \"If you were starting over today, what assumption in our current formulation of quantum theory would you be most inclined to question? Not because it's demonstrably wrong, but because removing it might open a genuinely new direction.\"\n\n2:13:20.3 SC: Well, I wouldn't, to be perfectly honest. If you absolutely want to know what I truly think, this is something that is an open question. Is quantum theory itself something we should consider modifying for whatever reason? I have friends, my colleagues at Johns Hopkins, David Kaplan and Surjeet Rajendran, are actively investigating modifications of quantum mechanics. And their motivation for doing that is they think by modifying quantum mechanics a little bit, they can help explain some important weird things about known physics, like the hierarchy problem or whatever. There are additional motivations for modifying quantum mechanics. Nadiia Diachenko, my student, who you know from the quantum cyclic universe paper, has been looking into the emergence of time. And there are certain setups, not universal, but certain setups in which when time emerges, the equation governing time evolution is not precisely the Schrödinger equation. It can be modified a little bit."}, {"type": "text", "content": "2:14:24.0 SC: So there are some motivations for doing that. But look, life is finite. You have to pick and choose what you do with your time. And for me, my impression is that physics, physicists, the field of physics has not done nearly enough to explore the implications and the workings of regular old quantum mechanics. So that's why I'm doing things like how does time emerge, how does space emerge, things like that, from good old ordinary quantum mechanics, because I think that we might get some surprises there that also bear on interesting, important questions that we already recognize are out there.\n\n2:15:01.7 SC: So quantum theory itself doesn't have that many assumptions. Now, you might be asking about formulations of quantum field theory and things like that, specific models that we have of the universe within the broad umbrella framework of quantum mechanics. Now, those are very, very questionable. There's all sorts of assumptions that we can try to think of and imagine changing. The most obvious ones, again, in the framework of quantum field theory itself, are the assumptions of locality and Lorentz invariance, the idea that fields take definite values, classically, they take definite values at different positions of space and moments of time, and then you quantize that theory to get the theory you're looking for. Indeed, I would say there, there's plenty of motivation for undoing those cherished assumptions from quantum gravity. Quantum gravity doesn't really work that way. So locality in particular is something that I would absolutely start questioning and have and am thinking about right now. So we'll see whether or not that actually helps anybody with anything."}, {"type": "text", "content": "2:16:09.0 SC: Daniel Shulman says, \"It seems to be accepted dogma that singularities exist inside black holes and sometime just before the Big Bang. If we treat spacetime as having torsion instead of zero torsion, we get Einstein-Cartan gravity, which looks exactly like GR except at the small scales where singularities matter, and the repulsive forces from the torsion in Einstein-Cartan gravity eliminates those singularities. Is it just a historical accident that Einstein didn't know enough geometry to introduce torsion, that we still believe in singularities? Or is there a reason why physicists don't give more credence to Einstein-Cartan gravity?\"\n\n2:16:45.0 SC: Yeah, so for those of you who are not experts in general relativity, there's an alternative to, alternative formulation, let's call it that, of gravity called Einstein-Cartan gravity rather than ordinary general relativity. And the thing is, again, if you read, I do have a book on this, if you read Space, Time, and Motion, this explains to you that there is a metric in general relativity, and that's the thing on which everything else is based. The metric tells you the distances between points along lines and things like that. There's also a notion of what is called parallel transport. So I can take a vector, remember we were talking about the polarization of light before being rotated by birefringence? Well, there's some way in any given geometry of spacetime to take a vector, like the polarization vector of a photon, and move it through spacetime while keeping it parallel. You need to define that somehow. This is carried out by something called a connection. And in general relativity, you derive the connection from the metric, because you derive everything from the metric. And this all goes back to Riemann in the mid-19th century. He's the one who suggested doing this."}, {"type": "text", "content": "2:17:56.5 SC: It was people like Levi-Civita and Christoffel who actually worked it out, the connection between, the connection, as it were, between the metric and the connection. Cartan comes along. He's another famous mathematician, and he emphasizes that in principle, you can have a connection by itself, or a connection in addition to the metric. You don't need to derive the connection from the metric. You could treat those as two separate things. And this naturally leads for the connection to have new degrees of freedom, new things it can do. And one of the major things that pops out is what's called the torsion, sometimes called the torsion tensor. And that's math. Okay, I'm trying to be very clear about what the idea here is, because math is not the same as physics. So there is an idea called Einstein-Cartan gravity, which is physics, but just the math doesn't determine the physics. The fact that you have proposed that the torsion could be separate, that the connection could be separate from the metric, does not uniquely pick out what the physical theory that uses that fact might be. I'm mentioning that because it'll become important in a second."}, {"type": "text", "content": "2:19:07.0 SC: So there is a sort of standard version of Einstein-Cartan gravity, and it doesn't introduce any new particles or dynamical fields. It just sort of changes the relationship between some of the existing fields. And people showed a while ago, like at least in the '70s, that under certain circumstances that can lead to a repulsive kind of force that might arguably get rid of certain singularities in general relativity. However, don't get too excited by that. It doesn't get rid of all the singularities. There's no theorem that says it does. And honestly, there's two huge problems with Einstein-Cartan gravity. Number one is it's not a theory of gravity. Gravity is exactly the same in this theory. It's a theory that modifies the behavior of the matter in the gravitational theory. But the left-hand side of Einstein's equation, the one that has all the tensors describing the curvature of spacetime in it, those remain unchanged in Einstein-Cartan gravity."}, {"type": "text", "content": "2:20:04.0 SC: Basically there is a torsion tensor, but it's non-dynamical, so you can sort of eliminate it by a clever change of variables. And all you're doing is adding new terms to the way that the matter fields enter the Einstein equations. So it's kind of just a rewriting of good old gravity with certain modifications of the matter side. The other thing about Einstein-Cartan gravity is if you care so much about torsion, if you really think that the connection should be independent of the metric, then you might as well make it dynamical, right? I mean, if it exists, then it's playing an important role. Why in the world would you just not add extra terms that let it propagate so that you need to specify the value of the torsion in addition to the value of the metric? These are called dynamical torsion theories or connection dynamic theories. And the thing is that there's still a quantum field theory, right? Everything should still obey the rules of quantum field theory."}, {"type": "text", "content": "2:21:02.8 SC: So I mention all this because when I was young, I was super interested in these theories. I thought it was very exciting to take a different geometric point of view on general relativity. But I also knew enough quantum field theory to know that you should treat it like a quantum field and do effective field theory. And the thing is, unlike, this is the crucial part, unlike the metric, which has certain symmetries, which means when you quantize the metric, its mass is zero. Okay? So the propagation of gravitational waves goes at the speed of light because they have zero mass. That's not true for the torsion tensor. There's no reason at all for the torsion to have zero mass. It's very easy to give it a mass parameter. That's completely consistent with all the symmetries and all the geometric origin of the theory, et cetera."}, {"type": "text", "content": "2:21:48.6 SC: Indeed, there's no reason not to give it a very large mass. And you would expect that its mass would generally become quite large, and therefore it would be like up at the Planck scale or something. And if it couples to other matter fields, it would quickly decay into other things. There's no reason just in the nature of torsion itself for it to give rise to a long-range force of any sort. So I actually wrote a paper with George Field pointing this out. And for our purposes, we're basically concluding we shouldn't have been excited by torsion all along. It's actually just not that interesting from a particle physics point of view.\n\n2:22:26.7 SC: Matt Becker says, \"Do you enjoy gardening or have any other outdoor hobbies?\" Short answer is no. I do have hobbies. I don't even have that many hobbies. My hobbies are happening right now. Podcasting is my hobby. Thinking about the world is my hobby, for the most part. As you all know, I also do other things. The hobby that I'm cultivating more than any other one right now, other than those obvious ones, is cooking, actually. I'm getting into cooking now that we own our own house and we have a kitchen that is big enough. And I like cooking. It's the closest I will ever come to being an experimental scientist. You don't want me in a laboratory doing real experiments, but I can chop some vegetables and things like that."}, {"type": "text", "content": "2:23:11.1 SC: Outdoor hobbies? No, not so much. I've never really lived in an environment since I was a kid where there was an outdoor to have a hobby. Like I said, my LA place did not have any outdoor space. So maybe I'm going to try... I'm trying to convince Jennifer that maybe she wants to start to take up herb gardening or something like that so that I will have fresh herbs for my cooking adventures. That's the closest I can come.\n\n2:23:33.0 SC: Jeroen says, \"Do you think that there are interesting dynamics in quantum theory that can be underexplored because they don't map well onto particles?\" I don't think that's exactly right. So to reiterate something I briefly said earlier in this AMA, when you have a quantum field theory, you quantize it, it looks like particles. That's a little bit quick, what I just said. Under the right circumstances, it looks like particles. Like gluons never look like particles because they're stuck inside strongly interacting particles. So really what you mean by a particle is a freely propagating particle, or at least one that doesn't interact strongly with its environment, and gluons are never those."}, {"type": "text", "content": "2:24:16.2 SC: Sometimes people draw Feynman diagrams to represent gluons and quarks inside a proton or neutron, but they're not at all accurate or representative of what's going on. Again, as I say in the book Quanta and Fields, inside a strongly interacting particle, you have to think about it in terms of fields rather than in terms of particles. That's why the Compton wavelength of a quark can be much bigger than the actual size of a proton, because it's really not a particle inside the proton. So Jeroen is correct in the implication that maybe when we think about quantum field theory, we too quickly go to the particle language, since it is often very convenient, right? When we talk about electrons or protons or neutrons, or for that matter, photons or neutrinos, talking about particles is completely okay."}, {"type": "text", "content": "2:25:10.2 SC: But there are other circumstances when it's not okay, so you might well ask, are there cases that are underexplored because they don't map well onto particles? I think that an honest answer is that when we talk to non-physicists, when we explain what we're doing, particle physics, standard model, Higgs boson, all that kind of stuff, it's just much more easy and tangible to talk about particles than it is to talk about fields. Okay? People know what you mean when you say particle; they don't necessarily know what you mean when you say field. And when you measure something in the Large Hadron Collider, for example, you see tracks as if what you're looking at are particles, not fields."}, {"type": "text", "content": "2:25:51.5 SC: So the particle language is both vivid and correct in a certain regime. But the professional physicists who are thinking about this stuff aren't trapped by that particular aspect of quantum field theory. They know that it's really fields, and they think about the fieldness of it all the time. Like I said, inside a proton or neutron, or for as a very vivid example, the Higgs field, okay, filling space and having an expectation value that gives mass to other particles, that's entirely a field phenomenon. There are even more subtle phenomena in the strong interactions where the topology of the field configurations is super important for understanding observable physics. So I would say that the real physicists actually do think about the field nature of quantum fields quite a bit."}, {"type": "text", "content": "2:26:42.7 SC: Mr. G says, \"It was recently reported by Sludge that former podcast guest...\" Why do they call it Sludge? You know, we used to have things like Newsweek and the New York Times, and now we have Sludge doing reporting. Okay, anyway, I'm getting old. \"It was recently reported by Sludge that former podcast guest Cornel West's 2024 presidential campaign was indirectly funded by Elon Musk through the Interstate Priorities Election Fund. While it's not clear that West knew of this involvement, it's difficult to reconcile with the purportedly pro-democracy rhetoric of someone like West with the practical effects of his and similar ostensibly pro-democracy political actors' actions working against American democracy. How should liberals act towards those who claim to support democracy but actively work against it?\""}, {"type": "text", "content": "2:27:32.4 SC: Well, I think we should be honest. Look, I think that Cornel West's presidential campaign was just silly. It was never serious. Maybe he took it seriously, but it was never something that had any traction or any realistic chance of affecting the race in any way. I did see the story, but I don't know the details about the funding sources. I'm very, very open to the fact, without having any actual knowledge one way or the other, that he might have received support from some political action campaign without being 100% aware of what the ultimate donors to that political action campaign were. And maybe some part of that, if that's true, maybe some part of that is a little bit of negligence on his part. But also the Supreme Court and Congress have made it very easy to hide the ultimate sources of money in these campaigns."}, {"type": "text", "content": "2:28:24.2 SC: So I find it completely plausible that he would just have no idea, not that he was trying to act cagey about it or anything like that. I don't like to phrase it as an action working against American democracy. I mean, he might have been ultimately the only effect of what he did. If he did get more votes, he might have siphoned votes off of the Democrats and therefore given Republicans a bigger chance of doing well. That might have been a possible thing, but that's not anti-democracy; that's just anti-one political party. Okay? So I do think that the rules should be very different. I think that we should be much more transparent about where money comes from, and I think that people should not run what are essentially vanity campaigns for president. I think that voting for president and choosing our leaders is too important to do that. But I don't know the details of who knew what when in this particular case, and I don't think that thinking of it as anti-democracy is the right framing, quite."}, {"type": "text", "content": "2:29:25.6 SC: Rob Butler says, \"If a potential solution to the fine-tuning problem is a multiverse, and if they all expand like ours, what prevents the universes from expanding into each other? If they had different laws of physics, would they interact or rather pass by like ships in the night?\" Here's a case where the language is just getting in our way, and I apologize on the behalf of cosmologists everywhere for the bad way in which we use language. When we talk about the cosmological multiverse, the multiverse that may very well play a role in accounting for the apparent fine-tuning of parameters and laws of nature, they're not really different universes. That's just bad language. They're different parts of our universe, parts that are far away. And they don't pass by; they're just far away. What prevents them from expanding into each other is just the simple fact of non-Euclidean geometry. They don't expand in a pre-existing space. They both expand as part of the procedure, the feature that space itself is expanding all the time. Forget about the multiverse. If you just have a single expanding universe, it's not expanding into anything at all. The amount of space is increasing; the volume of space is getting bigger."}, {"type": "text", "content": "2:30:45.3 SC: Same thing is true for the multiverse. Each little part of the multiverse can get bigger without ever running into other universes. There are interesting questions to ask about what is sort of going on in the crossover regions between one universe and another, and that's going to depend on details of your theory: the potential energy function for some scalar fields, or for string theory, or whatever it is. But there's no worry that one universe is going to run into ours. One universe could swallow and take over, I don't want to say there's no worries at all, one universe that had a lower energy could eat up another universe and change it into part of itself by winning the energetic battle in some way. But again, I don't think that's actually a very big worry at a practical level."}, {"type": "text", "content": "2:31:33.7 SC: David Maxwell says, \"Like you, I've always believed in letting ideas flow and trusting people to sort through the truth. Recent years have made me question that—\" there's probably a typo here, \"question, I'm gonna say, whether media landscapes have enabled systems where large percentages of the population only see total fabrication and never see the true ideas. So have your views on censorship changed?\" Well, my views on censorship have not changed. No. Look, it's always been the case that large percentages of people have received misinformation and false information. You look
