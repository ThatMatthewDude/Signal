and various different things. And they point out you could easily imagine systems that have some of these characteristics but not others. And so what life is is not some unified thing that we're gonna define once and for all. There might be different kinds of things that have some aspects in common with life and not others."}, {"type": "text", "content": "3:41:24.8 SC: So I think consciousness is probably like that. I think that it's a mistake to think, \"Well, we've used the word consciousness for many centuries now. There must be a single unified concept out there in the world that maps onto it.\" I think we can figure out by doing science, by doing philosophy, et cetera., what is happening in people, in their brains, in their behaviors, in their thoughts, and figure out what is the best way to describe that. And the word consciousness might or might not turn out to be part of that best description.\n\n3:41:54.3 SC: Jonathan Good says, \"Could two branches on the path from a low-entropy past contain different conscious experiences but still become one branch in the future if the differences were never recorded in a way that became entangled with current observers' degrees of freedom in a way that produces lasting decoherent differences?\""}, {"type": "text", "content": "3:42:12.8 SC: So it is possible for different branches from a low-entropy past to eventually join back into a single branch. In fact, that is what you expect to happen when the universe reaches thermal equilibrium 10 to the 100 years from now. Okay, that's nowhere close. We're not anywhere near then. So Jonathan's question is a much shorter-term question. Could two branches of the wave function have the same observer having different conscious experiences, but those experiences don't get recorded, they don't sort of get entangled with the outside world, et cetera., and so the observer sort of comes back together?\n\n3:42:54.5 SC: The rough answer is no. We expect that kind of thing, anything is possible, okay, but we don't expect that kind of thing to happen precisely because the way that branching happens is it's irreversible. You become entangled with the environment. That's what it means to be branching, is you have become entangled with the environment. And even if you don't write down the conscious experience you had on some notepad or whatever, it is effectively recorded in the environment. And this is what people like Zurek have talked about a lot with pointer states and decoherence and einselection and quantum Darwinism. There's a whole bunch of words that are attached to this way of thinking. So basically the definition of what it means to branch means that it goes one way and not the other way. And therefore you could imagine a quantum superposition that sort of occurs and then unoccurs, but not one that actually branches into two classical-looking things and then rejoins. The environment is just too big and the environment secretly is recording all of these different possibilities."}, {"type": "text", "content": "3:44:01.1 SC: Dan Butler says, \"Priority question. Can you talk a bit about Lorentz invariance in emergent spacetime? Is it a challenge to come up with quantum theories where Lorentz invariance emerges rather than is just assumed? Is it a helpful constraint on theories of emergent spacetime or not really?\" Well, I think this is a super important question. It's one that I don't know a lot about. In other words, so far I've been playing around with emergent spacetimes and their properties, but I've just been crossing my fingers and hoping that Lorentz invariance basically emerges. There's arguments back and forth about whether Lorentz invariance could be exact. That depends on the dimensionality of Hilbert space. Naively, Hilbert space has to be infinite-dimensional for Lorentz invariance to be exact. Lorentz invariance, sorry, for those of you who don't know, is just the statement that, as we already alluded to earlier, the universe doesn't care how fast you're moving or what direction you're pointing in. There's a symmetry in spacetime called Lorentz invariance."}, {"type": "text", "content": "3:45:00.6 SC: And if you build a theory of emergent spacetime by starting with a quantum state evolving with time, you're already picking out time as different in the formulation of the theory. That doesn't mean that the theory that you build can't be perfectly Lorentz invariant. After all, you could start with ordinary QED, quantum electrodynamics, right? That's a perfectly 100% Lorentz invariant theory. You can pick a coordinate system or a Lorentz frame, as we call it, and you can quantize the theory in that frame. So even though you pick a coordinate system to use to write your theory down, doesn't mean that the physics that you end up with can't be perfectly Lorentz invariant. However, there's also the idea that maybe physics has a finite-dimensional Hilbert space, and then it might be harder, but I actually haven't really looked at it very carefully. I've sort of thought about looking at it, but never gotten around to doing it. I do think that one of the reasons it's worth doing is because we have experimental constraints on violations of Lorentz invariance. So I think that figuring out whether quantum gravity implies interesting experimental deviations from perfect Lorentz invariance would be an extremely interesting thing to do."}, {"type": "text", "content": "3:46:13.5 SC: Moshe Feder says, \"In the late '90s, Randall and Sundrum proposed two variations of a five-dimensional anti-de Sitter space model to solve the hierarchy problem of gravity's weakness relative to the other forces. What did you think of their proposals at the time, and has any further work been done on them since?\"\n\n3:46:31.7 SC: Yeah, so back in the '90s, there was quite a bit of excitement about extra dimensions of space and how they could be curled up. That was an old idea, of course, but in the '90s, people started getting more interesting constructions that they could invent, basically taking advantage of the idea of branes, B-R-A-N-E-S, not Boltzmann brains. These are D-branes, typically, from string theory. And the thing about the branes is that you can easily confine all of particle physics to the location of a brane. So if you have, let's say you have five-dimensional space, but embedded in that five-dimensional space, you have a three-dimensional brane. Okay? And that's space, not spacetime. I'm giving you the dimensions of space. You could confine all the particles and all the fields that we know about to the brane, so that as far as physics was concerned, the people living on that brane would think that space is three-dimensional."}, {"type": "text", "content": "3:47:30.2 SC: The problem with that is that you can't easily confine gravity to the brane. Gravity tends to leak out. So this went in two directions once people realized this. One direction was large extra dimensions, where you could say, okay, I let gravity leak out into the brane, but gravity is weak and I don't have very good constraints on it. Therefore, maybe the extra dimensions are bigger than you think. And the most popular models had two extra dimensions that were almost as big as a millimeter in size, basically because that's where... Two reasons. Number one, that's where the experimental limits were. And number two, the numerology worked well with reconciling a Planck scale at very high energy with an electroweak scale at very low energy. You're not solving the hierarchy problem, really, but you're replacing the question of why is the Higgs mass so small with a question of why are the extra dimensions so big?"}, {"type": "text", "content": "3:48:24.9 SC: The other direction that it went in is this Randall-Sundrum direction, where rather than two extra dimensions with flat space inside, they had one extra dimension with anti-de Sitter space inside, so a negatively curved spacetime. That plays very well with string theory. String theory is very happy with a negative cosmological constant, which is what you have in anti-de Sitter space. But the Randall-Sundrum construction wasn't specifically for string theory. You could have imagined it in a more general context. And they got a different kind of solution to the hierarchy problem. They related physics at one end of a very, very small extra dimension to physics at the other end, and the energy scales get changed with respect to each other because of the curvature of space in between."}, {"type": "text", "content": "3:49:11.1 SC: So this turned out to be a very phenomenologically interesting set of models, and people developed attempts to show how you could detect the existence of this extra dimension, how it would affect the spectrum of particles you might observe at the LHC, and so forth. As you know, we haven't detected any new particles at the LHC, and we haven't detected any violations of the way that gravity behaves or anything like that. So I think that it's still viable as an approach to phenomenology, but right now we're in a phase where it's just guesswork, right? We don't have any very strong phenomenological clues as to what direction to go in in terms of going beyond the Standard Model of particle physics. So you can guess things and work on them and hope they work out, and Randall-Sundrum is still very much in that bucket, I would say."}, {"type": "text", "content": "3:50:01.2 SC: Nate D. Says, \"I'm a bit confused about the relevance of the various interpretations of quantum mechanics for experimental physics. Are the formalisms underneath all the interpretations so consistent as to make one's theoretical preference as an experimentalist, let's say for Many-Worlds over Pilot Wave, irrelevant? Or would believing in Many-Worlds over Pilot Wave potentially generate different experimental arrangements? Basically, this is just a question about the relationship between theory and practice in contemporary quantum mechanics.\"\n\n3:50:29.8 SC: Well, we have very good limits and experimental constraints on how quantum mechanics works. So basically, if you're coming up with a new formulation of quantum mechanics, they used to be called interpretations in the old days, but I don't think that's a good way to call them; they're physically different theories, and if you're coming up with a new one, there's two options. One is you basically reproduce all of the known experimental successes of quantum mechanics, or you don't. And if you don't, you throw that theory away and move on to think about something else. So almost by construction, all of the various theories that we look at today have more or less the same predictions for quantum mechanical tests that you can actually do in the lab."}, {"type": "text", "content": "3:51:11.6 SC: That might not always be true. The theories that have objective collapse of the wave function absolutely make special new predictions for experiments, and we're trying to do them, and we haven't really completely ruled out those theories yet. I suspect they will eventually be completely ruled out. For other theories, for Copenhagen, for Pilot Wave, et cetera... I say this over and over again. I'm not sure if it really catches on with people, but the problem is that the theories are not well defined. It's perfectly clear that Copenhagen is not well defined because it doesn't tell you what a measurement is. Even pilot wave and hidden variable theories are not well defined because in modern physics we have what is called quantum field theory. And there's no consensus about how to do a version of hidden variable theories in the presence of quantum fields rather than particles. We had Tim Maudlin on the show and he talked about it a little bit, and he is someone who is optimistic about those theories, so he put an optimistic spin on it. But at the end of the day, we don't know how to do that."}, {"type": "text", "content": "3:52:12.6 SC: And hidden variable theories work very well with non-relativistic point particle quantum mechanics. They don't work very well with quantum field theories. People have tried and people have made progress in some sense, but there is no settled way of doing it. So David Wallace makes this point very firmly. He says, \"Look, there's nothing to compare it to because we don't know what a hidden variable theory would say about the internal structure of a proton or something like that.\" So it's just very hard if you haven't developed the theory to ask what its experimental predictions are going to be.\n\n3:52:51.3 SC: Sonja says, \"What are your thoughts on the recent elections in Serbia and the key role played by university students and members of the academic community?\""}, {"type": "text", "content": "3:53:00.8 SC: I have no informed thoughts about the recent elections in Serbia. The reason why I am answering the question is because I just want to, number one, encourage people in Serbia and elsewhere to keep up the good fight for liberal democracy in the world. And number two, to acknowledge that university students and members of the academic community worldwide have always played important roles in social movements. It's just an interesting fact about human life that that part of your life when you're a university student, and the students get more credit than the faculty do here, no question about that, that's a part of your life when you're exposed to new ideas, but you still have the energy and the initiative to go out and do something about them, not just to talk about them. So I'm not surprised that university students play a big role in this, and I think that that will always be the case and they should be encouraged to be allowed to do that."}, {"type": "text", "content": "3:53:54.4 SC: Benjamin Zand says, \"In general relativity, spacetime has a definite curvature at every point described by the Riemann tensor. If we measured a traveler's speed relative to this curved geometry with each point having its own curvature, wouldn't that give us an absolute standard of motion? Or do the components of the curvature tensor change with the observer's velocity in a way that keeps the principle of relativity intact? If the latter, where and how does observer's velocity enter into the equations?\"\n\n3:54:22.3 SC: Well, look, you have to distinguish between two different things. One is the fundamental laws of physics and the other is how things behave in a particular situation, in a particular state. After all, here on the surface of the Earth, I can tell the difference between up and down because the Earth is beneath my feet. Up is the opposite direction. Okay? That doesn't mean that Lorentz invariance has been violated or that there is an absolute standard of rest in the underlying laws of physics. There's a standard of rest here on the Earth because I can talk about my speed relative to the Earth. Talking about the curvature tensor or any other tensor field, scalar fields, vector fields, whatever, is exactly the same way. If you have some particular configuration of matter and spacetime and whatever, you will have different ways that that configuration will be observed depending on how you're moving through space. You might be able to move through spacetime. You may be able to move in such a way that the values of the tensors remain approximately constant or something like that. And if you wanted to, you could say, \"Well, that's a preferred frame of reference with respect to that field that I'm living in. But it's not a preferred frame of reference in the fundamental laws of physics.\""}, {"type": "text", "content": "3:55:38.7 SC: In exactly the same way, the cosmic microwave background provides a rest frame. You can say, \"I'm at rest with respect to the microwave background photons,\" or \"I am blue-shifted in one direction, red-shifted in the other direction.\" But that's not fundamental to the laws of physics, so we don't count it as a preferred frame of reference at the deepest level.\n\n3:55:57.3 SC: Jake asks a priority question. \"In a previous AMA, you argued that the morality of painlessly killing hypothetical kittens depends on the reason, and that killing them purely for enjoyment would be morally wrong. Would you also consider it morally wrong to kill an animal for a tastier meal when a nutritionally equivalent plant-based alternative is available, since in both cases the reason for killing is enjoyment? I understand why taking pleasure in killing might be morally objectionable, but does the seemingly innocent pleasure of eating justify the killing itself?\""}, {"type": "text", "content": "3:56:28.6 SC: Well, I think that there is a difference here. So I'm not gonna tell you what the right moral stance is, but in terms of what the considerations are that go into your moral stance, I do think that it's not a good analogy between killing kittens for the thrill of killing kittens and killing animals to eat them, to eat their food. Namely, that where the pleasure is coming from is in the act of killing versus the act of eating a meal. And I think that those are different. You might not think that they're sufficiently different, and you might argue that I think that the act of killing animals to have a meal from them is not morally right. I get that. That's a move you can make. But you can't say, \"Well, it's just the same as strangling kittens just to get your jollies from it.\""}, {"type": "text", "content": "3:57:13.9 SC: Okay, this is an anonymous question. \"People at AI labs appear to be freaking out that AI research looks like Go or theorem proving. AIs suck at most things, but in the narrow domains where AIs can get fast and objectively true signal on their performance, they won or lost the Go game, et cetera., AIs can run an ungodly number of trials and teach themselves to outclass humans through brute force. The bottlenecks of AI research seem to have fast and objectively true signal, like the prediction loss went up or down, and the labs are now spending billions per quarter trying to train AIs to do AI research. Should we be freaked out?\"\n\n3:57:50.5 SC: Well, I don't think that anything you said leads me to be freaked out yet. I mean, maybe we should be freaked out for various reasons, but the fact that research is going quickly by itself does not count as a reason to be freaked out. Again, I am a believer in being responsible, both at the level of the companies doing the work and at the level of the government regulating them. I do think that being careful with things we don't understand and moving slowly and testing things and making sure they're as safe as possible all makes sense. I think that safeguarding ourselves against a million minor problems is the best way to safeguard ourselves from one big problem. But the very fact that research is going quickly is not by itself a reason to be freaked out, unless you're just really upset that research is going faster than you can keep up with, which I get that too, but I don't think it's any reason to really worry at a deep level."}, {"type": "text", "content": "3:58:47.5 SC: Dennis Briggs says, \"I tell my students that the linear systems don't know when enough is enough. Is Many-Worlds the ultimate example of that aphorism, or am I missing something?\"\n\n3:59:00.0 SC: So for those of you who are not big math fans out there, I think what Dennis is referring to is that a linear system is a system that just evolves in time in a linear fashion. And what that means is it never stops, right? Not only does it go at the same rate, it goes at the same rate forever. So if you had linear growth of some system, it would just keep growing forever and ever and ever. This is actually a well-known issue when people try to model mathematically things like the growth of species or environmental issues and things like that, because very often you start with some simple model that does well describing some tiny period of time, but the model just grows. It just sort of blows up and is unstable and doesn't really do a good job. So you invent non-linear effects that say, \"Okay, you can grow for a little while, but if you grow too far, then a new term kicks in which kills you off and stops you from growing.\" That's a very, very standard move in ecological or biological modeling."}, {"type": "text", "content": "4:00:02.7 SC: So Dennis's question is, is Many-Worlds the ultimate example of this? And maybe. I think that Many-Worlds is the consequence of taking the Schrödinger equation literally at face value. And the Schrödinger equation is linear. So in that sense, yes. There is a further tricky thing, though. It does depend on the space in which you are evolving. After all, if your space of possibilities is a circle, then even if you move on the circle linearly, that is to say at a constant angular velocity, you don't go crazy. You just keep coming back to where you left again and again and again, right? Just go around the circle an infinite number of times. Nothing to be worried about there. If you're moving through a plane, a two-dimensional Euclidean plane, and you're moving in a straight line, then you will go off forever."}, {"type": "text", "content": "4:00:57.2 SC: So this is analogous in quantum mechanics to asking whether or not Hilbert space is finite-dimensional or infinite-dimensional. That's why in my recent paper, you got a cyclic universe out of a situation where you were in a finite-dimensional Hilbert space, because then you evolve linearly, but you come back to where you left. That's where the cyclic universe comes from. If Hilbert space is infinite-dimensional, then you can evolve forever and ever. And Many-Worlds is basically taking advantage of that. Absolutely.\n\n4:01:27.0 SC: Okay. The final question of this month's AMA comes from George Hampton, who says, \"Given the state of our democracy, I've been thinking about Gödel's loophole, and I'm wondering if this is the inner inconsistency he was thinking about. Do you have any thoughts on this?\""}, {"type": "text", "content": "4:01:43.9 SC: So I have some thoughts. I'm not sure how accurate my thoughts are. So for those of you who don't know, there's a famous story of Kurt Gödel, the logician, who moved to the United States. He was from, I think he was from Germany, but maybe Austria, I'm not sure. Anyway, he got a job at the Institute for Advanced Study in Princeton, he became friends with Einstein, et cetera. And eventually he applied for citizenship in the United States. And there's a test you have to take to become a citizen. And one of the questions is something about democracy in the United States. And according to the story, there's different versions of it, I don't really believe any of them, but according to the story, Gödel starts saying, \"Well, actually there is a way within the Constitution to overthrow the government of the United States and make it non-democratic.\""}, {"type": "text", "content": "4:02:29.9 SC: And some people try to wonder whether or not this is related to Gödel's formal work, his logical work in showing that there are inconsistencies that lay, possible inconsistencies or at least possible paradoxes in logical systems. But as far as I know, nobody actually knows, maybe someone does, but hasn't told me, what Gödel actually had in mind when he was thinking about this. And honestly, I know people speculate about it. I don't quite see what the big deal is. I think that this is, it's basically impossible to design a democratic system that can't be overturned for the very simple reason that if all of the people in a democracy decide to get rid of democracy, they can do it, right? That's not something you can even stop from happening no matter how you design your system. So I don't think you need to be a super-genius like Gödel was to notice that in the Constitution of the United States there are ways to amend the Constitution. And you could amend the Constitution to say that there is a dictator, right? There's an emperor, if you wanted to do that. That's 100% valid. You don't need to be very smart to figure that out."}, {"type": "text", "content": "4:03:43.3 SC: So this is something you just have to live with. I mean, this is why it's crucially important if you do want to live in a democracy, which we've been talking about before, that the populace be educated and civic-minded. You can't have a democracy of reluctant citizens or citizens that don't believe in the values of democracy, because if they don't believe in those values, they can easily get rid of the democracy. You can't force democracy on people who don't want it, no matter how hard you try. So you have to give the sales pitch for democracy. You have to let people know how important it is. And democracy is not just about giving people a voice. That's part of it. But oftentimes people say, \"Well, I like democracy because I like to be able to vote. I like to have a say in the government.\" And what they're less enthusiastic about is other people having a say."}, {"type": "text", "content": "4:04:37.2 SC: What democracy is really about is not voting for your favorite thing, but acquiescing when the majority of people in your country vote for something different, for agreeing to go along with majority rule. And of course you want to safeguard against violating the rights of minorities, et cetera. That's why you have various checks and balances in the Constitution, and you have a republican system, and you have federalism and all these different things, and you have a Bill of Rights. Okay. So you don't want the majority to get everything at once, but for the most part you want majority rule, which means that sometimes you're gonna be in the minority and you have to learn to live with that. And I think that that is something that we don't do a good job of explaining to people so that they are willing to fight for the principle that sometimes they're not gonna get their way."}, {"type": "text", "content": "4:05:26.6 SC: Because when people fantasize about how awesome it would be to have a strongman, dictator, authoritarian, in their minds, their strongman is always on their side. And they just don't quite accept that maybe even if the strongman initially looked like they were gonna go along with their side, they can change their minds, their incentive structure might be different, and therefore it is better to just avoid the possibility of anyone having that authoritative power at all. So I don't know what Kurt was thinking about, but I don't think you need to think that hard. We do need to make sure that the democracy is solid at the level of the opinions of the actual citizens of the democracy, not just at the level of the laws that we're all supposed to be obeying. So hopefully that thought is, you know, both important and optimistic. I don't know whether it's optimistic or not. Democracy trundles on. It's gonna live to fight another day anyway. Thanks as always for supporting the Mindscape podcast. I will talk to you next time."}], "text_post": false}, {"id": "bdb6b9b47261e840", "title": "Suicide by Trump", "url": "https://edwardfeser.blogspot.com/2026/11/suicide-by-trump.html", "source": "Edward Feser's Blog", "tag": "philosophy", "published_at": "2026-11-07T22:45:59+00:00", "panels": [{"type": "snippet", "content": "Here is the\nnarrative that so many on the right – including many of my fellow conservative\nChristians – have, over the last few years, talked themselves into believing: Yes, Donald Trump is a man of low moral character, but\nsometimes such a man is precisely what you need in order to get the job\ndone. And Trump has done more to advance\nour cause than any previous leader on the American right. Indeed, he will likely take his place among\nthe great men of history, one who saved the United States and the West itself\nfrom the mortal dangers threatening them from within and without. In fact, it may n", "read_more_url": "https://edwardfeser.blogspot.com/2026/11/suicide-by-trump.html", "read_more_source": "Edward Feser's Blog"}], "text_post": false}, {"id": "b64314dbda1b9db7", "title": "Reading List 11/7/2026", "url": "https://www.construction-physics.com/p/reading-list-1172026", "source": "Construction Physics", "tag": "engineering", "published_at": "2026-11-07T13:23:36+00:00", "panels": [{"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!KLPC!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fff3c275d-329f-4515-a726-61124d39868c_1019x789.png", "alt": ""}, {"type": "text", "content": "Welcome to the reading list, a weekly roundup of news and links related to buildings, infrastructure, and industrial technology. This week we look at Florida’s property tax rollback, projected PCB shortages, the end of Tesla’s Cybertruck, the lack of progress in carbon storage, and more. Roughly 2/3rds of the reading list is paywalled, so for full access become a paid subscriber.\n\nHousekeeping items this week: I accidentally emailed out this week’s essay, How Do Building Codes Affect the Price of Housing , to paid members only instead of all subscribers. This has been fixed, and it’s available now for everyone. I think a couple people may have signed up for paid subscriptions specifically because of this — if this is you, let me know and I’ll issue you a refund."}, {"type": "text", "content": "From the annals of “the return of the property tax revolt”: this week Florida approved an amendment to exempt a larger portion of a person’s home from property tax. It’s estimated to reduce government revenues by nearly $5 billion in 2027-2028 alone. [ HousingWire ]\n\nAnd from the annals of “frontier AI models are surprisingly capable at things you wouldn’t expect them to be”: AI models are apparently now pretty good at generating permit-quality construction documents. People have been making flavors of this claim for a while, but this is the first time I’ve seen it made from an actual architect. “ Drawing upon my background as an architect, I tested 13 older and newly released AI models to measure their technical drawing abilities. I found that the strongest drafting model at the time of writing is Anthropic’s Claude Opus 5.5, released in September of 2026. With some skilled guidance, Opus 5.5 is capable of producing sophisticated drafting and permit-quality architectural drawing sets for simple buildings. ” [ Substack ]"}, {"type": "text", "content": "A new paper estimates that wildfire risk to US buildings could triple by 2060. “ We reconstruct fire risk to structures from 1945-2023 and project its evolution through 2060 across the U.S. using high-resolution historical data on area burned, settlement patterns, and fire impacts. Under business-as-usual conditions with no adaptation, structural losses are projected to nearly triple nationwide, with 133,200–449,100 buildings expected to be damaged or destroyed by mid-century .” [ Nature ]\n\nOpponents of a housing project being planned above a San Francisco Safeway are suing the project under a provision of the 1871 Civil Rights Act, originally passed to combat violence from the Ku Klux Klan. [ HousingWire ]"}, {"type": "text", "content": "Chinese robot manufacturer Unitree’s factory operations remain (surprisingly?) manual. “ At the end of 2025 all of Unitree’s machinery was worth about $1.7 million on its books, at a company that made almost 32,000 robots that year: some $50 of machinery per robot! ” [ X ]\n\nOne of Intel’s fabs in Israel was shut down for 2 weeks after an explosion that killed two people, possibly due to a gas cylinder malfunction. [ Tom’s Hardware ]\n\nAre printed circuit boards the next AI datacenter-induced component shortage? “ We’ve seen huge demand/supply driven price rises in RAM, GPUs, SSDs, and more through 2026. Now that most basic and unglamorous electronics necessity, the PCB, looks set to join them. A news report published by Nikkei Asia quotes several leading PC and PCB industry managers, making it clear we are going to see PCB (and PCB subcomponent) shortages and price rises in the coming months .” [ Tom’s Hardware ]"}, {"type": "text", "content": "BYD sold more electric vehicles in October than the entire US did the entire third quarter. [ Electrek ] And more than 50% of heavy trucks sold in China in September were EVs. [ Electrek ]\n\nBlake Scholl, CEO of supersonic airliner startup Boom, says it’s now spending most of its resources working on the power-generating gas turbine for AI data centers, and once that’s been developed it will shift focus back to the airliner. [ X ] Related, if any of my readers work at Kalshi or Polymarket, I would love a prediction market for the Boom airliner."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!fps7!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fdd8d9b83-711f-4acd-900f-a15022d4eb54_589x364.png", "alt": ""}, {"type": "text", "content": "Related, I liked this idea from Scholl: use AI to check for weird edge cases in aircraft flight control software. [ X ]\n\nRead more"}], "text_post": false}, {"id": "49dc78f455148a2f", "title": "The Insatiable Demand for Alpha", "url": "https://www.netinterest.co/p/the-insatiable-demand-for-alpha", "source": "Net Interest", "tag": "financial", "published_at": "2026-11-06T17:59:24+00:00", "panels": [{"type": "text", "content": "Reminder: I’ll be attending the TomorrowX Summit in Austin later this month, followed by Fintech Nerdcon in San Diego. If you’re at either, please say hi.\n\nIn 1969, a year after oil was discovered in Prudhoe Bay, the state of Alaska ran an auction to sell drilling rights along its Arctic coastline. Oil companies flocked to bid, paying up a total of $900 million. For Alaska, this was a massive windfall, equivalent to five times its annual budget. Lawmakers debated what to do with all the cash.\n\nIt took seven years to settle on a plan. So that future generations could benefit, they would set up a permanent fund, to remain out of reach of day-to-day government spending, with the goal of generating income into perpetuity. It required a constitutional change, which in turn required a referendum, but eventually they resolved to invest at least 25% of its oil and mineral royalties into a fund. This week marks the 50th anniversary of the launch of that fund."}, {"type": "text", "content": "Today, the Alaska Permanent Fund has assets of $88 billion. It’s not as big as Norway’s oil fund, which we discussed some time ago, but it’s the closest America has to a sovereign wealth fund. Each year, the state is allowed to draw 5% from the fund to finance government services and to pay a dividend to residents. This year, eligible residents will each receive a check for $1,200.\n\nInitially , the fund was invested entirely in bonds. It wasn’t until 1983 that it diversified into stocks and real estate, though allocations remained low for a long time. In 1999, its mandate was broadened to allow a 5% allocation to alternative investments and, in 2004, the fund made its first foray into hedge funds."}, {"type": "text", "content": "At first, hedge fund investments were made through a fund-of-funds program. Alaska hired three managers to select hedge funds on its behalf but performance was disappointing. In the ten years through to 2016, those hedge funds generated a 3.4% annualized return, weighed by two down years, and provided little protection against market drawdowns. The double fees linked to the fund-of-funds structure contributed a further drag.\n\nIn 2016, under Marcus Frampton, now its chief investment officer, the fund changed its approach to bring hedge fund selection in-house. “We only wanted managers that had a track record of making money in down markets,” he explained . One of his most significant allocations was to Millennium Management. In summer 2018, members of Millennium’s capital development team made the trek to Juneau to meet Frampton and two colleagues and early the following year, they invested $300 million."}, {"type": "text", "content": "Alaska was lucky to get in. Millennium “has been closed forever and then reopens periodically,” Greg Allen of Callan Associates told its board of trustees. In late 2019, it had an opportunity to add, though it would mean lifting a cap on individual hedge fund allocations. At the beginning of 2020, the fund invested a further $80 million, making it the largest holding in its hedge fund portfolio.\n\nThe shift in approach paid off. Alaska now allocates to 18 managers, accounting for 8% of its total portfolio. When markets slid in 2022, the hedge fund part of its portfolio was up about 8%. In the nine years since the restructuring, the average annualized return of the hedge fund portfolio has been 6.7% with no down years and a low correlation to overall markets. Frampton is happy."}, {"type": "text", "content": "In fact, he’s so happy that he would like to do more. “If you put our absolute return numbers into the optimizer, it would say put half the portfolio in it, because we’re getting CPI plus five there, totally uncorrelated.” The problem, though, is that “the more money we push into absolute return, the harder it is to get that really special return because the good funds are capacity constrained.”\n\nPerhaps Millennium has an answer to that. When Alaska first invested, Millennium was a $35 billion fund; it is now knocking on the door of $100 billion. Its return in October was weak , down 2.3%, but that sits within its risk tolerance limits and compared with other funds, it could have been worse. How it performs in November, when many funds have struggled, will be key. “I have covered hedge funds for nearly 16 years, and I can’t remember a day like today,” posted Bloomberg correspondent Nishant Kumar this week."}, {"type": "text", "content": "If Millennium can outperform the turmoil, it will validate Frampton’s thinking and as it scales up, that will allow more allocators to participate. To see what Millennium is up to, read on.\n\nRead more"}], "text_post": false}, {"id": "1d078774c42946c2", "title": "Rocket Report: Artemis II literally tore through the atmosphere; New Glenn delay", "url": "https://arstechnica.com/space/2026/11/rocket-report-new-glenn-wont-fly-this-year-china-launches-mini-falcon-heavy/", "source": "Ars Technica — Rocket Report", "tag": "engineering", "published_at": "2026-11-06T13:33:20+00:00", "panels": [{"type": "text", "content": "Welcome to Edition 9.18 of the Rocket Report! Blue Origin packed a lot of news into one afternoon Thursday with the reveal of a new kick stage for the New Glenn rocket, a new rocket engine design, and the minor and widely expected delay for New Glenn's return-to-flight mission from December until January. The reconstruction of Blue Origin's wrecked launch pad at Cape Canaveral, Florida, continues apace after a catastrophic explosion nearly six months ago. There's a lot of pent-up demand from NASA, Amazon, and the Space Force for Blue Origin to get New Glenn back in action.\n\nAs always, we welcome reader submissions , and if you don't want to miss an issue, please subscribe using the box below (the form will not appear on AMP-enabled versions of the site). Each report will include information on small-, medium-, and heavy-lift rockets as well as a quick look ahead at the next three launches on the calendar."}, {"type": "image", "src": "https://cdn.arstechnica.net/wp-content/uploads/2018/05/smalll.png", "alt": ""}, {"type": "text", "content": "SpaceX vets work on water-fed propulsion . Three brothers who worked at SpaceX in the Falcon 9 era are now building satellites that run on water, a potentially harvestable resource on the Moon and found all over the Solar System, Ars reports . In late 2022, the three Carlisle brothers founded Argo Space to build infrastructure in space. Their vision was not just in-space transportation but also removing the need to use propellants from Earth to move around the heavens. Argo Space's satellites will use water not only as a propellant, but also as a coolant and radiation shield.\n\nRead full article\n\nComments"}], "text_post": false}, {"id": "a61e9ecdf4104a35", "title": "The Changing Shape of the U.S. AI Capex Boom", "url": "https://theovershoot.co/p/the-changing-shape-of-the-us-ai-capex", "source": "The Overshoot", "tag": "financial", "published_at": "2026-11-03T08:51:58+00:00", "panels": [{"type": "text", "content": "The U.S. dollar value of business spending on computers, on telecoms equipment, and on the construction of data center shells is currently running more than 100% above the stable pre-ChatGPT trend . As of 2026Q3, this investment was equivalent to 2.5% of the dollar value of all the goods and services produced in the U.S., roughly double the stable 2009-2024 average of 1.3%. The total amount of spending is impressive, but what really stands out is the sheer speed of the increase just since the end of 2024. (Intriguingly, the same cannot be said for business investment in software, which has continued to grow at the same pace as the pre-ChatGPT trend.)"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!sN-I!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F807f9a62-8e9b-417d-b11b-847aa3132720_3195x2770.png", "alt": ""}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!oJr2!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F41d92f97-bdcb-441c-b2d5-94e3d5a06064_3200x2930.png", "alt": ""}, {"type": "text", "content": "What follows is an update on the macro level impact of this investment boom.\n\nMuch of this additional spending is currently attributable to six listed companies with a combined market capitalization, as of this writing, of roughly $13.6 trillion: Amazon, Google, Meta, Microsoft, Oracle, and SpaceX. Since the launch of ChatGPT at the end of 2022, these six listed “hyperscalers” have increased their quarterly capex by a factor of 7. Their reported investment spending has surged by a factor of 3 just since the start of 2025, and as of 2026Q3, it was running at an annualized rate of $1 trillion. Of these six, Amazon and Oracle have chosen to focus on selling their computing capacity to others, while the rest are also investing in proprietary “compute” to support their internal AI labs."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!DC32!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbe9eb9d4-904b-4ff1-b76e-b15e8d5d0f2e_3205x2980.png", "alt": ""}, {"type": "text", "content": "It is worth pointing out that the six publicly-listed hyperscalers are not the full set, just the only ones for which we currently have roughly comparable data via audited financial statements. There are two other hyperscalers that are not (yet) publicly-listed: Anthropic and OpenAI. Unlike the other six, Anthropic and OpenAI are net consumers of “compute”, rather than net suppliers, but they are still poised to invest heavily in generating additional supply. They will likely become a significant source of direct demand for the goods installed in data centers, in addition to their existing indirect demand via renting compute from the other six.\n\nAnthropic’s S-1 notes , in bold italicized font, that “we are pursuing initiatives to develop our own data center infrastructure, which involves significant capital commitments”. As they explain in more detail:"}, {"type": "text", "content": "To help reduce our dependence on CSPs [cloud-service providers such as Amazon, Google, and Microsoft], address constraints on available compute, and secure access to compute at the scale necessary for frontier model development, we are pursuing initiatives to develop our own dedicated on-premise data center infrastructure. These efforts include long-term leases and partnerships with third-party partners to procure the underlying real estate, power, and data center facilities while we lease capacity in those facilities and contract with specialized third-party operators for ongoing facility management. We also procure certain compute and infrastructure equipment directly and operate it in dedicated data center facilities leased and operated on our behalf, to our specification…In addition, to meet the substantial energy demands of large-scale AI workloads, we have entered into, and may in the future enter into, arrangements involving dedicated power generation assets and/or the development, operation, or control of power stations or other energy infrastructure…Our existing commitments are substantial, and we expect our capital expenditures to increase significantly as we continue to expand our compute and infrastructure build-out."}, {"type": "text", "content": "All of this extra spending has been flowing mostly to the handful of companies that capture much of the value in manufacturing the equipment that goes inside and connects the server racks that fill the data centers: Broadcom, Micron, Nvidia, Samsung Electronics, SK Hynix, and TSMC. 1\n\nRead more"}], "text_post": false}, {"id": "b41cc1e169ceb997", "title": "373 | Colin Camerer on the Neuroscience of Economic Thinking", "url": "https://preposterousuniverse.com/podcast/2026/11/02/373-colin-camerer-on-the-neuroscience-of-economic-thinking/", "source": "Mindscape", "tag": "philosophy", "published_at": "2026-11-02T11:53:15+00:00", "panels": [{"type": "text", "content": "Economics often starts with an assumption that people are rational maximizers of their own self-interest; but it doesn't stop there. Economists do understand that sometimes people are irrational, altruistic, or just random. So how can we understand how people actually do behave in economic circumstances? Colin Camerer is a pioneer of \"neuroeconomics\" -- not only understanding how people make economic choices, but relating it to processes in the brain.\n\nListen or watch Rolex Planet Visionaries wherever you get your podcasts. #ad\n\nGet 30% off your first year of the Base44 Builder plan at https://Base44.com/mindscape . #ad\n\nFor For 50% off your first year of HomeServe, go to https://homeserve.com/mindscape . #ad"}, {"type": "text", "content": "Look your best and support men's health at https://amazon.com/movember . #ad"}, {"type": "image", "src": "https://preposterousuniverse.com/wp-content/uploads/bb-plugin/cache/colin-camerer-square.jpg", "alt": "Colin Camerer"}, {"type": "text", "content": "Support Mindscape on Patreon .\n\nColin Camerer received a Ph.D. in behavioral decision theory from the University of Chicago. He is currently the Robert Kirby Professor of Behavioral Economics, T&C Chen Center for Social and Decision Neuroscience Leadership Chair, and Director, T&C Chen Center for Social and Decision Neuroscience at Caltech. He has been awarded a MacArthur fellowship among other awards. He is the author of Behavioral Game Theory: Experiments in Strategic Interaction .\n\n0:00:02.0 Sean Carroll: Hello, everyone. Welcome to the Mindscape podcast. I'm your host, Sean Carroll. In physics, you know, we have this distinction between fundamental physics and all the rest of physics. Fundamental physics is the stuff deep down, the quantum field theory, the general relativity, or perhaps even string theory or whatever, whereas all the rest is the emergent levels of the world, whether it's condensed matter physics or geophysics or biophysics or what have you. The analogous distinction in economics is between microeconomics and macroeconomics. When you think about the inflation rate or unemployment or the manufacturing sector or finance, you're thinking about macroeconomics. Microeconomics is the foundational part of the field that asks in very general terms how people go through the day making economic decisions. It's really about how people decide more generally to do one thing rather than another, simply indexed by spending money or something like that. So of course, this question of how people go about making decisions is a tough one."}, {"type": "text", "content": "0:01:12.1 SC: So there's a big debate about the foundations of economics, just as there's big debates about the foundations of physics, for that matter. For a long time, the simplest thing to do was to simply imagine that people were perfectly rational, more or less. No one ever thought that, right? No one ever actually thought, going back to Adam Smith, that people were perfectly rational all the time. But there's a simple assumption you can start making. Imagine that people have preferences and there's some probabilities and they have a utility function, and then you can derive consequences from that for economic behavior. But in recent decades, or at least let's say during my lifetime, so not so recent decades, people have begun to take more seriously the idea that maybe we should describe the decision-making process that real economic agents go through in somewhat more realistic terms. Today's guest, Colin Camerer, is an economics professor at Caltech, and he's been one of the leaders in this field for a long time. Sometimes the field is called behavioral economics, so economics that takes into account how people actually behave, amazingly enough."}, {"type": "text", "content": "0:02:22.3 SC: Colin has been a pioneer, the inventor basically of behavioral game theory. So thinking about game theory, which is another place where you could simplify things by imagining that people are perfectly rational, but instead checking out how people actually behave and what their limitations are imposed by the fact that some people make mistakes, our energy and stick-to-itiveness is not infinite when it comes to playing these games, etc. In more recent decades, Colin has also pioneered neuroeconomics. After all, if you want to ask how people really behave in these economic situations, maybe you want to know what's going on in their brains when they're making these decisions. So he is literally doing neuroscientific experiments, seeing what circuits are being activated, what modules are relevant when people are making these hard economic decisions. And it's, on the one hand, a field where they've discovered a lot of really cool stuff. On the other hand, it seems still a long way to go in terms of future discoveries to be made. So that makes it perfect kind of Mindscape material. Let's go."}, {"type": "text", "content": "[music]\n\n0:03:45.5 SC: Colin Camerer, welcome to the Mindscape podcast.\n\n0:03:48.0 Colin Camerer: Glad to be here.\n\n0:03:49.7 SC: I think I wanted to start by mentioning that a lot of people have this stereotype of economists, classical economists, anyway, as people who think that everyone is perfectly rational and they just maximize their utility. And we're going to move beyond that. But even before we move beyond that in your work, how accurate is or was that stereotype?\n\n0:04:13.7 CC: I think it's... I think of it as a limiting case, like you might think about in physical science or natural, in the sense that there may be people with extraordinary experience, like a wine expert who has tasted a lot of wine and is immune to herd behavior and who can... The core of utility maximization is being able to rank every single thing, what's called completeness of preferences. So I think there are people who can do that. But it isn't... And maybe even there's probably a little bit like everything, a little bit of genetic predisposition to be highly rational in this sense of having a utility number for all these goods and bundles of goods too. So you make trade-offs between safety and a smoke alarm in your house that's annoying because it goes off too often and so forth. So trade-offs, besides utility maximization, trade-off is really the trickiest part because it assumes that people can judge two things that may not be very sensually in some ways commensurable. So I think it's a limiting case that occurs."}, {"type": "text", "content": "0:05:13.9 SC: But do you think that economists like to pretend that everyone is like that?\n\n0:05:19.0 CC: I think there's an important distinction between the first few chapters of the book and what's taught and what's in the journals and what's actually believed. So I think of the model of utility maximization as a benchmark of rationality as sort of a starting point, like maybe Newtonian mechanics, where objects aren't moving too fast and so approximations work okay. And in a way it's a model of learning, or it could be a model of the endpoint of learning, as I was suggesting with wine experts. But it's not an endpoint for everyone and for all people at all different ages and with all different experiences and so forth. And it leaves a lot out."}, {"type": "text", "content": "0:05:59.2 SC: Yeah. So probably a lot of people took an economics class and got through the first few chapters of the book and they think that that's all that economics is.\n\n0:06:07.5 CC: Right. Right. And it is true that in analyzing lots of real-world problems, that's always sort of the default way of thinking.\n\n0:06:15.4 SC: Yeah.\n\n0:06:16.7 CC: So for example, I was reading a paper by Chad Jones about how do you price... How much should we be spending on existential AI risk to limit it? And so he does a very typical economist study, which is to think of a value of a life and this probability and there's two things we care about: we like to have good AI, but we don't want to get wiped off the face of the planet. And you make this... And that's a pretty good starting point because how else would you begin?"}, {"type": "text", "content": "0:06:44.7 SC: I guess so. I don't know. I mean, you've dived right into an area where I don't have strong opinions other than I'm not convinced by anyone's attempt to multiply really, really tiny numbers by really, really big numbers, right? This tiny probability by this huge utility. I think that that's... I'm kind of at sea as to what to do in those situations. Do you have a better view?\n\n0:07:08.0 CC: No, I think... I mean, Jones is very, very cognizant about that. And I think the best analysis really are look at sensitivity analysis. In fact, in his paper, he has a... Like ablation they call it in AI, you know, if you change this assumption one at a time or in bundles, how much does it move around? And it may be that the right analysis right now moves around so much that it is almost worthless. I don't know. But anyway, that's one of the most exotic examples I could think of that was top of mind of where the economics mindset gets you started."}, {"type": "text", "content": "0:07:41.1 SC: Right. It's a good one. So by economics mindset, is that almost identical with kind of using game theory to model how people would go through these strategic interactions?\n\n0:07:52.6 CC: Yes. So except for... There's a little bit of a historical Venn diagram. So game theory is really a branch of applied math originally. So John von Neumann worked on it, von Neumann-Morgenstern was an economist in their famous book that introduced game theory or made a gigantic leap forward, and a lot of the early work and continues to be done by people in applied math. But it's also... You can think of it as a candidate for how people actually behave. And not just people, but genes, organisms, nation states, et cetera."}, {"type": "text", "content": "0:08:20.1 SC: Yeah.\n\n0:08:21.4 CC: I think it's in a way it's the closest thing we have to a unifying theory of social science which is used in lots of different places because the levels can be quite different. And so game theory kind of got co-opted or adopted or it became a project in economics. So now when most microeconomics is taught, you learn about supply and demand, equilibration in markets, collusion, monopoly, you know, blah, blah, blah, blah. And all of those things assume there's lots and lots of firms, so no one firm has to think too much about what the others would do, or the same on consumer side, it's called price taking. But in game theory, suppose you have three firms, then all of a sudden it makes sense for each of them to think about what the other's thinking, the other's thinking about each other, and so forth. So game theory, most of the important advances have been done in economics or by combinations of mathematicians who get interested in fundamental questions which have obvious application to economics. Like Bob Aumann, for example, is a PhD in Math, but he won the Nobel Prize in Economics for proving some important theorems about foundational questions."}, {"type": "text", "content": "0:09:30.7 SC: I think I didn't quite realize what you just said, but it makes perfect sense if I can rephrase it. You know, there was important work done in economics by Smith and Ricardo and Marx and whatever long before game theory came on the scene. And if I take what you just said, it sounds like what game theory adds to that is the ability to model the other agents acting with you.\n\n0:09:54.8 CC: Correct, correct. And then it actually becomes quite rich because, for example, if you play a one-shot game like the so-called Prisoner's Dilemma, we might expect a lot of defection.\n\n0:10:04.0 SC: Yeah.\n\n0:10:04.6 CC: You know, people not being cooperative, like kids in class are all using AI because they don't want to lose out. But if it's a repeated game and people know the history and know that there's more periods coming, like two companies in a small town, then the results really change. In fact, it's so well known, it's called a folk theorem, that you can get cooperation which you wouldn't normally get mathematically in a one situation if you play repeatedly. So in parallel, lots more interesting mathematical questions arise, like can anything be a kind of equilibrium? Is there ways to pick out subsets in certain kinds? And so it really was a... I don't know how much mathematicians sitting in math departments contributed along the way, but certainly the foundational questions were often people who are quite mathematically sophisticated, and some like Aumann really did come from pure math backgrounds, or my colleague Omer Tamuz here at Caltech is in math and economics both."}, {"type": "text", "content": "0:11:06.6 SC: And I'm gonna apologize ahead of time because you've done so many interesting things, we're gonna breeze through them in a high-level way, and we're happy to pause and dig in at any moment. But in some sense, your starting point years ago was, you know, can we do better than thinking that people are purely rational, utility-maximizing game theorists? Can we actually think about how people actually think? Is that fair?\n\n0:11:32.4 CC: Correct. Yes. More or less the mission statement that I use, which is very close to one from Dick Thaler, who won a Nobel Prize for pioneering so much of this work and is a co-author of mine, is we're trying to incorporate natural limits on computation, willpower, and self-interest to improve economic predictions and make better policy recommendations. And Dick, Richard Thaler, wouldn't use the word \"natural\". I kind of inserted that in there because I want people to think of an invitation to think about biological underpinnings and mechanisms and neuroscience as well as essentially psychology, sociology, and other adjacent disciplines."}, {"type": "text", "content": "0:12:14.8 SC: Is there a way... At the risk of oversimplifying, is there a way of giving a pithy answer to the question, how rational are people? I mean, how much does the model fail of thinking of them as perfect reasoners?\n\n0:12:27.5 CC: Yeah, I was at the University of Chicago 100th anniversary of their PhD program, of which I'm a graduate, and somebody asked that. And I think I said 75% rational.\n\n0:12:39.1 SC: I love that answer. [laughter]\n\n0:12:41.8 CC: Well, I was trying to be not too evasive, you know, and I didn't want to say \"it depends\", which is the correct answer, actually.\n\n0:12:47.6 SC: Yeah, of course.\n\n0:12:49.4 CC: And again, I think there are interesting boundary cases. So there are cases where you have kind of extreme rationality. Like the wine experts are probably, kind of, if they rank two wines, they're gonna make the same ranking every time, doesn't matter where they are. So they're impervious to what we call context or situations. And there are other cases where you can move people around quite a bit. I'll give a quick example that might be a fun one. So my collaborator Eric Johnson, who's at Columbia, did a study where he asked people, \"How likely do you think you'll live until 75?\" And so people give a number like, you know, 90%. \"How likely do you think it is that you'd be dead by 75?\" They don't say 10%. Right? So the two numbers, you know, unless there's some weird thing happening right at your 75th birthday, right? The two numbers should add up to 100%."}, {"type": "text", "content": "0:13:41.8 SC: That's pretty basic.\n\n0:13:43.0 CC: Yes. And it's an example of something which Eric and many people have studied, which is a sort of a kind of acquiescence bias. Like if I ask about living long, I think I'm probably gonna live long. If I ask about dying, I think a little bit more about dying.\n\n0:13:55.0 SC: I see.\n\n0:13:55.9 CC: And so you get attention, maybe attention, memory, you know, some inner process is sort of perturbing the numbers. It's not like we have a hard... Unless you're an actuary, right, or an accountant, it's not like we have a hard number in mind which we actually believe and then can retrieve.\n\n0:14:12.2 SC: And we're gonna get into neuroscience at some point, but it sounds like this is rich for psychology as well. I mean, do you find like traditional psychology very useful in your work?"}, {"type": "text", "content": "0:14:22.5 CC: Oh, yeah, yeah, yeah. In fact, what I just described as an example is called a framing effect.\n\n0:14:27.5 SC: Yeah, yeah.\n\n0:14:28.0 CC: Which is a term that Tversky and Kahneman coined to denote when the same thing we know is consequentially the same is just slightly... The language of it is just slightly changed, and it can have surprisingly large consequences in some cases. And they produced a whole string of interesting framing effects. If you call a salad dressing 10% fat, you sell a lot fewer than if it's 90% fat-free. So there are many... Lots of examples of these framing effects. And obviously advertisers and political consultants and everybody are in this business too.\n\n0:15:02.0 SC: And another aspect, or maybe it's related, I mean, you're the expert, you tell me, but people are... How good are people at sort of thinking many levels through the game? Like, \"I'm gonna do this, they're gonna do that, therefore I should do this,\" or do they kind of get tired of all that?"}, {"type": "text", "content": "0:15:17.9 CC: Yeah, so most of the data we have is from lab experiments where we can design a game to kind of carefully titrate that. But there's some field data too. Let me walk through the lab experiments because the basic one is very simple. It's called a two-thirds of the average game, or we call it Keynesian beauty contest, as Keynes had an idea about the stock market that was similar. The idea is everyone picks a number from 0 to 100 simultaneously without talking. You write down your number, we're gonna compute the average, and whoever's closest to the average times two-thirds is gonna win a fixed prize. All right? So what people often start out thinking, \"Well, if other people are just... I don't know what they're doing, so let's say the average of everyone else will be 50, I'll pick 33.\""}, {"type": "text", "content": "0:16:01.5 SC: Right.\n\n0:16:02.5 CC: That's... We call that one step of thinking. But other people think, \"You know what, other people are gonna pick 33, I'm gonna pick 22.\" That's two steps of thinking, right? And what we typically see in a distribution, in fact, there's many, many replications of this experiment in the lab and also in a number of newspapers have a contest where you kind of write in and they give some big prize. And so the New York Times, for example, we have data from 50,000 people doing this, and it looks a lot like students all over the world. The original data in Germany, we have data from Singapore, et cetera. And typically what you see is more 33s than 22s and not that many two-thirds of 22s, which is around 15. So it kind of peters out."}, {"type": "text", "content": "0:16:47.8 SC: Yeah, and no ones.\n\n0:16:50.5 CC: No ones, unless you do it with an audience of game theorists, and even then, you don't get that many ones and zeros. You'll get fives and tens. So, you know, highly educated, but there's two pieces to this too, which I'm showing, which is it's not just that they're highly educated about game theory. They're in a group of other people who they know are highly educated about game theory.\n\n0:17:11.5 SC: Yeah.\n\n0:17:12.0 CC: Right? And so it's the, we call common knowledge or their sort of shared knowledge of background. And interestingly, there's some experiments with chess players, for example. You might think that chess players can do more strategic thinking, but they look very much like regular folks."}, {"type": "text", "content": "0:17:27.5 SC: Oh, okay.\n\n0:17:28.0 CC: It doesn't seem to be... Depth of thinking seems to be somewhat domain specific, which is true of a lot of psychological things. There's very limited what we call transfer of learning, that it's not a very general skill, at least so far as we can tell.\n\n0:17:41.2 SC: And I can imagine explaining that result by saying people only think it through one or two levels.\n\n0:17:46.2 CC: Yes.\n\n0:17:47.1 SC: There's another explanation that people think that other people are irrational, so they're just gonna foresee that. And can you disentangle those?\n\n0:17:55.3 CC: Yes. Yeah, yeah. You can. So there's a few other games that disentangle them, and you can also manipulate who they're playing. So nobody's done this exact study, but I'm pretty confident what would happen if you did. If you had a group of very elite game theorists and you said, \"Okay, we're gonna run this on Prolific or do a contest on an app, and you're gonna play those people,\" a lot of the game theorists who would choose zeros or ones among themselves will choose 22 or 15 or some number. In the New York Times, I picked 19, and the winner at the time was 20."}, {"type": "text", "content": "0:18:29.1 SC: Ah, pretty good. All right. You're well trained at human irrationality.\n\n0:18:33.3 CC: Yes. Exactly.\n\n0:18:34.2 SC: That's something to be an expert at. And this goes into what I think is called the cognitive hierarchy model. Is that a thing?\n\n0:18:41.0 CC: Correct. Correct.\n\n0:18:41.8 SC: Tell us about that.\n\n0:18:42.5 CC: Yeah, yeah. So there's sort of two flavors. Sometimes it's called level-k. The cognitive hierarchy model just says there's some percentage of level zeros who are either choosing randomly or they may be doing something salient, like a, something... But the main thing is they're not thinking very strategically. So in Rosemarie Nagel's data, she was the first person to do this in her thesis, which I have in my office, she actually asked people afterwards, \"Why did you pick the numbers you picked?\" And so one person picked 18, and they were close to winning, much like the New York Times was 20. And the person said, \"I picked 18 because I'm 18 years old.\" Right? So that's not three levels of strategic thinking, right?"}, {"type": "text", "content": "0:19:22.5 SC: Yeah, it's not.\n\n0:19:24.0 CC: And we only found out because Rosemarie asked them. That's what we call level zero, like picking a lucky number. Sometimes it's the middle. In some games it might be... There's another interesting game called 11-20 game. Sorry, the game theorists are not great at marketing. And in 11-20, you pick an integer from 11 to 20. And what's neat about it is you earn whatever number you picked. So there's a tendency to pick 20.\n\n0:19:54.5 SC: Yeah.\n\n0:19:55.0 CC: Right? But if you undercut the other person by one number, you get a big bonus of 20.\n\n0:19:59.9 SC: I see.\n\n0:20:01.0 CC: So if I think you're gonna pick 20, I will pick 19. And if I think you're gonna pick 19, I'll pick 18. But it doesn't go all the way down to 11 because if we both pick 11, nobody gets a bonus. So if I think you're gonna pick 11, I'm gonna pick 20."}, {"type": "text", "content": "0:20:15.1 SC: Interesting.\n\n0:20:15.6 CC: If I can't get the bonus, I'll just get the highest. So you get what's called a mixed equilibrium, kind of like a cycle. And there the focal number or the salient number we think that level zeros pick 20. So it's as if they have a model of the game, but they neglect the fact that they could get more depending on what the other person does. They act like they're kind of playing by themselves. So it's as if they have a model, but they truncate out, \"Oh, your payoff may depend on other people. Well, I don't know what they're gonna do, I'll just, yeah, forget about that.\" And anyway, so that game is another way to try to pin down, you know, number of levels, and usually it's something like two or three. The only exception, which is a little bit interesting, is, and I'm in a little debate with this with George Loewenstein, who's a behavioral economist at Carnegie, is language. So if you think about the iterated structure of language, depending what you call a level, you can get things like, \"I know that you know that your wife didn't feed the cat and therefore you need to text your daughter,\" blah, blah, blah. You know, if you write it down, you could write it as games with a lot of levels in it. But I think the reason people might seem to be doing a lot of reasoning is because of just learning and familiarity or what cognitive scientists call schemas. You know, like we have sort of scripts for the way things work, and if it doesn't work that way, like a tree, you know, you have a branch, plan B and plan C. So it's possible that you can get higher levels, but I think it's pretty rare and maybe a specialized skill, or it may be in certain domains where this very high-level strategic thinking works."}, {"type": "text", "content": "0:21:59.5 SC: And you said the chess players don't have any special benefits elsewhere. Is there some idea that other than domains where we're special experts in, each person has a certain level thinker? Like, is it universal among different kind of problems that they would face?\n\n0:22:20.1 CC: Partly, but not quite. Yeah, yeah. And we do know... Here's a few things related to that, which is we know that when you play a couple of these simple games, if you do it the way a psychometrician does it, which is not just play one but five or six different games, like you play the 11-20 game and then you play the two-thirds of the average game, and then there are several others that have a similar structure, and you kind of infer what level do they seem to be using, those are correlated with working memory, like how many digits can people remember, with education. So we have some data comparing Caltech students with Pasadena City College, which is a mile away. So controlling for geography, Caltech students, as you well know, are extremely good analytically. And they're also very homogeneous. Everyone is, there's no poets, right?"}, {"type": "text", "content": "0:23:07.7 SC: Yeah [laughter]\n\n0:23:08.6 CC: And drama majors. So they're really good, and they typically, the median math SAT is 800. We basically choose on verbal scores because there's so many, they're all good at standard STEM. And they were about... And these are old data, they were about one-half level extra thinking compared to the PCC, which was a little less than we thought. So there's some differences in groups and things like that.\n\n0:23:38.2 SC: Have you... I mean, this is gonna be a provocative question, have you compared Caltech to Princeton and Stanford and Chicago students?\n\n0:23:47.0 CC: No, but I'll have two answers to that question, the provocative question. And I'm not gonna conjecture what the truth would be, but you could guess what I would guess, and maybe your readers can. I was on sabbatical last year, thank you very much, Provost, at Harvard in the fall and MIT in the spring."}, {"type": "text", "content": "0:24:05.2 SC: Good.\n\n0:24:06.0 CC: And I think the difference is the Harvard students are not necessarily selected on IQ.\n\n0:24:12.8 SC: They're not. I was a Harvard grad student. I found that out.\n\n0:24:16.2 CC: Exactly, exactly. They do have a lot of \"In 10 years, I may be in the top 30 under 30 in Wired magazine.\"\n\n0:24:26.9 SC: They're gonna rule the world. That's their selection.\n\n0:24:29.1 CC: Yeah. \"The youngest congressperson in my state ever.\" And you would think... A little strategic thinking wouldn't hurt in those cases, but it's not what they're necessarily gonna gravitate toward being good at.\n\n0:24:44.8 SC: So you're gonna put the Caltech students up there.\n\n0:24:47.4 CC: Yes, yes. There is... I'll tell you a related thing since you mentioned that, and I do have data on this or somebody else has data. So there's something called the cognitive reflection test, which is basically brain teasers. And one of them is the bat and the ball problem, which is more famous, but I'm gonna use a trickier cool one that's called the algae pond problem. The idea is there's a little bit of algae in a pond. The amount doubles every day. It covers the pond in 48 days. On what day is the pond half covered?"}, {"type": "text", "content": "0:25:20.8 SC: [laughter] Okay.\n\n0:25:23.1 CC: And the answer is not 24. If the algae was growing linearly, 24 would be the correct answer. So it's the right answer to a question that's almost the right question. Right?\n\n0:25:35.2 SC: Right.\n\n0:25:36.4 CC: It's what we call level... What Danny Kahneman, who coined this term, called System 1 thinking. It's like a snap judgment. And the right answer is 47, because if it doubles every day, it has to be half of full one day before 48, which is 47. And so Shane Frederick, who concocted this, he's a professor at Yale, collected a bunch of data from lots of schools, including Harvard and, not Princeton, I can't remember everything that's on the list. And also he went to the Boston Common and just collected answers there."}, {"type": "text", "content": "0:26:14.0 SC: Yeah.\n\n0:26:14.8 CC: And the Boston Common is a big park in the middle of Boston, which is historically very important. I went to a political rally there. It's really super cool. And the Harvard students were a little bit below Boston Common. So on the cognitive reflection test, there's three questions. They're all a little different, but they have the same structure, like brain teaser structure. Right? Like there's an obvious wrong answer and then a subtler right answer. And so the scale goes from zero to three. The MIT students, I think, were 2.28 or something like that. We did some at Claremont, they were around maybe 1.6. And Harvard was a little bit below Boston Common. But I asked Shane about this and he said, \"Oh, no, no, no, but the Boston Common people, the day we went was an orchestra or something, and they may have been above average Bostonians. The Boston Common goers are not a representative sample of Bostonians.\" Like, okay, okay."}, {"type": "text", "content": "0:27:11.4 SC: He did not want to accept the result. Okay.\n\n0:27:15.1 CC: Anyway, anyway.\n\n0:27:16.3 SC: So the program then is, okay, people are not fully rational, but you don't want to just say they're not fully rational. You sort of want to dig into what it is they are doing, right?\n\n0:27:28.0 CC: Correct. Yes.\n\n0:27:28.4 SC: I mean, there is a process going on in people's brains that maybe even is optimizing something, but it's other than being a perfect reasoner.\n\n0:27:36.2 CC: Correct, correct. And from the get-go in behavioral economics, I started in the '80s, the people were always confronted with, \"What's your theory? What's a better theory?\" And that's exactly the right scientific question. So there is a kind of fringe of people early in the field of behavioral economics who were, I call them hecklers. It's like, \"Well, my cousin bought the wrong insurance plan. Therefore, we've disproved everyone being rational all the time.\" Well, like, great. What's the replacement theory? Right? And the replacement theory has been essentially a series of sort of boutique theories revolving around different kinds of computational challenges. So cognitive hierarchy is one theory in game theory, which has gotten quite a bit of traction, including in linguistics, which is a cool area, and a field called adversarial control, which is basically, you know, two fighter jets are trying to patrol and scare off another enemy fighter jet. Like, how does that... What are the trajectories they take? And so people have applied level-k type of modeling to that. So that's been pretty fruitful. And... Oh, let me briefly mention the field data. So, we also have a data with experiment with field data, not an experiment, it's a actual thing that happened. So one of the implications of this level-k cognitive hierarchy type thinking is that people will not fully infer information from somebody else's actions. For example, from 2000 to 2009, we have a sample of 600 big-screen wide-release movies in the US and other countries. And in those days, it was rare, but occasionally, but if you see a movie poster or an ad for the movies, it used to be the old days, you'll remember, some of your readers who are young won't, it used to be that Friday reviews, sometimes on TV and the newspaper, were a big deal. It kind of guided what people... And so the studios would send movie screeners to the critics, maybe on Monday or Tuesday. They said, \"Send us your review, even if it's bad. We may take a blurb out and it will say, 'Stunning, a magnificent cinematic achievement,' or 'Interesting, unusual.'\" If it says one word, that's bad."}, {"type": "text", "content": "0:29:55.6 SC: Yes.\n\n[laughter]\n\n0:29:56.8 CC: Right. Like, \"Nothing you've ever seen before.\" Right? Anyway, and so it turns out about 10% of movies were cold open, which means they were not shown to critics. And so it turns out the cold open movies are the worst ones, because critics later review them when they do come out and they get much lower ratings on what's called Metacritic, which is a nice aggregation of critic reviews. And so we took an aspect of this model that says some percentage of the moviegoers think that if there's no review, that doesn't mean anything. That means it's an average movie. But they're wrong, because the less average movies... So the fact that there's no review is bad news. In this case, no news is bad news. But psychologically it's a little tricky. It's kind of like Sherlock Holmes, the dog that didn't bark. Right? Like, if I didn't see a review, \"Eh, you know, maybe it got lost in the mail or they didn't have room in the paper,\" blah, blah. But if you step back and think about it a little bit. And so the prediction we made was that these cold open movies, given their later critic rating, would do unusually well because you're kind of pulling in people who didn't realize that no review is a bad sign. And you can see that in the data. There's about a 15% increase in box office gross from this kind of sucker effect."}, {"typ
