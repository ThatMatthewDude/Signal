 And he doesn't just change detective fiction, which didn't really exist as a genre. You have Poe, you have a few authors kind of doing a little bit, but it's really Conan Doyle who kind of transforms it into a genre. But he also transforms the serialization. So before he comes along, if you think of Dickens, he did serializations, but it was the same story told over different editions of a magazine. So if you pick up the magazine four editions in, you're gonna be a little bit lost because you haven't read the original start of the story. Now, what he does with Sherlock Holmes is he basically, each serialization is a story in and of itself. The repeat is the characters. And so if you pick up Holmes five issues into The Strand where it was published, you wouldn't be lost. You could go back and read the earlier ones and delight in it. You didn't necessarily need to read them in order. So he does kind of transform the serialization as well."}, {"type": "text", "content": "0:32:42.9 SC: And just to be clear, when Bell is writing a letter that says, \"My dear Watson...\" that's long after Sherlock Holmes is already famous. That was not the inspiration for Watson.\n\n0:32:51.3 LF: No, but Watson, Patrick Heron Watson, who's the ballistics expert who appears in 'Sleuth-Hound', he could potentially have been... That's where Conan Doyle maybe had gotten the name, because, again, he was a professor in Edinburgh at the time. But there is another Watson that Conan Doyle works with. And so there's a big debate about where did he get that name? But certainly, again, the thing is, Conan Doyle obviously deserves full credit for creating Sherlock Holmes. And there's so many other aspects, like the addiction probably comes from his father. His father was an alcoholic, and he comes really from this broken home because of his father's alcoholism. So those aspects are very much, come from within his personhood. But yeah, I think he absorbed the characters, like any good writer, the characters around him in Edinburgh, and just it all became sort of inspiration and fodder for Sherlock Holmes eventually."}, {"type": "text", "content": "0:33:50.0 SC: And just to understand Bell's influence on medicine. One of them is sort of the founding or pioneering of forensic pathology, for sure. But it seems from your descriptions that another one is just thinking a little less reductionistically, right, thinking that how someone smokes or walks or dresses might have something to do with their ailments in a way that maybe we're even today not very good at accepting.\n\n0:34:15.3 LF: Yeah, I mean, we lie to our doctors still today, don't we? [laughter] Or we don't tell them everything we should. I just went on to Dr. Mike and we were talking about this because literally a lot of patients don't even realize that, for instance, maybe you should disclose how many vitamins you're taking because sometimes you can actually overdose on vitamins and things like that. So we don't tell a full story even when we have good intentions. And so doctors still are very much part of that today. But yes, it's a way of seeing, it's a way of storytelling and connecting all of the dots. And like I said, I think ultimately he sort of revolutionizes the approach that forensic science takes. And like I said, he was working unofficially with Edinburgh's police surgeon, Henry Duncan Littlejohn, and he was bringing that method to crime solving in the 19th century. And together they both helped convict some serious criminals in the past."}, {"type": "text", "content": "0:35:09.7 SC: Let's talk about, more about that crime solving aspect because I think that, I don't know, I don't think it was Sherlock Holmes's invention, but maybe it was Conan Doyle's invention, the idea of the consulting detective, right? The idea that there's someone who's not actually employed by the police department but brought in to help solve cases. This is on every TV show, every police show right now, but it seems a little bit fictional. But for him it wasn't. He really was exactly that.\n\n0:35:35.3 LF: Yeah, he was working in the shadows, which actually made it very difficult to write at times. So there's an early case I talk about involving a man named Eugène Chantrelle. He's this French tutor up in Edinburgh. He's very charming and respectable but kind of sinister on the inside. And one day his wife takes very ill and later she dies at the hospital. And they believe that initially it was a gas leak, which is something that was common in the Victorian period. But Littlejohn's called to the scene, he becomes instantly suspicious. He knows that Chantrelle is a violent man, and so I believe that he brings Bell onto the case. Now, I could find no evidence about Bell being involved in this case, but there is an intriguing clue because when Chantrelle was executed for murdering his wife, he goes up onto the scaffold, he scans the audience, he locks eyes with the police surgeon and he says, \"Give my regards to Joe Bell. He did a good job putting the noose around my neck.\" And it just felt like such a Sherlockian moment. [applause] Like, how did he know? And then the other intriguing thing about Chantrelle, this charming man who was sinister on the inside, was that he was drinking buddies with Robert Louis Stevenson, and he became one of the inspirations for Dr. Jekyll and Mr. Hyde. But I have no actual evidence that Bell was involved, but Chantrelle allegedly says this on the scaffold. So it had to go in because it's one of those intriguing Sherlockian mysteries and it did, like I said, it felt so Sherlockian when he calls out to Littlejohn on the scaffold."}, {"type": "text", "content": "0:37:02.3 SC: So did they have a semi-formal or at least a regular relationship? Would Littlejohn call in Bell on a regular basis?\n\n0:37:09.6 LF: So Littlejohn is a bit older than Bell. He actually taught Bell, and so Bell was his former student, and he must have recognized this quality in him. And so he starts calling on Bell to be sort of second eyes on a lot of his cases. And you could imagine that was very useful. Sometimes what they would do is they would go their separate ways and investigate on their own, and then they would come back and compare notes. And they were often in agreement about where this investigation was heading. But they work on really fascinating cases. There's another one involving a baby farmer. Now, do you know what a baby farmer is?"}, {"type": "text", "content": "0:37:44.8 SC: I don't think I do. [laughter]\n\n0:37:46.7 LF: Okay. And probably people are listening. Every time I say baby farmer, people kind of pause and look curious about that. So in the 19th century, there was no birth control and there was no legal route for adoption. So women were having babies, tons of babies. And if you were poor, that became a huge problem. You couldn't necessarily feed all your children. So you would approach the baby farmer, you would pay the baby farmer a fee to farm the child out to a family who could take care of the baby. And so there was this case involving this woman named Jessie King, who's a baby farmer. And it begins in 'Sleuth-Hound' with these little boys finding this bundle of rags and using it as a football, football in the British sense. They're kicking this thing around, and after an hour, they get curious, they open the rags, and lo and behold, are the decomposing remains of an infant. And so begins the investigation into Jessie King, one of the first baby farmers to be caught and convicted in the 19th century. I don't wanna say it was common, but there are other baby farmers who are brought up for murder charges. And it's always this big scandal because it involves infants, it usually involves a female killer, and she basically just cuts out the middleman. She takes the baby, she takes the fee, and she dispatches these infants. And it was a terrible case. I believe that her lover was involved in this, but he ends up testifying against her and he is never punished for the crimes. [laughter] So there's a bit of that in the story, but it is a fascinating case that they work on."}, {"type": "text", "content": "0:39:20.3 SC: And what was Bell's role in that one?\n\n0:39:22.8 LF: So Bell's brought on by Littlejohn. So originally, when the first child is found, Littlejohn brings his son on because his son also becomes a forensic investigator. And they do the first postmortem. But then when they go to check out Jessie King's flat, they find another child. At that point, he decides, \"I better bring Bell into the case.\" So Bell performs the second postmortem with Littlejohn and they testify in the case as well. And I always think of the O.J. Simpson trial because do you remember how much evidence on DNA there was? It was like days of evidence, right? And it kind of backfired on the prosecution. It was technical, it was boring, and everybody got bogged down in the DNA evidence. I think of it because Littlejohn and Bell, forensic science was brand new. So a lot of the jury, they didn't have any base knowledge of forensics at this time, so they had to be incredibly good at conveying sort of technical information to them. And one of the ways that Littlejohn did it was through photography."}, {"type": "text", "content": "0:40:27.8 LF: He started taking photographs in the postmortem. He felt that the photographs would be more powerful and illustrative of what he was trying to say. But they were both incredibly good at just explaining the medical evidence. And I think that that's to their credit because, again, the jurymen... So in Scotland in the 19th century, you would have had 15 jurymen, and there were three options, which was guilty, not guilty, and not proven, which came with an acquittal. But it was... I always, I think we should bring not proven back because I feel like... Actually, Scotland just got rid of it in the last two years. They did actually have it up until recently. But again, to go back to O.J. Simpson, I feel like not proven would have landed better than not guilty, perhaps. I mean, it's still an acquittal, but perhaps the onus would be more on the judgment of the prosecution doing a poor job or whatever we think of that case. But yeah, I love that third option, not proven."}, {"type": "text", "content": "0:41:23.3 SC: And I think that Bell even had a tangential relationship to Jack the Ripper.\n\n0:41:29.4 LF: Yes. I mean, you can't write a book about murder in the 19th century without Jack the Ripper, right? I mean, Ripper's important for a lot of reasons. Like I said, 1888, he begins killing. The police can't catch him. So it just feeds the public's view, the poor view of the police at this time. Now, I will say in defense of the police, they're professionalizing. They have a lot of challenges. They don't have DNA, and there's a lot of things that they don't have access to. So it was a difficult job. But that kind of idea starts to emerge that they're useless. The other thing about Ripper is that in 1888, you have rising literacy rates and you have all of this cheap printing. So you have the media printing all of these articles about Ripper. And people were just as obsessed with true crime back then as we are today. I mean, I have a real problem. Netflix knows it too. They will email me the moment that they drop some kind of true crime and I am on it within hours. I'm like, okay, I got to watch that."}, {"type": "text", "content": "0:42:29.8 LF: So we all have a true crime obsession today, but I would say that they had it in the 19th century, too. They were consuming it through these cheap newspapers. So that's feeding that morbid curiosity. And then you have Sherlock Holmes being born into that kind of society and feeding again that curiosity that we want to see a peek behind the curtain. So Ripper's interesting in that sense. He gives us context for why maybe Sherlock Holmes became popular. But also, as you say, he does make a real appearance because Joe Bell, in an interview later in life, claims to have done an investigation himself with a good friend who was undoubtedly Littlejohn. And they went their separate ways, as they often did. And when they came back, they exchanged envelopes, and in the envelopes, they had written down the same name. Now, what's frustrating is, [laughter] they never told us."}, {"type": "text", "content": "0:43:20.9 SC: They don't tell us the name? Come on.\n\n0:43:22.5 LF: They don't tell us, which also, again, does feel a little bit... Like a little bit of mystery built into 'Sleuth-Hound'. But the other thing that happens is that there is a man named Henry... Sorry. William Henry Bury. And he was in Whitechapel at the time of the murders. He was married to a brothel madam. He was a violent man. He would disappear at times at night. So he certainly had the opportunity to kill at that time. He disappears shortly after the murders stop. He goes up to Dundee, Scotland, with his wife. And one morning, he says that he wakes up and she's dead on the floor. And he feels compelled to chop her up into pieces and put her in a box. [laughter] I mean, we've all been there, right? Like we wake up, our partner's dead..."}, {"type": "text", "content": "[overlapping conversation]\n\n0:44:07.2 SC: I just get these compulsions. Yeah.\n\n0:44:08.9 LF: Yeah, you just wanna chop up that dead body. So he does. He puts her in a box, and then he goes to the police and he confesses. He says, \"She was dead when I found her.\" And he says something about Jack the Ripper. He says he worries that people will think I'm Jack the Ripper, which of course then everybody thinks he's Jack the Ripper. And again, he did have perhaps the motive and opportunity to do these crimes. I don't think a lot of Ripperologists take him seriously, but there is one Ripperologist who writes a brilliant book about William Henry Bury. But my interest in him is that Littlejohn is brought onto the case. So I always say that Conan Doyle, Ripper, these people only appear in as much as their stories intersect with Bell and Littlejohn. And so Littlejohn helps to convict Bury. And now, take this with a grain of salt, the executioner claimed later that Bury had confessed to being Ripper. And so he would tell people that he had hanged Jack the Ripper. I'm sure it was a great pub story. I don't know if it was true. [laughter]"}, {"type": "text", "content": "0:45:07.8 SC: Fair enough. Yes, that's very interesting. But he's not one of the prime candidates from the Ripperologists?\n\n0:45:14.9 LF: No, I think, like I said, there is one book about him that... It makes an intriguing case. And when the police went to his flat in Dundee, there was old graffiti at the back of the house that said, Ripper lives here. And obviously he was a weirdo, and kids must have thought he was a weirdo and put that at the back of his house, painted it on. And certainly he was a violent man. We know that from a lot of reports. But was he Ripper? I don't know. I think there's probably stronger candidates, and we're never gonna ultimately know. But it is a fascinating, intriguing mystery that endures."}, {"type": "text", "content": "0:45:50.2 SC: So by the end, what did Joseph Bell think about the fact that he was known as the inspiration for Sherlock Holmes?\n\n0:45:57.1 LF: So in 1892, Conan Doyle does an interview, and the journalist says something to the effect of, all of this came from your imagination. And he says, \"Well, no, not all of it. I had this professor...\" and he tells these stories. And Bell read the interview, and he writes to his old student and he says, \"Am I the professor you're talking about?\" And Conan Doyle writes him this extraordinary letter which I've seen with my own eyes. And it says, \"Yes, it's to you I owe Sherlock Holmes.\" And they begin corresponding. Now at this point, Conan Doyle says that the journalist really wants to know Bell's name. Does he have permission? \"But I must warn you that your life is going to get crazy if you do agree to this.\" But Bell does agree to it. But Conan Doyle weirdly kind of goes a step further. He then basically does a modern doxing of Bell. [laughter] He dedicates the Holmes stories to Bell and he puts his address right in the front of the book. So now everybody knows..."}, {"type": "text", "content": "0:46:53.3 SC: Oh, my goodness.\n\n0:46:53.4 LF: Bell is the inspiration, but also they have his address. And journalists would just show up to his house, and they became obsessed with the \"real\" Sherlock Holmes. I think at first Bell was really flattered by this. I mean, who wouldn't be? But then it did get irritating. And there was one letter he wrote to a friend and he said something to the effect of, \"My old student must not have thought very highly of me to put this heap of rubbish on my head.\" And I think that was a reference to this kind of sociopathic character of Sherlock Holmes. Bell wasn't that. He was a very empathetic man. He was a family man. So there was a lot of differences. And like we said earlier, it was like a caricature of Bell, but people couldn't really distinguish. They wanted to see him as Sherlock Holmes."}, {"type": "text", "content": "0:47:39.9 SC: Okay, I wanted to mostly talk about this because this was your new book and it's a fascinating story, but your previous book is also very fascinating. And maybe I can convince myself that there's a through line that takes us in history to that. [laughter] So tell us about the title and the subject of your previous book.\n\n0:47:55.1 LF: Okay, well, there's always a through line in the sense that there are always stories about huge kind of shifts in medicine. So we'll just say it's about that. But it's... The story was called... The book is called 'The Facemaker'. And it's about a man that most people don't know anything about. His name was Harold Gillies, and he's sort of now known as the father of modern plastic surgery. He was rebuilding soldiers' faces in the First World War. And it was an incredible time. Weaponry in the First World War was advancing so much that a company of just 300 men in 1914 could deploy equivalent firepower as a 60,000 strong army during the Napoleonic Wars. And you have all kinds of inventions like the tank, you have the flamethrower, you have chemical weapons. And a lot of these men were getting injured in the face. They were getting shot in the face. They were losing parts of their jaw and their noses. And Gillies was giving them back an identity. He was giving them back a sense of self. Because I always say that medicine isn't just about survival. It's about what comes after surviving."}, {"type": "text", "content": "0:48:57.7 SC: And it's especially interesting because, I mean, this is just an informal impression I have. You tell me if I'm right or wrong, but World War I was like the peak of people being disfigured, right?\n\n0:49:10.6 LF: Yeah.\n\n0:49:10.7 SC: They had enough firepower to disfigure a lot of people without just killing all of them. And so there was just this tremendous number of people missing legs or with their jaws blown off or something like that coming home afterward.\n\n0:49:21.7 LF: Yeah, there was a battlefield nurse who said that the science of healing stood baffled before the science of destroying. And I think that that was true. I mean, the technology was moving on. Also, a lot of these men, especially at the beginning of the war, they weren't being given adequate gear. A lot of these men who volunteered didn't think that the war was going to last very long. There's a story in 'The Facemaker' about a boy going to volunteer, and they said something to the effect of, \"Would you like to be in the army for a year or until the end of the war?\" And he thought, \"Well, I don't wanna be in the army for a year. I will stay until the end of the war,\" which lasted four years. So nobody knew what they were getting into, and the devastation was huge. And so you do get some early forms of facial reconstruction during the Civil War. You guys can Google that. It doesn't look good. And there's a good reason for that, because Civil War surgeons don't believe Joseph Lister yet."}, {"type": "text", "content": "0:50:15.6 SC: Oh, no.\n\n0:50:15.7 LF: So infection rates could be really high, right? So they're going in, they're just fixing the functionality, like your ability to eat or to speak, but they're not trying to make it look good. It's really under Gillies where this idea that something that looks good or looks typical also tends to function better. So if your nose is in the right place, it's going to function better than if it's off to the side of your face. So he really kind of marries the aesthetics with the functionality. The other big thing is that it just comes down to sheer numbers. 280,000 men during the First World War needed some form of facial reconstruction. So it was this incredible opportunity to experiment. I hate to say that, but it really was a big experiment. And so he essentially births this whole discipline of plastic surgery. And I always say that it's kind of ironic because he's trying to give these men back an identity, but plastic surgery has now sort of made us all ultra-aware of how we look. And we're all a little bit paranoid about how we look, and..."}, {"type": "text", "content": "0:51:15.8 SC: A little bit of a backlash, yeah. Right.\n\n0:51:17.5 LF: Yeah, a little bit. I mean, he does... After the war, he does move into the cosmetic realm, and he very much believed that people should have control over the aspects of their identity. If they were unhappy with their nose or they were unhappy with some aspect, they should be allowed to change that. So he didn't really bring that kind of judgment. But obviously his first and foremost love was helping these soldiers and giving them back that identity through the rebuilding of their faces.\n\n0:51:43.2 SC: And one of the interesting points that you made was people would come back from World War I with missing a leg, and that was horrible, but you'd be respected by society. You'd given up a leg, you'd made a sacrifice. Whereas if they were missing a jaw, you were kind of shunned. There's a little ostracism there because people thought it was disgusting to look at you."}, {"type": "text", "content": "0:52:04.1 LF: Right. I say that it was a time when losing a limb made you a hero, but losing a face made you a monster. And people, I mean, I think people today still have trouble with disfigurement. I certainly think Hollywood does. Think about how many villains are disfigured. You have Darth Vader, Voldemort, the Bond villains, Joker. I mean, it's this very lazy trope for evil. And so we still struggle with disfigurement. And it was very isolating. These men were forced to sit on brightly painted blue benches when they left the hospital so that people knew not to look at them. And so it was really isolating, and a lot of the wounds were psychological at that time. And so Gillies, there's one patient of his, Private Walter Ashworth, who undergoes surgery with him, multiple surgeries. His fiancee breaks off their engagement, which was not uncommon. And then the fiancee's friend ends up writing to him because she thinks this is rather awful, and they end up falling in love. When he's discharged from the army... And his face, I think Gillies does a very good job given the limitations of the time, but he still has the scars. And when he goes back to work as a tailor's assistant, his boss makes him work at the back of the shop so that he doesn't frighten the customers. So it was terrible."}, {"type": "text", "content": "0:53:21.0 LF: And then years later, he moves to Australia with his wife and they run into Harold Gillies. And Gillies at this point is a very famous reconstructive surgeon, and he's delighted to see Ashworth. And as surgeons are wont to do, he asks if he could have another go at Ashworth's face. [laughter] But Ashworth declines. He had made peace with the face he had been given, a face that had brought him happiness. And so I always say that 'Facemaker' is about identity. What does it mean to have a face, to lose a face, and to gain a new kind of face? Ultimately, I mean, we even use the face as... In language, we say like a bald-faced lie or two-faced. The face is so important. People see a face before they hear a voice. And so Gillies' work is so important and so impactful. He also was... This is really funny too. He was a semi-pro golfer. He was an incredible golfer. And my editor must be a golfer because every time he introduces me to audiences, he says, \"Harold Gillies, the golfer,\" and I'm always like, I get up and then I say, \"He was also a surgeon.\" [laughter] It wasn't, like he's out on the links and he just decides, \"I can rebuild that guy's face.\""}, {"type": "text", "content": "0:54:31.5 LF: But he was... I actually have a golf card of his from the early 19th century that a friend gave me. So he was... But he had a very light attitude. He was a bit of a prankster and a jokester, and he had this ability to see beyond the disfigurement, which was hard. I mean, remember, this is not a time when you have movies and television and we're all kind of used to gruesomeness on some level. And so a lot of the World War I nurses and doctors themselves really struggled to look at these men. And the devastation was huge. Ashworth, to go back to his story, he lays on a battlefield for three days unable to scream for help because his jaw is, lower jaw is entirely destroyed. So these men, it could be difficult, but Gillies could get past that. He developed relationships. He would joke with them. And that was a huge part of the psychological healing. He eventually establishes the Queen's Hospital, the first kind dedicated entirely to plastic surgery. And I always say that this was a huge moment for the men because if you were disfigured and you were sent to a general hospital, a lot of the men there wouldn't be disfigured. And so you might feel self-conscious or shy. But at Gillies' hospital, everybody was disfigured."}, {"type": "text", "content": "0:55:47.3 SC: Everyone was.\n\n0:55:47.4 LF: And so it was a bit freeing, and they would take classes and it was a real community of men. And they... Some of them still struggled. I met somebody on book tour who said that his grandfather or great-grandfather, I can't remember, had been operated on Gillies, but that he went on to live a life as... Of a recluse. He just never really got over it. And of course, Gillies didn't always succeed. Sometimes these men died in his care. You can see images of the men in my book, but I was very careful that if the patient died in his care, I only include a pre-injury photo and a surgical diagram of what he had hoped to accomplish. But yeah, I mean, failure was his constant companion, as it is with every doctor who's trying to do something revolutionary. But a lot of the men were able to kind of return to life and felt very grateful for what Gillies was able to do for them."}, {"type": "text", "content": "0:56:42.6 SC: There's this underlying current whenever we talk about medical history of moralizing a little bit. I mean, going back to the anesthetics, in some sense you should suck it up, the pain. If we remove your pain, you're not really doing your part as a patient. And with the cosmetic surgery, you should accept how you look or whatever it is. I think even today we have this idea that there are terminal patients who would like more pain medication and we say, \"No, we don't want you to get addicted,\" and they're like, \"Well, I'm gonna die.\" [laughter] It's...\n\n0:57:14.5 LF: Yeah, I know. It's a really important point. And I went through breast cancer in 2022 and my surgeon ended up reaching out to me. He said, \"Do you want a second opinion?\" He had just read 'The Facemaker'. And because I'm in England, I originally was doing this through the NHS. I then ended up going private, and he's based in London. And the thing that changed my mind was that he was gonna do reconstruction. They didn't offer that initially for me. And I said that when you get cancer, your focus is on surviving, and it's nice to have a surgeon who's also thinking about the body that you need to occupy after the cancer is gone. And so I think that that's... Yeah, you're right. And even with going back to the pre-anesthetic era, we tend to think about the patients, but also spare a thought for the surgeon, because imagine going into that operating theater and having to take off somebody's leg. And then the other thing was that these patients were dying, and you're in the business of saving lives. It would have been very demoralizing. If you've ever seen The Knick, I don't know if you ever saw that show."}, {"type": "text", "content": "0:58:16.2 SC: I watched the first couple of episodes. Yeah.\n\n0:58:18.8 LF: Yeah, that first episode where the surgeon just can't... It's right in the opening gambit. He can't handle the fact that his patient died, because they just keep dying, and he ends up taking his own life. That would have been a real psychological burden, I think, for surgeons of the past. Also, it was a dangerous job. Doctors died frequently. They caught smallpox, they caught tuberculosis. These diseases were around. We didn't have antibiotics. We didn't have the gamut of vaccines that we have today. We did have smallpox vaccine in the 19th century, but it wasn't as effective as the one that ultimately eradicates smallpox. And by the way, if you don't... If you think smallpox wasn't a big deal, definitely Google it. It was horrendous. One teaspoon of smallpox is enough to kill everybody on Earth. It's an incredibly devastating disease. It is the only human disease that we've ever fully eradicated. So if you're a younger listener, you will not have been vaccinated for smallpox because you don't need to. It's gone. We killed it. But interestingly, after 9/11, George W. Bush did start ordering that some military personnel be vaccinated for smallpox because there was the fear that it could be used as a biological weapon. But yeah, I mean, it's an incredible moment in medical history. So I always say spare... Obviously being a patient was terrible, but I would think that being a surgeon also in the past was a pretty big burden."}, {"type": "text", "content": "0:59:45.6 SC: I think you mentioned that Joseph Bell was an early advocate of vaccinations.\n\n0:59:49.7 LF: Yeah, he was. And he was an early advocate of antisepsis. Like I said, he advocated for women in medicine. So he was always sort of at the forefront of progress there. I mean, smallpox... So Edward Jenner comes up with the first vaccine. Now, there's gonna be people who in the comments are gonna be like, \"That's not true. It existed before then.\" But here's the difference. They used to call inoculation and vaccination... They were different terms. We now use them interchangeably. So what existed before Jenner was inoculation. Inoculation uses the live smallpox virus, which was dangerous, obviously. You could die from it, or you could trigger a small epidemic or outbreak in your area. Now, what Jenner does is he notices that dairy maids are not catching smallpox because they get something called cowpox, which is not very dangerous, but it seems to confer some kind of immunity against the deadlier smallpox. So he starts... He creates his vaccine from the cowpox. He calls it a vaccine. It comes from the Latin terms meaning from the cow. And that was the first ever vaccine. And people were against it. I mean, you get these satirical drawings in the early 19th century of people turning into cows, and... [laughter] So there was fears... There were fears around it. They would burn effigies of Jenner. There were people back then who were fearful of it, but it was somewhat effective against smallpox, and... But you have Henry Gray of Gray's Anatomy who catches smallpox anyway, and he had been vaccinated. So it wasn't foolproof by any stretch of the imagination."}, {"type": "text", "content": "1:01:19.5 SC: Back to Gillies, then. What were his major sort of technological innovations? When we say plastic surgery, was it skin grafts? Were you moving bones around? Were you moving blood vessels around?\n\n1:01:34.1 LF: I mean, that's a really good question. So one of the things... The thing that made Gillies so progressive was that he took a real interdisciplinary approach to rebuilding the face. He was introduced to this desperate need for facial reconstruction by a dentist called Valadier. And he was like this bigger than life hero. He had a Rolls-Royce that he retrofitted with a dental chair, and he literally drove it to the front under a hail of bullets. This guy was just a legend. He deserves a Netflix series on his own. And Valadier was rebuilding these faces, but because he was a dentist, he required medical oversight, so Gillies was assigned to do this. So when Gillies opens his own hospital, he brings dentists on board. At the time, dentists were seen to be much lower than the surgeon, and not a lot of surgeons were willing to work in that kind of interdisciplinary way. He also brings in artists, he brings in all kinds of people. And so the dentist dealt with the hard aspect, like the architecture of the face, the bone, and then Gillies dealt with the soft tissue. And in fact, plastic surgery literally means that, the soft, malleable tissue that you use to rebuild."}, {"type": "text", "content": "1:02:43.9 LF: And what he would do is he would take flaps of skin, maybe from the chest, and he would move it to the face. He would roll it in a tube, if you can imagine, almost like an elephant trunk. And then he would attach one end to the face. And once that end built its own blood supply, he could sever it from the chest and move the other end back up to the face, and eventually he'd have enough tissue to rebuild the face. Near the front, these men would get their faces damaged, and a lot of times, battlefield doctors would just hastily stitch up because they wanted to stop the bleeding, and they wouldn't address the underlying loss of tissue, so the face would cave in. Also, they were sometimes inadvertently sewing up the bacteria from the battlefield into the face, so they were literally sealing these men's fate. So if they made it to Gillies, if they were lucky enough to make it to Gillies, he'd have to unpick the work done at the front, and it could take years to rebuild a face."}, {"type": "text", "content": "1:03:36.4 SC: And it sounds like, okay, I can snip out a little piece of skin somewhere and move it, but it would just die if I just snipped it out.\n\n1:03:43.3 LF: Right you can't... Yeah, exactly. Now we have microsurgery, and what plastic surgeons can do is amazing. They can move... They can completely sever something from its blood supply and rebuild the blood supply elsewhere. Gillies didn't have that option, so he had to move these flaps of skin slowly. So you might start at the thigh, move it to the abdomen, and then up to the chest, and then finally to the face. So it would take a long time to kind of get the tissue you needed. The other thing was, anesthetizing these men was a nightmare. Anesthesia hadn't really progressed since 1846, so you're talking about a rag or something placed over the face. You're missing your nose, your mouth. This was really difficult. And so it's really his anesthesiologist, a man named Ivan Magill, who comes up with the idea of intratracheal anesthesia. And it's important for so many reasons, not least because when these patients would be anesthetized, they were breathing ether back into Gillies's face, and he was getting woozy. [laughter] This is not what you would want if you're undergoing delicate facial reconstruction. So these things kind of go hand in hand. World War I is an amazing time of change in medicine. You have the first blood transfusions, the first blood banks near the front in empty shell casings. But I also like to remind people that as these doctors got better at mending these men, they of course were being sent back to the front, and it was feeding the war machine. And so it was a bit of a cycle, and I think that we have to acknowledge that part of the story too."}, {"type": "text", "content": "1:05:12.2 SC: Yeah. And like Lister, did Gillies's innovations catch on elsewhere?\n\n1:05:17.5 LF: Oh, yeah. I mean, Gillies basically births all of plastic surgery. I go around talking to plastic surgeons at conferences and they all know of Gillies. It's kind of like a genealogy for them. And there's not that many degrees of separation. I've met people who were trained by somebody who was trained by Gillies. [laughter] It's incredible. But yeah, there... And I always remind people too, because of course, we do now think of plastic surgery as fully cosmetic. Cosmetic surgery is one part of plastic surgery. There is still reconstructive surgery. I underwent it for breast cancer. People still undergo very important reconstructive surgery. And a lot of plastic surgeons only do reconstructive surgery. They work with cancer, accidents, war victims. There are teams of surgeons... There's this surgeon in Texas named Steve Orton, and he is doing this amazing work in Ukraine. We are seeing the return of trench warfare in places like Ukraine and people are getting injured in the face and they are doing the work of Gillies, but they're doing it faster and with the benefit of what Gillies had taught us."}, {"type": "text", "content": "1:06:19.4 SC: And he also did pioneering gender affirming surgery.\n\n1:06:23.1 LF: He did, yeah. A lot of people again think that this is something new, but he performs the first phalloplasty on a trans man in the 1940s, a man named Michael Dillon. Michael Dillon is eventually outed by the British press and there's this real media frenzy around him and he's sort of driven from Britain. But Harold Gillies, he stood by Michael Dillon and again, he really felt that people had a right to control their identity, whatever that meant for them. And he was the surgeon that could help do that. So Gillies's technique for a phalloplasty is still, I believe, used today. And so, yeah, he was very progressive in so many ways."}, {"type": "text", "content": "1:06:59.6 SC: It's, again, it's a weird thing where we have these preconceptions about what you're allowed to care about and you're sort of not to care about... Not supposed to care about your looks, even though it's one of the things most people care about the most. [laughter]\n\n1:07:13.6 LF: Yeah. And we do. And I always say this too, like going on podcasts and stuff, I always have to ask if they're gonna be video because the threshold for women going on video is a little bit higher than men. And that is a reality and it's not just vanity. You worry about all kinds of things. People get... There's the pretty privilege, for instance. Everybody knows about pretty privilege. And so I always try to be very aware, especially having written 'The Facemaker'. I worked with a disability activist, a woman named Ariel Henley, who actually calls herself disfigured. She uses that term to describe herself. She has Crouzon syndrome. And we talked about language because disfigured is not a word we would necessarily use today. You might say facial difference. But we both agreed, and not everybody will agree with this, but we both agreed that that was the correct term for 'The Facemaker' because these men were disfigured to the people who looked on their faces. They were isolated, they were on the fringes, and I didn't wanna lessen that experience that they went through by using softer language to describe it."}, {"type": "text", "content": "1:08:19.6 SC: And then, do I remember correctly that Gillies died while performing surgery?\n\n1:08:27.0 LF: He has a stroke. Gosh, you're really asking me here. I got 'Sleuth-Hound' in my head and you're asking me to go back to 2022. But yes, I think he had a stroke. He doesn't die immediately, but that is the thing that ultimately kills him off. And the man who read the audiobook is Daniel Gillies, who's an actor. He's in Vampire Diaries amongst many other things. And I joked on Twitter, \"Hey, you should read the audiobook,\" and he did. He agreed to it. And it was amazing because I got to see him learn about Gillies through the book. He obviously knew about Gillies. Gillies is his great-great-uncle."}, {"type": "text", "content": "1:09:00.8 SC: Okay.\n\n1:09:01.5 LF: But he didn't know all of the details about Harold Gillies's life. And he said that he was often told stories about Gillies's life after the war when he was trying to establish plastic surgery as a discipline and he had to move in the cosmetic realm. So he would kind of sidle up to people and be like, \"You know, I could fix that for you.\" [laughter] Those kinds of stories. And in the epilogue, there are some kind of funny stories. There's a woman who injects paraffin wax into her face, if you can imagine a terrible idea like that, and it starts to migrate and get lumpy around the jaw. And so he's asked to remove this. And of course, the face looks worse after surgery than it looks before. And the husband thinks that Gillies has ruined her face and comes in with a gun and threatens his life. And so Gillies joked, because he was such a jokester, he just joked that he wore a bulletproof vest after that. But he was learning. I mean, he continued to do congenital stuff, he did accidents. Women also removed hair using X-rays. Again, terrible to think that they were X-raying their face to remove the hair. But one woman gets so much cancer on her face because of this that he has to remove big portions of it. And he said that the nurses in the room after that wanted to kill him because he had taken so much of her face, but there was really no option at that point. She had had so much cancer. But he does rebuild her face over several other reconstructive surgeries. But he continued to do that kind of \"important work\", but I would say that he also felt his cosmetic work was important as well because it helped people make peace with their appearance."}, {"type": "text", "content": "1:10:34.0 SC: You know, I think the lesson for me of our conversation is I'm on Arthur Conan Doyle's side. This stuff is fascinating, but I don't wanna do it for a living. It's a little bit too intense for me, I got to say. [laughter]\n\n1:10:45.4 LF: It can be. I know. And I always... My threshold for gross is pretty high. And I went onto a podcast, it was a royal history podcast, and I started talking about Abigail Adams having a mastectomy without any anesthetic. And the guy, one of the co-hosts, was like, \"Well, back to Queen Victoria.\" And I thought, \"Oh, the red line was the mastectomy.\" I kind of forget. I have no filter. So if you ever see me at a party, either avoid me or come and talk to me, depending on your sensibilities there."}, {"type": "text", "content": "1:11:13.3 SC: Just know what you're getting into. And I think that everyone now...\n\n1:11:15.9 LF: Know what you're getting into.\n\n1:11:16.9 SC: Now knows. So, Lindsey Fitzharris, thanks very much for being on the Mindscape Podcast.\n\n1:11:20.7 LF: Thanks so much for having me on.\n\n[music]"}], "text_post": false}, {"id": "7688782ca6a0b4fa", "title": "Back from D.C.", "url": "https://edwardfeser.blogspot.com/2026/11/back-from-dc.html", "source": "Edward Feser's Blog", "tag": "philosophy", "published_at": "2026-11-16T06:22:24+00:00", "panels": [{"type": "snippet", "content": "On Friday I\nwas on an airplane headed to Washington, D.C. for the American Catholic Philosophical\nAssociation’s annual conference .  Midway\nthrough the flight, the captain informed the passengers that the FAA had grounded\nflights nationwide due to a failure in the communications system but that we’d be able to land at our destination.  No further information was given, and the\nplane’s Wi-Fi service wasn’t working either, so it was impossible to learn much\nbefore the plane landed.  Very alarming,\nespecially given the previous day’s Microsoft outage and recent reports about administration\noffici", "read_more_url": "https://edwardfeser.blogspot.com/2026/11/back-from-dc.html", "read_more_source": "Edward Feser's Blog"}], "text_post": false}, {"id": "08edc77e33fec22b", "title": "Reading List 11/14/2026", "url": "https://www.construction-physics.com/p/reading-list-11142026", "source": "Construction Physics", "tag": "engineering", "published_at": "2026-11-14T16:09:38+00:00", "panels": [{"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!zGXa!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff24e470a-259e-4a7d-82e8-973e89e64845_1866x1328.png", "alt": ""}, {"type": "text", "content": "Welcome to the reading list, a weekly roundup of news and links related to buildings, infrastructure, and industrial technology. This week we look at a Brooklyn building collapse, BAAJA’s odds of passing, reusing old memory in new phones, a nationwide aircraft ground stop, and more. Roughly 2/3rds of the reading list is paywalled, so for full access become a paid subscriber.\n\nA 3 story building in New York partially collapsed into an adjacent construction site that was being excavated, killing 8 people and injuring 18. Good reminder that for as burdensome as various building regulations can sometimes be (particularly in New York, with its ubiquitous sidewalk sheds), they don’t exist for no reason. [ Construction Dive ]"}, {"type": "text", "content": "On the other hand, that doesn’t mean that we shouldn’t evaluate code requirements to see if the benefits they bring are worth the cost. An article in the Washington Post argues that many requirements to upgrade electrical panels for higher load devices are often unnecessary. “ Outdated industry practices and in some places outdated electrical codes are regularly resulting in the recommendation that people need to upgrade their electrical panels if they want to add appliances such as induction stoves, heat pumps and electric-vehicle chargers. The expense — at a median of $3,500, and triple or quadruple that in some settings — is deterring some energy-efficient upgrades and making the projects far more costly for those who proceed. But some researchers say panel upgrades are almost always unnecessary. One report this year found that 98 percent of homes with 100-ampere panels, the smallest common size, have room to add popular electronic devices. ” [ Washington Post ]"}, {"type": "text", "content": "The US now has over 1500 mass timber buildings, up from fewer than 100 a decade ago. [ The Real Deal ]\n\nThe current probability of permitting reform bill BAAJA becoming law is little over 50% on Kalshi. [ Kalshi ]"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!EYz1!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fffd3baed-59d6-4e3b-98b2-969290bde4c6_1460x922.png", "alt": ""}, {"type": "text", "content": "A Houthi missile hit Saudi state oil company Aramco’s skyscraper in Riyadh. [ X ]"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!rSX_!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5b751a4d-0f45-42ce-aac9-f7c69b262504_1176x1284.png", "alt": ""}, {"type": "text", "content": "A new Nicholas Bagley paper on the cost of federal permitting, arguing that the real costs of things like NEPA is the huge amount of effort agencies put in to try and make things “litigation proof”. “ The evidence does suggest, however, that the bulk of the costs of the federal permitting regime stem from the defensive measures agencies and developers take to guard against the risk  of a bad outcome in court. That insight allows for a rough evaluation of the likely effects of popular permitting reform ideas. Some—including popular ones like time limits and statutes of limitations—are unlikely to accomplish much. Only those reforms that change the incentives created by the risk of judicial review will meaningfully move the needle. ” [ Nicholas Bagley ]"}, {"type": "text", "content": "A progress report from the Center for Land Economics, which advocates for land value taxes to make more efficient use of urban land. ” Three states passed laws enabling land value taxes in some form: Kentucky, Virginia and New York. In each of them we’re now helping cities work out how to put them into practice. Five more states and DC considered similar bills. This is the most legislative momentum the movement has seen in decades… ” [ Land Economics ]\n\nRead more"}], "text_post": false}, {"id": "17e9fc537e0ce9be", "title": "A Banker’s Guide to Anthropic", "url": "https://www.netinterest.co/p/a-bankers-guide-to-anthropic", "source": "Net Interest", "tag": "financial", "published_at": "2026-11-13T18:00:43+00:00", "panels": [{"type": "text", "content": "Reminder: I’m on stage at the TomorrowX Summit in Austin next week, and then at Fintech Nerdcon in San Diego. I’ll then be in New York. If you want to catch up, please get in touch.\n\nWhen Anthropic lists on the stock market next week, the money it raises will be just the start. Through its IPO, Anthropic plans to raise as much as $100 billion. Leveraged up, though, that can go much further.\n\nSo far, Anthropic has refrained from tapping the corporate bond market. As a young start-up burning billions of dollars a year on an untested business model, it would hardly have had a look-in. Instead, it has relied on equity investors and on suppliers, who together have put in more than $140 billion.\n\nBut with a Nasdaq listing and a cash pile of $212 billion, its charms are harder to resist. In the run-up, it already secured a $15 billion revolving credit facility from banks managing its IPO. The bigger prize is the bond market. Shortly after its own IPO in June, SpaceX raised $25 billion of senior unsecured bonds. Anthropic’s bankers would like to follow."}, {"type": "text", "content": "To do that on good terms, it needs a credit rating, specifically an investment-grade one. Its bankers, Morgan Stanley and Goldman Sachs, have been lobbying Moody’s and S&P to grant one as soon as it lists. A rating of BBB– or higher would open Anthropic up to the $13 trillion global investment-grade market, and the insurers and pension funds that dominate it.\n\nSuppliers have a vested interest, too. When we discussed it in The Art of Doing Financial Engineering , Broadcom had agreed to stand behind $30 billion of debt raised to buy hardware leased to Anthropic. Last month, a second deal took its commitments to more than $70 billion. Broadcom would like to share the load. “It’s an open secret, Anthropic is well on its way to an IPO, and with that, its investment credit will change,” chief executive officer Hock Tan told analysts. An investment-grade rating would let future financings rest on Anthropic’s own credit, rather than its suppliers’."}, {"type": "text", "content": "Even the revolver hinges on it: for now the facility is secured, but the collateral falls away – and the pricing improves – once two of the three major agencies call Anthropic investment grade.\n\nOne agency reckons it’s there. AIR Platforms is an AI-native credit intelligence and risk-scoring startup founded by Moody’s and Goldman Sachs veterans. It rates Anthropic BBB, two notches above OpenAI. Sadly for the company, AIR Platforms is not a “nationally recognized statistical rating organization” so it doesn’t count. Kroll Bond Rating Agency, which is, rates Anthropic BB+. Blackstone, which marketed the latest Broadcom-backed deal, thinks a rating in the BB range is more likely once the IPO is done."}, {"type": "text", "content": "Key to the outcome is Anthropic’s cash flow profile. A $1.4 trillion market cap would be nice, and would give comfort to lenders, but it can’t be used to repay debt: you need free cash flow for that. To see how Anthropic plans to pay for close to $1 trillion of commitments, and who is lending it the money, read on.\n\nRead more"}], "text_post": false}, {"id": "0d4614944ee44a54", "title": "Rocket Report: Starship set for historic test flight; a century of Electron", "url": "https://arstechnica.com/space/2026/11/rocket-report-starship-set-for-historic-test-flight-a-century-of-electron/", "source": "Ars Technica — Rocket Report", "tag": "engineering", "published_at": "2026-11-13T12:00:40+00:00", "panels": [{"type": "text", "content": "Welcome to Edition 9.19 of the Rocket Report! Will something historic happen this weekend? No orbital rocket has ever been fully recovered with the intent of reusing all of its components. But that's just what SpaceX is going to try to do with a Starship launch on Friday, and an upper stage landing attempt 22.5 hours later on Saturday afternoon, local time. Ars will be on hand in Starbase, Texas, to provide coverage of it all.\n\nAs always, we welcome reader submissions , and if you don't want to miss an issue, please subscribe using the box below (the form will not appear on AMP-enabled versions of the site). Each report will include information on small-, medium-, and heavy-lift rockets as well as a quick look ahead at the next three launches on the calendar."}, {"type": "image", "src": "https://cdn.arstechnica.net/wp-content/uploads/2018/05/smalll.png", "alt": ""}, {"type": "text", "content": "Electron set for milestone launch . The next launch of Rocket Lab’s Electron vehicle is due to lift off from the Mahia Peninsula in New Zealand on November 14 at 5:30 UTC. This mission will serve as Electron’s 100th overall mission—a notable milestone for the small rocket that first flew in 2017, NASASpaceflight.com reports .\n\nRead full article\n\nComments"}], "text_post": false}, {"id": "93e9c6194ae7a42c", "title": "Technology as a Search Problem", "url": "https://www.construction-physics.com/p/technology-as-a-search-problem", "source": "Construction Physics", "tag": "engineering", "published_at": "2026-11-12T13:01:45+00:00", "panels": [{"type": "text", "content": "One of my ongoing research interests is understanding the nature of technological progress: How does new technology come into the world and improve over time? What sort of factors affect it? How, in general, should we think about it? I’ve come at this question from a few different angles: posts looking at the operations and legacy of Bell Labs, posts looking at how specific technologies improved over time, posts looking at how frequent multiple invention is and how long we wait for new inventions , and so on.\n\nMy current line of thinking is that creating some new technology is best thought of as a search process . A given technology can be thought of as a point in some high-dimensional “design space” or “technology space,” which contains every possible technology: every conceivable arrangement of parts, materials, natural phenomena, and so on. The job of the would-be inventor is to navigate this space, sifting through the arrangements of elements that don’t work to find the ones that will."}, {"type": "text", "content": "This search process is made difficult by the fact that, as with any situation where you’re enumerating the possible combinations of a large number of elements, technology space is incomprehensibly vast. In “ Are Technologies Inevitable? ” economist Matt Clancy notes that Wikipedia listed 272 “named equations” that describe various regularities in the world, ranging from the Navier-Stokes equations (which describe the motion of fluids) to the Arrhenius equation (which describes chemical reaction rates as a function of temperature) to the Exner equation (which describes how sediment gets deposited in a river). If we use this as a (very rough) estimate as to the number of different phenomena that a technology can leverage, it implies an enormous number of possible technologies that could be created. As Clancy writes:"}, {"type": "text", "content": "If we’ve got 272 regularities to work with, for example, then the number of possible combinations of these regularities is two, raised to the power of 272 (since every regularity can be used or not used: two options). But 2^272 is more than some estimates of the number of atoms in the observable universe. And that’s got to be an undercount of the number of possible technologies, since it counts all technologies that use the same principles together as the same thing, even if they orchestrate them in vastly different ways or use them in vastly different magnitudes.\n\nBy comparison, the most common estimate for the number of atoms in the universe is around 10^80, or ~2^265. And it’s likely there are many, many more regularities that some technology could harness than 272. (Some in-progress work on this that I haven’t yet completed suggests that there are at least thousands.)"}, {"type": "text", "content": "And as Clancy notes, this outrageously huge number dramatically undercounts the number of possible technologies, because it doesn’t take into account that the same phenomena can be used in lots of different ways. In Brian Arthur and Wolfgang Polak’s paper “The Evolution of Technology within a Simple Computer Model” (which we looked at earlier this year ), Arthur and Polak note that even within the universe of logic circuits made up of three basic elements (the NAND gate and the values of 1 and 0), the number of different circuits you can make for even a small number of inputs and outputs is staggeringly large:\n\nThe emergence of circuits such as 8-bit adders seems not difficult. But consider the combinatorics. If a component has n inputs and m outputs there are (2^m)^(2^n) possible phenotypes, each of which could be realized in a practical way by a large number of different circuits. For example, an 8-bit adder is one of over 10^177,554 phenotypes with 16 inputs and 9 outputs."}, {"type": "text", "content": "So the search space for some new technology is vast. And the way that we tackle vast search spaces is with information . Each bit of information cuts a search space in half, so even a relatively small amount of information can quickly narrow down what seems like a huge search space. When we create some new technology, what we’re doing is gathering information: figuring out what will work and what won’t work, what’s promising and what isn’t, narrowing down the huge space of technological possibilities and finding something within it that accomplishes some particular goal.\n\nIn the 19th century, for instance, many people were interested in building a mechanical flying machine, but it wasn’t clear the exact arrangement of elements that would yield a successful one. Thanks to knowledge of the laws of physics, and an existence proof of birds, would-be inventors were already working within a considerably narrowed search space: they knew roughly what elements a flying machine would need to have — lifting surfaces, a propulsion system, and a means of control — and had a general idea of how they should be arranged. But there were a huge number of ways that you could build a flying machine from these basic elements, and people spent a great deal of time and effort building different sorts of machines that did not in fact work. The Wright brothers’ eventual success can in large part be attributed to the fact that they were exceptionally talented at gathering information, enabling them to converge on a working airplane design far faster than their competitors."}, {"type": "text", "content": "I previously explored the nature of technological search in that previous piece looking at Arthur and Polak technological evolution paper , which uses a simple simulation to evolve different logic circuits, finding workable technologies amidst an enormous sea of possibilities. I really liked the basic simulation method Arthur used in this paper — randomly generating technologies to see how easy or hard it was to find working ones — and wanted to use simulation myself to further explore the dynamics of technological search. But while Arthur uses digital circuits — different arrangements of logic gates like NAND, OR, AND, etc. that can perform functions like addition — I wanted a more general model that could capture the nature of many different types of technology, while still being simple enough to simulate easily."}, {"type": "text", "content": "The model I came up with is inspired by another of Brian Arthur’s examinations of the nature of technology: his book The Nature of Technology . In this book Arthur describes technology as fundamentally “a set of phenomena captured and put to use.” He writes that:\n\n… a practical technology consists of many phenomena working together. A radio receiver is not just a collection of parts. Nor is it merely a miniature signal processing factory. It is the orchestration of a collection of phenomena — induction, electron attraction and repulsion, electron emission, voltage drop across resistance, frequency resonance — all convened and set up to work in concert for a specific purpose.\n\nEdison’s lightbulb, for instance, took advantage of several different phenomena: Joule heating , the phenomenon that electric current running through a material will raise its temperature. Incandescence , the phenomenon that a hot enough object will emit light. Transparency, the phenomenon that certain materials will allow the passage of light. And so on."}, {"type": "text", "content": "Phenomena like this are typically triggered automatically when the right conditions are created, which you can think about as being when the right objects, with the right properties, are placed in some particular arrangement. In the lightbulb, Joule heating occurs automatically when electric current runs through the filament, and incandescence occurs automatically when the filament gets hot enough. And the bulb had a vacuum atmosphere to prevent another, unwanted phenomenon — carbon reacting with oxygen — automatically occurring and destroying the carbon filament.\n\nThese three elements — Phenomena, Objects, and Properties — are the basic components of the technological model I came up with, which I call PTOP, for Phenomena Triggered by Objects with Properties. In this model you have some collection of objects, which can have some specified set of properties. Whenever the right objects with the right properties are placed in the proper arrangement, a phenomenon will be automatically triggered, which can have various effects: modifying the properties of existing objects, creating new objects, and so on. By chaining the correct objects and phenomena together in the correct order, you can create your desired outcome, which is some particular object or objects with some specific set of desirable properties. A simple, conceptual PTOP model for the lightbulb, for instance, might look like this:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!Z_HI!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F64d670de-009d-434f-babb-96a23526bef8_1241x646.png", "alt": ""}, {"type": "text", "content": "By arranging the right sort of filament, an atmosphere, a bulb container, and electric current, you can trigger a series of phenomena that will ultimately result in the creation of light with desirable properties.\n\nAnd here’s a sketch of a PTOP model for a more complicated technology, a Xerox machine, which uses various phenomena such as “photoconductivity” and “corona discharge” to generate a copy of a document:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!KMH4!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fae5c1f9c-c0b4-43f0-9028-709580cec396_2048x830.png", "alt": ""}, {"type": "text", "content": "I like this model because it captures the basic elements — natural phenomena and the conditions that trigger them — inherent to all types of technology, such that we can study the ‘space’ of possible technologies. And you can implement the basic idea in many different ways, from very simple representations of technology to very complex ones. In some ways this is bad (it took me a super long time, for instance, to come up with a simulable implementation that I was happy with) but it’s useful for studying different aspects of technological search. Let’s look at a few different implementations of a PTOP model and see what we find.\n\nLet’s start with an extremely simple version of PTOP. In this version, we have 10 possible objects, each with two possible properties. The first property, P0, can take on any value from 1 to 10 and is inherent and unique to that object. You can think of this as the model having 10 different chemical elements, each taking on a different value of P0. The second property is size, which can also take on any value from 1 to 10, but is adjustable. So you can have a large object with P0 equal to 1 and size equal to 10, or a small object with P0 equal to 1 and size equal to 1. Overall there are 100 possible sorts of objects: 10 different object types, each of which can be 10 different sizes."}, {"type": "text", "content": "This version of the model has four phenomena in total. Each phenomenon is triggered when the right two objects are connected, and the first of those objects (what we’ll call the input object) has the correct size. When the phenomenon is triggered, it adds a specific property to the second object (what we’ll call the output object). So in the image below, when an object with a P0 value of 1 and size 5 is connected to an object with a P0 value of 2, it triggers a phenomenon, which adds a new property, P1, to the second object."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!9Mdz!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F2635a8f8-127d-472b-840b-8aa1dde43702_784x561.png", "alt": ""}, {"type": "text", "content": "The phenomena in this model are arranged in a hierarchy: triggering each phenomenon requires an object with the property added by the previous phenomenon. So to trigger the phenomenon that adds P2, you need an object with the P1 property. P3, in turn, requires an object with P2, and so on. You can think of this hierarchy of phenomena as representing something like “to trigger incandescence, I need an object with a high temperature. To achieve high temperature, I need to use the phenomenon of Joule heating, which I can trigger with the right sort of electric current. To create electric current, I need …” and so on.\n\nIn this version of the model, the goal is to create an object with the “final” property of P4. You can think of this as representing something like “light with the proper brightness” or “lead shot with the proper size and sphericity.” This can be done by creating the exact right arrangement of objects: five objects arranged in a line, each with the correct P0 property and size."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!eoCV!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff5b0f31d-e577-4360-94b5-e9c587c4c959_1373x552.png", "alt": ""}, {"type": "text", "content": "This is a very simple implementation of PTOP, which we’ll call a “level 1 model.” But it does capture a few things about the technological search process. First, the search space in even this very simple model is very large: 10 object types, 10 sizes, and 5 objects total means (10x10)^5 = 10 billion possible arrangements to produce a P5-level phenomenon. 1 If you increased that to 100 objects, 100 sizes, and 10 different phenomena, you’d have 10^40 possible options. If we added more property types (maybe objects can have the properties of “temperature” and “density” in addition to size) the numbers would quickly become beyond astronomical.\n\nBut this simple version also shows the power that information can bring to bear on a large search space. When we looked at Arthur’s circuit search, we noted that what made the search tractable was modularity — finding a working design for a subcomponent, then locking that modular design into the system and using it as a repeatable ‘primitive’ element for further combinations. By preventing you from having to get every single part of a design correct in one shot, modularity effectively screens off many possibilities and reduces the size of the search space that must be traversed. As we found in that simulation:"}, {"type": "text", "content": "A useful way of thinking about our 68 NAND gate search is that it’s like a huge, branching tree. At every step — every time we add a gate — there are thousands of branches, each one representing one possible way to wire up the gate. Each branch then splits into thousands more (representing all the possible ways of wiring up the next gate), which split into thousands more, which split into thousands more, until at the end we have 2^852 possible “leaves,” each one representing a unique way of wiring up all 68 gates. Trying to get all 68 gates right at once, and then checking to see whether or not you did, is like examining one single leaf, one path from the base of the tree all the way to the tip of a branch. Not only are you overwhelmingly likely to guess wrong, but you haven’t narrowed down your possibilities at all: all you know is that one single leaf wasn’t the right answer, leaving you with the rest of the 2^852 possible leaves to sift through."}, {"type": "text", "content": "Checking to see whether each gate we add is correct before we proceed to the next one, by contrast, massively narrows down the number of possibilities. Whenever we determine a gate isn’t in the right spot, it eliminates every possibility that branches off from that point. If there are 1000 possible ways to wire each gate, each time we guess correctly we’ve narrowed down the possibilities downstream of that choicepoint by 99.9%. Huge swaths of possibilities get eliminated at each correct guess, letting us converge on the correct answer much more quickly.\n\nWe can see these same basic mechanics with the PTOP model. With 10 object types, 10 sizes, 4 phenomena, and 1 billion effective possibilities, it takes (on average) 1 billion attempts to guess the entire correct design in one shot by randomly generating possible technologies."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!QbkI!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8184aab5-fbaa-45bc-aba0-b44e690971d5_935x485.png", "alt": ""}, {"type": "text", "content": "But if we do a modular search — randomly adding just one object while randomly adjusting the size of the previous object until we’ve triggered the next phenomenon, then locking that successful design in and moving on — the search becomes much faster, because we’ve replaced a single billion-possibility space with a series of 100-possibility spaces. It takes on average 1,300 attempts to find the 10 type, 10 size, 4 phenomena answer, and even astronomically enormous technology space search problems become tractable."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!xnD8!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa45da796-d85f-4463-80de-d2e48214cf67_907x551.png", "alt": ""}, {"type": "text", "content": "This version also shows that the degree of modularity makes a huge difference in how easy a technology is to find. The more modules we have whose design we can lock in, the shorter each step is up the ladder to the working technology, and the easier each step is to take. If we take our 10 object type, 10 size model up to 100 phenomena levels, we’re now at an enormous 10^200 search space, but with 100 steps up the ladder that we can lock in, finding it is trivial — a random search finds it after about 10,000 attempts on average. The same-sized search space generated from 10 phenomena levels but 10 billion possible object types and sizes (which only gives us 10 steps up the ladder, rather than 100) becomes utterly impossible to find randomly, even with modular search."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!r2Ru!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6d70da25-d99d-43c8-8daf-f67f5eb29f8a_498x97.png", "alt": ""}, {"type": "text", "content": "This version of the model also lets us see how different sorts of knowledge can make the search process easier. For instance, as Joel Mokyr notes in The Gifts of Athena , scientific knowledge is very useful when trying to create some new technology, because “the range of experimentation possibilities that needs to be searched over is far larger if the searcher knows nothing about the natural principles at work.” In our level 1 PTOP model, scientific knowledge would be something like “phenomenon 3 can’t work with object type 2” or “phenomenon 4 must have its two objects of equal size.”\n\nThe usefulness of this sort of scientific knowledge is a function of how many possibilities it screens off. The more possibilities it screens off, the more bits of information it provides, and the more useful it is. So something like “phenomenon 5 can’t use object 1” or “object 3 can’t touch object 4” provides a relatively small amount of information, because it doesn’t eliminate that many possibilities. Knowledge of the sort “phenomenon 4 MUST use object 1” or “object 3 MUST touch object 4,” by contrast, screens off a lot more possibilities, provides much more information, and narrows the search much more effectively."}, {"type": "text", "content": "One reason that, in the real world, the technological development process is tractable is that a lot of our knowledge is of the latter type. Phenomena typically have specific triggering conditions, which we can observe and discover: Marconi knew what was needed to create electromagnetic waves when he was working on his radio, Edison knew what was needed to create incandescence in a lamp filament, and the scientists on the Manhattan Project knew roughly what conditions were needed to trigger a nuclear chain reaction.\n\nEven this highly simplified version of the PTOP model is useful for exploring various technological search dynamics. But ultimately it’s a little too simple to capture many of the more interesting dynamics of technological search. So let’s add some complexity. First, real phenomena often require multiple “input” objects, rather than just one: triggering the phenomenon of “combustion” in a gasoline engine requires fuel, an oxidizer, and an electric spark. So we’ll make it so that each phenomenon can have multiple input objects instead of just one. Second, there are often multiple different phenomena that you can use to accomplish some particular goal: if you want to make mechanical motion, for instance, there are a variety of different phenomena you can harness to do that, and motors built to harness them — electric motors, hydraulic motors, internal combustion engines — all work in different ways. So let’s also make it so that instead of just one phenomenon for each level, there can be more than one, each one requiring a different set of objects with the right properties to trigger."}, {"type": "text", "content": "With the level 1 PTOP model, there was only a single workable version of the technology. With the level 2 model, there are multiple working designs. And unlike the straight lines of objects of the previous model, this one creates branching, treelike chains."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!mAtB!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F17305566-18a9-4c50-a58a-19a1e9519890_1420x804.png", "alt": ""}, {"type": "text", "content": "With this version of the model (which I’ll call the “level 2 model”), even though there are a large number of possible working designs, the number of nonworking technologies is vastly larger, and finding a workable option by pure blind search quickly becomes unworkable.\n\nWe can solve this with a slightly different flavor of modular search, very similar to the “encapsulation” that Arthur uses in his technological evolution paper. In this version, the model starts out by randomly combining different objects with different properties, connected in different ways. Whenever an arrangement of objects triggers some phenomena, that arrangement gets bundled into a new object, and then that object can be chosen by the simulation to be randomly combined with other objects. As with our previous, simpler modular search, this lets the simulation accumulate partial solutions and quickly find working technologies even amidst very large search spaces."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!3ajc!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ffe6d4114-06ae-4a16-94db-46b04fcca66f_1555x866.png", "alt": ""}, {"type": "text", "content": "A level 2 PTOP model can also be used to show the information-accumulating power of sexual reproduction. In a previous essay , we noted that sexual reproduction is its own sort of modular search — by letting children inherit genes from two parents, sex allows useful genetic “discoveries” made by many different lineages to spread throughout the population. This is in contrast to asexual reproduction, where only one particular lineage ultimately survives, and discoveries made by others die out due to a phenomenon called “clonal interference.” This allows sexually reproducing populations to converge on maximum fitness much more quickly.\n\nWe can see this same thing using the level 2 PTOP model. I ran a version of it with two different technology “populations.” Each population had 1,000 randomly generated technologies in it. In one population, I implemented asexual reproduction — each generation, every technology would get one random mutation to an object (deleting an object, adding an object, or changing an objects properties). The fittest members of the population, measured by the highest phenomena level they had unlocked, survived into the next generation. In the other population, I implemented sexual reproduction — in addition to random mutation, children would be generated by randomly crossing over the branches of two parents. With 5 levels of phenomena, asexual reproduction couldn’t achieve the maximum phenomena level after 2,000 generations in the example below; sexual reproduction, by contrast, found it after just over 100 generations."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!5OBU!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbb679fb7-85cc-472d-9038-428e47fcdea0_1078x438.png", "alt": ""}, {"type": "text", "content": "This flavor of PTOP is a little richer and can show a broader array of technological search dynamics, but it’s still a little simple, so let’s add some more complexity.\n\nFirst, instead of making triggered properties — P1, P2, P3, etc. — binary (on or off), let’s make them be able to take on multiple values: before the property is switched on, it has a value of 0, while once a phenomenon triggers it,
