s of days or time periods, but what are the factors that make your life worth living? It does remind me of the sort of philosophical question, but you now, when you're 30-something and thinking of those things, are a different person when you're 70-something and your conditions have changed. So it sounds like an ongoing process, not just something you decide once and for all.\n\n0:25:20.8 KS: Exactly. Very well said. It's exactly it. And so if you've never thought about these things before and you suddenly find yourself in a crisis situation, navigating a stressful, upsetting situation, you're trying to learn a lot of things all at one time, and that's the first time that you've ever thought about or talked about what a good life looks like to you, then you're starting from scratch."}, {"type": "text", "content": "0:25:50.9 SC: And it's kind of what you have so far suggested is really purely internal, perhaps, right? Just sort of thinking for yourself through these questions that nobody else can really answer for you.\n\n0:26:03.8 KS: Yes, there is a piece of it that is definitely that. It's kind of like this old parable about eating an elephant, looks different depending which part of it you tackle. And one of the reasons the book is titled 'Your Good Death' is the idea that this is specific to each kind of situation and individual. But it could be those internal conversations. It's very important then to communicate that to people who might be around you, who make decisions for you. But it could also be those advance directives. It could be financial pieces, it could be planning for caregiving. And I think there's a lot of variation and diversity in what that can look like for people. But the internal conversation is a great starting point."}, {"type": "text", "content": "0:26:48.3 SC: Yeah, absolutely. And so you've mentioned advance directives. Let's not assume that anyone knows what that is. What does that mean?\n\n0:26:55.2 KS: So advance directives is another sort of umbrella term for forms that you can sign that help put into writing what your wishes are. So there could be, people have maybe heard of a do-not-resuscitate order. So this is something people sometimes have signed, posted prominently on their refrigerator, so if the paramedics come in, they know that the person does not want to be resuscitated. You can sign those in hospitals also. People have living wills. People designate medical power of attorney people who would make health decisions for them if they were not able. Yeah, living wills would be a document where you say, like, this is how long I want to be on life support, or if I was in this situation, this is what I would want."}, {"type": "text", "content": "0:27:43.0 SC: How legalistic do these have to be? I presume that in different communities or whatever, different laws apply and there are different levels of stickler-ness about getting things notarized or what have you.\n\n0:27:56.9 KS: Yes. So all of these are much more powerful if they're braided together with conversations with people around you. Because you can imagine a situation where someone's in the hospital and there's a sheet of paper that someone says they signed, but no one really knows anything about it.\n\n0:28:14.5 SC: Yeah.\n\n0:28:15.7 KS: Right? You want that sheet of paper to be lined up with your family members standing there saying, \"We've talked with them. We can confirm this is consistent with what they said.\" So that's part of it. And from there, I would say some of it depends also on the nature of the thing that you're trying to make an advance directive about. So some people will make trusts to protect their financial assets. That's obviously farther into the nitty-gritty."}, {"type": "text", "content": "0:28:47.4 SC: And so good. So I'm getting the picture that there's a stage at which I think about what it is that makes it all meaningful to me, but then I better have a conversation with the people who might be there in the hospital room when the moment comes.\n\n0:29:01.7 KS: Yes. Yes. And I think the more people talk about this, the easier... Maybe easy is overstating, but it gets less difficult and more familiar.\n\n0:29:14.8 SC: Well, let's dig into that. Let's be honest about this. What if one member of a family... And the family's pretty close and they get along, but they decide... They have opinions about what to do near their end of their lives and the rest of the family disagrees? Are there rules or guidelines for ironing that out or who wins or what to do?"}, {"type": "text", "content": "0:29:37.5 KS: Well, probably no one wins in those situations, even though they happen all the time. So there are online tools, a lot of them these days, but there's a couple that I really like. One is called Five Wishes and one is called the Conversation Project. And these are... They have written worksheets and questions that you could ask each other and facilitate a conversation to have some of these in advance.\n\n0:30:04.3 SC: Okay.\n\n0:30:05.8 KS: Yeah. But when there's disagreement or people have never talked about it, it is a setup for those kinds of problems. And you can imagine that takes a difficult situation and makes it worse.\n\n0:30:17.1 SC: So would you recommend that someone who was in the middle of their life and feeling relatively healthy to go ahead and start the legal document process as well as the informal chatting with your family process?"}, {"type": "text", "content": "0:30:30.8 KS: I think so. I think so. And they can be bigger or smaller. And so this Five Wishes website, they're actually set up to help you create an advance directive that can be legally binding.\n\n0:30:45.2 SC: Okay.\n\n0:30:46.4 KS: So there are places that you can start with that, but I think things like living wills are appropriate.\n\n0:30:52.3 SC: Yeah.\n\n0:30:53.9 KS: And it depends what would happen if...0 right? If you died suddenly or you were suddenly on life support. It will look different for each person, like who's affected by that, what are you leaving behind?\n\n0:31:00.7 SC: Right. And... Okay, good. Let's move over to the sort of institutional healthcare side of things. We have the family, we've talked to them, we've ironed out our disagreements, at least we're clear on what we want. But then we're like, something happens and we're in the hospital. How good is the healthcare system, how good are doctors at both, number one, figuring out whether we're really close to death or not, and then number two, communicating that to us?"}, {"type": "text", "content": "0:31:35.5 KS: I think doctors are a lot better at figuring out if we're reasonably close, although they will tell you, like, it's very difficult to prognosticate. It's very difficult to know exactly what's going to happen. But in broad strokes, I think that it's not that they have no sense of what might happen, but I think where the system breaks down more is that we have a lot more defaults that lean toward treatment and fewer that lean for sort of pumping the brakes and saying, \"Let's have a conversation about your goals of care. If this were to go in a direction where we couldn't cure you, let's make sure that we've had a conversation and established in your healthcare record what is important to you.\""}, {"type": "text", "content": "0:32:20.8 SC: So you're saying doctors are not so good at that empirically.\n\n0:32:24.8 KS: And I would say not even it's that doctors, because people say, \"Well, I really like my doctor, and I trust them to tell me these things.\" And doctors, when I interview them, say, \"It's the thing I care about least. It's the most upsetting thing to me is when I have to say that kind of news to a patient. I don't want my patients to think I gave up hope on them.\" But doctors are nested in this same healthcare system that we are, and that system in the United States in general, we're very good at scientific advancement. We've had a moonshot cancer initiative since the Nixon administration. We have a long history of trying to be good at curing things and having scientific advancement, and that has a lot of spillover to these downstream situations where we just are still aiming for a cure and aren't as good about covering this other side of it."}, {"type": "text", "content": "0:33:23.8 SC: Do medical schools or do other aspects of the system help educate doctors on this aspect of their profession, or is this one of the things you're supposed to pick up on street corners?\n\n0:33:35.7 KS: I think they are working on it. So now we have people who can be specialists in palliative care. That's huge progress. And that can be physicians, nurses, physician assistants, all the way down across the board, people specializing in palliative care. So we've seen progress on that, but I think this major momentum toward a focus on cure gets baked in at several levels. So it gets baked into education, it gets baked into training, it gets baked into what insurance will pay for. Insurance is paying way more for surgeries or MRIs or treatments than it is for that 30-minute goals of care conversation. So all of these things contribute to a situation where it's easier to be on that treatment superhighway than to have the off-ramp."}, {"type": "text", "content": "0:34:28.9 SC: I guess I kind of understand if you're a doctor or a nurse in a hospital thinking that your goal is treatment, your goal is to make people better and send them back. I don't understand the insurance side of things. Is there some financial incentive for them to have it drawn out as much as possible, or is it just that's not what they're good at?\n\n0:34:52.0 KS: I think it's more that it's not what they're good at, and there's a lot of benefits that accrue in this snowballing sort of way for having success in treatment. So if you walk into a major academic medical center and look around, they're drawing dollars from the National Institutes of Health to do research on cure. Unless you're in a really special place, which there are those where they're pulling in a lot of money to study palliative care. We have one of those at the University of Colorado. But there's a lot of money coming in, so that reinforces research projects. I think it reinforces merit evaluations, performance evaluations for individual providers. At many levels, it's baked in."}, {"type": "text", "content": "0:35:39.9 SC: Okay. Yeah, I mean, I guess I would maybe say even more than you've already said about the incentive structure here. We want to cure people, we want to get them better. Is comfort and the psychological side of things an important incentive for the... I don't know even what to ask about, the doctors, the system?\n\n0:35:59.2 KS: I think those things are important. And when you talk to individual doctors, I mean, they're human beings who get into this because they care about their patients. So they care about these things, but sometimes they are... I think they lack training and they lack experience in having these conversations and shifting gears. So they sometimes will just keep treating, and they're waiting for either evidence to accrue that treatment's definitely not working, or sometimes they tell me that they are waiting for patients to really get their head around what treatment looks like before they decide that it's not worth it. They're waiting for a lot of things, and sometimes they don't have the skill set or the time in their schedule to have these conversations."}, {"type": "text", "content": "0:36:51.4 SC: So actually, I mean, in a sense, that's kind of encouraging to me. Rather than it being a nefarious consequence of a badly designed system, it's human nature. Human beings don't want to say to someone in their care, \"Well, you better prepare for it to all end soon.\"\n\n0:37:11.3 KS: Exactly. There's a lot of human nature in it. And I think it's really important to acknowledge that and to speak up on behalf of doctors. All these providers, they're trying really hard, and I think they are nested in a system that does not always facilitate what they are trying to get done.\n\n0:37:32.7 SC: I mean, if I'm a doctor, one of the things about being a doctor is the human body is a mess, and it's very complicated. And it is, like you said, it's hard sometimes to prognosticate what will happen. Are there guidelines for, if I think there's a 50% chance my patient will die, what I should say? If I think there's an 80% chance... Is that even a sensible thing to ask?"}, {"type": "text", "content": "0:37:55.6 KS: There are guidelines, and these are things that you could Google and look up in journals.\n\n0:38:03.8 SC: And do you agree with the guidelines? What kinds of things do they say?\n\n0:38:09.8 KS: Sometimes they even... Sometimes it is as simple as a certain diagnosis triggering a palliative care referral.\n\n0:38:16.0 SC: Okay.\n\n0:38:16.2 KS: Sometimes if the family asks about it, it's supposed to trigger a palliative care referral. So sometimes it's very basic things. There's also something called a Palliative Performance Scale that I saw people talk about a lot, and this is a scale of 0 to 100 where you can kind of rate how independently someone's functioning. It kind of ranges from, \"Are they in bed, not able to do anything?\" Versus, \"Can they go to the store?\""}, {"type": "text", "content": "0:38:47.5 SC: How do those guidelines work in the case where the patient, for whatever reason, has not indicated any guidance whatsoever or any preferences? Is there on that side a sort of presumption that the doctors will try as hard as possible to keep them alive for as long as possible?\n\n0:39:06.2 KS: I think that's exactly the scenario that it opens us up for.\n\n0:39:09.6 SC: Yeah.\n\n0:39:10.9 KS: And that's why I took this tack with the book of saying, if we can educate people more about what the defaults are in the system and what tools can sort of interrupt those defaults, we might get some more people who can put their hand up and say, \"I'd like to have a conversation about my goals of care. I'd like to have a palliative care referral so that we can be assessing treatment options, but also non-treatment options or non-curative options.\""}, {"type": "text", "content": "0:39:41.7 SC: I guess I can already see how difficult this all is, because on the one hand, it sounds like we should say that a general practitioner, when meeting with someone who's perfectly healthy in their 30s, might broach the topic and say, \"You might want to think about what you consider to be the valuable parts of your life and letting people know,\" et cetera. But then I can also imagine the patient saying, \"What are you trying to tell me here? What did you find out in your exam?\"\n\n0:40:08.9 KS: That's exactly the scenario. And so we know from a policy perspective, the more we can build in defaults, the less we're subject to those conversations. Because then we can say, \"It's not specific to you or this visit. We advise everyone to have one of these on file in their electronic health record.\""}, {"type": "text", "content": "0:40:39.6 KS: Right. So if someone says to you, \"I think you should...\" I don't know, whatever you would do on a regular basis, right? If someone says, \"You should go for your mammogram,\" I don't say, \"Oh my God, why did you say that to me? What's wrong with me?\" I know...\n\n0:40:52.8 SC: It's a regular thing.\n\n0:40:52.9 KS: It's a regular thing. Or like a colonoscopy, right?\n\n0:40:55.4 SC: Right.\n\n0:40:57.1 KS: It can just be a default kind of thing, and I think that's a powerful way of changing the conversation.\n\n0:41:03.9 SC: Actually, that's a very good point. If I know that once you hit age 50, the fervor with which your doctors tell you to have a colonoscopy goes way up. So if it were a similar thing, like once you hit age 50, you have this conversation, then people will be a little bit less surprised by it."}, {"type": "text", "content": "0:41:20.8 KS: Right. Right.\n\n0:41:21.8 SC: And how would we make that happen? Is this a legislative thing? Is this an American Medical Association thing?\n\n0:41:30.7 KS: I think it can be at all of these different levels. This is something I hear, when I go to the doctor, this is a slot that they already have filled out in my portal. So I think as we have these condensed electronic health records and you can log in and see your test results and things, there are places in there where people can fill out a form with some basic information and then it's available to anyone in that healthcare system who looks you up in your record.\n\n0:42:03.4 SC: I guess, since I know nothing about this, does everyone have a single electronic portal healthcare record that follows them from provider to provider?"}, {"type": "text", "content": "0:42:13.4 KS: No, they definitely don't. They definitely don't. And this is where the fragmentation of the system is a contributing factor.\n\n0:42:24.1 SC: Yeah. But on the other hand, I'm now worried about privacy concerns or whatever. Do I want my Social Security number to be a key to some big health record that follows me from place to place?\n\n0:42:38.9 KS: Well, I don't think your Social Security number has to be in there. I think this would just be along with your other sort of HIPAA-protected health records that are in there. But not everyone has that, that's a really critical point.\n\n0:42:53.2 SC: Right. And okay, so what about... We've been talking about the doctors and what they could do. I imagine there's some problematic patients, right? Who just don't want... Their answer to all these questions is, \"No, I'm gonna keep fighting forever.\" And is this something we have to roll with or can educate people about?"}, {"type": "text", "content": "0:43:13.2 KS: So again, like 'Your Good Death,' everyone, I think, should be making the decisions that they want. And there will definitely be differences in this way. There will be people who want to have as much treatment as possible. I think the important thing is making sure people understand what these defaults are in the system and that this idea that, \"My doctor will just tell me when I need to switch to hospice and then I'll have time to do things on my bucket list.\" I think we need to educate people about why that's not a great assumption and things that could get in the way of that so they could make decisions if they want.\n\n0:43:52.6 SC: And this seems a little, I don't know, fuzzy-wuzzy or whatever, but I totally agree we should educate people, but it just seems hard. People don't want to talk about it. People don't want to have these conversations. Is there... I don't know... Is there some one weird trick that lets people be more comfortable just thinking about these things out loud?"}, {"type": "text", "content": "0:44:12.0 KS: Well, again, I think the idea that small bites start to add up is powerful. Another thing that's powerful is people who have been caught in this system, it's like the light bulb goes on. So I don't know if you've talked with people or you've been in that situation where someone is dying and then the healthcare situation just adds to a stressful situation.\n\n0:44:25.6 SC: Oh, yeah.\n\n0:44:39.1 KS: People are acquiring new information.\n\n0:44:40.7 SC: Yep.\n\n0:44:41.8 KS: Right? That's not something you want to do twice if it's avoidable. So I think there are people out there who have already had a taste of that and are open to tools. Even... I mean, something I write about in the book is, so this experience I had with my mother. I studied healthcare for a living and she'd been a nurse for like 45 years, and we still found ourselves on that treatment superhighway. They were offering her chemo until like days before she died, and we didn't know how to change that. And I thought that hospice... Someone would tell us when we needed hospice, and they didn't. So flash forward 10 years or so, and I find myself with my mother-in-law in declining health with some cardiac issues. And one thing I learned from this research was the value of just asking for a palliative care referral. And one day we were in the hospital and I was asking my family, \"Do you think she'd be okay with a palliative care referral?\" And my husband talked to his mom and I asked for that, and it changed everything."}, {"type": "text", "content": "0:45:49.6 SC: And what exactly is involved in a palliative care referral? Is that just talking about the possibility or does that mean actually shifting those gears?\n\n0:45:58.0 KS: No. So palliative care can come along and help you concurrently with any kind of curative care that you're having. So in this case, she was really deep in with her cardiologist. Palliative care meant that a very nice woman came to her hospital room while we were there. We had a family member on the iPad in the room, in the meeting, and this woman just talked with my mother-in-law about what mattered to her, what her priorities were. Some of it was she was like, \"I am sick of being in the hospital. I just want to be home more,\" right?"}, {"type": "text", "content": "0:46:31.0 SC: Yeah.\n\n0:46:31.5 KS: Which is very actionable. And we left... She was out of state, and we came home feeling like, \"Yeah, we got her hooked up with palliative care.\" And she immediately fired them after we got back. And we were like, \"Oh, no.\" But what happened there is that she didn't want them on the team right then, but a few months later, her health took a turn. And then she was calling me and being like, \"How do I get back in touch with those people? I want them now.\"\n\n0:46:58.7 SC: Oh, I fired.\n\n0:46:59.4 KS: And she had a vocabulary for asking for that. And she ended up then joining palliative care, and then it switched over to hospice in a few months. And she had a lot of what she wanted, but she had that vocabulary and that connection."}, {"type": "text", "content": "0:47:14.0 SC: Well, yeah, it is... I can see that transformation taking place. I mean, one thing you talk about in the book is the role of hope in all these situations. It's natural to hope you'll just be cured and be happy, and in the modern world of medicine, it's almost like there's always a procedure they could try they haven't tried yet.\n\n0:47:35.6 KS: I think very much. Hope is kind of the glue that holds a lot of this together, and I don't want to sound like I'm anti-hope, but this is one of those things, like, we are all going to die. And again, some people will want to have as much treatment as they can until the last moment, but for those who don't, I think we need to interrupt this system that can just pin everything on hope and keep treating until the end."}, {"type": "text", "content": "0:48:07.3 SC: Now that I think about it, one of the arguments you could make that family members should talk to each other earlier is that when the moment is arising and they're in the hospital, you don't want to be the one saying, \"Have you thought about dying? Have you really faced up to that?\" That's a tough... You don't want to be the one who looks like you're dragging them in that direction.\n\n0:48:20.2 KS: Yes. Absolutely, yes. Yes.\n\n0:48:33.2 SC: So making more sort of structures. I like the general thing that rather than it sounding like an individual trying to pull the plug on you, there is a procedure that everyone goes through that makes it clear what the options are.\n\n0:48:48.5 KS: Yes, I agree. And then if you have had conversations and you have someone there or you're dealing with a parent or whoever, a loved one, and you can say, \"I know we've had a lot of conversations over the years about this, and I know you're sick of being in the hospital.\""}, {"type": "text", "content": "0:49:05.5 SC: Yeah.\n\n0:49:06.3 KS: \"I know you don't like XYZ. How can we switch gears for you?\"\n\n0:49:11.2 SC: And how often is the person at this stage cognitively just not up to the task of dealing with these big questions?\n\n0:49:20.7 KS: Well, it depends how late in the game you wait. Right? So that's... But that's a very plausible scenario. And then it's those documents that can work hand in hand with conversations that have already happened.\n\n0:49:34.1 SC: If the documents and the conversations are not there, what do we do to someone who clearly isn't of sound mind, let's put it that way, and maybe we think that they wouldn't want to be going through this, but we're not sure? I mean, it's a tough position to be in."}, {"type": "text", "content": "0:49:51.5 KS: Well, again, I think we err on the side of intervention.\n\n0:49:53.4 SC: Okay.\n\n0:49:55.3 KS: And so that might mean resuscitating people, it might mean life support, it could mean feeding tubes.\n\n0:49:59.1 SC: Yeah. And money. [laughter]\n\n0:50:06.8 KS: Absolutely.\n\n0:50:10.7 SC: Is it ever a point where one person is at the end of life and undergoing all these expensive procedures and their family is on the hook for paying for that?\n\n0:50:26.4 KS: In theory, that should not happen. If someone dies, those costs should go with the person.\n\n0:50:33.3 SC: Okay.\n\n0:50:34.8 KS: I don't know that I would want to be quoted on that specifically, for sure.\n\n0:50:38.6 SC: No, that's okay. We can...\n\n0:50:38.9 KS: But it should disappear with the person."}, {"type": "text", "content": "0:50:41.3 SC: We can indicate uncertainty about that, but we know what we would like for it to be the case. I mean, on the flip side... I mean, maybe this is implicit, but how much autonomy should someone have at this end of life period, especially if they are undergoing some kind of cognitive decline? I mean, we've all had disagreements with our parents about what is good for them, right? Forgetting about the end of life, just like where to live, what to eat, things like that. I tried... I like to think that the parent or any old person should have the right to choose what they're going to do, even if the rest of us think it's very silly, as long as it's not hurting anybody else. But I don't know whether this particular situation is unique somehow."}, {"type": "text", "content": "0:51:30.5 KS: This is one of those places where earlier conversations can add up and have a lot of value. So even if someone does sort of lose their ability to make decisions, if you have talked about things with that person over time, you may have a sense of what they value, and that can give you guidance as you're trying to make decisions for them.\n\n0:51:52.3 SC: I mean, do you have any insight, having done this for a long time? You, I think, properly emphasize that individuals will have their opinions, their preferences, their wants, and their values. But have you noticed that certain choices seem to work better? Like, is there advice for the people out there on how to hope that you end up having a good death?"}, {"type": "text", "content": "0:52:17.5 KS: Well, I think a lot of these online resources are really good tools. I have seen people come to me and say, \"I really want to talk with my parents, but I don't know how to get this going.\" And then they've taken this Five Wishes or The Conversation Project to their parents and they ended up having a really great conversation and they came back saying that they felt so much better. So I think again, small bites add up. And anything that pulls it back from feeling like someone's pulling the plug on you or losing hope is a win.\n\n0:52:56.0 SC: I wonder if, we tend to... Maybe we think that once people are near the end of their lives, they will want to keep fighting. But in fact, they've been thinking about it for a while and it's we younger people who are actually more reluctant to talk about it and face up to the reality of it."}, {"type": "text", "content": "0:53:14.6 KS: I think that happens in a lot of cases. And in that case, if you're the person who's older and is more comfortable with your own end of life, then again, it's a win to have made people aware of what you want.\n\n0:53:31.1 SC: And I guess we've been talking about this sort of imaginary case where you're getting sick, you're going to die, it's a matter of being comfortable and having palliative care and letting people know what the circumstances are. We haven't quite talked about being more active about it, right? Like assisted death, self-assisted and things like that. Is that part of this conversation?\n\n0:53:54.6 KS: That is not something I included in this research. That's called medical aid in dying. It's something I briefly address in the book, but it wasn't part of the research. It was not legal in the state of Colorado at the time I was doing the research. But there's definitely great resources out there around it."}, {"type": "text", "content": "0:54:14.7 SC: I mean, have you gained any perspective on that aspect of things? Do you think it should be legal?\n\n0:54:22.0 KS: I think people should have access to those things. Studies of medical aid in dying that I have seen have shown that it is, even in states where it's legal, it's not necessarily accessible. So there's a much deeper story around that where people can't always get their hands on the kind of care that they want.\n\n0:54:45.8 SC: Or it takes six months of paperwork and you don't have six months, and that's an issue.\n\n0:54:49.8 KS: Right. Exactly. Exactly.\n\n0:54:53.8 SC: And okay, let's... It's late in the podcast, we can nerd out a little bit about being an academic and a social scientist. You talked about your research. What exactly is the research? What's the methodology for what you're doing?"}, {"type": "text", "content": "0:55:06.6 KS: So this was an entirely qualitative project. The centerpiece of it was interviews done over several waves. I got about 120 interviews total. I also did a lot of observation in palliative care clinics and in hospices, sitting in on team meetings and kind of learning how they were making decisions about patients coming in.\n\n0:55:31.2 SC: And this is just... I know your book is meant for the general reader, but there's also academic publications associated with this?\n\n0:55:38.7 KS: There are. So when I started it, I didn't envision this trade book coming out of it. I was sort of doing my regular thing of spinning off academic articles. So there were five or six of them that came off of this before I really felt like it needed a book-length project to tie together all of the pieces. And then I also decided that there was a lot here I wanted to put in people's hands to make it actionable."}, {"type": "text", "content": "0:56:05.4 SC: Well, like you said, I mean, it does happen to all of us. It's something we all need to think about. How much of a connection is there between the academic side of things and the policy or medical side of things? Like, are hospitals and legislatures listening to people like you?\n\n0:56:23.2 KS: There's a lot of people out there talking about this, and I think some of them are more geared toward those audiences and some of them are more geared toward lay audiences. And so I would say those are slightly different groups of people focusing in different areas.\n\n0:56:41.9 SC: And do you think... I mean, going back to the individual, other than reading your book, do you think that the choice to aim for dying at home is a good one? Like, I truly don't know, are there a bunch of people who have a 50% chance of dying or a 50% chance of living a healthy, productive life for another 10 years? Or is it like, well, no, actually, usually we know pretty well what the options are and you might as well go home away from the hospital and be in the environment you want to be in."}, {"type": "text", "content": "0:57:18.0 KS: So that really varies and it matters a lot what your diagnosis is. So something like cancer figures prominently in my book because at the time I started this research, they were the number one users of hospice. And so that tends to follow a certain kind of decline that's more predictable and a little more gradual, and then it can get very fast at the end. Whereas cardiology patients can have a very different kind of thing. Like you could have a heart attack and die instantly. It can be a little more stair-steppy decline where people are very stable and then they take a drop. Alzheimer's patients are a much bigger population right now and that can be a very long, slow situation. And so I think it really depends a lot on the diagnosis and the individual situation."}, {"type": "text", "content": "0:58:09.0 SC: Do you think in general hoping, trying, planning to die at home is a good idea?\n\n0:58:16.3 KS: I think some people that's a good fit for and other people don't want to die at home for a lot of reasons, and those are completely valid from my perspective.\n\n0:58:25.0 SC: And what... I guess this is the sort of final wrap-up question, it's big and maybe there's a long answer or short answer. What can we do as a society to not just help people, but to sort of reorient our attitude, right? To allow ourselves to be a little bit more open and honest about these things. I think that again and again in the conversation, there's institutional things that get in the way and that makes sense and we can imagine changing rules, but there's just very human things. The doctor doesn't want to tell you you might die. Your family member doesn't want to say, \"What if we don't treat you anymore?\" [chuckle] Is there something we can do socially just to be more grown-up about all this?"}, {"type": "text", "content": "0:59:12.0 KS: Well, I think the main driver I would like to see is policy changes, changes in healthcare that make it less fragmented and more integration of palliative care. I think it would not be... I think it's totally feasible to have a palliative care referral triggered when certain diagnoses happen. I don't think there's a reason we couldn't have that to at least start a conversation. I think we need more paid support for caregivers because that's a crushing issue a lot of people are facing. So I would like to see those policy things happen and I think they can change a lot about our culture. But from a bottom-up perspective, I think having more of these conversations and what you're doing to just give some light to this issue is really important and helpful."}, {"type": "text", "content": "1:00:00.4 SC: Well, it does happen to all of us. I think that there's like five people in Silicon Valley who think they might be gonna live forever, but I'm not optimistic about that. And I think the rest of us should face up to it and the work that you're doing is a big part of that. So, Karen Lutfey Spencer, thanks very much for being on the Mindscape podcast.\n\n1:00:18.6 KS: Thank you so much for having me.\n\n[music]"}], "text_post": false}, {"id": "022a5a395f6b7a06", "title": "A long list of the links you’ve been longing for", "url": "https://edwardfeser.blogspot.com/2026/11/a-long-list-of-links-youve-been-longing.html", "source": "Edward Feser's Blog", "tag": "philosophy", "published_at": "2026-11-21T22:17:16+00:00", "panels": [{"type": "snippet", "content": "Thomas Nagel has\nbeen awarded the million-dollar Berggruen Prize for his contributions to\nphilosophy.  In an\ninterview with Wired , he\ndiscusses the current controversy over AI. \nAt YouTube, Robert Lawrence Kuhn interviews Nagel for Closer to Truth . Scientific American reports\nthat Anthropic mathematician Levent Alpöge claims to have used AI to solve\nthe Riemann hypothesis. Pope Leo has\nappointed Dominican theologian Fr. Serge-Thomas Bonino as Theologian of the\nPapal Household. Diane Montagna reports . At UnHerd ,\nDamian Thompson on why\nthe pope can’t bring peace to the Church . The Critic lo", "read_more_url": "https://edwardfeser.blogspot.com/2026/11/a-long-list-of-links-youve-been-longing.html", "read_more_source": "Edward Feser's Blog"}], "text_post": false}, {"id": "1f06122ff64f993f", "title": "Reading List 11/21/2026", "url": "https://www.construction-physics.com/p/reading-list-11212026", "source": "Construction Physics", "tag": "engineering", "published_at": "2026-11-21T13:04:03+00:00", "panels": [{"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!VxSz!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F2cc057d2-a207-4d02-8197-efd19bcabf55_1274x990.png", "alt": ""}, {"type": "text", "content": "Welcome to the reading list, a weekly roundup of news and links related to buildings, infrastructure and industrial technology. This week we look at BAAJA, rayon for missiles, US gas consumption, Cyberarmageddon, and more. Roughly 2/3rds of the reading list is paywalled, so for full access become a paid subscriber.\n\nNo essay this week, but I’m working on a long follow up to my technological search essay that should be out next week.\n\nA neat dataset showing the relationship between excess deaths and temperature in cities around the world. You can really see the sensitivity to high temperatures in places without AC. [ Our World in Data ]"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!7ZHm!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F79b53940-b224-494b-81c3-8751fe4c0779_1462x2048.png", "alt": ""}, {"type": "text", "content": "The Senate passes the permitting reform bill BAAJA. [ NYT ] And Kalshi now gives BAAJA a 75% chance of becoming law. [ Kalshi ] And New Mexican Senator Martin Heinrich is in the Economist arguing for BAAJA. “ The Bipartisan American Affordability and Jobs Act—which the Senate voted to advance on November 9th and which I co-sponsor with another Democrat and two Republicans—does not remove environmental considerations, the ability to litigate projects or the ability for local communities to comment. Those are necessary. But it does make these reviews a standardised part of a predictable process .” [ The Economist ]\n\nNew type of nimbyism just dropped: people opposed to delivery drones flying over their backyard. [ WSJ ]"}, {"type": "text", "content": "How Dubrovnik, the Croatian city where King’s Landing scenes were shot in Game of Thrones, is coping with huge masses of tourists and (checks notes) Montenegrin drug cartels. [ The Times ]\n\nFrom the annals of manufacturing bottlenecks: producing more Patriot missiles requires, among other things, a specialized rayon fabric called Raycarb, processed by a single US company who sources it from a tiny number of companies (apparently just two), who are unable or unwilling to ramp up capacity as fast as the US would like. “ Only one rayon product of this kind is approved for use in the most advanced Patriot missiles, and it comes from the Kansas factory of a single supplier, Park Aerospace. With Patriot stockpiles shrinking, the Pentagon official pushed Park for more rayon to help ramp up missile production. It soon became clear that the company’s hands were tied. The problem lay not in Kansas but thousands of miles across the Atlantic near the vineyards of Bordeaux in France. That’s where Park’s supplier, ArianeGroup—a maker of space rockets and ballistic missiles—produces the carbonized rayon fabric, which it then ships to Park for further processing. ArianeGroup had been clear that supply was limited. ” [ WSJ ]"}, {"type": "text", "content": "Manufacturing automation startup Hadrian is buying Kutztown Foundry and Machine, a company that makes castings for, among other things, nuclear submarines. [ Manufacturing Dive ]\n\nThe US Marine Minerals Administration, formerly the BOEM, held an auction for seabed mining rights on 31 million acres of seabed near American Samoa. [ Maritime Executive ]\n\nChina produces a lot of air conditioners. [ X ]"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!PpRO!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F1c2d8329-e883-4a03-b10e-c7799bbbdd2d_593x698.png", "alt": ""}, {"type": "text", "content": "Apparently Tesla will sell you a Cybercab, under a somewhat strict set of conditions. “ Tesla is now inviting “select customers” to buy a Cybercab for personal use at $29,990, but the car won’t move unless you also pay $299 a month for an “Autonomy Subscription.” And it only works inside Tesla’s Robotaxi service areas in Texas and Florida, the same geofences that have turned out to be significantly smaller than what Tesla advertises .” [ Electrek ] And a factory to produce Tesla’s Optimus is under construction at Giga Texas. [ YouTube ]\n\nA bunch of planned naval vessels have been cut by the US Senate appropriations committee. [ X ]\n\nThe GAO says the F-35 program has about 26 million spare parts, collectively worth about $31 billion, spread around 700 sites around the world. [ Tom’s Hardware ]"}, {"type": "text", "content": "Read more"}], "text_post": false}, {"id": "a8aad898e4db8da3", "title": "Rocket Report: A weekend of ups and downs; Stoke celebrates engine milestone", "url": "https://arstechnica.com/space/2026/11/rocket-report-a-weekend-of-ups-and-downs-stoke-celebrates-engine-milestone/", "source": "Ars Technica — Rocket Report", "tag": "engineering", "published_at": "2026-11-20T13:35:45+00:00", "panels": [{"type": "text", "content": "Welcome to Edition 9.20 of the Rocket Report! Last weekend was a picture of the US launch business in miniature, and emblematic of the opposing trajectories of two of the nation's most experienced rocket makers. First, on Saturday, SpaceX completed a perfect midair catch of its Starship upper stage at its launch pad in Texas after spending nearly a day in orbit. The Super Heavy booster was lost at sea, but SpaceX proved it can recover that piece of the rocket on previous flights. While SpaceX showed it is well on the way to fielding a fully reusable rocket, United Launch Alliance suffered its first-ever total launch failure with the Vulcan rocket. That is terrible news for not only ULA, but also the US Space Force and Amazon, which have booked some 70 launches on Vulcan over the next few years. Your faithful correspondents will take a break from the Rocket Report next week for the Thanksgiving holiday, so we'll see you again the first week of December."}, {"type": "text", "content": "As always, we welcome reader submissions , and if you don't want to miss an issue, please subscribe using the box below (the form will not appear on AMP-enabled versions of the site). Each report will include information on small-, medium-, and heavy-lift rockets as well as a quick look ahead at the next three launches on the calendar."}, {"type": "image", "src": "https://cdn.arstechnica.net/wp-content/uploads/2018/05/smalll.png", "alt": ""}, {"type": "text", "content": "Europe's leading satellite startup eyes Italian rocket maker . Finnish satellite developer ICEYE announced Tuesday that it is seeking to buy Italian rocket-maker Avio for more than $2.2 billion in a transaction aimed at creating Europe’s first true vertically integrated end-to-end space company, Ars reports . Avio builds the Vega C rocket, a solid-fueled launcher designed to carry up to 3.3 metric tons (7,300 pounds) of payload to low-Earth orbit. ICEYE is, by far, the most successful space startup in Europe, with a valuation of more than $12 billion after the company's most recent fundraising round in June.\n\nRead full article\n\nComments"}], "text_post": false}, {"id": "ecde15dc0074aa93", "title": "374 | Lindsey Fitzharris on Forensic Pathology, Reconstructive Surgery, and Sherlock Holmes", "url": "https://preposterousuniverse.com/podcast/2026/11/16/374-lindsey-fitzharris-on-forensic-pathology-reconstructive-surgery-and-sherlock-holmes/", "source": "Mindscape", "tag": "philosophy", "published_at": "2026-11-16T11:50:08+00:00", "panels": [{"type": "text", "content": "The history of science is always fascinating, and the history of medicine surely has some of the best stories. In this episode we talk to writer Lindsey Fitzharris about two of them. First, the story of Scottish surgeon Joseph Bell, who was both a pioneer of forensic pathology and the inspiration for Sherlock Holmes (whose author, Arthur Conan Doyle, took classes with Bell as a medical student). Second, the story of Harold Gillies, the World War II doctor who pioneered reconstructive surgery. Bell is the subject of Fitzharris's new book Sleuth-Hound , while Gillies is the subject of her previous book The Facemaker .\n\nListen or watch Rolex Planet Visionaries wherever you get your podcasts. #ad\n\nGet 30% off your first year of the Base44 Builder plan at https://Base44.com/mindscape . #ad"}, {"type": "text", "content": "Stop piecing your software together. Go to https://odoo.com/mindscape to learn more. #ad\n\nUpgrade your everyday with Quince and get free shipping and 365-day returns at https://quince.com/MINDSCAPE . #ad\n\nLook your best and support men's health at https://www.amazon.com/b?node=223476965011&ref_=MOV26_pod #ad"}, {"type": "image", "src": "https://preposterousuniverse.com/wp-content/uploads/bb-plugin/cache/Lindsay-Fitzharris-display-main-square.jpg", "alt": "Lindsay-Fitzharris"}, {"type": "text", "content": "Support Mindscape on Patreon .\n\nLindsey Fitzharris received a Ph.D. in the History of Science, Medicine & Technology from the University of Oxford. She is the author of several books, and has contributed to publications such as The Wall Street Journal, The Lancet, the Guardian , and Scientific American . She served as the host of the Smithsonian Channel series The Curious Life and Death of…\n\n0:00:00.3 Sean Carroll: Hello, everyone, and welcome to the Mindscape Podcast. I'm your host, Sean Carroll. Some of you may remember Liam Kofi Bright, who is a philosopher at the London School of Economics, former Mindscape guest. And among Liam's many talents is he's one of our best social media posters. I remember one of his tweets or skeets back in the day. I'm not gonna get it exactly right because he's better at formulating these than I am. But the point was that two of the best job descriptions out there in the world of TVs and movies and novels are ones that don't exist in real life. And he had in mind in particular, consulting detective and science officer. [laughter] Consulting detectives are all over the place on modern TV and movies. Castle and The Mentalist, Professor T is one that we recently watched from the BBC. And of course, science officer started with Mr. Spock on Star Trek, but has gone all over the place since then. Arguably, the first of the consulting detectives in fiction was Sherlock Holmes, of course. The idea being that you have a job that is not officially associated with law enforcement, but they call you in because you're better than they are and they need your help. So today we're talking to Lindsey Fitzharris, who is a historian of medicine."}, {"type": "text", "content": "0:01:22.8 SC: She writes books about various things that happened in the history of surgery and other medical procedures. And her most recent book is called 'Sleuth-Hound: The Case of the Real Sherlock Holmes'. It turns out that, of course, Arthur Conan Doyle, when he wrote the Sherlock Holmes books, was inspired by various real characters that that's what's gonna happen when you're an author. You use your experience in the real world to help build your fiction. But there was one person in particular who was sort of obviously the inspiration for Sherlock Holmes, and Conan Doyle admitted that he was the inspiration for Sherlock Holmes. His name was Joseph Bell, and he was not a detective by profession. He was a surgeon. And Conan... Arthur Conan Doyle was a medical student who studied with him and picked up Bell's method, as he called it, of deducing facts about people from little tiny clues, from a spot on their shoes or how they were wearing their jacket or whatever it was. And he would build a story around this and he would inevitably be correct. And he would use these deductions as part of a holistic approach to diagnosing diseases."}, {"type": "text", "content": "0:02:33.4 SC: And this struck Arthur Conan Doyle as very clever, and he gave it to Sherlock Holmes as his signature move, really. And fascinatingly, as Lindsey's book reveals, Joseph Bell, or Joe Bell as his friends called him, did, in fact, work as a consulting detective. He did, in fact, get called in by the Edinburgh law enforcement officials to help them try to think about different cases, all the way up to Jack the Ripper, who was not in Edinburgh, but still famous enough that Joe Bell actually looked into it. So it's a fascinating example of the connection between the real way that science, medicine, et cetera, forensic pathology in this case, developed historically and how it found a real compelling home in fiction. And we had a little bit of extra time at the end of the episode, so I couldn't help but ask Lindsey about her previous book, which is somewhat related, again, medical history, called 'The Facemaker: A Visionary Surgeon's Battle to Mend the Disfigured Soldiers of World War I'. And this is about Harold Gillies, who was really, maybe not the first, but someone who pioneered plastic surgery."}, {"type": "text", "content": "0:03:45.5 SC: And plastic surgery originally was used for almost exclusively reconstructive surgery, especially with the many, many thousands of victims that came back from World War I with wounds that were not fatal but were highly disfiguring, et cetera. And again, the history of medicine is both horrifying and fascinating and filled with people who had all sorts of lofty ideals and accomplished amazing things and had to do some weird things along the way. So it's a little bit of a different kind of thing for Mindscape, because we're not talking about a big theory, we're talking about some examples from history. But that's what feeds in to the big theories of life. As we do mention, there's at least the very big background thought of how people think about the morality of different medical procedures and what people should do in the face of something going wrong with them and how to fix it medically versus what the doctors are actually able to accomplish. So normally we talk about theory, but this is talking about data, the data of what actually happened in history. So let's go."}, {"type": "text", "content": "[music]\n\n0:05:08.3 SC: Lindsey Fitzharris, welcome to the Mindscape Podcast.\n\n0:05:10.3 Lindsey Fitzharris: Thanks for having me on the show.\n\n0:05:12.1 SC: I got to say, not even a question, but a comment you can respond to if you want. But medical history is just super fascinating. It should be a bigger deal, I think.\n\n0:05:22.6 LF: I love that you say that. I've been doing this for over 10 years now, kind of banging the drum about medical history. I always tell people, even if you don't like history, you might like medical history. Because everybody knows what it's like to be sick, to be a patient. And I tell you how that experience was like 100, 150, 200 years ago.\n\n0:05:40.9 SC: And I don't like that, but that's okay. [laughter] Well, I'm glad. It makes me happy to be alive now. I guess that's where I really wanted to start substantively. What was it like, let's say 100... I wanted to say 150 years ago, I realize now 175 years ago, the mid-19th century. What was medicine like? Was there surgery? Was there anesthesia being used?"}, {"type": "text", "content": "0:06:02.1 LF: Yeah, if you guys are listening and you hear that 1850, you're probably already getting nervous because you know nothing good happens in 1850 when you need a surgeon. Although this is shortly after the birth of anesthesia. I say my superpower is that I can make you feel good about living in 2026.\n\n0:06:22.1 SC: Right. [laughter] That's good.\n\n0:06:22.7 LF: But, yeah, in the mid-19th century. So you have the discovery of ether in 1846. In fact, that's gonna be the subject of my next book called 'Ether Wars'.\n\n0:06:32.7 SC: Oh, nice.\n\n0:06:32.8 LF: Which is about... Yeah, I don't know if you know the story, but ether is discovered by a dentist in Boston, and then he immediately tries to patent it and make money off of it. So, it's the American way. So it's the first attempt at medical capitalism. And then there are some other men who step forward to claim ownership over it. So it's really a story about when something powerful comes by and transforms the world, who gets to benefit, who gets to control it? Which I think is very relevant today."}, {"type": "text", "content": "0:07:00.3 SC: Well, especially if it's something that is a medical benefit. I mean, there's benefits and there's benefits, right? And we kind of simultaneously think that medicine should be there for everyone and charge huge amounts of money for it, at least in where I'm geographically located right now.\n\n0:07:16.5 LF: Yeah. I mean, I've lived in the UK, I have the Chicago accent, but I've lived in the UK for 24 years. We have socialized medicine here, so it's a little bit different. But, yeah, anesthesia comes onto this world stage in 1846. Not everybody is given access to it. There is a debate about whether pain is necessary to keep the patient alive, to keep the blood pumping, to keep the heart pumping. So not everybody is given anesthesia initially, but it does come into existence in the mid-19th century. But actually, surgery becomes a lot more dangerous immediately following this because the surgeon is more willing to pick up the knife."}, {"type": "text", "content": "0:07:52.4 SC: Oh, sure.\n\n0:07:52.5 LF: He's more willing to go deeper into the body, right? And so he's no longer fighting you on that table. So he's more willing to do it, but he still doesn't understand germs. And that is the focus of my first book, 'The Butchering Art', which is about this guy named Joseph Lister, who people sort of know through Listerine, but he didn't create Listerine. It was named for him, but not by him. And it wasn't even used in the 19th century as a mouthwash. It was used to treat gonorrhea. [laughter] Which I don't endorse, by the way. [laughter] Please, please don't throw gonorrhea on it.\n\n0:08:23.0 SC: We've learned.\n\n0:08:23.1 LF: Or don't throw Listerine on gonorrhea. But Lister, I always say, saved more lives than any other person who lived because he applies Louis Pasteur's germ theory to surgical practice and is able to basically explain why we get postoperative infections. And once we solve that, surgery sort of becomes limitless."}, {"type": "text", "content": "0:08:44.7 SC: And when exactly was that?\n\n0:08:47.5 LF: So he starts doing his experiments in the 1860s and publishing on this, but it takes a while. And I always say that the most dangerous thing in medicine isn't necessarily ignorance, it is ego. And so a lot of what Lister has to do is convince these surgeons, and it seems crazy to us because why wouldn't they just wanna wash their hands? People ask me this all the time. But you have to remember, your hands are just gonna get dirty with the next patient. Until you understand germs exist, it doesn't actually make sense. And the other part of it is that he's telling these surgeons there are these invisible creatures, they're killing your patients, I can see them with my microscope, and also that they were inadvertently killing their patients all along. And I think that was a hard pill to swallow. So change takes a while. The discovery is hard, but I do think that the change is even harder. It's sometimes very hard to convince people to change their habits."}, {"type": "text", "content": "0:09:45.0 SC: So the anesthesia comes along and then the disinfectant or whatever you wanna call it, comes along.\n\n0:09:52.4 LF: Yeah, antisepsis.\n\n0:09:52.8 SC: Antiseptic comes along. So by the... How international was it? Were people sharing these discoveries from country to country?\n\n0:10:02.0 LF: Yeah. So when ether is discovered, it's written up in a journal and literally within days, it just kind of spreads like wildfire around the world. And remember, this is a time before you had to go through clinical trials and there was no real safety things in place for a lot of this. So Robert Liston, who was known as the fastest knife in the West End, he was incredibly tall, he was 6'2\", he could hold you down with his left arm and he could take off your leg in under 30 seconds, and he was very famous for this. And so really shortly after ether is announced in the medical journals, he does the first operation in Britain in December of 1846. He doesn't think it's gonna work. He calls it the Yankee Dodge. And it does work, and it's a miracle. And what I loved about that scene was that a 17-year-old Joseph Lister was in the audience witnessing this moment. And again, most people think the dawn of anesthesia is when surgery enters that modern era, but actually operations became nothing more than slow-moving executions after that because postoperative infection rose. And so it's really Lister who solves the ultimate medical mystery: what's killing the patients?"}, {"type": "text", "content": "0:11:09.4 SC: But we didn't have X-rays or MRIs or so forth. How did people make the decision that a surgery was what was required? For an amputation, I get it, but for more subtle things that are not immediately visible, how do they know?\n\n0:11:22.3 LF: Well, you have... They, surgeons in the earlier periods weren't doing much. They were dealing with the external parts of the body. And in fact, surgeons were closely related to barbers. In the earlier periods, there were things called barber-surgeons, right? And they split with the barber-surgeons in 1745 and they tried to really distance themselves from barbering, but they were men who made money with their hands. Whereas the physician went to university, he used his brain, and he dealt with the internal diseases. So that's where we get the term internal medicine. So the surgeon was really, for a long time, lowly in the medical order. And really, you only went to the surgeon when you really, really needed it, right? So you had a bladder stone, which was a terrible operation you'd have to undergo without anesthesia. And obviously, amputations happened because if you broke your leg and it was a compound fracture, the likelihood was that it was going to get infected, so the safest thing was to take the leg off. But it was horrifying not just from the pain level, but if you think about it, there was no social network. There was no net to catch you. So if you suddenly lost your legs and you couldn't work, that could be a death sentence too. There's no welfare. There's... It's a very difficult time. And so what Lister is able to do is not only save these limbs and save people from a lifetime of disability that perhaps would lead to their own early demise, but he just revolutionizes the entirety of surgery. And so people can start doing things. There was the first... There was a... The removal of a brain tumor in the late 19th century. So you start to get more complicated internal surgeries at that point."}, {"type": "text", "content": "0:13:04.3 SC: And I presume that there's some sort of competitive nature where if one hospital starts using the antiseptic methods and has much better results, others will have to catch on.\n\n0:13:15.6 LF: Well, Lister starts publishing his results. He's very honest, which is kind of unusual as well. A lot of doctors didn't admit when they had failure. And hospital statistics as such were... They came later in the 19th century. So people always ask me, what was the likelihood of surviving an amputation in the mid 19th century? Well, it depended. It depended also on the time of day. If you were the first patient, great. If you were the last patient, remember, the surgeon's not washing his hands or his instruments. He's not washing that table down. So your chances kind of dwindle as that goes on. The operating theaters were theaters in the truest sense. I mean, people bought tickets to witness this. And people will say to me, \"Well, that's very morbid.\" But, hey, The Pitt is really popular today. [laughter] So we still are curious. We still have medical voyeurism today through these shows, and we're kind of endlessly morbid as a human species."}, {"type": "text", "content": "0:14:10.8 SC: I can vouch that The Pitt is a pretty awesome show. Have you been watching it?\n\n0:14:14.0 LF: Yeah. No, I haven't. You know what? I have not started it because I started rewatching ER. I just got... And then I thought I'd get too confused with two Noah Wyle... So I'm almost done. I know I can't hold two Noah Wyle shows in my head, but I am about to start it. And it didn't get to Britain until the last few months, too. You guys had it first and it's finally made its way over here.\n\n0:14:35.8 SC: It is a grittier show than ER, as you might expect from, just from the name. But okay, well...\n\n0:14:42.1 LF: I'm excited, yeah.\n\n0:14:42.8 SC: Good. So this brings us to the first of the surgeons we're really going to talk about in great detail, the subject of your new book. Actually, why don't you tell us the title of your new book?"}, {"type": "text", "content": "0:14:51.5 LF: So my new book is called 'Sleuth-Hound: The Case of the Real Sherlock Holmes'. And funny enough, I had a little bit of a debate with my publisher because they originally didn't wanna put Sherlock Holmes in the subtitle.\n\n0:15:03.8 SC: What?\n\n0:15:03.9 LF: Which was so confusing to me. I know, because this is actually a book about the original Sherlock Holmes. So let me set it up for you. Most people think that Sherlock Holmes began at 221B Baker Street with the hat and the pipe and the cocaine, but he actually began somewhere far more obscure, on a hospital ward in Edinburgh where a Scottish surgeon named Joe Bell was teaching medical students how to read a human body like a crime scene. He knew everything about patients before they ever opened their mouths: where they came from, what they did with their hands. And in 1878, Arthur Conan Doyle becomes his medical student. And a lot of people don't realize this: Arthur Conan Doyle was a doctor before he was a writer."}, {"type": "text", "content": "0:15:42.6 SC: And it's... So what... Sorry. What years were these?\n\n0:15:46.7 LF: So he becomes his medical student in 1878.\n\n0:15:50.0 SC: Okay. And... But did he ever practice medicine, Arthur Conan Doyle?\n\n0:15:54.9 LF: Yes, he did. I mean, he never really liked it. So he comes from a very impoverished background, and I think he thought going to medical school was sort of a sure way of making money, but he never really enjoys it. And I have to say that he writes throughout his life. I mean, he's a born storyteller, so he's writing short stories even as a medical student. He's publishing. And eventually he strikes out as a doctor. He does practice for several years, but then decides... He ends up catching a very severe case of the flu. His sister had died of the flu, so it was quite a scary moment. And he realizes after that that he's going to just give up doctoring and he's gonna throw his lot in as a writer. And it seems kind of crazy and unpredictable, but at that moment, he was generating more income as a writer. So he segues into writing. But really that medical training never left him, and you can see the fingerprints of that medical training in not just Sherlock Holmes, but in other things that he writes."}, {"type": "text", "content": "0:16:53.0 SC: And it's an interesting choice that he made because that sounds like a transformative moment in the history of medicine and surgery. It must have been kind of exciting to see what was going on?\n\n0:17:02.3 LF: Yeah, I think it was exciting if you're so minded. There's a story of Hector Berlioz, the composer, who goes into the dead house for the first time, and he's so horrified by the cadavers and the anatomy lessons that he jumps out the window [laughter] and he runs off and just decides, \"Nope, that is not for me.\" There's also James Simpson, who ends up discovering chloroform. He goes into the operating theater as a student, and they did a mastectomy, and it was terrible at the time. They would take what was essentially a large fork and they would stick it into the breast, lift up the tissue and cut it. He was so horrified by the whole thing that he also left and he went to the law school and thought, \"I'm gonna change direction.\" But thank goodness he didn't because he does end up discovering chloroform and he's a brilliant doctor later on. But yeah, I think for people who were so minded, it was a brilliant career. But you also have to remember it was dangerous, right? You have things like smallpox and tuberculosis, and this is before antibiotics, this is before a lot of vaccines. There is a smallpox vaccine that was invented in the 18th century by Edward Jenner, but people caught... Doctors caught illnesses all the time and died. Even Henry Gray of Gray's Anatomy dies prematurely by catching smallpox. So it wasn't an ideal career, but I think if you came from a poor background like Conan Doyle, it was a stable career financially."}, {"type": "text", "content": "0:18:27.7 SC: No, but it makes perfect sense that it's not for everyone. I absolutely get that as someone for whom it is not. So that makes sense. So tell us then about Joseph Bell. Was he notable as a surgeon in addition to being notable for being... Or as a doctor, in addition to being notable for being the inspiration for Sherlock Holmes?\n\n0:18:48.8 LF: Well, I came to this story as a medical historian, which is what I am, and I, at the moment that I sold this book, I had never read the original Holmes tales at that point, which is a little bit of a confession.\n\n0:19:02.4 SC: That's okay.\n\n0:19:02.5 LF: But I also decided then to put off reading them initially because I knew enough about Bell to know that the comparisons later became reductive, and we can talk about the moment that Conan Doyle outs him later. But he did feel quite overshadowed by that later in life, and I really wanted to bring that medical history lens. I always try to tell a small story and a big story. And so the small story is about Bell's relationship with Conan Doyle and his inspiration for this character, but the bigger story is one about the development of forensics at this time. It is the first time that medicine enters the courtroom, and Bell is very much a part of that. So he was certainly more... He also reforms nursing in Edinburgh. He's good friends with Florence Nightingale. He's a proponent of women in medicine. So he is a lot bigger, I would say, than just the inspiration for Sherlock Holmes."}, {"type": "text", "content": "0:19:52.2 SC: Because sometimes your students can become famous even though you have really not done anything other than inspire them, but I think that it sounds like Bell had both. He was actually making contributions to medicine for his own sake and then also was lucky enough to have a really good writer as a student. [laughter]\n\n0:20:09.1 LF: Yeah, I think his legacy was his students, and Conan Doyle happened to be one of them. And once he's outed as this inspiration, there's a real media storm around him. And I think he was flattered at first, but you can imagine, I mean, people even today are still obsessed with Sherlock Holmes. People think of him as a real person. They write letters to 221B Baker Street still. And I think that there was a little bit of concern that perhaps the real Bell was going to get lost in that. And I think he was generally lost in it. And another thing I like to tell people is if you're a Sherlockian, because they call themselves that, if you know everything about Sherlock, you will know about Joe Bell because this wasn't a secret. Conan Doyle, there's one clip of him speaking on camera that still survives, which is extraordinary because he was born in 1859, and he talks about the influence Bell had. That's not a secret."}, {"type": "text", "content": "0:21:02.5 LF: But what wasn't known was everything about him. And so one of the things that helped me solve all this sort of crime that I saw happening about Bell was that his diary was donated to the Royal College of Surgeons of Edinburgh. And before that, it was in private hands, and the Bell family didn't let really people have access to it, probably because they wanted enough time to pass after his death. So I suddenly had access to sort of the inner world of Joe Bell. And what I discovered was that he wasn't just the inspiration for Holmes, he was actually doing what Holmes did in reality. He was working unofficially in the shadows with a police surgeon named Henry Duncan Littlejohn, who's a fascinating pioneer of fingerprinting and courtroom photography, and together they work on some of the highest profile crimes of the 19th century."}, {"type": "text", "content": "0:21:50.0 SC: Yeah, we absolutely have to talk about that, but let's set the stage a little bit first, because when you say a real person is an inspiration for a fictional character, the author is going to blend things. It's not supposed to be a secret biography, right? So what are the aspects of Joseph Bell that inspired aspects of Sherlock Holmes?\n\n0:22:12.7 LF: So I often say that Bell gave Conan Doyle the method, and we'll talk about Littlejohn a little bit later, but he gave... Littlejohn gave Conan Doyle the world, the world of forensics and crime. And so both of those things were very powerful to what ultimately became Sherlock Holmes. But when you start reading 'Sleuth-Hound', you are going to believe that you are reading Sherlock Holmes at first because these stories were incredible. So, for instance, it opens with a patient being ushered in to the operating theater before Bell, and he said to the man, \"Well, you were in the army.\" And the man flatly denies this. And Bell is confused because he's almost always right. And so he has the patient stripped to the waist, and lo and behold, there is a D tattooed on his chest for a deserter."}, {"type": "text", "content": "0:22:56.0 LF: So Joe Bell would be bested by no one, least of all an army deserter. And he just had this Sherlockian quality about him. There was a woman that was brought in. He said to her, \"Show me your cutty pipe.\" And she seemed a little embarrassed because smoking wasn't a very feminine trait. And he asked her again, \"I wanna see the pipe.\" She finally produces the pipe. He has her ushered out of the room and then says to the students, \"I knew that she smoked because she had a superficial burn on her cheek and she had a cancerous sore on her lip.\" So he just had this way of cutting through the petty deceits of his patients. I go on a lot of medical podcasts, by the way, and I always say to doctors, \"Are you surprised that the original Sherlock Holmes was a doctor?\" Because doctors are still detectives."}, {"type": "text", "content": "0:23:37.8 SC: Yeah.\n\n0:23:38.8 LF: And it's an important part of doctoring.\n\n0:23:42.5 SC: Well, the TV show House, M.D. Was inspired by Sherlock Holmes, and that was absolutely part of the method, right? I mean, he always said the patient lies.\n\n0:23:50.9 LF: Right. And also, I feel like House is almost like the original iteration in a way. I mean, it's a modern show, but it's going back to that medical world. And the other fascinating thing that's happening at this time is forensics is professionalizing. And so Conan Doyle is sort of taking all of this in and then creating this character. But my husband's a caricaturist, and he works for a TV show over here in Britain called Spitting Image. And he always says he can't caricature people he knows too well because caricature is about first impressions. Now, I think Conan Doyle, he knew Bell in the capacity as his professor, but probably didn't know him beyond that. And so he takes the flashiest, most unique thing about Bell and essentially creates a caricature of Bell. But Bell was a lot more complex than the Holmes character, I would argue, at least."}, {"type": "text", "content": "0:24:45.6 SC: And it's interesting because Conan Doyle didn't just take the look or the style or the mannerisms. It was really, like you say, the method that was the most important thing. So my impression is that Bell himself referred to the method that he had. How formalized is the method?\n\n0:25:03.8 LF: I mean, yeah, he called it the method. And he would say to his students, for example, you need to understand disease. You need to be able to recognize specific diseases as you would recognize your best friend in a group of men. All of them are men, all of them are human, they all have similar traits, but you can recognize your best friend immediately. You need to be able to see those unique traits, almost like a caricaturist, right? My husband again, I'll say to him, \"Oh, what about Will Smith?\" And he'll say, immediately says, \"Oh, his eyes are too far apart.\" And so now that's all I see. A normie doesn't see that. And he always says that caricature is not about making fun of faces, it's about pointing out the thing that makes your face unique. And that's what Bell was doing. He said disease, you had to be very quick, you had to be able to identify that. You also, it wasn't just about observation. You had to take that information in and then you create a narrative, right? He would say to his students, for instance, when you..."}, {"type": "text", "content": "0:26:04.6 LF: If you gave your patient a sleeping pill or sleeping medication, when you go to see them, don't say, \"Oh, you look so well, you must be sleeping better.\" Let them first say whether they're taking the medication at all, right? [laughter] Because sometimes we as patients don't always take our medication. And so he was very good at that. There was an older woman in Edinburgh at the time, and she was kind of prone to hysterical outbursts. And one day she calls on him, says that she's lost her eyesight. And so he goes to her house and sits at the bottom of her bed, listens to her for 30 minutes going on about how she woke up suddenly blind. And at the end of it, he puts his thumb on his nose and wiggles his fingers, and she says, \"How dare you.\" [laughter] which obviously proved that she had not lost her sight. So he just was really good at cutting through those petty deceits. I always say that he must have been a really annoying dinner guest. I can't imagine, he just notices everything about you."}, {"type": "text", "content": "0:27:04.2 SC: I've always wondered with the original Sherlock Holmes stories how literary conceit the method is, how repeatable it is. Like once Sherlock explains to us what the clues were that led him to make these deductions, you're like, okay, that's fine. But does everyone have these clues? Aren't some people just looking normal? They don't have the scuff on their shoe that tells you what they do for a living. [laughter]\n\n0:27:27.6 LF: Oh, yeah. They're more... Yeah, exactly. There must be... I mean, but he... But again, it was just such little, the little distinctions, he would call them, the little distinctions, the things that most people ignore. And I don't know anybody today who has that Sherlockian skill, completely has that skill. I mean, sure, there are people out there who could do this, but it is extraordinary. And his students would think that it was a magic trick. They would say, \"Well, he must have gotten sight of the notes before the patients came in.\" But then ultimately there would be a last-minute patient that would be added to the schedule and prove them wrong. So he just had this real eagle-eye way of looking at the world. I think it's incredibly unique even today. But he does... What's interesting about this story is that you have the rise of Sherlock Holmes, but at the same time you have the kind of rise of what they called the bumbling bobby. So the bobbies were the police officers in London, they couldn't solve crimes. You know, you think of Jack the Ripper in 1888, people didn't have a lot of confidence in the police. And then you have Sherlock Holmes who just seems so logical and so capable."}, {"type": "text", "content": "0:28:38.4 LF: And so in a way, the rise of Sherlock Holmes puts pressure on the police to change their ways. And now we think of forensic investigators as taking that analytical approach to a crime scene. And so I say at the end of the book, Bell didn't create a single tool or he didn't create a discipline like my second book, 'The Facemaker'. But he does do something. He changes the way we think. He gifts that to Conan Doyle, who gifts it to Sherlock Holmes, and Sherlock Holmes gifts it to the world. And suddenly it changes how we approach crime scenes. It changes policing. And so these things are kind of connected and it's extraordinary what he's able to do through that character. And also, if you're listening and know nothing about Sherlock Holmes, I didn't know this either, but Conan Doyle hated the character. He hated him almost from the start. He just couldn't stand it. There's a caricature in the book from the 19th century of him, and he's big in the caricature and there's a little tiny Sherlock Holmes shackled to his ankle. And I think he just felt very imprisoned by it. And I told my husband, \"You should do that caricature with Bell,\" because you could probably say that about Joe Bell at the end of his life, that he felt shackled as well to that character. But Conan Doyle, he hated the character. He wanted to be seen as a more serious writer. He could not understand why people loved this character so much."}, {"type": "text", "content": "0:30:00.0 SC: You know, I hear things like that. Like Agatha Christie didn't like Hercule Poirot, right? And I'm just thinking, man, this character you made up is making you a lot of cash. Maybe you should...\n\n0:30:11.1 LF: Right.\n\n0:30:11.2 SC: You're always allowed to stop writing about it if you want to. No one's forcing you, but you want the cash, so.\n\n0:30:15.9 LF: I mean, here's the thing. He does kill off Sherlock Holmes.\n\n0:30:20.3 SC: He tries.\n\n0:30:21.4 LF: He tries, right? And at that moment, right around that time, he also outs Bell. And so all of it, it's sort of like, Sherlock Holmes is dead, long live Sherlock Holmes. All this media attention shifts to Edinburgh and to Joe Bell. At that point, this huge murder case falls into his lap. It involves a country mansion, a murder dressed up like an accident, and, honest to God, a ballistics expert named Dr. Watson. [laughter] Like, I can't even make this stuff up. I held a letter by Bell that said, \"My dear Watson.\" And I thought, \"This book just writes itself.\" But yeah, he tried. He did try. And... But he just, he got pulled back into it because people were really angry with him when he killed off Holmes. I mean, there were obituaries, people wore mourning bands, some lady allegedly tried to beat him up on the street with her handbag. Like, people were really quite angry about this. And so I don't know if it was just a hard cash decision to bring him back. I think there was just so much pressure because he was... Because Sherlock Holmes was such a beloved character."}, {"type": "text", "content": "0:31:19.5 SC: And they didn't even have social media back then. You can only imagine what it would be like.\n\n0:31:24.8 LF: Yeah, he was like the first viral character. And also he's the most adapted character in TV and films. You know, we have Young Sherlock now on Amazon Prime, and there's just... It's a constant reinvention, like you said, House, M.D. And so it's everywhere.
