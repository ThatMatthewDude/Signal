<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<style>
:root {
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: #000;
  color: #f5f5f5;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
a { color: inherit; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  background: rgba(0,0,0,0.92);
  border-bottom: 1px solid #262626;
  backdrop-filter: blur(6px);
}
.wordmark {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.icon-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: #f5f5f5;
  padding: 6px;
  display: flex;
  align-items: center;
}
.icon-btn svg { width: 24px; height: 24px; }

.tabs {
  display: flex;
  gap: 6px;
  padding: 10px 14px;
  border-bottom: 1px solid #1c1c1c;
}
.tab-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: #888;
  font-size: 13.5px;
  font-weight: 600;
  padding: 7px 16px;
  border-radius: 999px;
}
.tab-btn.active {
  color: #fff;
  background: #1e1e1e;
}

main {
  max-width: 470px;
  margin: 0 auto;
  padding-bottom: 60px;
}

.post {
  border-bottom: 1px solid #1c1c1c;
  padding: 14px 0 22px;
  margin-bottom: 8px;
}
.post-header {
  display: flex;
  align-items: center;
  padding: 0 14px 10px;
  gap: 10px;
}
.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #333;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  color: #ccc;
  flex-shrink: 0;
}
.header-text {
  display: flex;
  flex-direction: column;
  line-height: 1.25;
  min-width: 0;
}
.source-name {
  font-weight: 600;
  font-size: 13.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.header-meta {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.tag-pill {
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 999px;
  background: #1e1e1e;
  color: #aaa;
  border: 1px solid #2c2c2c;
  white-space: nowrap;
}
.timestamp {
  font-size: 12px;
  color: #8a8a8a;
  white-space: nowrap;
}

.media {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  background: #0c0c0c;
  overflow: hidden;
}
.carousel-track {
  display: flex;
  height: 100%;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.carousel-track::-webkit-scrollbar { display: none; }
.panel {
  min-width: 100%;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
  overflow-y: auto;
}
.panel img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.panel-text {
  font-size: 15px;
  line-height: 1.6;
  white-space: pre-wrap;
  color: #eee;
  align-self: flex-start;
  margin: auto 0;
}
.panel-snippet {
  display: flex;
  flex-direction: column;
  gap: 14px;
  align-self: center;
}
.panel-snippet p {
  font-size: 15px;
  line-height: 1.6;
  color: #eee;
  margin: 0;
}
.read-more {
  font-size: 13.5px;
  font-weight: 600;
  color: #4ea1ff;
  text-decoration: none;
}

.dots {
  position: absolute;
  bottom: 10px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 5px;
}
.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,0.35);
}
.dot.active { background: #fff; }

.post-footer {
  display: flex;
  align-items: center;
  padding: 10px 14px 0;
  gap: 12px;
}
.save-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: #f5f5f5;
  padding: 4px;
  margin-left: auto;
}
.save-btn svg { width: 22px; height: 22px; }
.caption {
  padding: 8px 14px 0;
  font-size: 13.5px;
  color: #ccc;
  line-height: 1.5;
}
.caption .caption-source {
  font-weight: 600;
  color: #f5f5f5;
  margin-right: 6px;
}
.caption a {
  color: #4ea1ff;
  text-decoration: none;
}
.caption-body {
  margin-top: 6px;
}

.hidden { display: none; }
#saved-view {
  display: none;
}
#saved-view.active { display: block; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.empty-state {
  text-align: center;
  color: #777;
  padding: 60px 20px;
  font-size: 14px;
}
.saved-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 4px 14px 14px;
}
.saved-header h2 {
  font-size: 16px;
  margin: 0;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="wordmark" id="wordmark-btn">Atlas</div>
  <button class="icon-btn" id="saved-toggle-btn" aria-label="Saved posts">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 3c-1.1 0-2 .9-2 2v16l8-5.333L20 21V5c0-1.1-.9-2-2-2H6z"/></svg>
  </button>
</div>
<div class="tabs" id="tabs-row">
  <button class="tab-btn active" data-tab="live">Live</button>
  <button class="tab-btn" data-tab="weekly">Weekly</button>
</div>

<main>
  <div id="feed-view">
    <div id="feed-live" class="tab-panel active"></div>
    <div id="feed-weekly" class="tab-panel"></div>
  </div>
  <div id="saved-view">
    <div class="saved-header">
      <button class="icon-btn" id="back-btn" aria-label="Back to feed">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h2>Saved</h2>
    </div>
    <div id="saved-list"></div>
  </div>
</main>

nt moment exhibits a dual structural character: it simultaneously constitutes the phe", "read_more_url": "https://philpapers.org/rec/KTIEOY", "read_more_source": "PhilPapers"}], "text_post": false}, {"id": "18aef6ff2617e1de", "title": "Huang, Wanhong: The Manifestation of Linguistic Structures in Fock Space: A Mathematical and Philosophical Inquiry", "url": "https://philpapers.org/rec/HUATMO-6", "source": "PhilPapers", "tag": "philosophy", "published_at": "2026-11-20T14:31:38.894091+00:00", "panels": [{"type": "snippet", "content": "This study examines the manifestation of linguistic structures through precise mathematical realizations in full nonsymmetric Fock space. A self-contained sequence of definitions and examples develops the relevant linear algebra, Hilbert-space completion, tensor products, direct sums, creation operators, and ranked term algebras for readers familiar with university mathematics and introductory physics. The representational framework uses a many-sorted grammar to distinguish licensed linguistic terms from unrestricted ranked trees. An explicit syntactic preservation profile specifies recovery, ", "read_more_url": "https://philpapers.org/rec/HUATMO-6", "read_more_source": "PhilPapers"}], "text_post": false}, {"id": "8cfff1718a214d20", "title": "Technology Promised Ease. Outages Are Making Many Americans Uneasy.", "url": "https://www.nytimes.com/2026/11/19/us/tech-outages-computer-networks.html", "source": "The New York Times", "tag": "news", "published_at": "2026-11-20T14:25:22+00:00", "panels": [{"type": "snippet", "content": "Rather than feeling empowered by the digital tools they have come to rely on, many Americans are now questioning how powerless they may have actually become.", "read_more_url": "https://www.nytimes.com/2026/11/19/us/tech-outages-computer-networks.html", "read_more_source": "The New York Times"}], "text_post": false}, {"id": "06d398a66b12cd0f", "title": "Vote now for 2026's RPS 100: Reader Edition", "url": "https://w , "tag": "philosophy", "published_at": "2026-11-20T11:00:00+00:00", "panels": [{"type": "snippet", "content": "The house my father built taught me to expect disaster. Seeing it come down was a release - by Henrick Karoliszyn Read on Psyche", "read_more_url": "https://psyche.co/turning-points/the-house-my-father-built-was-resilient-and-rickety-like-him", "read_more_source": "Psyche"}], "text_post": false}, {"id": "ba49e7729e6c504f", "title": "A Texas Police Department Got $100K After a Single Immigration Arrest. It Stands to Earn Much More.", "url": "https://www.propublica.org/article/texas-287g-immigration-police-department-money", "source": "ProPublica", "tag": "news", "published_at": "2026-11-20T11:00:00+00:00", "panels": [{"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/glennharvey_2026_11_13_propublica_F1-edit_preview_maxWidth_3000_maxHeight_3000_ppi_72_embedColorProfile_true_quality_95.jpg?w=1149", "alt": "An illustration in golden tones shows two officers in cowboy hats detaining a man in front of a pickup truck, water tower and Texas flag. Above them, green dollar-sign icons accompany illustrations of police gear and expenses like a tactical vest, patrol car, binoculars and gas pump."}, {"type": "text", "content": "Last spring, the police chief in a tiny North Texas suburb called Pantego went before his town council with what might have sounded like an audacious pitch to bring in more money for policing.\n\nHis department could accept the federal government’s offer to get into the business of immigration enforcement.\n\n“I won’t say there’s unlimited funding, but there’s quite a bit of money in the fund,” Pantego Police Chief Robert Rife said during the April meeting in which council members approved an agreement with Immigration and Customs Enforcement.\n\nHe was right. After a single immigration arrest this past June, Pantego received $100,000.\n\nIt stands to earn much more.\n\nRife predicted in his presentation to the council that federal grants could bring in an additional $720,000 for the 2,500-resident town a few miles east of Fort Worth. For perspective, combined with the money it had already received, that’s roughly equivalent to 40% of the town’s $2.1 million police budget last year."}, {"type": "text", "content": "Pantego is one of 429 law enforcement agencies in the state as of mid-September that have entered into agreements with ICE as part of President Donald Trump’s efforts to accelerate deportations. Texas leads the nation in these partnerships, known as 287(g) agreements, which authorize local officers to make immigration arrests during their normal course of duty. A key incentive for local governments across the country has long been the funding that comes with participation .\n\nThe federal program funnels millions of dollars to local law enforcement while requiring few measurable results and little tracking of how the money is spent. KXAN reviewed minutes from nine local government meetings and found that, over and over again, Texas law enforcement officials sold the program to their local elected leaders as a boon for their cash-strapped departments."}, {"type": "text", "content": "The same month Pantego decided to join the program, for example, the police chief in the small suburb of Hollywood Park near San Antonio made a similar pitch to his city council. The city “actively profits on payroll for the time spent,” he said.\n\nAnd in Smith County in East Texas, Sheriff Larry Smith told county commissioners that “equipment, use of fuel, mileage and things of that nature” could all be reimbursed, plus there would be $100,000 for two new vehicles and money for overtime.\n\n“How often do the feds offer us money for anything?” Smith County Commissioner John Moore asked.\n\n“Not very often,” the sheriff responded. He declined to speak with KXAN.\n\nAustin-based immigration attorney Kate Lincoln-Goldfinch worries that local law enforcement will become dependent on the financial incentives, making it difficult to pull away from the program in the future."}, {"type": "text", "content": "“I’m concerned about what this money is going to be doing to the mindset of these small police departments,” she said.\n\nIn the Texas Panhandle, Hartley County Sheriff Chanze Fowler said nearly all the federal funding his department receives supports its regular operations, in addition to immigration work.\n\nThe sheriff’s office recorded 54 arrests under 287(g) authority from January to early July, most for minor traffic and vehicle violations, according to records obtained by KXAN. It received more than $205,000 during that time. By this past summer, it had spent about $30,000 on things like wages, extra pay for officers who became 287(g) certified, payroll taxes, retirement funds and “fleet purchases.”"}, {"type": "text", "content": "Almost all of the 287(g)-related funds “go towards items needed for our everyday job,” Fowler said.\n\nOther local city and law enforcement officials said the additional funds help officers protect their communities and carry out core duties. ICE did not respond to a request for an interview for this story but instead provided a statement that explained the program. Its website says the program targets dangerous criminal offenders.\n\nPantego officials have declined to answer KXAN’s questions about the department’s involvement with the program since August, despite repeated attempts to reach the mayor, town council, city manager and police chief by phone, email and in person.\n\n“We are not interested in interviewing at this time,” said City Manager Leslie Galloway, the only official to respond."}, {"type": "text", "content": "Ammon Blair, a senior fellow for the Texas Public Policy Foundation, a conservative think tank that supports the program, acknowledged the money can help departments operating on thin budgets, including helping to pay for overtime. But he said there should be more oversight of how the federal money is spent.\n\nKXAN obtained service agreements between ICE and the Smith County Sheriff’s Office and the police department in Bullard, Texas, a town of about 5,300 people in East Texas. The agreements allow either party to terminate with 60 days’ notice. None indicate that the federal government can reclaim funding if an agreement is terminated.\n\nThat was one of the selling points in Pantego. The department could get federal funding and eventually drop out of the program without penalty and keep the equipment already purchased, the police chief told town council members. All it had to do was make at least one immigration arrest."}, {"type": "text", "content": "Between the end of April and mid-June, it made two."}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/20261114-Tavitian-287gTexasMoney-41_preview_maxWidth_3000_maxHeight_3000_ppi_72_embedColorProfile_true_quality_95.jpg?w=1149", "alt": "A tan concrete building with tall windows, metal awnings over glass double doors bearing sheriff seals, and green shrubbery along a brick-paved street in bright daylight."}, {"type": "text", "content": "Local law enforcement agencies that join forces with ICE can choose among three models, two of which focus on identifying people already in jail who may be subject to deportation.\n\nTrump revived the third kind, called the task force model, at the beginning of his second term. Task force agreements often worry civil and immigrants’ rights groups because of the model’s problematic track record: ICE started phasing them out in 2012, after Department of Justice investigations revealed that sheriff’s offices participating in the model had committed civil rights violations.\n\nBut task force agreements can also be lucrative.\n\nAgencies can receive federal reimbursement for salaries, overtime and benefits for “conducting purposeful and intentional” immigration enforcement activities once the contract starts, according to a service agreement obtained by KXAN."}, {"type": "text", "content": "They can also get recurring quarterly incentive payments and one-time stipends for equipment, technology and vehicles, though federal memoranda and agreements obtained by KXAN don’t specify what agencies can purchase.\n\nThe Department of Homeland Security stopped renewing task force model agreements during the Obama administration after federal investigations revealed civil rights violations involving sheriffs’ offices in Arizona and North Carolina .\n\nSince Trump’s return to office, the model has become the most common of the three agreement types. At least 241 task force model agreements were signed in Texas in 2026 alone, compared to just 30 combined for the other models in that time period, according to ICE participation data from September."}, {"type": "text", "content": "Smith County was among the first in Texas to sign on after the president reinstated the task force model in early 2025.\n\nMoore, the only member of Smith County ’s Commissioners Court who agreed to speak with KXAN, explained why he thought the commissioners wanted to partner.\n\nHis first word: “budgetary.”\n\n“Any kind of training that any of our departments need to have, or are required to have, costs money, and it’s rare that we get an opportunity to get funding for training from outside county taxes,” Moore said. “Any time we can save the taxpayers money, I’m all for it.”\n\nSmith County got more money than any other of the 93 Texas law enforcement agencies whose funding KXAN reviewed. The sheriff’s office received nearly $2.2 million in federal 287(g) funding from January 2025 to June 2026, according to records obtained by KXAN. That’s equivalent to about 12% of its budget for fiscal year 2025."}, {"type": "text", "content": "Smith, the sheriff, told the Commissioners Court last November that although vehicles purchased with that money would be used for the 287(g) program, “that doesn’t mean, if we’re out here, we won’t run to another call or take another call that comes across the radio. We will do that. We try not to separate 287(g) from our other law enforcement duties. We do it all together.”\n\nAbout 120 of 198 licensed officers in the Smith County Sheriff’s Office participated in the program. Together, they conducted 124 immigration enforcement actions between October 2025 and July. KXAN requested a list of 287(g) stops from the department, in addition to any associated charge. Smith County listed no associated criminal charge for more than 100 of these stops."}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/20261114-Tavitian-287gTexasMoney-33_preview_maxWidth_3000_maxHeight_3000_ppi_72_embedColorProfile_true_quality_95.jpg?w=1149", "alt": "A row of white Smith County Sheriff patrol SUVs is parked side by side inside a garage."}, {"type": "text", "content": "Jose Rodriguez and his 23-year-old son, Pablo Rodriguez, were among those affected.\n\nOne afternoon in late June, the pair cruised along Loop 323, a circular segment of highway in Tyler, a city of 113,000 people in East Texas. They’d spent hours working in the summer heat at a construction job and were headed to Chick-fil-A to pick up lunch for their family.\n\nThen red and blue lights appeared behind them. The law enforcement agent said that he’d pulled their black extended-cab work truck over because of a missing license plate on the trailer attached to the pickup and a missing dual-wheel mud flap.\n\nBody and vehicle camera footage showed the detective requesting that Jose Rodriguez get out of the truck. “Any English at all?” the detective later asked. Jose Rodriguez raised his right hand, holding his thumb and index finger close together."}, {"type": "text", "content": "“Un poquito?” the detective asked, followed by, “Are you a U.S. citizen?”\n\nThe man shook his head and answered. “No.”\n\nSeconds later, the detective pulled Jose Rodriguez’s hands behind his back and put him in handcuffs.\n\nHe was eventually taken from the Smith County jail to an ICE detention facility, about two hours west of Tyler. His son, who is a U.S. citizen, said Jose Rodriguez was detained for about three months before being deported to Mexico.\n\nKXAN could find no criminal convictions or arrests on his record when the Smith County detective took him into custody in June.\n\n“Just like that, he’s gone,” Pablo Rodriguez later told KXAN. “My dad’s gone.”\n\nLaw enforcement officers, Pablo Rodriguez said, “portray us as criminals, rapists, violent people. We’re not that. We’re just regular people trying to find a better life. The only difference is our skin. That’s pretty much it.”"}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/20261114-Tavitian-287gTexasMoney-11_preview_maxWidth_3000_maxHeight_3000_ppi_72_embedColorProfile_true_quality_95.jpg?w=752", "alt": "A young man wearing a light gray knit beanie, an olive green Nike hoodie, light-wash jeans and work boots stands outdoors in front of a wire fence and sunlit trees."}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/20261114-Tavitian-287gTexasMoney-15_preview_maxWidth_3000_maxHeight_3000_ppi_72_embedColorProfile_true_quality_95.jpg?w=752", "alt": "A person holds up a smartphone displaying a photograph of a man in a white T-shirt and blue jeans crouching outdoors while holding a leafy stem."}, {"type": "text", "content": "Elections earlier this month have left the 287(g) program’s future uncertain, at least in Texas.\n\nWhile the Trump administration has reached agreements with local law enforcement to work with immigration officials, Congress has broader oversight authority. That includes decisions about funding. In January, Democrats will take over both chambers of Congress and many, including freshman Texas Sen. James Talarico, have criticized ICE tactics. It’s unclear, however, how much of their focus will be on immigration enforcement and specifically on the 287(g) program.\n\nMore locally, state Sen. Charles Schwertner, the Republican lawmaker who authored a measure in 2025 that required most Texas sheriff’s offices to participate in the program, wants to expand the mandate during the coming legislative session to include other law enforcement agencies, like police departments. So does the conservative think tank where Blair works."}, {"type": "text", "content": "But support for such legislation may be harder to get after November’s midterm election.\n\nSchwertner retained his state Senate seat, and Republicans maintained their majority in that chamber, but Democrats took control of the governor’s mansion and the state House of Representatives for the first time in a generation. Any new bills would require legislative approval from both chambers and the governor’s signature, or enough legislative support to override a veto.\n\nIn a press release well before the election, Democrat Gina Hinojosa called on Gov. Greg Abbott to “demand accountability from the Trump administration and stop enabling ICE operations that are terrorizing communities and violating the law.” The release did not mention the 287(g) program by name. Hinojosa beat Abbott in this month’s election and will take over as governor in January. She did not respond to a request for comment for this story."}, {"type": "text", "content": "The state program could also be affected by this month’s election of Democrats Nathan Johnson , who won the race for state attorney general, and Sarah Eckhardt , who won her bid to become state comptroller.\n\nJohnson, as a state senator, opposed the mandate that sheriffs’ offices participate in the program. He will inherit responsibility for enforcing the law, which requires most sheriffs to seek agreements with ICE by Dec. 1. Johnson said he will use his discretion in deciding whether to sue sheriffs who fail to comply if they have “legitimate law enforcement reasons for not having a 287(g) agreement.”\n\nHe also questioned the state attorney general’s continued participation in the program. Current Attorney General Ken Paxton signed a 287(g) task force model agreement in February 2025."}, {"type": "text", "content": "“The attorney general’s office has tremendous, vast responsibilities,” Johnson said. “Never included among them since the creation of this state was outsourcing your employees to a federal agency for a purpose in which we’re not trained or qualified and which distracts me from the mission of my office.”\n\nJohnson didn’t entirely rule out working with ICE in some capacity if it allowed his office to investigate crimes committed by ICE agents in Texas.\n\nEckhardt, meanwhile, will take over oversight of a $20 million grant program that state lawmakers created two years ago to help sheriff’s offices cover any costs of participation in the 287(g) program not reimbursed by the federal government. By late September, the comptroller’s office had awarded more than $6.5 million to 78 sheriff’s offices, according to figures obtained by KXAN."}, {"type": "text", "content": "During her campaign, Eckhardt warned that expenses for the program could eventually fall on local taxpayers, calling it “unsustainable.” After winning her seat, she said she would “do a 287(g) audit to show how that expense is driving up property taxes.”\n\nThis story is an adaptation of an investigation by KXAN. Read the original reporting:\n\nEven if state leaders don’t expand the participation requirement or remove the current mandate, departments can choose to keep collecting federal money to enforce immigration law.\n\nIn Fayette County southeast of Austin, Sheriff’s Lt. David Beyer told KXAN that the 287(g) funding his office had already received totaled about $800,000, which helps purchase equipment it can also use for ordinary police work."}, {"type": "text", "content": "“If they want to pay us extra to do that job,” Beyer said, “we’re more than happily going to accept those funds, because that saves our taxpayers money.”\n\nThe post A Texas Police Department Got $100K After a Single Immigration Arrest. It Stands to Earn Much More. appeared first on ProPublica ."}], "text_post": false}, {"id": "adf67ebd00370aab", "title": "Ohio Jobs Program Wants Its Money Back After Company’s Failure to Deliver GMO Salmon", "url": "https://www.propublica.org/article/aquabounty-jobsohio-gmo-salmon-grant", "source": "ProPublica", "tag": "news", "published_at": "2026-11-20T10:30:00+00:00", "panels": [{"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/20241204-DAngelo-AquaBountyIncentives-0022-cropped_maxHeight_3000_maxWidth_3000.jpg?w=1149", "alt": "A sparse, snowy field with numerous black pipes, incomplete concrete structures and rebar. In the background there is a fence around the site and a forest beyond it."}, {"type": "text", "content": "When a biotech company named AquaBounty Technologies announced plans to farm genetically engineered Atlantic salmon at a new plant in Ohio, local and state officials eagerly provided it with incentives. Not long after, the company paused construction and auctioned off “new” and “unused” equipment. Now, the state’s private economic development arm wants its $1 million back.\n\nJobsOhio has requested repayment from AquaBounty by Sunday, according to a company filing with the Securities and Exchange Commission. The filing also notes that, at the end of September, AquaBounty was down to three employees and $122,255 in cash.\n\nAquaBounty said that its salmon could thrive in indoor freshwater farms and help feed the world. Announced in 2021, the new development in Pioneer, Ohio, was supposed to be its first large-scale production facility."}, {"type": "text", "content": "The project came with promises of 112 new jobs, plus more resources for schools and infrastructure. It was believed to be the largest investment ever in rural Williams County.\n\nBut AquaBounty, which had never made a profit over its 30 years in business, faced a tangle of regulatory challenges and pushback from environmentalists.\n\nLocals were also suspicious of how the village mayor’s personal interests were tied up in the project. Among other moves, Pioneer Mayor Ed Kidston bought land that AquaBounty wanted to build on. He then sold it to the company for $1.5 million more than he’d paid.\n\nAquaBounty’s plan was unproven, but, as ProPublica reported last year , the company was buoyed by state and local resources — including the million-dollar grant from JobsOhio. The company received the money in August 2021, according to financial filings, shortly after the project went public."}, {"type": "text", "content": "“Why the state was so eager to promote this industry is really puzzling,” said Sherry Fleming of Williams County Alliance, a grassroots environmental group. While AquaBounty had genetic engineering know-how, she said it seemed to have limited experience in production."}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/20250114-Hagen-AquaBountyIncentives-0400_maxHeight_3000_maxWidth_3000.jpg?w=752", "alt": "A woman gestures with her hand as she speaks while another woman looks on. The two are seated at a table in a community meeting room. The table has a laptop, pairs of glasses, water bottles and stacks of paper on it."}, {"type": "text", "content": "In response to ProPublica’s queries, a press contact for AquaBounty said it shares what it can in its SEC releases and filings, and that it’s still in discussion with JobsOhio over the repayment demand. AquaBounty’s filing said that “there can be no assurance that JobsOhio will agree to any payment schedule or other accommodation.”\n\n“Any collection or legal action by JobsOhio could result in additional costs and management distraction,” it added.\n\nKidston didn’t respond to requests for comment. He said at the time that his actions involving the plant were intended only to help the community. The village administrator referred ProPublica to AquaBounty and its website.\n\nJobsOhio operates privately but has a funding mechanism set up by the state and a board appointed by the governor. Matt Englehart, a spokesperson for JobsOhio, said in an email to ProPublica that it “operates with transparency and accountability,” but its limited disclosures have  long been a sore point for Ohioans."}, {"type": "text", "content": "On its website, JobsOhio says its funding model for specialized grants is “independent” and accommodating of “unique needs.” Qualifications include, but aren’t limited to, “job creation, additional payroll, fixed-asset investment commitment, project return on investment, and project location.”\n\nThe AquaBounty grant depended on not only the creation of jobs, but also $222 million in capital investment and a payroll of more than $5.4 million by the end of 2026. It had to maintain those commitments through the end of 2028.\n\nLess than two years after it got the money, construction stalled. Roughly 30% built, the site languished at the end of Kexon Drive, a smooth new road that Pioneer had extended for its benefit."}, {"type": "text", "content": "AquaBounty sold equipment intended for the Ohio farm in 2024 and 2025. It also sold its intellectual property for genetically engineered salmon. By the end of September, according to its filing, its primary remaining assets were unsold equipment, the land in Pioneer and the incomplete build.\n\nJobsOhio and other economic development boosters should “take a good look at this because they’re putting taxpayer dollars at risk when they advertise to bring these industries in, and they haven’t done their homework to protect the community,” Fleming said.\n\nEnglehart told ProPublica that he can’t discuss a situation that may result in litigation. But with any company, he said, “when metric commitments are not met, we work closely with those businesses” to help them overcome challenges."}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2025/02/20241204-DAngelo-AquaBountyIncentives-0024_preview_maxWidth_3000_maxHeight_3000_ppi_72_embedColorProfile_true_quality_95.jpg?w=459&h=306&crop=1", "alt": ""}, {"type": "text", "content": "If all options are exhausted, he added, “we will claw back some or all of our dollars so they can be used for future economic development projects to benefit Ohioans.”\n\nJobsOhio’s demand notice came in September, the financial filing said, informing the company that its equipment sales and consideration of acquisition offers for the Ohio farm were a breach of the grant agreement.\n\nAquaBounty “provided additional information” to JobsOhio in October, the filing said, but the agency upheld its demand and requested repayment this month. If it doesn’t come, the filing said, JobsOhio may refer the matter for collections and “pursue the remedies available” under the grant agreement.\n\nWith an onerous process and uncertain outcomes, it’s “pretty rare” for JobsOhio to try to claw back money, said Kristan Wong Karinen, a research analyst with the nonprofit Good Jobs First, which tracks public subsidies in economic development. More commonly, she said, it and other agencies will renegotiate the contract — extending the time period for a company to meet commitments, perhaps, or lowering requirements."}, {"type": "text", "content": "“In this case, with AquaBounty,” Wong Karinen said, “because they haven’t done anything, they haven’t fulfilled any of the requirements, I feel like JobsOhio is being forced into this.”\n\nThe post Ohio Jobs Program Wants Its Money Back After Company’s Failure to Deliver GMO Salmon appeared first on ProPublica ."}], "text_post": false}, {"id": "5eaa9c7e7b032f26", "title": "Does it really matter if there’s an intelligence explosion?", "url": "https://www.noahpinion.blog/p/does-it-really-matter-if-theres-an", "source": "Noahpinion", "tag": "financial", "published_at": "2026-11-20T10:13:06+00:00", "panels": [{"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!K2Dk!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F83c7465d-0a2a-4032-b386-8b2c83298ba1_1086x611.jpeg", "alt": ""}, {"type": "text", "content": "Vernor Vinge is possibly my favorite science fiction author of all time. 1 The Singularity, which he famously predicted would happen somewhere between 2005 and 2030, features heavily in most of his stories . It usually happens the same way: an Intelligence Explosion, of the type envisioned by I.J. Good — the smarter AI gets, the faster it’s able to make itself even smarter, meaning that AI becomes godlike nearly instantaneously once it reaches a certain threshold of capability.\n\nAlmost every discussion about AI safety that I hear in San Francisco or read in the tech blogosphere centers around this sort of event. The discussions are all about whether recursive self-improvement (RSI) is near, and whether we should “pace the frontier” — i.e., deliberately slow down or pause AI progress — to stop RSI from creating an intelligence explosion."}, {"type": "text", "content": "As I’ve listened to these arguments, I’ve grown increasingly skeptical that this is the right discussion we should be having. But before I explain why, let me quickly summarize the debate itself, to give an idea of what the arguments look like.\n\nIn fact, I’ve published some pieces of that discussion on this blog. Back in September, Ramez Naam wrote a guest post arguing that an intelligence explosion is not imminent:\n\nHis basic arguments were:\n\nOpenAI data show that AI is still only able to automate short chunks of the AI research process.\n\nAI research is subject to diminishing returns, so that each increase in AI capability should buy less of a speedup in the pace of automated research.\n\nDiminishing returns also mean that accelerating AI progress will require exponentially more of other resources, such as compute and money."}, {"type": "text", "content": "There’s no sign yet of an acceleration in the rate of AI progress.\n\nIn a follow-up post , Ramez did a deeper dive on the topic of agent swarms, arguing that they’re not as effective as many people believe.\n\nTheo Jaffee echoed these arguments , noting that OpenAI’s data shows that AI hasn’t even been able to fully automate smaller research tasks yet:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!qOZ_!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fffc5d576-6b78-4e3e-855d-2fe33d65afed_1376x908.jpeg", "alt": ""}, {"type": "text", "content": "Luis Garicano and Alex Imas also wrote a post downplaying the likelihood of an intelligence explosion:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!k5hh!,w_56,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd92bd37f-134c-4961-958e-4b5af2dba9a8_1024x1024.png", "alt": ""}, {"type": "text", "content": "Their arguments are more economic in nature. They show that although AI progress has accelerated, it also shows diminishing returns in terms of research spending, meaning that every unit of progress has come with a higher price tag:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!rPJz!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd830b4ec-043e-49b1-84a7-fd889397471c_1128x634.jpeg", "alt": ""}, {"type": "text", "content": "They also estimate an economic model of RSI, 2 and conclude that ideas in AI research are probably getting harder to find, reducing the likelihood of an intelligence explosion.\n\nOn the other side of the debate, we have the recent METR report about Anthropic’s internal progress in automating AI research. The report uses Anthropic’s own internal measure of AI capability, AECI, rather than the better-known public ECI. It also relies on data that aren’t public, meaning that deciding how much of the report to believe requires a lot of guesswork and assumption-making. But the basic story METR tells is that Claude is already speeding up Anthropic’s research process by a lot:\n\nAs we describe below, we were able to confidently determine that the acceleration [of AI progress in late 2025] was not due to an acceleration in the rate of growth of training compute…We guess that a majority (perhaps ≈80%) of the current…acceleration is due to AI."}, {"type": "text", "content": "Dwarkesh Patel, meanwhile, argues that AI research isn’t that different from math, and that the same factors that made AI suddenly go from useless to godlike at math will happen soon with AI’s own self-improvement:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!QEPJ!,w_56,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2F90fa9666-5b8b-4685-a8fb-4b64cb7e0333_1080x1080.png", "alt": ""}, {"type": "text", "content": "He writes:\n\nIt’s crazy how fast we went from, in 2023, “This model can’t reliably add four-digit numbers,” to…about a month ago, “Okay, it fucking solved a Millennium Prize problem in 88 hours.”…\n\nAI research is actually surprisingly similar to the type of mathematical progress that current AIs are disproportionately good at: unlocking a ton of low-hanging fruit by applying a combination of incredible persistence and a superhuman capacity to connect ideas from lots of adjacent domains…In every domain where we can check answers and give AIs thousands of rounds of practice—for example, competitive programming contests, or well-scoped open math problems—they’ve gone from worse than most humans to better than the best humans within a few years…AI research has those same verifiable properties…"}, {"type": "text", "content": "Once AI is as good as the best humans at AI research, algorithmic progress will get radically faster…Today’s AIs already do work at about 10 times human speed. And automated researchers would also be working around the clock, nights and weekends included. As a result, each individual automated researcher will be cramming in roughly 50x more work every calendar week than a human researcher can do…During the intelligence explosion, automated engineers will build tens of thousands of times more [reinforcement learning] training environments than we have currently.\n\nSo that’s the debate. Basically, it depends on whether ideas get harder to find faster than AI gets better at finding ideas, and only time will tell which one wins."}, {"type": "text", "content": "But as I said, while this debate is intellectually interesting, I’m not sure how much it matters.\n\nWhether an intelligence explosion happens is obviously very important. A sudden unfathomable leap in AI capabilities to godlike levels would be, to put it mildly, a very big deal. But that doesn’t mean an intelligence explosion is the thing we should be thinking and arguing about .\n\nFirst of all, if an intelligence explosion is possible, it’s going to happen , and there’s probably just not much we can do to affect how it all shakes out.\n\nAlthough people disagree about AI’s contribution to its own uplift, everyone agrees that AI capabilities are improving at a steady, rapid rate. Here’s Epoch AI’s ECI number, the most common measure of AI capabilities:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!1DP1!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4a3c36ff-1751-4322-a576-dbd6e3b04da1_1346x812.jpeg", "alt": ""}, {"type": "text", "content": "Most discussions about AI safety policy revolve around the idea of “pacing the frontier” — i.e., using government policy and AI labs’ own decisions to bend that trendline of progress downward. The usual reason given is that this will allow alignment research time to catch up , so that more powerful AI is safe by the time it arrives.\n\nBut this approach simply can’t deal with an intelligence explosion. If there’s some threshold at which AI gets good enough to start an intelligence explosion, that threshold will be reached . Even if we “paced the frontier” and slowed the rate of AI progress down by half, that would mean we’d hit the intelligence explosion in 2037 instead of 2032, or 2030 instead of 2028, or something like that. It would only buy us a few extra years."}, {"type": "text", "content": "I guess two years or five years isn’t nothing — we could use it to hang out with our loved ones and try some cool new restaurants while we waited for the arrival of the computer gods. But ultimately, it seems like small potatoes, especially if you’re an AI safety type who thinks an intelligence explosion would be a catastrophic event for humanity.\n\nIf an intelligence explosion is possible, the only way to prevent it is to halt AI progress completely , rather than just slow it down. In 1993, Vernor Vinge made a powerful argument as to why that’s impossible:\n\nBut if the technological Singularity can happen, it will. Even if all the governments of the world were to understand the “threat” and be in deadly fear of it, progress toward the goal would continue. In fiction, there have been stories of laws passed forbidding the construction of “a machine in the form of the mind of man”.  In fact, the competitive advantage -- economic, military, even artistic of every advance in automation is so compelling that passing laws, or having customs, that forbid such things merely assures that someone else will get them first."}, {"type": "text", "content": "I’m a little more optimistic than Vinge here — I think we could engineer an AI slowdown if we got sufficiently scared — but I don’t for one minute believe we could engineer a complete halt .\n\nNor do I believe that alignment research will be able to make an intelligence explosion safe. “Pacing the frontier” so that alignment research can catch up might be effective in a world of steady linear AI progress. 3 But in a world of sudden superexponential progress, AI alignment research will immediately be left behind. Even if there is a Singularity for understanding alignment, in a world with an intelligence explosion it will be the superintelligent AI, not us, that carries out that Singularity and decides on its alignment for itself."}, {"type": "text", "content": "A second point is that it’s not obvious why an intelligence explosion would be more dangerous than — or even distinguishable from — the type of rapid, non-explosive progress we’re already getting. Remember, AI going from “can’t add two numbers together” to “solves problems too hard for all human mathematicians combined” in three years is not counted as an intelligence explosion!\n\nIt’s clear that at the current rate of steady progress, AI will become superhuman in most domains in a fairly small number of years. Even robotics and other physical tasks look conquerable with the current type of AI that powers Claude and GPT. This means that AI will basically look like a god within our lifetimes, whether or not it looks like the kind of infinitely self-improving gods that populate Vernor Vinge novels."}, {"type": "text", "content": "This is why I’m not sure what an intelligence explosion means for our economy. It’s easy to write down a model in which smoothly increasing AI capabilities drive a smooth increase in GDP. But why should we believe a model like that? Other technologies haven’t really worked that way.\n\nUsually, technologies reach some threshold of usefulness where adopting them makes economic sense. When they hit that threshold, their local contribution to productivity growth becomes very rapid, but also finishes fairly quickly. Fiszbein et al. (2024) shows this for electrification, Bartel (2005) shows it for IT-enabled machines. Each new invention creates a whole bunch of little local Singularities. It’s only when you add all these up across the economy that you get something that looks like a big smooth wave of growth."}, {"type": "text", "content": "A suddenly superintelligent AI isn’t really limited by locality — it could, essentially by definition, take over all or most human tasks if it wanted to. Whereas if an intelligence explosion doesn’t occur, these takeovers are likely to be staggered and irregular. But they will still happen, and the economic effect after the first few years probably won’t be that different.\n\nIn other words, I think:\n\nThe AI we’ll get from our current trend of improvement will look about as godlike — and as economically important — as an AI that suddenly bootstraps itself to godhood.\n\nIt’s not possible to stop AI improvement completely, and so if an intelligence explosion is possible, it’s going to happen to us soon."}, {"type": "text", "content": "Slowing down the rate of AI progress will not help us deal with post-Singularity superintelligence.\n\nThis is why I think this whole debate is misplaced. We need to be thinking about how to deal with the AI we already have, and the one we’ll almost certainly get soon — an AI that’s smarter than all humans at most economically important tasks. We need to think about how to regulate that actually existing superintelligence, how to prevent AI-enabled bioterror, how to make sure the economic benefits of AI are widely shared, and so on. We need to think about competition policy, to make sure the benefits of AI don’t exclusively go to one company.\n\nI think we need to accept that nobody is “pacing the frontier” enough to prevent the emergence of superintelligence — and that nobody is likely to do so. If the machine god awakes, then it awakes, and we’ll simply deal with it. In the meantime, we need to focus on dealing with the AI we have now."}, {"type": "text", "content": "Subscribe now\n\nShare\n\nThe other contender would be Lois McMaster Bujold, who writes a very different kind of sci-fi.\n\nThis estimation is done with only 16 data points, so I don’t really trust it. But we’re basically flying blind here, so this is the best we’ve got.\n\nIn fact, I invested in a company called Goodfire that’s at the forefront of AI alignment research."}], "text_post": false}, {"id": "f20520a7d6d6037f", "title": "How SNAP Theft Happens — and What to Do if It Happens to You", "url": "https://www.propublica.org/article/snap-theft-explained-stolen-benefits", "source": "ProPublica", "tag": "news", "published_at": "2026-11-20T10:00:00+00:00", "panels": [{"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/CROP_MContreras_maxHeight_3000_maxWidth_3000-copy_maxHeight_3000_maxWidth_3000.jpg?w=1149", "alt": "An illustration of a hand taking a milk carton out of a green grocery bag labeled “SNAP.”"}, {"type": "text", "content": "When Kelly Joly swiped her electronic benefits transfer card at a Kroger in Beaumont, Texas, this August, she was trying to buy groceries for herself and her teenage son. Joly had worked for decades as a waitress. The day before her grocery run, she’d received her monthly $530 in Supplemental Nutrition Assistance Program, or food stamp, benefits, she said. But now, her EBT card was being declined. She tried swiping again and began to cry. The cashier told her that this had been happening a lot recently and suggested she report the issue. Joly stepped to the side and called Texas Health and Human Services as her food sat bagged up on the belt.\n\nThe representative at the agency that oversees SNAP in Texas told her there was nothing they could do to replace the funds, Joly recalled. Her benefits were gone, likely stolen by fraudsters. Joly said her account showed transactions from the day before at stores in Illinois, Minnesota and California."}, {"type": "text", "content": "“I don’t understand why they wouldn’t replace [our food assistance] if they can see that it was fraud,” she said. “And on top of that, how am I going to feed me and my son this month?”"}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/10/SNAP-Theft-Collage.jpg?w=459&h=306&crop=1", "alt": ""}, {"type": "text", "content": "If you receive SNAP benefits, Joly’s experience may sound all too familiar. Last year alone, more than $470 million was stolen from SNAP recipients by card scammers, affecting about 990,000 households.\n\nProPublica recently published an investigation into why Congress and the Trump administration have failed to crack down on SNAP theft despite promises to tackle fraud and waste in safety-net programs. As part of this reporting, we gathered detailed accounts from more than 50 people across 18 states who’ve had their benefits stolen in the past five years and reviewed dozens more messages, comments and social media posts from people who said they were targeted.\n\nMany of the victims we heard from had similar questions: How did this happen? How can I prevent it from happening again? Why am I not being reimbursed? And why does it seem like little is being done to prevent these crimes in the first place?"}, {"type": "text", "content": "We spoke with dozens of federal prosecutors, Secret Service agents, U.S. Department of Agriculture officials, caseworkers, food security advocates and other experts to help answer these questions for you.\n\nMuch of this crime is the work of low-level street operatives for transnational criminal organizations who install “skimming” devices on card readers at local grocery stores and bodegas. When you swipe your card, these devices capture your data off the magnetic strip on the back, as well as your PIN. That data is either picked up later or transmitted via Bluetooth to thieves waiting nearby.\n\nSkimming is largely preventable via microchips and tap-to-pay technology, which have been greatly successful in reducing fraud in credit and debit card transactions for over a decade. But efforts to install these chips in EBT cards have moved much more slowly."}, {"type": "text", "content": "In recent years, criminals have also used random number generators, phishing calls and spam texts to steal people’s card information, and they will call state hotlines to try to check your SNAP balance and deposit date. In other instances, corner store owners themselves are in cahoots with these scammers, ringing up fake grocery purchases in exchange for cash. And in at least one prominent case , a federal SNAP employee gave sensitive data to criminals for them to be able to steal benefits.\n\nUnfortunately, due to the government’s inaction, the burden of protecting benefits from being stolen has largely been left up to you, the individual SNAP recipient. And the options are less than ideal.\n\nPhone apps, like ebtEdge or Propel , allow you to keep careful track of your card balance, monitor your transaction history for any suspicious purchases and lock your card when it isn’t in use. These apps may also allow you to change your PIN and block out-of-state or online transactions."}, {"type": "text", "content": "But these aren’t always practical solutions, many victims told us. Remembering new PINs all the time, for example, isn’t easy, especially for older beneficiaries.\n\nCynthia Clark, a 63-year-old retired special education teacher in Jackson, Tennessee, said she has several health conditions that affect the dexterity of her hands, her vision and at times her speech. After her SNAP benefits were stolen in May, she was advised to lock her card every time she wasn’t using it. But she said her disabilities make using a cellphone incredibly difficult. On more than one occasion, she has locked herself out of her SNAP account trying to access her benefits.\n\n“I was simply unable to do whatever the steps were, no matter how hard I tried,” she said."}, {"type": "text", "content": "Besides card locking and changing PINs, the Secret Service has suggested that people may be able to spot evidence of tampering with card readers at grocery stores. For example, if you look closely at the reader and see a noticeable gap between the keypad and the rest of the device, or if you see that something is blocking the light from under the keys, there may be a skimming device there."}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/EBT-SS-137_maxHeight_3000_maxWidth_3000.jpg?w=752", "alt": "A person with blue gloves handles the exterior part of a skimming device that was placed on an electronic card reader at a convenience store."}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/EBT-SS-142_maxHeight_3000_maxWidth_3000.jpg?w=752", "alt": "A person with blue gloves handles the inside of a skimming device that was placed on an electronic card reader at a convenience store."}, {"type": "text", "content": "If you’ve had your SNAP benefits stolen, you can report the theft to your state or local social services office — the agency where you applied for SNAP — or to the EBT card customer service line on the back of your card to receive a new card and change your PIN so thieves can’t continue to access your benefits.\n\nYou can also report the crime to local law enforcement and to the agency within your state in charge of investigating SNAP fraud — for example, in Texas, SNAP theft victims are advised to report it to the Texas Health and Human Services Office of Inspector General. ( This map shows where to report SNAP fraud for each state).\n\nA representative for Texas Health and Human Services said, “HHSC takes the security of our client’s benefits very seriously. SNAP card skimming has been a persistent problem across the country, including Texas.”"}, {"type": "text", "content": "While there have been some large-scale investigations into SNAP theft, individual reports don’t often lead to an arrest. More than 40 of the victims we heard from said that they had reported their stolen benefits to a SNAP office, the EBT card customer service line, the police or all of the above. A handful also called the stores where they’d noticed unrecognized transactions on their card history, and two said they contacted the FBI. Most were told nothing could be done.\n\n“I was told that I will receive another card in the mail and that I will not get the money back,” one person wrote us. “They took my statement but said they couldn’t help,” wrote another. “No one ever followed up,” said a third."}, {"type": "text", "content": "The main benefit of reporting these thefts is that doing so keeps the issue on the radar of SNAP officials. Many program administrators and caseworkers told us that they feel the urgency of this crisis precisely because so many people have been calling in about it."}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/EBT-SS-130_maxHeight_3000_maxWidth_3000.jpg?w=1149", "alt": "A close-up photo of a woman holding an informational flyer from the U.S. Secret Service. The flyer shows photos of skimming devices on card machines and text."}, {"type": "text", "content": "In all but two states (California and Maryland), your benefits will not be reimbursed. The federal government had been reinstating stolen SNAP funds in all 50 states starting in late 2022. However, at the end of 2024, an effort to extend that reimbursement system was quashed after Elon Musk posted more than a hundred social media messages opposing legislation that included it , as the Department of Government Efficiency era began. (Musk did not reply to a previous request for comment.)\n\nDemocrats in Congress have proposed legislation to restart the reimbursement program. Following the recent midterm elections, they will take power in January.\n\nAs ProPublica has reported, the Secret Service devotes a lot of investigative resources to this issue, with teams going store to store around the country to manually check card readers for skimming devices. But that’s not a very efficient approach — it’s a little like playing whack-a-mole, multiple Secret Service agents told us."}, {"type": "text", "content": "Local cops and state prosecutors, meanwhile, are often overmatched, having neither the jurisdiction nor the technical chops to catch scammers who are constantly crossing county, state and international lines. And the feds, who do have the capacity to bring interstate conspiracy charges, haven’t always shown an interest in doing so, given that these are considered relatively low-level cases compared with the other types of crime that federal prosecutors work on.\n\nAs for caseworkers, most can’t offer concrete help. Several said that all they can do is provide a list of local food banks."}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/10/SNAP-Theft-impact-R-Dompor_maxHeight_3000_maxWidth_3000.jpg?w=752", "alt": "A chip on a debit card."}, {"type": "text", "content": "If your benefits were stolen, there’s a good chance they were skimmed. And the best solution to skimming appears to be tap-to-pay EBT cards with microchips.\n\nIn California, where chip cards were implemented independent of federal efforts, reported theft of SNAP and other benefits decreased by more than 80% within two years.\n\nFollowing ProPublica’s reporting in October, the federal Department of Agriculture, which oversees SNAP, announced plans to require all 50 states to adopt more secure card technology. But overhauling the SNAP payment system could take years, as well as additional funding from Congress.\n\nThe chip card transition comes at a time when social benefits are being drastically cut and more of the financial weight of SNAP is being shifted to the states . Issuing these new cards is likely to cost states millions, involving complicated negotiations with EBT card companies like FIS and Conduent, which are essentially the Visa and Mastercard of SNAP. Grocery stores, bodegas and any places that accept EBT will also need to update their card reader systems. It will be mostly up to states to notify local stores about this and help them with it, which some, like California, Alabama and Oklahoma, have already tried to do."}, {"type": "text", "content": "While ProPublica is no longer gathering information about people’s experiences with SNAP theft, we are still interested in learning more about America’s changing safety net.   If you work to administer SNAP or Medicaid, we want to know how the so-called One Big Beautiful Bill is shaping your work and what you are seeing and hearing from the communities you serve.\n\nThe post How SNAP Theft Happens — and What to Do if It Happens to You appeared first on ProPublica ."}], "text_post": false}, {"id": "56a65870b68c39d6", "title": "A hustler’s odyssey through America’s wars in the Middle East", "url": "https://www.economist.com/1843/2026/11/20/a-hustlers-odyssey-through-americas-wars-in-the-middle-east", "source": "The Economist", "tag": "news", "published_at": "2026-11-20T09:21:09+00:00", "panels": [{"type": "snippet", "content": "He made a packet in Afghanistan. Now he’s marooned in Qatar", "read_more_url": "https://www.economist.com/1843/2026/11/20/a-hustlers-odyssey-through-americas-wars-in-the-middle-east", "read_more_source": "The Economist"}], "text_post": false}, {"id": "bc459f2a154b28dc", "title": "Anthropic soars, but it may soon be back, cap in hand", "url": "https://www.economist.com/business/2026/11/19/anthropic-soars-but-it-may-soon-be-back-cap-in-hand", "source": "The Economist", "tag": "news", "published_at": "2026-11-19T23:15:40+00:00", "panels": [{"type": "snippet", "content": "The biggest IPO of all time is just a start", "read_more_url": "https://www.economist.com/business/2026/11/19/anthropic-soars-but-it-may-soon-be-back-cap-in-hand", "read_more_source": "The Economist"}], "text_post": false}, {"id": "3c8c2287514eaf2c", "title": "The tech fragility is here.", "url": "https://www.readtangle.com/otherposts/the-tech-fragility-is-here/", "source": "Tangle", "tag": "news", "published_at": "2026-11-19T20:54:17+00:00", "panels": [{"type": "image", "src": "https://storage.ghost.io/c/4a/93/4a939b47-6a19-4b38-a13c-89d5a0f0d6dd/content/images/2026/11/National_Security_Agency_headquarters-_Fort_Meade-_Maryland-1.jpg", "alt": "The tech fragility is here."}, {"type": "text", "content": "Back in April, Anthropic announced a new AI model called “Mythos” and said it was too dangerous to be released to the public.\n\nThe company’s general message was: We built a product that’s so good at finding security vulnerabilities that we can’t release it publicly right now. Instead, we’ll launch a project (named Glasswing) to give American businesses a head start to shore up their security vulnerabilities before the public gets access to these tools. Anthropic said it expected other models to catch up in the coming months, at which point we’d see a slew of new tech vulnerabilities and cyber intrusions pop up across the world.\n\nI saw this story through a simple lens : Anthropic was like a company selling a security system while telling you it had just identified all these fresh ways a burglar could break into your home. It was fear-mongering. Before, I’d been skeptical of these companies’ claims about their products; now, I was outright scornful. It felt like a marketing ploy from a bunch of people who were getting very good at talking about how powerful and advanced their product was."}, {"type": "text", "content": "I also wrote this:\n\nWell, it’s now been a few months. I pride myself on being an open-minded person willing to admit when I’m wrong and change my mind when presented with new evidence. Today, I have to admit: The threat is beginning to look very, very real. So it’s time for me to eat some crow and update my assessment.\n\nBased on our knowledge right now, the wave of outages, tech issues, and general all-encompassing tech fragility across various sectors is not the result of rogue AI bots. It isn’t cybercriminals, and it’s not Iran or China, either. It appears to be exactly what Anthropic said would happen. A bunch of large corporations, institutions, and tech companies are using rapidly developing AI tools to identify their own security issues. Then they are trying to update, patch, and fix those issues. And in many cases, they are breaking things along the way."}, {"type": "text", "content": "That’s really it. That’s the story: AI-assisted corporations and institutions are in a race against AI-assisted threats, and everyone is moving so fast that our already fragile systems are beginning to crack.\n\nIt isn’t your imagination that this is happening more frequently, either. Yes, part of it is that we are just noticing these failures — and this tech fragility — more. But we are also actually experiencing a higher frequency of outages. Rohit Krishnan, a Wharton fellow and author of Building God: Demystifying AI for Decision Makers , put together a helpful chart mapping rates of tech outages from the last 10 years. It shows we are not at all-time highs, but we are in a period of much higher system failures than normal. According to Krishnan, we haven’t seen this volume of disruptions across sectors since 2013 ."}, {"type": "text", "content": "All of this has me seriously reconsidering my rather blasé attitude about the rapid development of AI. Among other things, in recent writings, I’ve said that on a scale of 1 to 10, with 1 being the very early stages of AI capabilities and 10 being AI as a fully realized technology, I think we are closer to a 7 than a 3. In other words, these models weren’t going to get much better than they are now.\n\nThat thesis is looking less likely every day. The models and products are continuing to improve rapidly, and we are not getting many signals that they are slowing down. Mythos was just one marker on the highway, but Anthropic's warnings about what models like it would do appear to be accurate.\n\nI’ve also been skeptical about how dangerous it would be to allow these products to hit the open market. But a collection of events has changed my opinion there, too: I’ve had several conversations with friends, readers, and experts in the space who convinced me I should be more worried than I am. I listened to Bill Gates’s recent interview with Ezra Klein, which genuinely scared me, not least because Gates himself seemed so thoroughly afraid. The Google Threat Intelligence Group then warned this week that the “era of autonomous attacks has arrived,” and we are now up against a “hacker that doesn’t eat, sleep, or get tired, and never stops searching for a way in.” And through all of this, I’ve been watching news story after news story about all the ways major industries seem unprepared for this moment."}, {"type": "text", "content": "Think about it this way: The FAA called a national ground stop, the NSA had an internal communication system crash, and online banking service issues popped up all in just the last week. Each was (purportedly) caused by attempts to update or patch vulnerable systems. Which has me thinking: If the people trying to be helpful can so easily break the things they are working to improve, what does that say about the odds that actual AI-assisted cyber criminals (or, God forbid, rogue AI agents) will have much trouble bringing all these institutions to their knees?\n\nGiven all this, I feel much less confident about our potential to prevent a banking collapse, rogue AI from escaping containment, or government systems from being compromised. All of a sudden, a multi-week grid collapse or the potential for the U.S. military to be kneecapped in a “cyber incident” doesn’t seem so far-fetched. It’s honestly starting to feel a little Pollyannaish to think it won’t happen."}, {"type": "text", "content": "There’s no “but” here. I’m frustrated and a little uneasy to say that I don’t have an optimistic landing. I take solace in people like John Hultquist, the chief analyst at Google Threat Intelligence Group, who said this week, “Things are going to go offline periodically as the world manages a generation of tech debt. It will be a nuisance, but it will be okay.” I hope it’s as simple as that, but I can’t say I share his optimism anymore.\n\nThe people leading the AI revolution seem hellbent on pushing forward no matter the cost, despite their constant warnings that they might wipe out all of humanity. The government leaders responsible for regulating away the dangers of these kinds of technologies are busy obsessing over what we call them, or are totally in cahoots with the AI leaders themselves, or are so technically illiterate that any attempt to be helpful is nearly useless. And the rest of us common folk are just along for the ride."}, {"type": "text", "content": "So here’s to hoping the techies, nerds, and their billionaire bosses know what they’re doing. Because it’s starting to feel like the game is afoot. And I can’t say I’m keen to find out who wins.\n\nStaff dissent — Senior Editor Will Kaback: Assuming that most of the recent disruptions are a byproduct of companies and government agencies trying to patch vulnerabilities identified by new AI models, I have a different reaction than Isaac.\n\nHe writes, “If the people trying to be helpful can so easily break the things they are working to improve, what does that say about the odds that actual AI-assisted cyber criminals (or, God forbid, rogue AI agents) will have much trouble bringing all these institutions to their knees?” I would be far more alarmed if this work wasn’t being done — that is, it’s relatively reassuring that new vulnerabilities are being found and urgent work is being done to address them. That things are breaking along the way isn’t ideal, obviously, but I think it’s a reasonable price to pay to improve critical systems. I don’t see it as evidence that we’re on the precipice of mass cyberattacks."}, {"type": "text", "content": "I appreciate Isaac’s message about keeping an open mind on new developments, and I want to do the same. If the disruptions and outages become more significant — a major bank going down for multiple days, issues with the electrical grid, another ground stop that persists for more than a few hours — I’ll start to see the trade-offs differently. Just today, the European Commission said it was targeted by an “AI-generated cybercampaign,” and that’s cause for real concern. Similarly, if AI-enabled cyberattacks become more frequent and impactful despite the work being done to prevent them, I think it will mean Isaac’s theory is, distressingly, coming true.\n\nFor now, though, I’m viewing the underlying work behind the recent system outages more optimistically."}, {"type": "text", "content": "Get perspectives from across the political spectrum on today's most important issues, delivered directly to your inbox.\n\nNo spam. Unsubscribe anytime."}], "text_post": false}, {"id": "5348bdacf71de05b", "title": "How to Test Whether Art Deepens Understanding | Christopher Brewer", "url": "https://www.youtube.com/watch?v=35He6h_2lsM", "source": "Closer to Truth", "tag": "philosophy", "published_at": "2026-11-19T19:30:02+00:00", "panels": [{"type": "snippet", "content": "*Can reading a novel make someone more compassionate, or does it only change how they feel?*\n\nChristopher Brewer explores how researchers could investigate the relationship between art and understanding through carefully designed experiments. From the illustrations surrounding ancient manuscripts to the language people use to describe awe and the sublime, he explains why defining experiences precisely is essential before their effects can be tested.\n\n0:00 Developing Research Methods for Aesthetic Cognitivism\n1:35 Testing How Manuscript Art Influences Understanding\n3:05 Defining and Measuring A", "read_more_url": "https://www.youtube.com/watch?v=35He6h_2lsM", "read_more_source": "Closer to Truth"}], "text_post": false}, {"id": "14843c85ed57a3e6", "title": "Anthropic Pops", "url": "https://www.bloomberg.com/opinion/newsletters/2026-11-19/anthropic-pops", "source": "Money Stuff", "tag": "financial", "published_at": "2026-11-19T19:09:42+00:00", "panels": [{"type": "snippet", "content": "Also prepaid energy bonds, Ant wealth and Situational Awareness 2.0.", "read_more_url": "https://www.bloomberg.com/opinion/newsletters/2026-11-19/anthropic-pops", "read_more_source": "Money Stuff"}], "text_post": false}, {"id": "55109370f9f65456", "title": "One Prior, Two Dynamics: Repurposing Video Diffusion Transformers for Self-Supervised Latent Action Learning", "url": "https://arxiv.org/abs/2611.26617v1", "source": "arXiv", "tag": "engineering", "published_at": "2026-11-19T18:58:14+00:00", "panels": [{"type": "snippet", "content": "Videos reveal how the world changes, but rarely the actions that cause those changes. Latent action learning recovers such supervision from visual transitions, yet often learns the underlying dynamics largely from scratch. We ask whether a pretrained video generator can instead provide the prior for both inverse and forward dynamics. We introduce O$^{2}$LaF, built on a simple principle: one prior, two dynamics. We initialize both models from the same pretrained video DiT and adapt them to their distinct roles: a feed-forward transition encoder with learnable action queries for inverse dynamics", "read_more_url": "https://arxiv.org/abs/2611.26617v1", "read_more_source": "arXiv"}], "text_post": false}, {"id": "400d931ab84af6d8", "title": "AgentRoboCritic: Understanding the Capability of Frontier Agents on Direct Robot Control", "url": "https://arxiv.org/abs/2611.26613v1", "source": "arXiv", "tag": "engineering", "published_at": "2026-11-19T18:57:25+00:00", "panels": [{"type": "snippet", "content": "Frontier multimodal language agents such as GPT-6 Astra have demonstrated strong capabilities in controlling robots directly via low-level numerical actions without high-level primitives. However, existing benchmarks report only episode-level success rates, which show neither how these agents succeed nor where they fail. In this paper, we present a systematic action-level analysis of frontier agents on direct robot control across 12 manipulation benchmarks. We introduce AgentRoboCritic, an intent-grounded critique framework in which the policy agent states a local intent alongside each action,", "read_more_url": "https://arxiv.org/abs/2611.26613v1", "read_more_source": "arXiv"}], "text_post": false}, {"id": "e99602e5bf8b70ae", "title": "A Tutorial on Complementarity-Based Contact Models for Robotics", "url": "https://arxiv.org/abs/2611.26600v1", "source": "arXiv", "tag": "engineering", "published_at": "2026-11-19T18:54:07+00:00", "panels": [{"type": "snippet", "content": "Simulating rigid-body dynamics with contact is fundamental to robotics, from motion synthesis and control to mechanism design. Many widely used simulators rely on cone complementarity formulations, whose physical assumptions and numerical solution require substantial background. While excellent surveys, monographs, and course notes exist, they mostly address computational mechanics or computer graphics or document a single simulator. To the best of our knowledge, a self-contained pedagogical treatment for robotics, bringing these formulations and their solvers together with complete derivation", "read_more_url": "https://arxiv.org/abs/2611.26600v1", "read_more_source": "arXiv"}], "text_post": false}, {"id": "f5fdab8ce3f12d08", "title": "Making easy ontology harder", "url": "https://alexanderpruss.blogspot.com/2026/11/making-easy-ontology-harder.html", "source": "Alexander Pruss's Blog", "tag": "philosophy", "published_at": "2026-11-19T18:05:47+00:00", "panels": [{"type": "snippet", "content": "On Thomasson’s “easy\nontology” , existence is easy. There is a K as long as the “application\nconditions” for the phrase in our language “There is a K ” are satisfied. And these\napplication conditions don’t need to mention the existence of a K . It follows from this that\nontology is very rich. If we can create application conditions for\n“There is a K ”, then there\nwill be entities of a sort that exist when and only when the actual\napplication conditions for “There is a K ” are met. Moreover, such existence\nfor Thomasson is mind-independent. These entities would exist even if we\nnever talked abo", "read_more_url": "https://alexanderpruss.blogspot.com/2026/11/making-easy-ontology-harder.html", "read_more_source": "Alexander Pruss's Blog"}], "text_post": false}, {"id": "d05bd9d51e878f4b", "title": "Dimensions and substantial change", "url": "https://alexanderpruss.blogspot.com/2026/11/dimensions-and-substantial-change.html", "source": "Alexander Pruss's Blog", "tag": "philosophy", "published_at": "2026-11-19T17:03:57+00:00", "panels": [{"type": "snippet", "content": "According to Aquinas, in substantial change, the matter persists.\nThis is philosophically troubling, because matter seems to be identified\nby form, and in substantial change, the substantial form is replaced by\na new one. On Brower ‘s plausible\nreading, Aquinas’ solution is that the chunk of matter counts as a chunk\nin virtue of its dimensions , so a chunk of matter can be\nidentified by its dimensions across a substantial change. This solution is problematic. Suppose you have a flower and you put\nit under a press, roots and all. You slowly and continuously turn the\ncrank, and the flower is squ", "read_more_url": "https://alexanderpruss.blogspot.com/2026/11/dimensions-and-substantial-change.html", "read_more_source": "Alexander Pruss's Blog"}], "text_post": false}, {"id": "8a74e57f08a20c01", "title": "Why Good Karma Cannot End Suffering | Swami Sarvapriyananda", "url": "https://www.youtube.com/watch?v=F9b-FsYq_zU", "source": "Closer to Truth", "tag": "philosophy", "published_at": "2026-11-19T17:00:13+00:00", "panels": [{"type": "snippet", "content": "*How could the Buddha go beyond suffering if he still experienced old age, disease, and death?*\n\nSwami Sarvapriyananda explains why Eastern spiritual traditions distinguish the unavoidable conditions of life from the ignorance they identify as the root of suffering. He explores how karma, ethical conduct, and self-control prepare the mind for liberation, even when the external circumstances of life remain unchanged.\n\n0:00 Suffering and the Transient Nature of Life\n1:48 Karma and the Limits of Worldly Happiness\n2:34 Ignorance as the Root of Suffering\n3:31 Ethical Practices and Good Karma\n5:38 B", "read_more_url": "https://www.youtube.com/watch?v=F9b-FsYq_zU", "read_more_source": "Closer to Truth"}], "text_post": false}, {"id": "118525a93fdce3d2", "title": "The tech outages.", "url": "https://www.readtangle.com/tech-outages-ai-disruptions/", "source": "Tangle", "tag": "news", "published_at": "2026-11-19T16:54:54+00:00", "panels": [{"type": "image", "src": "https://storage.ghost.io/c/4a/93/4a939b47-6a19-4b38-a13c-89d5a0f0d6dd/content/images/2026/11/National_Security_Agency_headquarters-_Fort_Meade-_Maryland.jpg", "alt": "The tech outages."}, {"type": "text", "content": "Testing. Testing. Testing. Is this thing on? Is anyone reading this? Is the grid still up? I’m Isaac Saul, writing today from my bunker — er, studio — in New Jersey. Today I’m breaking down the latest slate of tech outages and AI warnings from across the country, eating some crow about something I got very wrong, and updating my assessment of how worried we should be. Plus, the stories we decided not to cover this week and a viral book series taking over the Cleveland Browns locker room.\n\nIt’s a 12-minute read . Time to batten down the hatches.\n\nWill Kaback, Audrey Moorehead, Carina Pacheco, Russell Nystrom, Isaac Wood, and Bailey Saul edited or contributed to today’s newsletter.\n\nSupport independent journalism and save some cash this year with 40% off an all-access membership. It includes access to every newsletter and pod
