 "A Houthi missile hit Saudi state oil company Aramco’s skyscraper in Riyadh. [ X ]"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!rSX_!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F5b751a4d-0f45-42ce-aac9-f7c69b262504_1176x1284.png", "alt": ""}, {"type": "text", "content": "A new Nicholas Bagley paper on the cost of federal permitting, arguing that the real costs of things like NEPA is the huge amount of effort agencies put in to try and make things “litigation proof”. “ The evidence does suggest, however, that the bulk of the costs of the federal permitting regime stem from the defensive measures agencies and developers take to guard against the risk  of a bad outcome in court. That insight allows for a rough evaluation of the likely effects of popular permitting reform ideas. Some—including popular ones like time limits and statutes of limitations—are unlikely to accomplish much. Only those reforms that change the incentives created by the risk of judicial review will meaningfully move the needle. ” [ Nicholas Bagley ]"}, {"type": "text", "content": "A progress report from the Center for Land Economics, which advocates for land value taxes to make more efficient use of urban land. ” Three states passed laws enabling land value taxes in some form: Kentucky, Virginia and New York. In each of them we’re now helping cities work out how to put them into practice. Five more states and DC considered similar bills. This is the most legislative momentum the movement has seen in decades… ” [ Land Economics ]\n\nRead more"}], "text_post": false}, {"id": "17e9fc537e0ce9be", "title": "A Banker’s Guide to Anthropic", "url": "https://www.netinterest.co/p/a-bankers-guide-to-anthropic", "source": "Net Interest", "tag": "financial", "published_at": "2026-11-13T18:00:43+00:00", "panels": [{"type": "text", "content": "Reminder: I’m on stage at the TomorrowX Summit in Austin next week, and then at Fintech Nerdcon in San Diego. I’ll then be in New York. If you want to catch up, please get in touch.\n\nWhen Anthropic lists on the stock market next week, the money it raises will be just the start. Through its IPO, Anthropic plans to raise as much as $100 billion. Leveraged up, though, that can go much further.\n\nSo far, Anthropic has refrained from tapping the corporate bond market. As a young start-up burning billions of dollars a year on an untested business model, it would hardly have had a look-in. Instead, it has relied on equity investors and on suppliers, who together have put in more than $140 billion.\n\nBut with a Nasdaq listing and a cash pile of $212 billion, its charms are harder to resist. In the run-up, it already secured a $15 billion revolving credit facility from banks managing its IPO. The bigger prize is the bond market. Shortly after its own IPO in June, SpaceX raised $25 billion of senior unsecured bonds. Anthropic’s bankers would like to follow."}, {"type": "text", "content": "To do that on good terms, it needs a credit rating, specifically an investment-grade one. Its bankers, Morgan Stanley and Goldman Sachs, have been lobbying Moody’s and S&P to grant one as soon as it lists. A rating of BBB– or higher would open Anthropic up to the $13 trillion global investment-grade market, and the insurers and pension funds that dominate it.\n\nSuppliers have a vested interest, too. When we discussed it in The Art of Doing Financial Engineering , Broadcom had agreed to stand behind $30 billion of debt raised to buy hardware leased to Anthropic. Last month, a second deal took its commitments to more than $70 billion. Broadcom would like to share the load. “It’s an open secret, Anthropic is well on its way to an IPO, and with that, its investment credit will change,” chief executive officer Hock Tan told analysts. An investment-grade rating would let future financings rest on Anthropic’s own credit, rather than its suppliers’."}, {"type": "text", "content": "Even the revolver hinges on it: for now the facility is secured, but the collateral falls away – and the pricing improves – once two of the three major agencies call Anthropic investment grade.\n\nOne agency reckons it’s there. AIR Platforms is an AI-native credit intelligence and risk-scoring startup founded by Moody’s and Goldman Sachs veterans. It rates Anthropic BBB, two notches above OpenAI. Sadly for the company, AIR Platforms is not a “nationally recognized statistical rating organization” so it doesn’t count. Kroll Bond Rating Agency, which is, rates Anthropic BB+. Blackstone, which marketed the latest Broadcom-backed deal, thinks a rating in the BB range is more likely once the IPO is done."}, {"type": "text", "content": "Key to the outcome is Anthropic’s cash flow profile. A $1.4 trillion market cap would be nice, and would give comfort to lenders, but it can’t be used to repay debt: you need free cash flow for that. To see how Anthropic plans to pay for close to $1 trillion of commitments, and who is lending it the money, read on.\n\nRead more"}], "text_post": false}, {"id": "0d4614944ee44a54", "title": "Rocket Report: Starship set for historic test flight; a century of Electron", "url": "https://arstechnica.com/space/2026/11/rocket-report-starship-set-for-historic-test-flight-a-century-of-electron/", "source": "Ars Technica — Rocket Report", "tag": "engineering", "published_at": "2026-11-13T12:00:40+00:00", "panels": [{"type": "text", "content": "Welcome to Edition 9.19 of the Rocket Report! Will something historic happen this weekend? No orbital rocket has ever been fully recovered with the intent of reusing all of its components. But that's just what SpaceX is going to try to do with a Starship launch on Friday, and an upper stage landing attempt 22.5 hours later on Saturday afternoon, local time. Ars will be on hand in Starbase, Texas, to provide coverage of it all.\n\nAs always, we welcome reader submissions , and if you don't want to miss an issue, please subscribe using the box below (the form will not appear on AMP-enabled versions of the site). Each report will include information on small-, medium-, and heavy-lift rockets as well as a quick look ahead at the next three launches on the calendar."}, {"type": "image", "src": "https://cdn.arstechnica.net/wp-content/uploads/2018/05/smalll.png", "alt": ""}, {"type": "text", "content": "Electron set for milestone launch . The next launch of Rocket Lab’s Electron vehicle is due to lift off from the Mahia Peninsula in New Zealand on November 14 at 5:30 UTC. This mission will serve as Electron’s 100th overall mission—a notable milestone for the small rocket that first flew in 2017, NASASpaceflight.com reports .\n\nRead full article\n\nComments"}], "text_post": false}, {"id": "93e9c6194ae7a42c", "title": "Technology as a Search Problem", "url": "https://www.construction-physics.com/p/technology-as-a-search-problem", "source": "Construction Physics", "tag": "engineering", "published_at": "2026-11-12T13:01:45+00:00", "panels": [{"type": "text", "content": "One of my ongoing research interests is understanding the nature of technological progress: How does new technology come into the world and improve over time? What sort of factors affect it? How, in general, should we think about it? I’ve come at this question from a few different angles: posts looking at the operations and legacy of Bell Labs, posts looking at how specific technologies improved over time, posts looking at how frequent multiple invention is and how long we wait for new inventions , and so on.\n\nMy current line of thinking is that creating some new technology is best thought of as a search process . A given technology can be thought of as a point in some high-dimensional “design space” or “technology space,” which contains every possible technology: every conceivable arrangement of parts, materials, natural phenomena, and so on. The job of the would-be inventor is to navigate this space, sifting through the arrangements of elements that don’t work to find the ones that will."}, {"type": "text", "content": "This search process is made difficult by the fact that, as with any situation where you’re enumerating the possible combinations of a large number of elements, technology space is incomprehensibly vast. In “ Are Technologies Inevitable? ” economist Matt Clancy notes that Wikipedia listed 272 “named equations” that describe various regularities in the world, ranging from the Navier-Stokes equations (which describe the motion of fluids) to the Arrhenius equation (which describes chemical reaction rates as a function of temperature) to the Exner equation (which describes how sediment gets deposited in a river). If we use this as a (very rough) estimate as to the number of different phenomena that a technology can leverage, it implies an enormous number of possible technologies that could be created. As Clancy writes:"}, {"type": "text", "content": "If we’ve got 272 regularities to work with, for example, then the number of possible combinations of these regularities is two, raised to the power of 272 (since every regularity can be used or not used: two options). But 2^272 is more than some estimates of the number of atoms in the observable universe. And that’s got to be an undercount of the number of possible technologies, since it counts all technologies that use the same principles together as the same thing, even if they orchestrate them in vastly different ways or use them in vastly different magnitudes.\n\nBy comparison, the most common estimate for the number of atoms in the universe is around 10^80, or ~2^265. And it’s likely there are many, many more regularities that some technology could harness than 272. (Some in-progress work on this that I haven’t yet completed suggests that there are at least thousands.)"}, {"type": "text", "content": "And as Clancy notes, this outrageously huge number dramatically undercounts the number of possible technologies, because it doesn’t take into account that the same phenomena can be used in lots of different ways. In Brian Arthur and Wolfgang Polak’s paper “The Evolution of Technology within a Simple Computer Model” (which we looked at earlier this year ), Arthur and Polak note that even within the universe of logic circuits made up of three basic elements (the NAND gate and the values of 1 and 0), the number of different circuits you can make for even a small number of inputs and outputs is staggeringly large:\n\nThe emergence of circuits such as 8-bit adders seems not difficult. But consider the combinatorics. If a component has n inputs and m outputs there are (2^m)^(2^n) possible phenotypes, each of which could be realized in a practical way by a large number of different circuits. For example, an 8-bit adder is one of over 10^177,554 phenotypes with 16 inputs and 9 outputs."}, {"type": "text", "content": "So the search space for some new technology is vast. And the way that we tackle vast search spaces is with information . Each bit of information cuts a search space in half, so even a relatively small amount of information can quickly narrow down what seems like a huge search space. When we create some new technology, what we’re doing is gathering information: figuring out what will work and what won’t work, what’s promising and what isn’t, narrowing down the huge space of technological possibilities and finding something within it that accomplishes some particular goal.\n\nIn the 19th century, for instance, many people were interested in building a mechanical flying machine, but it wasn’t clear the exact arrangement of elements that would yield a successful one. Thanks to knowledge of the laws of physics, and an existence proof of birds, would-be inventors were already working within a considerably narrowed search space: they knew roughly what elements a flying machine would need to have — lifting surfaces, a propulsion system, and a means of control — and had a general idea of how they should be arranged. But there were a huge number of ways that you could build a flying machine from these basic elements, and people spent a great deal of time and effort building different sorts of machines that did not in fact work. The Wright brothers’ eventual success can in large part be attributed to the fact that they were exceptionally talented at gathering information, enabling them to converge on a working airplane design far faster than their competitors."}, {"type": "text", "content": "I previously explored the nature of technological search in that previous piece looking at Arthur and Polak technological evolution paper , which uses a simple simulation to evolve different logic circuits, finding workable technologies amidst an enormous sea of possibilities. I really liked the basic simulation method Arthur used in this paper — randomly generating technologies to see how easy or hard it was to find working ones — and wanted to use simulation myself to further explore the dynamics of technological search. But while Arthur uses digital circuits — different arrangements of logic gates like NAND, OR, AND, etc. that can perform functions like addition — I wanted a more general model that could capture the nature of many different types of technology, while still being simple enough to simulate easily."}, {"type": "text", "content": "The model I came up with is inspired by another of Brian Arthur’s examinations of the nature of technology: his book The Nature of Technology . In this book Arthur describes technology as fundamentally “a set of phenomena captured and put to use.” He writes that:\n\n… a practical technology consists of many phenomena working together. A radio receiver is not just a collection of parts. Nor is it merely a miniature signal processing factory. It is the orchestration of a collection of phenomena — induction, electron attraction and repulsion, electron emission, voltage drop across resistance, frequency resonance — all convened and set up to work in concert for a specific purpose.\n\nEdison’s lightbulb, for instance, took advantage of several different phenomena: Joule heating , the phenomenon that electric current running through a material will raise its temperature. Incandescence , the phenomenon that a hot enough object will emit light. Transparency, the phenomenon that certain materials will allow the passage of light. And so on."}, {"type": "text", "content": "Phenomena like this are typically triggered automatically when the right conditions are created, which you can think about as being when the right objects, with the right properties, are placed in some particular arrangement. In the lightbulb, Joule heating occurs automatically when electric current runs through the filament, and incandescence occurs automatically when the filament gets hot enough. And the bulb had a vacuum atmosphere to prevent another, unwanted phenomenon — carbon reacting with oxygen — automatically occurring and destroying the carbon filament.\n\nThese three elements — Phenomena, Objects, and Properties — are the basic components of the technological model I came up with, which I call PTOP, for Phenomena Triggered by Objects with Properties. In this model you have some collection of objects, which can have some specified set of properties. Whenever the right objects with the right properties are placed in the proper arrangement, a phenomenon will be automatically triggered, which can have various effects: modifying the properties of existing objects, creating new objects, and so on. By chaining the correct objects and phenomena together in the correct order, you can create your desired outcome, which is some particular object or objects with some specific set of desirable properties. A simple, conceptual PTOP model for the lightbulb, for instance, might look like this:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!Z_HI!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F64d670de-009d-434f-babb-96a23526bef8_1241x646.png", "alt": ""}, {"type": "text", "content": "By arranging the right sort of filament, an atmosphere, a bulb container, and electric current, you can trigger a series of phenomena that will ultimately result in the creation of light with desirable properties.\n\nAnd here’s a sketch of a PTOP model for a more complicated technology, a Xerox machine, which uses various phenomena such as “photoconductivity” and “corona discharge” to generate a copy of a document:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!KMH4!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fae5c1f9c-c0b4-43f0-9028-709580cec396_2048x830.png", "alt": ""}, {"type": "text", "content": "I like this model because it captures the basic elements — natural phenomena and the conditions that trigger them — inherent to all types of technology, such that we can study the ‘space’ of possible technologies. And you can implement the basic idea in many different ways, from very simple representations of technology to very complex ones. In some ways this is bad (it took me a super long time, for instance, to come up with a simulable implementation that I was happy with) but it’s useful for studying different aspects of technological search. Let’s look at a few different implementations of a PTOP model and see what we find.\n\nLet’s start with an extremely simple version of PTOP. In this version, we have 10 possible objects, each with two possible properties. The first property, P0, can take on any value from 1 to 10 and is inherent and unique to that object. You can think of this as the model having 10 different chemical elements, each taking on a different value of P0. The second property is size, which can also take on any value from 1 to 10, but is adjustable. So you can have a large object with P0 equal to 1 and size equal to 10, or a small object with P0 equal to 1 and size equal to 1. Overall there are 100 possible sorts of objects: 10 different object types, each of which can be 10 different sizes."}, {"type": "text", "content": "This version of the model has four phenomena in total. Each phenomenon is triggered when the right two objects are connected, and the first of those objects (what we’ll call the input object) has the correct size. When the phenomenon is triggered, it adds a specific property to the second object (what we’ll call the output object). So in the image below, when an object with a P0 value of 1 and size 5 is connected to an object with a P0 value of 2, it triggers a phenomenon, which adds a new property, P1, to the second object."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!9Mdz!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F2635a8f8-127d-472b-840b-8aa1dde43702_784x561.png", "alt": ""}, {"type": "text", "content": "The phenomena in this model are arranged in a hierarchy: triggering each phenomenon requires an object with the property added by the previous phenomenon. So to trigger the phenomenon that adds P2, you need an object with the P1 property. P3, in turn, requires an object with P2, and so on. You can think of this hierarchy of phenomena as representing something like “to trigger incandescence, I need an object with a high temperature. To achieve high temperature, I need to use the phenomenon of Joule heating, which I can trigger with the right sort of electric current. To create electric current, I need …” and so on.\n\nIn this version of the model, the goal is to create an object with the “final” property of P4. You can think of this as representing something like “light with the proper brightness” or “lead shot with the proper size and sphericity.” This can be done by creating the exact right arrangement of objects: five objects arranged in a line, each with the correct P0 property and size."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!eoCV!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff5b0f31d-e577-4360-94b5-e9c587c4c959_1373x552.png", "alt": ""}, {"type": "text", "content": "This is a very simple implementation of PTOP, which we’ll call a “level 1 model.” But it does capture a few things about the technological search process. First, the search space in even this very simple model is very large: 10 object types, 10 sizes, and 5 objects total means (10x10)^5 = 10 billion possible arrangements to produce a P5-level phenomenon. 1 If you increased that to 100 objects, 100 sizes, and 10 different phenomena, you’d have 10^40 possible options. If we added more property types (maybe objects can have the properties of “temperature” and “density” in addition to size) the numbers would quickly become beyond astronomical.\n\nBut this simple version also shows the power that information can bring to bear on a large search space. When we looked at Arthur’s circuit search, we noted that what made the search tractable was modularity — finding a working design for a subcomponent, then locking that modular design into the system and using it as a repeatable ‘primitive’ element for further combinations. By preventing you from having to get every single part of a design correct in one shot, modularity effectively screens off many possibilities and reduces the size of the search space that must be traversed. As we found in that simulation:"}, {"type": "text", "content": "A useful way of thinking about our 68 NAND gate search is that it’s like a huge, branching tree. At every step — every time we add a gate — there are thousands of branches, each one representing one possible way to wire up the gate. Each branch then splits into thousands more (representing all the possible ways of wiring up the next gate), which split into thousands more, which split into thousands more, until at the end we have 2^852 possible “leaves,” each one representing a unique way of wiring up all 68 gates. Trying to get all 68 gates right at once, and then checking to see whether or not you did, is like examining one single leaf, one path from the base of the tree all the way to the tip of a branch. Not only are you overwhelmingly likely to guess wrong, but you haven’t narrowed down your possibilities at all: all you know is that one single leaf wasn’t the right answer, leaving you with the rest of the 2^852 possible leaves to sift through."}, {"type": "text", "content": "Checking to see whether each gate we add is correct before we proceed to the next one, by contrast, massively narrows down the number of possibilities. Whenever we determine a gate isn’t in the right spot, it eliminates every possibility that branches off from that point. If there are 1000 possible ways to wire each gate, each time we guess correctly we’ve narrowed down the possibilities downstream of that choicepoint by 99.9%. Huge swaths of possibilities get eliminated at each correct guess, letting us converge on the correct answer much more quickly.\n\nWe can see these same basic mechanics with the PTOP model. With 10 object types, 10 sizes, 4 phenomena, and 1 billion effective possibilities, it takes (on average) 1 billion attempts to guess the entire correct design in one shot by randomly generating possible technologies."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!QbkI!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8184aab5-fbaa-45bc-aba0-b44e690971d5_935x485.png", "alt": ""}, {"type": "text", "content": "But if we do a modular search — randomly adding just one object while randomly adjusting the size of the previous object until we’ve triggered the next phenomenon, then locking that successful design in and moving on — the search becomes much faster, because we’ve replaced a single billion-possibility space with a series of 100-possibility spaces. It takes on average 1,300 attempts to find the 10 type, 10 size, 4 phenomena answer, and even astronomically enormous technology space search problems become tractable."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!xnD8!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa45da796-d85f-4463-80de-d2e48214cf67_907x551.png", "alt": ""}, {"type": "text", "content": "This version also shows that the degree of modularity makes a huge difference in how easy a technology is to find. The more modules we have whose design we can lock in, the shorter each step is up the ladder to the working technology, and the easier each step is to take. If we take our 10 object type, 10 size model up to 100 phenomena levels, we’re now at an enormous 10^200 search space, but with 100 steps up the ladder that we can lock in, finding it is trivial — a random search finds it after about 10,000 attempts on average. The same-sized search space generated from 10 phenomena levels but 10 billion possible object types and sizes (which only gives us 10 steps up the ladder, rather than 100) becomes utterly impossible to find randomly, even with modular search."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!r2Ru!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6d70da25-d99d-43c8-8daf-f67f5eb29f8a_498x97.png", "alt": ""}, {"type": "text", "content": "This version of the model also lets us see how different sorts of knowledge can make the search process easier. For instance, as Joel Mokyr notes in The Gifts of Athena , scientific knowledge is very useful when trying to create some new technology, because “the range of experimentation possibilities that needs to be searched over is far larger if the searcher knows nothing about the natural principles at work.” In our level 1 PTOP model, scientific knowledge would be something like “phenomenon 3 can’t work with object type 2” or “phenomenon 4 must have its two objects of equal size.”\n\nThe usefulness of this sort of scientific knowledge is a function of how many possibilities it screens off. The more possibilities it screens off, the more bits of information it provides, and the more useful it is. So something like “phenomenon 5 can’t use object 1” or “object 3 can’t touch object 4” provides a relatively small amount of information, because it doesn’t eliminate that many possibilities. Knowledge of the sort “phenomenon 4 MUST use object 1” or “object 3 MUST touch object 4,” by contrast, screens off a lot more possibilities, provides much more information, and narrows the search much more effectively."}, {"type": "text", "content": "One reason that, in the real world, the technological development process is tractable is that a lot of our knowledge is of the latter type. Phenomena typically have specific triggering conditions, which we can observe and discover: Marconi knew what was needed to create electromagnetic waves when he was working on his radio, Edison knew what was needed to create incandescence in a lamp filament, and the scientists on the Manhattan Project knew roughly what conditions were needed to trigger a nuclear chain reaction.\n\nEven this highly simplified version of the PTOP model is useful for exploring various technological search dynamics. But ultimately it’s a little too simple to capture many of the more interesting dynamics of technological search. So let’s add some complexity. First, real phenomena often require multiple “input” objects, rather than just one: triggering the phenomenon of “combustion” in a gasoline engine requires fuel, an oxidizer, and an electric spark. So we’ll make it so that each phenomenon can have multiple input objects instead of just one. Second, there are often multiple different phenomena that you can use to accomplish some particular goal: if you want to make mechanical motion, for instance, there are a variety of different phenomena you can harness to do that, and motors built to harness them — electric motors, hydraulic motors, internal combustion engines — all work in different ways. So let’s also make it so that instead of just one phenomenon for each level, there can be more than one, each one requiring a different set of objects with the right properties to trigger."}, {"type": "text", "content": "With the level 1 PTOP model, there was only a single workable version of the technology. With the level 2 model, there are multiple working designs. And unlike the straight lines of objects of the previous model, this one creates branching, treelike chains."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!mAtB!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F17305566-18a9-4c50-a58a-19a1e9519890_1420x804.png", "alt": ""}, {"type": "text", "content": "With this version of the model (which I’ll call the “level 2 model”), even though there are a large number of possible working designs, the number of nonworking technologies is vastly larger, and finding a workable option by pure blind search quickly becomes unworkable.\n\nWe can solve this with a slightly different flavor of modular search, very similar to the “encapsulation” that Arthur uses in his technological evolution paper. In this version, the model starts out by randomly combining different objects with different properties, connected in different ways. Whenever an arrangement of objects triggers some phenomena, that arrangement gets bundled into a new object, and then that object can be chosen by the simulation to be randomly combined with other objects. As with our previous, simpler modular search, this lets the simulation accumulate partial solutions and quickly find working technologies even amidst very large search spaces."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!3ajc!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ffe6d4114-06ae-4a16-94db-46b04fcca66f_1555x866.png", "alt": ""}, {"type": "text", "content": "A level 2 PTOP model can also be used to show the information-accumulating power of sexual reproduction. In a previous essay , we noted that sexual reproduction is its own sort of modular search — by letting children inherit genes from two parents, sex allows useful genetic “discoveries” made by many different lineages to spread throughout the population. This is in contrast to asexual reproduction, where only one particular lineage ultimately survives, and discoveries made by others die out due to a phenomenon called “clonal interference.” This allows sexually reproducing populations to converge on maximum fitness much more quickly.\n\nWe can see this same thing using the level 2 PTOP model. I ran a version of it with two different technology “populations.” Each population had 1,000 randomly generated technologies in it. In one population, I implemented asexual reproduction — each generation, every technology would get one random mutation to an object (deleting an object, adding an object, or changing an objects properties). The fittest members of the population, measured by the highest phenomena level they had unlocked, survived into the next generation. In the other population, I implemented sexual reproduction — in addition to random mutation, children would be generated by randomly crossing over the branches of two parents. With 5 levels of phenomena, asexual reproduction couldn’t achieve the maximum phenomena level after 2,000 generations in the example below; sexual reproduction, by contrast, found it after just over 100 generations."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!5OBU!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fbb679fb7-85cc-472d-9038-428e47fcdea0_1078x438.png", "alt": ""}, {"type": "text", "content": "This flavor of PTOP is a little richer and can show a broader array of technological search dynamics, but it’s still a little simple, so let’s add some more complexity.\n\nFirst, instead of making triggered properties — P1, P2, P3, etc. — binary (on or off), let’s make them be able to take on multiple values: before the property is switched on, it has a value of 0, while once a phenomenon triggers it, it can have a value from 1 to 10. We’ll make the value that it takes a function of two things: the size of the input object(s) and the value of the predecessor phenomenon. So for a phenomenon that triggers P2, the value of P2 will depend on the value of P1 and the size of its object. You can think of this as representing something like “the temperature in the lightbulb filament depends on the properties of the electric current flowing through it”: more amperage, or higher voltage, means higher filament temperatures. The brightness of the light emitted, in turn, will be a function of the temperature value of the filament."}, {"type": "text", "content": "We’ll make the value of triggered phenomena be determined in one of two ways. Either it’s maximized when the predecessor phenomenon and object size are EQUAL, or maximized when they’re as different as possible. So P2 can either be 10 when P1 and its size are the same (both 1, both 2, both 3), or when one is 10 and the other is 1. (For phenomena triggered by multiple input objects, we’ll take the average of the value calculated for each object.) We’ll call this version of the PTOP model the “level 3 model.”"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!kfSr!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F45753867-a0be-4042-af1e-4e807a616b3b_754x864.png", "alt": ""}, {"type": "text", "content": "This change actually makes the initial stage of the technological search much easier. Because the correct object size is no longer needed to trigger a phenomenon (just the correct object type), getting a technology that triggers the final phenomenon is now very easy (though it would be easy to change this by making the value of triggered phenomena dependent on some new property instead of size, and keeping whether or not a phenomenon is triggered size dependent). But now there’s an element of performance tuning. A technology that works, in the sense that it has a positive value for the final triggered phenomenon, might be quick to find, but to maximize performance — achieve a final phenomenon with a value of 10 — you need to keep iterating, fiddling with the sizes of the various objects to gradually push performance up."}, {"type": "text", "content": "This dialing-in step is meant to capture the technological development process: taking some technology that already works to some degree and pushing its performance higher or building a version that works in a particular way. With Edison’s lightbulb, for instance, incandescent bulbs had been demonstrated since the early 19th century, but their performance was poor — they burned out quickly, or the interior of the bulb blackened, or they used too much power. Edison took a technology whose configuration had been mostly figured out — a high-melting-point filament, a glass bulb, and an atmosphere to minimize reactivity were all common characteristics of previous bulbs — and pushed its performance higher by tweaking the properties of the various elements: the level of vacuum, the size of the filament, the exact type of carbon, and so on."}, {"type": "text", "content": "In the level 2 model, we had multiple phenomena for each level — multiple different ways to trigger P2, for instance. In the level 3 model, we’ll keep the same feature, but we’ll add a twist: different phenomena have different ranges for triggered properties that they can possibly achieve. So one way of triggering P2 might only be able to reach a value of 7, while the other might be able to achieve a value of 10. For some technologies, this might be fine; in other cases, maximizing performance will require using some other, different phenomena instead.\n\nThis also mirrors what we see with real-world technologies. When developing some new technology, the designer will be confronted with many possible ways of doing some particular job, and depending on the performance required, different options might work best. In the lightbulb, the performance of a carbon filament could only be pushed so high, and so eventually lightbulbs switched to tungsten filaments, which in turn required inventing a new process for producing ductile tungsten wire. Similarly, there are a variety of different ways of implementing the valves on an internal combustion engine to let gases into and out of the cylinders. Achieving very high engine performance, such as the number of revolutions per minute required on a Formula One car, requires complex valves that use things like compressed air instead of conventional wire springs , while if you’re building a four-door sedan the cheaper and simpler wire spring is fine."}, {"type": "text", "content": "Let’s now add one more element to the level 3 model. Up until now, we’ve had one single chain of properties: one phenomenon triggers another, which triggers another, and so on. Now let’s add a parallel set of properties, triggered by a parallel set of phenomena. In our lightbulb example, we can think of this as the temperature of the filament triggering not only incandescence but thermal expansion and thermionic emission.\n\n(In this example, all these phenomena are triggered by the same property, temperature. In our model, for ease of modeling purposes we’ll have each of the parallel phenomena triggered by its own property.)\n\nThese parallel phenomena are triggered under the same conditions as the primary phenomena, but their values might not necessarily be determined in the same way: the conditions that create a value of 10 for P2 might create a value of 5, or 1, for parallel property T2. Ultimate performance of a technology will be a function of both of the final triggered properties: the value of, say, not just P9 but T9 as well."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!yo95!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ff69a5ea1-fada-478a-958d-aa2e4af25108_907x1066.png", "alt": ""}, {"type": "text", "content": "This addition has a few consequences. For one, the technological search becomes more difficult: trying to dial in a technology by adjusting sizes randomly takes many more iterations if you’re trying to maximize both P9 and T9 than it does if you’re just trying to maximize one or the other. This mirrors technology more generally: the more dimensions of performance you care about, the more difficult getting a technology that’s good enough is."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!kDuO!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F11321a85-f087-4ae2-9f3a-1af9a31aa2aa_1127x323.png", "alt": ""}, {"type": "text", "content": "Another consequence of this addition is that we now have design trade-offs. With multiple phenomena (and parallel phenomena) at each level, we can have different designs, which might achieve different levels of performance. I ran a level 3 search that generated random technological prototypes, and then tried to dial in the performance of each one for several different performance goals: maximizing P7 and T7, minimizing them, and achieving some specific value for each. At the end of the run, each goal had a fundamentally different arrangement, with different values for object sizes. The same basic technology was best implemented in different ways, depending on the performance goal."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!2ihq!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa8dd8240-737a-4e49-9083-a3da8921a40d_1072x187.png", "alt": ""}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!nEyR!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe836ff67-5b96-4e80-b2c4-69321795ee90_1069x769.png", "alt": ""}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!I4B-!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fafa09164-2dca-4048-a7dc-1f40222b88e6_1057x770.png", "alt": ""}, {"type": "text", "content": "To understand the nature of technological progress, it’s useful to think of creating a new technology as a sort of search process, one that’s made tractable by the intelligent acquisition and application of information. We can understand technological progress, in turn, by studying the nature of search processes — what sort of things make them easy, what sort of things make them hard, what sort of information acquisition methods we can bring to bear, and so on. The PTOP models described above are, I think, a useful tool for exploring these technological search dynamics: they’re simple to simulate, they’re flexible, and they can capture a lot of real-world elements of technological development."}, {"type": "text", "content": "The actual search space is 1 billion, not 10, because the size of the last object doesn’t affect any phenomena."}], "text_post": false}, {"id": "d1274088ef978179", "title": "The Midterms’ Message for the Fed: Hike", "url": "https://theovershoot.co/p/the-midterms-message-for-the-fed", "source": "The Overshoot", "tag": "financial", "published_at": "2026-11-12T09:06:44+00:00", "panels": [{"type": "text", "content": "Last week’s U.S. election results were, to use a technical term, overdetermined . There were so many reasons for people to vote the way they did, or to stay home, that it would be madness to attempt to reduce the thousands of individual outcomes to a single thesis about what “the people” desire.\n\nNevertheless, it is worth noting that a plurality of voters in exit polls (39%) claimed that “the economy” was the single most important issue facing the country, meaningfully ahead of “the state of democracy” (33%) and far ahead of all the other options, which were “immigration” (14%), “healthcare” (8%), “foreign policy” (4%), and “crime” (3%). 1\n\nAmong all respondents, 75% claimed that “the condition of the nation’s economy” was either “poor” (36%) or “not so good” (39%). Of those with negative opinions about the economy, 70% reported voting for Democrats. Among the 25% of exit poll respondents who claimed that the economy was either “good” (23%) or “excellent” (2%), just 10% said that they voted for Democrats. 2"}, {"type": "text", "content": "This downbeat assessment is hard to explain. Employment is close to all-time highs, with broad measures of underemployment close to all-time lows. Real consumer spending has been rising steadily and is currently above the pre-pandemic trend. American households across the income distribution have more assets than ever before, not just in dollar terms, but relative to their liabilities and relative to their spending. And according to the most recent Survey of Consumer Finances (SCF), real incomes rose faster for Americans in the bottom 80% of the distribution than for those in the top 20% ."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!sAPF!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ffe19cb0e-dac0-4537-ae3e-a7476ed31fac_3200x2975.png", "alt": ""}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!yb7b!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fe1d1541c-23f2-4635-ad2b-654da8fb1843_3200x2835.png", "alt": ""}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!nP5U!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4730eeff-b24c-46f3-8c0e-c3446c7f62fd_3200x2870.png", "alt": ""}, {"type": "text", "content": "The exit polls imply that most people do not care.\n\nInstead, 79% of respondents claimed that inflation over the past year caused them and their families either “a severe hardship” (21%) or “a moderate hardship” (58%), while 89% of respondents claimed that “the cost of living” was either “crucial” (49%) or “a major factor” (40%) in determining their vote. Democrats won about 60% of these self-identified inflation victims.\n\nThis seems straightforward, especially given the specific emphasis in exit polls on the prices of gasoline, diesel, groceries, utilities, and health care. 3 Almost two-thirds of exit poll respondents said that “higher than usual prices” were “more because of Trump’s policies” vs. “factors outside Trump’s control”. Two-thirds of respondents said that tariffs “hurt the national economy” and two-thirds also said that the U.S. made a “wrong decision in taking military action against Iran”, which curtailed the flow of commodities and refined products through the Strait of Hormuz."}, {"type": "text", "content": "The problem with this explanation is that the 2026 exit poll results on the economy are extremely similar to what people said in exit polls in 2024 .\n\nBack then, 68% of respondents said that the economy was either “not so good” or “poor”, and 70% of those people reported voting for the out-of-power Republicans. Of the 31% with a positive view of the economy in 2024, 92% voted for the then-incumbent Democrats. Meanwhile, 75% of exit poll respondents two years ago claimed that inflation was responsible for either “a severe hardship or a moderate hardship”, with about 60% of them saying that they voted for the Republicans. (There were no equivalent cost of living questions in 2024.) For those who do not remember, there were no tariffs or shipping disruptions in 2024, although there were complaints about the effects of the fiscal policies of 2021-2022."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!UmsM!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F47a7e181-2a9c-4c54-b11b-57501ff7f18d_3195x2920.png", "alt": ""}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!Qul6!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F29ccc786-8d83-41b0-8e45-3560445c38c3_3195x2920.png", "alt": ""}, {"type": "text", "content": "Perhaps even more remarkable is that far more than all of the total swing towards Democrats between 2024 and 2026 among exit poll respondents can be explained solely by those who ranked “the economy” as their most important issue.\n\nIn 2024, Republicans won 81% (!) of that group, which accounted for about 26% of all exit poll respondents and a little more than half of Republicans’ total support that year. Put another way, their margin just among those voters was worth about 20 percentage points of margin overall.\n\nIn 2026, by contrast, Democrats won 52% of those who ranked “the economy” as their most important issue, worth 20% of all exit poll respondents. (The share prioritizing the economy also went up.) That swing alone was worth 23 points of overall margin improvement. Democrats’ margins among those who prioritized “democracy” and “immigration” fell slightly, 4 while their margins on foreign policy improved a little and their implied margins in all other categories also dropped. (Some of the questions changed, which prevents a pure comparison.)"}, {"type": "text", "content": "Democrats did not decisively win a national argument on the economy in 2026, but they were able to claw back enough of those who had voted against them for “economic” reasons in 2024 ( and in 2022 ) to rout the Republicans overall."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!g5C3!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F73fdfc27-e42a-4580-a5dc-b30ebf1a28d4_3201x2845.png", "alt": ""}, {"type": "text", "content": "If elected officials and other policymakers cannot figure out what motivated these voters in 2024 and in 2026, they may find themselves doomed to relentless swings and rising public dissatisfaction. Today’s triumphs by one party may prove just as fleeting as yesterday’s triumphs by the other.\n\nI am not a social psychologist, a politics expert, or a master of public opinion. But the simplest explanation is that the voters who either stayed home or switched their votes in the most recent election were reacting to the same perceived problems in both 2024 and 2026. Moreover, whatever it was that bothered them in those elections was not enough of a problem to motivate them to swing so wildly between parties in earlier elections. In 2016, for example, Democrats won the same 52% of exit poll respondents who put “the economy” as their most important issue as they did in 2026, but with dramatically different results overall."}, {"type": "text", "content": "Given that, and given what we know about economic conditions in 2024 and now, the most straightforward interpretation is that U.S. voters hate nominal price increases far more than they value other economic outcomes.\n\nThat has implications for everyone, 5 but especially for the Federal Reserve.\n\nRead more"}], "text_post": false}, {"id": "a3ee859bc9e64bca", "title": "Why Do I Want Myself in Particular to Exist in Ten Years?", "url": "http://schwitzsplinters.blogspot.com/2026/11/why-do-i-want-myself-in-particular-to.html", "source": "The Splintered Mind", "tag": "philosophy", "published_at": "2026-11-11T17:53:37+00:00", "panels": [{"type": "snippet", "content": "Regular readers will know I was diagnosed out of the blue with metastatic kidney cancer last month. My wife and I (thanks, Pauline!) have spent the past few weeks running all over southern California, seeking opinions and options from Kaiser, City of Hope, UCLA, and UCSD.  I've now started a targeted cancer drug and immunotherapy, and I've completed one course of radiation. Discussing my diagnosis, one oncologist cheerily said, \"The good news is that with the new treatments, life expectancy is measured in years, not months.  We're now looking at median expectancies of three or four years, and ", "read_more_url": "http://schwitzsplinters.blogspot.com/2026/11/why-do-i-want-myself-in-particular-to.html", "read_more_source": "The Splintered Mind"}], "text_post": false}, {"id": "6b3451bd3e9d553a", "title": "Farewell, WordPress", "url": "https://caseyhandmer.wordpress.com/2026/11/09/farewell-wordpress/", "source": "Casey Handmer's Blog", "tag": "engineering", "published_at": "2026-11-09T15:09:48+00:00", "panels": [{"type": "text", "content": "This blog has moved to https://blog.caseyhandmer.com/?moved . All the old posts are there, with interactive versions of many of the charts. The RSS feed is now https://blog.caseyhandmer.com/feed.xml . This site stays up for old links but won’t get new posts."}, {"type": "image", "src": "https://caseyhandmer.wordpress.com/wp-content/uploads/2026/11/image.png?w=1024", "alt": ""}], "text_post": false}, {"id": "d05a2f3eb6b154ac", "title": "AMA | November 2026", "url": "https://preposterousuniverse.com/podcast/2026/11/09/ama-november-2026/", "source": "Mindscape", "tag": "philosophy", "published_at": "2026-11-09T11:44:01+00:00", "panels": [{"type": "text", "content": "Welcome to the November 2026 Ask Me Anything episode of Mindscape! These monthly excursions are funded by Patreon supporters (who are also the ones asking the questions). We take questions asked by Patreons, whittle them down to a more manageable number -- based primarily on whether I have anything interesting to say about them, not whether the questions themselves are good -- and sometimes group them together if they are about a similar topic. Enjoy!\n\nListen or watch Rolex Planet Visionaries wherever you get your podcasts. #ad\n\nGot to https://scribe.how/mindscape and mention Mindscape for you first month of Scribe Capture free on select plans. #ad\n\nGet 30% off your first year of the Base44 Builder plan at https://Base44.com/mindscape . #ad"}, {"type": "text", "content": "Use code MINDSCAPE at https://monarch.com/ to get your first year of Monarch Core half off at just $50. #ad\n\nLook your best and support men's health at https://www.amazon.com/b?node=223476965011&ref_=MOV26_pod #ad"}, {"type": "image", "src": "https://preposterousuniverse.com/wp-content/uploads/bb-plugin/cache/speech-bubble-1423321_1280-square.jpg", "alt": "AMA"}, {"type": "text", "content": "Support Mindscape on Patreon .\n\nAMA questions November 2026\n\nPeter If you could have a super power, what would it be? Flight, super strength, super speed, teleportation, telekenesis (could be a fun party trick!) etc.\n\nJames McBeath In the September 2026 AMA, you said: The eternal Schwarzschild solution has all sorts of weird properties. It has not only a black hole, but it has a white hole in the past out of which things can come but nothing can go in. ... But the Einstein-Rosen bridge and the white hole are not thought to really exist in the world, but we study them because there's a simple mathematical setup to look at first. In other podcasts you have said that scientists should have the courage to accept what the math is telling them. How do you decide when to accept the math and when to assume the predictions don't really exist?"}, {"type": "text", "content": "Friedrich As a European (German/Swedish) I regularly have to watch with horror how the American election systems create really poor outcomes for everyone involved. But from a physics of democracy perspective, aren't you stuck somehow? The politicians who could change anything are the ones who are heavily dependent on its existence. And psychologically, most voters can probably not fathom any alternative without having lived abroad for some time. Do you see a path that could work to move to enable better outcomes without destabilizing society on a catastrophic level?\n\nlucas pollard Have you ever significantly changed your mind about a scientific or philosophical question without encountering new evidence, simply because you came to understand the existing arguments differently?"}, {"type": "text", "content": "Roo Phillips I loved the recent episode with Greg Caruso. I know you're not a fan of free will discussions, but keep them coming! I'm curious how you would compare and contrast your compatibilist views with Greg's free will skeptic views, specifically on what changes to the US legal system should theoretically be pursued. I'm having a hard time understanding the differences between compatibilists and skeptics like Greg, and I'm hoping that when applied to a specific case like how we might modify the justice system might make it a little more clear.\n\nJeffrey Segall I was wondering whether you think it is just as well that there does not seem to be the possibility of faster than light travel or communication. As I think von Neumann pointed out, since our species has evolved rather late in the development of the universe, if faster than light travel were possible, it is likely that a species that developed earlier might have already spread throughout the galaxy, including earth, and blocked the evolution of humans. Similarly, with faster than light communication, a more advanced civilization might be able to hack our technology (along the lines of the three body problem novels) and doom humanity. Given those possible dangers, do you nevertheless hope that faster than light travel/communication may be possible or do you breathe a sigh of relief that it is not?"}, {"type": "text", "content": "half-a-crackpot My question for you is as an author. Let’s say, hypothetically speaking mind you, that I own copies of a few of your books. I get to see them sitting on my shelf in all their glory every time I walk into my home office. Then one day I happened to find PDFs of those same books that fell off the back of a truck. I tried my best to chase them down to return them, but alas, I didn’t even manage to get their plate. Would you personally be offended, or feel wronged, if I used those digital copies that were not paid for?\n\nPerry Whan I am having trouble thinking through the differences between an infinite universe (repeating?) and a continuous universe that just bubbles off from itself. Is there an intuitive way to think about these distinctions?"}, {"type": "text", "content": "Kevin’s Disobedience You don’t strike me as someone who is inspired by any one particular philosopher, but if you were going to teach a course on one person’s philosophy who would it be?\n\n******************************************** Alex West There seems to be split opinion on OpenAI withholding their Yang-Mills existence proof from public view. Thoughts?\n\nAlexander Knochel I would love to hear your opinion about the latest Yang-Mills claims by OpenAI. I'm personally very unhappy how the results are communicated, but am of course very interested in learning more about rigorous definitions of Yang Mills and the Standard Model. p.s. how do you view the significance of the actual result, irresepective of how it was communicated"}, {"type": "text", "content": "Tyler Whitmer i have a sort of meta-question about the yang-mills openai announcement. i was struck by the different ways the various constituencies engaged by openai in the math and physics worlds asked for the discoveries to be handled by openai. do you have any thoughts on how you’d prefer these things to be dealt with in the future, especially if they directly affected an area where you’re a published expert? **************************************\n\nCaleb Yaryan My son is a Jr. In highschool and has expressed interest in pursuing a career in physics, I have an engineering background and have practical advice for him if he wanted to pursue engineering but I am curious what advice you have for a highschool student that is considering physics?"}, {"type": "text", "content": "Philip Obbard Do you think there may be something in Nietzsche’s idea of eternal recurrence if the block universe is to be taken literally? After all, if the entire history of the universe is “out there”, there should be nothing to stop you experiencing your life anew after you die (?).\n\nJoshua Hillerup Would anthropic reasoning mean we should favor with Fermi paradox explanations one that maximize the number of intelligent species out there who are capable of wondering about the Fermi paradox?\n\nKalessinTheFirst If big wormholes a-la Star Trek were real, what would be the safest way to enter them? In media, wormholes act like objects on a 2d plane and spacetime bends inward perpendicular to that plane. The spaceship then enters from a direction perpendicular to the plane, right into the middle of the curvature. But in real life, they would be spherical and spaceships could not enter at an angle perpendicular to the plane. So could one enter from any direction? It's science fiction so maybe anything goes."}, {"type": "text", "content": "Tom B. Night PRIORITY QUESTION: Apologies in advance because I know you don't like questions about free will. It seems like many people in this debate, for example your recent guest Gregg Caruso, try to eat their cake and have it too. They acknowledge someone's lack of free will when they make a bad decision, like committing a crime, then assume others have free will when deciding how to feel or respond. It seems the practical, logically consistent position is to treat everyone as if they have something resembling libertarian free will. What do you think?\n\nDavid Commander How does a Boltzmann brain continue to survive and if it can't why isn't ongoing experiences in the moments of now insufficient to prove I am not one? In other words, if I can have false past memories can I also have false ongoing experiences or the illusion thereof?"}, {"type": "text", "content": "Chris Kaltwasser I have an unpopular theory, and that is that the three-point shot should be removed from the NBA. It rewards a less exciting game. Who cares how good somebody is at shooting a long shot? I would rather see really cool plays that involve strategy, great passing, getting inside, and that kind of thing. I have yet to do the research, but I don't think the three-point shot actually pays off as often as people think. I feel like players miss them more often than they make them, giving up possession without making a shot that might have taken more strategy but had better odds. What are your thoughts on this topic?\n\nNikola ivanov If cosmic birefringence is conclusively detected, how could we distinguish observationally between a fundamental violation of Lorentz invariance, as explored in your early work, and birefringence caused by an evolving field in a Lorentz-invariant universe?"}, {"type": "text", "content": "Rich Hogg As one with a strong naturalistic bent,I would tend to think someone else's supernatural experience was a hallucination or other misfiring of his brain. But I want to keep an open mind while not forgetting that it could happen to me. If I see a ghost tonight, how do I as a \"maybe-crazy Bayesian\" decide whether I should update my priors, or make an appointment with a neurologist?\n\nMichael Bright Since learning even just a little bit about Einstein's explanation of gravity I've always been bothered by the cartoon image of a ball on a trampoline. It makes it look like space has a \"down\". If you agree with my frustration, is there a more preferable cartoonish image or set of images in your mind to visualize what spacetime curvature actually is?"}, {"type": "text", "content": "Zach McKinney The prevailing cultural narrative around AI is one of inevitability and runaway proliferation. However, this chain of reasoning never seems to reckon with the planetary boundaries of finite material resources and energy. On what time scale (if any) do you foresee the proliferation and diffusion of AI to become constrained by such limits?\n\nMichael Aster Since you've talked about how you like the game, how would you feel if Kingdom Rush reached out for a sponsorship on the podcast?\n\nDavid Sotolongo In the April 2023 AMA, you said: \"I think we need to build a lot more housing. I think it is very, very obvious, that's the best way to make housing more affordable, build more of it.\" I agree, and am curious how you think we should go about building more housing? Should the government step in to build, and maybe manage, such housing? And what, if anything, would you do about existing homeowners who oppose new housing because it would decrease the value of their property?"}, {"type": "text", "content": "Allan Lubel Your intelligence and generosity of spirit has really made an impact on me, asking if you feel you received these qualities from your parents or any other influences when growing up and if you could give a couple of examples.\n\nMiron Mizrahi In the last AMA, when you discussed neutrino oscillations, you said something that sounded a lot like an uncertainty principle: there is no state when the neutrino has both definitive mass AND definitive flavour. I get how this can work for a single particle or field. But how does it work for three? or is there one field for all neutrinos and the mass/falvor combinations are just different values of the field?\n\nDylan Samuel I'm a teaching assistant for a mechanical engineering class and I'm pretty sure that a very large percentage of the class is using AI to do their homework, as their test scores tend to be vastly worse than their homework scores. Recently, a UC Berkeley professor made news saying that they no longer see the point in grading their students' homework. Apologies if you've answered something similar before, but what are your thoughts on this, and generally how are you adapting to teach with students knowing they'll likely use AI? It seems counterproductive to pay for college and then not learn anything!"}, {"type": "text", "content": "Tucker Hiatt Am I mistaken to interpret Newton’s Second Law to include the notion that forces CAUSE accelerations, and to want something similarly causal in a QFT worldview? Please don’t make me give up on causality!\n\nMatt Patterson I’m an avid Mindscape follower and was intrigued by your discussion with Jenann Ismael and her philosophical argument about why it’s OK to kill cows but not humans based on their Value. Value, in this case, being measured by one’s memory of one’s life, having plans for one’s future as well as these same items in others that one has influenced. For cows, this kind of Value is essentially zero and for humans it is much greater. It occurred to me that the Value of individual humans can vary over a wide range (and might even be negative - e.g., in the case of a serial killer). Given that thoughtful humans do decide to kill other humans it seems that considering the Value of those that would die might be one of the considerations in evaluating the moral rightness or wrongness of making such a decision. My question is: Do you think that the Value of potential “death victims” should be one of the considerations when assessing the morality of decisions to kill them? Or is there some moral, or other, objection to this idea?"}, {"type": "text", "content": "Karoly Kantor How likely do you think it is that the observable universe is such a minuscule part of the total universe that our observations are just local phenomena and say little of use about the whole?\n\nCalvin Firth In mad-dog Everettian QM, where there is a single wavefunction of the universe that evolves with time according to some Hamiltonian, what exactly is that Hamiltonian, or where does it come from? In what I have learned so far, as a beginning physics grad student, the Hamiltonian comes from some potential, which is usually classical-looking (ie Hydrogen atom) or at the very least is a function of space (ie inf. square well, SHO, etc.). However, in the mad-dog Everettian picture, I take it that space is emergent. So where does the Hamiltonian come from? Where does it \"live\"?"}, {"type": "text", "content": "Felivel Camilo Do you believe technologies such as LLMs or realistic image generation arrived at an inappropriate moment? Might humanity have benefited more from developing them only after achieving some form of enlightenment?\n\nRedlynx What is your opinion about AI successionism, the idea that if machines will become conscious it would be ethically right to let them replace humanity?\n\nEdwin Miles I have been wondering recently about ‘value’ and wanted to ask the following: Is the value of something only and always contingent on there being someone or something to value it? Or is there some intrinsic ‘value’ to something separate to any human bias, preference and valuation etc.\n\nscott Do Feynman diagrams have ontic content or are they purely computational? I understand that all we measure are scattering amplitudes, not full histories of particle interactions that Feynman diagrams might visually imply. But it seems that among working physicists, these diagrams are essential vocabulary for discussing and visualizing processes. It makes me think there is more to them."}, {"type": "text", "content": "************************************** David Khudaverdyan could you please talk about pointer states? Which aspects of them are already explained and understood by the physics community, and which aspects still await an explanation? You once mentioned that finding the classical world is still an open question in the many-worlds interpretation.\n\nHenry Jacobs On the question of “why do we never observe a superposition”. Is it plausible that observing always involves large systems becoming entangled with the small quantum spin or whatever, and we don’t consider the system “observed” until it has evolved into one of the eigenstates. This seems circular but I don’t know if that’s a bad thing ***********************************"}, {"type": "text", "content": "Daniel Zaccariello Baseball has no clock; outs are its time. And its rulebook forces an exact conservation law: every batter ends the inning as an out, a run, or a man left on base. Physics derives its conservation laws from the form of its rules too, except it had to guess the rules. Is that the only difference?\n\nAnonymous If you were starting over today, what assumption in our current formulations of quantum theory would you be most inclined to question—not because it is demonstrably wrong, but because removing it might open a genuinely new direction?\n\nDaniel Shulman It seems to be accepted dogma that singularities exist inside black holes and some time just before the Big Bang. If we treat spacetime as having some torsion, instead of zero torsion, we get Einstein-Cartan gravity, which looks exactly like GR except at the small scales where singularities matter, and the repulsive forces from the torsion in Einstein-Cartan gravity eliminates singularities. Is it just a historical accident that Einstein didn’t know enough geometry to introduce torsion that we still believe in singularities, or is there a reason why physicists don’t give more credence to Einstein-Cartan gravity?"}, {"type": "text", "content": "Mat Becker Do you enjoy gardening or have any other outdoor hobbies?\n\nJeroen Do you think there are interesting dynamics in quantum field theory that are under explored because they don't map well to particles?\n\nMrG It was recently reported by Sludge that former podcast guest Cornel West's 2024 presidential campaign was indirectly funded by Elon Musk through the \"Interstate Priorities\" election fund. While its not clear that West knew of this involvement, its difficult to reconcile the purportedly pro-democracy rhetoric of someone like West with the practical effects of his, and similar ostensibly pro-democracy political actors, actions working against American democracy. How should liberals act towards those who claim to support democracy but actively work against it?"}, {"type": "text", "content": "Rob Butler If a potential solution to the fine tuning problem is a multiverse, and if they all expand like ours, what prevents the universes from expanding into each other? If they had different laws of physics would they interact, or rather pass by like ships in the night?\n\nDavid Maxwell Like you, I've always believed in letting ideas flow and trusting people to sort through the truth. Recent years have made me question that is media landscapes have enabled systems where large percentages of the population only see total fabrication and never see the true ideas. Have your views on censorship changed?\n\njosh You’ve mentioned playing poker a few times, so I’ve gotta ask…assuming it’s Texas Hold’em, what’s your favorite starting hand? Are you a big pocket pair kind of guy, or do you get more excited seeing suited connectors?"}, {"type": "text", "content": "Alen In the previous AMA you characterized disagreements about free will as largely semantic, despite arguing just minutes earlier in the same episode that emergent phenomena are genuinely real. You also seemed to endorse the view that free will emerges from agency in the recent Christian List episode. Can you reconcile the apparent contradiction or clarify whether I’m missing something here?\n\nPaul Torek How important is it for Everettians to *derive* the Born rule? Obviously, it would be *nice* to reduce your theory's number of assumptions by 1. But don't most other \"interpretations\" of QM help themselves to an empirically-validated Born rule, rather than deriving it?\n\nGustavo Chaves In the March/2026 AMA, while answering a question about your take on the notion of \"computational functionalism\", you said that you \"think that the underlying processes that lead you from the input to the output are crucially important in whether or not those processes involve something that we can call consciousness.\" In his recent essay, The Mythology Of Conscious AI (https://www.noemamag.com/the-mythology-of-conscious-ai/), Anil Seth challenged the notion of \"computational functionalism\" arguing, among other things, that there are functions that Turing Machines cannot compute perfectly, such as continuous or stochastic functions. As I understand it, he argues that perhaps consciousness depends on processes that a Turing Machine cannot compute, but only simulates in a way that isn't precise enough to allow for consciousness to emerge. Is this more or less what you're thinking about when you mentioned the importance of the \"underlying processes\" happening in our brains or was it something different?"}, {"type": "text", "content": "****************************************** Krisztian Dobo Do you think AI will be able to produce new theories in physics just by the sheer fact that it has access to a vast amount of papers, findings and theories and is able to hold them in its head and freely recombine them? I understand your point about physics, that given its experimental nature (with regards to proving things, anyway) it's less susceptible to AI breakthroughs, but i have a feeling there might be low hanging (yet important) fruits hanging around that are not discovered because of the immense specialization and amount of knowledge in science.\n\nJames Alan What do you predict would happen if you constructed a training data set for an AI that only contained data from quantum mechanics experiments. Could you build up an agent who’s intuition about the world were quantum mechanical instead of classical? do you predict being able to extract novel insights from such an agent? *********************************************"}, {"type": "text", "content": "Jonathan Kleiman PRIORITY QUESTION: Sean, how do you distinguish genuine academic consensus from people being afraid to disagree? Has that fear contributed to public distrust of universities, and what should they do differently?\n\nP Walder How do you think AI will inform Theoretical Physics in the short term - 3-12 months?\n\nC Jurlando In your April AMA, you discussed Habermas’s concern that economic and administrative systems can colonize the lifeworld, displacing communication and shared meaning. A successor in that critical tradition, the sociologist Hartmut Rosa, has developed a related critique through his concept of “resonance”: relationships with people, work, nature, or art in which we feel addressed, can respond, and are changed by the encounter. In such moments, the world seems to come alive and \"crackle,\" drawing us into encounters we cannot fully control. Rosa proposes resonance as a criterion for a good life beyond wealth or the mere satisfaction of preferences. I find this compelling: a society could become ever richer and more efficient while making resonant relationships increasingly difficult to sustain - and that is bad! Do you think resonance could provide an objective standard for judging a society’s success, or at least a standard that goes beyond subjective preferences? What would justify treating it as such?"}, {"type": "text", "content": "Robert Ruxandrescu Have you thought about adding some perks for the higher paying members of Mindscape? For example, you could hold a trimestrial or yearly two hours Zoom meeting with the higher tier paying members and have a live chat with them, like a live AMA where you could have short back and forth conversations. What do you think?\n\nthe_priority_question How much of an impact do you think that social media and their algorithms promoting echo chamber bubbles has on the current political polarisation, and is this a bad thing?\n\nPeter Huncar I really enjoyed your episode with Gregg Caruso. It got me thinking about the “who” behind the choosing, so here’s a two-sided question: Who is Sean, and when is Sean? Narrator, brain, or body, and over what timescale? Over seconds you look autonomous, but over decades your zip code does a lot of the choosing. Where do you draw the boundary of the self that chooses? Is that a fact or a modeling choice, and at what point does “Sean did it” become just “the universe evolved”?"}, {"type": "text", "content": "Sid Huff There has been considerable discussion in the news media recently about the concept of designing a “kill switch” that would shut down an AI system if it were determined to have “gone rogue.” From your understanding of current and future AI, would a kill switch be an effective solution to potential AI malfunction?\n\nMichael Helgerson With the NBA season in full swing and your work on the Physics of Democracy underway, what would your outline for The Physics of Basketball book look like?\n\nOwe I was a little surprised in your reflection after talking with Chandra Sripada at how strongly you seemed to take his perspective. One thing I found mostly missing in the conversation was what's built in to language. My question is: do you think that Sripada was correct in ascribing so much intent to the models (for example, he mentions \"the model is doing something like implicit Bayesian inference\", or instead is something like Bayesian inference being built in to the weights between words because humans use Bayes in constructing the sentences that LLMs are trained on?"}, {"type": "text", "content": "Brandon Lewis I'm still trying to understand how to think about particles in QFT. I get that the fields permeate all of space. The fields are constantly oscillating within their degrees of freedom, but also coupled to each other, so the oscillation can move between fields. When that happens, we observe particles decaying or fusing. We can only observe discrete measurement outcomes of a continuous wave function, the infinite other possibilities lost to us once our universe has made its choice. Are particles in QFT just when the wave function has sufficient energy or density at some location?\n\nJoie As often heard on Mindscape, the early universe is described as very low entropy that increases with time, which is also how/why we experience time linearly. As a total physics novice who only knows about it from this podcast and other lay sources, my question is, can entropy be zero at time zero? If so, what would that look like and mean?"}, {"type": "text", "content": "Marie Rausku With the upcoming Halloween and people talking about ghosts, haunting and paranormal stuff I have realised that so many people have easy to believe in ghosts, demonic possession or afterlife. But then the Many World Interpretation of quantum mechanics is called or counterintuitive or \"bonkers\" and \"much harder to believe in\" (than ghosts)- not just by people believe in ghosts but by other scientists too. Why is that, what do you think?\n\nRob Gebele You consider Boltzmann brains a serious problem for cosmology because they may vastly outnumber ordinary observers. Yet in Everettian quantum mechanics, observers on branches with arbitrarily small amplitudes are also real, and you appeal to Born-rule weights rather than simply counting them. If Boltzmann brains themselves arise from rare quantum fluctuations, why can’t we resolve the BB problem by applying an appropriate quantum measure that suppresses th
