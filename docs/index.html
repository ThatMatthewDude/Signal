ued a scathing order and appointed a so-called “special master” to oversee promised reforms."}, {"type": "text", "content": "Days later, the bureau abruptly announced that it would shut down Dublin — then asked the judge to dismiss the case. The judge demurred, saying the idea that closure solved the agency’s problems “strains credulity.”\n\nAna and the other women at Dublin were shackled and taken to other facilities around the country in what seemed like an unusually torturous process . In letters and interviews, women recounted how some officers screamed at them, threatened to shoot them or left them without water for hours. “With their behavior and the noise of the cocked guns,” one woman wrote, “I was sure they were going to kill us.” An internal affairs investigation later determined that all the transport officers had acted “within policy” even though, in some cases, other prison staff corroborated the women’s accounts."}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/MRSH-03-inline-contraband-v3-comp.png?w=752", "alt": ""}, {"type": "text", "content": "For Beaty and the other San Francisco-based attorneys heading up the legal team for the class action lawsuit, building a case against the federal government now became much more complicated. To interview dozens more survivors, they had to travel across the country to remote prisons.\n\nThat October, Beaty and fellow attorney Kara Janssen paid their first visit to Aliceville. They’d just come from a legal conference in Atlanta, where they’d given a presentation on their work at Dublin, then rented cars to drive four hours to a hotel in Tuscaloosa. After another hour on the road — once they’d nearly reached the Mississippi border — the bleak, boxy buildings of a federal prison rose up out of the endless forest."}, {"type": "text", "content": "When the lawyers walked through the front door, the prison staff seemed so unaccustomed to legal visitors that they weren’t sure how to sign them in. “It felt like nobody had come there in a long time,” said Janssen.\n\nOver the next three days, she and Beaty took down statements from more than 70 women, most transfers from Dublin. Some described the rough move or their trouble getting basic medical care. But others told new stories of abuse, this time at Aliceville. The medical staff who forced them to dance. The officers who assaulted them in closets, and the other staff who pretended not to see.\n\nOne of the women who talked to them was Ela. She’d landed behind bars five years earlier, after FBI agents arrested her in a meth bust. It was the first time she’d been in real trouble. She was sentenced to seven years in federal prison and eventually ended up in Aliceville, where, in early 2022, an officer pulled her into a closet and pushed her to her knees, forcing her to perform oral sex on him before vaginally raping her, according to a tort claim filed on her behalf. When she reported the incident to prison officials, she said they yelled at her and fired her from her job in the prison’s safety department. Traumatized and distraught, she began cutting herself. Eventually, she asked to see a psychiatrist but left feeling worse after the psychiatrist made fun of her, according to the narrative laid out in her legal claim."}, {"type": "text", "content": "About a year later, Wilder — the officer in stylish jeans — started circling, according to the claim. He was flirtatious at first, talking about his own romantic encounters and asking about her family back home. Then, one day in the spring of 2023, she said he forced her into a utility closet and made her perform oral sex on him. A few months later, he locked her in that same closet for two hours, returning three times to rape her, according to the legal claim.\n\nEla wasn’t the only woman Wilder allegedly targeted. Other women had reported him for similar behavior, but his abuse continued until the fall of 2024, according to court filings and interviews. That September, investigators questioned Ela about her earlier abuser, who had by then pleaded guilty to assaulting two other women. But even though Ela had already confided in Ana about Wilder, she was reluctant to tell prison officials. “I was very scared to speak out,” she said in emails in Spanish to ProPublica and The Marshall Project."}, {"type": "text", "content": "Investigators paid another visit days later — and that time she told them everything. “I would not want the chain of victims to continue,” she said. “We had to put a stop to it.” Wilder was walked off the prison property that day. But officers threw Ela into solitary confinement for nearly two weeks. They told her it was for her safety — “which really wasn’t safe at all because it was a nightmare,” she said.\n\n“You have a huge system that just steamrolls everybody, and you’re already considered to be not trustworthy. Our word means practically nothing.”\n\nAnd while Wilder was eventually indicted for sexually abusing seven women, 11 others — including Ela — have also accused him of sexual assault in civil claims, including two lawsuits. In both of those cases, a court has paused the proceedings until the criminal charges against him are resolved. Apart from his not guilty plea, Wilder has not responded in court or to repeated requests for comment."}, {"type": "text", "content": "By the time Beaty and Janssen arrived at Aliceville, the women were skittish, rattled by the abuse, the retaliation, the prodding FBI agents.\n\n“A lot of people were really scared,” Janssen said. “It felt just like another Dublin.” As she got in the car to leave, Janssen broke down crying.\n\nIn the months following the Aliceville trip, the lawyers traveled to prisons in California, Connecticut, Texas, Florida and Wisconsin to speak to Dublin victims. At almost every stop, women told them of abuse happening in that institution, too.\n\nIn early 2025, over the new Trump administration’s objections , Gonzalez Rogers, the judge in the Dublin class action suit, approved a sweeping consent decree — a first for the federal prison system. It included pathways to early release, increased protections against retaliation and two more years of court-mandated oversight for the Dublin survivors."}, {"type": "text", "content": "It would not be enough to protect those who were still incarcerated. Even as their lawyers prepared civil suits, Ana and the other Dublin women became targets for harassment at their new prisons. At some facilities, staff derisively referred to them as “Dublin girls” or “Dublin bitches” and refused to give them prison jobs, according to interviews and court papers. Elsewhere, other prisoners viewed them as snitches and held their decision to come forward against them.\n\nThe women also continued to face sexual abuse. After getting shipped out of Dublin, the survivors reported almost 40 instances of abuse at their new prisons during the first six months of the court-appointed monitoring, according to monthly reports filed in federal court."}, {"type": "text", "content": "Abuse allegations continue to extend far beyond Dublin survivors. In interviews and legal filings, ProPublica and The Marshall Project uncovered accusations of sexual abuse at a prison camp in California, a low-security prison in Wisconsin and a notoriously troubled facility in West Virginia.\n\nAnd earlier this year, the FBI showed up at Carswell, a facility so troubled that one woman described it in court filings as “a federal prison that became a hunting ground.”\n\nInvestigators uncovered a cluster of allegations against paramedic Preston Emert, who was removed from his job after 18 women accused him of sexually abusive behavior, according to court filings and internal bureau correspondence. Emert targeted women with addiction issues and medical problems, demanding sex in exchange for drugs and medical treatments, according to several women, their attorneys and a top bureau official."}, {"type": "text", "content": "“I have seizures and would need help and in order to get it I would have to have sex with him,” Olivia Floyd said in a letter to reporters. Emert is one of 12 Carswell employees accused of sexual assault in the last five years. He has not been charged, and bureau officials said in November he is still employed as a paramedic at Carswell.\n\nLast month, his boss — the health services supervisor who records show fielded at least one of the early complaints about the paramedic’s behavior — was arrested after he admitted to investigators that he was having sex with a woman incarcerated there. He has not yet entered a plea."}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/MRSH-03-inline-lawyers-v2.png?w=752", "alt": ""}, {"type": "text", "content": "Despite evidence of persistent abuse throughout the system, the Bureau of Prisons now appears poised to have less oversight than ever. The landmark consent decree is set to expire early next year. The Office of Inspector General, the Justice Department’s watchdog that has the power to investigate and recommend reforms, has suffered staffing shortages in recent years as the Trump administration has pushed to slash its budget. Meanwhile, hoping to shore up its staffing levels, the bureau recently announced it would allow new officers to start with fewer qualifications and lower pay.\n\n“It’s almost as if they’ve learned nothing,” said Shanna Rifkin, general counsel for FAMM, a nonpartisan organization that advocates for criminal justice reform. “They need staff who are well-trained and well-compensated, and to lower the qualifications when you already have rampant sex abuse and drugs being brought in — what do they think is going to happen?”"}, {"type": "text", "content": "Two years after Congress passed the Federal Prison Oversight Act , the ombuds office it mandated still does not exist. The Trump Department of Justice has failed to release a projected budget and progress report, even after both chambers of Congress directed it to do so by April of this year. And lawmakers have yet to appropriate any money for it.\n\nWithin the Bureau of Prisons, the effects of the intended reforms have been minimal. The agency has installed more cameras and restructured its Office of Internal Affairs, though under the new structure, staff at individual prisons typically still investigate their coworkers. “I think small things were changed — like the signage about how to report [abuse] needed fixing,” said former Justice Department attorney Marnie Shiels. “There were no substantive long-term changes from this that I know of.”"}, {"type": "text", "content": "Lawyers say it’s also becoming harder for civil cases to succeed. So far, the federal government has agreed to pay $116 million to settle lawsuits with the first 103 victims of Dublin. Roughly 300 more cases are working their way through the legal system, including the one brought by Ana, who has since been released from prison. The man who abused her was never criminally charged, and he died while under investigation."}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/10/20260910-Gordon-Prison-Abuse-484.jpg?w=752", "alt": "A woman’s hands gently clasped together and resting in her lap under soft, low lighting against dark clothing."}, {"type": "text", "content": "Trump’s Justice Department has offered paltry payouts in some cases and reneged on signed agreements that could have avoided protracted litigation in others, according to sources familiar with the situation. Lauren Bis, a spokesperson for the White House, referred questions to federal prison officials.\n\nLegal experts also point to a recent, troubling precedent. In 2024, a federal judge in Alabama threw out a lawsuit brought by a woman at Aliceville who had been raped by an officer. The judge, Scott Coogler, sided with the Justice Department in ruling that the prison system wasn’t liable because the officer “was acting outside the scope of his employment” when he sexually assaulted her while on duty. The decision is pending appeal."}, {"type": "text", "content": "“This case could make it incredibly hard for anyone abused in government custody to seek accountability from the BOP,” said Deborah Golden, who is representing dozens of women in cases about their sexual abuse at federal prisons. “I hope that doesn’t happen.”\n\nTo the lawyers at the forefront of this fight, the fallout from Dublin has come to a disappointing conclusion. “It should not be hard to go to work and not force someone to give you a blow job,” Janssen said. “That is an extremely easy rule to follow. And I can only think that it’s just a complete lack of accountability.”\n\nAs for the Bureau of Prisons, it’s already returning to a familiar playbook. Earlier this year, the bureau announced plans to stop housing women at Aliceville and turn the facility into a men’s prison. Ela has since been released. But the rest of the women will, once again, be scattered across the country."}, {"type": "text", "content": "Reporters searched federal court records and civil lawsuits and interviewed currently and formerly incarcerated survivors of sexual abuse, prison officials, and civil rights attorneys to compile a list of allegations that met the criteria for “ sexual abuse ” under the Prison Rape Elimination Act. They included only abuse allegedly committed by a BOP staffer against prisoners at women’s facilities operated by the Bureau of Prisons. There were 172 cases involving women and 15 in which the victims were transgender men. Allegations were sourced from an official record — including tort claims, lawsuits, criminal filings and internal agency documents — or the individual themselves, in which cases reporters corroborated their accounts with contemporaneous witness statements, journal entries, or letters; court filings; sworn statements; and other documentation."}, {"type": "text", "content": "The post A Federal Women’s Prison Became a “Rape Club.” After Officials Shut It Down, Rampant Abuse Continued Elsewhere. appeared first on ProPublica ."}], "text_post": false}, {"id": "78c2a2ff32f4c0c8", "title": "Catwalks and crackdowns", "url": "https://aeon.co/essays/its-not-political-the-young-fashionistas-of-tehran", "source": "Aeon", "tag": "philosophy", "published_at": "2026-11-17T11:00:00+00:00", "panels": [{"type": "snippet", "content": "Women in Tehran are changing society by dressing as they choose, in numbers too large to stop. This is the ‘art of presence’ - by Parisa Khoshnami Read on Aeon", "read_more_url": "https://aeon.co/essays/its-not-political-the-young-fashionistas-of-tehran", "read_more_source": "Aeon"}], "text_post": false}, {"id": "9214bafab40e81a3", "title": "The cultural rules that define us take shape in our homes", "url": "https://psyche.co/ideas/the-cultural-rules-that-define-us-take-shape-in-our-homes", "source": "Psyche", "tag": "philosophy", "published_at": "2026-11-17T11:00:00+00:00", "panels": [{"type": "snippet", "content": "The physical space of the home says a lot about how people learn to live. This becomes even clearer when you travel - by Oliver Sweet Read on Psyche", "read_more_url": "https://psyche.co/ideas/the-cultural-rules-that-define-us-take-shape-in-our-homes", "read_more_source": "Psyche"}], "text_post": false}, {"id": "eab1c3a2cad86321", "title": "People Miss Jensen Huang Already", "url": "https://www.bloomberg.com/opinion/newsletters/2026-11-16/people-miss-jensen-huang-already", "source": "Money Stuff", "tag": "financial", "published_at": "2026-11-16T19:37:39+00:00", "panels": [{"type": "snippet", "content": "Also antitrust and x-risk, procurement deals and the Frankenstein PBC IPO.", "read_more_url": "https://www.bloomberg.com/opinion/newsletters/2026-11-16/people-miss-jensen-huang-already", "read_more_source": "Money Stuff"}], "text_post": false}, {"id": "8115c45d8960cab9", "title": "God and Physics May Explain Different Kinds of Causes | Charles Harper", "url": "https://www.youtube.com/watch?v=YPXTXslJWJs", "source": "Closer to Truth", "tag": "philosophy", "published_at": "2026-11-16T19:30:24+00:00", "panels": [{"type": "snippet", "content": "*If physics explains how the universe began, does that leave any role for God?*\n\nCharles Harper revisits Aristotle's four causes to question whether physical and divine explanations must compete. He explores how mathematics, matter, and mind complicate the search for an ultimate cause, while warning theologians against invoking God or ultimate mystery to prematurely close scientific questions.\n\n0:00 Aristotle's Four Causes and the Universe\n1:34 Why Divine and Physical Causes May Not Compete\n2:52 Mathematics, Matter, and Mind as Ultimate Explanations\n5:33 What Science Can Ultimately Explain\n7:5", "read_more_url": "https://www.youtube.com/watch?v=YPXTXslJWJs", "read_more_source": "Closer to Truth"}], "text_post": false}, {"id": "0dbfd7b7a77045cf", "title": "The nationwide ground stop.", "url": "https://www.readtangle.com/faa-nationwide-ground-stop/", "source": "Tangle", "tag": "news", "published_at": "2026-11-16T16:51:00+00:00", "panels": [{"type": "image", "src": "https://storage.ghost.io/c/4a/93/4a939b47-6a19-4b38-a13c-89d5a0f0d6dd/content/images/2026/11/Airstop.png", "alt": "The nationwide ground stop."}, {"type": "text", "content": "Hello and welcome to Tangle. I’m Isaac Saul , officially in the 10-day countdown to my favorite holiday of the year: Thanksgiving. Fingers crossed for a week without whatever happened to our aviation system on Friday. That nationwide ground stop is the subject of today’s newsletter, and I’ll be making my case for some major FAA reforms. Plus, a reader question about the impact of super PAC money on elections and a major geological discovery .\n\nIt’s a 13-minute read ."}, {"type": "image", "src": "https://storage.ghost.io/c/4a/93/4a939b47-6a19-4b38-a13c-89d5a0f0d6dd/content/images/2026/07/podcast@2x.png", "alt": "The nationwide ground stop."}, {"type": "text", "content": "Will Kaback, Audrey Moorehead, Carina Pacheco, Russell Nystrom, Isaac Wood, and Bailey Saul edited or contributed to today’s newsletter.\n\nStark electoral outcomes often inspire takes that one issue or another was responsible for the results. After the 2026 midterms, the Iran war, immigration policy, tariffs, and more have all been offered as the driving force behind Republican losses. In last Friday’s edition, Isaac writes on the pitfalls of this siloed thinking. You can read it here .\n\nNot every breaking news link is what it seems.\n\nYou read the news closely. You click through to primary sources, dig into threads, and follow links to get the full picture. That’s a great habit, and one worth protecting."}, {"type": "text", "content": "As more of our news consumption happens online, it’s also important to be mindful of misleading links, spoofed websites, and phishing attempts that can be difficult to spot. A little extra protection can help you browse with more confidence .\n\nThat’s where Surfshark VPN comes in. Its built-in scam and phishing protection automatically blocks known malicious links and fake websites before they load, adding another layer of security as you browse.\n\nGet it now: $2.49/mo on the 2-year plan — 88% off + 3 extra months.\n\nRead critically. Browse confidently.\n\nThe nationwide ground stop. On Friday, the Federal Aviation Administration (FAA) grounded most flights in the United States due to disruptions to air traffic control communications systems. The stop lasted for approximately five hours, causing mass flight cancellations and delays that continued through the weekend. Government officials suggested the issue originated from a router installation by a government contractor, and Transportation Secretary Sean Duffy called on Congress to pass additional funding to modernize FAA systems."}, {"type": "text", "content": "Back up: Before Friday, the FAA had ordered a nationwide ground stop twice in U.S. history, first after the September 11, 2001, terrorist attacks and second in 2023 when a critical computer system malfunctioned.\n\nSecretary Duffy said the decision to call the ground stop was made after communication and radar systems experienced “inconsistency,” creating gaps in contact between air-traffic controllers and pilots. All of the roughly 3,500 flights in the air during the disruption landed safely. By 8:15 PM ET, the systems were stable and flights began departing again.\n\nIn a press conference on Friday night, Duffy repeatedly described the issue as a result of outdated FAA systems and said the agency needs more funding to upgrade aging infrastructure. “This is a continual problem that we have and it should be fixed,” he said . “New hardware, new software, new telecommunication.”"}, {"type": "text", "content": "Separately, Homeland Security Secretary Markwayne Mullin said he had seen “zero evidence” that a cyberattack caused the disruptions but that his department was still investigating. Mullin later suggested that Duffy’s ongoing efforts to upgrade the FAA’s systems “was overwhelming the older system.” However, the FAA said on Sunday that the new equipment was not responsible, reporting that its initial investigation found two potential sources for the disruption: a facility in Arkansas where government contractor L3Harris was conducting maintenance on telecommunication lines, and a radar site in Texas.\n\nBelow are views from the right and left on the ground stop. Then, Executive Editor Isaac Saul’s take."}, {"type": "text", "content": "In The Wall Street Journal, Marc Scribner suggested “tech isn’t the FAA’s biggest problem.”\n\n“[America’s air-traffic control system] is antiquated and in dire need of an update, but money won’t solve the fundamental problem: the Federal Aviation Administration’s obsolete institutional model, which is responsible for its crumbling infrastructure,” Scribner wrote. “The agency has a dual mandate to provide air-traffic control and regulate its safety. It depends on congressional appropriations to sustain itself.\n\n“As a result, air-traffic control competes with other federal spending priorities, and it faces operational trade-offs between efficiency and safety. This web of conflicting interests explains why the near-constant concern about the outdated U.S. air-traffic control system has persisted for decades without resolution,” Scribner said. “Those reforms start with the recognition that air-traffic service provision and safety regulation shouldn’t be performed by the same entity.”"}, {"type": "text", "content": "In PJ Media, Matt Margolis wrote “Democrats hope you forget this about the last nationwide FAA ground stop.”\n\n“[Duffy said] he expects flights to be ‘back up and operational as we come into the heat of travel during Thanksgiving.’ Former Transportation Secretary Pete Buttigieg slammed the ground stop anyway,” Margolis said. “[Buttigieg] pretended that the Biden administration was proactive about modernizing the system… [He] had four years, a mountain of infrastructure money, and his own nationwide ground stop to learn from. If he ‘got to work,’ where are the results?”\n\n“An August 2023 New York Times investigation found that under Biden and Buttigieg, there was a sharp rise in near-collisions at U.S. airports nationwide, with internal FAA records showing that commercial airline close calls were happening multiple times a week,” Margolis wrote. “Democrats left behind a crumbling air traffic system, and now they want to prosecute the people trying to fix it.”"}, {"type": "text", "content": "In The New York Post, Michael Goodwin argued “money alone won’t fix the FAA.”\n\n“The most troubling consistency of both the press conferences on Friday and Saturday was the officials’ eagerness to blame Congress for not budgeting enough money to speed the modernization of the FAA’s communication network,” Goodwin said. “Duffy said the work should have been done years earlier, and renewed his appeal for Congress to appropriate a staggering $50 billion in new funding for emergency overhauls.\n\n“Coming in the midst of the mysterious shutdown, the not-enough-money argument struck me as being predictable and off key. Washington is now $40 trillion in debt, or about $121,000 for each US resident. How much is enough?” Goodwin asked. “Even if Congress wrote the check tomorrow, the work would take years. So the cavalry is not coming soon. Such pleas always sound like everything would be fine if only America spent more.”"}, {"type": "text", "content": "In The Atlantic, Josh Tyrangiel wrote “the next major grounding will be worse.”\n\n“Even if today has a boring explanation, the experts I’ve been talking with are pretty sure that plenty of days like this are coming, for two main reasons,” Tyrangiel said. “First, anyone can be a bad guy now… Deterrence works on parties who have something to lose and an address where you can send a reply. The trouble with AI (um, one of the troubles) is that it may hand state-grade capability to people who have neither.”\n\n“Second, our best defense against this kind of chaos is amputation… when cyber defenders find a hole they can’t patch fast enough, the rational move is to amputate: Switch the system off and wait,” Tyrangiel wrote. “Whatever caused today’s ground stop, halting every departure in the country ‘for reasons of safety’ until someone works out what’s going on isn’t a sign that the system is failing. More and more, it is the system.”"}, {"type": "text", "content": "In MS NOW, Steve Benen said the administration “tried to play a blame game.”\n\n“Those looking to federal officials for answers were left wanting,” Benen wrote. “Homeland Security Secretary Markwayne Mullin hosted a rather clumsy, nine-minute press briefing just outside the White House, where he said very little… That led to a longer Q&A in the White House press briefing room, led by Mullin and Transportation Secretary Sean Duffy, in which they spent roughly a half-hour explaining how uncertain they were about precisely what happened.”\n\n“If the goal was to reassure the public, it was an embarrassing failure,” Benen said. “It wasn’t until Sunday morning when the president managed to publish a couple of brief online statements about the developments from two days earlier, and to the surprise of no one, he blamed his Democratic predecessor. For those concerned with the Republican administration’s rampant incompetence, the developments did not inspire confidence, but just as notably, Team Trump was playing a blame game it couldn’t hope to win.”"}, {"type": "text", "content": "In Bloomberg, Thomas Black suggested the “disruptions need more than money to fix.”\n\n“If you listened to Transportation Secretary Sean Duffy explain why flights were grounded for about four hours on Friday, you would come away thinking that a lack of funding from Congress was the culprit. That’s not the case,” Black wrote. “Duffy should have instead taken the opportunity to be frank with the American people about the challenges of upgrading the fragile infrastructure that undergirds US aviation.”\n\n“Voters expect critical infrastructure to function at all times, but they detest when city streets are torn up to fix a water pipe or when traffic is snarled by a highway expansion,” Black said. “Once the FAA has a better understanding of what happened on Friday and how to avoid repeating the mistake, it shouldn’t retreat into safe mode. Pushing upgrades into the future is why these antiquated systems pose such risks to air travel today. The future is now.”"}, {"type": "image", "src": "https://storage.ghost.io/c/4a/93/4a939b47-6a19-4b38-a13c-89d5a0f0d6dd/content/images/2025/05/Isaac.jpg", "alt": "The nationwide ground stop."}, {"type": "text", "content": "Consider for a moment the magnificent, outlandish miracle of modern-day air travel in America.\n\nNearly 45,000 flights take off and land each day, almost always without incident. At peak, some 5,500 planes are in the air at once, criss-crossing the skies at various altitudes, speeds, and directions. These flights communicate through what is essentially a giant walkie-talkie network — linked by cable lines, aided by their on-aircraft systems, and managed by air traffic controllers. Pilots can see, obviously, but a key part of flying a commercial jet is listening; they’re not just reacting to what they see out the window, but also trying to match their altitudes, speeds, and angles to the precise instructions they receive over the radio."}, {"type": "text", "content": "On Friday, some pilots and air traffic controllers noticed that those walkie-talkies were acting kind of funny. They started asking each other things like , “Can you hear that static?” or “Did you hear me calling you?” which is not exactly the sort of question you want your pilots and air traffic controllers asking while operating commercial planes full of people. The FAA, which operates under Transportation Secretary Sean Duffy, began investigating the source of the communication issues — in the 45 minutes it spent trying to resolve the problem, the agency came up empty-handed while the disruptions seemed to intensify. That’s when it made the call to ground most flights.\n\nDuffy, predictably, is now asking Congress for more money. As we speak, the FAA is trying to replace thousands of miles of copper wire with fiber optic cable to modernize its systems. Duffy said this work likely triggered Friday’s mess — a contractor completed a changeover which caused routers in the system to be flooded with more than 1,000 connection attempts every four to five seconds, disrupting feeds across air traffic control (ATC). In simple terms, the situation was akin to a four-year-old screaming “hello?!” over and over into a walkie-talkie that is communicating with all other walkie-talkies. You can see how that would make communication between pilots and ATC difficult."}, {"type": "text", "content": "(Worth noting: Some new reporting has called Duffy’s explanation into question, and air traffic controllers have been warning about vulnerabilities in these systems for a while , but I haven’t seen a coherent alternative explanation offered, either. For now, I’m going to assume the FAA’s theory is correct.)\n\nHere, it might be easy to dunk on Duffy as the reality TV star Transportation secretary who’s in way over his head. But the truth is Duffy is far from unusual: Of the 20 Senate-confirmed transportation secretaries since the post was created in 1967, about half had no regional or national transportation sector experience. A few were former mayors (like Duffy’s predecessor Pete Buttigieg) whose relevant experience was linked to passing legislation dealing with airports or local transit. Others had virtually no background on transportation issues at any scale. In reality, Duffy — an experienced lawyer and former congressman — has just as much government experience as many of his predecessors, even if he has much less direct transportation experience than some of them, too."}, {"type": "text", "content": "He also made the right call, which very few people seem to be saying. If my loved one was on one of the thousands of flights scheduled or in progress on Friday afternoon, I’d much prefer them getting to their destination a day late than not at all. Our risk tolerance for pilots can’t hear air traffic controllers should be quite low, and Duffy and FAA officials acted quickly and responsibly in calling for the ground stop. Friday was quite dramatic, and like everyone else , when the news broke I speculated to friends and colleagues about an Iranian attack or “AI bot gone rogue.” But similar cascading issues have surfaced repeatedly over the years, most notably in 2023 and 2009 .\n\nThe question then is: Now what?"}, {"type": "text", "content": "A better solution than “keep funding the system producing poor track records” might be finally beginning the corporatization (or “utility model” ) of air traffic control. This proposal would separate the FAA from ATC to make the latter a standalone public utility funded by user fees. In theory, this model would separate ATC from political volatility in appropriations and allow it to finance large-scale technology upgrades through long-term revenue bonds.\n\nLibertarians and some conservatives have long called for the U.S. to move toward this model, and every single year their case gets more compelling (I used to be against it; now I’m not). Our system has a self-evident weakness: Fees and taxes on airlines and passengers (as well as general taxes) raise money for infrastructure improvements, and congressional appropriators then decide what to do with it rather than sending it straight to the operators. Congress gives the money to the FAA, which ends up as both referee and player — it receives the money to build out and modernize, then oversees its own use of that money. All of this happens on Congress’s timeline (through appropriations)."}, {"type": "text", "content": "Over the years, Congress and the transportation sector have had spurts of momentum to reform this system. As Reason Foundation Transportation Policy Director Robert Poole noted , from 2013–2018, reform bills to move our system to a public utility model garnered support from “all the major passenger and cargo airlines, [the labor union representing air traffic controllers], unions representing pilots and flight attendants, six former U.S. Department of Transportation secretaries, all three former chief operating officers of the Air Traffic Organization, 13 former senior Clinton administration officials, transportation experts from a long list of noted think tanks, taxpayer and consumer groups, and the editorial boards of many leading newspapers, including the Chicago Tribune, Miami Herald, Orlando Sentinel, The Wall Street Journal, Washington Post, and USA Today.”"}, {"type": "text", "content": "And it’s no wonder.\n\nCountries with strong safety regulators like Germany, the United Kingdom and New Zealand have all set up a kind of separate, fee-funded company for air traffic control. Our northern neighbor Canada has perhaps the most unique system of all — a nonprofit with a 15-person board that finances itself through aviation user fees.\n\nThis model has improved safety and substantially lowered costs. Airlines and flyers, not the general taxpayer, fund Canadian air traffic control, and that has made efficiency a top priority. That copper wire replacement we’ve been working on for 25 years? Canada completed most of its own in 18 months under the Nav Canada system.\n\nSuccess wouldn’t be guaranteed or linear, of course. Nav Canada’s entire air traffic control covers about 9,000 flights per day, a fraction of U.S. volume. As former Rep. Steve Russell (R-OK) once said , comparing the two systems is like “comparing an apple to a horseshoe.” We’re also already handing some ATC duties off to corporate America with mixed results. In fact, the defense contractor L3Harris was the group behind the repairs on Friday that allegedly triggered Friday’s nationwide grounding."}, {"type": "text", "content": "Still, it’s not like Canada operates a completely different system with completely different vehicles. Recreating its success is a simple matter of scale, and I sincerely doubt we are incapable of following through if we really want to. But the current Transportation secretary or president is clearly far less relevant than the system itself. The FAA’s job should be to regulate — not operate — and a push to keep the agency in its lane while building out a private air traffic control system would generate more money to support the system, more efficiency in using funds, and faster modernization across the board. It’s time to stop doubling down on the FAA’s convoluted structure and start laying the groundwork for an altogether reimagined and better system."}, {"type": "text", "content": "Take the survey: What do you think of the “utility model” proposal for air traffic control? Let us know .\n\nDisagree? That ’ s okay. Our opinion is just one of many. Write in and let us know why, and we ’ ll consider publishing your feedback.\n\nWhat implications does this midterm election have for big/dark money in politics? In both primaries and the general election, we saw candidates whose strategies relied on sincere outreach and grassroots efforts trump candidates supported by super PACs and megadonors like Elon Musk.\n\n— Sophie from Lafayette, LA\n\nSenior Editor Will Kaback: It’s difficult to say confidently that grassroots fundraising will win out over super PACs and megadonors (or vice versa) in every case. So many variables go into individual races, and one fundraising approach might help a candidate in a certain race and hurt them in another. That said, a 2025 study in Research & Politics found that voters (both Republicans and Democrats) were more likely to say they would vote for candidates who rejected PAC contributions. Overall, I think candidates with small-dollar support can claim an enthusiasm edge, but PACs will continue to be an important source of funding for many successful campaigns."}, {"type": "text", "content": "A separate but related question is whether deep-pocketed campaigns have a clear advantage in the first place. Some academic studies have established that political spending can shift voter preferences and influence election outcomes, but that impact is not 1:1 — that is, spending can reach a point of diminishing returns, regardless of where the funding comes from.\n\nIn this year’s midterms, we saw that idea play out. According to OpenSecrets, Democrats and Republicans spent $5.5 billion and $5.1 billion, respectively, on the 2026 midterms. Of course, those funds were allocated differently; Republicans spent more than Democrats on advertising in the Texas, Ohio, Michigan and Maine Senate races, while Democrats spent more on ads in the Iowa, North Carolina, and Georgia Senate races. But the common denominator? Democrats won all seven races."}, {"type": "text", "content": "At minimum, these results show that dumping huge sums into elections doesn’t guarantee an outcome. Elon Musk spent at least $225 million supporting Republicans in Texas this year, and they got wiped out. Similarly, Kamala Harris’s campaign spent a whopping $1 billion in the 2024 presidential election (compared to Trump’s $472 million) and lost decisively.\n\nDoes that mean campaign spending doesn’t move the needle anymore? Not really. You also have to factor in the quality of the ads themselves, where and when campaigns make ad spends, and other variables. But after an election in which the party with the far larger war chest lost nearly every key race, I wouldn’t be surprised if campaigns start to rethink how they spend their money."}, {"type": "text", "content": "Want to have a question answered in the newsletter? You can reply to this email (it goes straight to our inbox) or fill out this form .\n\nStaying informed shouldn’t put your online security at risk.\n\nFake breaking news links, phishing emails and spoofed websites are designed to trick even savvy readers into exposing their passwords, accounts, and personal information.\n\nSurfshark VPN’s built-in scam and phishing protection automatically blocks malicious links and fake sites before they load.\n\nGet it for $2.49/month on a 2-year plan, 88% off + 3 extra months.\n\nRead critically. Browse confidently.\n\nAfter collecting rocks from several sites in northwestern Iran, Ali Mohammadi’s team at Istanbul Technical University discovered something that had been mostly erased from the geologic record: a chain of volcanoes that was active between 101 million and 97 million years ago. During that period, an ancient ocean called the Neo-Tethys was closing, which helped shape the modern Middle East. The discovery changes the way geologists understand the history of the region. “The magmatic history of northwestern Iran is more complex than previously recognized,” Mohammadi said. ScienceDaily has the story ."}], "text_post": false}, {"id": "78015691226673df", "title": "Philosophy Department Bans AI Use", "url": "https://dailynous.com/2026/11/16/philosophy-department-bans-ai-use/", "source": "Daily Nous", "tag": "philosophy", "published_at": "2026-11-16T13:49:57+00:00", "panels": [{"type": "text", "content": "The Department of Philosophy at Trinity College in Hartford, Connecticut has adopted a new policy banning students from using AI in classrooms or for coursework."}, {"type": "image", "src": "https://dailynous.com/wp-content/uploads/2026/11/ai-philosophy-dept-ban.png", "alt": ""}, {"type": "text", "content": "The policy states:\n\nDeliberate use of AI in philosophy courses, in any capacity and for any purpose, is forbidden. This includes, but is not limited to: using AI to summarize reading assignments; using it to “brainstorm” and come up with ideas; as a research tool for presentations or oral examinations, or as a tool to aid in the writing or editing process (e.g., research, drafting, editing, compiling a bibliography, etc.). Philosophy is focused on cultivating our abilities to think, to read, to write, to speak, to reason, and to live ethically. AI undermines all of these goals.\n\nAccording to the Trinity Tripod , the faculty vote in favor of the policy was unanimous.\n\nShane Ewegen , a professor in the Philosophy Department, told the student newspaper:"}, {"type": "text", "content": "Ultimately, we wanted to avoid having six different AI policies that contradict each other. So after having some discussion about our attitudes and understandings of AI—and the dangers that it’s posing to thinking and the ability of students to think—we were able, after some back and forth, to agree upon a single blanket policy, which simply forbids the use of AI in any capacity in any philosophy course.\n\nProfessor Ewegen has also led a faculty movement to encourage Trinity College to divest from AI software companies , which resulted in a letter from faculty to the college administration about AI policy, the Tripod reports:\n\n“We, the below signatories, request that Trinity College immediately and thoroughly divest from AI companies and the software companies that support them. The technology is too fresh, too unregulated, too dangerous and too unpredictable to safely integrate into the college’s operations. Currently, the support of such technology is incommensurate with Trinity’s stated commitments to fostering intellectual and ethical growth, to protecting the environment, and to building and protecting a safe future for the next generation,” the letter reads. It also requests that the administration take “a firm, immediate, and public stance against such technologies” until they have been deemed safe for academic use, “if [such a] time ever comes,” and that future AI policy be subject to faculty vote."}, {"type": "text", "content": "Regarding the Philosophy Department ban on AI use, Ewegen says, “So part of what our hope was, at least my hope, in adopting a policy like this, is to get more faculty and more students, and hopefully more administrators, to think a bit more critically about the role that this technology is playing in academia right now and the distinct threats that it poses.”\n\nHave other philosophy departments enacted similar policies?\n\nUPDATE: I asked if the policy also applied to faculty. Professor Ewegen wrote, “Currently, at least, it applies to all of the philosophy faculty. (None of us use AI or want to.) Were we to hire new faculty members, we would not impose it upon them; instead, we would talk with them about their position vis a vis AI and invite them to revise the policy with us.”"}, {"type": "text", "content": "The post Philosophy Department Bans AI Use appeared first on Daily Nous ."}], "text_post": false}, {"id": "ff35ffb912afc122", "title": "Bumbition", "url": "https://www.noahpinion.blog/p/bumbition", "source": "Noahpinion", "tag": "financial", "published_at": "2026-11-16T09:52:30+00:00", "panels": [{"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!J4NB!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F2a9253da-dc61-4fdc-bbf0-ac94bce4a414_1050x700.jpeg", "alt": ""}, {"type": "text", "content": "“Hey, I’ll get a job…when I hear the true call.” — Slacker (1990)\n\nAbout 10 years ago, I met a woman who worked as a mid-level software engineer at Facebook. She didn’t work on machine learning, but just for fun, she read a bunch of papers and got into the subject as a hobby. Later, in the pandemic, she quit her boring corporate job and spent a few years unemployed, contemplating the meaning of life. She made her own clothes, learned ballet, made cute Instagram videos, dyed her hair, and went to a bunch of hackathons (almost all of which she won).\n\nAlso in the late 2010s, I knew a man who had been a promising software engineer and data scientist, and before that a top performer on the International Math Olympiad. But when I met him, he was spending a few years unemployed — crashing at his girlfriend’s place, playing Hearthstone (and becoming one of the top-ranked players in the world), learning to skateboard, going on hippie retreats, and contemplating the meaning of life."}, {"type": "text", "content": "Both of those people are billionaires now. They are Sasha Sheng and Diogo Almeida, two of the three founders of TypeSafe AI , a startup that was recently valued at $7.5 billion (and in which I invested a small amount of money). TypeSafe invented Jev, an all-new kind of AI model that bypasses human language, and so is able to make decisions much faster and more cheaply than Claude or GPT. It was an incredibly creative idea — one that the big labs are racing to copy — and it took an incredible amount of hard work to realize. 1\n\nSasha’s and Diogo’s roundabout, seemingly improbable route to stunning success is actually more common in the tech world than you might think. Steve Jobs is  the most famous example — he famously dropped out of college, not to start Apple, but to do psychedelic drugs, crash on friends’ floors, immerse himself in hippie spirituality, live on a commune, and travel around India looking for enlightenment before eventually inventing the personal computer and becoming the most beloved tech icon in American history. Jack Dorsey, Larry Ellison, and Mitch Kapor all had their own periods of aimlessness."}, {"type": "text", "content": "Nor is this sort of life path confined to the tech world. History is full of examples of people who looked lackadaisical until they suddenly rose to greatness:\n\nUlysses S. Grant drank copiously, worked as a clerk in a leather store, engaged in various failed business ventures and was said to lack ambition — until one day he rejoined the military and became the most successful and important military commander in the entire Civil War, as well as President of the United States.\n\nCharles Darwin neglected his medical studies and turned in a mediocre performance on his exams at Cambridge, routinely going hunting and riding instead of studying, before becoming a naturalist, signing up for an ocean voyage, and inventing the theory of evolution."}, {"type": "text", "content": "James Cameron was a college dropout and a truck driver, before seeing Star Wars prompted him to quit his job and teach himself how to make movies, ultimately becoming one of the most commercially successful movie directors of all time. ( Kevin Smith had a similar path to success, except his inspiration was the movie Slacker .)\n\nHaruki Murakami ran a jazz bar and had little ambition, before suddenly deciding to become a novelist, and eventually becoming one of the most celebrated writers in the world.\n\nI like to tell these stories because they demonstrate an approach to success in life that I believe is overlooked and deserves more recognition. I call it “bumbition”.\n\n“Bumbition” is an obvious portmanteau of “bum” and “ambition”. In general, we think of ambitious people and slackers as polar opposites — ambitious people work hard, set goals for themselves, and are constantly motivated, while slackers drift aimlessly, laze around, or fail to apply their talents. A lot of our culture is oriented around pushing young people to be ambitious instead of turning into bums."}, {"type": "text", "content": "Bumbition, however, defies placement on the ambitious/bum spectrum. It exhibits elements of both. For a significant portion of their life, a bumbitious person doesn’t strive hard, or apply themselves to definite goals…until a clear and compelling opportunity presents itself. When that opportunity to do something really interesting or impactful does come up, the bumbitious person is quick to recognize it, and works very hard to exploit it.\n\nThe key here is that bumbition is not simply intermittent ambition . It’s a fundamentally different approach to life — it has different goals and motivations, and when it succeeds, it succeeds for different reasons.\n\nAn ambitious person is always working toward a set of goals — either those they define for themselves, or those defined by the people around them. Those goals could include:"}, {"type": "text", "content": "“Make partner by age 30”\n\n“Start a unicorn startup”\n\n“Get a tenured job at a top 10 research university”\n\n“Make a hundred million dollars”\n\n“Conquer Central Asia”\n\n…And so on. The purpose of achieving those goals — the motivation that drives ambitious people — is to feel a sense of personal success.\n\nA bumbitious person does not automatically have a goal at all times, 2 because they tend to be motivated less by the need to feel successful than by the desire to do something intrinsically interesting or worthwhile . Such projects are inherently in short supply, in part because what constitutes an inherently “interesting” or “worthwhile” project is highly subjective. An ambitious person can always identify some brass ring that would make them feel like a success; a bumbitious person will often wait years or even decades before finding that one magical opportunity or life calling."}, {"type": "text", "content": "In fact, this is bumbition’s inherent limitation. Sitting around waiting for the right opportunity to present itself is a highly uncertain, risky endeavor. There’s always the possibility that it won’t come until you’re old, or that it’ll come but you’ll fail to see it in time.\n\nThe other problem with bumbition is that waiting around for the right opportunity comes with a bunch of costs and risks. Your technical skills and work ethic can decay over time. You can get caught up in life’s various stumbling blocks — bad relationships, drug addictions, depression, etc.\n\nBut bumbition also has some big advantages over the ambitious life. One is that ambition can keep people overly busy . If you’re the kind of person that always has to be working toward a goal, and you can’t find a truly great project to work on, you’ll end up working on a modest or mediocre one. If Steve Jobs had become distracted by getting a perfect GPA at Reed College, he might never have had time to start Apple. If Ulysses S. Grant had focused on owning his own leather goods store, he might not have leapt at the chance to join the U.S. Army. If Sasha Sheng had focused on climbing the corporate ladder at Meta, she wouldn’t have founded TypeSafe."}, {"type": "text", "content": "Paul Graham talks about this in his essay “ How to Do Great Work ”:\n\nAmbition comes in two forms, one that precedes interest in the subject and one that grows out of it. Most people who do great work have a mix, and the more you have of the former, the harder it will be to decide what to do…The trouble with planning is that it only works for achievements you can describe in advance. You can win a gold medal or get rich by deciding to as a child and then tenaciously pursuing that goal, but you can't discover natural selection that way.\n\nIn his book Zero to One , Peter Thiel — who I’d classify as an ambitious rather than a bumbitious person — recounts a vivid example of how his ambition almost prevented him from becoming a tech titan:"}, {"type": "text", "content": "[A]fter a conventionally successful undergraduate career, I enrolled at Stanford Law School, where I competed even harder for the standard badges of success. The highest prize in a law student’s world is…a Supreme Court clerkship…I was invited to interview for clerkships with Justices Kennedy and Scalia. My meetings with the Justices went well. I was so close to winning this last competition. If only I got the clerkship, I thought, I would be set for life. But I didn’t.\n\nAt the time, I was devastated…With the benefit of hindsight…winning that ultimate competition would have changed my life for the worse…Had I actually clerked on the Supreme Court, I probably would have spent my entire career taking depositions or drafting other people’s business deals instead of creating anything new."}, {"type": "text", "content": "Nor is this bumbition’s only advantage. The “bum” phase — the time spent traveling in India, or working at a convenience store, or playing Hearthstone on a couch — isn’t just a holding pattern. The seeming aimlessness of this period of life can serve several important functions that facilitate rapid success once a good opportunity gets spotted.\n\nFirst, and most importantly, time away from the grind of constant striving allows people to broaden their perspective . A lot of unique and original ideas come from recombinant innovation — from combining insights and perspectives from vastly different fields. 3 Even something as simple as changing the context of your surroundings can improve creativity . For an intelligent person with a restless mind, the “bum” phase of life leads to a lot of play and exploration that can end up sparking novel ideas. Here’s a fun example from Richard Feynman:"}, {"type": "text", "content": "I used to enjoy doing physics. Why did I enjoy it? I used to play with it. I used to do whatever I felt like doing - it didn't have to do with whether it was important for the development of nuclear physics, but whether it was interesting and amusing for me to play with…Now that I am burned out…I'm going to play with physics, whenever I want to…\n\nWithin a week I was in the cafeteria and some guy, fooling around, throws a plate in the air. As the plate went up in the air I saw it wobble…I had nothing to do, so I start to figure out the motion of the rotating plate…I went on to work out equations of wobbles. Then I thought about how electron orbits start to move in relativity. Then there's the Dirac Equation in electrodynamics. And then quantum electrodynamics."}, {"type": "text", "content": "Steve Jobs’ study of calligraphy, during his hippie period, famously helped him to think about what would make the letters on a personal computer look beautiful to the eye.\n\nA related advantage is that the “bum” phase also allows people to develop their interests . Paul Graham talks about how “excited curiosity” will often lead people to their most important life’s work. Bumbitious people aren’t just waiting around; they’re playing around, actively searching for something that sparks their interest. In contrast, if you’re constantly grinding away, it can be hard to develop that curiosity.\n\nA “bum” phase also gives people a chance to broaden their human networks . When you’re working hard towards a goal, you usually don’t have much time to meet a lot of people outside work — i.e., outside your narrow current field of endeavor. Ambitious people are always working toward a goal, and thus get relatively little time to go meet interesting people from other walks of life. But the “bum” phase gives bumbitious people time to meet all kinds of folks. This can lead to hearing about radical new opportunities, getting insights from other fields, or even meeting useful partners for a new venture."}, {"type": "text", "content": "Broadly speaking, the “bum” phase of bumbition serves two purposes. It represents waiting and exploration time , as people patiently wait for the big opportunity that will define their career. But it also represents personal development time , either deliberate or unconscious, that helps bumbitious people to better see the big opportunities when they come along.\n\nNow, I don’t mean to claim that bumbition is better than ambition, or vice versa — either in terms of personal success, or in terms of changing the world. Among the greats of any field — politics, business, academia, literature — you can find plenty of examples of both ambitious and bumbitious people.\n\nBut I think our society underemphasizes bumming . We have a tendency to frown on people who spend years unemployed, neglecting work in order to play video games or make Instagram videos. We assume that these people are being lazy or squandering their potential, and we tell them to get back to the grind and make something of themselves. Other societies, of course, tend to be even worse on this score — China treats its slacker generation as a national security threat ."}, {"type": "text", "content": "In the AI age, this could be even more consequential. AI algorithms are consummate hill-climbers — set them to a task, give them some data, and they’ll be more ambitious than the hardest-working Stanford law student. In a world of abundant AI, setting AI on the right goals will be an increasingly central human task. Figuring out the right goals requires exploration, unique perspectives, and curiosity — all things that bumbition facilitates. We should be teaching our young people to be more bumbitious.\n\nAt the same time, we should remember that being bumbitious isn’t just a matter of sitting around on the couch. Just because you tell yourself you’re waiting to hear the true call doesn’t mean you’ll actually hear it when it comes. You have to actually want to do something great — whatever that means to you — and you have to be ready to work incredibly hard for years when that something presents itself. Bumbition isn’t the same as ambition, but it also isn’t the same as being a lifelong bum."}, {"type": "text", "content": "Subscribe now\n\nShare\n\nDiogo’s rise as an AI researcher didn’t start with TypeSafe. He was also a key researcher for OpenAI, creating key features of the original ChatGPT and GPT-4 that kicked off the AI boom.\n\nThere are actually a few bumbitious people who somehow manage to always find huge passion projects — David Holz of Midjourney comes to mind.\n\nAn example I like to cite is a college friend of mine , who ended up adapting a camera technique he learned from his photography hobby to create a novel method of neuroimaging."}], "text_post": false}, {"id": "35f1024a1f760898", "title": "Boeing-Lockheed rocket fails mid-flight, destroys payload of Amazon satellites", "url": "https://www.reuters.com/business/aerospace-defense/us-rocket-fails-after-launch-payload-amazon-internet-satellites-destroyed-2026-11-15/", "source": "Hacker News", "tag": "engineering", "published_at": "2026-11-15T21:38:11+00:00", "panels": [{"type": "text_post", "content": "111 points, 67 comments"}], "text_post": true}, {"id": "4e501f9826d01409", "title": "SpaceX catches the Starship to end Flight 15", "url": "https://www.spacex.com/launches/starship-flight-15", "source": "Hacker News", "tag": "engineering", "published_at": "2026-11-14T21:22:24+00:00", "panels": [{"type": "text_post", "content": "<a href=\"https:&#x2F;&#x2F;x.com&#x2F;SpaceX&#x2F;status&#x2F;2121316300702056595\" rel=\"nofollow\">https:&#x2F;&#x2F;x.com&#x2F;SpaceX&#x2F;status&#x2F;2121316300702056595</a><p><a href=\"https:&#x2F;&#x2F;youtu.be&#x2F;jHlpfNSpBmw?t=3233\" rel=\"nofollow\">https:&#x2F;&#x2F;youtu.be&#x2F;jHlpfNSpBmw?t=3233</a>"}], "text_post": true}, {"id": "9eaab8b79e770a60", "title": "I’m feeling more optimistic about American politics", "url": "https://www.noahpinion.blog/p/im-feeling-more-optimistic-about", "source": "Noahpinion", "tag": "financial", "published_at": "2026-11-14T09:00:44+00:00", "panels": [{"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!0o6H!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fdc5843a6-59b4-4c76-9897-3fc3a9503220_1020x680.jpeg", "alt": ""}, {"type": "text", "content": "“Partisanship is a helluva drug,” as they say. When your preferred party is in power, the sun seems to shine a little brighter, the birds sing a little more sweetly, and there’s a spring in your step as you walk past the homeless encampments and sterile single-family-home-only neighborhoods of your American city. Foreigners from countries where politics is less contentious, like Japan, will never know this joy.\n\nAnyway, this natural partisan sentiment makes it very hard for me to write about developments in American politics. I would like to give you some analysis that’s more informative than “Yay, Democrats won an election !”. I do consider myself a Democrat, after all (even though I’m registered as an Independent). There has never been a point in my entire life when I’d have told you that the Republican presidential candidate was a better pick than the Democrat (though 2012 was fairly close). I regularly bemoan the state of the Democratic Party, but somehow the Republicans always find some way to be Even Worse."}, {"type": "text", "content": "This has been the unfortunate reality for most people in America for years now. Disgust and dissatisfaction with both parties have grown, as both have become more extremist . But there was little they could do except keep voting for the lesser of two evils, while tuning out political news and expressing anger at the whole system. It got so bad that in my New Year’s essay, I even entertained the notion that liberal democracy itself had suffered a generational failure:\n\nTo be honest, I still entertain that notion. Reading that essay again, there’s not much I would change. But on the margin, recent events have made me feel more optimistic about where American politics is going.\n\nA lot of this is downstream of the midterm elections. Trump has turned the Republican Party into something truly awful, and it’s refreshing to see America punish the GOP for going along with that transformation:"}, {"type": "text", "content": "But my optimism isn’t just about the fact that Democrats won — it’s also about how they won, and what they seem likely to do with their victory. Here I’ve been pleasantly surprised so far. And there are also some scattered signs that our leaders are starting to take our substantive policy challenges more seriously, instead of just relying on partisanship and culture wars. Basically, I see three broad positive trends:\n\nThe Democrats are not becoming extremist at the rate I had feared.\n\nThere is some real bipartisan movement on good policymaking at the federal level.\n\nThe nation is waking up to the problem of corruption, and holding the perpetrators to account.\n\nOver the past few years, I’ve watched the emergence of a leftist faction within the Democratic Party, which I’ve likened to MAGA on the right . This faction had its roots in the Bernie insurgency of 2016-2020, but it has grown beyond that. The Palestine movement both invigorated the leftists and radicalized them, shifting the locus of power in left-of-center activism away from Black activists, identitarian movements, and anti-capitalism, and toward explicitly anti-American “decolonial” ideas."}, {"type": "text", "content": "As recently as this summer, I believed that a Democratic victory in the midterms would be led by this hard-left vanguard:\n\nHere’s what I wrote:\n\nDemocrats have spent their political capital moving to the left…[They are selecting] candidates who are so far to the left that they end up frightening and/or offending many voters, and then basically daring people to keep voting for the Republicans…\n\nWhen DSA-type candidates were just winning in deep blue cities, it was possible to think that they would remain a small, limited faction within the party. But Francesca Hong is going to be the Democratic nominee in a statewide race. So is Abdul El-Sayed, who, while not a member of the DSA, is closely aligned with them (especially on Israel, which he focuses on a lo t)…This, increasingly, is who the Democrats are now."}, {"type": "text", "content": "Well, happily, I was wrong about this. Francesca Hong was actually defeated in the Democratic primary race just a few days later in a stunning upset, showing that even partisan Democrats aren’t sold on the DSA faction.\n\nEven more importantly, the hard left didn’t end up leading the anti-Trump charge in the midterms, as I had expected. Despite the blue wave, most of the high-profile DSA-faction candidates performed significantly worse than their normie Democrat counterparts. Jeff Maurer has great data on this:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!bmBA!,w_56,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fbucketeer-e05bbc84-baa3-437e-9518-adb32be77984.s3.amazonaws.com%2Fpublic%2Fimages%2Fe27cdb45-513d-4438-bd19-657129f3a04a_573x573.png", "alt": ""}, {"type": "text", "content": "And the same voters who powered the big Democratic victories also endorsed a lot of centrist policies at the ballot box. Here’s the Washington Post :\n\nVoters in North Carolina elected a Democratic senator…giving former governor Roy Cooper an overwhelming win. At the same time, they approved three [Republican] measures…The first would add a constitutional requirement for a levy limit on property taxes…The second would cap the state income tax at 3.5 percent…The third would require photo ID for voting…\n\nIn Wisconsin, Democrat David Crowley won the gubernatorial election…Those same voters approved an initiative…to ban affirmative action in state institutions…Iowa voters elected Democrats as governor and senator while amending their constitution to make it substantially harder to raise state income taxes…Ohio….went blue for Senate and governor. At the same time, two-thirds of voters backed an amendment to require photo ID for voting…"}, {"type": "text", "content": "Moderates and independents drove Democratic gains in all these places.\n\nVoters in several blue and purple states also approved measures to restrict women’s sports teams by biological sex.\n\nThere’s also a general indefinable “vibe shift” in the air. Anecdotally, people I talk to are less ashamed to voice full-throated support for the kind of liberalism that Barack Obama typified in the early 2010s. Meanwhile, liberal influencers online are beginning to push back more strongly on leftist shouters.\n\nAnd in Congress, the sheer scale of the Democrats’ victory means that the DSA faction will be effectively disempowered. Because marginal victories tend to be won by moderates in purple states, the leadership in both the House and the Senate is likely to be held by moderates like Hakeem Jeffries and Chuck Schumer. This is driving the DSA factionalist types apoplectic with rage:"}, {"type": "text", "content": "Note that the knives are already coming out for Jon Ossoff, whose potential as a 2028 presidential contender surged after his massive midterm victory. But who can leftists run against Ossoff ? Enthusiasm around AOC has dimmed, and there’s no obvious replacement.\n\nIf they fail to find a candidate for 2028, and if Democrats take back the White House with a normie liberal, the leftist faction faces the real possibility that the window of America’s decade of unrest will limp to a close without them. That would, of course, be good for the nation.\n\nEven moderate politicians, of course, often support unworkable or inadvisable policies. On the Democratic side, the worst problems are anti-development policies at the state and local level . “Progressive” policies have made it prohibitively difficult and/or expensive to build housing, roads, trains, power stations, and transmission lines across much of the country, freezing our built environment in the 1970s. I’ve been loudly complaining about this for years now:"}, {"type": "text", "content": "This was a big part of my pessimism about politics. What’s the use of kicking out the Republicans, if the Democrats are just going to decide that “open space” and historic gas stations are more important than giving the middle class a place to live and power for their homes?\n\nNow there are signs that at long last, America’s leaders recognize this problem and are taking action to fix it.\n\nRead more"}], "text_post": false}, {"id": "12a7857e062ff680", "title": "Nvidia’s Board Had to Do Something", "url": "https://www.bloomberg.com/opinion/newsletters/2026-11-12/nvidia-s-board-had-to-do-something", "source": "Money Stuff", "tag": "financial", "published_at": "2026-11-12T18:35:39+00:00", "panels": [{"type": "snippet", "content": "Also the Anthropic IPO book, LLM index fund recommendations and the Head of Macro guy.", "read_more_url": "https://www.bloomberg.com/opinion/newsletters/2026-11-12/nvidia-s-board-had-to-do-something", "read_more_source": "Money Stuff"}], "text_post": false}], "weekly": [{"id": "ecde15dc0074aa93", "title": "374 | Lindsey Fitzharris on Forensic Pathology, Reconstructive Surgery, and Sherlock Holmes", "url": "https://preposterousuniverse.com/podcast/2026/11/16/374-lindsey-fitzharris-on-forensic-pathology-reconstructive-surgery-and-sherlock-holmes/", "source": "Mindscape", "tag": "philosophy", "published_at": "2026-11-16T11:50:08+00:00", "panels": [{"type": "text", "content": "The history of science is always fascinating, and the history of medicine surely has some of the best stories. In this episode we talk to writer Lindsey Fitzharris about two of them. First, the story of Scottish surgeon Joseph Bell, who was both a pioneer of forensic pathology and the inspiration for Sherlock Holmes (whose author, Arthur Conan Doyle, took classes with Bell as a medical student). Second, the story of Harold Gillies, the World War II doctor who pioneered reconstructive surgery. Bell is the subject of Fitzharris's new book Sleuth-Hound , while Gillies is the subject of her previous book The Facemaker .\n\nListen or watch Rolex Planet Visionaries wherever you get your podcasts. #ad\n\nGet 30% off your first year of the Base44 Builder plan at https://Base44.com/mindscape . #ad"}, {"type": "text", "content": "Stop piecing your software together. Go to https://odoo.com/mindscape to learn more. #ad\n\nUpgrade your everyday with Quince and get free shipping and 365-day returns at https://quince.com/MINDSCAPE . #ad\n\nLook your best and support men's health at https://www.amazon.com/b?node=223476965011&ref_=MOV26_pod #ad"}, {"type": "image", "src": "https://preposterousuniverse.com/wp-content/uploads/bb-plugin/cache/Lindsay-Fitzharris-display-main-square.jpg", "alt": "Lindsay-Fitzharris"}, {"type": "text", "content": "Support Mindscape on Patreon .\n\nLindsey Fitzharris received a Ph.D. in the History of Science, Medicine & Technology from the University of Oxford. She is the author of several books, and has contributed to publications such as The Wall Street Journal, The Lancet, the Guardian , and Scientific American . She served as the host of the Smithsonian Channel series The Curious Life and Death of…\n\n0:00:00.3 Sean Carroll: Hello, everyone, and welcome to the Mindscape Podcast. I'm your host, Sean Carroll. Some of you may remember Liam Kofi Bright, who is a philosopher at the London School of Economics, former Mindscape guest. And among Liam's many talents is he's one of our best social media posters. I remember one of his tweets or skeets back in the day. I'm not gonna get it exactly right because he's better at formulating these than I am. But the point was that two of the best job descriptions out there in the world of TVs and movies and novels are ones that don't exist in real life. And he had in mind in particular, consulting detective and science officer. [laughter] Consulting detectives are all over the place on modern TV and movies. Castle and The Mentalist, Professor T is one that we recently watched from the BBC. And of course, science officer started with Mr. Spock on Star Trek, but has gone all over the place since then. Arguably, the first of the consulting detectives in fiction was Sherlock Holmes, of course. The idea being that you have a job that is not officially associated with law enforcement, but they call you in because you're better than they are and they need your help. So today we're talking to Lindsey Fitzharris, who is a historian of medicine."}, {"type": "text", "content": "0:01:22.8 SC: She writes books about various things that happened in the history of surgery and other medical procedures. And her most recent book is called 'Sleuth-Hound: The Case of the Real Sherlock Holmes'. It turns out that, of course, Arthur Conan Doyle, when he wrote the Sherlock Holmes books, was inspired by various real characters that that's what's gonna happen when you're an author. You use your experience in the real world to help build your fiction. But there was one person in particular who was sort of obviously the inspiration for Sherlock Holmes, and Conan Doyle admitted that he was the inspiration for Sherlock Holmes. His name was Joseph Bell, and he was not a detective by profession. He was a surgeon. And Conan... Arthur Conan Doyle was a medical student who studied with him and picked up Bell's method, as he called it, of deducing facts about people from little tiny clues, from a spot on their shoes or how they were wearing their jacket or whatever it was. And he would build a story around this and he would inevitably be correct. And he would use these deductions as part of a holistic approach to diagnosing diseases."}, {"type": "text", "content": "0:02:33.4 SC: And this struck Arthur Conan Doyle as very clever, and he gave it to Sherlock Holmes as his signature move, really. And fascinatingly, as Lindsey's book reveals, Joseph Bell, or Joe Bell as his friends called him, did, in fact, work as a consulting detective. He did, in fact, get called in by the Edinburgh law enforcement officials to help them try to think about different cases, all the way up to Jack the Ripper, who was not in Edinburgh, but still famous enough that Joe Bell actually looked into it. So it's a fascinating example of the connection between the real way that science, medicine, et cetera, forensic pathology in this case, developed historically and how it found a real compelling home in fiction. And we had a little bit of extra time at the end of the episode, so I couldn't help but ask Lindsey about her previous book, which is somewhat related, again, medical history, called 'The Facemaker: A Visionary Surgeon's Battle to Mend the Disfigured Soldiers of World War I'. And this is about Harold Gillies, who was really, maybe not the first, but someone who pioneered plastic surgery."}, {"type": "text", "content": "0:03:45.5 SC: And plastic surgery originally was used for almost exclusively reconstructive surgery, especially with the many, many thousands of victims that came back from World War I with wounds that were not fatal but were highly disfiguring, et cetera. And again, the history of medicine is both horrifying and fascinating and filled with people who had all sorts of lofty ideals and accomplished amazing things and had to do some weird things along the way. So it's a little bit of a different kind of thing for Mindscape, because we're not talking about a big theory, we're talking about some examples from history. But that's what feeds in to the big theories of life. As we do mention, there's at least the very big background thought of how people think about the morality of different medical procedures and what people should do in the face of something going wrong with them and how to fix it medically versus what the doctors are actually able to accomplish. So normally we talk about theory, but this is talking about data, the data of what actually happened in history. So let's go."}, {"type": "text", "content": "[music]\n\n0:05:08.3 SC: Lindsey Fitzharris, welcome to the Mindscape Podcast.\n\n0:05:10.3 Lindsey Fitzharris: Thanks for having me on the show.\n\n0:05:12.1 SC: I got to say, not even a question, but a comment you can respond to if you want. But medical history is just super fascinating. It should be a bigger deal, I think.\n\n0:05:22.6 LF: I love that you say that. I've been doing this for over 10 years now, kind of banging the drum about medical history. I always tell people, even if you don't like history, you might like medical history. Because everybody knows what it's like to be sick, to be a patient. And I tell you how that experience was like 100, 150, 200 years ago.\n\n0:05:40.9 SC: And I don't like that, but that's okay. [laughter] Well, I'm glad. It makes me happy to be alive now. I guess that's where I really wanted to start substantively. What was it like, let's say 100... I wanted to say 150 years ago, I realize now 175 years ago, the mid-19th century. What was medicine like? Was there surgery? Was there anesthesia being used?"}, {"type": "text", "content": "0:06:02.1 LF: Yeah, if you guys are listening and you hear that 1850, you're probably already getting nervous because you know nothing good happens in 1850 when you need a surgeon. Although this is shortly after the birth of anesthesia. I say my superpower is that I can make you feel good about living in 2026.\n\n0:06:22.1 SC: Right. [laughter] That's good.\n\n0:06:22.7 LF: But, yeah, in the mid-19th century. So you have the discovery of ether in 1846. In fact, that's gonna be the subject of my next book called 'Ether Wars'.\n\n0:06:32.7 SC: Oh, nice.\n\n0:06:32.8 LF: Which is about... Yeah, I don't know if you know the story, but ether is discovered by a dentist in Boston, and then he immediately tries to patent it and make money off of it. So, it's the American way. So it's the first attempt at medical capitalism. And then there are some other men who step forward to claim ownership over it. So it's really a story about when something powerful comes by and transforms the world, who gets to benefit, who gets to control it? Which I think is very relevant today."}, {"type": "text", "content": "0:07:00.3 SC: Well, especially if it's something that is a medical benefit. I mean, there's benefits and there's benefits, right? And we kind of simultaneously think that medicine should be there for everyone and charge huge amounts of money for it, at least in where I'm geographically located right now.\n\n0:07:16.5 LF: Yeah. I mean, I've lived in the UK, I have the Chicago accent, but I've lived in the UK for 24 years. We have socialized medicine here, so it's a little bit different. But, yeah, anesthesia comes onto this world stage in 1846. Not everybody is given access to it. There is a debate about whether pain is necessary to keep the patient alive, to keep the blood pumping, to keep the heart pumping. So not everybody is given anesthesia initially, but it does come into existence in the mid-19th century. But actually, surgery becomes a lot more dangerous immediately following this because the surgeon is more willing to pick up the knife."}, {"type": "text", "content": "0:07:52.4 SC: Oh, sure.\n\n0:07:52.5 LF: He's more willing to go deeper into the body, right? And so he's no longer fighting you on that table. So he's more willing to do it, but he still doesn't understand germs. And that is the focus of my first book, 'The Butchering Art', which is about this guy named Joseph Lister, who people sort of know through Listerine, but he didn't create Liste
