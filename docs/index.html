<style>
:root {
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: #000;
  color: #f5f5f5;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
a { color: inherit; }

.topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  background: rgba(0,0,0,0.92);
  border-bottom: 1px solid #262626;
  backdrop-filter: blur(6px);
}
.wordmark {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.icon-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: #f5f5f5;
  padding: 6px;
  display: flex;
  align-items: center;
}
.icon-btn svg { width: 24px; height: 24px; }

.tabs {
  display: flex;
  gap: 6px;
  padding: 10px 14px;
  border-bottom: 1px solid #1c1c1c;
}
.tab-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: #888;
  font-size: 13.5px;
  font-weight: 600;
  padding: 7px 16px;
  border-radius: 999px;
}
.tab-btn.active {
  color: #fff;
  background: #1e1e1e;
}

main {
  max-width: 470px;
  margin: 0 auto;
  padding-bottom: 60px;
}

.post {
  border-bottom: 1px solid #1c1c1c;
  padding: 14px 0 22px;
  margin-bottom: 8px;
}
.post-header {
  display: flex;
  align-items: center;
  padding: 0 14px 10px;
  gap: 10px;
}
.avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #333;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  color: #ccc;
  flex-shrink: 0;
}
.header-text {
  display: flex;
  flex-direction: column;
  line-height: 1.25;
  min-width: 0;
}
.source-name {
  font-weight: 600;
  font-size: 13.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.header-meta {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.tag-pill {
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 999px;
  background: #1e1e1e;
  color: #aaa;
  border: 1px solid #2c2c2c;
  white-space: nowrap;
}
.timestamp {
  font-size: 12px;
  color: #8a8a8a;
  white-space: nowrap;
}

.media {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  background: #0c0c0c;
  overflow: hidden;
}
.carousel-track {
  display: flex;
  height: 100%;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.carousel-track::-webkit-scrollbar { display: none; }
.panel {
  min-width: 100%;
  scroll-snap-align: start;
  scroll-snap-stop: always;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
  overflow-y: auto;
}
.panel img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.panel-text {
  font-size: 15px;
  line-height: 1.6;
  white-space: pre-wrap;
  color: #eee;
  align-self: flex-start;
  margin: auto 0;
}
.panel-snippet {
  display: flex;
  flex-direction: column;
  gap: 14px;
  align-self: center;
}
.panel-snippet p {
  font-size: 15px;
  line-height: 1.6;
  color: #eee;
  margin: 0;
}
.read-more {
  font-size: 13.5px;
  font-weight: 600;
  color: #4ea1ff;
  text-decoration: none;
}

.dots {
  position: absolute;
  bottom: 10px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 5px;
}
.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,0.35);
}
.dot.active { background: #fff; }

.post-footer {
  display: flex;
  align-items: center;
  padding: 10px 14px 0;
  gap: 12px;
}
.save-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: #f5f5f5;
  padding: 4px;
  margin-left: auto;
}
.save-btn svg { width: 22px; height: 22px; }
.caption {
  padding: 8px 14px 0;
  font-size: 13.5px;
  color: #ccc;
  line-height: 1.5;
}
.caption .caption-source {
  font-weight: 600;
  color: #f5f5f5;
  margin-right: 6px;
}
.caption a {
  color: #4ea1ff;
  text-decoration: none;
}
.caption-body {
  margin-top: 6px;
}

.hidden { display: none; }
#saved-view {
  display: none;
}
#saved-view.active { display: block; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }
.empty-state {
  text-align: center;
  color: #777;
  padding: 60px 20px;
  font-size: 14px;
}
.saved-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 4px 14px 14px;
}
.saved-header h2 {
  font-size: 16px;
  margin: 0;
}
</style>

on arises: is consciousness confined to the present? It is thought that forms of the A-theory are implausible if they imply that n", "read_more_url": "https://philpapers.org/rec/BUIWTP", "read_more_source": "PhilPapers"}], "text_post": false}, {"id": "0b139f237f7c1ea9", "title": "Niami, Morteza (ed.): TIME", "url": "https://philpapers.org/rec/NIATQK", "source": "PhilPapers", "tag": "philosophy", "published_at": "2026-11-18T14:44:08.174741+00:00", "panels": [{"type": "snippet", "content": "In this paper, I formulate a meta-ontological thesis concerning the relationship between Being, beings, and time. My central proposition is that Being is atemporal, whereas beings are temporal. I establish a conceptual distinction between the ontological status of Being and the temporal constitution of finite entities. Within this framework, I examine four interconnected dimensions: the temporality of beings, the existential temporality of Dasein, the temporal structure of ontological disclosure, and the atemporal status of Being. I understand time as a constitutive dimension of finite existen", "read_more_url": "https://philpapers.org/rec/NIATQK", "read_more_source": "PhilPapers"}], "text_post": false}, {"id": "7c7e5226df0ab628", "title": "The Real-Life City That Inspires Grand Theft Auto VI", "url": "https://www.nytimes.com/2026/11/18/arts/grand-theft-auto-vi-miami-florida.html", "source": "The New York Times", "tag": "news", "published_at": "2026-11-18T14:30:46+00:00", "panels": [{"type": "snippet", "content": "“Vice City,” where the latest installment of the video game is set, is a stand-in for Miami in all its sunny, sexy, gritty and neon glory.", "read_more_url": "https://www.nytimes.com/2026/11/18/arts/grand-theft-auto-vi-miami-florida.html", "read_more_source": "The New York Times"}], "text_post": false}, {"id": "b1a28720a6b67989", "title": "Nvidia Has No Plans to Bring Back Jensen Huang", "url": "https://www.nytimes.com/2026/11/17/business/nvidia-earnings-jensen-huang.html", "source": "The New York Times", "tag": "news", "published_at": "2026-11-18T14:24:35+00:00", "panels": [{"type": "snippet", "content": "As the former chief executive and his allies lobbied for his return, the company’s chair said the board “does not intend to reinstate Jensen as C.E.O.”", "read_more_url": "https://www.nytimes.com/2026/11/17/business/nvidia-earnings-jensen-huang.html", "read_more_source": "The New York Times"}], "text_post": false}, {"id": "c89ce204e8d92ddb", "title": "Infinite regresses of choices and responsibility", "url": "https://alexanderpruss.blogspot.com/2026/11/infinite-regresses-of-choices-and.html", "source": "Alexander Pruss's Blog", "tag": "philosophy", "published_at": "2026-11-18T14:17:30+00:00", "panels": [{"type": "snippet", "content": "Some people (e.g., Galen Strawson) are worried that to have genuine\ncontrol over your character, you need to have made an infinite regress\nof choices, since you’d need to control the character out of which you\nmade your choice. I reject those arguments, but the point of this post\nis different: it is to argue that an infinite regress doesn’t help. Let’s play with a toy model of free will in an infinite life. Your\ncharacter quality is quantified by a number q between − ∞ and + ∞ . This is the log of the likelihood ratio\nof your choosing rightly. The probability of your choosing rightly then\nis e", "read_more_url": "https://alexanderpruss.blogspot.com/2026/11/infinite-regresses-of-choices-and.html", "read_more_source": "Alexander Pruss's Blog"}], "text_post": false}, {"id": "58e1b97b705f0887", "title": "House Democrats Cast Wide Net as They Prepare Trump Investigations", "url": "https://www.nytimes.com/2026/11/18/us/politics/democrats-cast-investigative-net.html", "source": "The New York Times", "tag": "news", "published_at": "2026-11-18T14:17:26+00:00", "panels": [{"type": "snippet", "content": "The inquiries would focus on President Trump, his family and top officials in his administration and would include a look at Commerce Secretary Howard Lutnick and policies related to Nvidia.", "read_more_url": "https://www.nytimes.com/2026/11/18/us/politics/democrats-cast-investigative-net.html", "read_more_source": "The New York Times"}], "text_post": false}, {"id": "384ddea7991099a3", "title": "\"It’s hard not to worry\": Even as GTA 6 launches on console amid glowing reviews, Rockstar devs are already concerned about getting laid off", "url": "https://www.rockpapershotgun.com/its-hard-not-to-worry-even-as-gta-6-launches-on-console-amid-glowing-reviews-rockstar-devs-are-already-concerned-about-getting-laid-off", "source": "Rock Paper Shotgun", "tag": "fun", "published_at": "2026-11-18T14:04:00+00:00", "panels": [{"type": "snippet", "content": "GTA 6 launches on console today. It's widely expected to sell more copies than main character Lucia Caminos has skin pores , more copies than there are words even in Eurogamer's five-star review , which I believe Chris Tapsell has written specifically to exhaust and destroy such neurones as I have remaining. And yet, staff at Rockstar Games are apparently worrying about being laid off, as development winds down and investors start to bicker about Line Going Up Even More. In an article supporting this month's union vote at Rockstar North, one of the game's animation programmers argues that \"wor", "read_more_url": "https://www.rockpapershotgun.com/its-hard-not-to-worry-even-as-gta-6-launches-on-console-amid-glowing-reviews-rockstar-devs-are-already-concerned-about-getting-laid-off", "read_more_source": "Rock Paper Shotgun"}], "text_post": false}, {"id": "32b1a733e6973204", "title": "Mini-Heap", "url": "https://dailynous.com/2026/11/18/mini-heap-738/", "source": "Daily Nous", "tag": "philosophy", "published_at": "2026-11-18T13:41:19+00:00", "panels": [{"type": "text", "content": "Links links links…"}, {"type": "image", "src": "https://dailynous.com/wp-content/uploads/2022/01/miniheap-7-darkmode-compatible-1024x622.png", "alt": ""}, {"type": "text", "content": "Mini-Heap posts usually appear when several new items accumulate in the Heap of Links , a collection of items from around the web that may be of interest to philosophers. The Heap of Links consists partly of suggestions from readers; if you find something online that you think would be of interest to the philosophical community, please send it in for consideration for the Heap. Thank you. Previous edition .\n\nThe post Mini-Heap appeared first on Daily Nous ."}], "text_post": false}, {"id": "3a0106b8a6ccf9f8", "title": "SteamDB will add \"affiliate links to authorised game retailers\" and a new tab dedicated to mods, first update since Nexus Mods takeover confirms", "url": "https://www.rockpapershotgun.com/steamdb-will-add-affiliate-links-to-authorised-game-retailers-and-a-new-tab-dedicated-to-mods-first-update-since-nexus-mods-takeover-confirms", "source": "Rock Paper Shotgun", "tag": "fun", "published_at": "2026-11-18T13:25:50+00:00", "panels": [{"type": "snippet", "content": "In a first substantial update since acquiring SteamDB from its founders back in September, the owners of Nexus Mods have outlined some new additions coming to , the two sides in the deal have announced some additions coming to the community-run backend database. Affiliate links aimed at providing options to help folks find the cheapest price for a game and a new tab dedicated to the mods Nexus host for a game are incoming, as work on behind-the-scenes improvements continues. Read more", "read_more_url": "https://www.rockpapershotgun.com/steamdb-will-add-affiliate-links-to-authorised-game-retailers-and-a-new-tab-dedicated-to-mods-first-update-since-nexus-mods-takeover-confirms", "read_more_source": "Rock Paper Shotgun"}], "text_post": false}, {"id": "c144cedf9639f86e", "title": "My most “boomer” take.", "url": "https://www.readtangle.com/my-most-boomer-take/", "source": "Tangle", "tag": "news", "published_at": "2026-11-18T13:13:31+00:00", "panels": [{"type": "image", "src": "https://images.unsplash.com/photo-1617795541270-8f19a2b03ae6?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3wxMTc3M3wwfDF8c2VhcmNofDF8fHBvbGl0ZXxlbnwwfHx8fDE3OTUwMDc3MTl8MA&ixlib=rb-4.1.0&q=80&w=2000", "alt": "My most “boomer” take."}, {"type": "text", "content": "I ’ m Isaac Saul, and this is my semi-regular newsletter A Grain of Saul.\n\nAt every wedding I’ve ever been to, I’ve found myself on the verge of crying (or actually crying) at one specific moment: When attendees stand for the bride as she comes down the aisle.\n\nThere’s something about the sound of everyone realizing she’s there; a quiet audience suddenly rustling to attention, the collective noise of chairs adjusting and suits opening and feet shuffling and the wave of bodies moving; how we all turn toward the back, and there she is — teary-eyed and bashful and, usually, the most radiant and beautiful you’ve ever seen her.\n\nIt feels ancient, like something humans have done for centuries, though I have no idea how modern the custom is. When my own bride came down the aisle, and 100 of our closest family and friends stood up to turn and look at her, each smiling and full of love, the two of us made eye contact, and I started crying immediately. It took a great deal of willpower not to break down sobbing and give up on making it through the ceremony."}, {"type": "image", "src": "https://storage.ghost.io/c/4a/93/4a939b47-6a19-4b38-a13c-89d5a0f0d6dd/content/images/2026/11/data-src-image-87d7c6bc-947d-4c5b-9f2a-0158b7a43c6a.jpeg", "alt": "My most “boomer” take."}, {"type": "text", "content": "I’m not usually sentimental about these sorts of things, and I don’t have a great explanation for why this moment gets me every time, but it does. The truly magical part is that there’s no rule about standing when a bride comes down the aisle. There’s no law. It’s not typically written anywhere. It doesn’t show up on the invitation and it does not require a wedding officiant’s instruction. It just happens . It’s the norm. When you see the bride appear at the back of a wedding, you get off your butt and stand at attention; everyone knows this. Imagining a future where we’ve forgotten that norm and nobody stands for the bride is genuinely horrifying to me.\n\nYet, there are plenty of norms like this we are leaving in the dust."}, {"type": "text", "content": "It’s not novel to suggest social norms do a great deal to hold society together, or to suggest fewer people are adhering to them as time goes on. Perception polls consistently find that U.S. adults think people are getting ruder; 47% of U.S. adults say public behavior is ruder now than before the pandemic (compared to 44% who say it’s the same and 9% who say it's more polite). A 2025 IW Group study found 53% of Americans describe society as uncivil versus 26% who call it civil. Similarly, 85% of Americans think civility is worse now than it was 10 years ago, according to the American Bar Association.\n\nBut it’s also possible, and just as interesting, that this may just be one giant delusion. Mastroianni and Gilbert’s famous 2023 paper “The illusion of moral decline” found that people all over the world have believed morality — defined as “kindness, honesty and basic human decency” — was declining for as long as researchers have asked the question. Yet people’s reports on their contemporaries’ morality have not declined over time. So: Ask someone if people are generally kind, honest and decent, and they say yes — and those numbers hold steady (and typically high) over time. But ask someone whether kindness, honesty and decency are declining, and they say yes — and have said yes in every decade researchers have asked."}, {"type": "text", "content": "It doesn’t add up.\n\nFurthermore, respondents perceived more decline if you asked them about decline over longer periods of time (like decades instead of years), suggesting that nostalgia — not evidence — drove their perceptions.\n\nSo which is it? I happen to think some explanations comport with both public perception of moral decline and the relative moral stability people report: Either people are right that the bar is dropping overall, but fail to notice it in their daily lives; or people are just as kind, but have shed the ritual norms they used to use to express that kindness. I suspect it’s some of both.\n\nI’ll give you an example: A few months ago I was walking down the street with my wife. After we crossed to a new block, I repositioned to get on the street side of her, as I always do, which was an act of courtesy she taught me when I was 24 and we’d just started dating. I still remember vividly her saying “you’re on the wrong side” on one of our first dates, and the embarrassment flooding through to my fingertips in a way that committed me to never again being on the wrong side of this woman I had a very, very big crush on."}, {"type": "text", "content": "As we continued down the sidewalk, an older man sitting in a chair outside his shop said, “You don’t see that much anymore! A man on the right side of his woman!” He laughed. Phoebe took the opportunity to quip that she’d had to teach me that, and we all carried on for a moment, but there was something revealing in it: This older shopkeeper-type, who spends his whole day outside watching people walk by, was genuinely struck by seeing a man move to walk on the street side of his date.\n\nSo: If you asked Americans today if men treated the women they dated with respect, maybe roughly the same percentage would say “yes” as people 30 years ago did. But would men be meeting the same standard, like always staying on the street side of their dates? I doubt it. I think that’s how the two observations of Mastroianni and Gilbert’s study — the perception of constantly declining morality and the stability of reports of good behavior — can coexist. Is some nostalgia at play? For sure. But is the bar falling, also? I think so."}, {"type": "text", "content": "I don’t mean to be a Scrooge here, and I know this all reads like the old-man-screaming-at-cloud meme."}, {"type": "image", "src": "https://storage.ghost.io/c/4a/93/4a939b47-6a19-4b38-a13c-89d5a0f0d6dd/content/images/2026/11/data-src-image-928982a5-a7e5-4f62-9867-698857666824.png", "alt": "My most “boomer” take."}, {"type": "text", "content": "In truth, I’m pretty optimistic about society. I’m fond of asking, “Where are all the lunatics and assholes?” I read about them every day. I encounter them on social media, see clips of them on the internet, and they turn up each night on the evening news. But I rarely ever run into them in my day-to-day life. My neighbors are normal and kind. Strangers are almost uniformly generous, friendly, and helpful. When I travel, people are exceedingly decent and polite most of the time.\n\nThe worst thing anyone has done to me in the last week was slow down from 65 miles per hour to a complete stop on I-95 North while trying to switch lanes, which nearly caused a multi-car pileup behind me and would have left my car crumpled with my pregnant wife and 2-year-old son aboard. But I don’t think the person who did that is a bad person, just a horrific driver. And hey, they had their turn signal on!"}, {"type": "text", "content": "Even the people I see on a regular basis who are in distress — maybe experiencing a mental health crisis, homeless, or in some kind of personal dispute — seem far more in need of care or generosity than threatening or cruel. I’m optimistic about society in these ways.\n\nBut I also think some valuable norms have degraded.\n\nFor the last few months I’ve been thinking hard about the cultural norms that I really love, the ones I see regularly broken, and the ones I very much want to revive. So I figured I’d collect and share them, as an act of wishing them back into prominence.\n\nHere are a few:\n\nStand to greet a person when they enter the room. Refer to strangers or parents’ friends as Mr. and Mrs., and elders as sir and ma’am. If you’re with someone and you run into a person you know, introduce the person you are with so they don’t stand there awkwardly observing your conversation. Say hello to neighbors and people you pass on the street."}, {"type": "text", "content": "Walk slowly and try not to rush past an elderly person in front of you, or wait for the end of the block to do so. Offer to walk them across the street. Never show up empty-handed to a dinner. When a guest arrives at your house, offer them something to drink. Do this for everyone — including, say, a plumber who has come to fix the toilet. Walk a guest to the door when they leave. RSVP to invitations and actually show up if you said “yes.” When someone dies, gets seriously ill, or welcomes a child, deliver a meal.\n\nNo phones at the dinner table. No hats at the dinner table. No eating until the host or the oldest sits, or until everyone has their food. Offer a moment of gratitude or prayer before the meal starts — any kind of pause will do. If you’re in a host’s home, offer to help clear the table and clean up when the meal is over."}, {"type": "text", "content": "In public: Hold doors, especially elevators. Give up your seat to the elderly, pregnant women, and anyone with disabilities or kids. Let people off the elevator or train before you get on. For the love of god, please put your headphones on or mute the volume on your phone. Wave thanks to drivers who let you go ahead of them. Return your shopping cart to the little shopping cart parking spot (that’s why it’s there). When you’ve finished making a mess all over yourself at the movies, airport gate or the park, take two minutes to clean it up before leaving. Don’t litter, unless you want to go straight to the underworld upon your death.\n\nShow respect to service workers: waiters, bartenders, cashiers, and flight attendants. Don’t say “hey!” or “yo!” or snap or, as I saw one man do last week, whistle to get their attention. They are not Dobermans. “Miss” or “sir” or “excuse me” with an outstretched hand will do. Say please and thank you. Tip fairly. Make eye contact when you order. Acknowledge them when they refill your drink or clear your plate."}, {"type": "text", "content": "Don’t ghost job candidates or job interviews or dates or friends. Just don’t ghost people. Give (at least) a two-week notice before quitting a job. Write thank-you notes. Call (don’t text) with big news, condolences, or apologies. Try not to curse in front of the elderly or strangers, and definitely don’t curse in front of children. You can, however, ignore children who try to interrupt adults mid-conversation (they can learn to wait their turn).\n\nSome norms, thankfully, seem to be gaining ground, at least in what people say they expect: Asking permission to photograph someone before taking their picture. Taking your shoes off inside someone’s home before they ask you to (or keeping them on if that’s their preference). Respecting physical boundaries, especially in the workplace. This is good. Reversing the trend on the others would be great."}, {"type": "text", "content": "With any luck, a revitalization of these cultural norms could spread upward to our politics. I continue to predict a return to decency , and I think we’ve got a growing amount of evidence it’s coming. But just as our politicians can spread incivility to us, the people can build some momentum that rubs off on them. Our politics are infused with norms and rules that are unwritten or unenforceable, each of them becoming less common by the day.\n\nMost are rooted in a spirit of honoring the office or the country, not the officeholder or the state of the country. Thank veterans for their service. Hand on the heart for the pledge, hat off for the anthem, actually observe moments of silence (there is really no need to start a “USA!” chant). Stand for the president and refer to them as the president, regardless of how you feel. If someone has served as a member of Congress, governor or judge, refer to them as “representative” or “senator” or “governor” or “judge” even if they no longer hold that office."}, {"type": "text", "content": "Let’s start there; then maybe we can get back to normal judicial nominee processes or redistricting schedules or accepting the results of elections or respectfully listening to the State of the Union.\n\nThink about it this way: We don’t stand for the bride, exactly; half the room barely knows her. We are standing for the promise about to be made. We are standing to honor the idea that a bride arriving deserves a room on its feet. Norms honor ideas that are bigger than one person, and they are passed on by honorably adhering to them in public. Nobody taught me to stand for the bride. I watched a room full of adults do it, wedding after wedding, until it was something I did, too.\n\nThat’s how norms work, and it’s also how they can disappear. They just get practiced a little less, then a little less, until one day a room full of people stays seated when the bride walks in and nobody notices that anything is wrong."}, {"type": "text", "content": "So pick a few norms and perform them proudly, where the people can see you. Somebody’s watching. Sometimes it’s an old man in a chair outside his shop. Sometimes it’s the next generation with an open mind about how the world should work.\n\nThanks for reading. We made today’s edition of A Grain of Saul free to all readers, but if you enjoyed it and got this far — and want to read more like it — you can become a Tangle member to unlock future editions ."}], "text_post": false}, {"id": "fe4c1daff70c4d33", "title": "Kuwait says it repelled first Iranian attack in two months after US strikes island", "url": "https://www.bbc.co.uk/news/articles/cw4gn9jeqjq7o?at_medium=RSS&at_campaign=rss", "source": "BBC News", "tag": "news", "published_at": "2026-11-18T13:04:48+00:00", "panels": [{"type": "snippet", "content": "Bahrain says it was also attacked by Iran following a US air strike on the Iranian island of Qeshm in the Gulf on Tuesday.", "read_more_url": "https://www.bbc.co.uk/news/articles/cw4gn9jeqjq7o?at_medium=RSS&at_campaign=rss", "read_more_source": "BBC News"}], "text_post": false}, {"id": "16dbbb8495637bc2", "title": "Russia and Ukraine are bombing bridges. Who’s winning?", "url": "https://www.economist.com/europe/2026/11/18/russia-and-ukraine-are-bombing-bridges-whos-winning", "source": "The Economist", "tag": "news", "published_at": "2026-11-18T12:56:18+00:00", "panels": [{"type": "snippet", "content": "A setback for Russia in Crimea, but damage in Kyiv may matter more", "read_more_url": "https://www.economist.com/europe/2026/11/18/russia-and-ukraine-are-bombing-bridges-whos-winning", "read_more_source": "The Economist"}], "text_post": false}, {"id": "591d82ee7e715012", "title": "Chronicles: Medieval devs Raw Power are bankrupt, but their sandbox RPG lives on at a new studio co-founded by Satisfactory devs Coffee Stain", "url": "https://www.rockpapershotgun.com/chronicles-medieval-devs-raw-power-are-bankrupt-but-their-sandbox-rpg-lives-on-at-a-new-studio-co-founded-by-satisfactory-devs-coffee-stain", "source": "Rock Paper Shotgun", "tag": "fun", "published_at": "2026-11-18T12:53:00+00:00", "panels": [{"type": "snippet", "content": "Goat Simulator and Satisfactory outfit Coffee Stain Group have bought the intellectual property rights and assets for Chronicles: Medieval, the Tom Hardy-garnished strategy RPG that was originally in development at now-bankrupt Raw Power Games. The game will now be made by a new developer, owned 25% by a few former Raw Power devs and 75% by Coffee Stain. Coffee Stain will fund the game's on-going development. Read more", "read_more_url": "https://www.rockpapershotgun.com/chronicles-medieval-devs-raw-power-are-bankrupt-but-their-sandbox-rpg-lives-on-at-a-new-studio-co-founded-by-satisfactory-devs-coffee-stain", "read_more_source": "Rock Paper Shotgun"}], "text_post": false}, {"id": "b5d9fc790ede49db", "title": "Drawing on 2027", "url": "https://www.economist.com/the-world-ahead/2026/11/18/drawing-on-2027", "source": "The Economist", "tag": "news", "published_at": "2026-11-18T12:50:28+00:00", "panels": [{"type": "snippet", "content": "A lighter look at the year ahead", "read_more_url": "https://www.economist.com/the-world-ahead/2026/11/18/drawing-on-2027", "read_more_source": "The Economist"}], "text_post": false}, {"id": "6410aec0c5fbb2ef", "title": "Our selection of events around the world", "url": "https://www.economist.com/the-world-ahead/2026/11/18/our-selection-of-events-around-the-world", "source": "The Economist", "tag": "news", "published_at": "2026-11-18T12:49:33+00:00", "panels": [{"type": "snippet", "content": "", "read_more_url": "https://www.economist.com/the-world-ahead/2026/11/18/our-selection-of-events-around-the-world", "read_more_source": "The Economist"}], "text_post": false}, {"id": "eba19e73279e3cc9", "title": "Trump shakes hands with Putin and Xi ahead of historic talks in China", "url": "https://www.bbc.co.uk/news/articles/ck9d75x5wwwwo?at_medium=RSS&at_campaign=rss", "source": "BBC News", "tag": "news", "published_at": "2026-11-18T12:39:24+00:00", "panels": [{"type": "snippet", "content": "The three leaders will meet together for the first time on Thursday during a closely-watched summit.", "read_more_url": "https://www.bbc.co.uk/news/articles/ck9d75x5wwwwo?at_medium=RSS&at_campaign=rss", "read_more_source": "BBC News"}], "text_post": false}, {"id": "46636320fe4b8fbb", "title": "Bancroft sandpaper claims heap pressure on Cummins", "url": "https://www.bbc.co.uk/sport/cricket/articles/cmqlqdevgl9ro?at_medium=RSS&at_campaign=rss", "source": "BBC News", "tag": "news", "published_at": "2026-11-18T11:12:46+00:00", "panels": [{"type": "snippet", "content": "Cameron Bancroft claims the whole Australia team knew about the 2018 sandpaper plot in explosive revelations that will heap pressure on current captain Pat Cummins.", "read_more_url": "https://www.bbc.co.uk/sport/cricket/articles/cmqlqdevgl9ro?at_medium=RSS&at_campaign=rss", "read_more_source": "BBC News"}], "text_post": false}, {"id": "4070f8bb4cb83885", "title": "Dreams of birds", "url": "https://aeon.co/videos/a-physicists-audacious-plan-to-teach-birds-long-lost-songs", "source": "Aeon", "tag": "philosophy", "published_at": "2026-11-18T11:01:00+00:00", "panels": [{"type": "snippet", "content": "When bird populations decline, certain songs may be lost forever. One physicist’s mission is to revive lost melodies - by Aeon Video Watch on Aeon", "read_more_url": "https://aeon.co/videos/a-physicists-audacious-plan-to-teach-birds-long-lost-songs", "read_more_source": "Aeon"}], "text_post": false}, {"id": "f90fbc52dc425474", "title": "Traces of home", "url": "https://psyche.co/turning-points/a-screenshot-is-precious-when-my-family-in-iran-is-out-of-reach", "source": "Psyche", "tag": "philosophy", "published_at": "2026-11-18T11:00:00+00:00", "panels": [{"type": "snippet", "content": "When war cut the link to my family in Iran, the smallest glimmer of their life became dear to me - by Elaheh Shabani Afarani Read on Psyche", "read_more_url": "https://psyche.co/turning-points/a-screenshot-is-precious-when-my-family-in-iran-is-out-of-reach", "read_more_source": "Psyche"}], "text_post": false}, {"id": "24e6b6c84bc15c9e", "title": "They Were Just Admitted to the Bar. Now They’re Federal Prosecutors. Meet Trump’s New DOJ.", "url": "https://www.propublica.org/article/federal-prosecutors-hiring-trump-doj", "source": "ProPublica", "tag": "news", "published_at": "2026-11-18T11:00:00+00:00", "panels": [{"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/ACTUAL-final-sorry-2.jpg?w=1149", "alt": "An illustration shows several young individuals in business attire walking up the stairs of a building that has the words “Department of Justice” inscribed to the left of an open door. A banner of President Donald Trump’s face hangs above the doorway, while several older individuals walk down the stairs, away from the building with boxes in their hands."}, {"type": "text", "content": "In early October, a recent law school graduate shared a post on LinkedIn that would have been unheard of before the second Trump administration.\n\nAfter passing the bar exam, 29-year-old Preston Bigley wrote, “With this milestone complete, I will begin serving as an Assistant United States Attorney in the Criminal Division of the U.S. Attorney’s Office for the Western District of Texas.”\n\nIt was a remarkable achievement, considering Bigley had graduated from Texas A&M’s law school in May and had been hired by the Justice Department in August to be, as his resume notes, an “incoming” assistant U.S. attorney. That unusual title was followed by an unusual caveat: “pending bar admission.” Once officially licensed to practice the law, he updated his profile to show he had become a bona fide federal criminal prosecutor."}, {"type": "text", "content": "Bigley is one of a growing cohort of inexperienced attorneys, many of them fresh out of law school, who are being fast-tracked to fill the shoes of seasoned career prosecutors who fled or were purged from the DOJ in President Donald Trump’s second term. That brain drain, amounting to thousands of years of experience, comes as prosecutions of fraud and drugs have fallen in key districts to make way for Trump’s immigration agenda, ProPublica found.\n\nAcross the country, ProPublica identified more than 50 new assistant U.S. attorneys with less than three years of experience who traditionally wouldn’t have been considered for such vital positions, legal experts said. Some were hired with the intent to anoint them as prosecutors — once they pass the bar exam, public disclosures show."}, {"type": "text", "content": "That figure is likely a fraction of the actual total, as a comprehensive analysis is impossible because DOJ staff identities are redacted in government personnel data . But of those ProPublica identified through bar membership records and social media, about 20 passed the bar within the last year. At least seven were in the same May graduating class as Bigley, from a range of schools.\n\n“The fact that the DOJ is hiring, and indeed actively recruiting, right out of law school — it’s an astounding break with past practice,” said Juliet Sorensen, a Loyola University Chicago law professor and former assistant U.S. attorney. “It reflects a lowering of standards for a job that is important and requires lawyers who are meticulous, committed to doing the right thing, and bring with them experience beyond just law school.”"}, {"type": "text", "content": "To understand how Trump transformed the DOJ, ProPublica examined federal court data and records, federal workforce and state bar information, and social media accounts. We also interviewed more than two dozen former assistant U.S. attorneys.\n\nMore than half of those who left the Justice Department in Trump’s first 18 months boasted nine-plus years of legal experience. Those who left had spent, on average, more than 13 years working for the government, the analysis shows. Those more experienced attorneys were the ones most likely to take on complex cases, such as money laundering, organized crime and drug trafficking, legal experts say and court dockets show.\n\nProPublica shared its analysis and detailed questions with the DOJ; the department did not respond. Previously, the DOJ said it “remains committed to investigating and prosecuting all types of crime.”"}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/wTitC-.png?w=752", "alt": "Bar chart comparing assistant U.S. attorney departures and hires by years of legal experience. Departures far outpaced hires among the most experienced staff: About 1,100 employees with nine or more years left, while over 400 were hired. Supervisors saw a similar gap, with about 350 departures and few hires. Hires outpaced departures for the least experienced groups. "}, {"type": "text", "content": "The DOJ has long hired recent graduates through its Honors Program, which places graduates into rigorous training through the main office in Washington, but experts say the program was small and not meant to replace prosecutors.\n\nBefore Trump’s second term, the DOJ typically would not hire new prosecutors unless they had a minimum of three to five years of legal experience, former officials and law professors said. That standard is gone. Earlier this year, Bloomberg Law reported , the DOJ waived a policy requiring at least one year of experience.\n\nWhile private law firms routinely hire promising graduates before they pass the bar exam, typically to begin their training, the DOJ’s hiring of new grads is a striking departure from its once-rigorous hiring process, said University of Michigan law professor Barbara McQuade, a former U.S. attorney for the Eastern District of Michigan."}, {"type": "text", "content": "“The people who I hired came to us as partners in law firms,” said McQuade, who was appointed by President Barack Obama. “These were superstars who had been very successful at large law firms or in state court prosecutors’ offices.”\n\nTrump’s creation of a less experienced DOJ will have longstanding consequences, McQuade said.\n\n“It means that some very serious crimes will go unpunished,” she said. “It takes experienced prosecutors at the federal level to bring down corporate fraud, transnational gangs and corrupt public officials.”\n\nWhile experts expressed concern, some of those benefiting from the law school-to-federal prosecutor pathway have voiced excitement on LinkedIn. “I look forward to beginning my DOJ career by serving the Del Rio Division,” wrote Jacquelyn Kilcommons, who graduated from Pace University’s law school in May. “Upon receiving my bar exam results, I will transition into an Assistant United States Attorney (AUSA) position.”"}, {"type": "text", "content": "As he announced his new role in the district of Washington, D.C., newly graduated assistant U.S. attorney Ellis O’Donnell wrote, “In the past few months I have had the honor to graduate from Vanderbilt University Law School and to sit for and pass the Wisconsin Bar Exam.” None of the recent law school graduates responded to requests for comment.\n\nThe departure of assistant U.S. attorneys in Trump’s second administration marks the largest number of exits two years into a presidential term in at least two decades.\n\nBeyond the personnel turnover, the administration’s priorities have shifted since Trump retook the White House, an analysis of Federal Judicial Center data shows.\n\nAs immigration cases shot up nationwide, felony fraud prosecutions fell sharply in key districts. Amid an exodus of prosecutors in the Western District of Virginia, for instance, fraud cases fell 66%. Those cases dropped 14% in the Southern District of Florida, a hotbed for white-collar crime, where many prosecutors have left in protest of Trump’s retribution campaign against people deemed political enemies. Nationally, drug prosecutions have fallen about 10% in Trump’s first 18 months and fraud cases are flat."}, {"type": "text", "content": "Meanwhile, the number of people facing immigration-related charges skyrocketed by almost 50%, clogging the courts and depleting resources at U.S. attorneys’ offices nationwide. Even in border districts where immigration proceedings can dominate the caseload, prosecutions have risen dramatically. For instance, New Mexico and the Southern District of California saw 300% and 125% increases in immigration cases, respectively, the ProPublica analysis shows. In the Western District of Texas, where Bigley and at least two other recent graduates just became prosecutors, immigration cases have surged at least 36%.\n\nThe immigration caseload, including tens of thousands of unlawful-detention cases filed in civil court, has strained the department so severely that the DOJ has drafted hundreds of attorneys from other federal agencies and the military to keep up, former officials said."}, {"type": "text", "content": "Those cases coincided with violent deportation sweeps led by masked immigration agents, who killed U.S. citizens , and the nationwide protests that sprouted up in response. Many of the cases Trump’s DOJ brought against people protesting immigration authorities’ actions fell apart, a ProPublica analysis showed . The news organization also reported how the truthfulness of Trump’s prosecutors has come under question in courts across the country. The DOJ previously said its attorneys “represent the United States with integrity.”\n\nAmid the unrest, ProPublica has tracked nearly 100,000 habeas corpus petitions filed by immigrants arguing that their detentions were unjust. In each case, an assistant U.S. attorney must defend the government’s position, a task that had some U.S. attorneys reassigning veteran lawyers — experts in financial crimes, civil rights and human trafficking — to immigration. In Washington state, an acting U.S. attorney said he’s so overbooked with unlawful-detention petitions, his office cannot handle every case ."}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/GettyImages-2276715671.jpg?w=2560", "alt": "A bearded man in a blue suit and red tie speaks at a podium while flanked by another man in a blue suit and red tie to his right, and a woman in a blue business suit and red blouse to his left. Three flags are seen behind the individuals."}, {"type": "text", "content": "In South Florida, where an exodus of veteran lawyers presaged a drop in fraud and financial crime cases, one former white-collar crimes prosecutor said he and his colleagues could not decline an immigration case without permission from U.S. Attorney Jason Reding Quiñones, who abruptly resigned this month. Before his resignation, Quiñones had led the “grand conspiracy” investigation targeting former officials Trump alleged were part of a “deep state” plot against him.\n\n“Every case takes time, and you want to put in effort, and now you’re wasting your time on cases you don’t believe in or think are unjust,” said the former prosecutor, who spoke on the condition of anonymity because he hopes to return to the Justice Department after Trump leaves office. “It affects morale.”"}, {"type": "text", "content": "In recent months, the DOJ has ramped up efforts to recruit lawyers to replace the lost expertise, government data and the department’s recruiting materials show.\n\nWhile Justice Department personnel data is kept secret, assistant U.S. attorneys are paid on a unique pay scale set by the attorney general, a quirk that dates to the 1950s and distinguishes them from other civil servants. By tracking the number of people compensated this way, it is possible to obtain broad data on the numbers of assistant U.S. attorneys.\n\nAs of January 2025, the department employed about 6,200 assistant U.S. attorneys, the data shows. Then Trump’s so-called Department of Government Efficiency took a hatchet to the Justice Department and other federal agencies. Led by the world’s richest man, Elon Musk, DOGE offered employees financial packages to resign from the federal government by September 2025. About 1 in 10 of all assistant U.S. attorney departures were part of that offer, the data suggests."}, {"type": "text", "content": "The ranks shrank much faster than the department anticipated, former officials said, and it was unable to hire sufficient replacements. By the end of January 2026, the DOJ lost over 1,300 assistant U.S. attorneys and replaced only about 470 of those attorneys.\n\nFor most of the past two decades, quarterly AUSA departures held fairly steady until Trump’s reelection, when they peaked at nearly 500 departures in the second quarter of 2025."}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/9iFWv-more-assistant-u.s.-attorneys-have-departed-the-department-of-justice-under-trump-than-at-any-time-in-at-least-two-decades-.png?w=752", "alt": "Line chart showing Justice Department hires and departures from 2005 through 2026. For most of the past two decades, departures held fairly steady while hires swung up and down, often outpacing departures. Around the start of the second Trump administration, departures spiked to by far their highest level since at least 2005 before falling back toward historical levels."}, {"type": "text", "content": "The DOJ began turning to novice attorneys to fill the empty desks.\n\nIn early 2026, a former White House official shared a post on X, the social media platform owned by Musk, that hinted at the DOJ’s growing desperation to find new hires.\n\n“If you are a lawyer, are interested in being an AUSA, and support President Trump and anti-crime agenda, DM me,” wrote Chad Mizelle , who had recently left his DOJ role as chief of staff to then-Attorney General Pam Bondi. Mizelle did not respond to a request for comment.\n\nIn March, the department hit its lowest numbers since 2014. A month later, the University of Miami hosted an event titled “Lunch & Learn: Entry Level Opportunities with The U.S. Attorney’s Office.” The invite, targeted toward third-year law students, promised a new pathway to become a criminal prosecutor in one of the country’s busiest districts."}, {"type": "text", "content": "“The U.S. Attorney’s Office for the Southern District of Florida is now recruiting 3Ls for entry-level positions beginning immediately after graduation — an exciting expansion of opportunities for Miami Law students interested in federal prosecution,” the invitation said.\n\nTo lure new hires, the DOJ is offering signing bonuses . As of August, due in part to the hiring spree focused on greener attorneys, the department lifted its ranks to about 5,600, still a 10% drop from the end of the Biden administration.\n\nU.S. Rep. Jamie Raskin, the ranking member on the House Judiciary Committee and the presumed chair once Democrats take charge, told ProPublica that the shift toward inexperience is showing in courtrooms across the country."}, {"type": "text", "content": "“They’ve sacked some of the finest lawyers in America, by tradition, and replaced them with a large group of inexperienced lawyers,” said Raskin, himself an attorney.\n\nIn his home state of Maryland, fraud cases fell 31% and drug cases nearly 16%, while immigration charges nearly doubled. “Those numbers are jaw-dropping,” he said.\n\nJim Fang was among the veteran prosecutors who left.\n\nFang’s road to becoming a criminal prosecutor was winding. After working in tech for about a decade, he switched careers, and in 2009 graduated from Georgetown Law. He worked in private practice, focusing on intellectual property law, but couldn’t shake a feeling that what he really wanted was “to take down bad guys.”"}, {"type": "text", "content": "In April 2020, he got his dream job and was named a federal criminal prosecutor in the District of Nevada. He moved to Las Vegas and, aided by his 11 years handling complex areas of the law, took on tough white-collar crime cases."}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/20261112-Whitmore-TrumpsRemadeDOJ-012.jpg?w=527", "alt": "A man in a gray business suit and silver eyeglasses displays a serious expression while standing against a tan-colored wall made of thin wood slats."}, {"type": "text", "content": "After the election, Trump picked Sigal Chattah , a former Republican political candidate, to run the Nevada U.S. Attorney’s Office.\n\nThrough court records and sources, ProPublica confirmed that more than 30 staff have left under Chattah’s tenure. The Nevada district is so depleted that for months it didn’t have prosecutors in its Reno office , about 450 miles away. Las Vegas prosecutors were asked to fly there for court appearances, sources said. Chattah disputed the 30 figure but acknowledged that Las Vegas-based staff flew to Reno “to ensure that our federal and local partners had competent and aggressive prosecutors.”\n\nThe office dropped cases it had been building as Chattah pushed immigration and politically motivated prosecutions . To ease the caseload, Chattah ordered her civil defense unit, charged with fighting lawsuits demanding cash from taxpayers, to pay out all cases that could be settled for $250,000 or less, multiple sources said. “We were ordered to settle those cases even if they didn’t have merit,” one former assistant U.S. attorney said. “It was just throwing money at a problem.”"}, {"type": "text", "content": "Chattah called the allegations that she issued such a directive “patently false” and pushed back on her former employees’ characterizations of her tenure.\n\n“There were attorneys that failed to meet the expectations of competent workmanship with the Department of Justice, and chose to leave or retire, some were terminated,” she wrote. “Former AUSAs who failed to handle an expected case load were replaced with aggressive prosecutors who will keep our state safe.”\n\nIn September 2025, Fang took the DOGE offer and went back into private practice as a defense attorney. He suspects the department’s loss of financial crime experts like him will result in fewer successful prosecutions.\n\n“It’s a good time to be a white-collar criminal,” Fang said."}, {"type": "text", "content": "Now facing off against his former colleagues, he’s mostly busy representing clients who’ve filed habeas petitions. He was recently surprised to learn that one of the new hires brought into his former office had just passed the bar. “They’re taking a gamble on them,” he said.\n\nFang says they may well end up being fine attorneys but added, “There’s no way I could have taken that job and done it well right out of law school.”\n\nTo measure changes at the Department of Justice under the second Trump administration, we analyzed federal workforce data from the Office of Personnel Management and the Federal Judicial Center’s Integrated Database, which tracks federal court cases.\n\nTo measure turnover among assistant U.S. attorneys, we counted the number of attorneys who were compensated under the “Administratively Determined” pay scale within the Executive Office for United States Attorneys and the United States Attorneys’ Offices (OPM Code: DJ09). To estimate years of legal experience, we used experience ranges associated with AD pay grades . Our workforce analysis covers January 2025 through August 2026."}, {"type": "text", "content": "To analyze court cases, we looked at the number of defendants charged in federal court during the roughly 18 months since Trump took office, from Jan. 20, 2025, through June 30, 2026, the most recent data available. We compared that with a period of the same length (527 days) during the end of the Biden administration. Each defendant was counted once. We counted only their most severe charge as ranked by the Federal Judicial Center. We also compared the last six quarters of Biden’s term with the first six quarters of 2025 and 2026 and found similar results.\n\nWe grouped charges into broader categories using a classification system developed by the Administrative Office of the U.S. Courts. Our fraud category includes embezzlement and forgery. We counted the “Nationality Laws” category, which the AOUSC groups with fraud, as immigration. We also counted two other types of charges as immigration offenses: failing to report arrival into the United States (19 USC 1459) and, in the districts of New Mexico, Western Texas and Arizona, entering military-designated national defense areas along the border (50 USC 797)."}, {"type": "text", "content": "The post They Were Just Admitted to the Bar. Now They’re Federal Prosecutors. Meet Trump’s New DOJ. appeared first on ProPublica ."}], "text_post": false}, {"id": "f7a6bc6fbc7098c4", "title": "Roundup #91: Rocketing into the technofuture", "url": "https://www.noahpinion.blog/p/roundup-91-rocketing-into-the-technofuture", "source": "Noahpinion", "tag": "financial", "published_at": "2026-11-18T09:50:29+00:00", "panels": [{"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!gLlb!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ffc7da4d0-68da-4941-b8e2-2ac79e09ddf6_1171x659.jpeg", "alt": ""}, {"type": "text", "content": "Howdy, folks! Welcome to the future where science fiction becomes reality every day. Where AI-powered cyberattacks paralyze air travel one day and banks the next. Where shadowy billionaires make fortunes illicitly selling America’s enemies the technology to create artificial gods, while you slave away for $150 a day hoping to get half a day off. Where it seems like a new rare disease is cured every week , even as measles returns to America thanks to an anti-science cult that somehow made it to the highest rungs of power. Where self-driving cars whizz past people hunched over dying of fentanyl in the street. I mean, look at this:\n\nOr this:\n\nOr this!\n\nIn such confusing times, it’s all your friendly neighborhood economics blogger can do to keep up with it all. But I’m trying my best, so that I can help you understand these crazy times just a little bit better."}, {"type": "text", "content": "First, podcasts. Here’s the latest episode of Hexapodia, in which Brad DeLong and I discuss morality and technology with Ryan Avent:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!PgPl!,w_56,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Ffde2453e-9c18-4560-82ca-8b77ae62ef5b_1280x1280.png", "alt": ""}, {"type": "text", "content": "And here’s a conversation between me and the streamer Destiny, in which we talk about how liberalism can resist rightism and leftism at the same time:\n\nAnyway, on to this week’s roundup.\n\nFor years, we watched America’s young people — and young people throughout the world — become less and less happy. They told surveys they were unhappy. They attempted (and committed) suicide more. They were more socially isolated. They formed relationships less.\n\nThe most plausible candidate for a cause for all of this was smartphone-enabled social media , which replaced in-person small-group interaction with impersonal arm’s-length interactions with huge numbers of potentially hostile strangers — something the human animal never evolved for."}, {"type": "text", "content": "But human beings are resilient and adaptable, and I always expected young people to find new ways to be happy in a hyper-connected world. Now, there are some signs that things are starting to turn around:\n\nA word of caution: This is just one data source, the Youth Behavioral Risk Survey. Other sources, like the CDC, continue to show high teen suicide rates . It’s far too early to conclude that general teen happiness is on the upswing. But the YBRS data is a very positive sign.\n\nIf the trend is indeed turning around, what’s the cause? One possibility is that even as the online world became more all-consuming and alienating, the offline world was becoming kinder and gentler. Here’s Rothwell again :"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!zcgg!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F02ac5169-4c4a-4ce5-a4e8-d51369b5acee_742x490.jpeg", "alt": ""}, {"type": "text", "content": "Another possibility is that teens are moving away from the toxic public platforms — X and Facebook — and moving toward either private discussions or passive video apps like TikTok:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!JHjs!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fa2227c3f-b626-44ab-bf37-ed83b36a5608_840x890.jpeg", "alt": ""}, {"type": "text", "content": "Other surveys show that teens are trying to cut back on social media use in general, realizing that it’s bad for them.\n\nThis is why I’m a long-term techno-optimist. The downsides of technology can sometimes dominate in the short run, but eventually people figure out how to handle it and turn tech to their advantage.\n\nAs the Anthropic IPO approaches, various analysts are trying to figure out if the incredible rate of AI progress is going to slow down, speed up, or continue at a steady rate. A number of data sources show that progress has sped up recently, around either late last year or early this year:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!EB91!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fdf9ea1a9-df87-454c-a520-b7062f77cc4d_1164x624.jpeg", "alt": ""}, {"type": "text", "content": "One popular theory is that the speedup was due to the advent of AI coding tools. But economists Luis Garicano and Alex Imas argue that what actually accelerated was spending on AI research. They show data showing a smooth deceleration in the amount of AI capability that each dollar of research spending buys:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!9RJk!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fda62a233-8d7f-4b20-ba40-0b0e97ac7098_1155x662.jpeg", "alt": ""}, {"type": "text", "content": "On the other hand, should we really think of a linear increase in the ECI as a linear increase in capability? Some people argue that each point of increase in the ECI multiplies AI capabilities by a constant factor — like points on the Richter Scale.\n\nWhether that’s true in any meaningful sense is hard to assess. But at the end of the day, what really matters is AI’s ability to generate economic returns. And some people argue that it’s here that we see the true acceleration, as AI hits critical thresholds for economic usefulness:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!OYKY!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fdc5684bc-0d6c-4bdb-8a6a-a612cc7f8c08_728x513.jpeg", "alt": ""}, {"type": "text", "content": "But it’s also possible that this increase in usefulness doesn’t cleanly map to increases in raw capabilities, and that human beings are simply finding new uses for AI capabilities that already exist.\n\nSo the jury is still out on whether AI progress is slowing down.\n\nOne of the great accomplishments of economic policy in the last few decades was the conquest of the post-pandemic inflation . The Fed raised rates, and the economy didn’t tank, and inflation went down anyway. But that victory might prove ephemeral; inflation is creeping back up. Though there’s some volatility, most recent months have come in at around 5%:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!vlM_!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F45c866a3-0141-4f77-86c5-9899bee38f57_864x864.png", "alt": ""}, {"type": "text", "content": "The rise in oil prices due to the Iran War is an obvious contributor, but in fact the new inflation is remarkably broad-based:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!YU8y!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F20cab4b8-6ccd-4403-8df6-8b21daa5c88c_960x720.jpeg", "alt": ""}, {"type": "text", "content": "It’s just not possible to play the old game of “Well, inflation is just X and Y and Z, so it’s not really a problem.” There are various possible causes of this broad-based price acceleration — budget deficits, Trump pressuring the Fed to be dovish, cost pressures from the data center buildout, and so on. Teasing these out deserves a longer post.\n\nAnd just as basic economics would expect, a burst of unexpected inflation is causing real wages to go down:"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!kj68!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F2119c691-2287-49bc-8fcc-e50a987bf00e_1152x648.png", "alt": ""}, {"type": "text", "content": "In other words, Americans are getting poorer this year, because the cost of living is going up and their paychecks aren’t keeping up. It’s not as bad as it was in 2021, but it’s going to be enough to make a lot of Americans very angry at the people in power.\n\nA lot of people mentally divide housing into two types: “luxury” or “market-rate” housing, and “affordable” housing — as if the price of a house or an apartment is built into its walls and floors. The assumption is that if developers aren’t forced to build “affordable” housing, normal people won’t be able to afford housing.\n\nThat assumption is totally wrong — building market-rate housing drives rents down and makes housing more affordable. But because lots of people believe in the “luxury”/“affordable” distinction, they embrace policies that try to force developers to offer some units at below-market rates. These policies are called inclusionary zoning . Basically, inclusionary zoning says that some percent of the apartments in a new building have to be rented out for very cheap. The policy is attractive because it doesn’t have any direct fiscal costs — the cost of subsidizing cheap apartments comes out of the pocket of a corporation, rather than the taxpayer."}, {"type": "text", "content": "But this kind of policy ends up backfiring. Forcing developers to take a loss on some of their housing units simply makes it less financially possible to build new housing. And when they do build new housing, they end up raising rents for all the non-“affordable” units in order to try to recoup some of their losses. Here’s what Kouchekinia (2026) finds:\n\nIn California, more than a third of localities have adopted [inclusionary zoning ordinances]. Mandatory inclusionary zoning acts as a tax on construction and, all else equal, reduces the overall supply of housing. This potentially reduces affordability in the aggregate…I find the typical inclusionary zoning ordinance reduces annual new residential construction by nearly a third (31.8%) . Additionally, I find the policies relocate multi-family developments within jurisdictions to lower rent areas, where the policy is effectively less severe…I estimate the cost of generating an affordable unit with inclusionary zoning to be approximately $800,000 in “excess rents” paid by market rate renters as a result of the policy’s constraint on supply."}, {"type": "text", "content": "As Kouchekinia points out, making housing more scarce acts as a shadow tax on everyone in the area. Inclusionary zoning looks costless, but it’s actually extremely costly.\n\nCalifornia cities and other places that use inclusionary zoning are starting to realize that the policy doesn’t do what it’s supposed to do. Some have actually started cutting inclusionary zoning mandates:\n\nMatt Yglesias also has a good recent post about inclusionary zoning in D.C., and why the District should scrap it.\n\nBasically, it’s time for this policy to go. There’s really no salvaging it, it’s making our cities worse for no good reason, and we need to stop viewing it as just another inevitable cost of doing business.\n\nFor years, I’ve been arguing that AI is going to cause a scientific revolution. My hypothesis is that there are a bunch of “laws of nature” — i.e., exploitable stable causal relationships — that are too complex and diffuse for the human mind to comprehend, but which AI can learn and exploit on our behalf. I call these “cloud laws”, because I envision them as diffuse clouds of weak but densely interrelated causal effects — the kind of thing that human minds will never be able to either grasp in their entirety or bite off into little separable chunks."}, {"type": "text", "content": "Well, here’s a little bit of evidence that cloud laws exist…in the clouds. Yohan Iddawela writes about Google DeepMind’s new weather forecasting AI model:\n\nA single GPU can now calculate hundreds of global weather scenarios in under 60 seconds. The exact same task requires a supercomputer and hours of brute-force physics. Google DeepMind recently released WeatherNext 2. The model beats the previous state-of-the-art system on 99.9% of weather variables across a 15-day forecast window. It achieves this massive jump in accuracy using a new modelling approach called a Functional Generative Network. Meteorologists categorise weather data into two buckets: 1. Marginals are isolated data points, like the precise temperature at a specific location or the wind speed at a certain altitude. 2. Joints are the massive, interconnected systems that form when all those individual elements interact. The researchers hid the joint systems from the model during training. They only taught it the isolated marginals. When they turned it on, the model skillfully predicted the massive, complex systems anyway…The model gives forecasters a full 24-hour advantage in tropical cyclone tracking compared to the previous leading system. It maps extreme wind speeds and heatwaves with unprecedented precision. We’re watching a pretty big shift in predictive capabilities. The machine is deducing the structural reality of planetary weather from isolated fragments of data."}, {"type": "text", "content": "Normal weather forecasting is reductionist. We take the basic physical laws of motion, model the atmosphere as a bunch of little chunks of air that sort of behave like independent units, and apply the laws of motion to those units. What Google is doing is something else; it’s letting an AI model look at a bunch of weather data and then predict how the whole system is going to behave.\n\nThe AI approach ends up working better than the typical reductionist brute-force approach. Why? My guess is that weather has cloud laws — principles that no human could ever intuit from staring at masses of weather data, and which could never be explained in any graduate textbook, but which AI can just grasp holistically. 1"}, {"type": "text", "content": "What other phenomena might we be able to predict and control with AI this way? Patrick Collison has a fun list:\n\nWe know these effects have some sort of regular causes, but reductionist science has so far been unable to characterize any of them very effectively. But perhaps AI will, because they might be governed by cloud laws.\n\nIf so, we’re in for the most rapid and dramatic scientific revolution in our entire history.\n\nPlummeting fertility is a problem, and nobody knows how to fix it . There are a few people who deny this obvious and disheartening truth. One of those is Lyman Stone, whose own research has cast doubt on the efficacy of paying people to have kids, but who stubbornly insists that such pronatal policies can act as a “crowbar” with which to pry open the door of child-rearing."}, {"type": "text", "content": "Well, they probably can’t do that. Here are Hartley and Jaros, evaluating a Michigan “baby bonus” program that paid people to have kids:\n\nThis paper studies the fertility effects of the Rx Kids program, the first baby bonus introduced in the United States. Beginning in 2024, the program was launched in Flint, Michigan and subsequently expanded to additional municipalities across Michigan, creating staggered variation in treatment timing across places….[W]e estimate the effect of Rx Kids on birth outcomes. We find that live birth growth rates increase in treated municipalities…We find that Flint’s $7,500 baby bonus generates a small but statistically significant fertility response: actual 2024 births exceeded a three-year pre-treatment baseline by roughly 7.5%, implying $107,000 in program spending per induced birth. These results provide the first U.S. evidence that direct cash transfers tied to childbirth can measurably affect fertility behavior."}, {"type": "text", "content": "The issue isn’t that these programs don’t work. They do. The problem is that their effects aren’t very large . The United States’ current total fertility rate (TFR) is about 1.6 children per woman; replacement level is between 2.0 and 2.1. That would require at least a 25% increase in fertility rates. The program Hartman and Jaros study resulted in only a 7.5% increase, and was forced to spend $107,000 per child on that paltry increase. That’s not nearly enough, but you can bet that if it were scaled up to the national level, you’d hear a lot of anger directed at the “welfare queens” who benefited from the policy.\n\nAnd if it’s not nearly enough for the U.S., it’s utterly, laughably inadequate for a country like South Korea, which has a TFR of 0.8. To increase that to replacement level would require a 150% increase — 20 times the size of the increase generated by Michigan’s extremely generous program."}, {"type": "text", "content": "In other words, we’re not going to buy our way out of the baby bust by paying people to have kids. I still think paying people to have kids is a good idea, but the main thrust of effective pronatal policy will have to be something else.\n\nWhen I was a kid, everyone knew that Democrats were the party that wanted to raise your taxes to spend more on the poor, while Republicans wanted to cut your taxes and spend less. Those days are long gone. America now has two parties who are both dedicated to cutting taxes on the vast majority of Americans — including most wealthy and high-earning Americans — and raising spending at the same time.\n\nThis is a big problem for the country, because there will be no getting out of our debt problem until this political equilibrium changes. When I was a kid in 1992, all the presidential candidates were stumbling over themselves to tell America how they were going to fix the deficit, so I know a different equilibrium is possible. We just have to figure out how to get there."}, {"type": "text", "content": "But Democrats’ fiscal profligacy is also a political problem for them. Higher deficits and debt contribute to faster inflation; we’ve already had both Biden and Trump be punished for failing to tame inflation, and Democrats are deluding themselves if they think it can’t happen to them again.\n\nEric Levitz writes about how the incoming Democrats’ economic policy program is incoherent:\n\nTo seize this historic opening, Democrats will need to formulate a platform that effectively advances their core goals. Unfortunately, this will be harder than it sounds — because the party’s current economic priorities appear incompatible with each other…During the midterm campaign, Democrats promised to:\n\nBring down inflation and interest rates ."}, {"type": "text", "content": "Dramatically expand the welfare state .\n\nRaise taxes on the very wealthy — but no one else — while cutting taxes for millions of Americans…\n\nDemocrats’ goals…aren’t necessarily coherent.[I]t probably won’t be possible to create large new social programs, avoid tax hikes on anyone but the rich, and drive down inflation and interest rates…\n\nThe party’s congressional leaders have signaled support for a social welfare agenda at least as ambitious as President Joe Biden’s unpassed Build Back Better Act, which contained $4.73 trillion of new spending …Add up the estimated fiscal costs of all these programs and the bill comes out to nearly $5 trillion…Critically, America is already on track to run an average annual deficit of $2.4 trillion over the coming decade…[A] greater than $2 trillion deficit will put upward pressure on interest rates and prices."}, {"type": "text", "content": "Democrats do want to raise some taxes, but only on the ultra-mega-super-duper-giga-rich. I’ve written that this approach of “just tax the billionaires” is insufficient to fund all the other economic policies that Democrats want. Levitz concurs.\n\nIn time, fear of the deficit will grow to a level that enables the kind of fiscal hawk equilibrium that obtained in 1992. Until then, Democrats need a more modest economic agenda. The American people can be satisfied with an anti-corruption drive, tariff repeal, and policies to spread the wealth generated by AI. They don’t need infinite government largesse in order to be satisfied. Democrats need to stop chasing the Bernie Sanders dream, at least for a while."}, {"type": "text", "content": "Subscribe now\n\nShare\n\nAlso note that the model Google used here wasn’t an LLM. This suggests that AI is more general than the specific techniques the frontier labs are currently focusing on."}], "text_post": false}, {"id": "8975118590d35daf", "title": "Effects of a Nuclear Detonation in Low Earth Orbit", "url": "https://arxiv.org/abs/2611.09827", "source": "Hacker News", "tag": "engineering", "published_at": "2026-11-17T19:46:57+00:00", "panels": [{"type": "text_post", "content": "100 points, 85 comments"}], "text_post": true}, {"id": "080b9fa152c12124", "title": "Knowing God Depends on God's Self-Revelation | Alan Torrance", "url": "https://www.youtube.com/watch?v=xJPdQlfK4HM", "source": "Closer to Truth", "tag": "philosophy", "published_at": "2026-11-17T19:30:06+00:00", "panels": [{"type": "snippet", "content": "*Can philosophical arguments bring someone to believe in God without bringing them to know God?*\n\nAlan Torrance explains why, within his Christian theological understanding, knowing God personally depends on divine grace rather than intellectual effort alone. Drawing on his own journey from agnosticism to faith, he considers whether prayer and God's self-revelation can accomplish what philosophical searching cannot.\n\n0:00 Searching for God Through Analysis\n1:13 Knowing God Through God's Self-Revelation\n2:35 From Agnosticism to Faith Through Grace\n4:02 Prayer and the Limits of Searching\n4:51 Go", "read_more_url": "https://www.youtube.com/watch?v=xJPdQlfK4HM", "read_more_source": "Closer to Truth"}], "text_post": false}, {"id": "fc51aefa54b405bf", "title": "The Agents Will Trade the Bonds", "url": "https://www.bloomberg.com/opinion/newsletters/2026-11-17/the-agents-will-trade-the-bonds", "source": "Money Stuff", "tag": "financial", "published_at": "2026-11-17T19:29:49+00:00", "panels": [{"type": "snippet", "content": "Also sandwich spoofers, SBF and Anthropic, Martha Stewart and Pokemon trading.", "read_more_url": "https://www.bloomberg.com/opinion/newsletters/2026-11-17/the-agents-will-trade-the-bonds", "read_more_source": "Money Stuff"}], "text_post": false}, {"id": "8d20372a31c0371e", "title": "They Suffered Brain Injuries After Riding a Six Flags Roller Coaster. Regulators Pinned the Blame on Them.", "url": "https://www.propublica.org/article/california-six-flags-x2-roller-coaster-brain-injuries-calosha", "source": "ProPublica", "tag": "news", "published_at": "2026-11-17T19:20:00+00:00", "panels": [{"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/AP26286580392881.jpg?w=1149", "alt": "A large roller coaster is seen from the air. It is set in a dry landscape with buildings and low mountains in the distance."}, {"type": "text", "content": "A 17-year-old boy died after riding the extreme X2 roller coaster at Six Flags Magic Mountain in California this summer, just weeks before two more people suffered severe brain injuries after riding the same attraction, ProPublica and L.A. Material have found.\n\nA homicide detective investigating Christopher Gibson’s death in June sent an email to the California official responsible for ensuring roller coaster safety. But records show that the official did not reply until nearly two months later. The lack of action raises the question of whether the brain damage suffered by the two riders the following month could have been avoided.\n\nChristopher’s death, which has not been previously reported, also raises questions about Six Flags, its flagship X2 ride and the way in which California regulates roller coasters."}, {"type": "text", "content": "Billed as a “fourth-dimension” roller coaster, the X2 drew more than 16 million riders attracted to extreme thrills. It featured seats that swiveled in all directions as the ride hurtled and twisted along the track, sometimes at a rate of up to 76 mph."}, {"type": "image", "src": "https://www.propublica.org/wp-content/uploads/2026/11/GettyImages-1764881092.jpg?w=1149", "alt": "Several amusement park visitors appear to be suspended in the air while riding a roller coaster. The ride occupies the left side of the frame and is set against a blue sky."}, {"type": "text", "content": "The X2 was shut down temporarily after two separate brain hemorrhages in July. In August, CNN reported that the X2 had been “linked to more than a dozen reports of serious injuries” and two deaths over nearly two decades.\n\nChristopher’s is a third.\n\nA ProPublica and L.A. Material investigation has found that state regulators have repeatedly failed to take swift action in the face of reported deaths and head injuries on the X2. On at least 70 occasions since 2010, Magic Mountain reported head injuries to the little-known unit within the California Division of Occupational Safety and Health responsible for ensuring roller coaster safety.\n\nBut rather than responding to those reports with vigorous inspections or safety checks, the regulators often did minimal or no investigation, according to a ProPublica and L.A. Material analysis of court filings, public records and internal regulatory documents."}, {"type": "text", "content": "“How many more people have to die before you think, ‘Well, maybe we should look at that?’” said Mariusz Ziejewski, a biomechanical engineer who has worked with the military to reduce brain injuries and was an
