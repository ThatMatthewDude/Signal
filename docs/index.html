e": "text", "content": "0:31:18.7 SC: Because I did figure out... I once did a project, we never published it, with Mark Wise, my colleague at Caltech, where we ranked how much money Hollywood movies make versus their budget.\n\n0:31:31.4 CC: Oh, yeah, yeah. Yeah.\n\n0:31:32.9 SC: And what we found was that Hollywood was actually extraordinarily rational as an industry. So two things. One is the money you make per dollar is the same whether you make a $100 million movie or $1 million movie. But the dispersion is also the same.\n\n0:31:54.8 CC: Oh, interestingly.\n\n0:31:55.7 SC: Because in the $1 million movies, there's a lot more dispersion, but there's also a lot more movies, so the average is the same. But they know how much money they're gonna make from a $100 million movie most of the time."}, {"type": "text", "content": "0:32:04.9 CC: Yeah, yeah. Typically, often a couple of days or a week before opening, you'll hear, \"We expect it to open this much.\" And so it's some combination of analytics, and then they do screenings and they have people fill these cards, and usually they're fairly accurate that way.\n\n0:32:21.6 SC: So they know which movies are gonna do badly and they just cold open those. They don't want anybody to know.\n\n0:32:26.6 CC: Exactly. Yeah. Yeah. Yeah.\n\n0:32:28.6 SC: Okay.\n\n0:32:30.6 CC: And the paper's fun because there's some... A famous one is Pluto Nash by Eddie Murphy. And Eddie Murphy was a big star at that time. And so this is where the studios often get in trouble. It was kind of like, \"Well, you made us a lot of money, you know, maybe you'll lose us some money. That's all forgiven.\" Anyway, another one was called Killers with Katherine Heigl and Ashton Kutcher, which..."}, {"type": "text", "content": "0:32:56.7 SC: That one I don't know.\n\n0:32:58.5 CC: Well, because, right, it didn't do very well.\n\n0:33:00.3 SC: Probably for the best. Yeah.\n\n0:33:01.6 CC: Yes. 21 on Metacritic.\n\n0:33:04.4 SC: So you mentioned Kahneman and Tversky and System 1 and System 2. How does your picture here fit into that? Is it a compatible or is it a modification of that?\n\n0:33:17.0 CC: Yeah, I think... And by the way, I'm a little bit of a System 1/System 2 skeptic in the following sense. So, when Kahneman wrote his Nobel lecture about this, and there's lots of other people who've studied it, he made a list of traits that System 1 has, associative, fast, effortless. And System 2 is parallel, serial, slow, deliberative, extrinsic, like I can tell you what I'm thinking. In the snap judgment case, maybe I can't tell you. And that's kind of pre-science. We don't want a neural system to be defined by a list of words. Right? We want to see it in the brain. Like the brain evidence is very good that there's something called the default mode network, which is what you're thinking when you're not doing anything active, the salience network. There's a number of things, like language areas we know quite a lot about. And I remember asking Danny once, early, maybe five years after System 1 and System 2 was sort of in the air, \"Have you presented this to neuroscientists? And has anyone found anything that looks like System 1/System 2 dissociation?\" And he said... He had a very distinctive accent, he said, \"I did. I thought I was giving them a wonderful gift that they would all want to go study.\" And part of it was neuroscientists don't believe in that much reductionism."}, {"type": "text", "content": "0:34:41.0 SC: Yeah.\n\n0:34:43.0 CC: There's an ongoing debate, you may know some bits of it, about modularity from Fodor and Cosmides and Tooby once said we think there's 78 different modules that are adapted modules to challenges in the environment of evolutionary adaptation, the EEA. And you know, there's lots of schemes for deciding like how many distinct parts of the brain there are. And so I think the neuroscientists felt like two is too small of a number.\n\n0:35:07.0 SC: I see. Okay.\n\n0:35:10.9 CC: And so it never got much traction. I mean, I wish people would work at it because if it is two, that would be wild. And it may well be, for example, that System 1 is available in infants and System 2 shows up in puberty or when you're 25, you know."}, {"type": "text", "content": "0:35:26.3 SC: Some people never. Yeah. [laughter]\n\n0:35:29.6 CC: Yeah, yeah, you took the words out of my mouth.\n\n0:35:33.9 SC: But that's a perfect segue because you are an economist who does neuroscience. And I mean, let's just ask the sort of career path question here. Was that an obvious thing to start doing as a professor of economics?\n\n0:35:53.2 CC: No. No.\n\n0:35:54.1 SC: I figured.\n\n0:35:55.4 CC: Yeah. So the pattern it sort of fit was I like novelty and I'm a bit of a dilettante, although... Maybe I want to be more than a dilettante in the sense that what I'm proudest facts about my career is that I've published in a lot of different journals, sometimes on my own, but also with typically with a tutor, a senior collaborator who is my sensei."}, {"type": "text", "content": "0:36:24.7 SC: That's the way to do it.\n\n0:36:25.8 CC: And can tell me what I need to know. And so the first thing I worked on after graduate school that was a little bit ahead of its time was experimental economics. So the idea of doing an experiment came very late to economics. In fact, up to 1985 and maybe still, Samuelson and Nordhaus's famous book that a lot of people taught from said, \"Sadly, like astronomy and geology, we can't do experiments. Like, we can't make artificial earthquakes and create new planets in economics.\" And even at that point, there were hundreds of experiments already published, so I don't know what they were thinking. It was like a hallucination, the human form of hallucination or denial. Anyway, the idea came quite late, and so I got interested in that because Charlie Plott, my colleague at Caltech, who's a major figure, really one of the main founders in this area, taught a course at University of Chicago, and I learned about experimental economics. No one was doing it. I like doing things that no one else was doing. I don't really like competition, frankly."}, {"type": "text", "content": "0:37:26.6 SC: Yeah. Me too. I'm with you.\n\n0:37:29.1 CC: Yeah. One way is to do something no one else does or to combine, synthesize things that are unusually unusual mixtures. And then I got interested in behavioral economics, and that was also controversial at the beginning and took a lot of... There were constant like battling with referees. It was kind of healthy because if you have scientific enemies can be very good for you. They read your papers very carefully. If you make a mistake, they will tell you about it. If they think there's a... They probably are willing to have a conversation that says, \"What evidence would convince you?\" You know, like, \"Well, people do these games for $10. If you did it for $200, I'd be convinced.\" So then you go do it for $200. Or you do what we did and many people, you go to Vietnam, which is highly literate and poor at the time, 2010, and you do it there for the equivalent of 10 US dollars, which for them might be two days' wage. Right? So as Thaler likes to say, the easiest way to win an argument is to run another experiment or run another regression. So we were always in grit mode, like, \"We're gonna prove it to you, prove it to you.\" Okay, here comes neuroscience. So in 1997, George Loewenstein and I were together at the Institute for Advanced... Sorry, not the Institute, that's Princeton. At Stanford, there's something called the Center for Advanced Study in the Behavioral Sciences, CASBS, C-A-S-B-S, that began in the '50s. And it's an amazing institution. It's a great place to go. Ironically, they are always begging me, \"Do you know anyone in economics or neuroscience who wants to come?\" Because most of the neuroscientists have big ongoing labs and they feel like they can't take a year away, even though I think their trainees probably wouldn't mind, to be honest, neuroscientists out there. And there's flights from San Francisco very frequently. Anyway, I was at this CASBS, and George Loewenstein and I were there, and also Drazen Prelec, who's a brilliant psychologist who contributed to behavioral economics, and his wife is a neuroscientist. And so George had gotten interested in neuroscience a little bit because he was good friends with John Cohen, a major cognitive neuroscientist who also kind of joined us in neuroeconomics with some of his projects. And so between Danica Prelec, John Cohen, and other people we knew, George and I organized a meeting in Pittsburgh that was basically, you know, \"Our friends are gonna meet your friends.\" And so there was a few economists, none of whom were doing neuroscience. They were just like, \"I'd like to hear what it is, and how do you study things, and what are the questions in economics like utility maximization? How would you try to study that thing?\" And it was quite an amazing conference, except most of the economists were dead silent. So I think they were listening, number one."}, {"type": "text", "content": "0:40:19.7 SC: Okay.\n\n0:40:20.8 CC: And they didn't know what to ask. Right? In economics, there's a little bit of a proud tradition, with some famous exceptions, of it's considered low status to say, \"I don't really understand this.\"\n\n0:40:49.0 SC: Oh, that's too bad.\n\n0:40:50.4 CC: \"Or how would this... I'm interested in common knowledge in games. How would this help me study that?\" Occasionally people will ask, but anyway, they were just quiet. And by the way, in that group was Peter Diamond, Al Roth, Paul Romer, and I may have left somebody out, all three of whom later won Nobel Prizes. Now, did we have a causal effect? [laughter] I'm just saying it's a small sample. You know, we don't have much statistical power. And actually, no, none of them pretty much did anything. Actually, Paul Romer got quite interested in some aspect of it, and he wrote a small paper on emotion. And so he's the one who kind of came closest, but then he got distracted by lots of other things that were more important for him to do, frankly. So they were kind of like sympathizers, you know, \"Tell us.\" And then there was kind of a lag, and then there's another starter conference at Princeton, which I missed, and Angus Deaton was there, later Nobel laureate. And Angus, again, is very far from a neuroscientist. He's interested in demand systems. You know, how do you fit together how much products people like and whether they substitute products? And he had done some beautiful work on that. But he basically said, \"You know, I came to this conference because I don't think we really understand the source of demand. Like, I have all these data, but why do people like vanilla and not ice cream? Does it change over time? Does it depend on who is around them?\""}, {"type": "text", "content": "0:42:21.4 SC: That's a great question.\n\n0:42:22.1 CC: \"Can you guys help us understand that?\" And, you know, if you taught a course on demand theory, there's not a lot of neuroeconomics papers I would put on there right now, but we would have a research agenda, for example. And we could say something about a few things that have been studied, like self-control. Like, when do people buy tempting goods rather than healthy goods? We have some data suggesting dorsolateral prefrontal cortex interacting with another region, but it depends on how much your brain is sort of encoding or representing health value.\n\n0:42:33.5 SC: Okay.\n\n0:42:34.1 CC: So there's some bits of cogneuro that speak to things in economics, but it's just a very thin web of tissue. It's not a nice, dense plan. Anyway, so in the course of that, I moved to Caltech in '94. So this conference in '97 was a little bit in, and I started to ask around about neuroscience people I knew. One was John Allman, who turns out is one of the world's experts on cross-species comparison of primates and an incredibly wise person. So he was kind of my tutor. And then we got a brain scanner in 2003, and we got a kind of a volume discount. So there was one scanner to study monkeys, which was vertical, because the monkeys don't like to lie down and they're squirmy, so you have to lift them up into it like a kind of hairdresser. You know?"}, {"type": "text", "content": "0:43:24.5 SC: Okay.\n\n0:43:24.9 CC: And there's another one for small animals, which have tiny brains, so you need a big seven Tesla. And then we thought, well, we might as well get a human scanner. But as you may well appreciate from knowing Caltech, in biology, now called BBE, Biology and Biological Engineering, very few people are interested in humans.\n\n0:43:43.4 SC: Yeah.\n\n0:43:43.9 CC: Because we're too complicated a biological system.\n\n0:43:47.2 SC: Too messy. Yeah, of course.\n\n0:43:48.4 CC: Yeah, too messy. Right. If you want to study nicotine addiction, like Henry Lester, study rodents. If you want to study sleep and development, you want an organism that's transparent when they're born, so you study a zebrafish larvae with David Prober. Right. And so humans are like, \"Man, there's too much going on.\" So we had this kind of Field of Dreams scanner that no one was using, and the staff people were really terrific. And a couple of us, actually Peter Bossaerts was one, Steve Quartz was another, said, \"I have some ideas about what we could do with a scanner.\" And so people started to work on that. And some of it was a very Caltech formula, as you might recognize. So Peter started out as a finance professor, and he got interested in risk and reward. And he was like, \"Well, what is risk and reward in the brain?\" Like, fundamental thing in economics. And he was just good at it. And he, like me, was very adventurous. He was like, \"I don't care if I can't publish these papers. I have tenure. That's what tenure's for.\""}, {"type": "text", "content": "0:44:42.0 SC: Yep.\n\n0:44:42.8 CC: Steve Quartz was a wet philosopher. What that means is he had a PhD in philosophy. He did a postdoc at the Salk Institute at La Jolla, where Terry Sejnowski was and Francis Crick. And Steve was there at the same time as Read Montague and Peter Dayan. And so Montague and Dayan and Wolfram Schultz wrote a very famous paper in 1997 about dopamine, and that dopamine neurons were firing in midbrain as a reward signal, reward learning signal. Anyway, so Steve was around this kind of computational neuroscientific. And so he came to Caltech. He's still teaching philosophy. Like, he would teach a course on, like, free will. You know? [laughter] But he was interested and he liked to dabble. So he and Peter wrote some papers, I wrote some papers with them, and we kind of got a start. And Caltech, by the way, was quite supportive. Partly they had this free scanner. They just wanted to get something out of it, right? So for a few years it was free to use the scanner. It's normally quite expensive. They were basically subsidizing a startup. And they were pretty charmed by it. So I was able to do it, and I had good collaborators around."}, {"type": "text", "content": "0:46:00.0 SC: Yeah, I mean, that sounds great. The one thing I wanted to note, when you were talking about organizing the interdisciplinary conference, there's a piece recently by Paul Bloom, who's a former Mindscape guest...\n\n0:46:10.2 CC: Yeah, yeah.\n\n0:46:11.2 SC: He was trashing interdisciplinary conferences, not because the idea is bad, but because you would invite the best people from Area 1 and the best people from Area 2. But he said those aren't who you should invite. You should invite the people from Area 1 who care about Area 2, and those might not be the ones you've already identified as the best.\n\n0:46:53.2 CC: Yes. Yes. No, I totally agree with him in the sense that it's very easy to put on a mediocre interdisciplinary conference that's a waste of time, that nobody would want to come back for part two. And it's exactly what he's put his finger on, which is you need people who are good at what they do, like really good, willing to learn language and communicate across languages. Like the word rational is used seven different ways. And so that takes some... You have to be in kind of student mode. Like you have to toggle from expert to student. And then these are people for whom this could really be a priority. Like if this meeting is fun, I want to go every year, or a collaboration comes out of it, or we write a joint grant for those funders that really like these kinds of mixtures, like John Templeton and sometimes DARPA or whomever."}, {"type": "text", "content": "0:47:19.6 SC: I like the idea of student mode because it's depressing how many professors don't want to get into student mode. Like they figured... They've paid that price already, they don't want to do that anymore. But it's kind of a shame. But okay, so this is a very broad question, but we can narrow in. What do we learn by looking at the brain? Is it something like, \"Oh, when you're making a decision, this part lights up,\" or can we actually start identifying some of those modules you mentioned earlier?\n\n0:47:47.4 CC: Yeah, so first of all, let me knock down a couple of kind of myths or things that people often say.\n\n0:47:52.3 SC: Good.\n\n0:47:53.1 CC: So one is that very few things are highly localized to one part of the brain. Right? So we do think about certain regions, like amygdala or DLPFC I mentioned, but typically we're looking for kind of a circuit. You know?"}, {"type": "text", "content": "0:48:11.4 SC: Mm-hmm.\n\n0:48:12.1 CC: And so that's number one. There's some exceptions, like language is largely left lateralized for...\n\n0:48:16.8 SC: So that's left side of the brain.\n\n0:48:18.5 CC: Left side of the brain. Yes, exactly, exactly. And so there's some cases like that. But even then, the brain has a fair amount of plasticity. So if you have damage in an area, or with animals we can sometimes lesion the animals, the people and animals can often, like the brain will reorganize itself to have some functionality in a different part of the brain. There's a very famous paper on this on ferrets' optic nerves and auditory, I believe, where you kind of rewire. And there's even, you know, there's people who have hemispherectomies where they remove an entire hemisphere and they can do a lot of things. So the brain has a certain resilience. It depends when it happens. If it happens early in life, it's better, and so on, and so on. But so one distinction I think is important is... Oh, so let me give you one concrete example that I think builds on what we were talking about. So when it comes to strategic thinking, the terms that I prefer is mentalizing. Another term people use is theory of mind, which is the idea that I have a... It's not my favorite term, but you know, that's why I like mentalizing. Theory of mind is the idea that I have some kind of theory or personal representation of what's in your mind."}, {"type": "text", "content": "0:49:36.7 SC: Yes.\n\n0:49:37.7 CC: Okay. All right. And there's a lot of philosophical nitpicking about... Which is interesting actually, about how it works, but that doesn't help guide us too much on the neuroscientific discovery. It's been a lively debate, and lively debates are usually good. But there is pretty good evidence on the mentalizing circuit.\n\n0:49:58.5 SC: Okay.\n\n0:49:58.6 CC: So part of it is in what's called right temporoparietal junction. So there's four main lobes of the brain, temporal, parietal is motor, occipital cortex in the back, and then frontal. And so temporoparietal junction is sort of a region where the temporal and the parietal lobes tend to meet. There's part of the mentalizing circuit is dorsomedial prefrontal cortex. Dorsal is on the top, medial in the middle. So that's, you know, an area like a big quarter on the top of your forehead, an inch above your eyebrows. There's some regions in temporal lobe and posterior cingulate. And so if we do what's called a localizer, like if I show people a bunch of pictures, like my colleague Ralph Adolphs does, and I said, \"What is this person doing with their arm?\" You would say reaching. Right? And I could give a similar picture and say, \"Why is this person moving their arm that way?\" So the how question is not about the contents of the person's mind. The why question is about why are they doing it."}, {"type": "text", "content": "0:51:05.6 SC: Yeah.\n\n0:51:06.6 CC: Or you could show a person who's crying and said, \"What is this person's face doing?\" It's crying. Then you ask, \"Why are they crying?\" Okay. And so if you run this why-how localizer and you look, what are the areas of the brain that are more active in why than how? And just to help your listeners too, the reason we do both is because whenever you put something on the screen and you have people press a button, tons of stuff is going on in the brain.\n\n0:51:29.8 SC: Everything goes crazy. Yeah, right.\n\n0:51:32.0 CC: Yeah. And so we want to have two things that are very, very similar in terms of what buttons you press, what you see on the screen, the luminosity, the emotions. So they literally would use the same pictures that permit either a how-why judgment. And then you subtract the how activity from the why, and what's left over we think is mentalizing."}, {"type": "text", "content": "0:51:53.4 SC: Okay. And... Yeah.\n\n0:51:54.9 CC: And there's a couple of studies, but not very many, including by us. There's one nice study on the two-thirds of the average game, and people who do two steps of thinking in two-thirds of the average have more activity in mentalizing circuitry.\n\n0:52:11.1 SC: Oh, okay.\n\n0:52:12.1 CC: Right? And I wish there was... For some reason, including my laziness, I wish there was a lot more studies on that. There's a few, and they all kind of point to this idea that more strategic thinking, as evidenced by these kind of extra levels, like 22s or 18 or 19 in the 11-20 game, those extra steps of thinking are recruiting this mentalizing.\n\n0:52:33.5 SC: And how well can we... I mean, so sorry, let me back up a little bit. Given that you're able to do at least some connection between that way of thinking and something happening in the brain, what kind of story can we tell about why we think that way, why we're not better at multi-level thinking? Does it come down to energy usage or just accidents of evolution or satisficing? I'm not quite sure."}, {"type": "text", "content": "0:53:00.1 CC: Energy usage is always a good candidate, right? You know, because the brain runs on 40 watts and what evolution is generally doing is thrifting, you know, it's trying to sort of offload to displacement approximations, offload things. There's a couple of papers on this. I don't know if the fossil record or anything, I should ask John Allman, right? Actually, he's often in at Santa Fe. You should ask him.\n\n0:53:26.8 SC: I'll ask him, yeah.\n\n0:53:29.5 CC: Whether there was some kind of rate limit that kept human brain from developing more steps of thinking. Probably it's something like there's a bit of a kind of mental arms race where if I could do more thinking, I can figure out if you're fooling me and I can fool you. But unless you're a very social species in which that's highly advantageous, you know, you just wouldn't get enough evolutionary pressure to generate more. It's a very good question. I wish... If I had five PhD students writing theses, we would..."}, {"type": "text", "content": "0:54:04.1 SC: One of them would...\n\n0:54:05.4 CC: Tell you in three years.\n\n0:54:05.7 SC: Okay, good. Well, you know, there might be people out there listening who can then apply to grad school at Caltech and do that.\n\n0:54:11.5 CC: Yes.\n\n0:54:12.1 SC: One of the obvious ways to me that people fall a little short of being perfectly rational is when we're trying to compare what we want right now in the moment to what might benefit us down the road, right? Planning for the future. Is that something that you can see in a distinction in the brain or is it...\n\n0:54:33.8 CC: Yes. Yes.\n\n0:54:34.6 SC: Okay.\n\n0:54:35.9 CC: Yeah, that's a great topic. So in psychology, it's often called delay discounting. How much do you discount or underweight things that you get with a delay? We often call it time discounting. And interestingly, animal learning, biology, psych, and economics have cohered on a fairly standard set of definitions and tools for measuring it. And a very typical one is called smaller sooner, longer later. So the idea is you could have $10 now or in a month I'll send you $15."}, {"type": "text", "content": "0:55:10.1 SC: Yep.\n\n0:55:11.4 CC: And people say, \"Well, I want 10.\" So then we'll usually calibrate that. You can do this in a Bayesian optimal way. So it's like, \"Well, how about 10 or 18?\" \"Okay, I still want 10.\" \"10 or 20.\" Right? So you can titrate this and then figure out what's an implicit interest rate. So we call it a discount factor, but it's exactly like an interest rate. And there's quite good evidence about how that works in the brain. And again, dorsolateral prefrontal cortex is quite important. So there's something called prospective thinking, which is basically when people are thinking about the future. And the prospective thinking system is fairly well understood. One of the early people who worked on it, by the way, was Demis Hassabis, who's now at DeepMind."}, {"type": "text", "content": "0:55:57.7 SC: Yeah.\n\n0:55:58.0 CC: Nobel laureate. So a number of people in his circle were interested in this. And so we have a study related to this, which is the food study I alluded to briefly before, which is people see pictures of food and there are things like apples, yogurt, Snickers bars... And they rate them on health and taste. And each individual rates them. We don't take some rate because, you know, people may... Some people love tofu, some don't. And then we ask them to choose between goods. And what happens is when they're choosing the tempting one, there's more activity... Sorry, when they're resisting the tempting one, right? So they see tofu and Snickers, and when they choose tofu... And these are people, by the way, who we recruited who said they're trying to diet. So they're people who we know kind of have everyday self-control struggles. We didn't super carefully titrate, you know, what that means. And this is pre-GLP-1, so that's going to scrub all these actually... I don't know if it's going to screw up the studies, but it becomes a really interesting thing to study separately."}, {"type": "text", "content": "0:57:04.2 SC: New thing to study, yeah.\n\n0:57:05.1 CC: Right, exactly. Anyway, and so you ask people about these healthy foods and then more tempting foods that they like better. And when they're able to resist temptation, there's activity in DLPFC. So we think of that... I think of it as... It's also involved in working memory and other lots of other major tasks, what's called executive function. So I think of that as a place that reminds you now about future consequences, like health.\n\n0:57:29.1 SC: Right. Right.\n\n0:57:33.1 CC: Like health. And there's another really beautiful study on this topic. So one thing people have studied is called EFT, episodic future tagging. And the original study is so beautiful. So what they did is they took a calendar and they asked subjects, \"What are some things that are happening in the next couple months?\" Like, \"Oh, I have my PhD defense,\" \"Oh, I'm going to Santa Fe,\" \"I'm on Sean's podcast.\" And they had them rate... \"I'm going to go to the dentist.\" Are they good things or bad things? So how vivid is it when you think about it, and is it good or bad? And then what they did was they did the SSLL experiment. You could have $10 now or $15 in a month. But that's the control treatment. In the episodic treatment, they said, \"You can have $10 now or $15 when you're going to be in Sean Carroll's podcast in a month.\" So the time is fixed, but again, there's a kind of framing difference where you've injected this vividness, this salience. And then people are more patient."}, {"type": "text", "content": "0:58:41.3 SC: [laughter] Yeah, that makes sense.\n\n0:58:41.7 CC: Yeah, the idea is that the episodic imaginability through prospective thinking kind of pulls... It's as if it pulls the future forward mentally, and it changes the discount rate.\n\n0:58:53.1 SC: Is it that or is it... I mean, in part, when you say something like, \"I'll give you $10 today or $20 in the future,\" part of me just doesn't believe you, right?\n\n0:59:03.8 CC: Oh, okay, yeah, yeah.\n\n0:59:04.8 SC: Like, you know, maybe you're faking or maybe you'll forget or you'll get poor. Whereas if we tie it to an event, then your reliability goes up a little bit.\n\n0:59:12.8 CC: It could be. It could be. And actually, this thing about credibility of future rewards a lot of people have tackled. And my colleague here, Charlie Sprenger, who's a real terrific experimental economist, the way he did it was to give people post-dated checks when they left. So if you pick $10 today..."}, {"type": "text", "content": "0:59:30.1 SC: Brilliant.\n\n0:59:30.8 CC: You get a check 24th of September. And if you pick one month, it's October 24th. It's a little sus because sometimes banks will cash post-dated checks and what have you, but anyway, they were really cognizant about this. And another study by Paul Glimcher, who's a terrific neuroeconomist, what they did was they had people scan three or four sessions. And so by the time they did the second session, they had gotten their money from the first session.\n\n0:59:58.7 SC: Okay, so they're believable.\n\n0:59:59.1 CC: So that was a way to build up credibility.\n\n1:00:00.8 SC: Yeah, okay, good.\n\n1:00:02.5 CC: Yeah. Yeah, yeah. But it is a... This is kind of like the best way to win an argument is to run another regression or run another control experiment. So people have been very careful about this credibility thing. But it may be the episodicness somehow adds some vividness or some something. I mean, we need to ask the brain more."}, {"type": "text", "content": "1:00:23.6 SC: It does sound like this might tie into... I know you're doing recent work on burstiness in activity. Like, if we're doing something, we'll keep doing it for a while and then it'll just go away.\n\n1:00:29.7 CC: Yeah. Yeah. Yeah.\n\n1:00:35.7 SC: So what have you found out there?\n\n1:00:38.3 CC: Okay, yeah. So that's a great segue. Thanks, Sean. So burstiness is... Well, let me tell you a story. So we have some gym data, and we have some data on about 1,500 days of gym attendance. These are people who joined the gym and then we have four years of data or so, sometimes less, sometimes more. And it's a lot of people, like 20,000 people. And so we were interested in whether you can predict when they go to the gym. Like do they form a habit of going regularly? And so my RA, Hong Ho, made a graph. I said, \"For giving a talk purposes, make a graph of one person's calendar year of when they went to the gym every day.\" And so I looked at this graph and I thought, \"Poisson non-homogeneity.\""}, {"type": "text", "content": "[laughter]\n\n1:01:29.5 SC: Just what I would think of, of course.\n\n1:01:31.0 CC: As one would. As one would.\n\n1:01:33.0 SC: As one would.\n\n1:01:33.5 CC: Yeah, yeah. And that's an extremely clumsy term for burstiness.\n\n1:01:35.2 SC: Yeah.\n\n1:01:39.4 CC: Okay. And so on the graph, what happens is the guy goes one day, the next day, next day, next day. So he's going one day apart three times. Then there's a seven-day gap. Then he goes the next day, one-day gap. Then he goes 13 days later. And so there's a lot of short gaps and a lot of long gaps. And it turns out that the kind of default model for thinking about these kind of stochastic processes is often a Poisson arrival process. And what Poisson non-homogeneity means is if the Poisson parameter... Poisson parameter, readers, is... A Poisson process is a gorgeous process invented by Mr. Poisson, which is French for fish. And it has a lovely, lovely structure, and it's characterized by one parameter. So there's a parameter tau, which is the mean of the distribution and its variance. So it's very easy to work with. The Gaussian, you have two parameters, and lots of other beautiful functions have two or three, but for some purposes, one is very handy. And we also use it in the cognitive hierarchy, by the way. So it looks like the distribution of levels in these games, like two-thirds of the average, happens to have a Poisson shape. It's the same Poisson, just completely different. It's just a good example of... I'm like a Platonic... Sometimes the same ideas show up powerfully in science in many different places. I hope so. Like God sometimes makes our life easier rather than harder. Anyway, so back to the calendar. So I found this beautiful book by a guy called Karsai that was about 200 pages on burstiness. And so burstiness is another name for these lots of smalls and lots of longs. And burstiness has a property that if you regress the percentage of one-day gaps against one day, the percentage of two against two days, against two, right, you regress the percentage of days of length tau against tau, but take the logs. Log percentage against log tau. And I did this on my computer after I got these data. I was so excited. It was 10 years ago. Claude couldn't help me. I basically counted by hand the size of the gaps and I made a plot. I was really excited. I'm discovering, I'm discovering. Here comes dopamine flowing. And I ran a regression. It was an R-squared of 0.97. And in social science, you only get that when you're regressing by mistake one thing against the same thing, or something that's really persistent like GDP. Quarterly GDP is last year's GDP times one plus some small perturbation."}, {"type": "text", "content": "1:04:22.6 SC: So sorry, just to interrupt, but for the listeners who might have missed the forest there for the trees, so you're saying that there's essentially a perfect kind of power law relation here in the frequency of the gaps between these events.\n\n1:04:40.2 CC: Correct, correct. In the log frequency and the log length. Exactly. So if you... I mean, like I said, we just never... We never see this, you know.\n\n1:04:48.9 SC: No.\n\n1:04:49.3 CC: And so my view, especially after reading this Karsai book, which was just a gift, was, and again, this is not that common in economics, but was, if it's that lawful empirically, there must be a simple explanation.\n\n1:05:07.4 SC: Yeah.\n\n1:05:08.0 CC: And it turns out there's not just one simple explanation, there's a few."}, {"type": "text", "content": "1:05:11.8 SC: That's the problem with the simple relationship, yes.\n\n1:05:13.9 CC: Correct. Exactly, exactly, exactly. So we have these four data sets and there's a couple of beautiful models we found in the literature that actually go back to 1954. So let me give you a quick tutorial to your beloved readers or listeners on queuing theory. So queuing theory is a branch of applied math developed, think like a lot of boom in operations research around World War II or thereabouts, which says if people arrive for some kind of service, these are the words that people still use, and the arrival rate is stochastic, but it's governed by some law like Poisson arrival, and then the service is stochastic, governed by some kind of law, what are the statistical properties of how long people wait to get served? What's the mean? What's the median? If the arrival rate is faster than the service rate, it goes to infinity. There's a lot of interesting applied questions, like if you're at Vons and there's more than three people in line, there's four, what they do is they'll open up another server. And so you can study if you have a certain server open-up rule, like how does that work? Most of the queuing is simplified if you use first-in, first-out, which assumes somebody arrives and nobody gets to cut in line. But it turns out starting in the 50s and then later, Barabási was a famous person working on this, who people may have heard of. He's written a popular book and done a lot of interesting things. And it turns out if you tweak queuing theory to what's called priority queuing, you can get a power law."}, {"type": "text", "content": "1:06:49.9 SC: Okay.\n\n1:06:50.5 CC: And so priority queuing means it's not first-in, first-out. So let's say there's a line and with some probability p, you don't serve the person who's next in line, you pick somebody else.\n\n1:07:03.0 SC: Okay.\n\n1:07:03.5 CC: And there's three or four very beautiful forms of this. And the different forms of priority generate power laws with different exact numerical slopes. Like Barabási's form, the Cobham form 1954 is minus one and a half, minus three halves. Barabási is minus one. There's a couple of others that have slightly different... I mean, and this is all published in like statistical physics journals. It's just beautiful. Like I was just... I kind of want to, like maybe I should have stuck with physics after I majored in physics for one term and then gave up because it was too hard. It was too hard and there was no people in it. But anyway, it was extremely beautiful work. You have to make these nice approximations and it's sort of knowing what to take out in some ways, right? Anyway, so there was all this literature on what to do. Meanwhile, we have a priority-type model, but we hadn't thought of it as priority queuing at all. It's called Neural Autopilot. And we developed this, as the name suggests, to create a simple mathematical econ-style model of habit that we might be able to see in the brain. In fact, it was inspired by things that people had been writing about the brain. And the idea is that the brain toggles between modes. When you're in optimization mode, you go to a store, you look at all the things in the store, you think about the prices. People don't really do this, again, I mean, this is where we started out with utility maximization, but they do some approximation. Or if they go to the store at the same time, like the wine expert, they may actually know what all the different pickles are in the Armenian store, which there's about 100 in LA."}, {"type": "text", "content": "1:08:40.0 CC: So that's regular shopping, but it's very expensive. You have to look at all this stuff, you have to compare the prices, you have to make trade-offs, right? Do I buy the big jar even though I'm not gonna eat that many pickles? In habit mode, you do something much simpler. What you do is you retrieve a memory, what did I pick last time? And then you pick up one number, which is the reward reliability, which is basically, was it pretty much the same as last time? So it's not the reward prediction error, which is a workhorse idea from Wolfram Schultz and others in theoretical neuroscience. It's the absolute reward prediction error. It's like the sign. Has it been pretty good? If that's high, you don't buy the same thing again. Because if it's high, it's like, well, I don't know if I'm getting something that's as good as last time, right? If it's low, you just buy the same thing. So think how simple it is. What did I pick? What was its reward reliability? In fact, those might be closely coupled together in associative memory, so it's a very... And so the idea is in habit mode, you just think of these two numbers. You're in and out. You can multitask, right? So you're pushing your shopping cart, you're on the phone, you're grabbing Italian wedding soup as your favorite soup. You grab Italian wedding soup and blah, blah, blah, right? You can have a conversation. So, multitasking is a hallmark of habit, right? Because you have this freed up executive function. That's the idea. Anyway, so we thought, well, let's take this Neural Autopilot model and see if it can fit some of these power laws. So for example, maybe when people are going to the gym, sometimes they're in habit mode, and if they go to the gym one day, they're just gonna go again and again and again. And other times they break that habit, and maybe they're in a habit for a different activity, like running or binge-watching or binge podcast listening or something, right?"}, {"type": "text", "content": "1:10:37.4 SC: Right.\n\n1:10:37.6 CC: So they're not in the gym habit. And so we're able to show statistically, it's horribly inelegant compared to the statistical physics, I'm ashamed to admit, but that's the limits of my talent, and we're able to show that the Neural Autopilot model will also generate a lot of streaks of ones and then some long streaks. And it generates a slope of the power laws. The slopes in the power laws we saw in our data were mostly like minus two.\n\n1:11:06.4 SC: Okay.\n\n1:11:07.2 CC: Which happens to be a little bit higher than most of the beautiful mathematical ones that generate steeper slopes. And so this was a... Again, I think this is what interdisciplinary is good for."}, {"type": "text", "content": "1:11:24.6 SC: Yeah.\n\n1:11:25.3 CC: It's like if I hadn't seen that picture and known what Poisson non-homogeneity was, which I learned from Peter Bossaerts because it's an idea used in finance to think about insider trading, right? It's like, you know, the trades don't always arrive in this Poisson way. You may get a burst of trading and then a lull and then a burst of trading. And that's either because information comes in lumps, you know, or in, or trading is self-generating. Like if I see a bunch of trades, the price moves and that gets my attention. Anyway, so a bunch of people had been developing this in finance. Peter Bossaerts infects me, that plants the seed in my hippocampus. I see this picture, I think burstiness. I go look for a book. I find [1:12:06.6] ____. Thank you, [1:12:07.2] ____. And then I go and talk at my MIT-Harvard sabbatical, I talk to Xavier Gabaix, who is an extremely brilliant macro-finance behavioral economist. And he wrote a paper on power laws and derived why city sizes satisfy a power law, which is a very old application from the '50s from Herb Simon. And I said to Xavier, \"This topic still interesting?\" right? Because no one in economics seems to be working on it. Like, he wrote two great papers and then just stopped. And he said, \"Yeah, I couldn't get...\" I said, \"When this is so lawful, there must be a beautiful simple process.\" He goes, \"Yeah, yeah, yeah, yeah. Exactly.\" So we're the two champions of power laws study in economics. I mean, his work was much more serious and I just was kind of dabbling on the empirical side. Anyway, that's what that's about."}, {"type": "text", "content": "1:12:59.3 SC: I mean, the... I'm diving into this myself because I'm writing a couple of books that involve these things.\n\n1:13:02.5 CC: Yeah, yeah.\n\n1:13:05.7 SC: The power laws are... On the one hand, they're everywhere. On the other hand, they're surprisingly controversial because people argue like...\n\n1:13:12.1 CC: It's not quite a power law.\n\n1:13:14.5 SC: \"Is it really a power law, or is it a log-normal? You know, what is your mechanism?\" But I think for sure it starts you down a path that makes you learn things. So I'm all in favor of people noticing power laws here and there.\n\n[overlapping conversation]\n\n1:13:24.0 CC: Yes. And in fact, we've just to... Sorry to echo your point, we wrote a second paper. So Gabaix has the only paper I know of that actually uses statistical inference to test whether it's really a power law or something else."}, {"type": "text", "content": "1:13:38.5 SC: Oh yeah, okay.\n\n1:13:39.8 CC: And there's a few ways you can do it. You can compare power law with alternative specifications like log-normal. But his test is... I mean, these are really good econometricians, right? So what they're thinking of is not just, \"Wow, that picture looks pretty good.98 R-squared,\" but could we reject power-lawness without a specific alternative? So they had this really elegant test. It's very delicate. He never published it. And so we're the first people to actually test that. And indeed, they're not quite power law.\n\n1:14:15.8 SC: Not quite, yeah, yeah.\n\n[laughter]\n\n1:14:17.1 CC: Let's just whisper. Readers have to back up and listen again.\n\n1:14:19.9 SC: Right."}, {"type": "text", "content": "1:14:20.7 CC: Click the minus 15 seconds button. What it is, is the log-normal fits a little better.\n\n1:14:27.1 SC: Okay. But that is... You know, despite the fact that it comes across as a little bit persnickety statistician talk, it might have important implications for the generative mechanism, right?\n\n1:14:36.8 CC: Absolutely, absolutely. Yeah, yeah, yeah... And this is really nerdy, but let me just finish on that. So and if you graph them, like power law and log-normal, what the log-normal differs is that when the lengths are very short, like one or two day gaps in the gym, one or two, three day gaps in the gym, there's a little bit fewer of those short lengths than would be on the power law straight line."}, {"type": "text", "content": "1:14:49.9 SC: Yeah.\n\n1:15:03.0 CC: And then the tail of extremely high lengths, like 30 days they haven't gone to the gym, just kind of falls apart. It's what's called exponential cutoff in the... It just starts to not look like a straight line because there's not much data down there.\n\n1:15:14.8 SC: Not much data, right, yeah, of course.\n\n1:15:16.3 CC: It just fans out. But the log-normality might... I mean, your point is... I'm so glad we... I sent you this paper last night and you read it or thought about it, or at least it sparked the thought, because in psychology there's something called refractory period, which is basically recharging. Right? So, you know, after you eat and you're full, you don't eat again. Sex, exercise, sleep, you know, all these things, you don't expect to see a lot of really small things close to each other, right? So for example, I don't think this is true of the gym, but it might be. For example, after you go to the gym one day, your muscles are a little sore and you can't go for two more days. So there's a deep biological reason why you can't have short lags. Right?"}, {"type": "text", "content": "1:16:06.1 SC: Right.\n\n1:16:06.5 CC: Or we have data, for example, on people checking their phones, you know, and you just don't... You can't check it minute after minute after minute unless you're...\n\n1:16:14.8 SC: I hope not, yeah.\n\n1:16:16.1 CC: Yeah, I mean, it's bad enough as it is, right? But I think your point is really well taken, which is the hard work of comparing these things that look very close together may tell us something about a deeper mechanism that's not in our habit idea, and it's not in priority queuing, but maybe there's a way to kind of splice that in or to find a domain in which you think the refractory period may, you know, may bend the curve in some interesting way.\n\n1:16:43.6 SC: And so the burstiness of our habits, is that something you can also tie into the neuroscience? You can sort of say, \"Oh, it's this circuit in the brain that is responsible.\""}, {"type": "text", "content": "1:16:53.2 CC: We have not done that yet. I am not great on theoretical neuroscience. One of my skills I immodestly think is there's a lot of... I know a little bit about a lot of things, but there's some things I know nothing about, like consciousness, international taxation, and spike trains. But I know who knows.\n\n1:17:15.5 SC: Right.\n\n1:17:17.1 CC: And also the Neural Autopilot model as we kind of wrote it down, we've used it to explain some things like consumer choices, the gym, posting on social media, hasn't been like deeply tested in the way I would like from, in neuroscience. There are a lot of people who studied habit going back quite a few years. And I think the idea that the, that habit and more deliberative choice are fundamentally dissociated is well established. For example, in rodents, goal-directed... What we call goal-directed or deliberative or optimizing activity is in dorsomedial striatum, habit in dorsolateral striatum, and as well as, again, that's part of a circuit. It's not that habits are only there, right? That circuit connects to motor circuits and things. And there's some beautiful work by John O'Doherty, my colleague, and Bernard Balleine in Australia, where they actually... They lesion different parts of the brain. And you can either get rid of habits that rats have by lesioning the habit area, or you can get rid of goal-directed actions and make them more habitual by lesioning the other area. So the... You know, you can kind of turn on and off, at least in mice, you know, at least in rodents doing very simple, you know, pressing of buttons or swimming, they have these things where they swim through water and they climb onto a ramp, a platform. And so they're extremely simple tasks. They're a little bit like things humans do, like your ritual for making coffee in the morning, or you get in the car and you either, do you reach for the seatbelt first or do you turn the car on first? You know, there are sort of chained motor sequences that are similar, but a lot of how we're thinking about a habit is much more higher scale."}, {"type": "text", "content": "1:19:07.8 SC: I remember I walk to the office every day. My house is within walking distance. And one day I decided to walk a different route, and halfway through I realized I had no idea where I was.\n\n1:19:18.6 CC: Yeah, exactly. It's like muscle memory, right?\n\n1:19:22.4 SC: Didn't know what I was doing. Yeah.\n\n1:19:23.1 CC: Procedural memory, muscle memory. Yeah, yeah. In fact, this is... I'm so glad you brought that up. So one bit of evidence for habits is what are called action slips. Right? So, for example, if you drive to work a certain way and then turns out the Olympics are in town, most people forget, they start driving to work and all of a sudden they're stuck. So that's called an action slip. And my favorite example of this I have on my slide deck, which is I was flying to Philadelphia to give a talk about habits, and the flight attendant said, \"What would you like?\" and gave me a snack, like a little cookie. \"What would you like to drink?\" I said, \"I'd like a Sprite Zero with no ice. Sprite Zero, please, no ice.\" So she plops down ice, and then I put my napkin on top of the cookie and she said, \"By the way, did you get your cookie?\" So it was a double action slip, right, all within four seconds. I'm getting my ice and she forgot about the cookie."}, {"type": "text", "content": "1:19:53.7 SC: Autopilot.\n\n1:20:23.1 CC: Yeah, right, because she's on autopilot.\n\n1:20:25.6 SC: I mean, I guess this is... Maybe this is a good roundup final question here, even though it's completely unfair for you. Are there at least hypothetically ways we could go into the brain and change some of these things? Are there therapies, drugs, whatever? Can we become better at k-level thinking or less temporal discounting or whatever it would be? Is that a frontier?\n\n1:20:55.3 CC: Yes. Oh, yeah, no, absolutely. I mean, if you think that's an unfair question, you should see my colleagues from the past 40 years.\n\n[laughter]\n\n1:21:02.8 SC: I can think of more unfair ones, but I'm trying to be nice.\n\n1:21:04.7 CC: Yeah, that's not an unfair question. That's the idea of an unfair question, come on. Yes. So I'll give you a couple of examples. We worked on one study, but it wasn't really a knockout study, so I don't want to mention it, and it wasn't like a hard, conclusive result I would bet the farm on. So there's something called optogenetics, and one of my brilliant colleagues here, Viviana Gradinaru, works on that, and she was a student of Karl Deisseroth, who kind of invented it and is going to win a Nobel Prize in medicine any day now. And the idea is you can inject a virus into the brain, certain kinds of viruses that are light sensitive. And so in one experiment, there are cells in the brain that are encoding reward prediction errors. These are essentially the cells that they're in rats that Schultz, Dayan, and Montague discovered in 1997 in La Jolla. And so what happens is you train the rat to press a lever and it either gets a drink reward or not. And so you train it to press, and every time it gets a drink reward, you can see this little reward prediction error, like, \"Oh, that was good. Oh, that was good. That was good.\" And so it learns that if you press the lever, you get something good. There's another lever that they press, and sometimes it gets salty water, which it hates. So it learns, \"I'm not gonna press that.\" Then what you do is you optogenetically upregulate the reward prediction error neurons. I call this neural gaslighting. See what you think."}, {"type": "text", "content": "1:22:35.4 SC: I like that.\n\n1:22:36.2 CC: You upregulate, so when it presses the lever and gets salty water, the brain neurons say, \"That was great,\" because you've hijacked, you've convinced the brain that salty water is really good because you know where these reward prediction error neurons are.\n\n1:22:52.5 SC: Yeah.\n\n1:22:53.6 CC: And it doesn't get overridden by the sensory system. So you can trick the rat's brain into thinking it likes something that it really doesn't. And you can tell it doesn't because when you look at its face and so on, it drinks the salty water, it's like, \"Brain, what were you doing telling me to drink that salty water? You're gaslighting me,\" right? I think I invented the term neural gaslighting, which is a good one."}, {"type": "text", "content": "1:23:15.9 SC: Which is a good one. Yeah.\n\n1:23:16.8 CC: And here's another one that's a little less practical and interesting, but it just tells you something cool. So my academic granddaughter, Lucia Zhu, is a professor in Beijing, and she has a paper that exploits the fact that there are certain times when you're sleeping in which you can say things to people or play a sound, and people remember them and it will affect behavior.\n\n1:23:20.6 SC: Okay.\n\n1:23:47.6 CC: I can't remember the acronym for this. Sorry, listeners. Anyway, and so what she does is... But it has to be, and you have to really know a lot about sleep, and you have to do it in a sleep lab or with some equipment that knows when there's this sweet spot, because otherwise they'll wake up, or if they're in deep sleep, they won't encode it. And remember again, many of your readers will know, but when you're sleeping, the brain's not completely comatose."}, {"type": "text", "content": "1:23:59.8 SC: Right.\n\n1:24:12.1 CC: There's neural replay, dreaming, obviously. Dreaming is like medicine for your brain. There's kind of defragging and interesting things happening. So the brain is doing something, it's just you're not conscious. Anyway, so what she does is she has people value different snack foods, similar to the study we talked about, Snickers, potato chips, yogurt. And then let's say they value a food for $3. Then she whispers the name of the food when they're sleeping. \"Snickers. Snickers. Snickers. Snickers.\" And then they wake up and she says, \"Did you hear anything when you were sleeping?\" \"Well, no, I was sleeping.\" But they value the foods that were treated, that were whispered about, and of course you control, so you whisper about all the different foods and compare when you weren't whispering, blah, blah, blah, they value them about 10% more. So I don't think this is a marketing technique. Well, who knows? Right? But it is an anecdotal answer to your question. Once we know something about circuitry, are there techniques to upregulate or train? And just to wind up, and also as you probably know, there's a lot of work on deep brain stimulation in Parkinson's. And there's a lot of interest in what's called transcranial magnetic stimulation, or TMS, which is low voltage current outside of the brain, but close, to treat depression and things like that. So lots of therapeutics are working along these lines. They just haven't been brought to economic decisions. I think there's a good chance if we worked on it, we could get people to be more patient. But it's one thing to do it in a short run of one experiment for one hour, and it's another thing to do it maybe at a sweet spot, like when children are three or four, and preferably you don't have to come in a lab and be in a scanner or have be whispering at night or any of those things. They're just proofs of concept, right?"}, {"type": "text", "content": "1:26:21.2 SC: Make people more virtuous?\n\n1:26:24.1 CC: Yes, my colleagues did that.\n\n1:26:25.7 SC: Okay.\n\n1:26:27.2 CC: So Alex Smith at Virginia Tech and Sheryl Ball used transcranial direct current stimulation, tDCS, to TPJ, the area we talked about for mentalizing. And they basically had people do these tasks where you have some money, you can keep some or give some to a charity. And then they vary the trade-offs.\n\n1:26:37.7 SC: Yeah.\n\n1:26:48.3 CC: Like, the charity gets very little, you get a lot; you get very little, charity gets a lot. And they test the rationality of how consistent they are and also whether they give more to the charity. And when you upregulate right temporal parietal junction, they're a little bit more generous and a little bit more rational. They're more consistent."}, {"type": "text", "content": "1:27:07.5 SC: You know what? I'm gonna call it a day there because that was an optimistic place.\n\n1:27:13.5 CC: Yes, that's a knockout.\n\n1:27:14.0 SC: Yeah, you scared me a little bit 10 minutes ago, but now you're making me think that there's an optimistic path forward in addition to all the wonderful science and economics and everything. So, Colin Camerer, thanks very much for being on the Mindscape podcast.\n\n1:27:26.7 CC: That was a fantastic... My pleasure, Sean.\n\n1:27:28.7 SC: Thanks.\n\n[music]"}], "text_post": false}, {"id": "88032bd174f98b92", "title": "Follow the Money", "url": "https://www.netinterest.co/p/follow-the-money-ece", "source": "Net Interest", "tag": "financial", "published_at": "2026-10-30T17:48:55+00:00", "panels": [{"type": "text", "content": "Something a bit different this week. I’ve been doing a lot of presenting recently, so I thought I’d share my materials with paid subscribers. Net Interest has been running for over six years now, and with 300+ issues, the archive has become a trove of analysis and commentary on the financial sector. My AI agents had a field day with it. They sorted every post by theme, tracked how the focus has shifted over time and pulled the key data and quotes into one place. Then they went back to the original sources to bring the numbers up to date.\n\nThe result is the deck attached below. It elaborates on seven themes:\n\nAI is a financing story. Long-time readers know I like to find the bank inside every company. AI has a whole ecosystem of them: labs like Anthropic that commit long to earn short, lessors like CoreWeave that rely on the capital markets for their business model, and guarantors like Nvidia, the Fannie/Freddie of compute."}, {"type": "text", "content": "Private markets are the new public markets. Built for patient institutional capital, private markets are increasingly underpinned by retail savers, life insurers and banks. New pockets of demand grow the pie, but they also introduce new risks.\n\nBanks and the credit cycle. Consumer sentiment hit its lowest level on record this year, yet banks keep lending and credit remains benign.\n\nAI and the work of finance. Financial services companies thrive on customer inattention. Could AI agents, with their infinite attention spans, be their downfall?\n\nMarkets for everyone. Retail investors used to be dismissed as the dumb money. Now they’re a structural force, from index options in India to prediction markets in the US. Exchanges are racing to keep up."}, {"type": "text", "content": "The battleground in payments. Payments has emerged as one of the most competitive segments of finance. Upstarts are coming for the incumbents that once tried to buy them, tech giants are deciding how far into finance they want to go, and stablecoins promise to rebuild the rails from scratch.\n\nPeople, risk and succession. For an industry that runs on numbers, finance still depends heavily on individuals. Who takes over from Jamie Dimon, how Ken Griffin manufactures talent, and why the biggest asset managers prefer to stay private all come down to people.\n\nEach section draws on posts from the archive, and there’s a reading list at the end if you want to go deeper. Feel free to use it – and let me know what you think."}, {"type": "text", "content": "Reminder: I’ll be attending the TomorrowX Summit in Austin in November, followed by Fintech Nerdcon in San Diego. If you’re at either, please do get in touch.\n\nRead more"}], "text_post": false}, {"id": "ab9b7d3d73e8bfa4", "title": "Rehman on Immortal Souls", "url": "https://edwardfeser.blogspot.com/2026/10/rehman-on-immortal-souls.html", "source": "Edward Feser's Blog", "tag": "philosophy", "published_at": "2026-10-27T18:49:48+00:00", "panels": [{"type": "snippet", "content": "In the\nlatest issue of the American Catholic\nPhilosophical Quarterly , philosopher Rashad Rehman kindly\nreviews my book Immortal\nSouls: A Treatise on Human Nature . \nFrom the review: Immortal Souls … is a major philosophical\ncontribution to the metaphysics of human nature and the praeambula fidei … Feser’s work merits the highest praise… Impressively\norganized, thematically systematized, and distinctively philosophical, [its]\ndepth, scope, and contributions are manifest even to the most vociferously hostile\nopponent… [It] will remain a timeless contribution to the revival of\n[Aristotelian-Thom", "read_more_url": "https://edwardfeser.blogspot.com/2026/10/rehman-on-immortal-souls.html", "read_more_source": "Edward Feser's Blog"}], "text_post": false}, {"id": "0427acc6139f15fd", "title": "How Canada is Decoupling From the US", "url": "https://www.apricitas.io/p/how-canada-is-decoupling-from-the", "source": "Apricitas Economics", "tag": "financial", "published_at": "2026-10-25T17:30:53+00:00", "panels": [{"type": "text", "content": "Thanks for reading! If you haven’t subscribed, please click the button below:\n\nSubscribe now\n\nBy subscribing, you’ll join over 85,000 people who read Apricitas!"}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!HS1d!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F6aac596e-87a6-41a7-9653-794f5cfd37e5_2886x1843.png", "alt": ""}, {"type": "text", "content": "Canada is increasingly decoupling from the US economy—the share of Canadian trade flows headed to the US has fallen to the lowest level in more than 30 years, with both US import and export shares dropping significantly since 2025. Trump’s trade war, consumer boycotts, and a formal Canadian government push to boost non-US trade have all reduced the country’s economic reliance on its southern neighbor.\n\nWhen Donald Trump began his second term, he almost immediately began an unprecedented campaign to break the longstanding US-Canada trade relationship. Canada was among the first countries he hit with major tariffs , which, coupled with endless threats of annexation and clandestine meetings with separatist groups , forced the government in Ottawa to stop seeing America as a reliable economic partner."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!NX2U!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2Fd8401965-a5e3-40c6-b974-2bea27637673_2886x1843.png", "alt": ""}, {"type": "text", "content": "In 2025, Canadian Prime Minister Mark Carney set a goal of doubling the country’s non-US exports over the next decade , saying that “many of our former strengths based on close ties to America have become our vulnerabilities.” Today, he is already halfway to achieving that goal, with Canada’s non-US exports up more than 40% over the last twelve months alone. Yet this still leaves America as far-and-away the country’s largest trading partner, 8 times as big as the second-place EU. The structural factors that made the US-Canada trade relationship so valuable also make significant decoupling painful and difficult."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!vtGq!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0b3feaa6-15a7-45e0-ba5d-9097b829f9c3_2886x1843.png", "alt": ""}, {"type": "text", "content": "Canada has a much smaller population and lower income than the US, making its total economy comparable in size to individual states like New York or Texas. Most major Canadian cities are physically closer and have stronger legacy infrastructure connections to their American neighbors than to other cities in Canada, meaning almost every major Canadian province trades more with the US than with the rest of Canada, let alone with other overseas markets. Canada’s economy has already grown significantly slower than America’s in the half-decade since COVID . Canada’s non-US exports have been boosted by the twin tailwinds of rising energy and gold prices, a lucky break outside the government’s control and unlikely to be replicated. Achieving further decoupling would require additional trade-offs between long-term security and short-term economic growth."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!5f0R!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F9cb8fcd2-0147-4188-b193-3e6bb451e9dc_2886x1843.png", "alt": ""}, {"type": "text", "content": "In the Bank of Canada’s regular business outlook survey, more than 20% of Canadian businesses are planning to or have already restructured supply chains due to the trade war, and another 10% are in some stage of diversifying their export markets. Yet the survey also makes the economic costs obvious—those reducing Canadian operations outnumber those expanding operations nearly 2 to 1, and nearly 13% of businesses are reducing investment in Canada or redirecting it abroad.\n\nThis quarter’s survey also occurred just as Trump hit another $20B worth of Canadian goods with tariffs while threatening to double the tariffs on Canadian vehicles at the start of 2027. This gives a unique opportunity to measure the tariffs’ impact on Canadian business sentiment by comparing results immediately before and after the executive orders—in total, the new tariffs and threats knocked nearly 4 percentage points off export growth expectations, added half a percentage point to inflation expectations, and caused 25% of firms to revise down their domestic investment."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!3fOx!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F8f21aef6-5d1a-49fc-a9f6-0f3c808896c1_2886x1843.png", "alt": ""}, {"type": "text", "content": "However, the Canadian economy may already have weathered the worst of the storm—the initial tariff shock significantly hurt Canadian industry, especially in the manufacturing sector, but growth has already begun to rebound. After completely stagnating in 2025, Canadian GDP has increased 1.4% in 2026, with real manufacturing output up 3.5%, construction up 1.8%, and energy up 1.3%.\n\nThe steps already taken to decouple from the US economy mean Trump’s tariffs and threats carry less teeth than they would have even a couple of years ago. While Canada cannot fully escape America’s economic gravity, decoupling has protected the country from the worst impacts of tariffs and increased its leverage in trade negotiations."}, {"type": "text", "content": "Subscribe now\n\nEarlier this month, I visited Windsor and Toronto as part of an international learning trip organized by the Friedrich Ebert Foundation , rounding out a series of trips to Toronto, Montreal, and Vancouver I’ve taken over the last year. In speaking to Canadian politicians, union leaders, business executives, and members of the public, the overwhelming theme was just how deeply Canadian trust in America has been severed.\n\nNobody believes Trump will abide by the deals he’s made, and nobody believes any future administration will make the changes necessary to prevent the resurgence of Trump-like nationalism. Canadians are taking these threats extremely seriously—I met political staffers who took burner phones into the US to guard against espionage, businesses who were gaming out how they would respond to being cut off from US AI models, and plenty of consumers who were going out of their way to avoid American products. In another recent Bank of Canada survey, 46% of Canadians believe the most serious effects of the trade war are still to come, compared to 27% who think the worst is already behind them."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!BRWG!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0277aa6c-50b9-4d28-95a6-125355ea8a7c_2886x1843.png", "alt": ""}, {"type": "text", "content": "Perhaps nothing encapsulates the Canadian public’s anger more than the rapid drop in tourism to the US—personal spending on visits to America has dropped 24% compared to 2024, while spending on other overseas destinations has a mirrored 24% increase. Much of the drop in US-Canada trade comes from similar boycott dynamics that extend to cars, alcohol, groceries, electronics, and more."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!XgXr!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F241934f6-2b0b-41e7-bcfc-58c7e8abe057_2886x1843.png", "alt": ""}, {"type": "text", "content": "On the export side, the vast majority of Canadian goods still enter the US tariff-free, either because they fall under the blanket sectoral exemptions (such as energy, tech, or agriculture) or because they fall under specific country-level exemptions for USMCA-compliant goods. Yet Canada has arguably been hit hardest by the sectoral tariffs placed on goods of all countries, because those targeted industries make up a large share of Canadian manufacturing and are the sectors most intertwined with the US. Motor vehicles, forestry & paper products, and metal & mineral products are all affected by these sectoral tariffs, so it’s not a coincidence they represent three of the four sectors with the largest drop in Canadian exports to the US."}, {"type": "text", "content": "On the import side, the $2B drop in Canadian purchases of American consumer goods (even without adjusting for substantial inflation) highlights how impactful boycotts and retaliatory tariffs have been. The drop in motor vehicle & parts imports reflects similar dynamics, plus the more damaging supply chain decoupling occurring as some Canadian factories get cut out of US production flows. Perhaps most worrying for Canadians is the reduction in industrial machinery and equipment imports, which are downstream of painful declines in domestic investment just when the country needs to retool its factories the most."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!4GPU!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F7c1f1bc8-bc68-4047-9229-430aadb328a8_2886x1843.png", "alt": ""}, {"type": "text", "content": "The flipside of Canada’s shrinking trade with the US is its growing trade with the rest of the world. Among non-US exports, natural resources lead the way, with metal and mineral exports skyrocketing 125% since 2024, and non-US energy exports also hitting record highs by rising 80%. Even outside those sectors, the story is largely one of healthy broad-based growth—overseas exports of metal ores are up 40%, exports of consumer goods are up 15%, exports of food are up 14%, and exports of aircraft and parts are up 11%."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!a2QN!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F98bb5b64-a4c1-4883-99a2-2226710e1caf_2886x1843.png", "alt": ""}, {"type": "text", "content": "Much of the rise in metal and mineral exports consists of Canada’s gold exports to vaults in the UK, which now completely dominate British-Canadian trade flows. Canada has a much more robust gold mining and refining industry than most countries, so it has benefitted tremendously from the boom in gold demand since 2024. Still, this growth should be partially discounted because much of it is price inflation and reexport trends rather than direct growth in economic output."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!ne3I!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F502e83c7-2322-4e31-9c1a-337b9a274591_2886x1843.png", "alt": ""}, {"type": "text", "content": "Stepping back, that surge in gold exports has allowed the UK to leapfrog over China and the EU to become Canada’s new 2nd-largest export destination. Yet even excluding the rapid increase in British trade, Canada’s non-US exports are still at a record high. Exports to China are up 52%, exports to the EU are up 42%, and exports to other countries are up 18%."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!n_vr!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F4fe5974e-e371-4cab-9d03-85708224c29f_2886x1843.png", "alt": ""}, {"type": "text", "content": "With regard to China, Canadian exports of energy, raw ores, and minerals have more than offset a decline in agricultural exports. Rising energy prices amidst the American war with Iran have forced China to seek out other fossil-fuel providers, and ravenous global demand for industrial inputs has helped redirect Canadian metal production away from the US. Canadian agricultural exports have not recovered from the Chinese counter-tariffs placed when Canada taxed Chinese EVs during the Biden administration , yet an agreement signed earlier this year has already undone some of the export losses. Overall, Canada’s export diversification has not been wholly reliant on one product or one partner."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!0Zda!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F434da574-9afd-44e8-a002-8b8978753b04_2886x1843.png", "alt": ""}, {"type": "text", "content": "On the import front, the changes have been less dramatic—Canada was already less reliant on America as an import source than as an export destination, and so the trade war has only driven gradual broad-based increases in Canadian purchases of non-American goods. Even Canada’s much-publicized decision to suspend its 100% tariff on Chinese EVs and instead implement a 49k-vehicle quota has been less impactful than expected, with fewer than 16k slots used so far . The trend is still clear, though, as Canada’s import reliance on the US continues declining to new lows."}, {"type": "image", "src": "https://substackcdn.com/image/fetch/$s_!YG_e!,w_1456,c_limit,f_auto,q_auto:good,fl_progressive:steep/https%3A%2F%2Fsubstack-post-media.s3.amazonaws.com%2Fpublic%2Fimages%2F0985e951-5139-4d05-9e41-45a018393f35_2886x1843.png", "alt": ""}, {"type": "text", "content": "Shifting further away from the United States will require a long-term reorienting of Canadian infrastructure—hence the opening of the Major Projects Office to fast-track the pipelines, ports, and power lines needed to get Canadian goods to overseas markets. Designating the Pacific Link pipeline, which will connect more Albertan oil to Canada’s west coast ports, as the office’s first national interest project was an obvious signal that the government is serious about prioritizing export diversification. Real Canadian investment in this kind of transportation and utility infrastructure is now continually hitting new record highs, already up 42% from this time in 2024.\n\nBut so far the Major Projects Office has been fighting a losing battle against the overall downturn in the business environment—Canadian investment in factories, mines, and plants has declined significantly across Carney’s tenure, counteracting the rise in infrastructure construction and leaving overall industrial investment flat. To succeed in the difficult economic work of decoupling, Canada will have to reinvigorate its manufacturing sector in addition to renewing its infrastructure."}, {"type": "text", "content": "Subscribe now\n\nWhen Trump first began his trade war against Canada and Mexico, I wrote that the two countries could “outlast him politically even if they cannot economically” as tariffs would likely cost Trump support while causing voters to rally around Carney & Sheinbaum. That’s certainly been borne out, as Trump has been forced to ease Canada tariffs several times for political reasons, most recently exempting several agricultural supplies in a last-ditch bid to save the Senate campaign of Maine’s Susan Collins . Meanwhile, Mark Carney is more popular than ever.\n\nThis should not be surprising, as the majority of the economic costs of tariffs are paid by the country imposing them. American tariffs on Canada were particularly counterproductive because so many Canadian goods are intermediate inputs for American factories, and Canada is one of the few countries where the US actually ran a surplus in manufactured goods. The damage on the American side of the border has been larger, even if Canada’s situation is more existential because its economy is proportionally smaller."}, {"type": "text", "content": "If Democrats do take control of the House and Senate in the midterm elections next week, Trump will likely refocus on trade wars and foreign policy given his reduced power over domestic affairs. The administration has constantly talked about “renegotiation” of the USMCA trade agreement signed in Trump’s first term but has repeatedly put it off; they will certainly have to address it during their last two years in power. When they do, Canadians will be thankful they aren’t quite as dependent on America as they used to be.\n\nThanks for reading! To receive more new posts on economic data analysis, consider subscribing!"}], "text_post": false}, {"id": "5aa675242051ef18", "title": "An Argument for Vastly Many Observers Smaller than a Proton", "url": "http://schwitzsplinters.blogspot.com/2026/10/an-argument-for-vastly-many-observers.html", "source": "The Splintered Mind", "tag": "philosophy", "published_at": "2026-10-25T17:29:45+00:00", "panels": [{"type": "snippet", "content": "Here's an argument that I'm sure will give my philosopher of physics collaborator Jacob Barandes the fits.  The conclusion will be that there are vastly many complex structures smaller than a proton, right here in our region of spacetime, populated by vastly many scientific and philosophical observers.  Look at that drop of water running from the faucet to the drain.  Within it are many tiny people, living many tin
